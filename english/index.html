 secs.push({t:'같은 소재 ('+(TOPIC[o.t]||'')+')',items:same.sort(()=>Math.random()-.5).slice(0,8).map(x=>x.w)});
 $('#view').innerHTML=`<p class="note">한 단어에서 시작해, 이어진 단어를 눌러 꼬리에 꼬리를 물고 익혀요. 위의 이동 경로를 누르면 되돌아가요.</p>
 <div class="chips" id="trl">${TR.path.slice(-12).map((x,i,a)=>`<button class="chip en${i===a.length-1?' on':''}" data-i="${TR.path.length-a.length+i}">${x}</button>`).join('')}</div>
 <div class="card"><div class="big" style="font-size:1.9rem">${ptHtml(o)}</div>${ipaHtml(o)}<div style="font-weight:700">${esc(o.pos)}. ${esc(o.ko)} ${lvTag(o)}</div><div class="ex"><div class="e">${hl(o,o.ex[0][0])}</div><div class="k">${esc(o.ex[0][1])}</div>${o.ex[0][2]?`<div class="src">출처 · ${esc(o.ex[0][2])}</div>`:''}</div>
 <div class="row" style="margin-top:10px"><button class="btn ${K.has(w)?'s':'ok'}" id="tk">${K.has(w)?'✓ 외웠어요 (취소)':'외웠어요'}</button><button class="btn s" id="td">자세히</button><button class="btn s" id="tb2" ${TR.path.length<2?'disabled':''}>← 이전 단어</button><button class="btn s" id="tr">다른 단어로 시작</button></div></div>
 ${secs.filter(s=>s.items.length).map(s=>`<div class="sec"><h3>${esc(s.t)}</h3><div class="fam">${s.items.map(x=>`<button data-c="${x}"><b>${x}</b><small>${esc(M[x].ko.split(',')[0])}</small></button>`).join('')}</div></div>`).join('')}`;
 $('#trl').onclick=e=>{const b=e.target.closest('[data-i]');if(b){TR.path=TR.path.slice(0,+b.dataset.i+1);vTrail()}};
 $('#tk').onclick=()=>{toggle(w);vTrail()};$('#td').onclick=()=>openCard(w,[w]);$('#tb2').onclick=()=>{TR.path.pop();vTrail()};$('#tr').onclick=()=>{TR.path=[];vTrail()};
 $('#view').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{TR.path.push(b.dataset.c);vTrail();scrollTo(0,0)})}
// 퀴즈
let QS=null,QZ=null;
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function vQuiz(){if(QZ)return drawQ();
 const S=QS||{scope:'g1',mode:'w2k'};QS=S;
 $('#view').innerHTML=`<div class="card"><b>범위</b><div class="chips" id="qs"></div><b>문제 유형</b><div class="chips" id="qm"></div><button class="btn" id="go" style="width:100%;margin-top:10px">10문제 시작</button></div><p class="note">틀린 단어는 ‘헷갈려요’에 쌓여서 나중에 다시 풀 수 있어요.</p>`;
 const sc=[['g1','수능 기본'],['g2','수능 심화'],['g3','토익'],['g4','토플'],['up','안 외운 단어'],['wr','헷갈려요 ('+WR.size+')'],['all','전체']];
 const mo=[['w2k','영어 → 뜻'],['k2w','뜻 → 영어'],['cz','예문 빈칸'],['st','강세 위치']];
 const dr=()=>{$('#qs').innerHTML=sc.map(a=>`<button class="chip${S.scope===a[0]?' on':''}" data-v="${a[0]}">${a[1]}</button>`).join('');$('#qm').innerHTML=mo.map(a=>`<button class="chip${S.mode===a[0]?' on':''}" data-v="${a[0]}">${a[1]}</button>`).join('')};dr();
 $('#qs').onclick=e=>{const b=e.target.closest('.chip');if(b){S.scope=b.dataset.v;dr()}};$('#qm').onclick=e=>{const b=e.target.closest('.chip');if(b){S.mode=b.dataset.v;dr()}};
 $('#go').onclick=()=>{const s=S.scope;let p;if(s[0]==='g')p=W.filter(o=>o.g===+s[1]);else if(s==='up')p=W.filter(o=>!K.has(o.w));else if(s==='wr')p=W.filter(o=>WR.has(o.w));else p=W.slice();if(S.mode==='st')p=p.filter(o=>o.ns>=2);if(p.length<4){{const b=$('#go');b.textContent='단어가 부족해요 · 다른 범위를 골라 주세요';setTimeout(()=>{b.textContent='10문제 시작'},2200)}return}S.pool=p.map(o=>o.w);startQ()}}
function startQ(){QZ={q:sh(QS.pool).slice(0,10),i:0,ok:0,mode:QS.mode,ans:null};drawQ()}
function near(o,n){const c=[];famsOf(o).forEach(f=>f.mem.forEach(x=>x!==o.w&&c.push(x)));const rest=W.filter(x=>x.w!==o.w&&x.pos===o.pos).map(x=>x.w);const pool=sh([...new Set(c)]).slice(0,2).concat(sh(rest));return [...new Set(pool)].slice(0,n)}
function drawQ(){const z=QZ;if(z.i>=z.q.length){$('#view').innerHTML=`<div class="card q"><div class="qt">${z.ok/z.q.length>=.8?'🎉':'💪'}</div><div class="qs">${z.ok} / ${z.q.length} 정답</div><div class="row" style="justify-content:center"><button class="btn" id="ag">같은 범위 다시</button><button class="btn s" id="bk2">처음으로</button></div></div>`;$('#ag').onclick=startQ;$('#bk2').onclick=()=>{QZ=null;vQuiz()};return}
 const w=z.q[z.i],o=M[w],m=z.mode;let q='',opts,corr,cls='';
 if(m==='w2k'){q=`<div class="qt">${w}</div><div class="ipa note" style="font-size:.95rem">${esc(o.ipa)} <button class="say" data-say="${w}">🔊</button></div><p class="note">알맞은 뜻은?</p>`;corr=o.ko;opts=sh([corr,...near(o,3).map(x=>M[x].ko)])}
 else if(m==='k2w'){q=`<div class="qs">${esc(o.pos)}. ${esc(o.ko)}</div><p class="note">알맞은 영어 단어는?</p>`;corr=w;opts=sh([w,...near(o,3)]);cls='e'}
 else if(m==='cz'){const ex=o.ex[Math.random()*o.ex.length|0];q=`<div class="cz">${hl(o,ex[0],true)}</div><div class="note" style="text-align:left">${esc(ex[1])}</div><p class="note">빈칸에 알맞은 단어는?</p>`;corr=w;opts=sh([w,...near(o,3)]);cls='e'}
 else{q=`<div class="qt">${w}</div><button class="say" data-say="${w}">🔊</button><p class="note">강세(가장 강하게 읽는 음절)는 몇 번째일까요? (${o.ns}음절)</p>`;corr=String(o.str+1);opts=Array.from({length:Math.min(o.ns,4)},(_,i)=>String(i+1));cls=''}
 const lab=x=>m==='st'?x+'번째':x;
 $('#view').innerHTML=`<div class="stat"><span>${z.i+1} / ${z.q.length}</span><span>정답 ${z.ok}</span></div><div class="prog"><i style="width:${z.i/z.q.length*100}%"></i></div><div class="card q">${q}<div class="opts ${cls}" id="op">${opts.map(x=>`<button data-v="${esc(x)}">${esc(lab(x))}</button>`).join('')}</div><div id="fb"></div></div>`;
 $('#op').onclick=e=>{const b=e.target.closest('button');if(!b||z.ans!==null)return;const v=b.dataset.v,good=v===corr;z.ans=v;
  document.querySelectorAll('#op button').forEach(x=>{if(x.dataset.v===corr)x.classList.add('good');else if(x===b)x.classList.add('bad')});
  if(good)z.ok++;else WR.add(w);sv();
  $('#fb').innerHTML=`<div style="margin-top:10px">${good?'정답!':'정답: <b class="en">'+w+'</b> · '+esc(o.ko)}</div><div class="ipaline" style="justify-content:center">${o.syl.map(s=>`<span class="syl ${s[1]===1?'st':''}">${esc(s[0])}</span>`).join('')}</div><div class="row" style="justify-content:center;margin-top:8px"><button class="btn s" id="dt">자세히</button><button class="btn" id="nq">다음</button></div>`;
  $('#dt').onclick=()=>openCard(w,[w]);$('#nq').onclick=()=>{z.i++;z.ans=null;drawQ()}}}
// 발음·강세
function exBtn(x){const o=M[x[0]];return `<button ${o?`data-w="${x[0]}"`:`data-say="${x[0]}"`}>${x[0]}<small>${esc(x[1])}</small></button>`}
function vPron(){
 const sec=(t,b)=>`<div class="card rule"><h3 style="margin:0 0 6px;font-size:1rem">${t}</h3>${b}</div>`;
 $('#view').innerHTML=`<p class="note">영어는 단어마다 ‘가장 세게 읽는 음절’(강세)이 하나 있어요. 그 음절만 길고 크고 높게, 나머지는 약하게(ə) 읽어요. 아래 규칙은 발음 사전 데이터로 직접 세어 본 적중률이에요.</p>
 ${sec('1. 강세 기본 원칙',`<ul style="margin:0;padding-left:18px"><li>강세 음절: 길고 · 크고 · 높게 (IPA에서 <b>ˈ</b>)</li><li>강세 없는 음절의 모음은 약해져 <b class="ipa">ə</b>(어)가 돼요. 예) <b>a</b>bout /əˈbaʊt/</li><li>강세는 보통 <b>어근</b>에 있고, 접두사·접미사는 약해요. 예) re<b>CORD</b>, <b>HAP</b>py → <b>HAP</b>piness</li></ul>`)}
 ${sec('2. 접미사가 정하는 강세 (적중률)',`<div class="tw"><table><tr><th>끝부분</th><th>강세 위치</th><th>적중률</th><th>예</th></tr>${PR.suf.map(r=>`<tr><td class="en"><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td class="exs">${r[3].map(exBtn).join('')}</td></tr>`).join('')}</table></div><p class="note">적중률은 영어 핵심 단어 약 4,800개 중 해당 접미사 단어에서 센 결과예요.</p>`)}
 ${sec('3. 2음절 단어',`<p style="margin:0 0 6px">명사·형용사는 <b>앞</b>, 동사는 <b>뒤</b>에 강세가 오는 경우가 많아요. (명사 ${PR.two.n}% 앞 · 형용사 ${PR.two.a}% 앞 · 동사 ${PR.two.v}% 뒤)</p><div class="exs">${PR.twoex.map(exBtn).join('')}</div>`)}
 ${sec('4. 명사 ↔ 동사 강세 이동',`<p style="margin:0 0 6px">같은 철자인데 명사는 앞, 동사는 뒤에 강세를 줘요. 강세가 바뀌면 모음도 바뀌어요.</p><div class="tw"><table><tr><th>단어</th><th>명사</th><th>동사</th></tr>${PR.pair.map(r=>`<tr><td class="en"><b>${r[0]}</b></td><td class="ipa">${r[1]} <button class="say" data-say="${r[0]}" style="width:28px;height:28px;font-size:.75rem">🔊</button></td><td class="ipa">${r[2]}</td></tr>`).join('')}</table></div>`)}
 ${sec('5. 복합명사는 앞 단어에 강세',`<div class="exs">${PR.comp.map(exBtn).join('')}</div><p class="note">예) <b>AIR</b>port, <b>HEAD</b>phone. 형용사+명사 구(a <i>black BIRD</i>)는 뒤 단어를 세게 읽어서 복합명사(<b>BLACK</b>bird)와 구별돼요.</p>`)}
 ${sec('6. -ed 읽는 법 (3가지)',`<div class="tw"><table><tr><th>앞소리</th><th>-ed</th><th>예</th></tr>${PR.ed.map(r=>`<tr><td>${r[0]}</td><td class="ipa"><b>${r[1]}</b></td><td class="exs">${r[2].map(exBtn).join('')}</td></tr>`).join('')}</table></div>`)}
 ${sec('7. -s / -es 읽는 법 (3가지)',`<div class="tw"><table><tr><th>앞소리</th><th>-s</th><th>예</th></tr>${PR.s.map(r=>`<tr><td>${r[0]}</td><td class="ipa"><b>${r[1]}</b></td><td class="exs">${r[2].map(exBtn).join('')}</td></tr>`).join('')}</table></div>`)}
 ${sec('8. 모음: 끝의 e가 앞 모음을 길게 (Magic e)',`<div class="tw"><table><tr><th>짧게</th><th>길게 (+e)</th></tr>${PR.magic.map(r=>`<tr><td class="exs">${exBtn(r[0])}</td><td class="exs">${exBtn(r[1])}</td></tr>`).join('')}</table></div>`)}
 ${sec('9. 쓰지만 읽지 않는 글자 (묵음)',`<div class="exs">${PR.silent.map(r=>`<button data-say="${r[0]}">${r[0]}<small>${esc(r[1])}</small></button>`).join('')}</div>`)}
 ${sec('10. 한국인이 헷갈리는 소리 짝',`<div class="tw"><table><tr><th>구분</th><th>A</th><th>B</th></tr>${PR.min.map(r=>`<tr><td>${r[0]}</td><td class="exs">${exBtn(r[1])}</td><td class="exs">${exBtn(r[2])}</td></tr>`).join('')}</table></div><p class="note">/θ/ 는 혀끝을 이 사이에 살짝 물고, /f/ 는 윗니로 아랫입술을 물어요. /r/ 는 혀를 말고, /l/ 은 혀끝을 윗잇몸에 붙여요.</p>`)}`;
 $('#view').onclick=e=>{const b=e.target.closest('[data-w]');if(b)openCard(b.dataset.w,[b.dataset.w])}}
// 전체 단어
function vWords(){const q=(ST.q||'').toLowerCase();let L=W.filter(o=>(ST.lv===0||o.g===ST.lv-0)&&(!q||o.w.includes(q)||o.ko.includes(q)));
 $('#view').innerHTML=`<input type="search" id="sq" placeholder="영어 또는 한글 뜻 검색" value="${esc(ST.q||'')}"><div class="chips">${[['0','전체'],...[1,2,3,4].map(i=>[String(i),LG[i]])].map(a=>`<button class="chip${String(ST.lv)===a[0]?' on':''}" data-l="${a[0]}">${a[1]}</button>`).join('')}</div><p class="note">${L.length}단어 · 수준은 NGSL(수능 기본·심화), 토익 서비스 목록(토익), 학술 단어 목록(토플) 기준이에요.</p>${L.slice(0,150).map(wrow).join('')}${L.length>150?'<p class="note">검색으로 좁혀 보세요. (150개까지 표시)</p>':''}`;
 const s=$('#sq');s.oninput=()=>{ST.q=s.value;const p=s.selectionStart;vWords();const n=$('#sq');n.focus();n.setSelectionRange(p,p)};
 $('#view').onclick=e=>{const c=e.target.closest('[data-l]');if(c){ST.lv=+c.dataset.l;vWords();return}const b=e.target.closest('.wr');if(b)openCard(b.dataset.w,L.map(o=>o.w))}}
ld();render();
</script>
