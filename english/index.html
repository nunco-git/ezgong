 return p.map((t,i)=>{const surf=t.replace('*','').split('=')[0],key=t.replace('*','').split('=').pop();
  if(i<ri)return{k:'p1',s:surf,m:PRE[key]||''};if(i===ri)return{k:'r',s:surf,m:(F.find(f=>f.mem.includes(o.w)&&f.kind==='root')||{}).mean||''};return{k:'s1',s:surf,m:sufMean(surf)}})}
function ptHtml(o){const ps=partsOf(o);if(!ps)return esc(o.w);return ps.map(x=>`<span class="${x.k==='p1'?'p1':x.k==='r'?'r':'s1'}">${x.s}</span>`).join('<span style="color:var(--mu)">·</span>')}
function pairOf(w){return PR.pair.find(r=>r[0]===w)}
function pairBlock(w){const r=pairOf(w);if(!r)return '';return `<div class="pairbox"><b>명사와 동사의 발음이 달라요</b> <span class="note" style="margin:0">(IPA를 누르면 들려요)</span><div class="pb2"><button data-say="the ${w}"><small>명사 · 앞 강세</small><span class="ipa">${r[1]}</span><em>${esc(r[3])}</em></button><button data-say="to ${w}"><small>동사 · 뒤 강세</small><span class="ipa">${r[2]}</span><em>${esc(r[4])}</em></button></div></div>`}
function ipaHtml(o,big){return `<div class="ipaline">${o.syl.map((s,i)=>`<span class="syl ${s[1]===1?'st':s[1]===2?'sc':''}" data-say="${esc(o.w)}">${esc(s[0])}</span>`).join('')}<button class="say" data-say="${esc(o.w)}" aria-label="발음 듣기">🔊</button><span class="note" style="margin:0">${o.ns}음절 · 강세 ${o.str+1}번째</span></div>`}
function hl(o,en,cloze){const b=o.w.toLowerCase().replace(/(?<=[^aeiou])y$/,'').replace(/e$/,'');const re=new RegExp('\\b'+b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*','i');return esc(en).replace(re,m=>cloze?'<b>_____</b>':'<mark>'+m+'</mark>')}

function entryWords(x){const seen=new Set(),out=[];
 x[2].forEach(e=>{const lw=e[0].toLowerCase();if(seen.has(lw))return;seen.add(lw);const o=M[lw];out.push({w:e[0],ko:e[1],ipa:o?o.ipa:(e[2]||''),o})});
 const mem=[];x[5].forEach(id=>F[id].mem.forEach(w=>{if(!seen.has(w)){seen.add(w);mem.push(M[w])}}));
 mem.sort((a,b)=>a.g-b.g||a.w.length-b.w.length).forEach(o=>out.push({w:o.w,ko:o.ko,ipa:o.ipa,o}));return out}
function entryVoc(x){const s=[];x[5].forEach(id=>F[id].mem.forEach(w=>{if(!s.includes(w))s.push(w)}));return s}
function vFam(){const T=[['pre','접두사'],['suf','접미사'],['root','어근']];

 <div class="sort"><button data-m="type" class="${ST.am==='type'?'on':''}">비슷한 유형끼리</button><button data-m="abc" class="${ST.am==='abc'?'on':''}">알파벳 순</button></div>
 <p class="note">${ST.at==='pre'?'단어 <b>앞</b>에 붙어 뜻을 바꾸는 꼬리(접두사)예요.':ST.at==='suf'?'단어 <b>뒤</b>에 붙어 품사·뜻을 바꾸는 꼬리(접미사)예요.':'단어의 <b>뿌리</b>가 되는 뜻(어근)이에요.'} 같은 꼬리·뿌리를 가진 단어끼리 한 카드에 모았어요. 단어를 누르면 팝업, 발음기호를 누르면 발음이 들려요.</p>
 <input class="sq" id="aq" placeholder="찾기 (예: act, 반대, 사람)" value="${esc(ST.aq)}"><div id="al"></div>`;
 const key=x=>x[0].toLowerCase().replace(/[^a-z]/g,'');const cls=ST.at==='pre'?'p':ST.at==='suf'?'s':'r';
 const draw=()=>{const q=ST.aq.trim().toLowerCase();const base=AFX[ST.at];
  let L=base.map((x,i)=>[x,i]).filter(([x])=>!q||x[0].toLowerCase().includes(q)||x[1].includes(q)||x[3].includes(q)||entryWords(x).some(r=>r.w.toLowerCase().includes(q)||r.ko.includes(q)));
  const card=([x,i])=>{const ws=entryWords(x),vc=entryVoc(x),kn=vc.filter(w=>K.has(w)).length;
   return `<div class="ax"><span class="f ${cls}">${esc(x[0])}</span><span class="m">${esc(x[1])}</span>${x[3]?`<div class="tp">💡 ${esc(x[3])}</div>`:''}
   <div class="wls">${ws.map(r=>`<div class="wl${r.o&&K.has(r.w)?' k':''}"><span class="cw" data-pop="${esc(r.w)}" data-ko="${esc(r.ko)}" data-ipa="${esc(r.ipa)}">${esc(r.w)}</span>${r.ipa?`<span class="ip2" data-say="${esc(r.w)}">${esc(r.ipa)} 🔈</span>`:'<span class="ip2"></span>'}<span class="wk">${esc(r.ko)}</span>${r.o?lvTag(r.o):''}</div>`).join('')}</div>
   ${vc.length?`<div class="row" style="margin-top:8px"><button class="btn s" data-act="all" data-i="${i}" style="min-height:38px;font-size:.8rem">모두 외웠어요 (${kn}/${vc.length})</button><button class="btn s" data-act="quiz" data-i="${i}" style="min-height:38px;font-size:.8rem">퀴즈</button><button class="btn s" data-act="trail" data-i="${i}" style="min-height:38px;font-size:.8rem">꼬리잡기 →</button></div>`:''}</div>`};
  let h='';
  if(ST.am==='abc'){L=L.slice().sort((a,b)=>key(a[0])<key(b[0])?-1:key(a[0])>key(b[0])?1:0);let cur='';L.forEach(r=>{const c=key(r[0])[0].toUpperCase();if(c!==cur){cur=c;h+=`<div class="ah">${c}</div>`}h+=card(r)})}
  else{const gs=[];L.forEach(r=>{if(!gs.includes(r[0][4]))gs.push(r[0][4])});h=gs.map(g=>`<div class="ah">${esc(g)}</div>`+L.filter(r=>r[0][4]===g).map(card).join('')).join('')}
  $('#al').innerHTML=h||'<p class="note">찾는 항목이 없어요.</p>'};
 draw();
 $('#aq').oninput=e=>{ST.aq=e.target.value;draw()};
 $('#view').onclick=e=>{const b=e.target.closest('[data-a]');if(b){ST.at=b.dataset.a;vFam();return}const m=e.target.closest('[data-m]');if(m){ST.am=m.dataset.m;vFam();return}
  const c=e.target.closest('[data-act]');if(c){const x=AFX[ST.at][+c.dataset.i],vc=entryVoc(x);
   if(c.dataset.act==='all'){const all=vc.every(w=>K.has(w));vc.forEach(w=>toggle(w,!all));draw();upTop()}
   else if(c.dataset.act==='quiz'){ST.tab='quiz';QS={pool:vc.slice(),mode:'w2k'};sv();startQ()}
   else{TR.path=[vc[0]];ST.tab='trail';sv();render();scrollTo(0,0)}}}}

 ${sec('5. 복합명사는 앞 단어에 강세',`<div class="exs">${PR.comp.map(exBtn).join('')}</div><p class="note">예) <b>AIR</b>port, <b>HEAD</b>phone. 형용사+명사 구(a <i>black BIRD</i>)는 뒤 단어를 세게 읽어서 복합명사(<b>BLACK</b>bird)와 구별돼요.</p>`)}
 ${sec('6. -ed 읽는 법 (3가지)',`<div class="tw"><table><tr><th>앞소리</th><th>-ed</th><th>예</th></tr>${PR.ed.map(r=>`<tr><td>${r[0]}</td><td class="ipa"><b>${r[1]}</b></td><td class="exs">${r[2].map(exBtn).join('')}</td></tr>`).join('')}</table></div>`)}
