 const mo=[['w2k','영어 → 뜻'],['k2w','뜻 → 영어'],['cz','예문 빈칸'],['st','강세 위치']];

 ${sec('6. -ed 읽는 법 (3가지)',`<div class="tw"><table><tr><th>앞소리</th><th>-ed</th><th>예</th></tr>${PR.ed.map(r=>`<tr><td>${r[0]}</td><td class="ipa"><b>${r[1]}</b></td><td class="exs">${r[2].map(exBtn).join('')}</td></tr>`).join('')}</table></div>`)}

 $('#view').onclick=e=>{const b=e.target.closest('[data-w]');if(b)openCard(b.dataset.w,[b.dataset.w])}}
