구름빵|백희나는 1971년생 그림책 작가로 2020년 아스트리드 린드그렌 기념상을 받았어요.|비 오는 날 아침 홍비와 홍시는 엄마가 만든 구름 반죽 빵을 맛있게 먹어요. 구름빵을 먹은 아이들은 몸이 둥실 떠올라요. 아침에 늦어 허둥대던 아빠를 본 아이들은 구름빵 한 조각을 아빠께 드려요. 아빠는 구름빵을 먹고 하늘을 날아 회사에 제시간에 도착해요. 고양이 가족도 구름빵을 나눠 먹으며 즐거워해요.|2004년 출간됐어요. 인형을 만들어 사진으로 찍은 독특한 방식의 그림책이에요.
강아지똥|권정생은 1937년생 아동 문학가예요.|강아지가 눈 똥은 더럽다고 모두에게 놀림을 받아요. 참새, 흙덩이, 소달구지 아저씨마저 강아지똥을 피해요. 강아지똥은 자신이 쓸모없다고 슬퍼해요. 그러던 중 민들레 싹이 강아지똥에게 거름이 되어 줄 수 있느냐고 물어요. 강아지똥은 비에 녹아 땅속으로 스며들어 민들레꽃을 피우는 거름이 돼요.|1969년 발표된 동화예요. 쓸모없어 보이는 존재의 소중함을 이야기해요.
알사탕|백희나는 1971년생 그림책 작가예요.|혼자 노는 아이 동동이는 문방구에서 구슬 같은 알사탕을 사요. 알사탕을 입에 넣자 소파의 속마음이 들려요. 다른 알사탕을 먹으면 아빠의 잔소리 속에 숨은 마음이 들려요. 또 다른 알사탕은 돌아가신 할머니와의 이야기를 들려줘요. 동동이는 마음을 열고 친구에게 먼저 다가가요.|2017년 출간됐어요. 외로움과 소통을 다뤄요.
장수탕 선녀님|백희나는 1971년생 그림책 작가예요.|덕지는 엄마를 따라 오래된 동네 목욕탕 장수탕에 가요. 탕 안에서 덕지는 선녀라고 하는 할머니를 만나요. 선녀 할머니는 냉탕에서 놀고 힘이 다한 덕지를 이끌어 줘요. 덕지는 요구르트를 선녀님께 드리려고 해요. 이야기는 덕지가 선녀님과 함께 신나게 노는 장면으로 이어져요.|2012년 출간됐어요.
아주 배고픈 애벌레|에릭 칼은 1929년생 미국의 그림책 작가예요.|달빛 아래 작은 알에서 배고픈 애벌레가 나와요. 월요일에는 사과 한 개, 화요일에는 배 두 개를 먹고 날마다 먹는 양이 늘어요. 토요일에는 여러 가지 음식을 잔뜩 먹고 배가 아파요. 일요일에는 초록 잎을 먹고 건강해져 번데기가 돼요. 몇 주 뒤 애벌레는 아름다운 나비가 돼요.|1969년 출간됐어요. 숫자와 요일, 변태 과정을 배울 수 있어요.
해와 달이 된 오누이|작자 미상의 우리나라 전래 동화예요.|엄마가 떡을 팔고 돌아오다 호랑이에게 잡아먹혀요. 호랑이는 엄마로 변장해 집에 찾아와 오누이를 속이려 해요. 오누이는 눈치를 채고 나무 위로 올라가 하늘에 기도해요. 하늘에서 내려온 튼튼한 동아줄을 타고 올라가 오누이는 해와 달이 돼요. 호랑이는 썩은 동아줄을 타다 떨어져요.|전래 동화라 판본마다 조금씩 달라요.
팥죽 할멈과 호랑이|작자 미상의 우리나라 전래 동화예요.|팥밭을 매던 할머니에게 호랑이가 나타나 잡아먹겠다고 해요. 할머니는 팥죽을 쑤어 먹은 뒤에 잡아먹으라고 꾀를 내요. 울고 있는 할머니에게 알밤, 자라, 송곳, 맷돌, 멍석, 지게가 찾아와 도와주겠다고 해요. 호랑이가 오자 알밤은 튀어 눈을 찌르고 자라는 물려 해요. 마지막으로 지게가 호랑이를 지고 멀리 던져요.|전래 동화라 판본마다 조금씩 달라요.
흥부와 놀부|작자 미상의 우리나라 고전 이야기예요.|욕심 많은 놀부는 아버지의 재산을 혼자 차지하고 동생 흥부를 쫓아내요. 흥부는 가난하게 살면서도 착하게 지내요. 어느 날 흥부가 다친 제비의 다리를 고쳐 줘요. 이듬해 제비가 박씨를 물어다 주고 박에서는 금은보화가 나와요. 놀부는 흉내를 내다 박에서 도깨비와 똥 같은 벌을 받아요.|판소리 「흥부가」 등에서 전해진 이야기예요.
금도끼 은도끼|작자 미상의 옛이야기예요.|가난한 나무꾼이 연못가에서 나무를 하다 쇠도끼를 물에 빠뜨려요. 산신령이 나타나 금도끼와 은도끼를 보여 주지만 나무꾼은 자기 것이 아니라고 해요. 산신령은 정직한 나무꾼에게 금도끼와 은도끼까지 모두 선물로 줘요. 이 소식을 들은 욕심 많은 사람은 일부러 도끼를 빠뜨리고 거짓말을 해요. 산신령은 그에게 벌을 줘요.|『이솝 우화』와 우리나라에도 비슷한 이야기가 전해져요.
아기 돼지 삼형제|영국의 옛이야기예요.|아기 돼지 삼형제가 각자 집을 지어요. 첫째는 짚으로, 둘째는 나뭇가지로, 셋째는 벽돌로 집을 지어요. 늑대가 와서 입김으로 짚집과 나뭇집을 날려 버려요. 두 형은 벽돌집으로 도망쳐요. 늑대는 벽돌집을 무너뜨리지 못하고 굴뚝으로 들어가려다 혼쭐이 나요.|부지런히 튼튼하게 짓는 것의 중요성을 이야기해요.
미운 아기 오리|한스 크리스티안 안데르센은 1805년생 덴마크의 동화 작가예요.|어느 농장에서 크고 못생긴 아기 오리가 태어나요. 다른 오리들과 닭이 아기 오리를 놀리고 괴롭혀요. 아기 오리는 농장을 떠나 겨울을 힘들게 보내요. 봄이 되어 물에 비친 모습을 본 아기 오리는 자신이 아름다운 백조라는 것을 알게 돼요. 다른 백조들도 반갑게 맞이해 줘요.|1843년 발표됐어요.
빨간 모자|그림 형제는 독일의 형제 학자로 야코프(1785년생)와 빌헬름(1786년생)이에요.|빨간 모자를 쓴 소녀는 엄마의 심부름으로 숲 너머 할머니 댁에 가요. 숲에서 만난 늑대가 길을 묻고 먼저 할머니 댁에 가서 할머니를 삼켜요. 늑대는 할머니로 변장해 소녀를 기다려요. 소녀가 오자 늑대는 소녀도 잡아먹어요. 사냥꾼이 늑대의 배를 갈라 할머니와 소녀를 구해요.|판본이 여러 가지예요. 샤를 페로의 판본은 결말이 달라요.
헨젤과 그레텔|그림 형제는 독일의 형제 학자예요.|가난한 나무꾼 부부가 아이들을 숲에 버려요. 헨젤과 그레텔은 빵 부스러기를 떨어뜨려 길을 찾으려 하지만 새들이 먹어요. 숲속에서 두 아이는 과자로 만든 집을 발견해요. 그 집의 마녀는 헨젤을 가두고 살찌워 잡아먹으려 해요. 그레텔은 꾀를 내어 마녀를 오븐에 밀어 넣고 보물을 챙겨 집으로 돌아가요.|1812년 『그림 동화』에 실렸어요. 아이를 버리는 장면이 있어요.
토끼와 거북이|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|토끼는 느린 거북이를 놀려요. 화가 난 거북이가 달리기 시합을 제안해요. 시합이 시작되자 토끼는 빨리 달려 앞서가다 낮잠을 자요. 거북이는 쉬지 않고 천천히 걸어 결승선에 먼저 도착해요. 잠에서 깬 토끼는 뒤늦게 달려가지만 늦어요.|『이솝 우화』의 이야기예요. 꾸준함과 겸손의 교훈을 줘요.
개미와 베짱이|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|여름 내내 개미는 열심히 먹이를 모아 쌓아요. 베짱이는 노래하고 놀기만 해요. 겨울이 오자 베짱이는 먹을 것이 없어 개미를 찾아가요. 개미는 미리 준비하지 않은 베짱이를 나무라요. 판본에 따라 개미가 먹이를 나눠 주기도 해요.|『이솝 우화』의 이야기예요. 판본마다 결말이 달라요.
괴물들이 사는 나라|모리스 센닥은 1928년생 미국의 그림책 작가예요.|장난이 심한 맥스는 늑대 옷을 입고 소동을 피우다 저녁밥도 못 먹고 방에 갇혀요. 맥스의 방에서 숲이 자라나고 맥스는 배를 타고 괴물들이 사는 나라에 가요. 맥스는 괴물들을 다스리는 왕이 되어 신나게 놀아요. 하지만 외로워진 맥스는 집으로 돌아와요. 맥스의 방에는 따뜻한 저녁밥이 놓여 있어요.|1963년 출간됐고 1964년 칼데콧상을 받았어요.
무지개 물고기|마르쿠스 피스터는 1960년생 스위스의 그림책 작가예요.|바다 속에서 가장 아름다운 물고기 무지개 물고기는 반짝이는 비늘을 가졌어요. 다른 물고기가 함께 놀자고 하지만 무지개 물고기는 도도하게 거절해요. 외톨이가 된 무지개 물고기는 현명한 문어를 찾아가요. 문어는 비늘을 나눠 주라고 조언해요. 비늘을 나눠 주자 무지개 물고기는 친구들을 얻어 행복해져요.|1992년 출간됐어요. 나눔의 기쁨을 이야기해요.
곰 사냥을 떠나자|마이클 로젠은 1946년생 영국의 작가이고 헬린 옥슨버리는 1938년생 영국의 화가예요.|한 가족이 곰을 잡으러 길을 나서요. 가는 길에 풀밭, 강, 진흙, 숲, 눈보라를 만나 건너요. 마침내 동굴에 도착해 곰을 만나요. 놀란 가족은 온 길을 되돌아 도망쳐 집으로 돌아와요. 이불 속에 숨어 안전함을 느껴요.|1989년 출간됐어요. 반복되는 말과 소리 표현이 재미있어요.
돼지책|앤서니 브라운은 1946년생 영국의 그림책 작가예요.|피곳 씨 가족은 아빠와 두 아들이 집안일을 하나도 돕지 않고 엄마에게 모든 일을 맡겨요. 어느 날 엄마는 '너희들은 돼지야'라는 쪽지를 남기고 집을 나가요. 엄마가 사라지자 집은 엉망이 되고 아빠와 아들들은 돼지처럼 변해요. 가족은 엄마가 돌아오기를 바라요. 엄마가 돌아와 함께 집안일을 나누며 지내요.|1986년 출간됐어요. 집안일의 공평한 분담을 이야기해요.
안 돼, 데이빗!|데이빗 섀논은 1959년생 미국의 그림책 작가예요.|장난꾸러기 데이빗은 하루 종일 사고를 쳐요. 벽에 낙서를 하고 욕조에서 물을 넘치게 해요. 엄마는 '안 돼, 데이빗!' 하고 야단쳐요. 마지막에 야단맞은 데이빗은 울면서 엄마의 품에 안겨요. 엄마는 '그래도 사랑한단다'라고 말해요.|1998년 출간됐고 칼데콧 아너를 받았어요.
피터 래빗 이야기|베아트릭스 포터는 1866년생 영국의 작가이자 화가예요.|엄마 토끼는 피터 래빗과 누나들에게 맥그리거 씨 정원에 가지 말라고 해요. 호기심 많은 피터는 정원에 들어가 채소를 먹어요. 맥그리거 씨에게 들켜 쫓기다 파란 재킷과 신발을 잃어버려요. 겨우 도망쳐 집으로 돌아온 피터는 지쳐서 쓰러져요. 엄마는 카밀레 차를 먹이고 얌전한 누나들은 맛있는 저녁을 먹어요.|1902년 출간됐어요.
프레드릭|레오 리오니는 1910년생 네덜란드 출신의 그림책 작가예요.|들쥐 가족은 겨울을 대비해 열심히 먹이를 모아요. 프레드릭은 일하지 않고 햇살과 색깔, 이야기를 모으고 있다고 해요. 겨울이 오고 먹이가 떨어지자 쥐들은 프레드릭에게 모아 둔 것을 이야기해 달라고 해요. 프레드릭은 햇살, 색깔, 이야기로 쥐들의 마음을 따뜻하게 해 줘요. 쥐들은 프레드릭을 시인이라 불러요.|1967년 출간됐어요.
으뜸 헤엄이|레오 리오니는 1910년생 네덜란드 출신의 그림책 작가예요.|빨간 물고기들 사이에 검은 물고기 한 마리 헤엄이가 살아요. 어느 날 참치가 나타나 빨간 물고기들을 모두 잡아먹고 헤엄이만 살아남아요. 헤엄이는 외롭게 바다를 헤엄치며 아름다운 것들을 봐요. 새 친구들을 만난 헤엄이는 작은 물고기들이 큰 물고기를 쫓아내는 방법을 생각해 내요. 물고기들은 하나가 되어 큰 물고기처럼 헤엄치고 헤엄이는 눈이 돼요.|1963년 출간됐어요.
파랑이와 노랑이|레오 리오니는 1910년생 네덜란드 출신의 그림책 작가예요.|파랑이와 노랑이는 서로 아주 친한 친구예요. 둘은 엄마 아빠가 보이지 않아 찾으러 다녀요. 찾지 못하고 서로 꼭 껴안자 초록이 돼요. 부모는 초록이 된 아이들을 알아보지 못해요. 슬퍼서 눈물을 흘리자 다시 파랑과 노랑으로 돌아오고 부모는 둘 모두를 안아 줘요.|1959년 출간됐어요. 색의 섞임을 이용한 그림책이에요.
아빠, 달님을 따 주세요|에릭 칼은 1929년생 미국의 그림책 작가예요.|모니카는 아빠에게 달을 따 달라고 졸라요. 아빠는 아주 긴 사다리를 가져와 달에 올라가요. 달이 너무 커서 아빠는 달을 작게 줄어들 때까지 기다려요. 모니카는 작아진 달을 가지고 놀아요. 달이 다시 점점 커져 보름달이 돼요.|1986년 출간됐어요. 달의 변화를 알려 줘요.
은혜 갚은 까치|작자 미상의 우리나라 전래 동화예요.|한 선비가 길을 가다 까치 새끼를 잡아먹으려는 구렁이를 활로 쏘아 새끼들을 구해요. 날이 저물어 한 집에서 묵는데 구렁이가 나타나 선비를 칭칭 감아요. 구렁이는 종이 울리면 살려 주겠다고 해요. 그때 어디선가 종이 세 번 울려요. 다음 날 보니 어미 까치가 머리로 종을 쳐 죽어 있었어요.|전래 동화라 판본마다 조금씩 달라요.
혹부리 영감|작자 미상의 우리나라 전래 동화예요.|얼굴에 큰 혹이 있는 영감이 산속에서 노래를 불러요. 밤이 되어 도깨비들이 나타나 노래가 어디서 나오는지 물어요. 영감이 혹에서 나온다고 하자 도깨비들은 보물을 주고 혹을 가져가요. 이 이야기를 들은 다른 혹부리 영감이 흉내를 내요. 거짓말이 들통나 혹이 하나 더 붙어요.|전래 동화라 판본마다 조금씩 달라요.
콩쥐 팥쥐|작자 미상의 우리나라 고전 이야기예요.|콩쥐는 일찍 어머니를 여의고 새어머니와 의붓동생 팥쥐에게 구박을 받아요. 깨진 독에 물을 채우는 일 등 어려운 일을 하지만 두꺼비, 새 등 도움을 받아요. 콩쥐는 잔칫집에 가다 신발 한 짝을 잃어버려요. 그 신발의 주인을 찾던 원님과 콩쥐는 결혼해요. 팥쥐 모녀의 심술은 이어져요.|판본마다 결말이 조금씩 달라요.
선녀와 나무꾼|작자 미상의 우리나라 전래 동화예요.|나무꾼이 사냥꾼에게 쫓기던 사슴을 숨겨 줘요. 사슴은 은혜를 갚기 위해 선녀들이 목욕하는 곳을 알려 줘요. 나무꾼은 선녀의 옷 한 벌을 감추고 선녀와 결혼해 아이들을 낳아요. 선녀는 옷을 찾아 아이들과 하늘로 올라가요. 나무꾼은 두레박을 타고 하늘로 올라가 선녀와 만나요.|판본마다 결말이 달라요.
견우와 직녀|작자 미상의 우리나라 전설이에요.|하늘나라의 견우와 직녀는 결혼해 서로 사랑하느라 일을 소홀히 해요. 화가 난 옥황상제는 은하수를 사이에 두고 둘을 떨어뜨려 놓아요. 둘은 일 년에 한 번 칠월 칠석에 만나게 돼요. 까마귀와 까치가 모여 오작교를 놓아 줘요. 칠석날 비가 오면 둘이 흘린 눈물이라고 해요.|칠월 칠석의 유래를 알려 줘요.
토끼의 간|작자 미상의 우리나라 옛이야기로 「별주부전」으로도 전해져요.|바다의 용왕이 병이 들어 토끼의 간이 약이라는 말을 들어요. 자라 별주부가 육지로 올라가 토끼를 꾀어 용궁으로 데려가요. 토끼는 간을 두고 왔다고 꾀를 내어 육지로 돌아가요. 속은 것을 안 자라는 빈손으로 돌아가요. 토끼는 위기를 지혜로 벗어나요.|판소리 「수궁가」로도 알려졌어요.
심청전|작자 미상의 우리나라 고전 소설이에요.|앞을 못 보는 아버지 심 봉사를 모시던 심청은 아버지가 공양미 삼백 석을 약속하자 인당수에 몸을 던져요. 심청은 용궁에서 구해지고 연꽃을 타고 돌아와 왕비가 돼요. 맹인 잔치에서 아버지를 만난 심청은 눈물을 흘려요. 심 봉사는 눈을 뜨고 모두가 기뻐해요. 효를 이야기하는 대표적인 고전이에요.|판소리 「심청가」로도 알려졌어요.
잭과 콩나무|영국의 옛이야기예요.|가난한 소년 잭은 소를 팔러 가서 콩 몇 알과 소를 바꿔 와요. 엄마가 화가 나 콩을 던졌는데 밤새 하늘까지 닿는 콩나무가 자라요. 잭은 콩나무를 타고 올라가 거인의 성에 들어가요. 거인의 보물과 거위, 하프를 가져 나오고 쫓아오는 거인은 콩나무를 자르자 떨어져요. 잭과 엄마는 부자가 돼요.|판본마다 내용이 조금씩 달라요.
브레멘 음악대|그림 형제는 독일의 형제 학자예요.|늙어 쓸모없다고 쫓겨난 당나귀가 브레멘으로 가서 음악대가 되려 해요. 길에서 개, 고양이, 수탉도 만나 함께 가요. 숲속 도둑의 집을 발견한 동물들은 서로 올라타 큰 소리를 내어 도둑을 쫓아내요. 동물들은 그 집에서 편하게 살아가요. 도둑이 되돌아왔지만 놀라서 도망가요.|1819년 『그림 동화』에 실렸어요.
장화 신은 고양이|샤를 페로는 1628년생 프랑스의 작가예요.|방앗간 주인이 죽고 막내아들은 고양이만 물려받아요. 고양이는 장화와 자루를 부탁하고 꾀를 내어 막내를 '카라바 후작'으로 소개해요. 고양이는 임금님에게 선물을 바치고 막내를 공주와 연결해 줘요. 마법을 쓰는 거인을 쥐로 변하게 해 잡아먹고 성을 차지해요. 막내는 공주와 결혼해요.|1697년 『옛이야기』에 실렸어요.
인어 공주|한스 크리스티안 안데르센은 1805년생 덴마크의 동화 작가예요.|바다 속 인어 공주는 폭풍에 휩쓸린 왕자를 구해 주고 사랑에 빠져요. 인어 공주는 마녀에게 목소리를 주고 다리를 얻어요. 하지만 왕자가 다른 공주와 결혼하게 되어 괴로워요. 언니들이 건네준 칼로 왕자를 찌르면 인어로 돌아갈 수 있지만 공주는 그러지 않아요. 인어 공주는 물거품이 되어 사라져요.|1837년 발표됐어요. 슬픈 결말이 나와요.
벌거벗은 임금님|한스 크리스티안 안데르센은 1805년생 덴마크의 동화 작가예요.|새 옷을 좋아하는 임금님에게 사기꾼 재단사들이 바보에게는 보이지 않는 옷감을 짠다고 해요. 신하들은 바보로 보일까 봐 옷이 보인다고 거짓말을 해요. 임금님도 옷이 보이지 않지만 입은 척하고 행진해요. 사람들도 모두 칭찬하는데 한 아이가 임금님이 벌거벗었다고 외쳐요. 임금님은 부끄러워도 행진을 계속해요.|1837년 발표됐어요.
성냥팔이 소녀|한스 크리스티안 안데르센은 1805년생 덴마크의 동화 작가예요.|눈 내리는 섣달그믐 밤 가난한 소녀가 거리에서 성냥을 팔아요. 한 개도 팔지 못한 소녀는 추위에 성냥을 켜서 손을 녹여요. 성냥불 속에서 따뜻한 난로, 맛있는 음식, 크리스마스 트리가 보여요. 마지막으로 돌아가신 할머니의 모습이 나타나자 소녀는 성냥을 모두 태워요. 아침에 소녀는 얼어 죽은 채 발견돼요.|1845년 발표됐어요. 아이의 죽음이 나와요.
백설 공주|그림 형제는 독일의 형제 학자예요.|아름다운 백설 공주를 질투한 왕비는 마법 거울이 공주가 더 아름답다고 하자 사냥꾼에게 공주를 없애라고 해요. 사냥꾼은 공주를 숲에 두고 와요. 공주는 일곱 난쟁이의 집에서 지내요. 왕비는 독 사과를 먹여 공주를 쓰러뜨려요. 지나가던 왕자가 공주를 깨우고 왕비는 벌을 받아요.|1812년 『그림 동화』에 실렸어요.
신데렐라|샤를 페로는 1628년생 프랑스의 작가예요.|신데렐라는 새어머니와 두 언니에게 구박받으며 집안일을 해요. 요정 할머니의 도움으로 무도회에 가요. 유리 구두 한 짝을 남기고 자정이 되기 전에 돌아와요. 왕자는 구두 주인을 찾아 온 나라를 돌아다녀요. 구두가 꼭 맞는 신데렐라는 왕자와 결혼해요.|1697년 『옛이야기』에 실렸어요. 그림 형제의 다른 판본도 있어요.
골디락스와 곰 세 마리|영국의 옛이야기예요.|숲속에서 길을 잃은 골디락스는 곰 세 마리의 집에 들어가요. 식탁 위의 죽 세 그릇 중 아기 곰의 죽을 먹어요. 의자도 앉아 보고 아기 곰 의자를 부러뜨려요. 침대 세 개 중 아기 곰 침대에서 잠들어요. 곰 가족이 돌아와 골디락스를 발견하자 놀란 골디락스는 도망가요.|판본마다 조금씩 달라요.
북풍과 해님|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|북풍과 해님이 누가 더 힘이 센지 내기를 해요. 지나가는 나그네의 외투를 먼저 벗기는 쪽이 이기는 내기예요. 북풍이 세게 불수록 나그네는 외투를 꽉 움켜쥐어요. 해님이 따뜻하게 비추자 나그네는 더워서 외투를 벗어요. 해님이 내기에서 이겨요.|『이솝 우화』의 이야기예요. 힘보다 따뜻한 마음이 중요하다는 교훈을 줘요.
여우와 두루미|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|여우가 두루미를 저녁 식사에 초대하고 납작한 접시에 수프를 내놓아요. 두루미는 긴 부리로 수프를 먹을 수 없어 쩔쩔매요. 며칠 뒤 두루미는 여우를 초대해 목이 긴 병에 음식을 담아 내놓아요. 여우는 입이 들어가지 않아 먹지 못해요. 상대방을 배려하지 않으면 같은 일을 당한다는 교훈을 줘요.|『이솝 우화』의 이야기예요.
양치기 소년|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|양치기 소년이 심심해서 늑대가 나타났다고 거짓말을 해요. 마을 사람들이 달려오자 소년은 깔깔 웃어요. 이런 일이 몇 번 반복돼요. 진짜 늑대가 나타나 소년이 도와 달라고 외치지만 마을 사람들은 믿지 않아요. 양들이 늑대에게 잡혀가요.|『이솝 우화』의 이야기예요. 거짓말의 대가를 알려 줘요.
시골 쥐와 서울 쥐|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|시골 쥐가 서울 쥐를 초대해 소박한 음식을 대접해요. 서울 쥐는 시골 쥐를 도시로 데려가 풍성한 음식이 차려진 집으로 가요. 그런데 사람과 고양이가 나타나 쥐들은 깜짝 놀라 숨어요. 시골 쥐는 맛있어도 불안한 생활보다 소박해도 평안한 시골이 좋다며 돌아가요.|『이솝 우화』의 이야기예요.
사자와 생쥐|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|잠자던 사자가 생쥐에게 깨어 화가 나 잡으려 해요. 생쥐가 살려 주면 은혜를 갚겠다고 빌자 사자는 비웃으며 놓아줘요. 얼마 뒤 사자가 사냥꾼의 그물에 걸려요. 생쥐가 이빨로 그물을 갉아 사자를 풀어 줘요. 작은 존재도 큰 도움이 될 수 있다는 교훈을 줘요.|『이솝 우화』의 이야기예요.
황금알을 낳는 거위|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|한 농부에게 하루에 황금알 하나씩 낳는 거위가 있어요. 농부는 점점 부자가 되지만 하루 한 개가 성에 차지 않아요. 거위 뱃속에 황금이 가득할 것이라 생각해 거위의 배를 갈라요. 하지만 뱃속은 평범했고 거위는 죽어요. 농부는 황금알도 거위도 모두 잃어요.|『이솝 우화』의 이야기예요. 지나친 욕심을 경계해요.
커다란 순무|러시아의 옛이야기예요.|할아버지가 심은 순무가 아주 크게 자라요. 할아버지가 순무를 뽑으려 하지만 뽑히지 않아 할머니를 불러요. 손녀, 강아지, 고양이, 생쥐까지 차례로 와서 줄지어 당겨요. 마지막 생쥐가 도착하자 순무가 쑥 뽑혀요. 함께 힘을 모으면 큰일을 할 수 있다는 이야기예요.|러시아 민화로 판본마다 조금씩 달라요.
늑대와 일곱 마리 아기 염소|그림 형제는 독일의 형제 학자예요.|엄마 염소는 아기 염소 일곱 마리에게 늑대가 오면 문을 열어 주지 말라고 하고 외출해요. 늑대는 분필을 먹어 목소리를 바꾸고 발에 밀가루를 묻혀 엄마 흉내를 내요. 아기 염소들은 속아 문을 열어 주고 늑대는 아기 염소를 삼켜요. 돌아온 엄마는 늑대의 배를 갈라 아기 염소를 구해 내요. 늑대 배에는 돌을 넣고 꿰매요.|1812년 『그림 동화』에 실렸어요.
엄지 공주|한스 크리스티안 안데르센은 1805년생 덴마크의 동화 작가예요.|아이를 바라던 여인이 마녀에게 받은 보리알을 심자 꽃 속에서 엄지손가락만 한 소녀가 태어나요. 엄지 공주는 호두 껍데기 침대에서 자다 두꺼비에게 납치돼요. 물고기와 나비의 도움으로 도망치지만 풍뎅이와 들쥐, 두더지를 차례로 만나 시련을 겪어요. 엄지 공주는 쓰러진 제비를 정성껏 돌봐요. 건강해진 제비가 엄지 공주를 따뜻한 나라로 데려가 꽃의 나라 왕자와 만나게 해요.|1835년 발표됐어요.
미녀와 야수|잔마리 르프랭스 드 보몽 부인은 1711년생 프랑스의 작가예요.|상인의 막내딸 벨은 아버지가 가져온 장미 한 송이 때문에 야수의 성에 가게 돼요. 벨은 아버지 대신 야수의 성에서 지내요. 야수는 무서운 모습이지만 벨에게 친절히 대해요. 벨은 야수의 마음씨에 감동해 점점 마음을 열어요. 벨의 사랑으로 야수는 저주가 풀려 왕자의 모습으로 돌아와요.|1756년에 출간된 이야기예요. 겉모습보다 마음의 중요성을 이야기해요.
라푼젤|그림 형제는 독일의 형제 학자예요.|아이를 바라던 부부가 마녀의 정원에서 라푼젤이라는 채소를 훔쳐요. 그 대가로 태어난 딸 라푼젤은 마녀에게 넘겨져 높은 탑에 갇혀요. 마녀는 라푼젤의 긴 머리카락을 타고 탑에 올라가요. 지나가던 왕자가 이를 보고 라푼젤을 만나 사랑에 빠져요. 마녀의 방해로 왕자는 시력을 잃지만 라푼젤의 눈물이 왕자의 눈을 낫게 해 줘요.|1812년 『그림 동화』에 실렸어요.
생강빵 아이|영국과 미국에 전해지는 옛이야기예요.|할머니가 구운 생강빵 아이가 오븐에서 뛰쳐나와 도망쳐요. 할아버지와 할머니, 여러 동물이 쫓아오지만 생강빵 아이는 '나 잡아 봐라' 하고 놀리며 달려요. 길에서 만난 여우가 생강빵 아이를 속여요. 결국 생강빵 아이는 여우에게 잡아먹히고 말아요. 반복되는 노래가 재미있는 이야기예요.|판본마다 결말이 조금씩 달라요.
피리 부는 사나이|독일에 전해지는 전설이에요.|독일의 하멜른 마을에 쥐가 들끓어 사람들이 힘들어해요. 낯선 사나이가 피리를 불어 쥐를 강물로 이끌어 모두 빠뜨려요. 마을 사람들은 약속한 돈을 주지 않아요. 화가 난 사나이는 피리를 불어 마을의 아이들을 데리고 사라져요. 약속을 지키는 일의 중요성을 이야기해요.|전설이라 실제 사건에 대한 해석이 여러 가지예요.
행복한 왕자|오스카 와일드는 1854년생 아일랜드의 작가예요.|도시 한가운데 행복한 왕자의 동상이 서 있어요. 동상은 눈에 박힌 사파이어와 몸의 금박으로 가난한 사람을 돕고 싶어 해요. 제비가 동상의 심부름꾼이 되어 보석과 금을 나눠 줘요. 제비는 겨울이 와도 떠나지 못하고 얼어 죽어요. 초라해진 왕자의 동상은 녹여지지만 납 심장은 남아요. 하느님은 제비와 왕자의 마음을 천국으로 데려가요.|1888년 출간됐어요. 나눔과 희생의 이야기예요.
개구리 왕자|그림 형제는 독일의 형제 학자예요.|공주는 우물에 황금 공을 빠뜨려 울어요. 개구리가 공을 건져 주는 대신 친구가 되어 달라고 해요. 공주는 약속을 하지만 공을 받자 도망가요. 개구리는 성까지 찾아와 약속을 지키라고 해요. 공주가 개구리를 벽에 던지자 개구리는 왕자로 변해요.|1812년 『그림 동화』에 실렸어요. 약속의 중요성을 이야기해요.
도깨비 방망이|작자 미상의 우리나라 전래 동화예요.|착한 나무꾼이 산속에서 도깨비들이 놀다 두고 간 방망이를 얻어요. 방망이를 두드리며 말하면 원하는 것이 나와요. 나무꾼은 방망이로 부자가 돼요. 이 소식을 들은 욕심 많은 사람이 도깨비 방망이를 훔치러 가요. 욕심쟁이는 도깨비들에게 붙잡혀 벌을 받아요.|전래 동화라 판본마다 조금씩 달라요.
방귀쟁이 며느리|작자 미상의 우리나라 전래 동화예요.|새로 시집온 며느리가 방귀를 참아 얼굴이 노랗게 변해요. 시아버지가 방귀를 뀌어도 좋다고 허락해요. 며느리의 방귀가 어찌나 세던지 집이 흔들려요. 며느리는 방귀로 가족과 이웃을 놀라게 해요. 판본에 따라 방귀로 배를 따거나 도둑을 쫓아 보탬이 돼요.|전래 동화라 판본마다 내용이 많이 달라요.
젊어지는 샘물|작자 미상의 우리나라 전래 동화예요.|마음씨 착한 할아버지가 산에서 샘물을 마시고 젊은이가 돼요. 집에 돌아온 할아버지를 본 욕심 많은 할머니는 샘으로 달려가요. 할머니는 더 젊어지고 싶어 샘물을 너무 많이 마셔요. 할머니는 아기가 되어 울어요. 할아버지는 아기를 안고 돌아와요.|전래 동화라 판본마다 조금씩 달라요.
개와 고양이의 구슬|작자 미상의 우리나라 전래 동화예요.|가난한 어부가 잡은 잉어를 놓아주자 잉어는 보답으로 구슬을 줘요. 구슬 덕분에 어부는 부자가 돼요. 욕심 많은 사람이 구슬을 훔쳐 가요. 어부가 기르던 개와 고양이가 구슬을 찾아 나서요. 둘은 힘을 합쳐 구슬을 되찾아 주인에게 가져와요.|전래 동화라 판본마다 조금씩 달라요.
소금 나오는 맷돌|작자 미상의 우리나라 전래 동화예요.|가난한 사람이 도깨비에게 소원을 말하면 소금이 나오는 맷돌을 얻어요. 맷돌 덕분에 부자가 돼요. 이 소식을 들은 욕심 많은 사람이 맷돌을 훔쳐 배를 타고 도망가요. 소금이 나오는 맷돌은 멈추는 방법을 몰라 계속 소금을 쏟아내요. 배는 소금 무게에 가라앉고 바닷물이 짜게 됐다고 해요.|전래 동화라 판본마다 조금씩 달라요.
호랑이와 곶감|작자 미상의 우리나라 전래 동화예요.|배고픈 호랑이가 마을에 내려와 집 앞에서 서성여요. 집 안에서 아기가 울자 어머니는 호랑이가 온다고 해도 아기가 그치지 않아요. 어머니가 곶감을 주자 아기가 뚝 그쳐요. 호랑이는 곶감이 자기보다 무서운 것이라고 생각해 겁먹고 도망쳐요. 소도둑과 호랑이가 서로를 오해하는 장면이 이어지기도 해요.|전래 동화라 판본마다 조금씩 달라요.
의좋은 형제|작자 미상의 우리나라 전래 동화예요.|추수를 마친 형제가 볏단을 똑같이 나눠 가져요. 형은 아우가 새 가정을 꾸렸다며 자기 볏단을 몰래 아우 집에 옮겨 놓아요. 아우도 형의 살림이 걱정되어 자기 볏단을 형 집으로 옮겨요. 아침마다 볏단이 줄지 않자 둘은 이상하게 여겨요. 어느 날 밤 길에서 마주친 형제는 서로의 마음을 알고 눈물을 흘려요.|충남 예산에 전해지는 이야기로 알려져 있어요.
우렁 각시|작자 미상의 우리나라 전래 동화예요.|혼자 사는 총각이 논에서 일하다 큰 우렁이를 얻어 집에 가져와요. 총각이 일을 나간 사이 누군가 밥상을 차려 놓아요. 몰래 지켜보던 총각은 우렁이 속에서 아름다운 각시가 나오는 것을 봐요. 둘은 함께 살지만 원님이 각시를 탐내요. 판본에 따라 이야기의 끝이 다르게 전해져요.|전래 동화라 판본마다 결말이 달라요.
개미와 비둘기|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|개미가 물가에서 놀다 물에 빠져요. 나무 위의 비둘기가 나뭇잎을 떨어뜨려 개미를 구해 줘요. 얼마 뒤 사냥꾼이 비둘기를 잡으려고 해요. 이를 본 개미가 사냥꾼의 발을 깨물어 놀라게 해요. 비둘기는 날아올라 무사히 도망쳐요.|『이솝 우화』의 이야기예요. 은혜를 갚는 일을 가르쳐 줘요.
여우와 신 포도|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|배고픈 여우가 높은 가지에 매달린 포도를 발견해요. 여우는 뛰어올라 포도를 따려 하지만 닿지 않아요. 몇 번이나 애를 써도 실패하자 여우는 어차피 신 포도일 것이라며 돌아서요. 자신의 실패를 변명하는 모습이에요.|『이솝 우화』의 이야기예요. '신 포도'는 핑계를 대는 태도를 가리키는 말로 쓰여요.
까마귀와 물병|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|목이 마른 까마귀가 물병을 발견해요. 병 속에는 물이 조금 있지만 부리가 닿지 않아요. 까마귀는 병을 넘어뜨릴 수도 없어 고민해요. 까마귀는 작은 돌을 물어다 병 속에 하나씩 넣어요. 물이 점점 올라와 까마귀는 물을 마실 수 있어요.|『이솝 우화』의 이야기예요. 지혜로 어려움을 이겨 내요.
욕심 많은 개|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|개가 고기 한 조각을 물고 다리를 건너요. 다리 아래 물에 고기를 문 다른 개가 보여요. 개는 그 고기도 빼앗으려고 짖어요. 입을 벌리자 물고 있던 고기가 물에 빠져요. 개는 두 고기를 모두 잃어요.|『이솝 우화』의 이야기예요. 지나친 욕심을 경계해요.
소금 짐 진 당나귀|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|당나귀가 소금 짐을 지고 개울을 건너다 넘어져요. 소금이 물에 녹아 짐이 가벼워져요. 당나귀는 꾀를 부려 일부러 물에서 넘어지는 일을 반복해요. 주인이 이를 알고 이번에는 솜을 실어요. 당나귀가 또 넘어지자 솜이 물을 먹어 훨씬 무거워져요.|『이솝 우화』의 이야기예요. 꾀를 부리다 오히려 손해를 봐요.
고양이 목에 방울 달기|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|쥐들이 고양이 때문에 괴로워 회의를 열어요. 한 쥐가 고양이 목에 방울을 달자고 해요. 방울 소리가 나면 미리 도망칠 수 있다는 좋은 생각이에요. 그러나 누가 방울을 달 것인지 아무도 나서지 않아요. 좋은 계획도 실행할 수 없으면 소용이 없어요.|『이솝 우화』의 이야기예요.
박쥐|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|새와 짐승이 서로 전쟁을 벌여요. 박쥐는 새들에게는 날개가 있다고 하고 짐승들에게는 털이 있다고 하며 이쪽저쪽에 붙어요. 전쟁이 끝나 평화가 오자 양쪽 모두 박쥐의 거짓을 알게 돼요. 박쥐는 어느 쪽에도 끼지 못해요. 박쥐는 밤에만 나오는 신세가 됐다고 해요.|『이솝 우화』의 이야기예요.
작은 빨간 암탉|영국의 옛이야기예요.|작은 빨간 암탉이 밀알을 발견해 농장 친구들에게 같이 심자고 해요. 오리, 고양이, 개는 모두 거절해요. 암탉은 혼자 밀을 심고 키워 수확하고 빵을 구워요. 빵이 완성되자 친구들이 먹고 싶다고 해요. 암탉은 일한 사람만 먹을 수 있다고 하며 혼자 먹어요.|판본마다 조금씩 달라요. 일하는 즐거움과 책임을 이야기해요.
잠자는 숲 속의 공주|샤를 페로는 1628년생 프랑스의 작가이고 그림 형제도 이 이야기를 실었어요.|오랫동안 아이가 없던 왕과 왕비에게 공주가 태어나 잔치가 열려요. 초대받지 못한 마녀가 공주가 열다섯 살에 물레 바늘에 찔려 죽는다는 저주를 내려요. 다른 요정이 죽는 대신 백 년 동안 잠든다고 바꿔 줘요. 공주는 물레에 찔려 성 전체와 함께 깊이 잠들어요. 백 년 뒤 왕자가 와서 공주를 깨우고 둘은 결혼해요.|1697년 페로의 『옛이야기』와 1812년 『그림 동화』에 실렸어요.
룸펠슈틸츠헨|그림 형제는 독일의 형제 학자예요.|방앗간 주인이 딸이 짚으로 금을 만든다고 왕에게 자랑해요. 왕은 딸에게 짚으로 금을 만들라고 시켜요. 이상한 난쟁이가 나타나 대가를 받고 금을 만들어 줘요. 마지막에 난쟁이는 왕비가 된 딸의 첫아이를 요구해요. 왕비는 난쟁이의 이름을 알아내 아이를 지켜요.|1812년 『그림 동화』에 실렸어요.
완두콩 공주|한스 크리스티안 안데르센은 1805년생 덴마크의 동화 작가예요.|왕자는 진짜 공주를 만나고 싶어 하지만 진짜 공주를 알아볼 수 없어요. 폭풍우 치는 밤 한 소녀가 공주라며 성을 찾아와요. 왕비는 침대 맨 아래에 완두콩을 놓고 매트리스를 스무 장 쌓아 소녀를 재워요. 다음 날 소녀는 무언가 딱딱한 것 때문에 잠을 못 잤다고 말해요. 왕자는 진짜 공주라 생각하고 결혼해요.|1835년 발표됐어요.
용감한 꼬마 재봉사|그림 형제는 독일의 형제 학자예요.|꼬마 재봉사는 잼에 달려든 파리 일곱 마리를 한 방에 잡았다고 허리띠에 자랑스럽게 새겨요. 사람들은 한 방에 일곱 명을 죽인 줄 알아요. 재봉사는 왕에게서 거인 두 명과 유니콘, 멧돼지를 잡는 임무를 받아요. 꾀를 써서 모두 해결하고 공주와 결혼해요. 꾀와 재치로 어려움을 이겨요.|1812년 『그림 동화』에 실렸어요.
구두장이와 요정|그림 형제는 독일의 형제 학자예요.|가난한 구두장이는 마지막 가죽으로 구두를 만들 재료를 놓고 잠자리에 들어요. 아침에 가 보니 멋진 구두가 완성돼 있어요. 이런 일이 며칠 계속되어 구두장이는 부자가 돼요. 구두장이 부부는 밤에 몰래 지켜보다 작은 요정들이 구두를 만드는 걸 봐요. 부부는 고마움의 표시로 요정들에게 옷과 신발을 지어 줘요.|1812년 『그림 동화』에 실렸어요.
황금 거위|그림 형제는 독일의 형제 학자예요.|착한 막내아들이 숲에서 작은 노인에게 빵을 나눠 줘요. 노인은 보답으로 황금 깃털이 있는 거위를 줘요. 거위를 만지면 손이 붙어 사람들이 줄줄이 붙어 따라와요. 이 모습을 본 웃음을 잃은 공주가 웃음을 터뜨려요. 막내는 공주와 결혼해 왕이 돼요.|1812년 『그림 동화』에 실렸어요.
백조 왕자|한스 크리스티안 안데르센은 1805년생 덴마크의 동화 작가예요.|엘리자 공주의 열한 명 오빠는 새엄마의 마법으로 낮에는 백조가 돼요. 엘리자는 오빠들의 저주를 풀기 위해 쐐기풀로 옷을 짜야 해요. 일하는 동안 말을 해서는 안 되어 엘리자는 침묵해요. 엘리자는 오해를 받아 위기에 처하지만 끝까지 옷을 짜요. 마침내 오빠들의 저주가 풀려요.|1838년 「야생 백조」로 발표됐어요.
여우와 까마귀|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|까마귀가 고기 한 점을 물고 나뭇가지에 앉아 있어요. 배고픈 여우가 그 고기를 탐내요. 여우는 까마귀의 목소리가 아름답다고 칭찬하며 노래를 불러 보라고 해요. 으쓱해진 까마귀가 입을 벌리자 고기가 떨어져요. 여우는 고기를 물고 달아나요.|『이솝 우화』의 이야기예요. 듣기 좋은 말을 조심하라고 알려 줘요.
농부와 아들들|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|늙은 농부가 죽기 전에 아들들을 불러 포도밭에 보물이 묻혀 있다고 말해요. 아들들은 보물을 찾으려고 포도밭을 구석구석 파 보지만 찾지 못해요. 그러나 땅을 깊이 간 덕분에 포도가 풍작을 이뤄요. 아들들은 부지런히 일하는 것이 진짜 보물임을 깨달아요.|『이솝 우화』의 이야기예요.
당나귀를 팔러 간 아버지와 아들|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|아버지와 아들이 당나귀를 팔러 시장에 가요. 아들이 타면 아버지가 편하지 않다고, 아버지가 타면 아들이 불쌍하다고 사람들이 말해요. 둘이 타면 당나귀가 불쌍하다고 하고 둘이 걸으면 어리석다고 해요. 마침내 둘은 당나귀를 들고 가다 다리에서 당나귀를 물에 빠뜨려요. 남의 말에 휘둘리면 아무것도 이룰 수 없다는 교훈을 줘요.|『이솝 우화』의 이야기예요.
늑대와 두루미|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 전해져요.|늑대가 먹이를 먹다 목에 뼈가 걸려 괴로워해요. 늑대는 두루미에게 긴 부리로 뼈를 빼 달라고 하며 보답을 약속해요. 두루미가 뼈를 빼 주자 늑대는 보답으로 늑대의 입에서 머리를 무사히 빼낸 것으로 충분하다고 해요. 두루미는 황당해해요. 은혜를 모르는 사람을 조심하라는 교훈을 줘요.|『이솝 우화』의 이야기예요.
금덩이를 버린 형제|작자 미상의 우리나라 옛이야기예요.|가난한 형제가 길에서 금덩이 두 개를 주워 하나씩 나눠 가져요. 배를 타고 강을 건너던 중 동생이 금덩이를 강물에 던져요. 형이 이유를 묻자 동생은 금덩이를 가진 뒤로 형이 미워졌다고 답해요. 형도 금덩이를 강에 던져요. 둘은 다시 사이좋은 형제로 돌아가요.|전래 동화라 판본마다 조금씩 달라요.
염소 삼 형제|노르웨이의 옛이야기예요.|염소 삼 형제가 풀을 먹으러 산에 가려면 무서운 괴물이 사는 다리를 건너야 해요. 막내 염소가 먼저 다리를 건너자 괴물이 잡아먹겠다고 해요. 막내는 뒤에 오는 더 큰 형이 맛있다고 해서 괴물을 보내요. 둘째도 같은 방법으로 넘어가요. 맏형 염소는 뿔로 괴물을 받아 물에 빠뜨려요.|노르웨이 민담으로 판본마다 조금씩 달라요.
장갑|우크라이나의 옛이야기예요.|할아버지가 눈 속을 걷다 장갑 한 짝을 떨어뜨려요. 생쥐가 장갑 안에 들어가 살기 시작해요. 개구리, 토끼, 여우, 늑대 등 동물들이 차례로 찾아와 함께 살겠다고 해요. 장갑은 점점 부풀어 오르고 마지막에는 큰 곰까지 들어와요. 장갑이 팽팽해져 터질 듯해요.|우크라이나 민담으로 판본마다 조금씩 달라요.
헬렌 켈러|헬렌 켈러는 1880년 미국에서 태어난 작가이자 사회 운동가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어린 시절 병으로 보지도 듣지도 못하게 된 헬렌은 화를 내며 지냈어요. 가정교사 앤 설리번 선생님이 손바닥에 글자를 써서 가르쳐 주었고 우물가에서 '물'이라는 말을 깨달았어요. 헬렌은 점자와 말하기를 익히고 대학을 졸업했어요. 이후 장애인을 돕는 일과 강연에 힘썼어요.|위인전은 책마다 서술이 조금씩 달라요.
에이브러햄 링컨|에이브러햄 링컨은 1809년 미국 켄터키에서 태어난 제16대 대통령이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 가난한 통나무집에서 태어나 독학으로 공부해 변호사가 됐어요. 1860년 대통령에 당선된 뒤 남북 전쟁이 일어났어요. 1863년 노예 해방 선언을 발표하고 게티즈버그에서 연설했어요. 1865년 전쟁이 끝난 직후 암살당해 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
마더 테레사|마더 테레사는 1910년 지금의 북마케도니아에서 태어난 수녀예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어린 시절부터 신앙심이 깊었고 인도로 건너가 수녀로 일했어요. 콜카타의 거리에서 가난하고 병든 사람들을 돕기로 결심해 1950년 '사랑의 선교회'를 세웠어요. 죽어 가는 사람들을 돌보며 평생을 바쳤어요. 1979년 노벨 평화상을 받았고 1997년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
라이트 형제|라이트 형제는 형 윌버(1867년생)와 동생 오빌(1871년생)로 미국의 발명가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 형제는 어릴 때부터 비행에 관심이 많았고 자전거 가게를 운영하며 비행기를 연구했어요. 바람 터널로 날개 모양을 실험하고 글라이더로 연습을 거듭했어요. 1903년 12월 17일 노스캐롤라이나의 키티호크에서 동력 비행기를 처음 날렸어요. 이 일은 항공 시대를 여는 계기가 됐어요.|위인전은 책마다 서술이 조금씩 달라요.
레오나르도 다 빈치|레오나르도 다 빈치는 1452년 이탈리아에서 태어난 화가이자 과학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 빈치 마을에서 태어나 베로키오의 공방에서 그림을 배웠어요. 「모나리자」와 「최후의 만찬」 같은 대표작을 남겼어요. 해부학과 기계, 비행 장치 등 여러 분야에 관심을 가져 공책에 그림과 글로 기록했어요. 1519년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
모차르트|볼프강 아마데우스 모차르트는 1756년 오스트리아 잘츠부르크에서 태어난 작곡가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어릴 때부터 음악 신동으로 불렸고 아버지와 유럽 여러 곳을 돌며 연주했어요. 「피가로의 결혼」, 「마술피리」 같은 오페라와 많은 교향곡, 협주곡을 작곡했어요. 짧은 생애 동안 600곡이 넘는 작품을 남겼다고 알려져 있어요. 1791년 35세로 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
베토벤|루트비히 판 베토벤은 1770년 독일 본에서 태어난 작곡가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 음악가 집안에서 태어나 어릴 때부터 피아노를 배웠어요. 20대 후반부터 귀가 점점 들리지 않게 되어 큰 고통을 겪었어요. 그러나 「운명」 교향곡과 「합창」 교향곡 같은 명곡을 작곡했어요. 1827년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
루이 브라유|루이 브라유는 1809년 프랑스에서 태어난 점자 발명가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 세 살 때 사고로 눈을 다쳐 시력을 잃었어요. 파리의 맹인 학교에서 공부하며 글을 읽고 싶어 했어요. 군대에서 쓰던 야간 문자를 개선해 여섯 개의 점으로 이루어진 점자를 열다섯 살 무렵 만들었어요. 이 점자는 지금도 전 세계에서 쓰여요.|위인전은 책마다 서술이 조금씩 달라요.
파브르|장 앙리 파브르는 1823년 프랑스에서 태어난 곤충학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어릴 때부터 자연과 곤충에 관심이 많았고 교사로 일하며 공부를 이어 갔어요. 풀밭과 정원에서 곤충을 오래 관찰하며 기록했어요. 이를 모아 『곤충기』를 책으로 펴냈어요. 1915년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
월트 디즈니|월트 디즈니는 1901년 미국에서 태어난 만화 영화 제작자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어릴 적부터 그림 그리기를 좋아했고 만화가로 일을 시작했어요. 1928년 미키 마우스를 선보였고 1937년 장편 만화 영화 「백설 공주」를 만들었어요. 1955년 디즈니랜드를 열었어요. 1966년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
콜럼버스|크리스토퍼 콜럼버스는 1451년경 이탈리아 제노바에서 태어난 탐험가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 서쪽으로 가면 인도에 닿을 것이라 믿고 지원을 구하러 여러 나라를 찾아다녔어요. 스페인 이사벨 여왕의 후원을 받아 1492년 산타마리아호 등 세 척의 배로 출항했어요. 두 달여 항해 끝에 지금의 바하마 제도에 도착했어요. 이 항해는 유럽과 아메리카 대륙이 만나는 계기가 됐지만 원주민에게 큰 피해를 줬다는 평가도 있어요.|위인전은 책마다 서술이 조금씩 달라요.
아이작 뉴턴|아이작 뉴턴은 1642년 영국에서 태어난 과학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어릴 때부터 기계 만들기를 좋아했고 케임브리지 대학에서 공부했어요. 사과가 떨어지는 것을 보고 만유인력을 생각했다는 일화가 전해져요. 1687년 『프린키피아』를 펴내 운동 법칙과 만유인력의 법칙을 정리했어요. 1727년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요. 사과 일화는 후대에 널리 알려진 이야기예요.
신사임당|신사임당은 1504년 강릉에서 태어난 조선 시대의 화가이자 학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어릴 때부터 글과 그림에 뛰어났고 풀과 벌레를 그린 그림을 남겼어요. 결혼한 뒤에도 학문과 예술을 이어 갔어요. 아들 이이를 훌륭하게 키운 어머니로도 알려져 있어요. 1551년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
허준|허준은 1539년경에 태어난 조선 시대의 의관이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어려서부터 의학에 뜻을 두고 공부해 궁중의 의관이 됐어요. 임진왜란 중 선조를 모셨고 선조의 명으로 의학 책을 쓰기 시작했어요. 『동의보감』을 1610년 완성하고 1613년 간행했어요. 이 책은 오늘날 유네스코 세계 기록 유산이에요.|위인전은 책마다 서술이 조금씩 달라요.
김구|김구는 1876년 황해도에서 태어난 독립운동가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 젊은 시절 동학에 참여했고 이후 교육과 독립운동에 힘썼어요. 상하이 대한민국 임시 정부에서 경무국장과 주석으로 일했어요. 1931년 한인애국단을 조직해 이봉창, 윤봉길 의거를 이끌었어요. 자서전 『백범일지』를 남겼고 1949년 서울에서 암살당했어요.|위인전은 책마다 서술이 조금씩 달라요.
정약용|정약용은 1762년에 태어난 조선 후기의 실학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어릴 때부터 글을 잘해 정조의 총애를 받았어요. 수원 화성을 쌓을 때 거중기를 설계해 공사에 도움을 줬어요. 천주교 문제로 전라도 강진에서 18년 동안 유배 생활을 했어요. 유배 중 『목민심서』, 『경세유표』 등 많은 책을 썼고 1836년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
김만덕|김만덕은 1739년 제주에서 태어난 조선 시대의 상인이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어려서 부모를 여의고 기녀의 집에서 자랐다가 다시 평민의 신분을 되찾았어요. 장사 수완이 뛰어나 제주의 상인으로 큰 재산을 모았어요. 1790년대 큰 흉년이 들자 재산으로 쌀을 사 제주 사람들을 구했어요. 정조는 소원을 물었고 만덕은 서울과 금강산을 구경하고 싶다고 했어요.|위인전은 책마다 서술이 조금씩 달라요.
선덕여왕|선덕여왕은 신라 제27대 왕으로 632년에 즉위했어요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 선덕여왕은 신라 최초의 여왕이에요. 분황사와 황룡사 9층 목탑을 세우고 첨성대를 만들었다고 전해져요. 백성을 보살피고 당나라와 교류하며 나라를 이끌었어요. 647년 비담의 난 중에 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요. 첨성대의 건립 시기는 학자마다 의견이 달라요.
장보고|장보고는 신라 하대의 장군이자 해상 무역가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 젊은 시절 당나라에 건너가 군인으로 활약했어요. 신라로 돌아와 828년 완도에 청해진을 설치하고 해적을 소탕했어요. 신라, 당, 일본을 잇는 바다 무역을 이끌었어요. 846년 정치 갈등 속에 암살당해요.|위인전은 책마다 서술이 조금씩 달라요.
왕건|왕건은 877년 송악에서 태어난 고려의 초대 왕이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 호족 집안에서 태어나 궁예 밑에서 장군으로 활약했어요. 918년 궁예를 몰아내고 고려를 세웠어요. 936년 후백제를 무너뜨리고 후삼국을 통일했어요. 호족을 포용하고 불교를 중시했고 943년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
광개토대왕|광개토대왕은 374년에 태어나 391년 고구려 왕이 된 인물이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 열여덟 살쯤 왕위에 올라 영토를 크게 넓혔어요. 백제를 공격해 한강 이북의 성들을 빼앗고 후연과 거란, 숙신 등을 정벌했어요. 신라를 도와 왜군을 물리쳤다는 기록도 있어요. 412년 세상을 떠났고 그의 업적은 아들 장수왕이 세운 광개토대왕릉비에 새겨져 있어요.|위인전은 책마다 서술이 조금씩 달라요.
김유신|김유신은 595년에 태어난 신라의 장군이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 금관가야 왕족의 후손으로 어릴 때부터 무예를 닦았어요. 김춘추와 힘을 합쳐 신라를 이끌었어요. 660년 백제를, 668년 고구려를 멸망시키는 데 큰 역할을 했어요. 673년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
을지문덕|을지문덕은 고구려의 장군이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 612년 수나라 양제가 대군을 이끌고 고구려를 침략했어요. 을지문덕은 거짓으로 패하는 척하며 적을 깊숙이 끌어들였어요. 우중문에게 시를 지어 보내 조롱한 일로도 유명해요. 살수에서 지친 수나라 군대를 크게 무찔렀는데 이를 살수 대첩이라 해요.|위인전은 책마다 서술이 조금씩 달라요.
강감찬|강감찬은 948년에 태어난 고려의 문신이자 장군이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 과거에 장원으로 급제해 벼슬길에 올랐어요. 거란이 고려를 침략하자 1018년 거란의 대군이 쳐들어왔어요. 강감찬은 흥화진 근처 강에 쇠가죽을 막아 두었다가 터뜨려 적을 공격했어요. 1019년 귀주에서 크게 이긴 귀주 대첩으로 유명해요.|위인전은 책마다 서술이 조금씩 달라요.
이태석|이태석은 1962년 부산에서 태어난 신부이자 의사예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 의과 대학을 졸업한 뒤 사제의 길을 선택했어요. 아프리카 남수단의 톤즈에서 병원을 열고 환자를 돌봤어요. 학교를 세우고 브라스 밴드를 만들어 아이들에게 음악도 가르쳤어요. 2010년 세상을 떠났고 그의 삶은 영화로도 알려졌어요.|위인전은 책마다 서술이 조금씩 달라요.
김정호|김정호는 조선 후기의 지리학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 태어나고 죽은 해는 정확히 알려지지 않았어요. 직접 전국을 돌아다니며 지도를 만들었다고 전해지지만 자료를 모아 만들었다는 의견도 있어요. 1861년 『대동여지도』를 만들었어요. 이 지도는 목판으로 찍어 여러 장으로 나누어 볼 수 있게 만들었어요.|위인전은 책마다 서술이 조금씩 달라요. 생애에 대해서는 확실하지 않은 부분이 많아요.
이황|이황은 1501년 경북 안동에서 태어난 조선의 학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 호는 퇴계이고 어릴 때부터 학문에 열중했어요. 벼슬에 오르기도 했지만 여러 번 물러나 고향에서 제자를 키웠어요. 도산 서당을 세워 후학을 가르쳤고 이는 훗날 도산 서원이 됐어요. 성리학을 연구해 『성학십도』 등을 남겼고 1570년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
이이|이이는 1536년 강릉에서 태어난 조선의 학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어머니 신사임당의 가르침을 받으며 자랐어요. 과거에서 아홉 번 장원을 해 '구도장원공'이라 불렸어요. 호는 율곡이며 『격몽요결』, 『성학집요』 등을 지었어요. 개혁을 주장했고 1584년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
정조|정조는 1752년에 태어나 1776년 조선의 제22대 왕이 된 인물이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 아버지 사도 세자의 비극을 겪은 뒤 왕위에 올랐어요. 규장각을 세워 학문과 인재를 키웠어요. 수원 화성을 쌓고 정약용 같은 실학자를 등용했어요. 백성을 위한 개혁을 추진하다 1800년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
안창호|안창호는 1878년 평안도에서 태어난 독립운동가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 호는 도산이며 교육과 실력 양성을 통한 독립을 강조했어요. 1907년 비밀 단체 신민회를 만들고 대성 학교를 세웠어요. 미국에서 1913년 흥사단을 만들어 청년 교육에 힘썼어요. 일제에 체포되어 고초를 겪다 1938년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
윤봉길|윤봉길은 1908년 충남 예산에서 태어난 독립운동가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어릴 때부터 농촌 계몽 운동에 힘썼어요. 상하이로 건너가 김구가 이끄는 한인애국단에 가입했어요. 1932년 4월 29일 상하이 훙커우 공원에서 일본 요인들을 향해 폭탄을 던졌어요. 체포되어 그해 12월 일본에서 순국했어요.|위인전은 책마다 서술이 조금씩 달라요.
지각대장 존|존 버닝햄은 1936년생 영국의 그림책 작가예요.|존 패트릭 노먼 맥헤너시는 학교에 가는 길에 악어와 사자, 큰 파도를 만나요. 존은 그때마다 위기를 겪어 학교에 늦어요. 선생님은 존의 이야기를 믿지 않고 오히려 벌을 줘요. 다음 날 존은 장갑을 잃어버렸다고 말해요. 이번에는 선생님이 털복숭이 괴물에게 붙잡히는 반전이 일어나요.|1977년 출간됐어요. 거짓말과 어른의 편견을 재치 있게 그려요.
누가 내 머리에 똥 쌌어?|베르너 홀츠바르트는 1947년생 독일의 작가예요.|두더지가 땅 위로 머리를 내밀었다가 머리 위에 똥이 떨어진 것을 발견해요. 두더지는 범인을 찾아 비둘기, 말, 토끼, 염소, 돼지 등을 찾아가요. 동물들은 저마다 자기 똥의 모양을 보여 줘요. 파리들이 똥을 살펴보고 푸줏간 집 개 한스가 범인이라는 것을 알려 줘요. 두더지는 한스의 머리 위에 똥을 싸서 복수해요.|1989년 출간됐어요. 동물의 똥 모양을 알 수 있어요.
달 샤베트|백희나는 1971년생 그림책 작가예요.|무더운 여름밤 에어컨도 선풍기도 없는 아파트에 사는 반장 할머니는 더위로 괴로워해요. 달이 너무 더워 녹아 물이 뚝뚝 떨어져요. 할머니는 달 방울을 그릇에 받아 샤베트를 만들어요. 이웃 사람들과 나누어 먹으며 더위를 식혀요. 달 샤베트를 먹은 이웃들은 시원한 여름밤을 보내요.|2014년 출간됐어요. 인형으로 만든 입체적인 그림이 특징이에요.
수박 수영장|안녕달은 1982년생 그림책 작가예요.|여름이 오자 마을에 수박 수영장이 문을 열어요. 사람들은 큰 수박 속으로 들어가 수영을 즐겨요. 아이들과 어른들이 함께 물놀이를 하고 수박을 먹고 즐거워해요. 여름 한낮의 동네 풍경이 정겹게 이어져요. 더운 여름을 시원하게 보내는 상상이 담겨 있어요.|2015년 출간됐어요.
엄마 까투리|권정생은 1937년생 아동 문학가예요.|산속에 사는 엄마 까투리는 알에서 깬 아기 꿩들과 평화롭게 살아요. 어느 날 산불이 나 모든 것이 불타요. 엄마 까투리는 아기들을 몸으로 감싸 지켜 줘요. 불이 꺼진 뒤 까만 재가 된 엄마의 몸 아래에서 아기들이 나와요. 엄마의 사랑을 이야기해요.|2008년 김세현의 그림으로 그림책이 나왔어요. 엄마의 죽음이 나와요.
엄마 마중|이태준은 1904년생 소설가예요.|추운 겨울 아기는 엄마를 마중하러 전차 정류장에 나가요. 아기는 전차가 올 때마다 엄마가 오는지 살펴봐요. 차장은 아기가 추워 보여 걱정하지만 엄마는 오지 않아요. 정류장에서 아기는 끝까지 엄마를 기다려요. 엄마를 기다리는 아이의 마음이 담겨 있어요.|1931년 발표된 짧은 동화로 그림책으로도 나왔어요.
넉 점 반|윤석중은 1911년생 아동 문학가이고 이영경은 그림 작가예요.|한 아이가 엄마 심부름으로 가게에 가서 시간을 물어봐요. 가게 할아버지는 '넉 점 반'이라고 해요. 아이는 돌아오는 길에 닭, 개미, 꽃, 잠자리, 해 등을 구경하며 놀아요. 너무 오래 노느라 저녁이 돼요. 집에 도착한 아이는 '넉 점 반'이라고 말해요.|윤석중의 동시를 그림책으로 만든 책이에요.
우리 아빠가 최고야|앤서니 브라운은 1946년생 영국의 그림책 작가예요.|한 아이가 자기 아빠가 얼마나 대단한지 자랑해요. 아빠는 담장 위를 걸을 수 있고 큰 거인보다 힘이 세요. 아빠는 달리기도 잘하고 음식도 잘 먹어요. 아이는 아빠를 아주 사랑한다고 말해요. 그림 속 아빠는 소박한 가운을 입은 평범한 모습이에요.|1985년 출간됐어요.
고릴라|앤서니 브라운은 1946년생 영국의 그림책 작가예요.|한나는 고릴라를 좋아하지만 아빠는 늘 바빠 놀아 주지 않아요. 생일 전날 밤 한나는 장난감 고릴라를 선물로 받고 실망해요. 잠든 사이 고릴라가 커져 한나를 데리고 놀러 가요. 둘은 동물원과 영화관, 산책 등을 즐겨요. 다음 날 아빠가 한나와 함께 동물원에 가 줘요.|1983년 출간됐어요. 케이트 그리너웨이상을 받았어요.
터널|앤서니 브라운은 1946년생 영국의 그림책 작가예요.|사이가 좋지 않은 오빠 잭과 여동생 로즈가 있어요. 어느 날 엄마가 둘을 밖에 내보내자 오빠는 신비한 터널을 발견해요. 오빠가 터널 속으로 들어가 돌아오지 않자 로즈는 오빠를 찾아 터널에 들어가요. 숲을 지나 돌로 변한 오빠를 발견한 로즈는 오빠를 꼭 안아 줘요. 오빠는 다시 살아나고 둘은 사이좋게 돌아와요.|1989년 출간됐어요.
구리와 구라|나카가와 리에코는 1941년생 일본의 작가이고 오무라 유리코가 그림을 그렸어요.|들쥐 구리와 구라는 숲에서 커다란 알을 발견해요. 알은 너무 커서 옮길 수 없어 둘은 알로 맛있는 카스텔라를 만들기로 해요. 둘은 프라이팬을 가져와 알로 커다란 카스텔라를 구워요. 냄새를 맡은 숲속 동물들이 모여들어 함께 나누어 먹어요. 남은 알 껍데기는 수레로 쓰여요.|1963년 출간됐어요.
100만 번 산 고양이|사노 요코는 1938년생 일본의 그림책 작가예요.|얼룩 고양이는 100만 번 죽고 100만 번 다시 태어나요. 여러 주인에게 사랑받았지만 고양이는 누구도 좋아하지 않았어요. 마지막에 주인 없는 고양이가 되어 흰 고양이를 만나요. 흰 고양이와 가족을 이루고 처음으로 사랑을 알게 돼요. 흰 고양이가 죽은 뒤 고양이는 더 이상 다시 태어나지 않아요.|1977년 출간됐어요. 죽음과 사랑이 나와요.
아기 오리들한테 길을 비켜 주세요|로버트 맥클로스키는 1914년생 미국의 그림책 작가예요.|맬러드 부부는 새끼를 낳을 곳을 찾아 보스턴의 도시를 돌아다녀요. 찰스 강의 섬은 여우가 있을 것 같고 공원은 시끄러워 맘에 들지 않아요. 새끼들이 태어나자 가족은 길을 건너 강으로 가려 해요. 경찰관 마이클이 자동차를 멈추게 해 오리 가족을 도와요. 가족은 안전하게 길을 건너 공원 연못에 자리 잡아요.|1941년 출간됐고 1942년 칼데콧상을 받았어요.
작은 집 이야기|버지니아 리 버튼은 1909년생 미국의 그림책 작가예요.|시골 언덕 위에 작은 집이 서 있어요. 계절이 바뀌는 동안 집은 평화롭게 지내요. 어느 날 도로가 생기고 도시가 커져 주변이 높은 건물로 가득해져요. 작은 집은 외롭고 낡아 가요. 어느 날 주인의 후손이 집을 찾아 시골로 옮겨 다시 행복해져요.|1942년 출간됐고 1943년 칼데콧상을 받았어요.
갈색 곰아, 갈색 곰아, 무엇을 보고 있니?|빌 마틴 주니어는 1916년생 미국의 작가이고 에릭 칼이 그림을 그렸어요.|갈색 곰은 무엇을 보고 있는지 물어요. 곰이 빨간 새를 보고 있다고 대답해요. 빨간 새는 노란 오리를, 노란 오리는 파란 말을 보아요. 초록 개구리와 보라 고양이, 흰 개, 검은 양 같은 동물들이 이어서 나와요. 마지막에는 선생님이 아이들에게 본 것을 묻고 아이들이 대답해요.|1967년 출간됐어요. 색깔과 동물의 이름을 익힐 수 있어요.
이슬이의 첫 심부름|쓰쓰이 요리코는 1945년생 일본의 작가이고 하야시 아키코가 그림을 그렸어요.|다섯 살 이슬이는 엄마가 우유를 사 오라고 하자 처음으로 혼자 심부름을 가요. 동전을 꼭 쥐고 길을 걷다 넘어져 동전을 떨어뜨리기도 해요. 가게에 도착했지만 가게 아주머니는 이슬이가 작아서 바로 알아보지 못해요. 마침내 우유를 사서 집으로 돌아오는 길에 엄마를 만나요. 이슬이는 뿌듯해해요.|1976년 일본에서 출간됐어요.
아씨방 일곱 동무|이영경은 1960년대에 태어난 그림책 작가예요.|아씨는 바느질할 때 자, 가위, 바늘, 실, 골무, 인두, 다리미 일곱 동무를 쓰고 있어요. 어느 날 아씨가 낮잠이 든 사이 일곱 동무가 서로 자기 공이 크다며 다투어요. 이를 잠결에 들은 아씨는 깨어 일곱 동무를 깨우고 나서 일을 시작해요. 일곱 동무는 서로의 소중함을 알게 돼요.|1998년 출간됐어요. 조선 시대 규중칠우 이야기를 바탕으로 했어요.
소피가 화나면 정말 정말 화나면|몰리 뱅은 1943년생 미국의 그림책 작가예요.|소피는 언니와 장난감을 두고 다투다 고릴라 인형을 뺏겨 크게 화가 나요. 소피는 소리를 지르고 집을 뛰쳐나가 숲으로 가요. 숲에서 큰 나무에 올라 바람을 맞고 바다를 바라보며 마음을 가라앉혀요. 마음이 진정된 소피는 집으로 돌아와요. 가족은 소피를 따뜻하게 맞아 줘요.|1999년 출간됐고 칼데콧 아너를 받았어요. 화를 다스리는 법을 알려 줘요.
순이와 어린 동생|쓰쓰이 요리코는 1945년생 일본의 작가이고 하야시 아키코가 그림을 그렸어요.|엄마가 잠깐 외출한 사이 순이는 어린 동생을 돌봐요. 동생은 집 안에서 장난을 치고 순이는 동생을 달래며 놀아 줘요. 순이는 동생이 울면 달래고 손을 잡고 걸어요. 엄마가 돌아오자 순이는 한결 의젓해져요. 가족 사랑이 따뜻하게 담겨 있어요.|1977년 일본에서 출간됐어요.
깊은 밤 부엌에서|모리스 센닥은 1928년생 미국의 그림책 작가예요.|잠든 밤 미키는 이상한 소리에 눈을 떠 침대에서 떨어져요. 옷을 벗은 채 떨어진 미키는 우유병이 있는 이상한 부엌에 도착해요. 빵 굽는 사람 셋이 미키를 반죽에 넣어 케이크를 만들려 해요. 미키는 비행기를 만들어 우유를 가져와요. 미키는 침대로 돌아와 아침을 맞아요.|1970년 출간됐고 1971년 칼데콧 아너를 받았어요.
슈렉!|윌리엄 스타이그는 1907년생 미국의 작가이자 만화가예요.|못생긴 괴물 슈렉은 부모님 집을 떠나 모험을 해요. 슈렉은 마녀와 용, 기사들과 맞닥뜨리지만 겁먹지 않아요. 슈렉은 공주를 만나 결혼해요. 자신의 못생김을 당당하게 받아들이는 이야기예요.|1990년 출간됐어요. 영화 「슈렉」의 원작이에요.
치과 의사 드소토 선생님|윌리엄 스타이그는 1907년생 미국의 작가예요.|생쥐 드소토 선생님은 치과 의사로 큰 동물들도 치료해요. 어느 날 이가 아픈 여우가 찾아와요. 선생님은 여우가 치료 후 자신을 잡아먹을 것 같아 불안해해요. 선생님은 꾀를 내어 여우의 이를 풀로 붙여 입이 열리지 않게 해요. 여우는 어쩔 수 없이 선생님께 고맙다고 말해요.|1982년 출간됐고 1983년 뉴베리 아너를 받았어요.
당나귀 실베스터와 요술 조약돌|윌리엄 스타이그는 1907년생 미국의 작가예요.|당나귀 실베스터는 소원을 이뤄 주는 조약돌을 발견해요. 사자를 만난 실베스터는 놀라 바위로 변하게 해 달라고 빌어요. 조약돌은 땅에 떨어져 있어 실베스터는 다시 원래 모습으로 돌아가지 못해요. 부모님은 실베스터를 애타게 찾으며 기다려요. 시간이 흐른 뒤 소풍을 나온 부모가 조약돌을 발견하고 소원을 빌어 가족이 다시 만나요.|1969년 출간됐고 칼데콧상을 받았어요.
해리는 더러운 강아지|진 자이언은 1913년생 미국의 작가이고 마거릿 블로이 그레이엄이 그림을 그렸어요.|하얀 바탕에 검은 점이 있는 강아지 해리는 목욕이 싫어요. 해리는 솔을 땅에 숨기고 도망가 놀다 더러워져 검은 강아지가 돼요. 집에 돌아온 해리를 가족이 알아보지 못해요. 해리는 재주를 부려 보지만 알아보지 못하고 결국 솔을 가져와 목욕을 하자고 해요. 깨끗해진 해리를 가족이 알아봐요.|1956년 출간됐어요.
내가 아빠를 얼마나 사랑하는지 아세요?|샘 맥브래트니는 1943년생 아일랜드 출신의 작가예요.|아기 토끼가 큰 토끼에게 얼마나 사랑하는지 말하며 두 팔을 활짝 벌려요. 큰 토끼는 더 길게 팔을 벌려 사랑을 표현해요. 둘은 높이 뛰고 길게 뻗으며 사랑을 점점 크게 말해요. 아기 토끼는 달까지 갈 만큼 사랑한다고 말하다 잠이 들어요. 큰 토끼는 달까지 갔다 되돌아올 만큼 사랑한다고 속삭여요.|1994년 출간됐어요.
잘 자요, 달님|마거릿 와이즈 브라운은 1910년생 미국의 작가이고 클레멘트 허드가 그림을 그렸어요.|토끼가 잠자리에 들어요. 방 안에는 빨간 풍선, 그림, 벽난로 같은 물건들이 있어요. 아기 토끼는 방 안의 모든 것에게 잘 자라고 인사해요. 밤이 깊어 가며 방이 조금씩 어두워져요. 마지막에는 달님에게도 인사해요.|1947년 출간됐어요. 자기 전에 읽어 주기 좋은 책이에요.
눈 오는 날|에즈라 잭 키츠는 1916년생 미국의 그림책 작가예요.|아침에 일어난 피터는 창밖에 눈이 가득 쌓인 것을 봐요. 피터는 밖으로 나가 눈 위를 걸으며 놀아요. 눈 뭉치를 주머니에 넣어 집에 가져오지만 따뜻한 방에서 녹아 사라져요. 다음 날 눈이 더 내려 피터는 친구와 함께 놀러 나가요.|1962년 출간됐고 1963년 칼데콧상을 받았어요.
피터의 의자|에즈라 잭 키츠는 1916년생 미국의 그림책 작가예요.|피터는 동생 수잔이 태어나자 자신의 침대와 의자가 파란색으로 칠해져 동생 것이 되는 것을 보고 서운해해요. 피터는 아직 칠하지 않은 의자를 들고 집을 나가려 해요. 하지만 의자에 앉으려 보니 몸이 커져 앉을 수가 없어요. 피터는 집으로 돌아와 아빠와 함께 의자를 다시 칠해요. 동생의 존재를 받아들이게 돼요.|1967년 출간됐어요.
블루베리 따는 샐|로버트 맥클로스키는 1914년생 미국의 그림책 작가예요.|엄마와 딸 샐은 블루베리를 따러 언덕으로 가요. 같은 언덕에서는 엄마 곰과 새끼 곰도 블루베리를 따고 있어요. 샐과 새끼 곰은 각각 엄마와 헤어져 엉뚱한 엄마를 따라가요. 놀란 이들은 곧 실수를 알아채고 각자의 엄마를 찾아가요. 샐은 엄마와 만나 통에 블루베리를 가득 채워요.|1948년 출간됐고 칼데콧 아너를 받았어요.
부엉이와 보름달|제인 욜런은 1939년생 미국의 작가이고 존 쇤헤르가 그림을 그렸어요.|눈 오는 겨울 보름달이 뜬 밤 아이는 아빠와 함께 부엉이를 보러 숲에 가요. 둘은 말없이 눈 쌓인 숲길을 걸어요. 아이는 부엉이를 만나기 위해 조용히 해야 한다는 것을 알아요. 마침내 부엉이를 만나 서로를 바라봐요. 아빠와 아이의 따뜻한 마음을 담았어요.|1987년 출간됐고 칼데콧상을 받았어요.
엄마의 의자|베라 B. 윌리엄스는 1927년생 미국의 그림책 작가예요.|한 가족이 불이 난 집에서 모든 것을 잃어요. 이웃들의 도움으로 새 집에 이사하지만 편히 앉을 의자가 없어요. 엄마는 식당에서 일해 받은 팁을 병에 모으고 가족이 함께 동전을 모아요. 병이 가득 차자 가족은 가구점에 가서 큰 안락의자를 사요. 가족 모두가 의자에 앉아 행복해해요.|1982년 출간됐고 칼데콧 아너를 받았어요.
위층 할머니, 아래층 할머니|토미 드파올라는 1934년생 미국의 작가이자 화가예요.|토미의 집 위층에는 증조할머니가 살고 아래층에는 할머니가 살아요. 토미는 두 층을 오가며 함께 시간을 보내요. 위층 할머니는 아래층 할머니의 엄마이고 아주 늙으셨어요. 시간이 흐르며 위층 할머니는 세상을 떠나요. 토미는 할머니와의 추억을 간직해요.|1973년 출간됐어요. 죽음을 다룬 이야기예요.
코끼리 엘머|데이비드 매키는 1912년생 영국의 작가예요.|코끼리 엘머는 다른 코끼리들과 달리 알록달록 무늬가 있어요. 엘머는 자신이 다르다고 외로워해요. 엘머는 열매 즙으로 몸을 회색으로 칠하고 다른 코끼리들과 같은 모습이 돼요. 하지만 즐겁지 않아요. 비가 내려 색이 씻겨 나가자 엘머는 자신의 모습을 받아들이고 코끼리들은 엘머의 날을 만들어요.|1968년 출간됐어요. 다름을 존중하라는 메시지를 줘요.
스갱 아저씨네 염소|알퐁스 도데는 1840년생 프랑스의 작가예요.|스갱 아저씨네 염소 블랑케트는 줄에 매인 생활이 답답해 산으로 가고 싶어 해요. 밧줄을 끊고 산으로 간 블랑케트는 자유를 만끽해요. 날이 저물자 늑대가 나타나요. 블랑케트는 밤새 용감하게 싸우다 새벽에 쓰러져요. 자유를 위한 선택의 대가를 그린 이야기예요.|1869년 『풍차 방앗간 편지』에 실렸어요.
고 녀석 맛있겠다|미야니시 타쓰야는 1956년생 일본의 그림책 작가예요.|티라노사우루스는 알에서 갓 깬 아기 안킬로사우루스를 만나 맛있겠다고 말해요. 아기는 티라노사우루스를 아빠라고 부르며 따라와요. 티라노사우루스는 아기 안킬로를 돌보며 점점 정이 들어요. 아기가 다른 공룡에게 위협받자 티라노사우루스는 아기를 지켜 줘요. 둘은 서로를 소중히 여기게 돼요.|2003년 일본에서 출간됐어요.
만희네 집|권윤덕은 1959년생 그림책 작가예요.|만희네 집을 구석구석 보여 주는 그림책이에요. 방, 부엌, 마당 등의 모습이 상세하게 그려져요. 가족이 사는 방의 물건과 살림살이를 살펴볼 수 있어요. 집 안팎의 모습을 통해 우리의 생활 모습을 알 수 있어요.|1995년 출간됐어요.
줄무늬가 생겼어요|데이비드 섀넌은 1959년생 미국의 그림책 작가예요.|카밀라 콩은 콩을 좋아하지만 친구들이 이상하게 볼까 봐 말하지 못해요. 카밀라는 친구들의 말에 따라 입는 옷을 바꾸려고 고민해요. 이 고민에 몸에 줄무늬가 생기고 점점 이상한 모습으로 변해요. 의사들도 병을 고치지 못해요. 카밀라가 자신이 좋아하는 콩을 먹자 몸이 원래대로 돌아와요.|1998년 출간됐어요. 남의 시선보다 나다움이 중요하다는 이야기예요.
마녀 위니|밸러리 토머스는 1931년생 호주 출신의 작가이고 코키 폴이 그림을 그렸어요.|마녀 위니는 검은 고양이 윌버와 함께 온통 까만 집에서 살아요. 윌버가 검은색이라 카펫에서 눈에 안 띄어 위니가 자주 걸려 넘어져요. 위니는 마법으로 윌버를 여러 색으로 바꾸지만 윌버는 불편해해요. 위니는 다시 원래 색으로 돌려놓고 집을 알록달록하게 칠해요. 위니와 윌버는 행복하게 지내요.|1987년 출간됐어요.
이게 정말 사과일까?|요시타케 신스케는 1973년생 일본의 그림책 작가예요.|한 아이가 사과를 보고 이것이 정말 사과일까 생각해요. 아이는 사과 껍질과 속, 꼭지 등을 보며 다른 것을 상상해요. 상상은 점점 이어져 세상이 새롭게 보여요. 아이의 엉뚱한 생각이 이야기를 만들어 가요.|2013년 일본에서 출간됐어요.
도서관에 간 사자|미셸 누드슨은 미국의 작가이고 케빈 호크스가 그림을 그렸어요.|어느 날 도서관에 사자가 들어와요. 사서와 관장은 사자를 어떻게 해야 할지 고민해요. 사자는 도서관의 규칙을 잘 지키고 이야기 시간에도 조용히 앉아 있어요. 사자는 도서관에서 일을 도우며 사랑받아요. 어느 날 사서가 다치자 사자는 큰 소리로 도움을 청해요.|2006년 출간됐어요.
종이 봉지 공주|로버트 먼치는 1945년생 캐나다의 작가이고 마이클 마첸코가 그림을 그렸어요.|엘리자베스 공주는 로널드 왕자와 결혼할 예정이에요. 용이 나타나 성을 불태우고 로널드 왕자를 잡아가요. 공주는 종이 봉지를 입고 용을 찾아가 꾀를 써서 지치게 해요. 공주는 왕자를 구해 내지만 왕자는 공주의 모습을 나무라요. 공주는 왕자와 결혼하지 않고 혼자 길을 떠나요.|1980년 출간됐어요.
낮잠 자는 집|오드리 우드는 1948년생 미국의 작가이고 돈 우드가 그림을 그렸어요.|비 오는 날 할머니가 침대에서 낮잠을 자요. 아이가 올라와 자고, 개, 고양이, 생쥐가 차례로 올라와 함께 자요. 마지막에 벼룩이 올라와 할머니를 물어요. 침대가 무너져 모두 깨어나요. 모두가 깨어난 뒤 즐거운 시간이 시작돼요.|1984년 출간됐어요.
세 강도|토미 웅거러는 1931년생 프랑스 출신의 그림책 작가예요.|검은 망토를 입은 세 강도가 밤마다 마차를 습격해 보물을 모아요. 어느 날 마차에서 고아 소녀 티파니를 만나요. 강도들은 티파니를 데려가고 소녀는 보물을 보고 이 돈을 어디에 쓰냐고 물어요. 강도들은 보물로 고아들을 위한 성을 지어요. 고아들이 모여 살고 강도들은 마을을 지켜요.|1961년 출간됐어요.
우리 엄마|앤서니 브라운은 1946년생 영국의 그림책 작가예요.|한 아이가 자기 엄마가 얼마나 훌륭한지 이야기해요. 엄마는 맛있는 요리를 하고 아이를 따뜻하게 안아 줘요. 엄마는 마법사처럼 못하는 것이 없다고 해요. 아이는 엄마를 아주 사랑한다고 말해요.|2005년 출간됐어요.
꼬마 곰 코듀로이|돈 프리먼은 1908년생 미국의 작가예요.|백화점 장난감 코너에 코듀로이라는 곰 인형이 있어요. 코듀로이는 단추 하나가 없어 팔리지 않아요. 어느 날 소녀 리사가 코듀로이를 사려 하지만 엄마는 단추가 없다고 사지 않아요. 밤에 코듀로이는 단추를 찾으려 백화점을 헤매요. 다음 날 리사가 저금통을 털어 코듀로이를 사고 단추를 달아 줘요.|1968년 출간됐어요.
옛날 옛날에 파리 한 마리를 꿀꺽 삼킨 할머니가 살았는데요|심스 태백은 미국의 그림책 작가예요.|한 할머니가 파리를 꿀꺽 삼켜요. 파리를 잡으려고 거미를 삼키고 거미를 잡으려고 새를 삼켜요. 새를 잡으려고 고양이, 개, 염소, 소를 차례로 삼켜요. 마지막에 말을 삼킨 할머니는 어떻게 될까요? 반복되는 노래와 말이 재미있어요.|1997년 출간됐고 2000년 칼데콧 아너를 받았어요.
저마다 제 색깔|레오 리오니는 1910년생 네덜란드 출신의 그림책 작가예요.|카멜레온은 자신만의 색깔이 없다고 슬퍼해요. 앉는 곳마다 색이 바뀌어 외로워요. 카멜레온은 다른 카멜레온을 만나 함께 지내기로 해요. 둘은 같이 있으면 서로 색이 바뀌어도 함께라서 행복해져요. 친구와 함께 있는 즐거움을 이야기해요.|1960년 출간됐어요.
새앙쥐와 태엽쥐|레오 리오니는 1910년생 네덜란드 출신의 그림책 작가예요.|새앙쥐 알렉산더는 사람들 눈을 피해 숨어 사는 쥐예요. 어느 날 아이가 가지고 놀던 태엽쥐 윌리를 만나요. 알렉산더는 태엽쥐처럼 사랑받고 싶어 해요. 마법 도마뱀을 찾아가 태엽쥐가 되기를 빌려고 해요. 하지만 윌리를 위해 소원을 쓰려 해요.|1969년 출간됐고 칼데콧 아너를 받았어요.
아주 바쁜 거미|에릭 칼은 1929년생 미국의 그림책 작가예요.|어느 날 아침 거미는 바람에 실려 울타리에 닿아 거미줄을 치기 시작해요. 말, 소, 양, 염소 같은 동물이 와서 말을 걸지만 거미는 바빠서 대답하지 않아요. 거미는 열심히 거미줄을 완성해요. 마침내 파리가 날아와 걸리고 거미는 완성한 집에서 잠들어요. 거미줄이 점점 짜이는 모습을 만져 볼 수 있어요.|1984년 출간됐어요.
퉁명스러운 무당벌레|에릭 칼은 1929년생 미국의 그림책 작가예요.|새벽 다섯 시에 심술궂은 무당벌레가 잎사귀 위에서 다른 무당벌레를 만나요. 둘은 싸움을 하려다 다른 곳으로 가요. 무당벌레는 몸집이 큰 동물을 차례로 만나요. 시각마다 다른 동물이 등장하고 시간도 알 수 있어요. 마지막에는 무당벌레가 이웃에게 친절해져요.|1977년 출간됐어요. 시계 그림으로 시간을 익힐 수 있어요.
겁쟁이 빌리|앤서니 브라운은 1946년생 영국의 그림책 작가예요.|빌리는 겁이 많아 모자, 신발, 새, 비 등 모든 것이 걱정돼요. 밤이 되면 걱정에 잠을 이루지 못해요. 할머니는 빌리에게 걱정 인형을 선물해요. 걱정 인형에게 걱정을 말하면 대신 걱정해 준다고 해요. 빌리는 걱정 인형 덕분에 잠들 수 있어요.|1984년 출간됐어요.
검피 아저씨의 뱃놀이|존 버닝햄은 1936년생 영국의 그림책 작가예요.|검피 아저씨는 배를 타고 뱃놀이를 나가요. 아이들과 강아지, 토끼, 고양이, 염소, 돼지, 소, 양 등 여러 동물이 배에 타요. 동물들이 장난을 치며 배가 흔들리다가 뒤집혀요. 모두 물에 빠지지만 곧 뭍으로 나와요. 모두 모여 차를 마시고 따뜻하게 지내요.|1970년 출간됐어요.
마들린느|루드비히 베멀먼즈는 1898년생 오스트리아 출신의 작가예요.|파리의 오래된 집에 열두 명의 소녀가 선생님 미스 클라벨과 함께 살아요. 가장 작은 소녀 마들린느는 겁이 없어요. 어느 날 밤 마들린느는 맹장염에 걸려 병원에 가요. 병원에서 수술을 받고 돌아와 흉터를 자랑해요. 다른 소녀들도 병원에 가고 싶어 해요.|1939년 출간됐어요.
돌멩이 수프|마샤 브라운은 1918년생 미국의 그림책 작가예요.|굶주린 병사 셋이 마을에 들어와 먹을 것을 구해요. 마을 사람들은 먹을 것을 숨기고 아무것도 없다고 해요. 병사들은 돌멩이로 수프를 끓이겠다고 해요. 호기심이 생긴 마을 사람들이 양파와 당근 등을 하나씩 가져와요. 모두가 함께 맛있는 수프를 만들어 나눠 먹어요.|1947년 출간됐고 칼데콧 아너를 받았어요.
내 짝꿍 최영대|채인선은 우리나라 동화 작가이고 그림은 정순희가 그렸어요.|4월 어느 날 시골에서 영대가 전학을 와요. 영대는 행동이 느리고 수업 시간과 쉬는 시간에도 거의 말을 하지 않아요. 늘 같은 옷을 입고 다니고 씻는 모습도 잘 보이지 않아 반 아이들은 영대를 놀리며 '굼벵이 바보'라고 불러요. 영대는 놀림을 받아도 반응하지 않고 조용히 지내요. 결국 여자아이들이 선생님께 영대와 짝이 되기 싫다고 부탁하고 영대는 혼자 앉게 돼요.|재미마주에서 1997년 펴냈어요. 저자가 딸에게 들은 이야기를 바탕으로 했고 따돌리기보다 관심을 갖고 도와야 한다는 메시지를 전해요.
내 동생 싸게 팔아요|임정자는 우리나라 동화 작가이고 그림은 김영수가 그렸어요.|짱짱이는 얄미운 동생을 자전거 뒤에 태우고 시장에 동생을 팔러 가요. 장난감 가게 언니, 꽃집 할아버지, 빵집 아줌마에게 동생이 얼마나 말썽을 피우는지 늘어놓자 아무도 동생을 사려 하지 않아요. 짱짱이는 친구 순이에게 동생을 공짜로 주겠다고 하지만 순이도 싫다고 해요. 순이에게 동생의 장점을 하나씩 꼽아 보다 동생이 아깝다는 생각이 들어 동생을 팔려던 마음을 거둬요. 집에 돌아가는 길에 동생은 다시 말썽을 부려요.|형제자매 사이의 미묘한 감정을 재미있게 그린 그림책이에요.
고구마구마|사이다는 그림책 작가로 첫 그림책 『가래떡』을 냈어요.|밭에서 고구마 덩굴을 뽑아 올리자 모양이 제각각인 고구마들이 고개를 내밀고 저마다 자기소개를 해요. 둥근 것, 긴 것, 큰 것, 작은 것처럼 생김새를 말하는 리듬감 있는 표현이 이어져요. 굽은 고구마, 배가 나온 고구마, 털이 많은 고구마 같은 독특한 고구마들이 당당하게 '나도 고구마구마!' 하고 외쳐요. 이어서 고구마를 찌거나 구워 먹는 즐거움과 먹고 난 뒤 생기는 우스운 상황이 나와요. 겉모습이 평범하지 않아도 저마다 빛나는 면이 있다는 이야기를 담았어요.|2017년 '반달 그림책' 시리즈로 나왔어요. 아이들과 밭에서 고구마를 캔 관찰이 바탕이 됐어요.
훨훨 간다|권정생은 1937년생 아동 문학가예요. 그림은 김용철이 그렸어요.|깊은 산골 외딴집에 할머니와 할아버지가 살아요. 할아버지는 밭일을 하고 할머니는 집에서 길쌈을 해요. 할아버지가 돌아오면 할머니는 재미있는 이야기를 해 달라고 조르지만 할아버지는 이야기를 할 줄 몰라요. 어느 날 할머니는 꾀를 내어 할아버지에게 무명 한 필을 주며 '이야기 한 자리'와 바꿔 오라고 해요. 할아버지가 무명을 재미있는 이야기와 바꿔 올 수 있을지가 이 책의 흥미로운 점이에요.|국민서관에서 펴냈고 초등학교 교과서에 실린 이야기예요. 결말은 책으로 확인해 주세요.
삐약이 엄마|백희나는 1971년생 그림책 작가로 2020년 아스트리드 린드그렌 기념상을 받았어요.|길고양이 니양이 알을 삼켰다가 병아리를 낳게 돼요. 그렇게 니양과 아기 병아리 삐삐는 특별하고 다정한 생활을 함께 시작해요. 둘은 거친 길거리를 헤쳐 나가며 서로를 부르는 법을 배워요. 서로에게 살아가는 이유가 되어 줘요. 작고 노랗고 따뜻한 삐약이처럼 이야기는 독자의 마음에 오래 남아요.|출판사 소개를 바탕으로 정리했어요. 자세한 전개는 책으로 확인해 주세요.
</script>
<script>
const LEVELS=[["k","유치원"],["e","초등"],["m","중등"],["h","고등"],["u","대학"],["g","일반"]];
const BANK={};
for(const [id,name] of LEVELS){
  const raw=document.getElementById("d-"+id).textContent.split("\n");const books=[];let cur=null;
  for(const l of raw){const s=l.trim();if(!s)continue;
    if(s.startsWith("# ")){const [t,a,g]=s.slice(2).split("|");cur={t,a,g,lv:id,q:[]};books.push(cur);continue}
    const [body,ex]=s.split("\t");const p=body.split("|");const ty=p[0];let q=null;
    if(ty==="O"||ty==="X")q={ty:"ox",text:p[1],ans:ty};
    else if(ty==="M")q={ty:"mc",text:p[1],ans:p[2],opts:p.slice(2,6)};
    else if(ty==="S")q={ty:"sa",text:p[1],ans:p[2],alts:p.slice(2)};
    if(q){q.ex=ex||"";cur.q.push(q)}
  }
  BANK[id]=books;
}
const INTRO={};{let lv=null;for(const l of document.getElementById("d-intro").textContent.split("\n")){const x=l.trim();if(!x)continue;if(x[0]==="@"){lv=x.slice(1);INTRO[lv]=INTRO[lv]||{};continue}const p=x.split("|");if(lv&&p.length>=4)INTRO[lv][p[0]]={a:p[1],s:p[2],i:p[3]}}}
const RECS={};{let lv=null;for(const l of document.getElementById("d-recs").textContent.split("\n")){const s=l.trim();if(!s)continue;if(s[0]==="@"){lv=s.slice(1);RECS[lv]=[];continue}const [t,a,src]=s.split("|");RECS[lv].push({t,a,src})}}
const store={get(k,d){try{const v=localStorage.getItem("gb_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("gb_"+k,JSON.stringify(v))}catch(e){}}};
const S={lv:store.get("lv","e"),genre:"전체",q:"",timer:store.get("timer",true),elim:store.get("elim",false)};
const $=s=>document.querySelector(s);const view=$("#view");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().replace(/[\s.,·~!?'"()\-_「」『』]/g,"");
let total=0,totalB=0;for(const id in BANK){totalB+=BANK[id].length;BANK[id].forEach(b=>total+=b.q.length)}
$("#stats").innerHTML=`도서 <b>${totalB}</b>권 · 문제 <b>${total.toLocaleString()}</b>개`;

function home(){
  const books=BANK[S.lv];const genres=["전체",...new Set(books.map(b=>b.g))];
  if(!genres.includes(S.genre))S.genre="전체";
  const lvName=LEVELS.find(l=>l[0]===S.lv)[1];
  view.innerHTML=`<div class="stage">
   <div class="levels" role="group" aria-label="단계">${LEVELS.map(([id,n])=>`<button class="lv" data-lv="${id}" aria-pressed="${id===S.lv}"><span class="n">${n}</span><span class="c">${BANK[id].length}권 · ${BANK[id].reduce((s,b)=>s+b.q.length,0)}문제</span></button>`).join("")}</div>
   <div class="bar" role="group" aria-label="장르">${genres.map(g=>`<button class="chip" data-g="${esc(g)}" aria-pressed="${g===S.genre}">${esc(g)}</button>`).join("")}</div>
   <div class="bar">${COMMUNITY?`<button class="btn ghost" id="cmOpen">✍️ 문제 내기 · 🚩 오류 제보 <small>(구글 로그인)</small></button>`:""}</div>
   <div class="bar"><input id="search" class="search" type="search" placeholder="도서 제목·작가 검색" value="${esc(S.q)}" aria-label="도서 검색"></div>
   <div class="actions">
     <button class="btn ghost" id="list">📋 ${lvName} 권장도서 목록</button>
     <button class="btn primary" id="rand">${lvName}${S.genre==="전체"?"":" · "+esc(S.genre)} 랜덤 골든벨 20문제</button>
     <div class="opts">
       <label><input type="checkbox" id="optTimer" ${S.timer?"checked":""}> 20초 제한</label>
       <label><input type="checkbox" id="optElim" ${S.elim?"checked":""}> 틀리면 탈락</label>
     </div>
   </div>
   <div class="grid" id="grid"></div>
   <p class="note">권당 약 10문제(OX·4지선다·단답형), 대작은 50문제 안팎으로 풀 때마다 20문제씩 무작위 출제. 단답형은 띄어쓰기를 무시하고 채점하며, 표기가 달라 틀린 것으로 나오면 '정답 인정'을 누르세요.</p>
  </div>`;
  drawGrid();
  view.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{S.lv=b.dataset.lv;S.genre="전체";store.set("lv",S.lv);home()});
  view.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.genre=b.dataset.g;home()});
  $("#search").oninput=e=>{S.q=e.target.value;drawGrid()};
  $("#optTimer").onchange=e=>{S.timer=e.target.checked;store.set("timer",S.timer)};
  $("#optElim").onchange=e=>{S.elim=e.target.checked;store.set("elim",S.elim)};
  $("#list").onclick=()=>recList();
  const co=$("#cmOpen");if(co)co.onclick=()=>contrib("new",null);
  cur=null;drawAuth();
  $("#rand").onclick=()=>{const pool=filtered().flatMap(b=>b.q.map(q=>({...q,book:b.t,lv:b.lv})));
    start(shuffle(pool).slice(0,20),{title:`${lvName}${S.genre==="전체"?"":" · "+S.genre} 랜덤 골든벨`,key:null})};
}
function recList(){
  const lvName=LEVELS.find(l=>l[0]===S.lv)[1];const books=BANK[S.lv];const recs=RECS[S.lv]||[];
  const byG={};books.forEach((b,i)=>(byG[b.g]=byG[b.g]||[]).push([b,i]));
  window.scrollTo(0,0);
  view.innerHTML=`<div class="stage"><div class="qhead"><div class="crumb"><button class="btn ghost" id="lback">← 돌아가기</button> &nbsp;<b>${lvName} 권장도서 목록</b></div></div>
   <section class="rl"><h2>도서관 추천 도서 (2026)</h2>
   <p class="note0">국립중앙도서관·국립어린이청소년도서관 사서추천도서에서 이 단계에 맞는 책을 골랐어요. 아직 문제가 없는 책이에요.</p>
   <ul>${recs.map(r=>`<li><b>${esc(r.t)}</b>${r.a?` · ${esc(r.a)}`:""}<span class="src">${esc(r.src)}</span></li>`).join("")||"<li>준비 중</li>"}</ul></section>
   ${Object.entries(byG).map(([g,arr])=>`<section class="rl"><h2>${esc(g)} <small>${arr.length}권</small></h2><ol>${arr.map(([b,i])=>`<li><button class="rlb" data-i="${i}">${esc(b.t)}</button> <span class="a">${esc(b.a)}</span></li>`).join("")}</ol></section>`).join("")}
   <div class="bar"><button class="btn ghost" id="lprint">인쇄하기</button></div></div>`;
  $("#lback").onclick=home;$("#lprint").onclick=()=>window.print();
  view.querySelectorAll(".rlb").forEach(el=>el.onclick=()=>openBook(books[+el.dataset.i]));
}
function filtered(){const q=norm(S.q);return BANK[S.lv].filter(b=>(S.genre==="전체"||b.g===S.genre)&&(!q||norm(b.t+b.a).includes(q)))}
function drawGrid(){
  const list=filtered();const g=$("#grid");
  if(!list.length){g.innerHTML=`<p class="empty">찾는 책이 없습니다. 검색어나 장르를 바꿔 보세요.</p>`;return}
  g.innerHTML=list.map((b,i)=>{const best=store.get("best_"+b.lv+"_"+b.t,null);
    return `<button class="book" data-i="${BANK[S.lv].indexOf(b)}"><span class="t">${esc(b.t)}</span><span class="a">${esc(b.a)}</span>${(INTRO[b.lv]||{})[b.t]?`<span class="ib">📖 소개 있음</span>`:""}
    <span class="meta"><span class="tag">${esc(b.g)}</span><span>${b.q.length>BIG?`<span class="best">대작 · ${b.q.length}문제</span>`:best!=null?`<span class="best ${best===b.q.length?"full":""}">최고 ${best}/${b.q.length}</span>`:`${b.q.length}문제`}</span></span></button>`}).join("");
  g.querySelectorAll(".book").forEach(el=>el.onclick=()=>openBook(BANK[S.lv][+el.dataset.i]));
}

const BIG=20;
function openBook(b){const it=(INTRO[b.lv]||{})[b.t];if(!it&&!COMMUNITY)return playBook(b);
  const n=b.q.length>BIG?BIG+"문제 무작위 (전체 "+b.q.length+"문제)":b.q.length+"문제";window.scrollTo(0,0);
  view.innerHTML=`<div class="stage"><div class="qhead"><div class="crumb"><button class="btn ghost" id="iback">← 목록</button></div></div>
  <article class="intro"><div><h2>${esc(b.t)}</h2><div class="by">${esc(b.a)} · ${esc(b.g)}</div></div>
  ${it?`<section><h3>작가 소개</h3><p>${esc(it.a)}</p></section><section><h3>줄거리</h3><p>${esc(it.s)}</p></section><section><h3>이슈와 중요사항</h3><p>${esc(it.i)}</p></section>`:`<p class="note">이 책의 소개문은 아직 없어요.</p>`}
  <div class="go"><button class="btn primary" id="igo">골든벨 풀기 · ${n}</button>${COMMUNITY?` <button class="btn ghost" id="inew">✍️ 문제 내기</button> <button class="btn ghost" id="irep">🚩 오류 제보</button>`:""}</div></article></div>`;
  $("#iback").onclick=home;$("#igo").onclick=()=>playBook(b);
  const pre={lv:b.lv,book:b.t,back:()=>openBook(b)};const i1=$("#inew");if(i1)i1.onclick=()=>contrib("new",pre);const i2=$("#irep");if(i2)i2.onclick=()=>contrib("rep",pre)}
function playBook(b){const qs=b.q.map(q=>({...q,book:b.t,lv:b.lv}));
  if(qs.length>BIG)start(shuffle(qs).slice(0,BIG),{title:`${b.t} · ${b.q.length}문제 중 ${BIG}문제`,key:null,book:b});
  else start(qs,{title:b.t,key:"best_"+b.lv+"_"+b.t,book:b})}
let R=null,tick=null;
function start(qs,meta){R={qs:qs.map(q=>q.ty==="mc"?{...q,opts:shuffle(q.opts)}:q),i:0,res:[],meta,out:false};window.scrollTo(0,0);showQ()}
function stopTimer(){if(tick){cancelAnimationFrame(tick);tick=null}}
function showQ(){
  stopTimer();const q=R.qs[R.i];const n=R.qs.length;
  const kind={ox:"OX",mc:"4지선다",sa:"단답형"}[q.ty];
  let body="";
  if(q.ty==="ox")body=`<div class="ox"><button class="oxb o" data-v="O" aria-label="O">O</button><button class="oxb x" data-v="X" aria-label="X">X</button></div>`;
  else if(q.ty==="mc")body=`<div class="choices">${q.opts.map((o,k)=>`<button class="ch" data-v="${esc(o)}"><span class="k">${"①②③④"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  else body=`<form class="sa" id="saf"><input id="sain" autocomplete="off" placeholder="정답을 쓰세요"><button class="btn primary" type="submit">제출</button></form>`;
  view.innerHTML=`<div class="stage">
    <div class="qhead"><div class="crumb"><button class="btn ghost" id="quit">← 목록</button> &nbsp;<b>${esc(R.meta.title)}</b></div>
    <div class="dots">${R.qs.map((_,k)=>`<i class="${k<R.res.length?(R.res[k].ok?"g":"b"):k===R.i?"c":""}"></i>`).join("")}</div></div>
    <section class="board" aria-live="polite">
      <div class="qno">제 ${R.i+1} 문제 <span class="kind">${kind}</span>${R.meta.key?"":`<span class="kind">${esc(q.book)}</span>`}</div>
      ${S.timer?`<div class="timer"><i id="tbar"></i></div>`:""}
      <div class="qtext">${esc(q.text)}</div>
      ${body}

     <form class="frm" id="rf"><label>어떤 문제인가요?<select id="rk">${KINDS.map(k=>`<option>${esc(k)}</option>`).join("")}</select></label>
      <label>설명<textarea id="rn" rows="3" maxlength="300" required placeholder="무엇이 왜 틀렸는지 알려 주세요"></textarea></label>
      <details><summary>고친 내용 직접 제안하기 <small>(선택 · 2명이 동의하면 자동으로 반영돼요. “부적절한 내용”은 3명)</small></summary>
       <label>고친 문제 문장<input id="rft" maxlength="300"></label>
       <label>고친 정답${q.ty==="ox"?`<select id="rfa"><option value="">(그대로)</option><option>O</option><option>X</option></select>`:`<input id="rfa" maxlength="60">`}</label>
       <label>고친 해설<input id="rfe" maxlength="300"></label></details>
      <div class="bar"><button class="btn primary" type="submit" id="rs">제보하기</button><button class="btn ghost" type="button" id="mx">취소</button></div></form></div>`;
    $("#mx").onclick=close;
    $("#rf").onsubmit=async e=>{e.preventDefault();const fix={};const t=$("#rft").value.trim(),a=$("#rfa").value.trim(),x=$("#rfe").value.trim();
      if(t)fix.text=t;if(a)fix.ans=a;if(x)fix.ex=x;$("#rs").disabled=true;
      const doc={lv:c.lv,book:c.book,orig:q.text,kind:$("#rk").value,note:$("#rn").value.trim(),fix,by:nick()||"익명",uid:ME.uid,agree:[]};
      try{const ref=await FB.db.collection("gb_reports").add({...doc,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
        CM.r.push({...doc,id:ref.id});toast("제보가 접수됐어요. 고마워요!");close()}
      catch(err){toast("제보하지 못했어요 ("+(err.code||"오류")+")");$("#rs").disabled=false}}};
  draw()}

function introModal(lv,book,it){
  const m=document.createElement("div");m.className="modal";document.body.appendChild(m);const close=()=>m.remove();
  m.innerHTML=`<div class="mbox"><h3>소개 오류 제보</h3><p class="qorig"><b>${esc(book)}</b><br><small>작가 소개 · 줄거리 · 이슈와 중요사항 중 틀린 부분을 알려 주세요.</small></p>
   <form class="frm" id="irf"><label>어느 부분인가요?<select id="ik"><option>작가 소개</option><option>줄거리</option><option>이슈와 중요사항</option></select></label>
   <label>무엇이 틀렸나요?<textarea id="in" rows="4" maxlength="300" required placeholder="틀린 내용과 바른 내용을 알려 주세요 (예: 출간 연도, 수상 내역, 인물 이름)"></textarea></label>
   <div class="bar"><button class="btn primary" type="submit" id="irs">제보하기</button><button class="btn ghost" type="button" id="imx">취소</button></div></form></div>`;

    catch(err){toast("제보하지 못했어요 ("+(err.code||"오류")+")");$("#irs").disabled=false}}}
function tabList(body){
  const rs=CM.r.slice().reverse();
  if(!rs.length){body.innerHTML=`<p class="note">아직 제보가 없어요.</p>`;return}
  body.innerHTML=`<p class="note">제보자 말고 다른 이용자 1명이 더 동의하면 확인된 것으로 보고, 수정안이 있으면 문제에 반영돼요. “부적절한 내용” 제보는 제보자를 포함해 3명이 동의하면 그 문제가 삭제돼요.</p>`+rs.slice(0,100).map(r=>{
    const n=1+(r.agree||[]).length,ok=confirmed(r),mine=ME&&(r.uid===ME.uid||(r.agree||[]).includes(ME.uid));
    const gone=ok&&r.kind===BAD&&!restored(r),rest=ok&&r.kind===BAD&&restored(r);
    const aps=CM.ap.filter(a=>a.rid===r.id),myap=ME&&aps.some(a=>a.uid===ME.uid);
    const st=rest?"복원됨":ok?(r.kind===BAD?"삭제됨":r.fix&&Object.keys(r.fix).length?"정정 반영됨":"확인됨"):`동의 ${n}/${need(r)}`;
    return `<div class="rq"><div><span class="kind ${ok?"okk":""}">${st}</span> <b>${esc(r.book)}</b> · ${esc(r.kind)}<div class="note0">${esc(r.orig)}</div><div>${esc(r.note)}</div>${r.fix&&Object.keys(r.fix).length?`<div class="note0">제안: ${[r.fix.text&&"문제 “"+esc(r.fix.text)+"”",r.fix.ans&&"정답 “"+esc(r.fix.ans)+"”",r.fix.ex&&"해설 수정"].filter(Boolean).join(" · ")}</div>`:""}<div class="note0">제보자 ${esc(r.by||"익명")}</div></div>
     ${gone?`<div class="note0">이의 신청 ${aps.length}건</div>${ADMIN?aps.map(a=>`<div class="note0">↳ ${esc(a.by||"익명")}: ${esc(a.note)}</div>`).join(""):""}`:""}</div>
     <div class="col">${ok||mine?"":`<button class="lnk" data-id="${r.id}">👍 동의</button>`}${gone&&!myap?`<button class="lnk" data-ap="${r.id}">이의 신청</button>`:""}${gone&&ADMIN?`<button class="lnk" data-rs="${r.id}">✅ 복원</button>`:""}${rest&&ADMIN?`<button class="lnk" data-un="${r.id}">다시 삭제</button>`:""}</div></div>`}).join("");
  body.querySelectorAll("button[data-ap]").forEach(el=>el.onclick=()=>{if(!ME){login();return}appealModal(CM.r.find(r=>r.id===el.dataset.ap))});
  body.querySelectorAll("button[data-rs]").forEach(el=>el.onclick=async()=>{const r=CM.r.find(r=>r.id===el.dataset.rs);
    try{await FB.db.collection("gb_restores").doc(r.id).set({lv:r.lv,book:r.book,orig:r.orig,uid:ME.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      CM.s.push({id:r.id});mergeCommunity();toast("복원했어요. 새로고침하면 문제가 다시 나타나요.");contrib("list")}
    catch(err){toast("복원하지 못했어요 ("+(err.code||"오류")+")")}});
  body.querySelectorAll("button[data-un]").forEach(el=>el.onclick=async()=>{
    try{await FB.db.collection("gb_restores").doc(el.dataset.un).delete();CM.s=CM.s.filter(x=>x.id!==el.dataset.un);mergeCommunity();toast("다시 삭제 상태로 돌렸어요.");contrib("list")}
    catch(err){toast("처리하지 못했어요 ("+(err.code||"오류")+")")}});
  body.querySelectorAll("button[data-id]").forEach(el=>el.onclick=async()=>{
    if(!ME){await login();return}
    try{await FB.db.collection("gb_reports").doc(el.dataset.id).update({agree:firebase.firestore.FieldValue.arrayUnion(ME.uid)});
      const r=CM.r.find(r=>r.id===el.dataset.id);r.agree=[...(r.agree||[]),ME.uid];mergeCommunity();toast("동의했어요.");contrib("list")}
    catch(err){toast("처리하지 못했어요 ("+(err.code||"오류")+")")}})}
const GRADES=[[0,"새싹 독자"],[1,"책 친구"],[3,"책 탐험가"],[6,"책 수집가"],[10,"독서 박사"],[20,"독서 달인"],[35,"독서 고수"],[55,"독서 대가"],[80,"책의 현자"],[120,"골든벨 마스터"]];
function gradeOf(n){let g=0;GRADES.forEach(([m],i)=>{if(n>=m)g=i});return g}
function gradeTxt(n){const g=gradeOf(n);return `Lv.${g+1} ${GRADES[g][1]}`}
function qCounts(){const c={};for(const x of CM.q){if(isGone(x.lv,x.book,x.text))continue;const e=c[x.uid]||(c[x.uid]={n:0,by:""});e.n++;if(x.by)e.by=x.by}return c}
function tabRank(body){
  const c=qCounts(),arr=Object.entries(c).map(([uid,e])=>({uid,...e})).sort((a,b)=>b.n-a.n).slice(0,30);
  const me=ME&&c[ME.uid]?c[ME.uid].n:0;
  body.innerHTML=`<p class="note">낸 문제 수에 따라 등급이 올라가요. 삭제된 문제는 세지 않아요.</p>
   <div class="rq"><div><b>등급표</b><div class="note0">${GRADES.map(([m,n],i)=>`Lv.${i+1} ${n}(${m}개~)`).join(" · ")}</div></div></div>
   ${ME?`<div class="rq"><div><b>내 등급</b> ${gradeTxt(me)} · 낸 문제 ${me}개${gradeOf(me)<9?`<div class="note0">다음 등급까지 ${GRADES[gradeOf(me)+1][0]-me}개</div>`:""}</div></div>`:""}
   <h3 class="sh">랭킹 (상위 30명)</h3>
   ${arr.map((e,i)=>`<div class="rq"><div><b>${i+1}위</b> ${esc(e.by||"익명")} <span class="kind">${gradeTxt(e.n)}</span><div class="note0">낸 문제 ${e.n}개</div></div></div>`).join("")||`<p class="note">아직 문제를 낸 사람이 없어요.</p>`}`}
function tabMe(body){
  if(!ME){body.innerHTML=needLogin();wireLogin();return}
  const mq=CM.q.filter(x=>x.uid===ME.uid),mr=CM.r.filter(x=>x.uid===ME.uid);
  const my=mq.filter(x=>!isGone(x.lv,x.book,x.text)).length;
  body.innerHTML=`<p class="note">내 등급 <b>${gradeTxt(my)}</b> · 내가 낸 문제 <b>${mq.length}</b>개 · 내가 한 제보 <b>${mr.length}</b>건</p>
   <h3 class="sh">내가 낸 문제</h3>${mq.map(x=>`<div class="rq"><div><b>${esc(x.book)}</b> <span class="note0">${LEVELS.find(l=>l[0]===x.lv)[1]}</span><div>${esc(x.text)}</div><div class="note0">정답: ${esc(x.ans)}</div></div><button class="lnk" data-del="${x.id}">삭제</button></div>`).join("")||`<p class="note">아직 낸 문제가 없어요.</p>`}
   <h3 class="sh">내가 한 제보</h3>${mr.map(r=>`<div class="rq"><div><b>${esc(r.book)}</b> · ${esc(r.kind)}<div class="note0">${esc(r.note)}</div></div><span class="kind ${confirmed(r)?"okk":""}">${confirmed(r)?"확인됨":"동의 "+(1+(r.agree||[]).length)+"/"+need(r)}</span></div>`).join("")||`<p class="note">아직 제보가 없어요.</p>`}`;
  body.querySelectorAll("[data-del]").forEach(el=>el.onclick=async()=>{if(!confirm("이 문제를 삭제할까요?"))return;
    try{await FB.db.collection("gb_questions").doc(el.dataset.del).delete();const id=el.dataset.del;CM.q=CM.q.filter(x=>x.id!==id);
      for(const l in BANK)BANK[l].forEach(b=>{b.q=b.q.filter(q=>q.id!==id)});
      for(const l in BANK)BANK[l]=BANK[l].filter(b=>b.q.length||!b.user);recount();toast("삭제했어요.");contrib("me")}
    catch(err){toast("삭제하지 못했어요 ("+(err.code||"오류")+")")}})}
if(COMMUNITY){fbInit().then(()=>{drawAuth()});loadCommunity()}

home();
