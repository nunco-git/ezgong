마당을 나온 암탉|황선미는 1963년생 동화 작가예요.|암탉 잎싹은 알을 낳기만 하는 양계장 생활이 싫어 마당에서 자유롭게 살고 싶어 해요. 병들어 양계장에서 버려진 잎싹은 구덩이에서 살아남아 마당으로 나와요. 청둥오리가 낳고 간 알을 품어 아기 오리 초록머리를 키우게 돼요. 초록머리는 자라 날아오르고 잎싹은 끝까지 족제비에게서 아이를 지켜요. 마지막에는 족제비 새끼들을 위해 자신의 몸을 내어주어요.|2000년 출간됐고 애니메이션 영화로도 만들어졌어요.
너도 하늘말나리야|이금이는 1962년생 동화 작가예요.|소희는 부모님이 이혼한 뒤 외할머니 댁이 있는 시골로 이사해요. 같은 반 친구 미르는 어머니가 일찍 집을 나가 아버지와 살고 바우는 부모 사정으로 홀로 지내요. 세 아이는 서로의 상처를 모른 채 가까워지고 마음을 열기 시작해요. 하늘말나리 꽃은 하늘을 보고 피는 꽃이에요. 아이들은 서로의 아픔을 이해하며 조금씩 성장해요.|2005년 출간됐어요. 가족과 우정, 상처를 다뤄요.
아낌없이 주는 나무|셸 실버스타인은 1930년생 미국의 작가예요.|한 그루 사과나무는 소년을 사랑해서 잎과 열매로 즐거움을 줘요. 소년이 자라자 나무에게 돈이 필요하다고 해요. 나무는 사과를 팔라고 줘요. 이후 소년이 집을 지으려 하자 가지를, 배를 만들려 하자 줄기를 내어줘요. 늙은 소년이 돌아왔을 때 나무는 그루터기만 남았지만 그가 앉아 쉴 수 있게 해 줘요.|1964년 출간됐어요. 사랑과 희생을 다뤄요.
샬롯의 거미줄|E. B. 화이트는 1899년생 미국의 작가예요.|농장 소녀 펀은 새끼 돼지 윌버를 살려 줘요. 윌버는 크게 자라면 식탁에 오를 운명에 놓여요. 헛간의 거미 샬롯은 윌버를 살리기 위해 거미줄에 '대단한 돼지', '멋진', '빛나는' 같은 말을 짜 넣어요. 사람들은 윌버를 특별한 돼지로 여기고 그는 박람회에서 상을 받아 목숨을 건져요. 샬롯은 알을 낳고 세상을 떠나지만 윌버는 샬롯의 새끼들과 함께 지내요.|1952년 출간됐어요. 우정과 죽음을 다뤄요.
책 먹는 여우|프란치스카 비어만은 1963년생 독일의 작가예요.|여우는 책을 읽는 것이 아니라 소금과 후추를 뿌려 먹는 것을 좋아해요. 가난해서 도서관에서 책을 훔쳐 먹다가 쫓겨나요. 배가 고픈 여우는 먹을 책이 없어 직접 책을 쓰기 시작해요. 책을 쓰고 이를 읽는 즐거움을 알게 된 여우는 이야기를 만드는 일에 빠져들어요. 책을 먹는 것보다 책을 쓰는 일의 즐거움이 더 크다는 것을 깨달아요.|1997년 독일에서 출간됐어요.
갈매기에게 나는 법을 가르쳐 준 고양이|루이스 세풀베다는 1949년생 칠레의 작가예요.|항구 도시 함부르크에서 검은 고양이 소르바스는 기름에 오염된 갈매기 켕가를 만나요. 켕가는 죽기 전에 알을 낳고 소르바스에게 세 가지를 약속하게 해요. 알을 먹지 않을 것, 알을 돌볼 것, 새끼에게 나는 법을 가르칠 것이에요. 소르바스는 친구 고양이들의 도움을 받아 아기 갈매기 아포르뚜나다를 돌봐요. 마침내 고양이들은 갈매기가 하늘로 날아오르는 순간을 맞이해요.|1996년 출간됐어요.
프린들 주세요|앤드루 클레먼츠는 1949년생 미국의 작가예요.|초등학교 5학년 닉은 장난이 심한 아이예요. 국어 시간에 사전을 중요하게 생각하는 그레인저 선생님을 놀리려고 펜을 '프린들'이라고 부르기로 해요. 친구들도 프린들이라는 말을 따라 쓰고 선생님은 처음에는 막으려 해요. 말은 점점 퍼져 신문과 방송에 오르고 상품으로까지 팔려요. 시간이 지나 닉은 말이 만들어지는 힘과 선생님의 깊은 뜻을 깨달아요.|1996년 출간됐어요.
내 이름은 삐삐 롱스타킹|아스트리드 린드그렌은 1907년생 스웨덴의 작가예요.|아홉 살 삐삐는 엄마도 아빠도 없이 말과 원숭이 닐슨 씨와 함께 '뒤죽박죽 별장'에서 혼자 살아요. 삐삐는 힘이 세고 거짓말을 잘하며 어른들의 잔소리를 겁내지 않아요. 이웃집 토미와 아니카는 삐삐와 친구가 돼 모험을 해요. 도둑을 쫓아내고 서커스에서 힘자랑을 하고 학교에 가려다 규칙에 맞지 않아 소동이 벌어져요. 삐삐는 자유롭고 씩씩하게 살아가요.|1945년 출간됐어요.
찰리와 초콜릿 공장|로알드 달은 1916년생 영국의 작가예요.|가난한 소년 찰리 버킷은 초콜릿을 좋아하지만 사 먹을 형편이 되지 않아요. 괴짜 초콜릿 장인 윌리 웡카가 초콜릿 속에 숨긴 황금 티켓 다섯 장을 가진 아이에게 공장을 구경시켜 준다고 발표해요. 찰리는 극적으로 다섯 번째 티켓을 얻어 할아버지와 함께 공장에 가요. 욕심 많은 아이들은 공장의 신기한 기계 때문에 한 명씩 곤란을 겪어요. 마지막에 웡카는 정직한 찰리에게 공장을 물려주기로 해요.|1964년 출간됐어요.
마틸다|로알드 달은 1916년생 영국의 작가예요.|마틸다는 책을 좋아하고 영리하지만 부모는 텔레비전만 보고 딸을 무시해요. 학교에서는 무서운 교장 트런치불이 아이들을 괴롭혀요. 마틸다는 따뜻한 허니 선생님을 만나요. 마틸다는 화가 나면 물건을 움직이는 초능력이 있다는 것을 깨닫고 교장을 혼내 줘요. 교장은 학교를 떠나고 마틸다는 허니 선생님과 함께 살게 돼요.|1988년 출간됐어요.
해리 포터와 마법사의 돌|J. K. 롤링은 1965년생 영국의 작가예요.|이모네 집 계단 밑 벽장에서 구박받으며 자란 해리 포터는 열한 살 생일에 호그와트 입학 통지서를 받아요. 그는 자신이 부모를 죽인 볼드모트를 물리친 아기였다는 사실을 알게 돼요. 호그와트에서 론, 헤르미온느와 친구가 되고 퀴디치 선수로 활약해요. 세 친구는 학교에 숨겨진 마법사의 돌을 지키기 위해 비밀 통로를 돌파해요. 해리는 돌을 노리는 볼드모트와 맞서 이겨요.|1997년 영국에서 출간됐어요.
사자와 마녀와 옷장|C. S. 루이스는 1898년생 영국의 작가예요.|전쟁을 피해 시골 교수 집에 간 페번시 네 남매는 낡은 옷장 속에서 눈 덮인 나라 나니아를 발견해요. 나니아는 하얀 마녀가 지배해 겨울만 계속되고 크리스마스도 오지 않아요. 막내 에드먼드는 마녀의 마법 과자에 속아 형제를 배신해요. 사자 아슬란은 에드먼드를 구하기 위해 대신 희생되었다가 되살아나요. 남매는 아슬란과 함께 마녀를 물리치고 나니아의 왕과 여왕이 돼요.|1950년 출간됐어요.
피노키오|카를로 콜로디는 1826년생 이탈리아의 작가예요.|제페토 할아버지가 만든 나무 인형 피노키오는 말썽꾸러기예요. 학교에 가는 대신 인형극을 구경하고 나쁜 친구들과 어울려요. 거짓말을 할 때마다 코가 길어지고 고래 뱃속에서 제페토를 만나요. 피노키오는 잘못을 뉘우치고 착한 아이가 되려고 노력해요. 마침내 진짜 사람 아이가 돼요.|1883년 출간됐어요.
오즈의 마법사|L. 프랭크 바움은 1856년생 미국의 작가예요.|캔자스에 사는 소녀 도로시는 회오리바람에 휩쓸려 개 토토와 함께 오즈의 나라에 떨어져요. 도로시는 집으로 돌아가는 방법을 알려 줄 마법사를 만나러 노란 벽돌길을 걸어가요. 길에서 뇌가 없는 허수아비, 심장이 없는 양철 나무꾼, 겁쟁이 사자를 만나 함께 여행해요. 에메랄드 시에 도착해 서쪽 마녀를 물리치는 임무를 맡아요. 도로시는 은 구두의 힘으로 집에 돌아와요.|1900년 출간됐어요.
플랜더스의 개|위다는 1839년생 영국의 작가예요.|벨기에 플랜더스에서 가난한 소년 넬로는 할아버지와 우유 배달을 하며 개 파트라슈와 함께 살아요. 넬로는 그림 그리는 것을 좋아하지만 오해로 마을 사람들의 외면을 받아요. 소년은 안트베르펜 성당의 루벤스 그림을 보고 싶어 하지만 돈이 없어 보지 못해요. 크리스마스 이브에 넬로와 파트라슈는 눈 속을 헤매다 성당에 들어가 그림을 보며 숨을 거둬요.|1872년 출간됐어요. 소년과 개의 죽음이 나와요.
톰 소여의 모험|마크 트웨인은 1835년생 미국의 작가예요.|미시시피 강가 마을의 장난꾸러기 소년 톰은 이모의 울타리 페인트칠을 친구들에게 떠넘겨요. 톰은 친구 허클베리 핀과 함께 한밤중 묘지에서 살인 사건을 목격하고 그 비밀을 지키려 해요. 아이들은 해적 놀이를 한다며 섬으로 도망쳤다가 자신들의 장례식에 몰래 나타나 마을을 놀라게 해요. 톰과 베키는 동굴에서 길을 잃고 악당 조를 만나 위기를 겪어요. 결국 톰은 보물을 찾고 영웅이 돼요.|1876년 출간됐어요.
이상한 나라의 앨리스|루이스 캐럴은 1832년생 영국의 작가예요.|지루해하던 앨리스는 시계를 보며 뛰어가는 흰 토끼를 따라 굴속으로 떨어져요. 앨리스는 몸이 커졌다 작아지는 약을 먹으며 이상한 나라를 헤매요. 체셔 고양이, 모자 장수, 하트 여왕 같은 이상한 인물들을 만나요. 하트 여왕은 걸핏하면 '목을 쳐라'고 외쳐요. 재판에서 앨리스가 소리치자 카드들이 날아오르고 앨리스는 꿈에서 깨어나요.|1865년 출간됐어요.
80일간의 세계 일주|쥘 베른은 1828년생 프랑스의 작가예요.|영국 신사 필리어스 포그는 클럽 친구들과 80일 안에 세계를 일주할 수 있다고 내기를 해요. 그는 하인 파스파르투와 함께 런던을 떠나 수에즈, 인도, 홍콩, 요코하마, 샌프란시스코, 뉴욕을 거쳐 돌아오는 여정에 올라요. 은행 강도로 오해받아 형사 픽스에게 쫓기고 인도에서는 아우다 부인을 구해 줘요. 우여곡절 끝에 런던에 하루 늦게 도착한 줄 알았지만 날짜 변경선 덕분에 하루를 벌어 내기에 이겨요.|1872년 출간됐어요.
몽실 언니|권정생은 1937년생 동화 작가예요.|6·25 전쟁 전후를 배경으로 가난한 집안의 소녀 몽실은 어머니의 재혼으로 새아버지 집에 가게 돼요. 새아버지의 폭력으로 다리를 다치고 절름발이가 돼요. 몽실은 배다른 동생 난남이를 돌보며 힘든 시대를 살아가요. 전쟁으로 가족을 잃고도 굳세게 버텨요. 어려움 속에서도 사람을 사랑하는 마음을 잃지 않아요.|1984년 출간됐어요. 전쟁과 폭력이 나와요.
괭이부리말 아이들|김중미는 1963년생 작가예요.|인천 만석동 괭이부리말은 가난한 사람들이 모여 사는 동네예요. 쌍둥이 숙자와 숙희, 동수와 동준 형제 같은 아이들이 이 동네에서 자라요. 동수는 어려운 집안 형편 때문에 방황하다 소년원에 가기도 해요. 영호 선생님과 이웃 어른들은 아이들을 따뜻하게 보살펴 줘요. 아이들은 서로를 의지하며 희망을 찾아가요.|2000년 출간됐어요. 가난과 비행, 우정을 다뤄요.
긴긴밤|루리는 1980년대 후반생 작가예요.|코뿔소 노든은 동물원에서 자라다가 인간에게서 벗어나 마지막 흰바위코뿔소로 살아가요. 노든은 홀로 남은 펭귄 알을 돌보게 돼요. 알에서 나온 아기 펭귄은 노든과 함께 바다를 찾아 먼 길을 떠나요. 가는 길에 코끼리 무리와 앙가부 같은 이들을 만나요. 노든은 자신이 겪은 긴긴밤의 이야기를 아기 펭귄에게 들려주며 세상을 떠나요.|2021년 출간됐어요. 죽음이 나와요.
초정리 편지|배유안은 1957년생 작가예요.|조선 세종 시대 어린 소년 장운이는 고아가 돼 이웃에 살아요. 글을 모르는 장운이는 한글을 처음 만들던 때 훈민정음을 만나요. 한글은 쉬워서 장운이도 곧 읽고 쓸 수 있게 돼요. 장운이는 세종대왕이 초정리 약수터에 와 있다는 소문을 듣고 한글로 편지를 써요. 한글이 백성을 위해 만들어진 소중한 글자임을 알게 돼요.|2006년 출간됐어요.
수일이와 수일이|김우경은 1932년생 동화 작가예요.|초등학생 수일이는 학원과 공부에 지쳐요. 어느 날 쥐에게 손톱을 먹이자 수일이를 닮은 가짜 수일이가 나타나 대신 학교에 가요. 수일이는 마음껏 놀지만 가짜 수일이가 부모님 사랑을 받고 진짜 수일이는 쫓겨나요. 수일이는 외롭고 힘들게 지내다가 진짜와 가짜가 맞서요. 결국 자신이 누구인지 깨닫고 수일이는 가족 곁으로 돌아가요.|1987년 출간됐어요.
꽃들에게 희망을|트리나 폴러스는 1931년생 미국의 작가예요.|애벌레 줄무늬는 먹기만 하는 삶에 의문을 느끼고 애벌레 기둥 꼭대기에 무엇이 있는지 보려 기어올라요. 기둥에는 수많은 애벌레가 서로 밟으며 올라가요. 줄무늬는 노랑 애벌레를 만나 올라가는 것을 잠시 멈추고 풀밭에서 지내요. 하지만 기둥 꼭대기에 대한 궁금증으로 다시 올라가지만 아무것도 없었어요. 노랑 애벌레는 고치가 되어 나비로 변하고 줄무늬도 결국 나비가 돼요.|1972년 출간됐어요.
리디아의 정원|사라 스튜어트는 1937년생 미국의 작가예요.|대공황 시기에 소녀 리디아 그레이스는 아버지가 실직하자 삼촌 짐의 빵집으로 가서 일을 도와요. 리디아는 꽃을 사랑하는 아이로 가는 길에도 꽃씨를 가져가 가꾸어요. 삼촌의 어두운 가게 옥상에서 비밀로 정원을 만들어 가요. 삼촌은 꽃 덕분에 웃음을 되찾아요. 리디아의 정원은 모두에게 희망을 줘요.|1997년 출간된 그림책이에요.
멋진 여우 씨|로알드 달은 1916년생 영국의 작가예요.|여우 씨는 아내와 아이들을 위해 세 농장주 보기스, 번스, 빈의 농장에서 닭과 거위를 훔쳐요. 세 농부는 화가 나 여우를 잡으려고 총과 삽으로 여우 굴을 파요. 여우 가족은 굴을 파고 땅속으로 더 깊이 도망쳐요. 여우 씨는 굴을 파 농장의 지하 저장고로 이어지는 길을 만들어 음식을 가져와요. 다른 동물 가족들도 함께 잔치를 즐겨요.|1970년 출간됐어요.
내 친구 꼬마 거인|로알드 달은 1916년생 영국의 작가예요.|고아 소녀 소피는 한밤중에 거인을 보고 거인에게 붙잡혀 가요. 이 거인은 다른 거인과 달리 사람을 먹지 않는 착한 꼬마 거인 BFG예요. BFG는 꿈을 잡아 아이들에게 불어넣는 일을 해요. 사람을 잡아먹는 다른 거인들을 막기 위해 소피는 영국 여왕에게 도움을 청해요. 군대의 도움으로 거인들은 붙잡혀 갇혀요.|1982년 출간됐어요.
제임스와 거대한 복숭아|로알드 달은 1916년생 영국의 작가예요.|부모를 잃은 제임스는 심술궂은 이모들에게 구박받으며 살아요. 어느 날 마법의 약을 흘려 정원의 복숭아나무에서 거대한 복숭아가 자라요. 제임스는 복숭아 속에서 큰 곤충 친구들을 만나요. 복숭아가 언덕을 굴러 이모들을 깔아뭉개고 바다 위를 떠다녀요. 제임스와 친구들은 갈매기들에게 이끌려 뉴욕까지 날아가요.|1961년 출간됐어요.
스튜어트 리틀|E. B. 화이트는 1899년생 미국의 작가예요.|리틀 씨 부부의 둘째 아들로 태어난 스튜어트는 쥐처럼 생긴 아기예요. 몸이 작아도 용감한 스튜어트는 형 조지와 가족과 지내요. 고양이 스노벨의 괴롭힘이나 위험한 모험을 겪어요. 어느 날 새 마가로를 만나 사랑하게 되지만 그녀가 사라지자 스튜어트는 그녀를 찾아 길을 떠나요. 끝나지 않는 여행 속에서 이야기가 마무리돼요.|1945년 출간됐어요.
꼬마 니콜라|르네 고시니는 1926년생 프랑스의 작가, 장자크 상페는 삽화가예요.|이 책은 짧은 이야기를 모은 책이라 구성으로 소개해요. 장난꾸러기 소년 니콜라와 친구들이 학교와 집에서 벌이는 소동을 담았어요. 선생님을 곤란하게 하는 일, 친구와 싸우다 화해하는 일, 가족과의 에피소드가 나와요. 어른들이 보기엔 엉뚱하지만 아이들 세계에서는 진지한 일들이에요. 유머와 따뜻함이 가득해요.|1959년부터 출간됐어요.
나무를 심은 사람|장 지오노는 1895년생 프랑스의 작가예요.|여행자 '나'는 프로방스의 황량한 산에서 양치기 엘제아르 부피에를 만나요. 부피에는 매일 도토리 백 개를 골라 땅에 심으며 홀로 숲을 가꾸고 있었어요. 세월이 흘러 두 번의 전쟁이 지나가는 동안 부피에는 계속 나무를 심어요. 황무지는 푸른 숲으로 변하고 물이 흐르며 마을에 사람들이 돌아와요. 사람들은 이 숲이 한 사람의 노력으로 만들어진 줄 모른 채 살아가요.|1953년 발표됐어요.
해리 포터와 비밀의 방|J. K. 롤링은 1965년생 영국의 작가예요.|해리는 호그와트 2학년이 되고 학교에서는 학생들이 석화되는 사건이 일어나요. 벽에는 '비밀의 방이 열렸다. 후계자의 적이여, 조심하라'는 글이 적혀 있어요. 해리는 뱀의 말을 알아듣는 능력 때문에 의심을 받아요. 해리와 론은 지니가 사라지자 비밀의 방을 찾아 들어가 거대한 바실리스크와 마주해요. 해리는 일기장의 정체와 볼드모트의 과거를 알게 돼요.|1998년 출간됐어요.
해리 포터와 아즈카반의 죄수|J. K. 롤링은 1965년생 영국의 작가예요.|해리가 3학년이 될 무렵 위험한 죄수 시리우스 블랙이 아즈카반에서 탈옥했다는 소식이 들려요. 블랙이 해리를 노린다는 소문에 학교는 디멘터를 경비로 세워요. 해리는 새 선생님 루핀에게 방어술을 배우며 힘을 길러요. 해리는 사실 블랙이 아버지의 친구였고 진짜 배신자는 따로 있다는 것을 알게 돼요. 해리와 헤르미온느는 시간을 되돌려 블랙을 구하러 나서요.|1999년 출간됐어요.
피터 팬|J. M. 배리는 1860년생 스코틀랜드의 작가예요.|영원히 어른이 되지 않는 소년 피터 팬은 그림자를 찾으러 런던 달링 가의 아이들 방에 나타나요. 피터 팬은 웬디, 존, 마이클 남매를 네버랜드로 데려가요. 네버랜드에는 요정 팅커벨, 잃어버린 아이들, 인디언, 해적선 선장 후크가 있어요. 웬디가 후크에게 붙잡히자 피터 팬이 구하러 와서 후크를 물리쳐요. 웬디와 동생들은 집으로 돌아가고 피터는 네버랜드에 남아요.|1911년 소설로 출간됐어요.
비밀의 화원|프랜시스 호지슨 버넷은 1849년생 영국계 미국 작가예요.|인도에서 부모를 잃은 메리 레녹스는 영국 요크셔의 삼촌 저택으로 와요. 메리는 외롭고 까다로운 아이였지만 정원사 벤 웨더스태프와 마녀 같은 지빠귀를 만나요. 메리는 잠긴 정원의 열쇠와 문을 발견하고 마을 소년 디콘의 도움으로 정원을 가꿔요. 병약한 사촌 콜린도 정원에 와서 건강해져요. 아이들은 정원과 함께 변화하고 콜린의 아버지도 돌아와요.|1911년 출간됐어요.
소공녀|프랜시스 호지슨 버넷은 1849년생 영국계 미국 작가예요.|인도에서 온 부유한 소녀 세라 크루는 런던의 기숙학교에 들어가요. 그러나 아버지가 사업 실패로 죽자 세라는 하녀가 돼 다락방으로 쫓겨나요. 세라는 배고픔과 추위를 견디며 상상력으로 마음의 품위를 지켜요. 옆집 인도 신사가 알고 보니 아버지의 친구였고 세라를 찾고 있었어요. 세라는 다시 풍요로운 생활을 하게 되지만 이웃을 돕는 마음을 잊지 않아요.|1905년 출간됐어요.
소공자|프랜시스 호지슨 버넷은 1849년생 영국계 미국 작가예요.|뉴욕에서 어머니와 가난하게 살던 소년 세드릭 에롤은 영국의 귀족 도린코트 백작의 후계자라는 사실을 알게 돼요. 세드릭은 어머니와 함께 영국으로 가서 완고한 할아버지와 만나요. 세드릭의 착하고 맑은 마음은 할아버지의 굳은 마음을 녹여요. 한때 세드릭의 상속을 의심하는 사람이 나타나지만 진실이 밝혀져요. 할아버지는 세드릭의 어머니를 받아들이고 가족이 행복하게 지내요.|1886년 출간됐어요.
빨간 머리 앤|루시 모드 몽고메리는 1874년생 캐나다의 작가예요.|고아 앤 셜리는 캐나다 프린스에드워드 섬 초록 지붕 집의 매슈와 마릴라 남매에게 입양돼요. 남매는 사내아이를 원했지만 앤을 키우기로 해요. 앤은 상상력이 풍부하고 말이 많으며 실수도 많아요. 친구 다이애나, 길버트와의 일을 겪으며 학교를 다니고 자라나요. 매슈가 세상을 떠난 뒤 앤은 마릴라를 돕기 위해 진학 대신 집에 남기로 해요.|1908년 출간됐어요.
작은 아씨들|루이자 메이 올콧은 1832년생 미국의 작가예요.|남북 전쟁 중 마치 가의 네 자매 메그, 조, 베스, 에이미는 아버지가 전쟁터에 나가 어머니와 함께 살아요. 가난하지만 서로 돕고 크리스마스에 이웃을 돕는 모습으로 성장해요. 작가 지망생 조는 이웃집 로리와 친구가 돼요. 베스는 병으로 세상을 떠나고 자매들은 각자의 길을 찾아가요. 조는 작가의 꿈을 키우며 새로운 인연을 만나요.|1868년 출간됐어요.
키다리 아저씨|진 웹스터는 1876년생 미국의 작가예요.|고아원에서 자란 소녀 주디 애벗은 익명의 후원자 덕에 대학에 가게 돼요. 후원자는 매달 편지를 쓰라는 조건을 걸고 주디는 '키다리 아저씨'라고 부르며 편지를 보내요. 주디는 대학 생활과 친구들 이야기를 즐겁게 적어요. 졸업을 앞두고 주디는 자신을 사랑해 주는 저비스 펜들턴을 만나요. 알고 보니 후원자가 바로 저비스였어요.|1912년 출간됐어요.
하이디|요한나 슈피리는 1827년생 스위스의 작가예요.|고아 하이디는 이모 손에 이끌려 알프스 산골 할아버지에게 맡겨져요. 하이디는 염소지기 페터와 함께 알프스의 자연에서 행복하게 지내요. 이모가 하이디를 프랑크푸르트의 부유한 집으로 데려가 휠체어 소녀 클라라의 친구가 돼요. 하이디는 알프스가 그리워 병이 나고 결국 돌아와요. 클라라가 알프스에 찾아와 건강을 되찾는 기적이 일어나요.|1880년 출간됐어요.
정글북|러디어드 키플링은 1865년생 영국의 작가예요.|인도 정글에서 늑대 가족에게 길러진 인간 소년 모글리가 자라요. 곰 발루와 흑표범 바기라가 모글리에게 정글의 법칙을 가르쳐요. 호랑이 시어칸은 모글리를 미워하고 죽이려 해요. 모글리는 늑대 무리의 도움으로 시어칸을 물리치고 인간 마을로 돌아가려고 해요. 인간과 정글 사이에서 갈등하며 성장해요.|1894년 출간됐어요.
15소년 표류기|쥘 베른은 1828년생 프랑스의 작가예요.|뉴질랜드의 기숙학교 소년 열다섯 명이 요트를 타고 놀다가 폭풍에 밀려 무인도에 표류해요. 소년들은 학년이 가장 높은 고든과 브리앙, 도니펜 등이 서로 의견 차이로 갈등해요. 섬에서 오두막을 짓고 사냥과 농사로 생존하며 규칙을 정해요. 악당들이 섬에 나타나 소년들은 위험에 빠지지만 힘을 합쳐 이겨 내요. 끝내 소년들은 배를 만나 고향으로 돌아가요.|1888년 출간됐어요.
로빈슨 크루소|대니얼 디포는 1660년생 영국의 작가예요.|선원 로빈슨 크루소는 폭풍으로 배가 난파돼 홀로 무인도에 떠내려가요. 그는 배에서 가져온 물건으로 집을 짓고 염소를 기르고 곡식을 심으며 살아가요. 28년 동안 섬에서 지내다 식인종에게서 원주민 청년을 구해 '프라이데이'라 이름 짓고 하인으로 삼아요. 마침내 지나가는 영국 배의 도움을 받아 고향으로 돌아와요.|1719년 출간됐어요.
보물섬|로버트 루이스 스티븐슨은 1850년생 스코틀랜드의 작가예요.|소년 짐 호킨스는 여관에서 죽은 해적의 상자에서 보물 지도를 발견해요. 짐은 의사 리브시와 지주 트렐로니와 함께 보물섬으로 항해를 떠나요. 요리사 롱 존 실버는 알고 보니 해적의 우두머리였고 선원들과 함께 반란을 꾀해요. 섬에서 짐은 용기와 기지로 위험을 헤쳐 가며 보물을 찾아내요. 실버는 도망가고 일행은 보물을 갖고 돌아와요.|1883년 출간됐어요.
크리스마스 캐럴|찰스 디킨스는 1812년생 영국의 작가예요.|구두쇠 스크루지는 크리스마스에도 직원 밥 크래칫을 박대하고 조카의 초대도 거절해요. 크리스마스 이브 밤, 죽은 동업자의 유령이 찾아와 세 유령이 올 것이라고 경고해요. 과거의 유령은 어린 시절을, 현재의 유령은 크래칫 가족의 가난을, 미래의 유령은 쓸쓸한 죽음을 보여 줘요. 스크루지는 눈을 뜨고 크리스마스 아침에 마음을 바꿔요. 그는 이웃과 직원을 도우며 따뜻한 사람이 돼요.|1843년 출간됐어요.
왕자와 거지|마크 트웨인은 1835년생 미국의 작가예요.|16세기 런던에서 거지 소년 톰 캔티와 에드워드 왕자는 얼굴이 똑같은 것을 알고 옷을 바꿔 입어 봐요. 그러다 둘의 처지가 뒤바뀌어 왕자는 거리로 쫓겨나고 톰은 궁에서 왕자로 대접받아요. 왕자는 가난한 백성의 삶을 겪으며 가난과 부당한 법의 현실을 알게 돼요. 에드워드는 대관식 날 궁에 돌아와 자신의 신분을 입증해요. 왕이 된 에드워드는 백성에게 자비로운 정치를 펴요.|1881년 출간됐어요.
마지막 수업|알퐁스 도데는 1840년생 프랑스의 작가예요.|알자스 지방 소년 프란츠는 학교 가기를 싫어하는 장난꾸러기예요. 어느 날 학교에 가니 마을 어른들이 모여 있고 아멜 선생님이 예복을 입고 있어요. 선생님은 프로이센의 명령으로 내일부터 독일어만 가르치게 되어 오늘이 마지막 프랑스어 수업이라고 말해요. 프란츠는 자신이 공부를 소홀히 한 것이 후회돼요. 아멜 선생님은 칠판에 '프랑스 만세'라고 쓰고 수업을 마쳐요.|1873년 발표됐어요.
큰 바위 얼굴|너새니얼 호손은 1804년생 미국의 작가예요.|어느 마을의 산에 큰 바위 얼굴이 새겨져 있고 언젠가 그 얼굴을 닮은 위대한 인물이 나타날 것이라는 전설이 있어요. 소년 어니스트는 그 얼굴을 바라보며 사람이 오기를 기다려요. 부자 개더골드, 장군 올드 블러드, 정치가 올드 스톤 페이스와 시인이 등장하지만 모두 큰 바위 얼굴이 아니었어요. 어니스트는 평생 겸손하고 선하게 살며 설교자로 이름을 알려요. 마침내 시인이 어니스트의 얼굴이 큰 바위 얼굴을 닮았다고 말해요.|1850년 발표됐어요.
시튼 동물기|어니스트 톰프슨 시턴은 1860년생 캐나다 출신의 박물학자예요.|이 책은 동물 이야기를 모은 책이라 구성으로 소개해요. 늑대왕 로보, 여우 도미노, 회색 곰 와프, 토끼 등 야생 동물의 삶을 생생하게 그려요. 로보 이야기는 사람과 늑대의 대결을 보여 주고 마지막에는 슬픈 사연이 나와요. 동물을 영웅으로 그려 자연과 생명의 소중함을 알려 줘요. 저자의 관찰과 사냥 경험이 바탕이에요.|1898년 출간된 『내가 아는 야생동물』 등에서 모은 이야기예요.
파브르 곤충기|장 앙리 파브르는 1823년생 프랑스의 곤충학자예요.|이 책은 관찰 기록이라 구성으로 소개해요. 파브르가 쇠똥구리, 벌, 매미, 사마귀 같은 곤충의 행동을 직접 관찰하고 실험한 내용을 담았어요. 쇠똥구리가 똥을 굴리는 모습, 나나니벌이 사냥하는 모습 등이 나와요. 곤충의 본능과 지능을 알기 쉽게 설명해요. 자연을 사랑하는 마음을 일깨워 줘요.|1879년부터 30여 년에 걸쳐 10권으로 출간됐어요.
해리 포터와 불의 잔|J. K. 롤링은 1965년생 영국의 작가예요.|호그와트에서 세 학교의 우승자가 겨루는 트라이위저드 대회가 열려요. 나이 제한 때문에 출전할 수 없는 해리의 이름이 불의 잔에서 네 번째 선수로 나와요. 해리는 용, 호수의 인어, 미로 같은 과제를 하나씩 이겨 내요. 마지막 미로 과제에서 해리와 세드릭은 우승컵을 함께 잡았다가 묘지로 이동해요. 그곳에서 볼드모트가 부활하고 세드릭은 목숨을 잃어요.|2000년 출간됐어요. 시리즈가 어두워지는 전환점이 된 권이에요.
해리 포터와 불사조 기사단|J. K. 롤링은 1965년생 영국의 작가예요.|볼드모트의 부활을 인정하지 않는 마법부는 해리를 거짓말쟁이로 몰아요. 호그와트에는 마법부 파견 교사 엄브릿지가 와서 학생들을 억압해요. 해리는 학생들과 비밀 모임 '덤블도어의 군대'를 만들어 방어술을 가르쳐요. 신비부에서 예언 구슬을 두고 죽음을 먹는 자들과 싸우다 시리우스가 목숨을 잃어요. 해리는 자신과 볼드모트가 이어져 있다는 예언의 내용을 알게 돼요.|2003년 출간됐어요.
해리 포터와 혼혈 왕자|J. K. 롤링은 1965년생 영국의 작가예요.|해리는 6학년이 되어 낡은 마법약 교과서에서 '혼혈 왕자'의 메모를 발견하고 수업에서 두각을 나타내요. 덤블도어는 해리에게 볼드모트의 과거 기억을 보여 주며 그가 영혼을 나누어 숨긴 호크룩스를 찾아야 한다고 알려 줘요. 드레이코 말포이는 죽음을 먹는 자의 임무를 맡아 고민해요. 덤블도어는 가짜 호크룩스를 찾는 여행 끝에 천문대 탑에서 스네이프의 손에 쓰러져요. 해리는 호크룩스를 파괴하러 떠나기로 결심해요.|2005년 출간됐어요.
해리 포터와 죽음의 성물|J. K. 롤링은 1965년생 영국의 작가예요.|해리는 론, 헤르미온느와 학교를 떠나 볼드모트의 호크룩스를 찾아 파괴하는 여정에 올라요. 세 사람은 추적을 피하며 위험을 겪고 죽음의 성물에 관한 전설을 알게 돼요. 호그와트에 돌아온 해리는 학교를 지키려는 사람들과 함께 대규모 전투에 나서요. 스네이프의 기억을 통해 자신이 마지막 호크룩스라는 진실을 알게 돼요. 해리는 스스로를 희생하려는 용기로 볼드모트를 물리쳐요.|2007년 출간된 시리즈 마지막 권이에요. 전투와 죽음이 나와요.
나니아 연대기: 마법사의 조카|C. S. 루이스는 1898년생 영국의 작가예요.|런던에 사는 디고리와 폴은 앤드루 삼촌이 만든 마법 반지를 끼고 다른 세계로 가게 돼요. 두 아이는 폐허가 된 세계 찬에서 마녀 제이디스를 깨워 런던으로 데려오는 실수를 저질러요. 아이들은 마녀와 함께 어둠 속의 세계에 이르러 사자 아슬란이 나니아를 노래로 창조하는 모습을 봐요. 디고리는 아슬란의 부탁으로 사과를 구해 나니아를 마녀로부터 지켜요. 가져온 사과 씨앗에서 자란 나무가 훗날 옷장이 돼요.|1955년 출간됐어요. 나니아의 시작을 다루는 이야기예요.
메리 포핀스|P. L. 트래버스는 1899년생 영국계 오스트레일리아의 작가예요.|런던 체리 트리 가의 뱅크스 집안에 동풍을 타고 우산을 든 유모 메리 포핀스가 찾아와요. 메리 포핀스는 엄격하지만 아이들을 데리고 신기한 일을 보여 줘요. 굴뚝 청소부 버트, 웃음 가스에 떠오르는 아저씨 같은 이웃이 등장해요. 이 일들은 아이들만 기억하고 메리 포핀스는 모른 척해요. 바람이 바뀌자 메리 포핀스는 우산을 타고 떠나요.|1934년 출간됐어요.
곰돌이 푸|A. A. 밀른은 1882년생 영국의 작가예요.|소년 크리스토퍼 로빈은 100에이커 숲에서 곰 인형 푸, 아기 돼지 피글렛, 당나귀 이요르 같은 친구들과 어울려요. 푸는 꿀을 좋아해 풍선을 타고 벌집에 다가가다 곤란해지기도 해요. 폭풍우가 몰아치는 날 이요르의 꼬리를 찾아 주거나 친구를 위해 생일 선물을 준비해요. 순진하고 엉뚱한 푸의 생각이 친구들 사이에 소동을 일으키지만 결국 서로 돕는 이야기로 끝나요.|1926년 출간됐어요.
거울 나라의 앨리스|루이스 캐럴은 1832년생 영국의 작가예요.|앨리스는 집의 벽난로 위 거울을 통과해 거울 나라로 들어가요. 그곳은 체스 판처럼 이루어져 있고 앨리스는 졸이 되어 여왕이 되려는 여행을 해요. 붉은 여왕, 트위들덤과 트위들디, 험프티 덤프티 같은 이상한 인물들을 만나요. 모든 것이 거꾸로 움직이는 세계에서 앨리스는 말장난과 논리의 모순을 겪어요. 마지막에 여왕이 된 앨리스는 소동 끝에 꿈에서 깨어나요.|1871년 출간됐어요.
아라비안나이트|작자 미상의 중동 지역 설화 모음이에요.|이 책은 이야기 모음이라 구성으로 소개해요. 아내의 배신에 상처받은 샤리아르 왕은 매일 새 신부를 맞아 하룻밤 뒤 죽여요. 셰에라자드는 왕에게 재미있는 이야기를 들려주며 천 하룻밤 동안 목숨을 이어가요. 알라딘과 요술 램프, 신드바드의 모험, 알리바바와 40인의 도적이 대표 이야기예요. 천일 동안 이야기를 들은 왕은 마음을 돌려요.|『천일야화』라고도 해요. 여러 시대의 이야기가 모여 전해져요.
톰 아저씨의 오두막|해리엇 비처 스토는 1811년생 미국의 작가예요.|켄터키의 선량한 흑인 노예 톰은 주인의 빚 때문에 다른 곳으로 팔려 가요. 배 위에서 소녀 에바의 목숨을 구해 에바 아버지 집에서 지내지만 에바가 병으로 죽고 주인도 사고로 숨져요. 톰은 잔인한 주인 레글리에게 팔려 학대를 받아요. 톰은 도망친 노예를 숨겨 주다 매를 맞아 죽어 가며 레글리를 용서해요. 이 책은 노예제에 대한 반감을 키웠어요.|1852년 출간됐어요. 폭력과 차별이 나와요.
엄마 찾아 삼만 리|에드몬도 데 아미치스는 1846년생 이탈리아의 작가예요.|이탈리아 제노바의 소년 마르코는 가난한 집을 위해 아르헨티나로 일하러 간 어머니의 소식이 끊기자 어머니를 찾아 나서요. 마르코는 배를 타고 바다를 건너 아르헨티나에 가서 어머니가 있다는 도시를 찾아가요. 도중에 길을 잃고 돈이 떨어지지만 이웃의 도움을 받아요. 마침내 병든 어머니를 만나 눈물의 재회를 해요.|『사랑의 학교』의 한 이야기예요.
집 없는 아이|엑토르 말로는 1830년생 프랑스의 작가예요.|버려진 아이 레미는 양어머니 곁에서 자라다 가난한 양아버지 때문에 떠돌이 악사 비탈리스 할아버지에게 팔려 가요. 레미는 개 카피와 원숭이 조리쾨르와 함께 거리에서 노래하며 떠돌아요. 비탈리스가 추운 겨울에 죽자 레미는 홀로 남게 돼요. 이후 여러 사람을 만나며 가족을 찾아 헤매고 마침내 진짜 부모와 만나요.|1878년 출간됐어요.
눈의 여왕|한스 크리스티안 안데르센은 1805년생 덴마크의 동화 작가예요.|마법 거울 조각이 눈에 들어간 소년 카이는 마음이 차갑게 변해 눈의 여왕을 따라가 버려요. 소녀 게르다는 카이를 찾으러 길을 떠나 마법사의 정원, 까마귀, 공주, 도둑 소녀를 만나요. 게르다의 따뜻한 눈물은 카이의 눈과 마음에 박힌 조각을 녹여 줘요. 두 아이는 손을 잡고 집으로 돌아와 어른이 되어도 마음은 어린아이처럼 맑아요.|1844년 발표됐어요.
호두까기 인형|E. T. A. 호프만은 1776년생 독일의 작가예요.|크리스마스 이브에 소녀 클라라는 대부 드로셀마이어가 준 호두까기 인형을 받아요. 한밤중 클라라 앞에서 장난감들이 살아 움직이고 인형은 쥐의 왕과 전투를 벌여요. 클라라가 신발을 던져 쥐의 왕을 쓰러뜨리자 인형은 사실 저주에 걸린 청년이었다고 말해요. 인형은 클라라를 인형 나라로 데려가요. 클라라는 훗날 저주가 풀린 청년과 결혼한다는 이야기가 이어져요.|1816년 출간됐고 차이콥스키의 발레로도 유명해요.
닐스의 신기한 여행|셀마 라게를뢰프는 1858년생 스웨덴의 작가로 1909년 노벨 문학상을 받았어요.|장난꾸러기 소년 닐스는 요정을 골려 주다 마법에 걸려 엄지손가락만큼 작아져요. 닐스는 집 거위 모르텐을 따라 야생 기러기 무리와 함께 스웨덴 전역을 여행하게 돼요. 기러기들의 대장 아카와 함께 여러 지방의 풍경과 역사를 보고 위기를 겪어요. 여행하며 닐스는 동물과 사람을 이해하고 따뜻한 마음을 갖게 돼요. 집에 돌아온 닐스는 마법이 풀려 원래 모습이 돼요.|1906~1907년 출간됐어요.
사자왕 형제의 모험|아스트리드 린드그렌은 1907년생 스웨덴의 작가예요.|병으로 죽음을 앞둔 소년 카를은 형 요나탄이 이야기해 주던 '낭기열라' 나라의 이야기를 좋아해요. 요나탄이 화재에서 동생을 구하다가 죽자 카를도 곧 낭기열라에서 형을 다시 만나요. 낭기열라는 폭군 텡일이 괴롭히고 있어요. 형제는 벚꽃 골짜기와 압제에 맞서 싸우는 사람들을 돕고 용 카트라와 맞서요. 마지막에 형제는 또 다른 세계 낭기랄마로 건너가요.|1973년 출간됐어요. 죽음이 나와요.
내 친구 윈딕시|케이트 디카밀로는 1964년생 미국의 작가예요.|열 살 소녀 오팔 불로니는 엄마 없이 목사인 아버지와 새 도시에 이사 와요. 오팔은 슈퍼마켓 윈딕시에서 길 잃은 개를 발견하고 자기 개라고 거짓말해 구해 줘요. 오팔은 개에게 가게 이름 윈딕시라는 이름을 붙여요. 윈딕시 덕분에 오팔은 이웃 어른들과 친구가 되어 가요. 이웃들의 쓸쓸함과 상처를 알게 되며 오팔도 엄마에 대한 마음을 털어놓아요.|2000년 출간됐어요.
에밀과 탐정들|에리히 케스트너는 1899년생 독일의 작가예요.|소년 에밀은 어머니가 모은 돈을 할머니에게 전하러 기차를 타고 베를린으로 가요. 기차에서 낯선 신사 때문에 잠이 들었다가 돈을 도둑맞아요. 에밀은 베를린에서 만난 아이들과 힘을 모아 탐정단을 꾸려 도둑을 쫓아요. 아이들은 각자 맡은 임무를 해내며 도둑을 놓치지 않아요. 마침내 도둑이 경찰에 붙잡히고 에밀은 돈을 되찾아요.|1929년 출간됐어요.
로테와 루이제|에리히 케스트너는 1899년생 독일의 작가예요.|여름 캠프에서 우연히 만난 두 소녀 로테와 루이제는 얼굴이 똑같아 놀라요. 알고 보니 둘은 부모의 이혼으로 어릴 때 헤어진 쌍둥이였어요. 두 소녀는 서로의 처지를 바꿔 각자의 집으로 돌아가요. 새로운 가정에서 지내며 서로의 부모를 만나고 가족을 다시 합칠 계획을 세워요. 마침내 가족이 다시 만나요.|1949년 출간됐어요.
오세암|정채봉은 1946년생 동화 작가예요.|설악산 오세암에서 길손이라는 다섯 살 아이가 스님 감이와 함께 살아요. 길손은 앞을 보지 못하는 누나 감이를 찾아 어머니를 기다려요. 겨울에 스님이 길을 떠난 사이 길손은 홀로 남아 눈 속에서 관세음보살을 부르며 기도해요. 스님이 돌아왔을 때 길손은 죽었지만 얼굴에는 미소가 어려 있어요. 길손은 관세음보살의 도움으로 새가 되어 날아올라요.|1986년 출간됐어요. 아이의 죽음이 나와요.
만년샤쓰|방정환은 1899년생 아동 문학가로 어린이날을 만든 사람이에요.|창남이는 운동도 잘하고 친구들에게 인기가 많은 소년이에요. 어느 날 체조 시간에 창남이는 샤쓰를 입지 않은 맨몸으로 나타나 친구들이 놀라요. 알고 보니 집이 가난한 데다 샤쓰를 가난한 이웃에게 주었기 때문이었어요. 창남이는 아픈 어머니를 간호하며 씩씩하게 지내요. 친구들은 창남의 따뜻한 마음에 감동해요.|1927년 발표됐어요.
우동 한 그릇|구리 료헤이는 1943년생 일본의 작가예요.|섣달 그믐날 밤 우동 가게 북해정에 가난한 어머니와 두 아들이 와서 우동 한 그릇을 시켜요. 주인 부부는 몰래 우동을 한 덩이 반으로 해 담아 줘요. 모자는 해마다 같은 날 찾아와 우동 한 그릇을 먹어요. 어느 해에 오지 않았다가 몇 년 뒤 의젓하게 자란 두 아들과 어머니가 다시 찾아와 우동 세 그릇을 시켜요. 부부는 눈물을 흘리며 반갑게 맞아요.|1989년 발표돼 큰 반향을 일으켰어요.
헬렌 켈러 자서전|헬렌 켈러는 1880년 미국에서 태어난 작가이자 사회 운동가예요.|이 책은 자서전이라 줄거리 대신 구성으로 소개해요. 어린 시절 병으로 시력과 청력을 잃은 헬렌은 암흑 속에서 살다가 가정교사 앤 설리번을 만나요. 설리번 선생님은 손바닥에 글자를 써서 사물의 이름을 가르쳐 주고 우물가에서 '물'의 의미를 깨닫게 해요. 헬렌은 점자와 말하기를 익히고 래드클리프 대학을 졸업해요. 장애인 교육과 인권을 위해 평생 활동해요.|1903년 『내 삶의 이야기』로 출간됐어요.
행복한 청소부|모니카 페트는 1951년생 독일의 작가예요.|독일의 한 도시에서 거리 표지판을 닦는 청소부 아저씨는 자기 일을 자랑스러워해요. 그는 표지판에 쓰인 작가와 음악가의 이름을 보고 그들의 책과 음악을 배우고 싶어 해요. 청소부는 저녁마다 책을 읽고 음악을 들으며 공부해요. 어느 날 아이들의 질문에 그는 대답을 하게 되고 사람들은 아저씨의 이야기를 듣고 감동해요. 대학교수가 되라는 제의가 와도 그는 자신의 일을 계속해요.|2000년 출간됐어요.
푸른 사자 와니니|이현은 1972년생 동화 작가예요.|아프리카 초원의 어린 사자 와니니는 무리의 리더 마디바 할머니를 따르며 자라요. 그러나 사자들 사이에서 힘이 약하다는 이유로 쫓겨나 홀로 초원을 헤매요. 와니니는 아산, 아카시, 말리 같은 친구들을 만나 새로운 무리를 만들어요. 위험한 일을 함께 겪으며 서로 의지하는 법을 배워요. 와니니는 리더로서 약한 존재를 지키는 용기를 키워 가요.|2015년 출간됐어요.
만복이네 떡집|김리리는 1971년생 동화 작가예요.|만복이는 입만 열면 나쁜 말이 나와 친구들이 모두 싫어해요. 어느 날 이상한 떡집에서 먹으면 무엇이든 이루어지는 떡 몇 개를 먹게 돼요. 기분이 풀리는 떡, 친구를 사귀는 떡 등을 먹은 만복이는 조금씩 변해 가요. 마지막에는 떡집에서 자신의 습관을 돌아보고 친구를 위해 달라져요. 말이 사람의 마음에 얼마나 중요한지 보여 줘요.|2010년 출간됐어요.
아홉 살 인생|위기철은 1960년생 작가예요.|1970년대 산동네 아이 백민은 아홉 살이에요. 백민은 친구 우주, 여민, 기종, 동윤 등 개성 있는 아이들과 어울려요. 아이들은 학교와 동네에서 어른들의 이상한 행동을 보고 의문을 가지며 서로의 사정을 알게 돼요. 가난과 이별, 죽음 같은 일들이 아이들에게 닥쳐요. 백민은 이를 겪으며 인생에 대해 한 걸음씩 배워요.|1991년 출간됐어요.
나니아 연대기: 캐스피언 왕자|C. S. 루이스는 1898년생 영국의 작가예요.|네 남매는 기차역에서 갑자기 나니아로 끌려와요. 이곳은 남매가 왕이던 시절 이후 1300년이 흐른 뒤였어요. 나니아는 텔마르인에게 정복당해 있고 어린 캐스피언 왕자는 숙부 미라즈에게 쫓겨 도망쳐요. 캐스피언은 뿔피리를 불어 남매를 부르고 남매는 아슬란과 함께 텔마르 군대에 맞서요. 마침내 나니아의 옛 생물들이 깨어나 캐스피언이 왕위를 되찾아요.|1951년 출간됐어요.
나니아 연대기: 새벽 출정호|C. S. 루이스는 1898년생 영국의 작가예요.|에드먼드와 루시는 사촌 유스터스와 함께 그림 속 바다를 통해 나니아로 들어가요. 캐스피언 왕이 이끄는 배 '새벽 출정호'에 올라 사라진 일곱 영주를 찾는 항해를 해요. 섬마다 노예 상인, 마법사, 보이지 않는 사람들 같은 위험이 있어요. 유스터스는 욕심 때문에 용으로 변했다가 아슬란의 도움으로 새 사람이 돼요. 세상의 끝에서 쥐 리피치프는 아슬란 나라로 떠나요.|1952년 출간됐어요.
퍼시 잭슨과 번개 도둑|릭 라이어던은 1964년생 미국의 작가예요.|열두 살 퍼시 잭슨은 난독증과 ADHD로 학교에서 문제아로 지내요. 어느 날 학교 선생님이 괴물로 변하며 퍼시는 자신이 포세이돈의 아들이라는 사실을 알게 돼요. 제우스의 번개를 훔쳤다는 오해를 받은 퍼시는 친구 그로버, 아나베스와 함께 번개를 찾으러 떠나요. 이들은 지하 세계까지 가서 하데스를 만나요. 번개를 되찾아 올림포스로 가져가 전쟁을 막아요.|2005년 출간됐어요.
윔피 키드|제프 키니는 1971년생 미국의 작가예요.|중학교 신입생 그레그 헤플리는 인기 있는 아이가 되고 싶어 일기장에 학교 생활을 적어요. 그는 친구 롤리와 놀면서도 친구를 따돌리거나 곤란에 빠뜨리는 실수를 해요. 형 로드릭의 장난과 부모님의 잔소리, 학교의 사건들이 이어져요. 그레그는 우여곡절 끝에 친구의 소중함을 조금씩 깨달아요. 그림과 글이 섞인 일기 형식이에요.|2007년 출간됐어요.
아기 곰 패딩턴|마이클 본드는 1926년생 영국의 작가예요.|페루에서 온 아기 곰이 런던 패딩턴 역에서 짐을 놓고 기다리고 있어요. 브라운 부부는 곰의 목에 걸린 쪽지를 보고 데려와 '패딩턴'이라는 이름을 붙여요. 패딩턴은 오렌지 마멀레이드를 좋아하며 어디서나 실수를 저질러 소동을 일으켜요. 욕실을 물바다로 만들거나 백화점에서 소란을 피우지만 사람들을 웃게 해요. 브라운 가족과 이웃들은 패딩턴을 가족처럼 아껴요.|1958년 출간됐어요.
마녀를 잡아라|로알드 달은 1916년생 영국의 작가예요.|부모를 잃은 소년은 할머니와 함께 살며 마녀에 대한 이야기를 들어요. 마녀는 아이들을 몹시 싫어하고 아이들을 없애려는 무서운 존재예요. 소년은 호텔에서 마녀 대회를 엿보다가 마법약을 맞고 생쥐로 변해요. 소년은 할머니와 함께 마녀들에게 마법약을 먹여 모두 쥐로 만들어요. 소년은 쥐 모습으로 할머니와 오래 살 것을 받아들여요.|1983년 출간됐어요.
대니, 세계 챔피언|로알드 달은 1916년생 영국의 작가예요.|대니는 어머니를 일찍 여의고 자동차 정비소를 하는 아버지와 단둘이 오순도순 살아요. 어느 날 아버지가 밤마다 어디론가 나가는 비밀을 알게 돼요. 아버지는 이웃 지주의 숲에서 꿩을 몰래 잡는 밀렵을 해 왔어요. 대니는 아버지를 도와 수면제를 넣은 건포도를 이용해 꿩을 잡는 대작전을 펼쳐요. 부자와 사냥꾼 모임을 한 방 먹이는 데 성공해요.|1975년 출간됐어요.
트럼펫 부는 백조 루이|E. B. 화이트는 1899년생 미국의 작가예요.|새끼 트럼펫고니 루이는 목소리가 나지 않아 친구들과 소리를 낼 수 없어요. 루이의 아빠는 트럼펫을 훔쳐 와 루이에게 주고 루이는 트럼펫을 불면서 의사소통을 해요. 학교에서 글과 소리를 익혀 마음에 둔 암컷 백조 세레나에게 구애하려고 노력해요. 루이는 연주자로 일해 돈을 벌고 아버지가 훔친 트럼펫 값도 갚아요. 세레나와 만나 가정을 꾸려요.|1970년 출간됐어요.
꿀벌 마야의 모험|발데마르 본젤스는 1881년생 독일의 작가예요.|어린 꿀벌 마야는 벌집 안의 정해진 규칙이 답답해 넓은 세상으로 날아가요. 마야는 파리 푸크, 개미, 사마귀, 거미 같은 여러 곤충을 만나 다양한 삶을 배워요. 말벌들이 꿀벌 나라를 공격하려 한다는 사실을 알게 된 마야는 위험을 무릅쓰고 벌집으로 돌아가 이를 알려요. 꿀벌들은 마야 덕분에 말벌을 막아 내요. 마야는 용서를 받고 영웅이 돼요.|1912년 출간됐어요.
꼬마 돼지 베이브|딕 킹스미스는 1932년생 영국의 작가예요.|새끼 돼지 베이브는 시골 농장 호겟 씨네에 오게 돼요. 호겟 씨는 베이브가 양을 모는 재주가 있다는 것을 알고 양치기 개처럼 훈련시켜요. 베이브는 예의 바른 말로 양들을 설득하는 방식으로 양들을 잘 이끌어요. 호겟 씨는 베이브를 양몰이 대회에 내보내요. 베이브는 큰 박수를 받으며 우승해 농장의 자랑이 돼요.|1983년 출간됐어요.
하늘을 나는 교실|에리히 케스트너는 1899년생 독일의 작가예요.|독일 기숙학교 소년들은 크리스마스 연극 '하늘을 나는 교실'을 연습하고 있어요. 다른 학교 학생들과 갈등을 겪고 서로 다투기도 하지만 정의로운 선생님 '정의씨'와 은퇴한 '금연씨'의 도움을 받아요. 소년들은 가난하거나 외로운 처지에서도 우정을 쌓아요. 연극 공연이 성공하고 소년들은 크리스마스를 함께 보내요. 우정과 용기를 이야기해요.|1933년 출간됐어요.
사과나무 위의 할머니|미라 로베는 1913년생 독일의 작가예요.|할머니는 양로원에 가기 싫어 사과나무 위로 올라가 살기 시작해요. 아들 가족은 놀라고 곤란해하지만 손자 손녀들은 할머니와 나무 위에서 놀며 지내요. 할머니는 나무 위에서 가족과 이웃 사람들에게 나이 든 사람의 삶과 자유를 이야기해요. 시간이 흐르며 아들 가족은 할머니를 이해하게 돼요. 할머니는 사과나무 위에서 행복한 시간을 보내요.|1965년 출간됐어요.
미오, 나의 미오|아스트리드 린드그렌은 1907년생 스웨덴의 작가예요.|보 빌헬름 올손은 양부모의 집에서 외롭게 지내다가 어느 날 공원 벤치에서 램프의 지니에게서 먼 나라로 가게 돼요. 그곳에서 보는 왕의 아들 미오로 이름이 바뀌고 친구 유사를 만나 행복해요. 하지만 먼 나라는 잔인한 기사 카토가 지배하며 아이들을 데려가요. 미오는 유사와 함께 카토를 물리치러 길을 떠나 용기를 얻어요.|1954년 출간됐어요.
창가의 토토|구로야나기 데쓰코는 1933년생 일본의 방송인이에요.|토토는 호기심이 많고 엉뚱해서 첫 학교에서 쫓겨난 소녀예요. 토토는 도모에 학원에 입학해 고바야시 소사쿠 교장 선생님을 만나요. 교장 선생님은 토토를 있는 그대로 받아들여 주고 아이들이 자유롭게 배우도록 해요. 전철을 교실로 쓰고 산책을 수업으로 삼는 학교생활이 이어져요. 전쟁으로 학교가 불타 사라지지만 토토는 그곳에서의 기억을 간직해요.|1981년 출간됐어요.
홍당무|쥘 르나르는 1864년생 프랑스의 작가예요.|빨간 머리 소년 홍당무는 어머니 르픽 부인에게 늘 구박과 놀림을 받아요. 가족 중 누구도 홍당무를 이해해 주지 않고 심부름과 잔소리가 이어져요. 홍당무는 어른들을 속이는 방법으로 자신을 지키며 외롭고 서글프게 지내요. 아버지는 마지막에 홍당무에게 아들로서의 마음을 비춰요. 소년은 꿋꿋하게 성장해 가요.|1894년 출간됐어요.
사랑의 학교|에드몬도 데 아미치스는 1846년생 이탈리아의 작가예요.|초등학교 4학년 소년 엔리코는 한 해 동안의 학교생활을 일기로 써요. 일기에는 친구들의 이야기와 선생님의 가르침, 아버지와 어머니가 쓴 편지가 함께 실려요. 매달 선생님이 들려주는 이야기가 있는데 '엄마 찾아 삼만 리'도 그중 하나예요. 아이들은 가난과 병, 용기와 우정을 배우며 자라요. 한 해가 끝나고 엔리코는 한 뼘 더 자라요.|1886년 출간됐어요.
수학 귀신|한스 마그누스 엔첸스베르거는 1929년생 독일의 작가예요.|수학을 싫어하는 소년 로베르트는 꿈속에서 수학 귀신을 만나요. 수학 귀신은 12일 동안 로베르트에게 1, 0, 소수, 토끼 수열, 파스칼의 삼각형 같은 수학의 재미를 알려 줘요. 처음에 로베르트는 귀찮아하지만 점점 흥미를 가지고 질문해요. 숫자 놀이를 통해 수학의 원리를 이해하게 돼요. 수학을 싫어하던 소년이 수학의 매력에 눈뜨는 이야기예요.|1997년 독일에서 출간됐어요.
소피의 세계|요슈타인 가아더는 1952년생 노르웨이의 작가예요.|열네 살 소녀 소피 아문젠은 어느 날 '너는 누구니?'라는 익명의 편지를 받아요. 철학 선생 알베르토 낙스가 보낸 편지로 소피는 고대 그리스부터 현대까지 철학의 역사를 배워요. 한편 소피는 '힐데'라는 소녀에게 보내는 엽서 이야기를 우연히 발견하고 자신이 사는 세계의 정체를 의심하게 돼요. 이야기는 철학 이야기와 소설이 겹쳐 반전으로 이어져요.|1991년 출간됐어요.
클로디아의 비밀|E. L. 코닉스버그는 1930년생 미국의 작가예요.|열두 살 클로디아는 집안일이 불공평하다는 불만에 가출을 계획해요. 동생 제이미를 데리고 뉴욕 메트로폴리탄 미술관에 숨어 지내기로 해요. 두 아이는 낮에는 관람객 틈에 섞이고 밤에는 박물관 침대에서 잠을 자요. 미술관에 새로 들어온 천사상이 미켈란젤로의 작품일지 모른다는 소문에 아이들은 비밀을 파헤치기 시작해요. 이를 알고 있는 프랭크와일러 부인을 찾아가 이야기를 듣고 클로디아는 자신만의 비밀을 갖게 돼요.|1967년 출간됐고 이듬해 뉴베리상을 받았어요.
멍청씨 부부 이야기|로알드 달은 1916년생 영국의 작가예요.|멍청씨 부부는 서로를 못살게 구는 고약한 노부부예요. 남편은 수염에 음식 찌꺼기를 달고 다니고 아내는 남편을 골탕 먹이려 유리 눈알을 맥주잔에 넣어요. 남편은 아내를 골탕 먹이려 개구리를 침대에 넣고 뱀으로 아내를 놀라게 해요. 이들은 또 마당의 큰 나무에 새를 잡으려 끈끈이를 발라요. 이웃 원숭이 가족의 복수 끝에 부부는 자신들의 꾀에 걸려들어요.|1980년 출간됐어요. 장난과 복수가 과장돼 나와요.
마녀 배달부 키키|가도노 에이코는 1935년생 일본의 작가예요.|열세 살 마녀 키키는 마녀의 규칙에 따라 고양이 지지와 함께 집을 떠나 홀로 살 곳을 찾아요. 바다가 보이는 마을에서 키키는 빵집 부인을 만나 빗자루를 타고 물건을 나르는 배달 일을 시작해요. 키키는 비바람 속에서 배달을 하고 마을 사람들의 고민을 해결해 줘요. 도시에서 새 친구를 사귀며 차츰 자신감을 얻어요. 키키는 일 년이 지나도록 마을 사람들의 사랑을 받아요.|1985년 출간됐고 애니메이션으로도 알려져 있어요.
구렁덩덩 신선비|작자 미상의 우리나라 옛이야기예요.|옛날에 한 할머니가 구렁이를 낳아요. 부잣집 세 딸 중 막내만이 구렁이를 신랑으로 받아들여요. 구렁이는 허물을 벗고 멋진 선비로 변하지만 막내의 두 언니는 샘을 내요. 막내가 허물을 지키지 못하자 신선비는 떠나 버려요. 막내는 신랑을 찾아 먼 길을 떠나 여러 어려움을 이겨 내고 다시 만나요.|전래 동화라 판본마다 내용이 조금 달라요.
바리데기|작자 미상의 우리나라 무가 설화예요.|이 이야기는 옛이야기라 줄거리 중심으로 소개해요. 일곱 번째 딸로 태어난 바리공주는 아들을 바라던 아버지에게 버려져요. 훗날 부모가 병들자 바리공주는 약수를 구하러 저승까지 길을 떠나요. 무장승이 약수를 주는 대가로 일을 시키고 결혼을 요구해 바리는 아이를 낳고 돌아와요. 약수로 부모를 살린 바리공주는 죽은 사람의 영혼을 저승으로 인도하는 신이 돼요.|무당이 부르는 서사무가로 전해져 판본이 여러 가지예요.
삼년고개|작자 미상의 우리나라 옛이야기예요.|어느 마을 고개에서 넘어지면 삼 년밖에 못 산다는 말이 전해져 사람들이 무서워해요. 한 할아버지가 그 고개에서 넘어져 시름시름 앓아누워요. 이웃의 꾀 많은 아이가 찾아와 한 번 넘어지면 삼 년, 두 번 넘어지면 육 년, 많이 넘어지면 오래 산다고 말해요. 할아버지는 넘어지고 또 넘어져 병이 낫고 건강하게 살아요. 생각을 바꾸면 고민이 풀린다는 지혜를 알려 줘요.|전래 동화라 판본마다 조금씩 달라요.
반쪽이|작자 미상의 우리나라 옛이야기예요.|아이가 없던 부부가 정성을 들여 낳은 아들은 몸이 반쪽뿐이었어요. 반쪽이는 몸이 반이지만 힘이 세고 지혜로워요. 반쪽이는 집에서 심하게 놀림을 받다가 길을 떠나 호랑이와 도깨비를 만나요. 반쪽이는 지혜로 호랑이를 물리치고 도깨비를 속여 재물을 얻어요. 반쪽이는 마을에서 인정을 받고 장가를 가요.|전래 동화라 판본마다 조금씩 달라요.
주몽 신화|『삼국사기』와 『삼국유사』에 전해지는 고구려의 건국 신화예요.|신화라 줄거리 대신 구성으로 소개해요. 하백의 딸 유화와 해모수 사이에서 알이 태어나고 그 알에서 주몽이 태어나요. 주몽은 활을 잘 쏘아 '주몽'이라 불렸고 동부여 왕자들의 시기를 받아요. 주몽은 어머니의 도움을 받아 부여를 떠나 졸본에 이르러 고구려를 세워요. 오이, 마리, 협보 등 사람들이 주몽을 따랐다고 전해져요. 고구려 건국의 정당성을 설명하는 이야기예요.|기록마다 내용이 조금씩 달라요.
아기 장수|작자 미상의 우리나라 옛이야기예요.|가난한 농부 부부에게 아주 힘이 센 아기가 태어나요. 아기는 겨드랑이에 날개가 달려 있었고 그 모습을 이상하게 여긴 관아에서는 역적이 될 것을 걱정해요. 부모는 나라의 벌을 받을까 두려워해 아기를 숨기려 하지만 결국 아기는 죽임을 당해요. 죽기 전에 아기가 말한 콩과 팥이 병사가 되어 도울 수 있었다고 전해져요. 시대를 잘못 만난 영웅의 슬픔을 이야기해요.|지역마다 이야기가 달라 이야기 틀이 여러 가지예요.
가방 들어주는 아이|고정욱은 1962년생 작가예요.|3학년 석규는 다리가 불편한 영택이의 가방을 들어주기로 해요. 처음에는 선생님이 시켜서 하는 일이었고 석규는 속으로 귀찮아해요. 시간이 지나면서 석규는 영택이의 어려움과 마음을 이해하게 돼요. 반 아이들이 영택이를 놀릴 때 석규는 영택이 편에 서요. 두 아이는 진짜 친구가 되고 장애에 대한 편견도 조금씩 사라져요.|2002년 출간됐어요.
책과 노니는 집|이영서는 1970년대에 태어난 작가예요.|조선 시대 책을 베껴 쓰는 필사쟁이 아버지를 둔 장이는 책방에서 책을 읽고 책 읽어 주는 일을 도우며 살아요. 아버지가 갑자기 사라지고 장이는 책방 주인과 함께 행방을 찾아요. 알고 보니 천주교 서적을 필사했다는 이유로 아버지가 관아에 끌려간 것이었어요. 장이는 책 읽어 주는 일을 이어 가며 사람들과 우정을 키워요. 정조 시대 서적 금지의 현실을 보여 줘요.|2009년 출간됐어요. 박해 이야기가 나와요.
아벨의 섬|윌리엄 스타이그는 1907년생 미국의 작가예요.|쥐 아벨은 아내 아만다와 소풍을 나갔다가 폭풍우를 만나 급류에 휩쓸려 외딴 섬에 홀로 남아요. 아벨은 먹을 것과 지낼 곳을 마련하며 오랫동안 섬에서 지내요. 아벨은 그림을 그리고 조각을 하며 외로움을 달래요. 오랜 시간이 지나 아벨은 방법을 찾아 섬을 탈출하고 가족에게 돌아가요. 혼자서도 용기를 잃지 않는 이야기예요.|1976년 출간됐어요.
무민 골짜기의 혜성|토베 얀손은 1914년생 핀란드의 작가예요.|무민 골짜기에 혜성이 다가오고 있다는 소문이 들려요. 무민과 스니프는 혜성의 정체를 알아보기 위해 천문대로 모험을 떠나요. 가는 길에 스너프킨, 스노크 남매 등 친구들을 만나 함께 여행해요. 혜성이 지구에 가까이 다가오자 모두 동굴로 피신하고 마침내 혜성은 비껴가요. 무민 가족은 무사히 집으로 돌아와요.|1946년 출간됐어요.
왕도둑 호첸플로츠|오트프리트 프로이슬러는 1923년생 독일의 작가예요.|카스페를과 제펠은 할머니의 커피 분쇄기를 훔쳐 간 도둑 호첸플로츠를 잡으려고 해요. 두 친구는 도둑을 잡으려다 오히려 마법사 페투시넬라에게 붙잡혀 일을 하게 돼요. 아이들은 꾀를 내어 마법사를 속이고 도둑 호첸플로츠를 쫓아요. 마침내 도둑을 잡아 커피 분쇄기를 되찾고 마법을 풀어요. 유쾌한 모험과 우정을 보여 줘요.|1962년 출간됐어요.
산적의 딸 로냐|아스트리드 린드그렌은 1907년생 스웨덴의 작가예요.|로냐는 마티스 산적단 두목의 딸로 숲속 산채에서 자라요. 어느 날 숲에서 라이벌 산적 보르카의 아들 비르크를 만나요. 두 아이는 싸우기도 하지만 점점 친구가 되어 함께 숲을 누벼요. 아버지들의 싸움 속에서 두 아이는 집을 나와 숲에서 둘만 지내요. 결국 로냐는 어른들의 다툼을 이해하고 아버지와 화해해요.|1981년 출간됐어요.
에밀은 사고뭉치|아스트리드 린드그렌은 1907년생 스웨덴의 작가예요.|스웨덴 시골 마을의 장난꾸러기 에밀은 사고를 치는 일이 많아요. 에밀은 수프 그릇에 머리가 끼거나 동생을 깃대에 매다는 등 소동을 일으켜요. 아빠는 화가 나서 에밀을 목공소에 가두지만 에밀은 그곳에서 목각 인형을 깎아요. 에밀은 장난 속에서도 마을 사람들을 돕고 따뜻한 마음을 보여 줘요. 마을 사람들은 에밀을 미워하면서도 정을 느껴요.|1963년 출간됐어요.
바람과 버드나무|케네스 그레이엄은 1859년생 영국의 작가예요.|강가에 사는 두더지는 쥐와 친구가 되어 강가 생활을 시작해요. 이들은 오소리와 허영심 많은 두꺼비를 만나 서로 어울려요. 두꺼비는 자동차에 푹 빠져 사고를 치다 감옥에 가게 돼요. 두꺼비가 갇힌 사이 족제비 일당이 두꺼비의 저택을 차지해요. 친구들이 힘을 모아 저택을 되찾아요.|1908년 출간됐어요.
로빈 후드의 모험|하워드 파일은 1853년생 미국의 작가이자 화가예요.|영국 셔우드 숲에 사는 로빈 후드는 부자에게서 빼앗아 가난한 이들에게 나눠 주는 의적이에요. 로빈은 리틀 존, 수사 터크 같은 동료를 모아 숲에서 지내요. 노팅엄의 보안관은 로빈을 잡으려 하지만 번번이 놓쳐요. 활쏘기 대회 등 여러 모험을 거치며 로빈은 사람들의 신임을 얻어요. 마지막에는 왕이 로빈을 용서하는 전개로 이어져요.|전설을 바탕으로 한 이야기라 판본마다 달라요.
호랑이 형님|작자 미상의 우리나라 옛이야기예요.|한 효자가 호랑이를 형님으로 모시는 이야기예요. 어머니를 돌보던 효자는 산에서 호랑이를 만나요. 호랑이를 형님이라 부르며 집에 데려오자 호랑이는 감동해 효자를 돕고 어머니를 모셔요. 효자와 호랑이는 서로 도우며 가족처럼 지내요. 정성과 효를 중요하게 여기는 마음이 담겨 있어요.|전래 동화라 판본마다 조금씩 달라요.
빨간 부채 파란 부채|작자 미상의 우리나라 옛이야기예요.|한 게으른 사람이 길에서 빨간 부채와 파란 부채를 얻어요. 빨간 부채로 부치면 코가 길어지고 파란 부채로 부치면 코가 줄어드는 신기한 부채였어요. 사람은 부채를 이용해 부자들의 코를 늘렸다 줄여 주며 돈을 벌어요. 하지만 욕심이 지나쳐 임금님의 코를 늘렸다가 큰 낭패를 봐요. 욕심을 부리면 안 된다는 교훈을 줘요.|전래 동화라 판본마다 조금씩 달라요.
여우누이|작자 미상의 우리나라 옛이야기예요.|아들만 있는 집에 딸이 태어나지만 알고 보니 여우가 변한 누이였어요. 여우누이는 밤마다 외양간의 가축을 잡아먹어요. 막내아들이 이를 알고 부모에게 알리지만 믿지 않아 집을 떠나요. 막내는 도술을 얻어 돌아오고 여우누이의 정체를 밝혀 물리쳐요. 무서운 이야기지만 지혜와 용기를 이야기해요.|전래 동화라 판본마다 조금씩 달라요.
줄줄이 꿴 호랑이|작자 미상의 우리나라 옛이야기예요.|옛날에 한 사람이 산길에서 호랑이를 만났어요. 그는 꾀를 내어 호랑이들을 한 마리씩 속여요. 마지막에는 꼬챙이로 호랑이를 줄줄이 꿰어 잡아요. 힘이 약해도 지혜로 큰 위기를 이겨 낼 수 있다는 이야기예요. 우리 옛이야기에 자주 나오는 호랑이와 사람의 대결이 재미있게 그려져요.|전래 동화라 판본마다 조금씩 달라요.
소가 된 게으름뱅이|작자 미상의 우리나라 옛이야기예요.|아무 일도 하지 않고 놀기만 하는 게으름뱅이가 있었어요. 어느 날 한 노인이 쓰고 있는 소머리 탈을 쓰면 일하지 않아도 된다고 알려 줘요. 게으름뱅이가 탈을 쓰자 소로 변해 팔려 가 고되게 일해요. 소가 된 그는 무를 먹으면 사람이 된다는 말을 떠올려 무를 먹고 다시 사람이 돼요. 이후 열심히 일하며 살게 돼요.|전래 동화라 판본마다 조금씩 달라요.
신기한 스쿨버스|조애나 콜은 1944년생 미국의 작가예요.|프리즐 선생님은 과학 수업이 신기한 선생님이에요. 스쿨버스를 타고 몸속, 우주, 바다 속 등 여러 곳으로 현장 체험을 떠나요. 버스는 작아지고 변신해 학생들을 위험한 곳까지 데려가요. 아이들은 직접 보고 체험하며 과학 개념을 이해해요. 시리즈로 이어지며 지식을 재미있게 알려 줘요.|1986년부터 시리즈로 출간됐어요.
마리 퀴리|마리 퀴리는 1867년 폴란드에서 태어난 과학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 마리는 어릴 적부터 총명했지만 폴란드에서는 여성이 대학에 가기 어려웠어요. 프랑스 파리로 유학해 물리학과 수학을 공부하고 피에르 퀴리와 결혼해요. 두 사람은 방사성 원소 폴로늄과 라듐을 발견해 1903년 노벨 물리학상을 함께 받아요. 마리는 1911년에 노벨 화학상도 받아요. 열정과 끈기, 방사선 연구의 위험도 함께 배울 수 있어요.|위인전은 책마다 서술이 조금씩 달라요.
세종대왕|세종대왕은 1397년에 태어나 조선의 제4대 왕이 된 인물이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 세종은 어린 시절 책을 좋아했고 왕이 된 뒤 집현전을 두어 학자를 키웠어요. 백성을 위해 1443년 한글을 창제하고 1446년 『훈민정음』을 반포했어요. 장영실 등 인재를 등용해 과학 기구를 만들고 농사 책을 펴냈어요. 국방과 영토에도 힘써 북쪽 국경을 안정시켰어요. 애민 정신과 학문 장려를 이야기해요.|위인전은 책마다 서술이 조금씩 달라요.
이순신|이순신은 1545년에 태어난 조선의 무신이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 이순신은 무과에 급제해 여러 지역에서 근무했고 임진왜란이 일어나자 전라 좌수사로 바다를 지켜요. 옥포, 한산도, 명량 등의 해전에서 거북선과 학익진 등을 활용해 승리했어요. 모함을 받아 백의종군하기도 했지만 다시 수군을 이끌었어요. 1598년 노량 해전에서 전사했어요. 『난중일기』에는 전쟁 중 그의 생각이 담겨 있어요.|위인전은 책마다 서술이 조금씩 달라요.
오른발, 왼발|토미 드파올라는 1934년생 미국의 작가이자 화가예요.|어린 보비는 할아버지 보브와 함께 살며 걸음마를 배워요. 할아버지는 보비에게 '오른발, 왼발' 하고 말하며 걷는 법을 가르쳐 줘요. 어느 날 할아버지가 병으로 쓰러져 말도 걷지도 못하게 돼요. 이번에는 보비가 할아버지에게 같은 말을 하며 걷는 법을 가르쳐 줘요. 할아버지와 손자 사이의 사랑을 그려요.|1978년 출간됐어요.
조지, 마법의 약을 만들다|로알드 달은 1916년생 영국의 작가예요.|여덟 살 조지는 고약한 할머니와 단둘이 집에 남게 돼요. 조지는 할머니에게 골탕을 먹이려고 집 안의 이것저것을 섞어 마법의 약을 만들어요. 할머니가 약을 마시자 몸이 엄청나게 커지더니 집을 뚫고 나가요. 조지의 아버지는 이 약으로 농장 동물들을 크게 키워 보려다 곤란해져요. 결국 약의 재료를 다시 알 수 없어 소동은 끝나요.|1981년 출간됐어요.
캡틴 언더팬츠|데이브 필키는 1966년생 미국의 작가이자 화가예요.|조지와 해럴드는 만화를 그려 학교 선생님과 교장 선생님을 놀리는 장난꾸러기예요. 어느 날 교장 선생님에게 최면을 걸어 속옷만 입은 영웅 캡틴 언더팬츠로 만들어요. 캡틴 언더팬츠는 악당들과 싸우며 이상한 일을 벌여요. 아이들은 물 한 방울로 다시 교장 선생님으로 돌아오게 하는 방법을 알게 돼요. 유쾌한 말장난과 그림이 가득한 책이에요.|1997년 첫 권이 나왔어요.
에드워드 툴레인의 신기한 여행|케이트 디카밀로는 1964년생 미국의 작가예요.|도자기 토끼 에드워드 툴레인은 자신이 최고라고 생각하는 잘난 척하는 장난감이에요. 어느 날 배에서 바다에 떨어져 어부, 부랑자, 아이 등 여러 사람의 손을 거치며 긴 여행을 해요. 그 과정에서 에드워드는 사랑하고 잃는 아픔을 겪어요. 마음이 열린 에드워드는 마지막에 소중한 이를 다시 만나요. 사랑을 배우는 이야기예요.|2006년 출간됐어요.
생쥐 기사 데스페로|케이트 디카밀로는 1964년생 미국의 작가예요.|생쥐 데스페로는 책을 읽고 이야기를 좋아하는 별난 생쥐예요. 데스페로는 공주 피를 구하고 싶어 하는 기사가 되기를 꿈꿔요. 한편 쥐 로스쿠로는 어둠 속에서 빛을 갈망하다 사악한 계획을 세워요. 소녀 미그와 데스페로는 각자의 길을 걷다 만나 이야기가 얽혀요. 용서와 사랑, 용기의 이야기예요.|2003년 출간됐고 이듬해 뉴베리상을 받았어요.
나니아 연대기: 은의자|C. S. 루이스는 1898년생 영국의 작가예요.|유스터스와 질은 학교에서 나니아로 불려 가요. 아슬란은 사라진 나니아 왕자 릴리안을 찾아오라는 임무를 줘요. 아이들은 늪지 사람 퍼들글럼과 함께 북쪽 거인의 땅으로 길을 떠나요. 아이들은 초록 옷의 여인이 사실 마녀임을 알고 왕자를 마법에서 구해 내요. 임무를 마친 아이들은 나니아를 떠나 집으로 돌아와요.|1953년 출간됐어요.
나니아 연대기: 말과 소년|C. S. 루이스는 1898년생 영국의 작가예요.|칼로르멘의 어부 아이 샤스타는 말하는 말 브리와 함께 자유로운 북쪽 나니아로 도망쳐요. 도중에 귀족 소녀 아라비스와 말 후인을 만나 함께 길을 떠나요. 이들은 칼로르멘 왕자가 나니아를 침공할 계획임을 엿듣고 알리려 해요. 사자 아슬란이 이들을 이끌어 위기를 넘기고 샤스타는 자신의 출생의 비밀을 알게 돼요. 나니아의 위기를 막는 이야기예요.|1954년 출간됐어요.
나니아 연대기: 마지막 전투|C. S. 루이스는 1898년생 영국의 작가예요.|나니아에 사자 가죽을 쓴 당나귀가 가짜 아슬란 행세를 해요. 원숭이 시프트와 칼로르멘 사람들이 이를 이용해 나니아를 지배하려 해요. 티리안 왕은 가짜 아슬란에 맞서 싸우고 이전 이야기의 아이들이 도우러 와요. 결국 나니아는 마지막 전투 끝에 사라지고 모두는 진짜 아슬란의 나라로 들어가요. 시리즈의 마지막 권이에요.|1956년 출간됐어요. 전투와 죽음이 나와요.
파랑새|모리스 메테를링크는 1862년생 벨기에의 작가로 1911년 노벨 문학상을 받았어요.|가난한 나무꾼의 남매 치르치르와 미치르는 크리스마스 이브에 요술쟁이 할머니의 부탁으로 파랑새를 찾아 떠나요. 남매는 추억의 나라, 밤의 궁전, 미래의 나라 등을 찾아다니며 파랑새를 찾지만 잡으면 색이 변하거나 죽어요. 아침에 눈을 뜬 남매는 집에서 키우던 비둘기가 파랑새임을 알게 돼요. 행복은 멀리 있지 않고 가까이 있다는 교훈을 줘요.|1908년 희곡으로 발표됐어요.
블랙 뷰티|애너 슈얼은 1820년생 영국의 작가예요.|이 이야기는 말 블랙 뷰티가 자기 삶을 들려주는 형식이에요. 블랙 뷰티는 좋은 주인 밑에서 자라다가 여러 주인을 거치며 마차를 끌고 일하게 돼요. 어떤 주인은 친절하지만 어떤 주인은 말을 학대해요. 사고로 다치기도 하고 거친 일을 하기도 해요. 마지막에는 다시 좋은 주인을 만나 평화로운 삶을 보내요. 동물을 대하는 태도를 돌아보게 해요.|1877년 출간됐어요.
큰 숲 속의 작은 집|로라 잉걸스 와일더는 1867년생 미국의 작가예요.|1870년대 미국 위스콘신의 큰 숲속에서 로라 가족은 통나무집에 살아요. 가족은 사냥, 농사, 겨울나기 같은 일을 직접 해요. 아빠는 바이올린을 켜며 가족을 즐겁게 해 주고 엄마는 음식을 만들어 겨울을 준비해요. 로라는 언니 메리와 함께 집안일을 돕고 이웃을 만나요. 개척 시대의 소박한 생활이 담겨 있어요.|1932년 출간됐어요.
미스 럼피우스|바바라 쿠니는 1917년생 미국의 그림책 작가예요.|어린 앨리스는 할아버지에게서 세 가지 일을 해야 한다는 말을 들어요. 첫째는 먼 곳을 여행하는 일, 둘째는 바닷가에 사는 일, 셋째는 세상을 더 아름답게 만드는 일이었어요. 앨리스는 어른이 되어 도서관 사서로 일하다 먼 나라를 여행해요. 이후 바닷가에 집을 마련하고 그곳에서 살아요. 세 번째 일로 마을에 루핀 꽃씨를 뿌려 세상을 아름답게 해요.|1982년 출간됐어요.
알렉산더의 끔찍하고 지독하고 재수 없는 날|주디스 비올스트는 1931년생 미국의 작가예요.|알렉산더는 아침에 일어나자마자 머리에 껌이 붙어 있어요. 학교에서는 짝꿍이 인기를 얻고 점심으로 먹을 도시락도 마음에 들지 않아요. 치과에 가면 충치가 생겼다는 말을 듣고 신발 가게에서도 마음에 드는 신발을 못 사요. 하루 종일 나쁜 일만 이어져요. 알렉산더는 이런 날이 누구에게나 있을 수 있다는 위로를 받아요.|1972년 출간됐어요.
빨간 구두|한스 크리스티안 안데르센은 1805년생 덴마크의 동화 작가예요.|가난한 소녀 카렌은 빨간 구두를 갖게 되어 교회에도 신고 가요. 카렌은 구두에 마음을 빼앗겨 아픈 양어머니를 돌보지 않고 무도회에 가요. 그러자 구두가 저절로 춤을 추어 멈출 수 없게 돼요. 지친 카렌은 사형 집행인에게 발을 잘라 달라고 부탁해요. 카렌은 뉘우치고 하느님께 용서를 구해요.|1845년 발표됐어요. 다소 무서운 장면이 나와요.
아기 돼지 삼형제의 진짜 이야기|존 셰스카는 1954년생 미국의 작가예요.|이 책은 늑대의 입장에서 쓴 이야기예요. 늑대는 할머니의 생일 케이크를 만들다 설탕이 떨어져 이웃 돼지를 찾아가요. 늑대는 재채기 때문에 돼지의 집을 날려 버렸다고 말해요. 다른 돼지의 집도 같은 이유로 무너졌다고 주장해요. 늑대는 결국 억울하게 악당이 됐다고 이야기해요. 한 이야기를 다르게 볼 수 있다는 점을 생각하게 해요.|1989년 출간됐어요.
단군 신화|『삼국유사』와 『제왕운기』 등에 전해지는 고조선의 건국 신화예요.|신화라 줄거리 대신 구성으로 소개해요. 하늘나라 환인의 아들 환웅이 인간 세상에 내려와 신시를 열고 사람을 다스려요. 곰과 호랑이가 사람이 되기를 바라 쑥과 마늘을 먹고 동굴에서 견뎌요. 호랑이는 참지 못해 뛰쳐나가고 곰은 여인 웅녀가 돼요. 웅녀와 환웅 사이에서 단군이 태어나 고조선을 세워요. 우리 민족의 시작을 설명하는 이야기예요.|기록마다 내용이 조금씩 달라요.
박혁거세 신화|『삼국유사』와 『삼국사기』에 전해지는 신라의 건국 신화예요.|신화라 줄거리 대신 구성으로 소개해요. 여섯 마을의 촌장들이 나라의 임금을 찾던 중 양산 기슭의 우물가에서 흰 말이 절을 하고 있는 것을 봐요. 그곳에 큰 알이 있었고 알에서 사내아이가 태어나요. 그 아이를 박처럼 둥근 알에서 났다 하여 박씨, 세상을 밝게 다스린다는 뜻으로 혁거세라 이름 붙여요. 아이는 자라 열세 살 무렵 신라의 임금이 되어요. 알에서 태어났다는 난생 신화예요.|기록마다 내용이 조금씩 달라요.
연오랑과 세오녀|『삼국유사』에 전해지는 신라 시대 설화예요.|신라의 어부 연오랑과 아내 세오녀가 동해 바닷가에 살았어요. 연오랑이 바위를 타고 일본에 가서 왕이 되어요. 세오녀도 남편을 찾아 바위를 타고 일본으로 가요. 그러자 신라에서는 해와 달이 빛을 잃어요. 신라 사람들은 세오녀가 짠 비단으로 제사를 지내 빛을 되찾아요.|설화이므로 역사적 사실과는 구분해 읽어야 해요.
안중근|안중근은 1879년에 태어난 독립운동가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 안중근은 황해도에서 태어나 일찍 의병 활동과 계몽 운동에 참여했어요. 일본의 침략이 이어지자 연해주에서 의병을 조직하고 싸웠어요. 1909년 하얼빈 역에서 이토 히로부미를 저격하고 체포되어 뤼순 감옥에서 재판을 받았어요. 1910년 사형이 집행됐어요. 옥중에서 『동양평화론』을 쓰며 동양의 평화를 이야기했어요.|위인전은 책마다 서술이 조금씩 달라요.
유관순|유관순은 1902년에 태어난 독립운동가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 충청남도에서 태어난 유관순은 이화학당에서 공부했어요. 1919년 3·1 운동이 일어나자 서울에서 만세 운동에 참여한 뒤 고향 천안에서 아우내 장터 만세 시위를 이끌었어요. 일본 경찰에 붙잡혀 서대문 형무소에서 모진 고문을 받았어요. 1920년 감옥에서 순국했어요. 나이 어린 학생의 용기를 보여 줘요.|위인전은 책마다 서술이 조금씩 달라요.
장영실|장영실은 조선 세종 때의 과학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 관노 출신인 장영실은 손재주가 뛰어나 세종의 눈에 띄어 관직에 올랐어요. 중국에 가서 천문 기구를 배우고 돌아와 혼천의 제작에 참여했어요. 물시계 자격루와 측우기, 해시계 앙부일구 등을 만들거나 개량하는 데 공을 세웠어요. 임금이 탈 수레를 만들다 문제가 생겨 벌을 받은 뒤 기록에서 사라져요. 신분을 넘어선 재능과 노력을 이야기해요.|위인전은 책마다 서술이 조금씩 달라요.
방정환|방정환은 1899년에 태어난 아동 문학가이자 사회 운동가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 서울에서 태어난 방정환은 어린 시절 가난 속에서도 책을 좋아했어요. 일본 유학 중 아동 문학과 어린이 운동에 관심을 가졌어요. 1922년 5월 1일 처음으로 어린이날을 만들고 잡지 『어린이』를 펴냈어요. 어린이를 한 사람의 인격으로 대하자고 외쳤고 1931년 세상을 떠났어요. 지금의 어린이날의 기원을 알 수 있어요.|위인전은 책마다 서술이 조금씩 달라요.
아인슈타인|알베르트 아인슈타인은 1879년 독일에서 태어난 물리학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어린 시절 말이 늦었지만 수학과 물리에 관심이 많았어요. 1905년 특수 상대성 이론과 광양자 가설 등 중요한 논문을 발표했어요. 1915년 일반 상대성 이론을 완성했고 1921년 노벨 물리학상을 받았어요. 나치를 피해 미국으로 건너가 연구를 이어 갔어요. 평화를 이야기한 과학자로도 알려져 있어요.|위인전은 책마다 서술이 조금씩 달라요.
파스퇴르|루이 파스퇴르는 1822년 프랑스에서 태어난 화학자이자 미생물학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 파스퇴르는 화학 연구로 출발해 발효와 부패가 미생물 때문에 일어난다는 사실을 밝혔어요. 음식물을 가열해 균을 없애는 저온 살균법을 개발해 포도주와 우유의 변질을 막는 데 도움을 줬어요. 닭 콜레라와 탄저병의 백신을 만들고 1885년 광견병 백신을 사람에게 처음 접종했어요. 병은 눈에 보이지 않는 세균이 옮긴다는 생각을 널리 알린 인물이에요. 끈기 있는 실험 정신을 배울 수 있어요.|위인전은 책마다 서술이 조금씩 달라요.
마틴 루서 킹|마틴 루서 킹 주니어는 1929년 미국에서 태어난 목사이자 흑인 인권 운동가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 킹은 인종 차별이 심하던 미국 남부에서 자랐고 목사가 되어 비폭력 저항을 이끌었어요. 1955년 몽고메리 버스 보이콧 운동을 이끌었고 1963년 워싱턴 대행진에서 '나에게는 꿈이 있습니다' 연설을 했어요. 1964년 노벨 평화상을 받았어요. 1968년 암살당해 세상을 떠났어요. 평등과 비폭력의 가치를 생각하게 해요.|위인전은 책마다 서술이 조금씩 달라요.
넬슨 만델라|넬슨 만델라는 1918년 남아프리카공화국에서 태어난 정치인이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 만델라는 변호사가 되어 백인이 흑인을 차별하는 아파르트헤이트 제도에 맞서 싸웠어요. 이 일로 체포되어 27년 동안 감옥에 갇혔어요. 1990년 풀려난 뒤 인종 간 화해를 이끌었고 1993년 노벨 평화상을 받았어요. 1994년 남아공 최초의 흑인 대통령이 됐어요. 용서와 화합의 정신을 이야기해요.|위인전은 책마다 서술이 조금씩 달라요.
갈릴레오 갈릴레이|갈릴레오 갈릴레이는 1564년 이탈리아에서 태어난 천문학자이자 물리학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 갈릴레이는 망원경으로 하늘을 관측해 달의 산과 목성의 위성, 금성의 변화를 발견했어요. 이 관측은 지구가 우주의 중심이라는 생각에 의문을 던지는 증거가 됐어요. 지동설을 지지했다가 종교 재판에 서게 되어 자신의 주장을 철회하도록 강요받았어요. 말년에는 집에 갇혀 지내다 1642년에 세상을 떠났어요. 과학적 관찰과 용기의 가치를 알려 줘요.|위인전은 책마다 서술이 조금씩 달라요.
찰스 다윈|찰스 다윈은 1809년 영국에서 태어난 생물학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 다윈은 젊은 시절 비글호를 타고 5년 가까이 세계를 항해하며 여러 지역의 동식물을 관찰했어요. 특히 갈라파고스 제도의 생물을 보고 생물이 환경에 맞게 변해 간다는 생각을 키웠어요. 1859년 『종의 기원』을 펴내 자연 선택에 의한 진화론을 발표했어요. 이 책은 큰 논란과 함께 생물학을 바꿔 놓았어요. 관찰과 기록의 중요성을 배울 수 있어요.|위인전은 책마다 서술이 조금씩 달라요.
아문센|로알드 아문센은 1872년 노르웨이에서 태어난 극지 탐험가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어릴 때부터 탐험가를 꿈꾼 아문센은 극지 탐험에 필요한 기술을 철저히 익혔어요. 북서 항로를 처음으로 항해한 뒤 남극점 정복을 목표로 삼았어요. 1911년 12월 개 썰매를 이용해 인류 최초로 남극점에 도달했어요. 영국의 스콧 탐험대와의 경쟁으로도 유명해요. 철저한 준비와 도전 정신을 보여 줘요.|위인전은 책마다 서술이 조금씩 달라요.
마르코 폴로|마르코 폴로는 1254년경 이탈리아 베네치아에서 태어난 상인이자 여행가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 마르코 폴로는 아버지, 삼촌과 함께 실크로드를 따라 중국의 원나라까지 여행했어요. 쿠빌라이 칸을 만나 여러 해 동안 관리로 일하며 중국 곳곳을 다녔어요. 약 24년 만에 고향으로 돌아와 감옥에서 만난 작가에게 여행 이야기를 들려주었고 이것이 『동방견문록』이 됐어요. 이 책은 서양 사람들에게 동양에 대한 호기심을 불러일으켰어요.|위인전은 책마다 서술이 조금씩 달라요. 『동방견문록』의 내용 일부는 사실 여부에 논란이 있어요.
칭기즈 칸|칭기즈 칸은 1162년경 몽골에서 태어난 몽골 제국의 창건자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어릴 적 이름은 테무진이었고 아버지가 죽은 뒤 어려운 어린 시절을 보냈어요. 여러 부족을 통합해 1206년 쿠릴타이에서 칭기즈 칸이라는 칭호를 받았어요. 뛰어난 기마병과 전술로 중앙아시아와 중국 북부 등을 정복했어요. 능력에 따라 사람을 쓰고 역참 제도를 두어 제국을 운영했어요. 그의 정복은 많은 희생을 낳았다는 평가도 함께 있어요.|위인전은 책마다 서술이 조금씩 달라요.
나폴레옹|나폴레옹 보나파르트는 1769년 코르시카에서 태어난 프랑스의 군인이자 황제예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 나폴레옹은 군사 학교를 거쳐 프랑스 혁명기에 군인으로 이름을 알렸어요. 1799년 정권을 잡고 1804년 스스로 황제가 됐어요. 나폴레옹 법전을 만들어 근대 법 제도에 영향을 주었어요. 유럽 곳곳을 정복했지만 1812년 러시아 원정에서 크게 실패하고 1815년 워털루 전투에서 패해 세인트헬레나 섬으로 유배돼 세상을 떠났어요. 영웅과 정복자라는 평가가 함께 있어요.|위인전은 책마다 서술이 조금씩 달라요.
잔 다르크|잔 다르크는 1412년경 프랑스에서 태어난 농가의 딸이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 백년 전쟁 중 프랑스가 위기에 빠졌을 때 잔은 신의 목소리를 들었다며 군대를 이끌겠다고 나서요. 1429년 오를레앙을 구해 내 샤를 왕세자가 왕으로 즉위하도록 도왔어요. 이후 부르고뉴군에게 붙잡혀 영국에 넘겨지고 종교 재판에서 이단으로 몰려 1431년 화형을 당했어요. 훗날 재심으로 복권됐고 프랑스의 수호 성녀로 기려져요.|위인전은 책마다 서술이 조금씩 달라요.
코페르니쿠스|니콜라우스 코페르니쿠스는 1473년 폴란드에서 태어난 천문학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 코페르니쿠스는 대학에서 천문학과 수학을 공부하고 성직자로 일하면서 천체를 관찰했어요. 당시에는 지구가 우주의 중심이라는 천동설이 믿어졌지만 그는 태양이 중심이라는 지동설을 연구했어요. 이 생각을 담은 『천체의 회전에 관하여』는 1543년 그가 죽을 무렵 출간됐어요. 이 이론은 훗날 갈릴레이와 케플러 등의 연구로 이어졌어요.|위인전은 책마다 서술이 조금씩 달라요.
빈센트 반 고흐|빈센트 반 고흐는 1853년 네덜란드에서 태어난 화가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 고흐는 화랑 점원, 교사, 전도사 등을 거쳐 20대 후반에 화가의 길을 택했어요. 동생 테오의 도움을 받으며 「감자 먹는 사람들」 등을 그렸어요. 프랑스 아를과 생레미에서 「해바라기」, 「별이 빛나는 밤」 같은 대표작을 그렸어요. 정신적으로 힘든 시기를 보내다 1890년 37세에 세상을 떠났어요. 살아 있을 때는 인정받지 못했지만 후에 널리 사랑받았어요.|위인전은 책마다 서술이 조금씩 달라요.
파블로 피카소|파블로 피카소는 1881년 스페인에서 태어난 화가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 어릴 때부터 그림 실력이 뛰어났고 미술 교사였던 아버지에게 배웠어요. 파리로 건너가 '청색 시대', '장밋빛 시대'를 거치며 화풍을 바꿔 갔어요. 조르주 브라크와 함께 입체파(큐비즘)를 이끌었어요. 스페인 내전의 비극을 그린 「게르니카」가 대표작이에요. 평생 다양한 방식의 작품을 만들며 20세기 미술에 큰 영향을 주었어요.|위인전은 책마다 서술이 조금씩 달라요.
최무선|최무선은 고려 말의 무신이자 과학 기술자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 왜구의 침입이 잦던 고려 말 최무선은 화약을 만들어야 한다고 생각해요. 당시 화약 제조법은 중국이 비밀로 하여 구하기 어려웠으나 중국 상인에게서 염초 제조 기술을 배웠다고 전해져요. 1377년 화통도감을 설치해 화약과 화포를 만들었어요. 1380년 진포 대첩에서 화포로 왜구의 배를 무찌르는 데 큰 역할을 했어요. 『화약수련법』 등을 썼다고 알려져 있어요.|위인전은 책마다 서술이 조금씩 달라요.
박지원|박지원은 1737년에 태어난 조선 후기의 실학자이자 소설가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 박지원은 양반 집안에서 태어났지만 벼슬보다 학문과 글에 관심을 두었어요. 청나라에 사신 일행으로 다녀온 경험을 『열하일기』에 기록해 새로운 문물을 배우자고 주장했어요. 「양반전」, 「허생전」, 「호질」 등 양반 사회를 풍자하는 소설을 썼어요. 이용후생을 중시한 북학파의 대표 인물이에요.|위인전은 책마다 서술이 조금씩 달라요.
주시경|주시경은 1876년에 태어난 한글 학자예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 주시경은 어려서 한학을 공부하다 배재학당에서 신학문을 접했어요. 우리말을 '한글'이라 부르며 우리말 연구와 보급에 힘썼어요. 『국어 문법』 등을 쓰고 맞춤법과 문법 체계를 정리하는 데 기여했어요. 일제 강점기에도 우리말을 지키려 힘쓰다 1914년 세상을 떠났어요. 한글 연구의 기초를 마련한 인물로 평가돼요.|위인전은 책마다 서술이 조금씩 달라요.
홍범도|홍범도는 1868년에 태어난 독립운동가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 평안도에서 태어나 어린 나이에 고아가 되었고 군인, 노동자 등의 일을 하며 살았어요. 일본의 침략에 맞서 의병 활동에 나섰고 산포수들을 모아 부대를 이끌었어요. 1920년 봉오동 전투에서 일본군을 크게 이겼고 청산리 전투에도 참여했어요. 이후 소련으로 이동해 살다 1943년 세상을 떠났어요. 유해는 2021년 한국으로 돌아와 안장됐어요.|위인전은 책마다 서술이 조금씩 달라요.
신채호|신채호는 1880년에 태어난 역사학자이자 독립운동가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 신채호는 어려서부터 학문에 뛰어났고 성균관 박사가 되었어요. 신문에 글을 써 일제의 침략을 비판하고 민족의식을 일깨웠어요. 중국으로 망명해 독립운동에 참여하며 『조선상고사』, 『조선사연구초』 등을 썼어요. 역사를 바로 아는 것이 나라를 지키는 길이라고 보았어요. 1936년 중국 뤼순 감옥에서 순국했어요.|위인전은 책마다 서술이 조금씩 달라요.
한용운|한용운은 1879년에 태어난 승려이자 시인, 독립운동가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 한용운은 충청남도 홍성에서 태어나 설악산 백담사에서 승려가 됐어요. 1919년 3·1 운동 때 민족 대표 33인의 한 사람으로 참여해 감옥에 갇혔어요. 불교를 개혁하자고 주장했고 시집 『님의 침묵』을 펴냈어요. 일제의 압박에도 끝까지 신념을 지키다 1944년 세상을 떠났어요. 저항 시인으로도 알려져 있어요.|위인전은 책마다 서술이 조금씩 달라요.
이봉창|이봉창은 1901년에 태어난 독립운동가예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 서울에서 태어난 이봉창은 일본에서 노동자로 일하며 차별을 겪었어요. 상하이로 건너가 김구가 이끄는 한인애국단에 가입했어요. 1932년 도쿄에서 일왕의 마차 행렬에 폭탄을 던졌으나 목적을 이루지 못하고 체포됐어요. 같은 해 처형되어 순국했어요. 이 의거는 중국 사회에 큰 반향을 일으켰어요.|위인전은 책마다 서술이 조금씩 달라요.
대조영|대조영은 7세기 말 발해를 세운 인물이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 고구려가 멸망한 뒤 대조영은 고구려 유민을 이끌고 당나라의 지배를 벗어나려 해요. 698년 동모산 일대에 나라를 세우고 이름을 진국이라 했으며 뒤에 발해로 바꾸었어요. 천문령 전투에서 당의 추격군을 물리쳤다고 전해져요. 발해는 고구려의 옛 땅을 이어받아 '해동성국'으로 불릴 만큼 발전했어요.|기록이 많지 않아 책마다 내용이 조금씩 달라요.
정몽주|정몽주는 1337년에 태어난 고려 말의 학자이자 충신이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 정몽주는 성리학에 뛰어나 '동방 이학의 조종'이라 불렸어요. 외교관으로 명나라와 일본을 오가며 문제를 해결했어요. 이성계가 세력을 키우자 고려를 지키려는 입장에 섰어요. 1392년 선죽교에서 이방원 일파에게 살해됐어요. 「단심가」로 고려에 대한 충절을 표현했다고 전해져요.|위인전은 책마다 서술이 조금씩 달라요.
서희|서희는 942년에 태어난 고려 초의 문신이자 외교관이에요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 993년 거란의 소손녕이 고려를 침략하자 일부 신하들은 땅을 떼어 주자고 했어요. 서희는 소손녕을 만나 고려가 고구려를 이은 나라이며 거란과 교류하지 못한 것은 여진 때문이라고 설득했어요. 그 결과 전투 없이 군대를 물리고 강동 6주를 얻어 영토를 넓혔어요. 말솜씨와 지혜로 이룬 외교 담판으로 널리 알려져 있어요.|위인전은 책마다 서술이 조금씩 달라요.
권율|권율은 1537년에 태어난 조선의 장수예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 늦은 나이인 40대 후반에 과거에 급제했고 임진왜란이 일어나자 전라도 광주 목사로 활약했어요. 1593년 행주산성에서 적은 병력으로 일본군을 크게 물리친 행주 대첩으로 이름을 알렸어요. 이후 도원수가 되어 군을 이끌었어요. 1599년 세상을 떠났어요.|위인전은 책마다 서술이 조금씩 달라요.
김시민|김시민은 1554년에 태어난 조선의 장수예요.|이 책은 위인전이라 줄거리 대신 구성으로 소개해요. 임진왜란이 일어나자 진주 판관으로 있다가 진주 목사가 됐어요. 1592년 진주성 전투에서 3,800여 명의 병력으로 2만 명 가까운 일본군을 막아 냈어요. 이 전투는 임진왜란 3대 대첩 중 하나로 꼽혀요. 김시민은 전투 중 총탄에 맞아 숨졌어요. 진주성을 지킨 용기와 지휘력을 이야기해요.|위인전은 책마다 서술이 조금씩 달라요.
워터십 다운|리처드 애덤스는 1920년생 영국의 작가예요.|토끼 파이버는 자신이 사는 굴이 곧 파괴될 것이라는 불길한 예감을 느껴요. 형 헤이즐을 비롯한 몇 마리의 토끼가 파이버의 말을 믿고 굴을 떠나요. 이들은 낯선 땅을 지나며 포식자와 사람의 위험을 겪어요. 새 보금자리 워터십 다운에 자리를 잡지만 암토끼가 없어 고민하다 이웃 토끼 굴과 맞닥뜨려요. 헤이즐 일행은 지혜와 용기로 위기를 넘어요.|1972년 출간됐어요. 토끼들 사이의 싸움 장면이 나와요.
짐 크노프와 기관사 루카스|미하엘 엔데는 1929년생 독일의 작가예요.|작은 섬나라 룸머란트에 우편물 상자에 담긴 흑인 아기 짐이 도착해요. 섬 주민 루카스와 부인은 짐을 키우고 짐은 루카스의 기관차 엠마와 함께 자라요. 짐과 루카스는 납치된 공주 리시를 찾으러 엠마를 타고 모험을 떠나요. 이들은 사막과 용의 도시를 지나 위기를 넘어요. 짐은 자신의 정체와 가족을 알게 돼요.|1960년 출간됐어요.
이상한 과자 가게 전천당|히로시마 레이코는 일본의 동화 작가예요.|골목 안쪽에 있는 이상한 과자 가게 전천당에는 먹으면 소원이 이루어지는 신기한 과자가 있어요. 가게 주인 베니코는 정해진 사람에게만 과자를 팔아요. 과자를 산 아이들은 소원을 이루지만 규칙을 어기거나 욕심을 부리면 곤란한 일을 겪어요. 이야기마다 서로 다른 아이들이 나오고 과자의 힘으로 문제를 해결하려다 큰 대가를 치르기도 해요. 욕심과 책임에 대해 생각하게 해요.|2012년 일본에서 시리즈로 출간됐어요. 권마다 내용이 달라요.
마법의 시간여행|메리 폽 어즈번은 1949년생 미국의 작가예요.|잭과 애니 남매는 숲에서 마법의 나무 집을 발견해요. 나무 집 안의 책을 펼치고 가고 싶은 곳을 가리키면 그곳으로 시간 여행을 하게 돼요. 남매는 공룡 시대, 고대 이집트, 중세 기사 시대 등 여러 시대에서 모험해요. 마법사 모건 할머니의 부탁으로 임무를 해결하며 돌아와요. 시리즈로 이어지며 역사와 과학 상식도 배울 수 있어요.|1992년 첫 권이 나왔어요. 권마다 내용이 달라요.
잘못 뽑은 반장|이은재는 어린이 책을 쓰는 우리나라 작가이고 그림은 서영경이 그렸어요.|4학년 5반의 이로운은 걸핏하면 지각하고 친구들을 괴롭혀 반 친구들이 피해요. 로운이는 자신을 피하는 아이들에게 반장 선거에 나가겠다고 선언해요. 거짓말과 협박으로 표를 얻어 반장이 되지만 반장 일이 쉽지 않자 부반장에게 일을 떠넘겨요. 그 결과 반은 학교에서 가장 시끄러운 반이 되고 아이들의 비난이 쏟아져요. 이후 로운이는 진짜 반장이 되려고 노력하며 친구들을 돕고 질투심에 자신을 미워하던 제하와도 화해해요.|주니어김영사의 '한뼘도서관' 시리즈로 나왔어요. 신뢰는 진심으로 다가갈 때 쌓인다는 점과 책임감의 의미를 이야기해요.
까막눈 삼디기|원유순은 어린이 책을 쓰는 우리나라 작가예요.|삼디기는 할머니와 단둘이 사는 아이예요. 2학년이 되어서도 글을 읽지 못해 친구들에게 놀림을 받아요. 그래도 삼디기는 기죽지 않고 열심히 노력해요. 결국 자신을 놀렸던 친구들 앞에서 당당하게 글을 읽게 돼요. 따뜻하고 희망을 전하는 이야기예요.|웅진주니어의 '웅진 푸른교실' 시리즈 2권으로 나왔어요.
엄마는 해녀입니다|고희영은 다큐멘터리 「물숨」을 만든 감독이자 이 그림책의 글 작가예요. 그림은 스페인 화가 에바 알머슨이 그렸어요.|이 책은 제주 해녀 삼대의 이야기를 아이의 시선으로 그린 그림책이에요. 아이는 해녀인 할머니와 엄마를 늘 바라보고 기다려요. 엄마는 젊은 시절 바다가 싫어 육지에서 미용실 일을 했다가 도시의 소음에 지쳐 다시 제주 바다로 돌아와 해녀가 됐어요. 어느 날 깊은 바다에서 숨을 놓칠 뻔한 엄마를 할머니가 물 밖으로 끌어올려요. 할머니는 바다에서 욕심을 부리면 목숨을 잃을 수 있다고 일러 줘요.|난다에서 펴냈어요. 해녀들은 전통 도구만 쓰고 어린 해산물은 잡지 않으며 바다가 내어 주는 만큼만 가져오는 약속을 지켜요.
잔소리 없는 날|안네마리 노르덴은 외국의 어린이 책 작가예요. 그림은 원유미가 그렸고 배정희가 우리말로 옮겼어요.|푸셀은 부모님의 간섭이 지나치다고 느껴 하루만이라도 잔소리 없이 지내고 싶다고 말해요. 부모님은 하루 동안의 '잔소리 없는 날'을 허락해요. 푸셀은 학교를 빼먹고 세수와 양치를 건너뛰며 좋아하는 음식을 마음껏 먹어요. 단짝 올레의 권유로 오디오를 사려 하고 파티를 열고 공원에서 캠핑을 하는 큰 계획을 세우지만 순탄하지 않아 말썽에 휘말려요. 부모님은 "그럴 줄 알았다"며 나무라지 않고 아이를 묵묵히 지켜보며 약속을 지켜요.|보물창고의 '상상놀이터' 시리즈 1권이에요. 자유와 불안 사이를 오가는 아이와 아이를 믿고 기다리는 부모의 태도를 이야기해요.
양파의 왕따 일기|문선이 외 1명이 쓴 우리나라 창작 동화예요.|4학년이 된 정화는 반에서 인기가 많은 미희와 친해지고 싶어 해요. 정화는 미희를 따르는 무리인 '양파'에 들기를 바라요. 시간이 지나며 정화는 양파의 행동이 늘 옳지는 않다는 것을 깨닫지만 미희와 가까워지고 싶은 마음은 여전해요. 미희가 양파에 들어오라고 권하자 정화는 크게 기뻐해요. 하지만 양파가 반 친구들을 따돌리는 것이 옳지 않다고 느끼면서도 무리에 낀 기쁨 때문에 말하지 못해요. 이후 같은 양파 안의 친구까지 따돌림을 당하자 정화의 마음은 점점 괴로워져요.|2001년 출간됐어요. 따돌림을 다루고 있어요. 옳고 그름을 구별하고 잘못을 보면 말할 수 있는 용기를 이야기해요.
마지막 거인|프랑수아 플라스는 프랑스의 작가이자 화가로 글과 그림을 모두 맡았어요. 윤정임이 우리말로 옮겼어요.|한 지리학자가 온순한 거인들이 사는 땅을 찾았던 일을 회상해요. 책은 이 아름다운 거인들의 모습을 자세히 묘사해요. 거인들의 나라가 바깥세상에 알려지면서 이 땅의 비극이 시작돼요. 이야기는 인간의 탐욕과 자연의 파괴를 다룬 환경 우화로 읽혀요. 거인들은 인간 자신의 모습을 비춰 보여 줘요.|출판사 소개에 따르면 12~13세 정도의 독자에게 권하고 어른이 읽어도 좋은 책이에요.
요술 손가락|로알드 달은 1916년생 영국의 작가예요.|여덟 살 소녀는 화가 나면 손가락 끝이 따끔거리다 요술을 부려요. 소녀는 이웃 그레그 가족이 오리를 사냥하는 것을 보고 화가 나요. 그레그 가족을 요술 손가락으로 가리키자 가족이 몸이 작아지고 팔에 날개가 돋아 새처럼 변해요. 오리들은 사람처럼 커져 총을 들고 가족이 살던 집에 살아요. 그레그 가족은 쫓기는 처지가 되어 사냥의 두려움을 겪고 다시는 사냥하지 않겠다고 약속해요.|1966년 출간됐어요. 동물 사냥에 대한 생각을 하게 해요.
고양이 학교|김진경은 우리나라 작가예요. 이 작품은 시리즈로 이어지는 판타지 동화예요.|이야기의 중심에는 고대 예언과 수정동굴을 둘러싼 대립이 있어요. 수정 고양이들과 인류의 멸망을 꾀하는 그림자 고양이들이 맞서요. 천 년 전 일식이 일어났을 때 그림자 고양이들이 수정동굴을 공격했고 그 뒤 동굴은 어둠과 침묵에 잠겼어요. 예언과 수정동굴의 비밀을 간직한 고양이 학교에 수정 고양이들이 입학하면서 본격적인 이야기가 펼쳐져요. 수정 고양이들이 바라는 것은 인간을 포함한 모든 생물이 함께 살아가는 세상이에요.|문학동네어린이에서 2004년 1권 『수정 동굴의 비밀』이 나왔어요. 인간이 다른 생물을 대하는 방식을 돌아보게 하는 생태 동화로도 읽혀요.
