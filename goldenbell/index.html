어린 왕자|앙투안 드 생텍쥐페리는 1900년생 프랑스의 작가이자 비행사예요.|사하라 사막에 불시착한 조종사 '나'는 금발의 작은 소년을 만나요. 소년은 아주 작은 별 B612에서 온 어린 왕자예요. 어린 왕자는 자신이 아끼던 장미와 다툰 뒤 여러 별을 여행하며 왕, 허영쟁이, 술꾼, 사업가 같은 이상한 어른들을 만나요. 지구에서는 여우를 만나 길들인다는 것이 관계를 맺는 일이라는 비밀을 배워요. 어린 왕자는 자기 별로 돌아가기 위해 뱀에게 몸을 맡기고 '나'는 별을 볼 때마다 그를 떠올려요.|1943년 출간됐고 '가장 중요한 것은 눈에 보이지 않아'라는 말이 유명해요.
소나기|황순원은 1915년생 소설가예요.|시골 소년은 개울가에서 서울에서 온 소녀를 만나요. 소녀는 조약돌을 던지며 소년에게 말을 걸고 둘은 산 너머로 놀러 가요. 갑자기 소나기가 쏟아지자 둘은 원두막에서 비를 피하고 소년은 소녀를 업고 개울을 건너요. 소녀는 그날 비를 맞아 병이 들고 한동안 보이지 않아요. 결국 소녀가 죽었다는 소식을 듣고 소년은 소녀가 입던 옷을 입혀 묻어 달라는 말을 전해 들어요.|1953년 발표됐고 순수한 첫사랑을 그린 대표 단편이에요.
동백꽃|김유정은 1908년생 소설가예요.|열일곱 살 소작농 아들인 '나'는 마름의 딸 점순이가 자꾸 시비를 걸어 곤란해요. 점순이는 감자를 건네며 호의를 보이지만 '나'는 눈치채지 못하고 거절해요. 점순이는 화가 나서 '나'의 닭을 자기 집 닭으로 쪼게 해요. 닭싸움이 계속되다 '나'는 화가 나 점순이네 닭을 때려 죽이고 겁에 질려요. 점순이는 입 다물겠다며 '나'를 동백꽃 속으로 쓰러뜨려요.|1936년 발표됐어요. 향토적 해학이 돋보여요.
운수 좋은 날|현진건은 1900년생 소설가예요.|인력거꾼 김 첨지는 아픈 아내를 두고 비 오는 날 일을 나가요. 그날따라 손님이 많아 돈을 많이 벌어 기분이 좋아요. 그러나 집에 가까워질수록 불길한 예감이 들고 술집에서 시간을 보내요. 아내는 설렁탕이 먹고 싶다고 했는데 그는 설렁탕을 사 들고 집에 돌아와요. 집에 들어서자 아내는 이미 죽어 있고 아이가 젖을 빨고 있어요.|1924년 발표됐어요. 제목과 반대되는 비극적 상황이 반어적으로 드러나요.
사랑손님과 어머니|주요섭은 1902년생 소설가예요.|여섯 살 옥희는 일찍 아버지를 잃고 어머니와 둘이 살아요. 어느 날 아버지 친구인 아저씨가 사랑방에 하숙을 와요. 아저씨는 옥희를 귀여워하고 옥희는 삶은 달걀을 좋아하는 아저씨에게 달걀을 가져다줘요. 옥희가 어머니가 준 꽃을 아저씨에게 전하면서 두 사람은 서로 마음이 있음을 알게 돼요. 어머니는 세상의 눈과 체면을 생각해 마음을 접고 아저씨는 떠나요.|1935년 발표됐고 어린아이의 시선으로 쓴 점이 특징이에요.
수난이대|하근찬은 1931년생 소설가예요.|일제강점기에 강제 징용을 갔다가 팔을 잃은 아버지 박만도는 6·25 전쟁에 나갔던 아들 진수를 마중하러 기차역에 나가요. 아들은 돌아오지만 한쪽 다리를 잃었어요. 아버지는 충격을 받지만 애써 표정을 감춰요. 둘은 집으로 가는 길에 외나무다리를 건너야 하는데 아버지가 아들을 업고 아들이 지팡이와 짐을 들고 건너요. 두 세대의 아픔과 서로를 의지하는 모습이 드러나요.|1957년 발표됐어요.
자전거 도둑|박완서는 1931년생 소설가예요.|소년 수남이는 청계천 전기용품 상회에서 일하며 야간학교에 다녀요. 어느 날 배달을 갔다가 바람에 자전거가 넘어져 승용차에 흠집을 내요. 차 주인은 수리비를 요구하며 자전거를 묶어 놓고 가요. 수남이는 겁이 나서 자전거를 들고 도망쳐요. 가게로 돌아오니 주인 영감은 칭찬하지만 수남이는 마음이 편치 않고 죄책감을 느끼며 번민해요.|1979년 발표됐어요. 양심과 도덕을 다뤄요.
우리들의 일그러진 영웅|이문열은 1948년생 소설가예요.|서울에서 전학 온 한병태는 새 학교에서 반을 지배하는 급장 엄석대를 만나요. 엄석대는 힘과 꾀로 아이들을 복종시키고 선생님도 속이고 있어요. 병태는 처음에는 저항하지만 외롭게 고립되고 결국 석대에게 굴복해 편한 길을 택해요. 새로 온 담임 선생님이 석대의 부정을 밝히고 아이들은 석대를 외면해요. 세월이 지난 후 병태는 어른이 된 석대의 초라한 모습을 떠올려요.|1987년 발표됐어요. 권력과 집단의 순응을 다뤄요.
홍길동전|허균은 1569년생 조선 중기의 문인이에요.|홍판서의 서자 길동은 총명하지만 서자라는 이유로 아버지를 아버지라, 형을 형이라 부르지 못해 한탄해요. 자객의 위협을 피해 집을 떠난 그는 도적 떼의 우두머리가 돼 활빈당을 이끌며 탐관오리의 재물을 빼앗아 가난한 백성에게 나눠 줘요. 임금은 길동을 잡으려 하지만 도술을 쓰는 길동은 쉽게 잡히지 않아요. 결국 병조판서 벼슬을 받고 조선을 떠나 율도국을 정벌해 왕이 돼요.|조선 시대 신분 제도를 비판한 한글 소설로 알려져 있어요. 작가가 허균이라는 점은 학계에 이견도 있어요.
춘향전|작자 미상의 조선 시대 판소리계 소설이에요.|남원 부사의 아들 이몽룡은 단옷날 그네 타는 기생의 딸 성춘향을 보고 사랑에 빠져 혼인을 약속해요. 이몽룡이 아버지를 따라 한양으로 떠난 사이 새로 부임한 사또 변학도가 춘향에게 수청을 강요해요. 춘향은 절개를 지켜 거절하고 옥에 갇혀요. 과거에 급제해 암행어사가 된 이몽룡이 거지 행색으로 돌아와 상황을 살피고 생일잔치에서 어사출두를 해 변학도를 벌해요. 춘향과 몽룡은 다시 만나 행복하게 살아요.|18세기 이후 판소리와 소설로 널리 퍼졌어요.
나의 라임오렌지나무|J. M. 바스콘셀로스는 1920년생 브라질의 작가예요.|다섯 살 제제는 가난한 집에서 매를 맞으며 자라는 장난꾸러기예요. 제제는 집 뒤뜰의 라임오렌지나무 밍기뉴와 이야기를 나누며 외로움을 달래요. 포르투갈 사람 뽀르뚜가 아저씨를 만나 친구가 되고 그에게서 사랑을 느껴요. 어느 날 뽀르뚜가가 기차 사고로 죽자 제제는 크게 앓아요. 시간이 지나 밍기뉴도 베어지고 제제는 어른이 되어가요.|1968년 출간됐어요. 어린 시절의 상처와 성장을 그린 자전적 소설이에요.
아몬드|손원평은 1979년생 소설가예요.|열여섯 살 윤재는 감정을 느끼거나 표현하기 어려운 감정표현불능증을 앓고 있어요. 크리스마스 이브에 거리의 묻지마 사건으로 할머니는 세상을 떠나고 어머니는 식물인간이 돼요. 윤재는 홀로 헌책방을 운영하며 살다가 폭력적이지만 상처 많은 곤이를 만나요. 친구 도라와 곤이와 관계를 맺으면서 윤재는 조금씩 감정을 배우기 시작해요. 마지막에는 곤이를 위해 용기를 내요.|2017년 출간돼 큰 인기를 얻었어요. 폭력 장면이 일부 나와요.
완득이|김려령은 1971년생 소설가예요.|고등학생 완득이는 난쟁이 아버지와 함께 살고 필리핀 출신 어머니는 집을 나가 만나지 못해요. 담임인 별난 선생님 똥주는 틈만 나면 완득이를 괴롭히지만 그의 사정을 알고 도와줘요. 완득이는 우연히 킥복싱을 배우며 몸과 마음의 힘을 키워요. 옆집에는 어머니가 찾아오고 두 사람은 어색하게 마주해요. 완득이는 차츰 가족과 이웃을 받아들이며 성장해요.|2008년 출간됐어요. 다문화 가정, 장애 등을 다뤄요.
기억 전달자|로이스 로리는 1937년생 미국의 작가예요.|공동체에서 모든 것이 평등하게 통제되는 세계에서 열두 살 조너스는 '기억 보유자'로 뽑혀요. 그는 노인 기버로부터 사랑, 고통, 색깔, 전쟁 같은 과거의 기억을 전달받아요. 조너스는 사람들이 선택과 감정을 잃은 채 살고 있음을 깨닫고 충격받아요. 아기 가브리엘이 위험에 처하자 조너스는 아기를 데리고 공동체를 떠나기로 해요. 눈 덮인 언덕을 넘어 새로운 곳에 이르며 이야기가 끝나요.|1993년 출간돼 뉴베리상을 받았어요.
모모|미하엘 엔데는 1929년생 독일의 작가예요.|원형 극장 폐허에서 사는 고아 소녀 모모는 남의 이야기를 잘 들어주어 사람들에게 사랑받아요. 어느 날 회색 신사들이 나타나 사람들에게 시간을 아끼라고 속여 시간을 훔쳐 가요. 사람들은 여유를 잃고 삭막해져요. 모모는 거북 카시오페이아의 안내로 시간을 관리하는 마이스터 호라를 만나 훔쳐 간 시간을 되찾으러 가요. 모모는 회색 신사를 물리치고 사람들에게 시간을 돌려줘요.|1973년 출간됐어요.
갈매기의 꿈|리처드 바크는 1936년생 미국의 작가예요.|갈매기 조나단 리빙스턴은 먹이를 얻기 위한 날갯짓보다 더 높고 빠르게 나는 데 몰두해요. 무리의 갈매기들은 이를 이상하게 여겨 그를 무리에서 쫓아내요. 조나단은 홀로 비행 훈련을 이어 가며 한계를 넘어서요. 그는 더 높은 세계에서 스승을 만나 완전한 자유를 배우고 다시 돌아와 제자들을 가르쳐요. 한계를 넘으려는 의지를 이야기해요.|1970년 출간됐어요.
안네의 일기|안네 프랑크는 1929년 독일에서 태어난 유대인 소녀예요.|제2차 세계대전 중 안네는 가족과 함께 네덜란드 암스테르담의 은신처에서 숨어 살아요. 안네는 선물 받은 일기장에 '키티'라는 이름을 붙이고 일상과 생각을 적어요. 좁은 공간에서 가족과 다른 사람들과의 갈등, 사춘기의 감정, 페터와의 우정을 기록해요. 1944년 8월 은신처가 발각되어 가족은 수용소로 끌려가요. 안네는 1945년 초 수용소에서 병으로 세상을 떠났고 아버지 오토 프랑크만 살아남았어요.|1947년 아버지가 일기를 출간했어요. 전쟁과 인권의 기록이에요.
노인과 바다|어니스트 헤밍웨이는 1899년생 미국의 작가로 1954년 노벨 문학상을 받았어요.|쿠바의 늙은 어부 산티아고는 84일째 고기를 잡지 못해요. 소년 마놀린은 노인을 존경하며 돕고 싶어 해요. 노인은 먼바다에 나가 거대한 청새치를 낚아 사흘 동안 사투를 벌여요. 끝내 청새치를 잡았지만 돌아오는 길에 상어 떼가 달려들어 뼈만 남아요. 노인은 빈손으로 돌아오지만 꿈을 꾸며 잠들어요.|1952년 출간됐고 1953년 퓰리처상을 받았어요.
걸리버 여행기|조너선 스위프트는 1667년생 아일랜드 출신의 작가예요.|외과 의사 걸리버는 여러 번의 항해에서 난파를 겪고 기이한 나라에 닿아요. 소인국 릴리퍼트에서는 사람들이 손가락만 한 크기이고 거인국에서는 오히려 자신이 작아져요. 하늘에 떠 있는 섬 라퓨타와 말이 지배하는 나라 후이넘도 방문해요. 각 나라에서 걸리버는 당대 사회와 인간을 풍자하는 모습을 목격해요. 돌아온 걸리버는 인간에게 환멸을 느껴요.|1726년 출간됐어요. 어린이용으로 알려졌지만 풍자 소설이에요.
지킬 박사와 하이드|로버트 루이스 스티븐슨은 1850년생 스코틀랜드의 작가예요.|런던의 존경받는 의사 지킬은 선과 악을 분리할 수 있다고 믿고 약을 만들어 마셔요. 그러자 악한 인격인 하이드로 변해 방탕한 행동을 해요. 하이드는 점점 폭력적이 되고 살인까지 저질러요. 약 없이도 하이드로 변하게 되자 지킬은 통제력을 잃어요. 결국 지킬은 자신의 비밀을 고백하는 편지를 남기고 죽음을 맞아요.|1886년 출간됐어요. 인간의 이중성을 다뤄요.
학|황순원은 1915년생 소설가예요.|6·25 전쟁 때 성삼은 고향 마을에서 치안대원이 되고 어릴 적 친구 덕재가 농민동맹 위원장이었다는 이유로 끌려오는 것을 봐요. 성삼은 덕재를 호송하라는 임무를 맡고 함께 길을 가요. 가는 동안 두 사람은 어린 시절 학을 잡던 추억을 떠올리며 마음이 흔들려요. 성삼은 덕재에게 학 사냥을 하자며 풀어 주고 덕재는 학이 날아가는 들판으로 걸어가요. 이념을 넘은 우정을 다뤄요.|1953년 발표됐어요.
돌다리|이태준은 1904년생 소설가예요.|도시에서 병원을 하는 아들 창섭이 아버지를 찾아와 병원을 확장할 돈이 필요하다며 시골 땅을 팔라고 해요. 아버지는 땅은 단순한 재산이 아니라 조상 대대로 일군 생명이라며 반대해요. 아버지는 돌다리를 고쳐 쓰는 것처럼 오래된 것을 소중히 여겨야 한다고 말해요. 창섭은 아버지의 고집을 이해하려고 하지만 생각이 달라 갈등해요. 아버지는 땅을 팔지 않고 의지를 지켜요.|1943년 발표됐어요. 전통과 근대의 대립을 다뤄요.
장마|윤흥길은 1942년생 소설가예요.|6·25 전쟁 중 장마철, 외할머니와 친할머니가 한집에 살아요. 외할머니의 아들은 국군 장교, 친할머니의 아들은 빨치산으로 나가 있어요. 두 할머니는 아들 문제로 서로 증오하고 갈등해요. 어느 날 친할머니의 아들이 죽었다는 소식이 오고 할머니는 충격을 받아요. 집에 구렁이가 나타나자 외할머니가 구렁이를 달래 돌려보내는 장면에서 갈등이 풀려요.|1973년 발표됐고 전쟁이 남긴 상처와 화해를 그려요.
눈길|이청준은 1939년생 소설가예요.|오랜만에 고향 집을 찾은 '나'는 늙은 어머니와 어색한 시간을 보내요. 어머니는 집을 팔아 버린 아들의 빚을 감춘 채 평생을 살아요. 아내는 어머니가 아들을 배웅하던 눈 오는 새벽의 이야기를 전해 줘요. 어머니는 아들을 보내고 혼자 눈길을 되돌아오며 눈물을 흘렸어요. '나'는 그 이야기를 듣고 어머니의 사랑을 깨달아요.|1977년 발표됐어요.
봄봄|김유정은 1908년생 소설가예요.|데릴사위로 들어온 '나'는 점순이와의 혼례를 기다리며 3년 7개월째 장인 밑에서 일만 해요. 장인은 점순이의 키가 아직 덜 컸다는 이유로 성례를 미루기만 해요. 점순이가 부추기자 '나'는 장인에게 따지고 들다가 싸움이 붙어요. 장인의 수염을 잡고 뒹굴지만 결국 점순이가 장인 편을 들어 '나'는 어이없어해요. 해학적인 말투로 소작농의 처지를 보여 줘요.|1935년 발표됐어요.
꺼삐딴 리|전광용은 1919년생 소설가예요.|의사 이인국은 일제강점기에는 일본인에게 아부해 출세하고 해방 후에는 소련군 장교의 치료를 맡아 목숨을 건져요. 월남한 뒤에는 미국 대사관 사람과 가까워지며 딸을 미국 유학 보내려 해요. 그는 꺼삐딴이라 불리며 권력에 따라 태도를 바꾸는 처세술을 자랑스러워해요. 그러나 아들과 딸에 대한 회한 같은 감정은 숨겨 둬요. 끝내 시대의 흐름에 편승하는 인물의 모습을 풍자해요.|1962년 발표됐어요.
그 많던 싱아는 누가 다 먹었을까|박완서는 1931년생 소설가예요.|이 작품은 자전적 소설이에요. 개성 근처 박적골에서 자란 어린 시절을 회상하며 산과 들에서 따 먹던 싱아 같은 풀을 떠올려요. 어머니를 따라 서울로 올라와 현저동에서 가난하게 살며 학교를 다녀요. 일제 말기 창씨개명과 징용, 해방과 6·25 전쟁 등 격동기를 몸으로 겪어요. 전쟁 중 오빠와 가족을 잃고 생활이 무너져도 살아남아 기록하겠다고 다짐해요.|1992년 출간됐어요.
B사감과 러브레터|현진건은 1900년생 소설가예요.|여학교 기숙사의 B사감은 엄격하고 쌀쌀맞은 노처녀 사감이에요. 그녀는 학생들에게 온 러브레터와 남자의 방문을 철저하게 단속해요. 어느 날 밤 기숙사 학생들은 B사감의 방에서 이상한 소리가 나는 것을 들어요. B사감은 몰래 압수한 러브레터를 읽으며 혼자 연인 역할과 여자 역할을 번갈아 연기하고 있었어요. 학생들은 놀라고 비웃지만 가엾게 여기기도 해요.|1925년 발표됐어요.
백치 아다다|계용묵은 1904년생 소설가예요.|말을 못 하고 모자란 취급을 받는 아다다는 시집을 가지만 쫓겨나 친정에도 돌아가지 못해요. 그녀는 가난한 수룡을 만나 섬에서 새 삶을 시작해요. 수룡이 돈을 모아 땅을 사려 하자 아다다는 돈 때문에 불행이 올까 두려워 돈을 바다에 버려요. 화가 난 수룡은 아다다를 바다에 밀어 버려요. 아다다는 바다에 빠지고 이야기가 끝나요.|1935년 발표됐어요. 폭력과 죽음이 나와요.
양반전|박지원은 1737년생 조선 후기의 실학자예요.|강원도에 가난한 양반이 환곡을 갚지 못해 감옥에 갈 처지가 돼요. 이웃의 부자가 곡식을 대신 갚아 주고 양반 신분을 사기로 해요. 군수가 증서를 작성하는데 양반이 지켜야 할 규칙이 너무 많고 번거로워요. 부자는 두 번째 증서를 요청하자 양반의 특권이 적힌 내용을 듣고 이는 도둑이나 다름없다며 거절하고 가 버려요. 양반의 위선을 풍자해요.|『연암집』에 실려 있어요.
박씨전|작자 미상의 조선 후기 소설이에요.|이시백은 이상한 모습의 박씨와 혼인하고 외모를 이유로 박씨를 멀리해요. 박씨는 시아버지의 지지를 받으며 도술을 쓰고 기이한 일을 해요. 어느 날 박씨가 허물을 벗고 아름다운 여인이 되자 시백은 후회해요. 병자호란 때 청나라 장수 용골대가 쳐들어오지만 박씨는 피화당에서 도술로 적을 물리치고 나라를 구해요. 패배한 조선과 달리 박씨는 승리를 거둬요.|병자호란 뒤 지어진 것으로 보여요.
사씨남정기|김만중은 1637년생 조선 후기의 문인이에요.|명문가의 사정옥은 현명하고 덕이 높은 여인이에요. 남편 유한림은 후사가 없자 교채란을 첩으로 들여요. 교씨는 아들을 낳은 뒤 사씨를 모함해 쫓아내고 정실 자리를 차지해요. 교씨는 간부와 짜고 악행을 저지르다 발각돼 유한림도 귀양을 가요. 훗날 진실이 밝혀져 사씨는 돌아오고 교씨는 벌을 받아요.|숙종이 인현왕후를 폐하고 장희빈을 맞은 일을 풍자한 것으로 해석돼요.
마지막 잎새|오 헨리는 1862년생 미국의 작가예요.|뉴욕 그리니치빌리지에 사는 가난한 화가 존시는 폐렴에 걸려 창밖의 담쟁이 잎이 모두 떨어지면 자신도 죽는다고 믿어요. 이웃의 노화가 베어먼은 존시를 위해 마음을 아파해요. 폭풍우가 몰아친 밤에도 마지막 잎 하나가 벽에 남아 있어 존시는 삶의 의지를 되찾아요. 하지만 그 잎은 베어먼이 비바람 속에서 그려 둔 그림이었고 그는 폐렴으로 세상을 떠나요.|1905년 발표됐어요.
크리스마스 선물|오 헨리는 1862년생 미국의 작가예요.|가난한 부부 짐과 델라는 크리스마스에 서로에게 선물을 주고 싶어 해요. 델라는 짐이 아끼는 시계에 어울리는 줄을 사 주려고 자신의 아름다운 머리카락을 팔아요. 한편 짐은 델라가 갖고 싶어 하던 머리빗을 사기 위해 시계를 팔아요. 선물을 교환한 두 사람은 서로의 희생을 알고 놀라요. 사랑의 가치를 이야기해요.|1905년 발표됐어요.
별|알퐁스 도데는 1840년생 프랑스의 작가예요.|프로방스 산에서 양을 치는 목동은 한 달에 한 번 식량을 가져다주는 주인집 아가씨 스테파네트를 짝사랑해요. 어느 날 아가씨가 먹을 것을 가져다주고 돌아가는 길에 소나기로 강이 불어 길이 막혀 산으로 돌아와요. 두 사람은 밤새 모닥불 곁에서 별을 바라보며 이야기를 나눠요. 아가씨가 목동의 어깨에 기대 잠들자 목동은 별들 중 가장 아름다운 별이 길 잃고 자기 어깨에 내려앉은 것 같다고 생각해요.|『풍차 방앗간 편지』에 실려 있어요.
목걸이|기 드 모파상은 1850년생 프랑스의 작가예요.|허영심이 많은 마틸드는 가난한 관리 남편과 살며 늘 더 좋은 삶을 꿈꿔요. 무도회에 가려고 친구 포레스티에 부인에게 다이아몬드 목걸이를 빌렸다가 잃어버려요. 부부는 똑같은 목걸이를 사기 위해 빚을 내고 10년 동안 고생해서 갚아요. 어느 날 마틸드는 포레스티에 부인을 만나 사실을 털어놓는데 부인은 그 목걸이가 가짜였다고 말해요.|1884년 발표됐어요. 허영의 대가를 다뤄요.
20년 후|오 헨리는 1862년생 미국의 작가예요.|뉴욕의 한 거리에서 순찰하던 경찰이 가게 앞에 서 있는 남자를 발견해요. 남자는 20년 전 친구와 이 자리에서 만나기로 약속했다며 기다리는 중이라고 말해요. 그 친구 지미는 경찰이 되기 싫다고 했었는데 남자는 서부에서 성공했다고 자랑해요. 경찰은 잠시 자리를 떠났다가 다른 경찰이 와서 남자를 체포해요. 남자는 친구가 쓴 쪽지를 받고 그가 경찰임을 알게 돼요.|1906년 발표됐어요.
허클베리 핀의 모험|마크 트웨인은 1835년생 미국의 작가예요.|부랑아 소년 허클베리 핀은 아버지의 학대를 피해 가짜로 죽음을 꾸미고 도망쳐요. 그는 도망친 흑인 노예 짐을 만나 함께 미시시피강을 뗏목으로 내려가요. 여러 사기꾼과 마을 사람들을 만나며 허크는 노예제와 사회의 위선을 보게 돼요. 짐을 신고하라는 양심과 우정 사이에서 갈등하던 허크는 결국 짐을 돕기로 해요. 마지막에 짐은 자유의 몸임이 밝혀져요.|1884년 출간됐어요. 당시의 인종 차별 표현이 나와요.
올리버 트위스트|찰스 디킨스는 1812년생 영국의 작가예요.|고아 올리버는 구빈원에서 자라다 죽 한 그릇을 더 달라고 했다가 쫓겨나요. 런던으로 도망친 그는 소매치기 소굴의 우두머리 페이긴 일당에게 붙들려요. 올리버를 구해 준 신사 브라운로가 곁에 있지만 악당 빌 사이크스와 몽크스가 올리버를 괴롭혀요. 우여곡절 끝에 올리버의 출생의 비밀이 밝혀지고 좋은 사람들 곁에서 행복을 찾아요.|1838년 연재됐어요. 빈곤과 아동 학대를 비판해요.
해저 2만 리|쥘 베른은 1828년생 프랑스의 작가예요.|바다에서 괴물이 나타난다는 소문에 아로낙스 교수와 하인 콩세유, 작살잡이 네드 랜드는 추적에 나섰다가 배가 부서져요. 이들이 발견한 괴물은 사실 네모 선장이 이끄는 잠수함 노틸러스호였어요. 일행은 노틸러스호에 갇혀 바닷속을 여행하며 신비한 풍경과 위험을 만나요. 네모 선장은 육지 세계를 떠나 바다에 자유를 찾은 인물이에요. 일행은 소용돌이 속에서 탈출해요.|1870년 출간된 SF 모험 소설이에요.
바스커빌가의 개|아서 코난 도일은 1859년생 영국의 작가예요.|데번셔의 바스커빌 가문에는 대대로 지옥의 개가 나타난다는 저주가 전해져요. 찰스 경이 기이하게 죽자 상속자 헨리가 찾아와 셜록 홈스에게 조사를 의뢰해요. 홈스는 바쁜 일로 왓슨 박사를 대신 보내고 왓슨은 황무지에서 의심스러운 인물들을 관찰해요. 마지막에 홈스가 나타나 스테이플턴이 상속을 노리고 사나운 개를 이용했음을 밝혀내요.|1902년 출간됐어요.
빨간 머리 연맹|아서 코난 도일은 1859년생 영국의 작가예요.|전당포 주인 제이베즈 윌슨은 붉은 머리를 가진 사람에게 높은 임금을 주는 '붉은머리연맹'에서 일하게 돼요. 하루 몇 시간 사전을 베끼는 단순한 일이었는데 어느 날 연맹이 해산됐다는 공지를 받아요. 윌슨의 의뢰를 받은 홈스는 조수가 이상하다는 점을 발견해요. 홈스와 왓슨은 은행 금고를 노리는 범인들이 터널을 파고 있었음을 밝혀내요.|1891년 발표된 셜록 홈스 단편이에요.
호빗|J. R. R. 톨킨은 1892년생 영국의 작가예요.|안락한 삶을 좋아하는 호빗 빌보 배긴스는 마법사 간달프와 13명의 난쟁이에게 이끌려 모험을 떠나요. 이들의 목적은 용 스마우그에게 빼앗긴 난쟁이들의 보물을 되찾는 것이에요. 도중에 트롤과 고블린을 만나고 빌보는 어두운 동굴에서 골룸의 반지를 손에 넣어요. 거미 숲과 엘프의 왕국을 지나 용의 산에 닿고 큰 전투가 벌어져요. 빌보는 지혜와 용기로 모험을 마치고 고향으로 돌아와요.|1937년 출간됐어요. 『반지의 제왕』의 앞 이야기예요.
원더|R. J. 팔라시오는 1963년생 미국의 작가예요.|열 살 소년 어기 풀먼은 선천적 안면 기형으로 수십 번의 수술을 받았어요. 홈스쿨링을 하던 어기는 5학년이 되며 처음 학교에 가게 돼요. 학교에서 어기는 외모 때문에 따돌림을 당하지만 잭 윌, 서머 같은 친구들을 만나요. 이야기는 어기뿐 아니라 누나 비아, 친구들 등 여러 사람의 시점으로 이어져요. 학년 말 어기는 용기와 친절의 가치를 보여 주는 상을 받아요.|2012년 출간됐어요.
구덩이|루이스 새커는 1954년생 미국의 작가예요.|스탠리 옐내츠는 억울하게 도둑 누명을 쓰고 소년원 '그린 레이크 캠프'에 보내져요. 그곳 소년들은 매일 마른 호수 바닥에 구덩이를 파는 벌을 받아요. 소장은 구덩이를 파는 이유가 교화라고 하지만 실은 무언가를 찾기 위해서였어요. 스탠리는 친구 제로와 함께 탈출해 먼 과거와 연결된 저주의 비밀을 알게 돼요. 가문의 저주가 풀리며 모두가 구원받아요.|1998년 출간돼 뉴베리상을 받았어요.
헝거 게임|수잰 콜린스는 1962년생 미국의 작가예요.|미래의 나라 판엠은 수도 캐피톨이 12개 구역을 지배하며 해마다 각 구역에서 소년 소녀 한 명씩을 뽑아 서로 죽이게 하는 헝거 게임을 열어요. 12구역의 소녀 캣니스는 동생 프림이 뽑히자 대신 자원해요. 캣니스는 같은 구역의 피타와 함께 경기장에 들어가 살아남기 위해 싸워요. 두 사람은 규칙을 거스르는 선택으로 승리해요. 하지만 이 일이 캐피톨의 분노를 사며 저항의 시작이 돼요.|2008년 출간됐어요. 폭력 장면이 나와요.
그리스 로마 신화|신화는 고대 그리스와 로마 사람들이 전해 온 이야기 모음이에요.|이 책은 신화 모음이라 줄거리 대신 구성으로 소개해요. 제우스를 중심으로 하는 올림포스 12신의 탄생과 권력 다툼 이야기가 나와요. 프로메테우스의 불, 판도라의 상자, 페르세우스와 헤라클레스 같은 영웅의 모험이 이어져요. 사랑과 질투, 인간의 오만이 변신과 비극으로 이어지는 이야기도 많아요. 별자리와 단어의 어원도 이 신화에서 비롯된 것이 많아요.|서양 문학과 미술의 바탕이 되는 이야기예요.
백범일지|김구는 1876년생 독립운동가예요. 대한민국 임시정부 주석을 지냈어요.|이 책은 자서전이라 줄거리 대신 구성으로 소개해요. 상권은 어린 시절과 동학 입도, 의병 활동과 투옥 등을, 하권은 상하이 임시정부 시기의 활동을 기록해요. 이봉창, 윤봉길 의거와 임시정부의 이동 과정이 나와요. 끝에 실린 「나의 소원」에서 김구는 문화의 힘으로 세계에 이바지하는 나라를 꿈꿔요. 아들에게 남기는 유서 형식으로 시작했어요.|1947년 출간됐어요.
난중일기|이순신은 1545년생 조선의 장군이에요.|이 책은 일기라 줄거리 대신 구성으로 소개해요. 임진왜란이 시작된 1592년부터 이순신이 전사하는 1598년까지의 일을 날짜별로 기록해요. 전투 상황, 군대 운영, 부하와의 대화, 가족에 대한 걱정이 솔직하게 담겨 있어요. 병든 어머니와 아들을 걱정하는 장면도 나와요. 모함으로 투옥된 시기에도 일기를 이어 갔어요.|국보로 지정돼 있어요. 『난중일기』라는 이름은 후대에 붙은 것으로 알려져 있어요.
유배지에서 보낸 편지|정약용은 1762년생 조선 후기의 실학자예요.|이 책은 편지 모음이라 줄거리 대신 구성으로 소개해요. 정약용이 강진에서 유배 생활을 하며 두 아들 학연, 학유에게 보낸 편지를 모았어요. 아들들에게 독서와 학문, 효도, 집안 살림을 열심히 하라고 당부해요. 글을 쓸 때의 태도와 사람을 대하는 법도 가르쳐요. 폐족이라 해서 좌절하지 말고 더욱 공부하라고 격려해요.|19세기 초에 쓴 편지들을 엮은 책이에요.
상록수|심훈은 1901년생 소설가이자 영화인이에요.|농촌 계몽 운동에 참여하는 대학생 박동혁과 채영신은 동아일보 주최 행사에서 만나 서로 뜻이 맞아 사랑하게 돼요. 두 사람은 각각 한곡리와 청석골에서 야학과 농촌 개량을 이끌어요. 일제의 탄압과 주민들의 오해에도 굴하지 않고 노력해요. 영신은 과로로 건강이 악화돼 세상을 떠나요. 동혁은 영신의 뜻을 이어 계속 농촌 운동에 헌신해요.|1935년 동아일보에 연재됐어요.
무정|이광수는 1892년생 소설가예요.|영어 교사 이형식은 옛 은사의 딸 박영채를 찾아가지만 영채는 기생이 돼 있어요. 한편 부유한 김 장로의 딸 선형의 영어 가정교사가 된 형식은 영채와 선형 사이에서 갈등해요. 영채는 형식에 대한 절개를 지키려다 자살하려고 평양으로 떠나요. 형식은 선형과 약혼하고 유학을 떠나려 하고 영채와 선형은 같은 기차에서 만나 새로운 길을 가기로 해요. 수해를 입은 사람들을 돕는 장면으로 이야기가 끝나요.|1917년 매일신보에 연재됐고 한국 최초의 근대 장편 소설로 평가돼요. 작가의 친일 행적은 평가에서 늘 논쟁이 돼요.
감자|김동인은 1900년생 소설가예요.|농가에서 자란 복녀는 가난 때문에 나이 많은 홀아비에게 팔려 가듯 시집가요. 남편이 게으르자 복녀는 칠성문 밖 빈민굴로 가서 살아요. 그녀는 송충이 잡는 일을 하다 감독에게 몸을 팔고 돈을 벌게 되며 도덕의식이 무뎌져요. 나중에는 중국인 왕서방의 감자를 훔치고 그와 관계를 이어 가요. 왕서방이 결혼하자 복녀는 낫을 들고 찾아갔다가 죽임을 당하고 돈으로 사건이 무마돼요.|1925년 발표된 자연주의 소설이에요. 폭력과 죽음 장면이 있어요.
치숙|채만식은 1902년생 소설가예요.|일본인 상점의 점원인 '나'는 열심히 일해 일본인처럼 되겠다고 꿈꿔요. 나의 아저씨는 대학을 나온 사회주의자였지만 지금은 감옥에서 나와 병든 몸으로 쉬고 있어요. '나'는 아저씨가 쓸모없고 한심하다고 비난해요. 반면 아내를 고생시키는 아저씨를 보며 답답해해요. 풍자의 대상은 아저씨가 아니라 일제에 순응하는 '나'라는 것이 드러나요.|1938년 발표됐어요.
독 짓는 늙은이|황순원은 1915년생 소설가예요.|독 짓는 송 영감은 아내가 젊은 조수와 도망간 뒤 어린 아들 당손과 외롭게 살아요. 병든 몸으로 독을 짓지만 독이 번번이 터져 실패해요. 이웃은 당손을 입양 보내자고 권하지만 송 영감은 아들을 놓지 못해요. 마지막으로 큰 독을 구워 가마에 넣고 터지는 소리를 들은 뒤 그는 가마 속으로 들어가 죽음을 맞아요.|1950년 발표됐어요. 예술에 대한 집념을 그려요.
장화홍련전|작자 미상의 조선 후기 소설이에요.|평안도 철산의 배 좌수에게는 착한 딸 장화와 홍련이 있어요. 어머니가 죽은 뒤 들어온 계모 허씨는 두 자매를 미워해요. 계모는 쥐 가죽으로 낙태한 것처럼 꾸며 장화를 모함하고 쫓아내 연못에서 죽게 해요. 홍련도 언니를 따라 물에 빠져 죽어 두 원혼은 새로 부임하는 철산 부사에게 나타나 억울함을 호소해요. 마침내 진실이 밝혀져 계모는 벌을 받고 자매는 다시 태어나 행복하게 살아요.|가정 내 갈등과 후처의 악행을 다루는 계모형 소설의 대표작이에요.
배비장전|작자 미상의 조선 후기 판소리계 소설이에요.|제주 목사를 따라 내려온 배비장은 여색을 가까이하지 않겠다며 큰소리쳐요. 동료들은 기생 애랑을 시켜 배비장을 유혹하게 해요. 애랑의 유혹에 넘어간 배비장은 몰래 만나다가 애랑 남편이 나타났다는 거짓말에 속아요. 궤짝에 숨고 자루에 들어가는 우스꽝스러운 일을 겪다 결국 알몸으로 사람들 앞에 나서 망신을 당해요. 양반의 위선을 풍자하는 이야기예요.|판소리 「배비장타령」에서 나온 이야기로 알려져 있어요.
옹고집전|작자 미상의 조선 후기 소설이에요.|옹진골 옹고집은 부자지만 인색하고 심술궂은 사람이에요. 그는 걸식하러 온 스님을 때리고 쫓아내요. 스님은 도술로 짚을 가짜 옹고집으로 만들어 보내요. 진짜와 가짜가 서로 자기가 진짜라고 다투다가 관가에서도 가려내지 못해 진짜 옹고집은 쫓겨나요. 거지가 되어 고생한 옹고집은 잘못을 뉘우치고, 가짜가 짚으로 돌아간 뒤 집으로 돌아와 새 사람이 돼요.|판소리 「옹고집타령」에서 나온 이야기예요.
유충렬전|작자 미상의 조선 후기 영웅 소설이에요.|명나라 대신 유심은 간신 정한담과 최일귀의 모함으로 귀양 가고 가족은 흩어져요. 아들 충렬은 어린 나이에 어머니와 헤어져 떠돌다가 강승상 집에 의탁해 천자의 선물인 장검과 갑옷을 얻어요. 정한담이 반란을 일으켜 천자가 위기에 빠지자 충렬이 나타나 천자를 구하고 적을 물리쳐요. 충렬은 아버지와 어머니를 만나고 벼슬에 올라 복을 누려요.|충과 효를 강조한 군담 소설이에요.
탁류|채만식은 1902년생 소설가예요.|전북 군산의 가난한 정 주사에게는 예쁜 딸 초봉이 있어요. 초봉은 가족의 빚과 어려움 때문에 은행원 고태수와 결혼하지만 고태수는 곧 죽어요. 그 뒤 약방 주인 제호, 꼽추 장형보 같은 인물들에게 휘말려 인생이 뒤틀려요. 초봉을 좋아하던 남승재는 가난한 이들을 돕는 의사의 길을 걷고 있어요. 초봉은 갖은 고생 끝에 장형보를 죽이는 극단적 선택에 이르러요.|1937~1938년 신문에 연재됐어요. 일제강점기 식민지 수탈과 한 여성의 비극을 그렸어요.
손도끼|게리 폴슨은 1939년생 미국의 작가예요.|열세 살 브라이언은 이혼한 아버지를 만나러 가던 비행기가 사고를 당해 캐나다 북부 숲에 혼자 떨어져요. 그의 손에는 어머니가 선물해 준 손도끼가 있어요. 브라이언은 처음에는 절망하지만 불 피우는 법, 먹이를 구하는 법, 오두막 짓는 법을 하나씩 배워요. 곰, 무스, 폭풍을 겪으며 그는 자연 속에서 강해져요. 54일 만에 구조되어 돌아와요.|1987년 출간돼 뉴베리 아너상을 받았어요.
테라비시아로 가는 다리|캐서린 패터슨은 1932년생 미국의 작가예요.|농장의 외로운 소년 제시는 이웃으로 이사 온 활발한 소녀 레슬리와 친구가 돼요. 둘은 숲속에 상상의 왕국 테라비시아를 만들고 줄에 매달려 개울을 건너다녀요. 어느 날 레슬리가 혼자 줄을 타고 가다 급류에 휩쓸려 사고로 목숨을 잃어요. 제시는 큰 슬픔에 빠지지만 곧 레슬리가 준 상상력과 용기로 다시 일어나요. 그는 동생에게 테라비시아의 이야기를 전해 줘요.|1977년 출간돼 뉴베리상을 받았어요. 친구의 죽음이 나와요.
끝없는 이야기|미하엘 엔데는 1929년생 독일의 작가예요.|책을 좋아하는 소년 바스티안은 어느 날 서점에서 《끝없는 이야기》라는 책을 가져와 읽기 시작해요. 책 속 환상 나라 판타지엔은 '무'라는 허무에 의해 멸망 위기를 맞고 어린 여왕은 병이 들어요. 용사 아트레유는 여왕을 구하기 위해 모험을 떠나요. 바스티안은 책 속으로 들어가 여왕에게 새 이름을 주고 판타지엔을 구하지만, 소원을 이룰 때마다 현실의 기억을 잃어요. 결국 그는 사랑하는 마음을 되찾고 현실로 돌아와요.|1979년 출간됐어요.
반지의 제왕|J. R. R. 톨킨은 1892년생 영국의 작가예요.|이 작품은 3부작이라 큰 줄기로 소개해요. 중간계에서 암흑의 군주 사우론이 만든 절대 반지가 호빗 프로도에게 전해져요. 반지를 없애려면 모르도르의 불의 산에 던져야 해요. 프로도는 샘와이즈, 간달프, 아라고른 등 아홉 명의 원정대와 함께 떠나요. 원정대는 흩어져 각자의 싸움을 하고 프로도와 샘은 골룸에게 길 안내를 받으며 모르도르로 향해요. 마침내 반지가 파괴되고 사우론은 몰락해요.|1954~1955년 출간됐어요.
주홍색 연구|아서 코난 도일은 1859년생 영국의 작가예요.|군의관 출신 왓슨은 런던에서 셜록 홈스와 하숙을 함께 하게 돼요. 홈스는 놀라운 관찰력과 추리력으로 직업이 탐정이라고 말해요. 빈집에서 시신이 발견되고 벽에 '복수'를 뜻하는 글자가 적혀 있어요. 홈스는 사건을 추적해 범인을 잡고 그 뒤에 얽힌 오래된 복수의 사연이 밝혀져요. 홈스와 왓슨의 첫 만남을 다루는 작품이에요.|1887년 발표됐고 셜록 홈스의 첫 작품이에요.
괴도 뤼팽|모리스 르블랑은 1864년생 프랑스의 작가예요.|이 책은 연작 단편이라 대표적인 이야기로 소개해요. 신사 도둑 아르센 뤼팽은 변장과 속임수로 경찰을 따돌리고 귀족과 부자들의 보물을 훔쳐요. 그러나 가난한 사람을 해치지 않고 의협심을 보이기도 해요. 뤼팽은 탐정 셜록 홈스를 만나 지혜를 겨루기도 해요. 매번 탈출과 반전이 이어져요.|1905년부터 잡지에 연재됐어요.
베니스의 상인|윌리엄 셰익스피어는 1564년생 영국의 극작가예요.|베네치아의 상인 안토니오는 친구 바사니오가 부유한 포셔에게 청혼하는 데 필요한 돈을 빌려 주려고 고리대금업자 샤일록에게 돈을 빌려요. 계약서에는 갚지 못하면 살 1파운드를 떼어 준다는 조건이 있어요. 안토니오의 배가 침몰해 돈을 갚지 못하자 샤일록은 계약을 지키라고 요구해요. 재판관으로 변장한 포셔는 살은 베되 피는 한 방울도 흘리지 말라고 판결해요. 샤일록은 패하고 재산을 잃어요.|1596~1599년 사이에 쓰인 희극이에요. 샤일록의 묘사에 대해 반유대주의라는 비판이 있어요.
한여름 밤의 꿈|윌리엄 셰익스피어는 1564년생 영국의 극작가예요.|아테네의 젊은 남녀 연인들이 사랑의 엇갈림 때문에 숲으로 도망쳐요. 숲에서는 요정 왕 오베론이 장난꾸러기 요정 퍽에게 사랑의 꽃즙을 가져오게 해요. 퍽이 꽃즙을 잘못 발라 연인들의 사랑이 뒤엉키고 요정 여왕 티타니아는 나귀 머리를 한 직공 보텀을 사랑하게 돼요. 결국 꽃즙의 효력이 풀리고 모든 연인이 제짝을 찾아요. 아테네에서 함께 결혼식을 올려요.|1595년 무렵 쓰인 희극이에요.
오셀로|윌리엄 셰익스피어는 1564년생 영국의 극작가예요.|베네치아의 무어인 장군 오셀로는 데스데모나와 사랑에 빠져 비밀 결혼을 해요. 부하 이아고는 승진에서 밀려난 앙심으로 오셀로에게 아내가 부하 카시오와 불륜을 저지른다고 거짓말을 해요. 이아고는 손수건을 이용해 의심을 키워요. 질투에 눈먼 오셀로는 데스데모나를 죽이고 진실을 알게 돼 스스로 목숨을 끊어요.|1603년 무렵 쓰인 4대 비극의 하나로 흔히 꼽혀요. 폭력과 죽음이 나와요.
인형의 집|헨리크 입센은 1828년생 노르웨이의 극작가예요.|변호사 헬메르의 아내 노라는 남편의 사랑을 받는 인형 같은 아내로 살아가요. 노라는 과거에 남편의 병을 고치려고 아버지의 서명을 위조해 돈을 빌린 비밀이 있어요. 채권자 크로그스타드가 이를 약점으로 협박하자 헬메르는 아내를 비난해요. 위기가 지나가자 다시 태도를 바꾸는 남편을 보며 노라는 자신이 인형이었음을 깨닫고 집을 나가요. 문 닫는 소리와 함께 극이 끝나요.|1879년 초연돼 여성 해방 문제를 던졌어요.
징비록|유성룡은 1542년생 조선 중기의 문신이에요. 임진왜란 때 영의정으로 일했어요.|이 책은 전쟁 기록이라 줄거리 대신 구성으로 소개해요. 임진왜란이 일어난 원인과 전개 과정, 이순신과 권율의 활약 등을 서술해요. 조선의 준비 부족과 지도층의 잘못을 반성하며 기록했어요. 제목 '징비'는 지난 잘못을 경계해 훗날 근심을 막는다는 뜻이에요. 전쟁이 끝난 뒤 낙향해 쓴 책이에요.|국보로 지정돼 있어요.
좁은 문|앙드레 지드는 1869년생 프랑스의 작가로 1947년 노벨 문학상을 받았어요.|제롬은 사촌 누나 알리사를 사랑하며 함께 자라요. 알리사는 동생 쥘리에트의 마음을 알고 사랑을 양보하려 하고 신앙적 금욕을 중요하게 여겨요. 제롬이 청혼하지만 알리사는 지상의 행복보다 하늘의 좁은 문을 택하겠다며 거절해요. 시간이 지나면서 알리사는 쇠약해져 요양원에서 죽음을 맞아요. 제롬은 마지막 편지를 읽으며 홀로 남아요.|1909년 발표됐어요.
검은 고양이|에드거 앨런 포는 1809년생 미국의 작가예요.|고양이를 좋아하던 '나'는 술에 빠지면서 성격이 난폭해져요. 그는 아끼던 고양이 플루토의 눈을 도려내고 결국 목을 매달아 죽여요. 이후 비슷한 고양이를 데려오지만 또 미워하게 돼요. 아내가 말리자 화가 나 아내를 도끼로 죽이고 시신을 지하실 벽 속에 숨겨요. 경찰이 조사할 때 벽 속에서 고양이 울음소리가 들려 범행이 드러나요.|1843년 발표됐어요. 폭력과 동물 학대 장면이 있어요.
경찰관과 찬송가|오 헨리는 1862년생 미국의 작가예요.|뉴욕의 부랑자 소피는 겨울을 따뜻한 감옥에서 보내려고 일부러 범죄를 저지르려 해요. 그는 식당에서 무전취식을 하고 유리창을 깨고 여인을 희롱하지만 번번이 체포되지 않아요. 지친 소피는 교회에서 흘러나오는 찬송가를 듣고 마음이 움직여 새 삶을 살기로 결심해요. 그런데 바로 그 순간 경찰이 나타나 그를 부랑죄로 붙잡아 가요. 소피는 결국 3개월 형을 받아요.|1904년 발표됐어요.
고향|현진건은 1900년생 소설가예요.|기차에서 '나'는 이상한 차림의 남자를 만나요. 그는 일본 옷에 중국 옷을 걸치고 조선말을 해요. 남자는 자신의 고향 이야기를 시작해 빚에 쫓겨 고향을 떠나 만주로 갔다가 일본으로 흘러 다닌 사연을 말해요. 고향에서 어릴 적 혼약했던 여자가 일본에 팔려 가 창녀로 살다 만난 이야기도 해요. 남자의 사연은 식민지 조선 농민의 비참한 현실을 보여 줘요.|1926년 발표됐어요.
만무방|김유정은 1908년생 소설가예요.|가난한 응칠은 아내를 잃고 떠돌며 노름과 도둑질로 살아가요. 동생 응오는 성실한 농사꾼이지만 병든 아내를 두고도 가난에 시달려요. 마을에서 벼 도둑이 들자 응칠은 의심받는 처지가 돼 직접 범인을 잡으려 해요. 밤에 망을 보다가 범인을 붙잡고 보니 범인은 바로 동생 응오였어요. 가난이 사람을 도둑으로 만드는 현실을 보여 줘요.|1935년 발표됐어요.
금 따는 콩밭|김유정은 1908년생 소설가예요.|가난한 소작농 영식은 이웃 수재의 꾐에 넘어가 자신의 콩밭을 파고 금을 찾기 시작해요. 아내는 콩밭을 망친다며 말리지만 영식은 금맥을 찾으면 부자가 될 수 있다고 믿어요. 금이 나오지 않아 빚만 늘어가고 영식은 수재와 다투어요. 마지막에는 수재가 금이 나왔다고 거짓말을 해서 위기를 모면하려 하지만 거짓은 곧 탄로 날 것이에요. 헛된 욕망에 매달리는 농민의 비극을 그려요.|1935년 발표됐어요.
별(황순원)|황순원은 1915년생 소설가예요.|어린 소년은 일찍 어머니를 여의고 어머니의 얼굴을 기억하지 못해요. 아버지는 소년에게 누이를 보여 주며 어머니를 닮았다고 말하지만 소년은 누이가 못생겼다고 느껴 싫어해요. 누이가 시집가서 죽자 소년은 누이가 어머니를 닮았다는 말이 사실이었음을 깨닫고 눈물을 흘려요. 별을 보며 소년은 누이의 얼굴을 떠올려요. 어머니와 누이에 대한 그리움을 담은 작품이에요.|1941년 발표됐어요.
전우치전|작자 미상의 조선 시대 소설이에요.|도술에 능한 전우치는 선전관 벼슬에서 물러난 뒤 도술을 써서 임금을 속이고 탐관오리를 혼내 줘요. 그는 가난한 사람을 돕고 부자들의 재물을 빼앗아 나눠 줘요. 나라에서는 전우치를 잡으려 하지만 번번이 놓쳐요. 서화담과 도술 대결을 하다 패한 전우치는 도술로 사람을 해치는 일을 그만두고 서화담을 따라 산으로 들어가요.|도술을 통한 사회 비판과 유머가 담긴 소설이에요.
홍계월전|작자 미상의 조선 후기 소설이에요.|홍계월은 난리 통에 부모와 헤어져 여공에게 구출된 뒤 남자아이로 길러져요. 그녀는 보국과 함께 공부하고 과거에 장원 급제해 높은 벼슬에 올라요. 전쟁이 일어나자 대원수로 출전해 큰 공을 세우고 승리를 거둬요. 뒤늦게 여자임이 밝혀지지만 천자는 그녀를 인정하고 보국과 혼인하게 해요. 혼인 뒤에도 계월은 능력을 발휘해 나라를 위기에서 구해요.|여성 영웅 소설로 평가돼요.
네 사람의 서명|아서 코난 도일은 1859년생 영국의 작가예요.|홈스와 왓슨은 메리 모스턴이라는 여인에게서 의뢰를 받아요. 메리의 아버지는 오래전 사라졌고 매년 진주 상자가 보내져 왔어요. 메리를 만난 홈스는 숄토 형제의 보물과 관련된 비밀을 쫓아요. 나무다리를 한 사내와 작은 원주민이 템스강을 따라 도망치는 추격전이 벌어져요. 사건이 끝난 뒤 왓슨은 메리와 결혼하게 돼요.|1890년 발표된 홈스 장편이에요.
얼룩무늬 끈|아서 코난 도일은 1859년생 영국의 작가예요.|헬렌 스토너는 쌍둥이 언니 줄리아가 밤에 "얼룩무늬 끈!"이라고 외치고 죽은 일 때문에 불안해해요. 이제 자신도 비슷한 방에 옮겨지게 되자 홈스를 찾아와요. 홈스와 왓슨은 의붓아버지 로일롯 박사의 저택을 조사해요. 가짜 종 줄과 환기구, 못 박힌 침대가 단서가 돼요. 홈스는 뱀을 이용한 범행을 밝혀내요.|1892년 발표됐어요.
황금 벌레|에드거 앨런 포는 1809년생 미국의 작가예요.|르그랑은 금빛 곤충을 발견하고 곤충이 놓인 양피지에서 암호를 발견해요. '나'와 하인 주피터는 르그랑을 따라 암호의 지시대로 나무에 올라 해골 눈 구멍으로 곤충을 떨어뜨려요. 그 위치에서 땅을 파자 해적이 숨겨 놓은 보물이 나와요. 르그랑은 암호를 푼 과정을 설명해요. 논리적인 추리와 모험이 결합된 이야기예요.|1843년 발표됐어요.
모르그가의 살인|에드거 앨런 포는 1809년생 미국의 작가예요.|파리의 모르그 거리에서 모녀가 끔찍하게 살해된 채 발견돼요. 방은 안에서 잠겨 있었고 이웃 사람들은 서로 다른 나라 말로 된 이상한 목소리를 들었다고 해요. 아마추어 탐정 오귀스트 뒤팽은 신문 기사와 현장 단서를 분석해 범인이 사람이 아니라는 결론에 이르러요. 범인은 선원이 데려온 오랑우탄이었어요. 최초의 추리 소설로 평가돼요.|1841년 발표됐어요.
바보 이반|레프 톨스토이는 1828년생 러시아의 작가예요.|부유한 농부에게는 군인 시몬, 장사꾼 타라스, 바보 이반 세 아들이 있어요. 악마들은 형제를 파멸시키려 하지만 이반은 정직하게 일하며 속임수에 넘어가지 않아요. 두 형이 재산과 권력에 욕심을 부리다 망하고 이반은 왕이 돼요. 그의 나라에서는 손에 굳은살이 있는 사람만 식사에 초대받아요. 악마는 끝내 이반을 이기지 못해요.|1886년 발표된 민화풍 이야기예요.
사람에게는 얼마만큼의 땅이 필요한가|레프 톨스토이는 1828년생 러시아의 작가예요.|농부 파홈은 땅이 조금만 더 있으면 악마도 두렵지 않다고 말해요. 그는 땅을 늘려 가며 만족하지 못하고 더 좋은 땅을 찾아 이사를 다녀요. 바시키르인의 땅에서는 하루 동안 걸어서 돌아오는 만큼 땅을 가질 수 있다는 제안을 받아요. 파홈은 해가 질 때까지 더 많은 땅을 얻으려고 달리다가 지쳐 쓰러져 죽어요. 결국 그에게 필요했던 땅은 자신이 묻힐 무덤 크기뿐이었어요.|1886년 발표됐어요.
외투|니콜라이 고골은 1809년생 러시아의 작가예요.|하급 관리 아카키 아카키예비치는 문서 필사에 몰두하며 조용히 살아가요. 낡은 외투가 더 이상 입을 수 없게 되자 그는 허리띠를 졸라매며 돈을 모아 새 외투를 마련해요. 새 외투를 입고 처음 나선 날 밤 강도에게 외투를 빼앗겨요. 높은 사람에게 도움을 청하지만 냉대를 받고 병들어 세상을 떠나요. 이후 도시에는 외투를 빼앗는 유령이 나타난다는 소문이 돌아요.|1842년 발표됐어요.
관리의 죽음|안톤 체호프는 1860년생 러시아의 작가예요.|하급 관리 체르뱌코프는 극장에서 재채기를 하다 앞자리의 장군에게 침이 튀었다고 생각해요. 그는 사과하지만 장군이 대수롭지 않게 넘기자 오히려 불안해져요. 다음 날부터 몇 번이나 장군을 찾아가 사과를 반복해요. 장군은 결국 귀찮아서 화를 내고 쫓아내요. 체르뱌코프는 집에 돌아와 소파에 누웠다가 그대로 죽어요.|1883년 발표됐어요. 권력 앞에서의 비굴함을 풍자해요.
귀여운 여인|안톤 체호프는 1860년생 러시아의 작가예요.|올렌카는 사랑하는 사람이 생기면 그 사람의 생각과 말을 전부 따르는 여자예요. 극장 주인과 결혼하면 연극 이야기만 하고, 목재상과 결혼하면 목재 이야기만 해요. 남편들이 죽은 뒤 수의사와 지내면서 가축 이야기를 하다가 헤어져요. 마지막에는 수의사의 아들을 돌보며 아이의 생각을 자기 생각처럼 말하게 돼요. 사랑에 매달리는 삶의 모습을 부드럽게 풍자해요.|1899년 발표됐어요.
비곗덩어리|기 드 모파상은 1850년생 프랑스의 작가예요.|보불 전쟁 중 루앙에서 피난하는 마차에 귀족, 상인, 수녀, 민주주의자 등 여러 사람이 타요. 그중에는 '비곗덩어리'라는 별명을 가진 매춘부 엘리자베트 루세가 있어요. 마차가 프로이센 장교에게 붙잡히자 장교는 엘리자베트가 자신과 밤을 보내야 보내 주겠다고 요구해요. 그녀가 거부하자 사람들은 처음에는 응원하다가 곧 설득하며 희생을 강요해요. 그녀가 응하자 사람들은 그녀를 멸시하고 외면해요.|1880년 발표됐어요. 사회의 위선을 고발해요.
백만 파운드 지폐|마크 트웨인은 1835년생 미국의 작가예요.|가난한 미국인 청년 헨리 애덤스는 런던에서 두 부유한 형제의 내기에 휘말려요. 형제는 어떤 사람이 백만 파운드 지폐를 가지고 한 달 동안 살아갈 수 있는지를 두고 내기를 해요. 헨리는 지폐를 쓰지 않고도 사람들이 그를 믿고 외상을 주는 바람에 호화로운 생활을 하게 돼요. 그는 사랑에도 빠지고 한 달 뒤 내기가 끝나자 형제로부터 좋은 일자리를 얻어요. 지폐의 위력을 풍자해요.|1893년 발표됐어요.
열린 창|사키는 1870년생 영국의 작가예요. 본명은 헥터 휴 먼로예요.|신경 쇠약 치료를 위해 시골로 온 프램튼 나텔은 친구의 소개장을 들고 서트로 부인을 찾아가요. 조카 베라는 열려 있는 창문에 대해 삼 년 전 사냥 나갔던 숙모의 남편과 동생들이 습지에서 사고로 죽은 비극을 이야기해요. 서트로 부인은 그 사냥꾼들이 곧 돌아올 것이라고 말하고 나텔이 창밖을 보니 세 남자가 걸어오는 모습이 보여요. 놀란 나텔은 도망치듯 집을 떠나요. 이후 베라는 이 모든 이야기가 거짓이었다고 말해요.|1914년 발표된 반전 단편이에요.
앨저넌에게 꽃을|대니얼 키스는 1927년생 미국의 작가예요.|지적 장애가 있는 서른두 살 찰리 고든은 빵집에서 일하며 글을 배우려 해요. 그는 쥐 앨저넌에게 성공한 실험 수술을 받고 갑자기 지능이 높아지기 시작해요. 찰리는 경과 보고서를 쓰며 사람들과의 관계, 사랑, 과거를 새롭게 바라봐요. 그러나 앨저넌에게 이상이 나타나고 찰리도 지능이 다시 떨어질 것임을 깨달아요. 마지막 보고서에서 그는 앨저넌의 무덤에 꽃을 놓아 달라고 부탁해요.|단편은 1959년, 장편은 1966년 출간됐어요.
생쥐와 인간|존 스타인벡은 1902년생 미국의 작가예요.|대공황 시대 떠돌이 일꾼 조지와 힘이 센 지적 장애인 레니는 함께 농장에서 일해요. 두 사람은 언젠가 작은 땅을 사서 토끼를 기르며 살자는 꿈을 나눠요. 레니는 부드러운 것을 만지길 좋아하다가 실수로 생쥐와 강아지를 죽이게 돼요. 농장 주인의 아들 아내와의 사고로 큰일이 벌어지고 사람들이 레니를 쫓아요. 조지는 레니를 위해 꿈 이야기를 들려주며 마지막 선택을 해요.|1937년 출간됐어요. 죽음이 나와요.
진주|존 스타인벡은 1902년생 미국의 작가예요.|멕시코의 가난한 어부 키노는 아내 후아나, 아기 코요티토와 함께 살아요. 전갈에게 물린 아기를 치료할 돈이 없던 키노는 바다에서 엄청나게 큰 진주를 발견해요. 진주 소문이 퍼지자 의사와 상인, 도둑이 욕심을 내고 키노의 삶은 위험해져요. 키노는 진주를 팔려 하지만 속임을 당하고 도망치는 도중 아기가 목숨을 잃어요. 키노는 진주를 바다에 던져 버려요.|1947년 발표됐어요.
야간 비행|앙투안 드 생텍쥐페리는 1900년생 프랑스의 작가이자 비행사예요.|남미 우편 항공사의 책임자 리비에르는 야간 비행을 해서라도 우편물을 빨리 보내려고 해요. 어느 밤 조종사 파비앵이 폭풍우를 만나 연락이 끊겨요. 리비에르는 위험을 알면서도 비행을 이어 가야 한다는 신념을 지켜요. 파비앵의 아내가 남편을 걱정하며 찾아오지만 리비에르는 흔들리지 않아요. 파비앵은 끝내 돌아오지 못하지만 야간 비행은 계속돼요.|1931년 출간됐어요.
피그말리온|조지 버나드 쇼는 1856년생 아일랜드 출신의 극작가예요.|음성학 교수 헨리 히긴스는 런던의 꽃 파는 소녀 일라이자 둘리틀을 몇 달 만에 귀부인으로 만들 수 있다고 친구 피커링 대령과 내기를 해요. 일라이자는 억양과 예절을 배우며 사교계의 무도회에서 큰 성공을 거둬요. 하지만 일라이자는 히긴스가 자신을 실험 대상으로만 본다는 사실에 상처받아요. 일라이자는 히긴스의 집을 떠나 독립하려 해요.|1913년 초연됐고 뮤지컬 「마이 페어 레이디」의 바탕이 됐어요.
인간의 그늘에서|제인 구달은 1934년생 영국의 동물학자예요.|이 책은 연구 기록이라 줄거리 대신 구성으로 소개해요. 구달은 탄자니아 곰베 숲에서 야생 침팬지를 관찰한 경험을 기록해요. 침팬지가 풀줄기를 이용해 흰개미를 잡는 것을 발견해 도구를 사용한다는 사실을 밝혀요. 데이비드 그레이비어드 같은 개체에게 이름을 붙이고 가족, 놀이, 싸움, 죽음을 설명해요. 이 연구는 인간과 동물의 경계를 다시 생각하게 했어요.|1971년 출간됐어요.
우아한 거짓말|김려령은 1971년생 소설가예요.|열세 살 천지는 언니 화연의 죽음 소식을 듣게 돼요. 화연은 친구 관계의 갈등과 따돌림으로 상처를 입었고 가족은 언니가 왜 그런 선택을 했는지 알지 못해요. 천지는 언니가 남긴 흔적을 찾아다니며 진실을 하나씩 알게 돼요. 가족은 각자 죄책감과 슬픔에 시달리며 서로를 이해해 가요. 이야기는 상처를 숨기지 않고 서로에게 기대는 것이 중요하다고 말해요.|2009년 출간됐어요. 자살과 따돌림 주제가 나오니 마음이 힘들 때는 믿을 수 있는 사람과 이야기하세요.
위저드 베이커리|구병모는 1976년생 소설가예요.|사이가 좋지 않은 가족 속에서 힘들게 지내던 '나'는 집을 나왔다가 우연히 마법사가 구운 빵을 파는 제과점 위저드 베이커리에 들어가요. 이곳의 빵은 먹는 사람의 소원을 이뤄 주지만 대가가 따라요. 나는 빵집 주인에게서 마법 빵의 비밀을 듣고 현실의 상처를 마주하게 돼요. 소원이 이루어지는 일은 오히려 새로운 불행으로 이어지기도 해요. 결국 자신이 선택할 문제라는 점을 깨달아요.|2009년 출간됐어요.
유진과 유진|이금이는 1962년생 아동 문학 작가예요.|초등학교 때 같은 이름의 두 아이가 있었어요. 그중 한 명 유진은 어린 시절 아픈 상처를 입고 오랫동안 마음의 문을 닫고 살아요. 고등학생이 된 두 사람은 우연히 같은 학교에서 다시 만나요. 서로의 마음을 이해해 가며 유진은 자신의 상처를 마주하고 치유를 향해 한 걸음 내디뎌요.|2004년 출간됐어요. 아동 성폭력의 후유증을 다뤄 읽을 때 주의가 필요해요.
원미동 사람들|양귀자는 1955년생 소설가예요.|이 책은 11편의 연작 소설이라 구성으로 소개해요. 경기도 부천 원미동 동네의 이웃들이 주인공이에요. 가게를 운영하는 사람, 가난한 시인, 이사 온 가족 등 서민의 삶이 이어져요. 크고 작은 사건을 통해 도시 서민의 애환과 정을 보여 줘요. 각 이야기는 독립적이면서 서로 연결돼요.|1987년 출간됐어요.
엄마의 말뚝|박완서는 1931년생 소설가예요.|이 작품은 연작 소설이라 대표적인 이야기로 소개해요. 어머니는 아들과 딸을 서울로 데려와 현저동 꼭대기에 말뚝을 박듯 터를 잡고 살아요. 아들이 죽은 뒤 어머니는 슬픔 속에서 딸을 억척스럽게 길러요. 세월이 흘러 딸은 어머니를 모시며 노년의 치매와 마지막 모습을 지켜봐요. 어머니와 딸의 관계를 통해 전쟁과 분단의 상처를 보여 줘요.|1980년대 연작으로 발표됐어요.
뫼비우스의 띠|조세희는 1942년생 소설가예요.|한 수학 교사가 학생들에게 두 아이 이야기를 들려줘요. 굴뚝을 청소한 두 아이 중 한 명은 얼굴이 깨끗하고 한 명은 더러운데 누가 얼굴을 씻을까 질문해요. 학생들은 더러운 얼굴이라 답하지만 교사는 깨끗한 얼굴이 씻을 수 있고 더러운 얼굴은 자신이 더러운 줄 모른다고 설명해요. 앉은뱅이와 꼽추의 이야기가 이어지며 뫼비우스의 띠처럼 안과 밖이 이어진다는 말로 마무리돼요.|1976년 발표됐고 『난장이가 쏘아올린 작은 공』에 실려 있어요.
나의 산에서|진 크레이그헤드 조지는 1919년생 미국의 작가예요.|열두 살 소년 샘 그리블리는 뉴욕의 비좁은 집이 싫어 캐츠킬 산속에서 혼자 살기로 결심해요. 그는 할아버지의 땅에서 큰 나무 속에 집을 만들고 사냥과 채집으로 먹을거리를 구해요. 송골매 프랭크를 길들여 사냥을 하고 족제비 같은 동물들과 친구가 돼요. 겨울에는 추위와 굶주림을 이겨 내며 자연의 법칙을 배워요. 봄이 되자 가족이 찾아오고 샘은 자신의 선택이 옳았음을 알게 돼요.|1959년 출간돼 뉴베리 아너상을 받았어요.
논 이야기|채만식은 1902년생 소설가예요.|한 생원은 일제강점기에 어쩔 수 없이 논을 팔아 소작농이 된 노인이에요. 해방이 되자 일본인이 소유했던 논이 자기 손에 돌아올 것이라 믿고 기뻐해요. 그러나 나라에서는 일본인 재산을 국유로 정해 팔겠다고 해요. 한 생원은 논을 되찾지 못하고 허탈해해요. 그는 독립이 되어도 농민에게 좋은 일은 없다고 한탄해요.|1946년 발표됐어요. 해방 직후 현실을 풍자해요.
미스터 방|채만식은 1902년생 소설가예요.|방삼복은 해방 전에는 구두 수선을 하던 가난한 사람이었어요. 해방 후 미군이 들어오자 영어를 조금 한다는 이유로 통역관 행세를 하며 큰 권세를 누려요. 친일 지주 백 주사는 해방 뒤 몰락했다가 방삼복에게 아첨하며 도움을 구해요. 방삼복은 으스대며 술에 취해 가래를 뱉는데 하필 위층에서 던진 물을 맞아 크게 화내요. 권력에 영합하는 사람들의 모습을 풍자해요.|1946년 발표됐어요.
동승|함세덕은 1915년생 극작가예요.|산속 절의 어린 동자승 도념은 부모 없이 자라며 어머니를 그리워해요. 어느 날 절에 불공을 드리러 온 젊은 미망인이 죽은 아들을 닮았다며 도념을 보고 눈물을 흘려요. 부인은 도념을 자기 집으로 데려가려 하고 도념은 어머니를 만난 듯 기뻐해요. 그러나 주지 스님은 도념이 불가에 남아야 한다고 말려요. 도념은 결국 절을 떠나 세상으로 나가요.|1939년 발표된 희곡이에요.
토막|유치진은 1905년생 극작가예요. 극예술연구회에서 활동하며 사실주의 희곡을 이끌었어요.|이 작품은 일제강점기 가난한 농민 가족이 토막, 곧 움막 같은 집에서 겪는 고통을 그린 희곡이에요. 일제의 수탈과 가난 때문에 농민들은 땅을 잃고 토막집으로 내몰려요. 가족 중 일부는 먹고살기 위해 고향을 떠나 일본이나 다른 곳으로 가고 남은 가족은 병과 굶주림에 시달려요. 가족이 서로를 걱정하며 버티지만 현실의 벽 앞에서 희망이 하나씩 꺾여요. 극은 식민지 농민이 처한 절망적인 상황을 사실적으로 보여 줘요.|1931년 쓰였고 1933년 극예술연구회가 무대에 올린 것으로 알려져 있어요. 자세한 인물 설정은 원작으로 확인해 보세요.
최척전|조위한은 1567년생 조선 중기의 문인이에요.|최척은 옥영과 혼인하지만 임진왜란이 일어나 가족이 흩어져요. 옥영은 왜군에 붙잡혀 일본으로 끌려가고 최척은 명나라로 건너가 군인이 돼요. 두 사람은 우연한 인연으로 베트남 근처에서 다시 만나 서로를 알아봐요. 이후 조선으로 돌아와 아들과도 재회하는 과정을 겪어요. 전쟁이 만든 이별과 사랑의 힘을 그려요.|1621년 지은 소설로 알려져 있어요.
연어|안도현은 1961년생 시인이에요.|은빛 연어는 강에서 태어나 바다로 나갔다가 다시 태어난 강으로 돌아오는 여정을 시작해요. 눈맑은 연어와 은빛 연어는 길 위에서 서로 의지하고 사랑하게 돼요. 돌아오는 길에 곰과 수달, 폭포, 낚시꾼, 그물 같은 장애물을 만나 많은 연어가 죽어요. 은빛 연어는 알을 낳기 위해 끝까지 올라가 새로운 생명을 이어요. 삶의 의미와 사랑, 희생을 이야기해요.|1996년 출간됐어요.
젊은 느티나무|강신재는 1924년생 소설가예요.|열여덟 살 숙희는 어머니의 재혼으로 의붓오빠 현규와 한집에서 살게 돼요. 숙희는 현규에게서 비누 냄새가 난다고 느끼며 점점 마음이 끌려요. 현규도 숙희를 의식하지만 두 사람은 가족이라는 관계 때문에 감정을 숨겨요. 서로 간의 거리감과 혼란 속에서 갈등하지만 감정은 깊어져요. 청춘의 설렘과 금기를 섬세하게 그려요.|1960년 발표됐어요.
이솝 우화|이솝은 기원전 6세기경 고대 그리스의 이야기꾼으로 알려져 있어요.|이 책은 우화 모음이라 줄거리 대신 구성으로 소개해요. 동물이나 사물을 주인공으로 삼아 짧은 이야기 속에 교훈을 담아요. 토끼와 거북이, 개미와 베짱이, 늑대와 어린 양, 여우와 신 포도 같은 이야기가 대표적이에요. 이야기마다 끝에 교훈이 붙는 경우가 많아요. 사람의 어리석음과 지혜를 쉽게 전해 줘요.|이솝의 실제 생애는 분명하지 않아요. 여러 시대의 이야기가 함께 전해져요.
벤허|루 월리스는 1827년생 미국의 군인이자 작가예요.|유대 귀족 청년 유다 벤허는 로마 장교가 된 옛 친구 메살라의 모함으로 가족과 헤어지고 노예가 돼 갤리선을 저어요. 그는 해전에서 로마 사령관을 구해 은혜를 입어 자유를 얻어요. 이후 벤허는 어머니와 누이를 찾고 메살라에게 복수하기로 결심해요. 전차 경주에서 메살라를 이기고 복수를 이뤄요. 예수를 만나 깊은 감동을 받으며 마음의 변화를 겪어요.|1880년 출간됐어요. 부제는 '그리스도 이야기'예요.
나이팅게일|플로렌스 나이팅게일은 1820년 이탈리아 피렌체에서 태어난 영국의 간호사예요.|이 책은 전기라 줄거리 대신 구성으로 소개해요. 부유한 집에서 태어났지만 간호사의 길을 택했어요. 크림 전쟁에 간호사들을 이끌고 가서 위생 환경을 개선해 사망률을 크게 줄였어요. '등불을 든 여인'이라는 별명이 붙었어요. 이후 간호학교를 세우고 통계를 활용한 보건 개혁에 힘썼어요.|1910년 세상을 떠났어요.
슈바이처|알베르트 슈바이처는 1875년생 알자스 출신의 의사이자 철학자예요.|이 책은 전기라 줄거리 대신 구성으로 소개해요. 어릴 때부터 신학과 음악, 철학을 공부한 뒤 서른 살에 의학 공부를 시작했어요. 1913년 아프리카 가봉의 랑바레네에 병원을 세우고 환자를 치료했어요. '생명에 대한 경외' 사상을 평생 실천했어요. 1952년 노벨 평화상을 받았어요.|1965년 세상을 떠났어요.
간디|모한다스 카람찬드 간디는 1869년 인도에서 태어났어요.|이 책은 전기라 줄거리 대신 구성으로 소개해요. 영국에서 변호사 공부를 한 뒤 남아프리카에서 인종 차별을 겪으며 비폭력 저항을 시작했어요. 인도로 돌아와 영국의 식민 지배에 맞서 비협력 운동과 소금 행진을 이끌었어요. 단식과 실천으로 사람들의 마음을 움직였어요. 인도가 독립한 이듬해인 1948년 암살당했어요.|비폭력 사상은 마틴 루서 킹에게 영향을 줬어요.
에디슨|토머스 에디슨은 1847년 미국에서 태어난 발명가예요.|이 책은 전기라 줄거리 대신 구성으로 소개해요. 어린 시절 학교에서 어려움을 겪었지만 호기심으로 실험을 했어요. 전신기, 축음기, 백열전구, 영사기 등 수많은 발명을 했어요. 연구소에서 협력자들과 함께 시행착오를 거치며 실험을 계속했어요. '천재는 99퍼센트의 노력'이라는 말이 전해져요.|1931년 세상을 떠났어요. 천 개가 넘는 특허를 가졌어요.
호질|박지원은 1737년생 조선 후기의 실학자예요.|도덕군자로 알려진 북곽 선생은 과부 동리자의 집에서 몰래 만나다가 동리자의 아들들에게 들켜 도망쳐요. 그는 어둠 속에서 똥구덩이에 빠져 허우적대다 호랑이를 만나요. 호랑이는 선비를 꾸짖으며 인간의 위선과 탐욕을 비난해요. 날이 밝자 북곽 선생은 농부들 앞에서 하늘과 땅이 두렵다며 거짓으로 꾸며요. 양반의 위선을 풍자해요.|『열하일기』에 실려 있어요.
토끼전|작자 미상의 조선 후기 판소리계 소설이에요.|용왕이 병에 걸려 토끼의 간이 약이 된다는 말을 듣고 신하들이 자라에게 육지로 가서 토끼를 데려오라고 해요. 자라는 토끼에게 용궁에서 벼슬을 하게 해 주겠다며 유혹해 데려가요. 용궁에 이른 토끼는 간을 두고 왔다며 꾀를 내어 풀려나요. 육지로 돌아온 토끼는 자라를 비웃고 자라는 빈손으로 돌아가요. 지혜와 충성, 권력을 풍자해요.|판소리 「수궁가」에서 나온 이야기로 알려져 있어요. 별주부전이라고도 해요.
화왕계|설총은 신라 시대 학자예요. 원효의 아들로 알려져 있어요.|꽃의 왕 모란이 왕 앞에 나타나요. 아름다운 장미가 다가와 모란을 모시겠다고 아첨해요. 백두옹은 거친 모습으로 찾아와 왕이 정직한 신하를 가까이해야 한다고 충고해요. 왕은 장미의 아첨과 백두옹의 충언 사이에서 고민하다가 백두옹의 말에 깨달음을 얻어요. 신문왕에게 간언하기 위해 지어졌다고 전해져요.|『삼국사기』 설총전에 실려 있어요.
시집가는 날|오영진은 1916년생 극작가예요.|맹 진사는 세도가 김 판서의 아들과 딸 갑분을 혼인시키려 해요. 신랑이 절름발이라는 소문이 들려 고민하던 맹 진사는 몸종 입분을 대신 딸처럼 꾸며 보내기로 해요. 입분은 신랑 집에 가고 맹 진사의 딸 갑분은 사랑하는 사람과 이어져요. 그런데 신랑이 절름발이라는 소문은 거짓이었고 맹 진사는 망신을 당하며 욕심의 대가를 치러요.|1942년 발표된 희극이에요.
투명인간|H. G. 웰스는 1866년생 영국의 작가예요.|과학자 그리핀은 자신의 몸을 투명하게 만드는 약을 발명해요. 그는 몸이 투명한 상태에서 외투와 붕대로 모습을 가리고 마을 여관에 숨어 지내요. 마을 사람들과 갈등이 생기고 그리핀은 폭력적으로 변해 사람들을 위협해요. 투명인간이 된 그는 분노와 고독에 휩싸여 도망쳐요. 결국 추격 끝에 목숨을 잃고 몸이 다시 보이게 돼요.|1897년 출간됐어요.
우주 전쟁|H. G. 웰스는 1866년생 영국의 작가예요.|화성에서 발사된 실린더가 영국에 떨어지고 그 안에서 문어 모습의 화성인이 나타나요. 화성인들은 삼각대 모양의 거대한 전투 기계로 도시를 파괴하고 사람들을 죽여요. 인류의 군대는 이들을 막지 못하고 사람들은 도시를 떠나 피난해요. 화성인들이 압도적인 힘으로 지구를 점령해 가던 순간 그들은 지구의 박테리아에 감염되어 쓰러져요. 인류는 이렇게 위기에서 벗어나요.|1898년 출간됐어요.
시간의 주름|매들렌 렝글은 1918년생 미국의 작가예요.|소녀 메그 머리는 실종된 아버지를 찾아 동생 찰스 월리스, 친구 캘빈과 함께 신비한 세 부인의 도움으로 시공간을 건너가요. 이들은 '텍세랙트'라는 시간의 주름을 이용해 다른 행성들을 지나가요. 어두운 힘이 지배하는 행성 카마조츠에서 아버지가 갇혀 있는 것을 발견해요. 거대한 두뇌 '그것'이 사람들의 의지를 지배하고 있었어요. 메그는 사랑의 힘으로 아버지를 구해 내요.|1962년 출간돼 뉴베리상을 받았어요.
메이즈 러너|제임스 대시너는 1972년생 미국의 작가예요.|소년 토머스는 기억을 잃은 채 상자 안에서 눈을 떠 거대한 미로 가운데 있는 글레이드에서 다른 소년들과 만나요. 소년들은 미로를 돌며 탈출구를 찾는 러너를 두고 살아가요. 미로에는 그리버라는 위험한 괴물이 살고 벽이 매일 움직여요. 토머스는 소녀 테레사가 나타난 뒤 상황이 급변하자 용기를 내 미로의 비밀을 풀기 시작해요. 이들은 미로 탈출에 성공하지만 더 큰 음모가 기다리고 있어요.|2009년 출간됐어요.
줄무늬 파자마를 입은 소년|존 보인은 1971년생 아일랜드의 작가예요.|독일 군인 아버지를 둔 아홉 살 소년 브루노는 가족과 함께 베를린에서 '아웃 위드'로 이사해요. 새 집 근처 철조망 너머에서 줄무늬 파자마를 입은 소년 슈무엘을 만나 친구가 돼요. 브루노는 철조망 너머가 농장이라고 생각하지만 사실은 유대인 수용소였어요. 어느 날 브루노는 슈무엘의 아버지를 찾는 것을 돕겠다며 철조망 아래로 들어가요. 그날 두 소년은 비극적인 일을 맞게 돼요.|2006년 출간됐어요. 홀로코스트의 비극이 나오므로 읽을 때 주의가 필요해요.
첫사랑|이반 투르게네프는 1818년생 러시아의 작가예요.|열여섯 살 블라디미르는 이웃집으로 이사 온 스물한 살의 지나이다에게 첫눈에 반해요. 지나이다는 여러 청년을 거느리고 장난치듯 대하며 블라디미르의 마음을 흔들어요. 블라디미르는 지나이다가 사랑하는 사람이 있음을 알게 되고 그 상대가 자신의 아버지임을 깨달아요. 충격을 받지만 아무 말도 하지 못해요. 시간이 지나 아버지가 죽고 지나이다도 세상을 떠났다는 소식이 와요.|1860년 발표됐고 작가의 자전적 경험이 반영됐다고 알려져 있어요.
트리갭의 샘물|나탈리 배비트는 1932년생 미국의 작가예요.|열 살 소녀 위니 포스터는 답답한 집이 싫어 숲으로 들어갔다가 샘물을 마시는 소년 제시를 만나요. 그는 터크 가족의 일원으로 샘물을 마신 뒤 늙지도 죽지도 않게 된 사람들이에요. 위니는 터크 가족과 함께 지내며 영원히 사는 일이 얼마나 외로운지 알게 돼요. 샘물의 비밀을 노리는 노란 옷의 남자가 나타나 위기가 닥쳐요. 위니는 용기를 내어 터크 가족을 돕고 삶의 의미를 생각하게 돼요.|1975년 출간됐어요.
지구 속 여행|쥘 베른은 1828년생 프랑스의 작가예요.|독일의 리덴브로크 교수는 옛 책에서 발견한 암호문을 해독해 아이슬란드의 화산을 통해 지구 속으로 들어갈 수 있다는 사실을 알아내요. 교수와 조카 악셀, 안내인 한스는 스네펠스 화산 분화구로 들어가요. 지하에는 지하 바다, 거대한 버섯 숲, 고대 동물들이 있어요. 일행은 길을 잃고 위험을 겪다가 화산 폭발로 지상으로 튕겨 나와요. 이탈리아 스트롬볼리 화산에서 지상에 도착해요.|1864년 출간된 모험 소설이에요.
잃어버린 세계|아서 코난 도일은 1859년생 영국의 작가예요.|괴짜 과학자 챌린저 교수는 남미 아마존 오지에서 공룡이 살아 있는 고원을 발견했다고 주장해요. 신문 기자 말론, 존 록스턴 경, 서머리 교수가 탐험대에 합류해 그의 말을 확인하러 떠나요. 고원에 오른 일행은 익룡, 공룡, 원시인 같은 생물을 마주쳐요. 고원에서 위험을 겪으며 탈출하고 익룡 한 마리를 데리고 돌아와요. 런던 학회에서 이들의 주장이 입증돼요.|1912년 출간됐어요.
오페라의 유령|가스통 르루는 1868년생 프랑스의 작가예요.|파리 오페라 극장에는 유령이 나온다는 소문이 돌아요. 가수 크리스틴 다에는 유령에게서 노래를 배워 놀라운 성장을 해요. 유령은 얼굴이 흉하게 일그러진 천재 음악가 에릭이었고 크리스틴을 사랑해요. 크리스틴은 소꿉친구 라울과 약혼하자 에릭은 크리스틴을 납치해 지하 호수의 처소로 데려가요. 크리스틴의 마음과 연민 앞에서 에릭은 그녀를 놓아줘요.|1910년 출간됐어요.
야성의 부름|잭 런던은 1876년생 미국의 작가예요.|캘리포니아의 안락한 집에서 살던 개 벅은 도둑질당해 알래스카 클론다이크 금광 지대로 팔려 가요. 벅은 썰매개로 일하며 혹독한 추위와 싸움을 통해 야성을 되찾아요. 새로운 주인 존 손턴을 만나 사랑과 충성을 배우지만 손턴이 죽자 인간 세계에 대한 미련이 사라져요. 벅은 늑대 무리를 따라 야생으로 들어가요.|1903년 발표됐어요.
하얀 송곳니|잭 런던은 1876년생 미국의 작가예요.|북극 황야에서 늑대와 개 사이에서 태어난 '하얀 송곳니'는 어미와 함께 야생에서 살아가요. 인디언 주인에게 길러진 뒤 싸움개로 팔려 잔인한 주인을 만나 사나워져요. 광산 기술자 위든 스콧이 하얀 송곳니를 구해 사랑으로 돌봐요. 하얀 송곳니는 서서히 마음을 열고 따뜻함을 배워요. 집에 침입한 도둑으로부터 주인의 가족을 구하며 충성을 보여 줘요.|1906년 출간됐어요. 야성과 문명을 대비한 작품이에요.
어셔가의 몰락|에드거 앨런 포는 1809년생 미국의 작가예요.|'나'는 오랜 친구 로더릭 어셔의 초대로 어셔 가문의 음산한 저택을 찾아가요. 어셔는 신경이 극도로 예민하고 쌍둥이 여동생 매들린은 병으로 쇠약해 있어요. 매들린이 죽자 두 사람은 시신을 지하실에 안치해요. 며칠 뒤 폭풍우가 치는 밤 이상한 소리가 들리고 매들린이 관에서 나와 어셔에게 달려들어요. '나'는 서둘러 도망치고 어셔 가문의 저택은 무너져요.|1839년 발표된 고딕 소설이에요.
한밤중 톰의 정원에서|필리파 피어스는 1920년생 영국의 작가예요.|여름방학에 동생이 홍역에 걸려 격리되자 톰은 이모네 아파트로 보내져요. 지루해하던 톰은 밤마다 시계가 열세 번 울리면 아파트 뒷문 밖에 정원이 나타난다는 걸 알게 돼요. 그곳에서 그는 외로운 소녀 해티를 만나 친구가 돼요. 정원에서 시간은 이상하게 흐르고 해티는 점점 자라 어른이 돼요. 마지막에 톰은 노인이 된 해티와 만나고 두 사람은 서로를 알아봐요.|1958년 출간돼 카네기상을 받았어요.
과학콘서트|정재승은 1972년생 한국의 과학자예요.|이 책은 교양 과학서라 줄거리 대신 구성으로 소개해요. 일상에서 만나는 현상을 물리학, 복잡계, 뇌과학 등으로 설명해요. 도시의 교통 체증, 나비 효과, 게임 이론, 카오스 등 흥미로운 주제를 다뤄요. 과학이 어렵다는 편견을 깨고 쉽게 풀어 써서 인기를 얻었어요. 장마다 짧은 영화나 음악 이야기로 시작해요.|2001년 출간됐어요.
목넘이 마을의 개|황순원은 1915년생 소설가예요.|이야기는 서북 지방 목넘이 마을에서 시작해요. 어느 날 떠돌이 개 신둥이가 마을에 들어오자 사람들은 미친 개라며 몰아내려 해요. 마을 사람들은 신둥이를 쫓아내고 죽이려 하지만 신둥이는 끈질기게 살아남아요. 새끼를 밴 신둥이는 마을 근처 방앗간에서 새끼를 낳아요. 그 새끼들이 자라 마을의 개가 되고 마을 사람들은 신둥이의 질긴 생명력에 감탄해요.|1948년 발표됐어요.
술 권하는 사회|현진건은 1900년생 소설가예요.|일본에서 유학한 남편은 매일 밤 술에 취해 늦게 들어와요. 아내는 남편이 왜 술을 마시는지 알지 못하고 기다리다 지쳐요. 남편은 술을 권하는 건 사회라며 불만을 털어놓아요. 그는 일제강점기 속에서 뜻을 펼치지 못하는 지식인의 좌절을 술로 달래요. 아내는 '무슨 사회가 술을 권하나'라며 남편의 말을 이해하지 못해요.|1921년 발표됐어요.
등신불|김동리는 1913년생 소설가예요.|학병으로 끌려간 '나'는 탈출해 중국 남경에서 절을 찾아가요. 그곳 금불각에는 불에 그을린 채 앉은 등신불이 모셔져 있어요. 주지 스님은 이 불상이 당나라 때 소신공양한 만적 스님의 몸이라고 설명해요. 만적이 젊은 시절 비극적 사연을 겪은 뒤 자신의 몸을 태워 부처에게 바친 이야기가 이어져요. '나'는 등신불 앞에서 큰 충격과 감동을 느껴요.|1961년 발표됐어요.
갯마을|오영수는 1909년생 소설가예요.|바닷가 마을 갯마을은 여자들은 해초를 따고 남자들은 고기를 잡아 살아가요. 해순은 남편 성칠이 고기잡이 나갔다가 풍랑으로 돌아오지 못하자 과부가 돼요. 마을 사람들과 지내던 해순은 상수와 결혼해 마을을 떠나지만 새 삶에 적응하지 못해요. 상수가 징용으로 끌려가자 해순은 다시 갯마을로 돌아와요. 갯마을 사람들의 소박하고 끈질긴 삶이 드러나요.|1953년 발표됐어요.
숙영낭자전|작자 미상의 조선 후기 소설이에요.|선비 백선군은 꿈속에서 선녀 숙영을 만나 사랑에 빠지고 마침내 부부가 돼요. 백선군이 과거 시험을 보러 간 사이 숙영은 시아버지의 오해로 누명을 쓰게 돼요. 억울함을 풀 길이 없자 숙영은 스스로 목숨을 끊어요. 돌아온 백선군은 진실을 알고 슬퍼하며 숙영의 원한을 풀어 주려 해요. 숙영은 다시 살아나 부부는 행복하게 살아요.|숙영의 죽음 장면이 나와요.
김현감호|『삼국유사』에 실린 설화예요.|신라의 김현은 흥륜사에서 탑돌이를 하다가 한 처녀와 사랑에 빠져요. 처녀는 호랑이 가족의 막내딸이었고 세 오빠가 사람을 해치려 하자 대신 죽어 인간을 구하겠다고 해요. 처녀는 김현의 칼에 목숨을 바치고 김현은 호랑이의 은덕으로 벼슬에 올라요. 김현은 절을 세워 호랑이 처녀의 명복을 빌어요.|사람과 호랑이의 사랑을 그린 설화예요.
온달전|『삼국사기』 열전에 실린 이야기예요.|고구려 평원왕의 딸 평강공주는 울보로 놀림받다가 왕이 바보 온달에게 시집보내겠다고 말해요. 공주는 그 말을 지키며 궁을 나와 온달을 찾아가 혼인해요. 평강공주는 온달에게 글과 무예를 가르쳐 훌륭한 장수로 만들어요. 온달은 사냥대회에서 이름을 알리고 북주의 군대를 물리쳐 공을 세워요. 훗날 신라와 싸우다 아단성에서 전사하고 공주가 관을 어루만지자 관이 움직여요.|고구려 시대 이야기를 전해 주는 열전이에요.
설씨녀|『삼국사기』 열전에 실린 이야기예요.|신라 진평왕 때 가난한 설씨녀의 아버지가 늙은 몸으로 변방에 지키러 가야 할 처지가 돼요. 설씨녀는 아버지를 걱정하고 가실이 대신 가겠다고 나서요. 가실은 설씨녀와 혼인을 약속하고 거울을 반으로 나눠 가져요. 몇 해가 지나도 가실이 돌아오지 않자 부모는 다른 혼처를 구하지만 설씨녀는 거절해요. 마침내 돌아온 가실은 반쪽 거울을 맞춰 보고 두 사람은 혼인해요.|신의를 지키는 사랑을 보여 줘요.
도미 부인|『삼국사기』 열전에 실린 이야기예요.|백제 개루왕 때 도미는 아름다운 아내를 두고 절개가 굳다고 소문이 났어요. 왕이 이를 시험하려고 신하를 왕으로 꾸며 보내자 아내는 몸종을 대신 들여보내 속여요. 왕은 화가 나 도미의 눈을 멀게 하고 배에 태워 내보내요. 왕은 아내를 불러 강제로 취하려 하지만 아내는 지혜를 써서 탈출해요. 아내는 남편과 천성도에서 재회하고 두 사람은 함께 살아가요.|절개와 사랑을 다룬 이야기로 폭력 장면이 일부 있어요.
리버보이|팀 보울러는 1953년생 영국의 작가예요.|열다섯 살 소녀 제스는 수영 선수예요. 그녀의 할아버지는 화가로 강을 그린 그림을 완성하지 못한 채 심장병으로 쓰러져요. 가족은 할아버지를 모시고 시골 강가 별장으로 가요. 제스는 강에서 신비한 소년의 목소리를 듣고 할아버지의 마지막 그림을 완성하기 위해 강을 따라 수영하기 시작해요. 강물을 따라가며 제스는 삶과 죽음, 용기의 의미를 깨달아요.|1997년 출간돼 카네기상을 받았어요. 가족의 죽음이 나와요.
스타걸|제리 스피넬리는 1941년생 미국의 작가예요.|애리조나의 한 작은 마을 고등학교에 독특한 소녀 스타걸이 전학 와요. 스타걸은 노래를 부르고 생일을 챙겨 주며 남들과 다르게 행동해 처음에는 인기를 얻어요. 평범한 소년 레오는 스타걸에게 반해 가까워지고 그녀의 방식에 영향을 받아요. 그러나 학교 친구들은 스타걸의 별난 행동을 이해하지 못해 따돌리기 시작해요. 레오 역시 친구들의 시선 때문에 스타걸과 거리를 두게 되고 이후 큰 변화를 맞아요.|2000년 출간됐어요. 자기 자신답게 사는 용기를 이야기해요.
아웃사이더|S. E. 힌턴은 1948년생 미국의 작가예요.|열네 살 포니보이 커티스는 가난한 동네의 그리서 패거리 소년이에요. 이들은 부유한 소크스 패거리와 늘 갈등을 겪어요. 어느 날 밤 친구 조니가 소크스 한 명을 죽이고 포니보이와 함께 교회로 도망쳐요. 교회에 불이 나 아이들을 구하다 조니가 크게 다치고 결국 숨을 거둬요. 조니의 마지막 편지는 순수함을 잃지 말라고 말해요.|1967년 출간됐어요. 폭력 장면이 나와요.
붉은 추장의 몸값|O. 헨리는 1862년생 미국의 작가예요.|두 사람의 납치범 샘과 빌은 마을의 부잣집 아이 조니를 납치해 몸값 2천 달러를 요구하려 해요. 그런데 조니는 말썽꾸러기라 인디언 놀이를 하며 납치범들을 괴롭혀요. 하루가 지나자 납치범들은 아이를 감당하지 못해 몸값을 되려 주고 아이를 돌려보내려 해요. 아이 아버지는 오히려 돈을 더 받아야 아이를 돌려받겠다고 맞서요. 이야기는 납치범이 아이를 돌려주기 위해 돈을 내는 반전으로 끝나요.|1907년 발표된 유머 단편이에요.
마녀의 빵|O. 헨리는 1862년생 미국의 작가예요.|빵집을 운영하는 마사 미스는 가난한 화가가 매번 굳은 빵만 사 가는 것을 보고 마음이 쓰여요. 그녀는 화가가 건축 설계사이며 잘 먹지 못한다고 짐작하고 몰래 빵 사이에 버터를 발라 줘요. 며칠 뒤 화가가 가게에 들어와 화를 내요. 그는 공모전을 위해 지우개 대신 굳은 빵으로 설계도를 지우고 있었는데 버터가 발라진 빵 때문에 설계도를 모두 망쳐 버렸어요. 마사 미스는 자신의 호의가 오해를 불렀다는 것을 알게 돼요.|1905년 발표됐어요.
카멜레온|안톤 체호프는 1860년생 러시아의 작가예요.|경찰서장 오추멜로프는 시장에서 한 남자가 개에게 손가락을 물렸다는 소동을 처리하게 돼요. 그는 처음에는 개 주인을 벌하겠다고 하다가 개가 장군 집 개일 수 있다는 말에 태도를 바꿔요. 그때마다 구경꾼들의 말에 따라 개가 장군의 개인지 아닌지에 따라 말을 계속 바꿔요. 결국 개가 장군의 형제 개라는 것을 알고 개에게 아부하듯 굴어요. 권력 앞에서 쉽게 변하는 사람을 카멜레온에 비유해요.|1884년 발표됐어요.
세 가지 질문|레프 톨스토이는 1828년생 러시아의 작가예요.|한 왕이 모든 일을 올바르게 하려면 가장 중요한 때, 가장 중요한 사람, 가장 중요한 일이 무엇인지 알고 싶어 해요. 신하들의 대답에 만족하지 못한 왕은 숲속의 은자를 찾아가요. 은자는 대답 대신 밭을 갈고 있고 왕은 그를 돕다가 다친 사람을 간호하게 돼요. 그 사람은 왕을 죽이려던 적이었으나 왕의 도움에 감동해 용서를 구해요. 은자는 가장 중요한 때는 지금, 가장 중요한 사람은 지금 곁에 있는 사람, 가장 중요한 일은 그에게 선을 행하는 것이라고 말해요.|1885년 발표된 우화 같은 이야기예요.
도둑맞은 편지|에드거 앨런 포는 1809년생 미국의 작가예요.|파리 경찰국장은 왕비의 중요한 편지를 D 장관이 훔쳤다며 되찾아 달라고 오귀스트 뒤팽을 찾아와요. 경찰은 장관의 집을 몇 달 동안 샅샅이 뒤졌지만 편지를 찾지 못했어요. 뒤팽은 장관의 성격을 분석해 숨기기보다 눈에 잘 띄는 곳에 두었을 것이라 추리해요. 그는 장관의 집에 가서 편지꽂이에 구겨진 편지를 발견하고 같은 모양의 가짜 편지를 바꿔 놓고 진짜 편지를 되찾아요.|1844년 발표됐어요.
고자질하는 심장|에드거 앨런 포는 1809년생 미국의 작가예요.|화자는 자신이 미치지 않았다고 주장하며 이야기를 시작해요. 그는 함께 사는 노인의 독수리 같은 눈이 견딜 수 없이 싫어서 노인을 죽이기로 결심해요. 일곱 밤 동안 노인의 방을 몰래 엿보다 여덟째 밤에 노인을 죽이고 시신을 마룻바닥 아래 숨겨요. 경찰이 찾아왔을 때 화자는 침착하게 맞이하지만 점점 노인의 심장이 뛰는 소리가 크게 들리는 것 같아요. 결국 견디지 못하고 범행을 자백해요.|1843년 발표됐어요. 살인 장면이 나와요.
되찾은 개심|O. 헨리는 1862년생 미국의 작가예요.|금고털이로 감옥에 있던 지미 밸런타인은 출소해 다시 범죄를 저지르며 지내요. 어느 날 마을에서 아름다운 아가씨 애너벨을 만나 사랑에 빠지고 랠프 스펜서라는 이름으로 새 삶을 시작해요. 결혼을 앞둔 어느 날 은행 금고에 어린아이가 갇히는 사고가 일어나요. 지미는 숨겨 둔 도구를 꺼내 금고를 열어 아이를 구해요. 형사 벤 프라이스는 이 모습을 보고 그를 모른 척 돌아서요.|1903년 발표됐어요.
데이비드 코퍼필드|찰스 디킨스는 1812년생 영국의 작가예요.|유복자로 태어난 데이비드는 어머니와 유모 페고티와 행복하게 지내지만 어머니가 재혼하며 의붓아버지 머드스톤에게 학대받아요. 그는 런던 공장에서 일하다 탈출해 이모 벳시 트롯우드에게 의지해 새 삶을 시작해요. 학교를 마치고 법률 공부를 하며 도라와 결혼하지만 그녀는 병으로 세상을 떠나요. 후에 아그네스와 결혼하고 작가로 성공해요. 여러 인물과의 인연을 통해 성장해 가요.|1850년 출간됐고 디킨스의 자전적 요소가 많다고 알려져 있어요.
십이야|윌리엄 셰익스피어는 1564년생 영국의 극작가예요.|쌍둥이 남매 비올라와 세바스찬은 배가 난파되어 헤어지고 비올라는 일리리아에 닿아요. 그녀는 남장을 하고 세사리오라는 이름으로 오르시노 공작의 시종이 돼요. 공작은 백작 올리비아를 사랑하는데 올리비아는 세사리오를 사랑하게 돼요. 비올라는 공작을 마음에 두고 있지만 말하지 못해요. 세바스찬이 나타나면서 오해가 풀리고 각자 사랑을 이뤄요.|1601년 무렵 쓰인 희극이에요.
우리 읍내|손턴 와일더는 1897년생 미국의 작가예요.|미국 뉴햄프셔의 작은 마을 그로버스 코너스의 평범한 일상이 무대 감독의 안내로 펼쳐져요. 에밀리 웹과 조지 깁스는 이웃으로 자라 사랑에 빠져 결혼해요. 그러나 에밀리는 아이를 낳다가 세상을 떠나요. 죽은 에밀리는 열두 번째 생일로 돌아가 하루를 다시 보며 사람들이 일상의 소중함을 놓치고 있음을 깨달아요. 극은 평범한 삶의 가치를 이야기해요.|1938년 초연돼 퓰리처상을 받았어요.
어스시의 마법사|어슐러 K. 르 귄은 1929년생 미국의 작가예요.|어스시의 외딴 섬에서 태어난 소년 게드는 마법에 재능이 있어 마법사 오지언에게 배운 뒤 로크 섬의 마법 학교에 입학해요. 그는 자신보다 앞서가는 친구에게 지지 않으려고 금지된 마법을 써서 그림자라는 어두운 존재를 불러내요. 그림자는 게드를 쫓아다니고 게드는 목숨을 걸고 그림자를 추격하게 돼요. 먼 바다까지 이어진 추적 끝에 게드는 그림자가 자신의 일부임을 깨닫고 받아들여요.|1968년 출간됐어요.
다이버전트|베로니카 로스는 1988년생 미국의 작가예요.|미래의 시카고는 사람들의 성향에 따라 다섯 분파로 나뉘어 있어요. 열여섯 살 베아트리스는 분파 선택 의식에서 자신의 성향이 하나로 정해지지 않는 '다이버전트'임을 알게 돼요. 그녀는 부모가 속한 애브니게이션을 떠나 용감한 분파 돈트리스를 선택하고 이름을 트리스로 바꿔요. 혹독한 훈련을 거치며 포를 만나 성장하지만 지식 분파가 음모를 꾸미고 있음을 알게 돼요. 트리스는 가족과 친구를 지키려 싸워요.|2011년 출간됐어요. 폭력 장면이 나와요.
명심보감|추적은 고려 시대의 학자로 알려져 있어요. 명나라 판본도 전해져요.|이 책은 교훈 모음집이라 줄거리 대신 구성으로 소개해요. 옛 성현들의 말을 모아 선과 악, 효도, 공부, 말과 행동 같은 주제로 엮었어요. '착한 일을 하면 복을 받고 악한 일을 하면 화를 입는다'는 계선편으로 시작해요. 이웃과 친구를 대하는 법, 자신을 반성하는 법도 담았어요. 한문 교육에서 많이 쓰였어요.|조선 시대부터 어린이들의 교육서로 널리 쓰였어요.
페르마의 마지막 정리|사이먼 싱은 1964년생 영국의 과학 저널리스트예요.|이 책은 수학 교양서라 줄거리 대신 구성으로 소개해요. 17세기 수학자 피에르 드 페르마가 책의 여백에 적은 '놀라운 증명을 찾았지만 여백이 부족하다'는 메모에서 이야기가 시작돼요. 이후 300년 넘게 수많은 수학자들이 이 정리를 증명하려 도전했어요. 영국의 수학자 앤드루 와일스는 1993년 증명을 발표했고 오류를 고쳐 1995년에 완성했어요. 수학의 역사와 수학자들의 열정을 흥미롭게 보여 줘요.|1997년 출간됐어요.
왜 세계의 절반은 굶주리는가|장 지글러는 1934년생 스위스의 사회학자예요.|이 책은 사회 비평서라 줄거리 대신 구성으로 소개해요. 세계의 식량 생산은 충분한데도 왜 굶주리는 사람이 있는지 아버지와 딸의 대화 형식으로 풀어요. 식민지 지배, 불공정한 무역, 빚, 농업 정책이 기아의 원인이라고 설명해요. 굶주림은 자연재해가 아니라 사회 구조의 문제라고 말해요. 해결을 위해 국제 사회의 책임을 강조해요.|1999년 프랑스에서 출간됐어요.
탈무드|탈무드는 유대인의 율법과 가르침을 모은 책이에요.|이 책은 지혜서라 줄거리 대신 구성으로 소개해요. 구전 율법을 기록한 미슈나와 그 해설인 게마라로 이루어져요. 생활 규범과 윤리, 법, 예절에 대한 토론이 방대하게 담겨 있어요. 우리나라에서는 교훈이 되는 이야기들을 뽑은 책으로 널리 알려졌어요. 배우고 토론하는 전통이 강조돼요.|기원후 5세기경까지 편찬된 것으로 알려져 있어요.
파피용|베르나르 베르베르는 1961년생 프랑스의 작가예요.|지구가 환경 오염과 자원 고갈로 위기에 처하자 한 과학자가 우주 범선 파피용을 만들어요. 14만 4천 명이 새로운 행성을 찾아 태양풍을 돛으로 삼아 떠나요. 긴 항해 동안 우주선 안에서 사회가 만들어지고 갈등과 사랑, 세대 교체가 일어나요. 사람들은 이상 사회를 꿈꾸지만 지구의 문제들이 다시 되풀이돼요. 항해의 끝에서 인류의 미래에 대한 질문이 던져져요.|2006년 프랑스에서 출간됐어요.
연탄길|이철환은 1963년생 작가예요.|이 책은 짧은 이야기를 모은 책이라 구성으로 소개해요. 가난하지만 서로를 돕고 사는 이웃들의 이야기를 따뜻하게 풀어요. 연탄 한 장의 온기처럼 작은 선행이 사람의 마음을 덥히는 모습을 그려요. 장애를 가진 아이, 외로운 노인, 힘든 가족 이야기가 이어져요. 읽고 나면 주변 사람에 대한 고마움을 되새기게 돼요.|2001년 출간돼 베스트셀러가 됐어요.
책 도둑|마커스 주삭은 1975년생 오스트레일리아의 작가예요.|죽음이 이야기를 들려주는 화자예요. 나치 독일 시대, 아홉 살 소녀 리젤 메밍거는 동생을 잃고 양부모 한스와 로자에게 맡겨져요. 리젤은 묘지에서 우연히 책 한 권을 훔치고 한스에게 글을 배워요. 이웃의 유대인 청년 막스를 지하실에 숨겨 주고 둘은 책과 이야기로 우정을 쌓아요. 폭격이 도시를 덮치며 비극이 일어나고 리젤은 살아남아 책을 지켜요.|2005년 출간됐어요. 전쟁과 죽음의 이야기가 나와요.
묘지 책|닐 게이먼은 1960년생 영국의 작가예요.|아기 때 가족이 살해당한 아이는 묘지로 도망쳐 유령들의 보호를 받아요. 아이는 '노바디 오언스'라는 이름을 받고 묘지에서 유령들에게 배우며 자라요. 아이는 묘지에서 마법 같은 능력을 익히고 학교와 바깥 세상에 대한 호기심을 키워요. 가족을 죽인 암살자 잭이 아이를 다시 쫓아오자 아이는 묘지 친구들과 함께 맞서요. 아이는 결국 세상 밖으로 나갈 용기를 얻어요.|2008년 출간돼 뉴베리상을 받았어요.
물을 향한 긴 여정|린다 수 박은 1960년생 미국의 작가예요.|두 이야기가 번갈아 펼쳐지는 소설이에요. 2008년 남수단의 소녀 니야는 하루 몇 시간씩 걸어 물을 길어 와요. 1985년 열한 살 소년 살바는 내전으로 마을이 불타고 가족과 헤어져 피난길에 올라요. 살바는 굶주림과 위험 속에서 먼 길을 걸어 난민 캠프로 가요. 시간이 흐르면서 두 사람의 이야기는 하나로 이어져요.|2010년 출간됐어요. 실존 인물 살바 두트의 경험이 바탕이에요.
천둥소리, 내 울음 들어라|밀드레드 D. 테일러는 1943년생 미국의 작가예요.|1930년대 미국 미시시피에서 흑인 소녀 캐시 로건은 가족이 일군 땅을 자랑스러워하며 살아요. 이웃 백인 지주들은 인종 차별을 하며 흑인 가족을 괴롭히고 땅을 빼앗으려 해요. 캐시는 학교에서 낡은 교과서를 받는 등 차별을 경험하면서 불의를 깨달아요. 로건 가족은 위협에도 굴하지 않고 땅과 존엄을 지키려 해요. 이웃 흑인 가족에게 닥친 사건을 겪으며 캐시는 성장해요.|1976년 출간돼 뉴베리상을 받았어요. 인종 차별과 폭력이 나와요.
웨스팅 게임|엘런 래스킨은 1928년생 미국의 작가예요.|억만장자 샘 웨스팅이 숨지고 그의 유산을 물려받을 열여섯 명의 상속인이 한자리에 모여요. 유언장에는 두 사람씩 짝을 지어 단서를 풀어 누가 웨스팅을 죽였는지 알아내는 게임에서 이기는 사람이 유산을 받는다고 적혀 있어요. 상속인들은 의심하고 서로 속이며 수수께끼를 풀어요. 폭발 사고와 비밀이 이어지고 반전이 이어져요. 게임의 진짜 목적과 숨은 진실이 마지막에 밝혀져요.|1978년 출간돼 뉴베리상을 받았어요.
나무 위의 물고기|린다 멀럴리 헌트는 1949년생 미국의 작가예요.|열한 살 앨리는 새 학교에 갈 때마다 글을 읽지 못해 문제아로 몰려요. 앨리는 실제로는 그림을 잘 그리고 생각이 깊은 아이예요. 새로 온 대리 교사 대니얼스 선생님은 앨리가 난독증을 가졌다는 것을 알아봐요. 선생님의 도움으로 앨리는 자신의 장점을 발견하고 친구를 사귀며 용기를 얻어요. 자신을 있는 그대로 받아들이게 되는 이야기예요.|2015년 출간됐어요.
내 마음 밖으로|섀런 M. 드레이퍼는 1948년생 미국의 작가예요.|열한 살 멜로디는 뇌성마비로 말도 걷지도 못해요. 그러나 그녀는 놀라운 기억력과 지능을 가지고 있어요. 컴퓨터 장치를 얻은 멜로디는 마침내 자신의 생각을 말할 수 있게 돼요. 학교 퀴즈 팀에 들어가지만 친구들의 오해와 질투를 겪고 큰 시련도 마주해요. 멜로디는 사람들의 시선에 맞서 자신을 표현하는 법을 배워요.|2010년 출간됐어요.
엠버 시티|진 뒤프라우는 1944년생 미국의 작가예요.|지하에 있는 도시 엠버 시티는 지상이 위험해져서 200년 전 만들어졌어요. 도시의 전등이 하나둘 꺼지기 시작해 주민들은 불안해해요. 열두 살 리나 메이필드는 졸업 후 직업을 배정받는 날 배달부 일을 맡고, 친구 둔은 파이프 공사를 맡게 돼요. 리나는 우연히 옛 시장의 쪽지를 발견하고 둔과 함께 도시의 비밀을 풀기 시작해요. 둘은 어둠 속에서 탈출구를 찾아요.|2003년 출간됐어요.
너에게 닿을 때|리베카 스테드는 1968년생 미국의 작가예요.|1979년 뉴욕에 사는 열두 살 미란다는 어머니와 둘이 살아요. 어느 날부터 '네가 다음에 할 일을 알고 있다'는 이상한 쪽지들이 미란다에게 도착해요. 쪽지에는 미란다가 믿기 어려운 요청이 적혀 있고 미란다는 친구 샐, 도시의 이상한 사람들, 어머니의 퀴즈 쇼 준비와 얽힌 일들을 겪어요. 쪽지의 정체와 주변 인물의 비밀이 하나씩 밝혀져요. 시간과 우정에 대해 생각하게 하는 이야기예요.|2009년 출간돼 뉴베리상을 받았어요.
두 개의 달을 걷다|샤론 크리치는 1945년생 미국의 작가예요.|열세 살 샐 샐러맨카는 어머니가 집을 떠난 뒤 아버지와 오하이오에서 아이다호로 이사해요. 샐은 어머니를 찾아 할아버지, 할머니와 함께 차를 타고 길을 떠나게 돼요. 여행 중에 샐은 친구 피비의 이야기를 들려주며 이야기를 풀어내요. 피비의 어머니도 갑자기 사라졌고 사건이 이어져요. 샐은 여행을 통해 슬픔을 받아들이고 가족의 의미를 되새겨요.|1994년 출간돼 뉴베리상을 받았어요.
스물한 개의 풍선|윌리엄 페네 뒤부아는 1916년생 미국의 작가예요.|은퇴한 수학 교사 윌리엄 워터먼 셔먼 교수는 태평양을 풍선을 타고 날아가겠다는 여행을 떠나요. 그러나 여행 중 풍선이 바다에 떨어져 크라카토아 섬에 닿아요. 섬에는 다이아몬드 광산과 이상적인 사회를 이루는 가족들이 살고 있어요. 섬의 사람들은 화산 폭발에 대비해 놀라운 장치를 만들어 놓았어요. 교수는 마침내 화산 폭발을 겪고 풍선으로 섬을 탈출해요.|1947년 출간돼 뉴베리상을 받았어요.
기억 속의 들꽃|윤흥길은 1942년생 소설가예요.|6·25 전쟁 때 피난민들이 지나가는 만경강 근처 마을에서 이야기가 시작돼요. 피난민들이 떠난 뒤 홀로 남겨진 소녀 명선이를 '나'가 집으로 데려와요. 어머니는 처음에는 박대하지만 명선이가 금반지를 내놓자 태도를 바꿔 함께 살게 해요. 시간이 지나 다시 구박받자 명선이는 또 금반지를 내놓고 부모는 더 숨긴 반지가 있다고 의심해 추궁해요. 명선이는 집을 나가 다리 철근 위에서 놀다가 비행기 폭음에 놀라 떨어져 죽어요.|명선이가 부서진 다리 위에서 쥐바라숭꽃을 머리에 꽂는 장면이 상징적이에요. 어린아이의 죽음이 나와요.
우상의 눈물|전상국은 1940년생 소설가예요.|1970년대 말 어느 남자 고등학교에서 최기표는 주먹으로 반을 지배해요. 새 담임이 학급의 단결을 강조하자 기표의 힘에 균열이 생겨요. 오월 고사에서 반장이 답안지를 보여 달라는 기표의 부탁을 거부하고 책임을 지겠다고 나서요. 기표는 반장에게 폭력을 쓰지만 반장은 끝까지 가해자를 밝히지 않아 영웅이 돼요. 이후 담임과 반장은 기표를 동정의 대상으로 만들고 기표는 쪽지를 남기고 사라져요.|1980년 발표됐어요. 제목의 '우상'은 폭력으로 군림한 기표와 이를 몰아내는 집단의 위선을 함께 가리킨다고 해석돼요. 폭력 장면이 나와요.
불량한 자전거 여행|김남중은 아이들의 성장과 가족 이야기를 동화와 청소년 소설로 써 온 작가예요. 이 작품은 2009년 창비아동문고로 나온 대표작이에요.|6학년 호진이는 부모님이 이혼을 결정하자 크게 반발해요. 호진이는 집을 나와 광주에 사는 삼촌을 찾아가요. 삼촌은 자전거 여행을 이끄는 사람이었고, 호진이는 그 여행에 조수로 따라나서요. 일행은 구례와 부산을 지나 강원도 고성까지 약 1,100km를 달려요. 여행길에서 호진이는 저마다 다른 사람들과 함께 페달을 밟아요. 그러면서 엄마와 아빠, 그리고 자기 자신을 한결 여유롭게 바라보게 돼요.|가족 이야기이자 로드무비 같은 성장 동화로 소개되는 작품이에요. 책 속에 "자전거 위에서 바라보는 세상은 또 다른 세상이야."라는 문장이 실려 있어요. 초등 고학년용으로 나왔고 '한 학기 한 책 읽기' 도서로 많이 읽혀요. 2019년에는 2권이 출간되었어요.
시간을 파는 상점|김선영은 1966년생으로 2004년 대전일보 신춘문예에 단편 「밀례」가 당선되며 등단했어요. 한 청소년의 죽음에 관한 기사를 계기로 이 이야기를 쓰기 시작했다고 해요.|주인공 온조는 인터넷 카페에 '시간을 파는 상점'을 열고 '크로노스'라는 닉네임으로 활동해요. 일찍 세상을 떠난 소방관 아빠의 뜻을 이어 손님들의 의뢰를 해결해요. 첫 의뢰는 옆 반에서 일어난 PMP 도난 사건이에요. 작년에도 비슷한 일이 있었는데 범인으로 몰린 아이가 목숨을 끊었기에, 온조는 같은 비극이 되풀이되지 않게 나서요. 두 번째 의뢰는 미국으로 이민 간 강토 가족의 이야기로, 할머니의 소원을 대신 이뤄 달라는 부탁이에요. 이야기 후반에는 위기가 닥치지만 아이들은 답을 찾아가요. 시간을 놓지 않으면 절망의 시간도 희망의 시간으로 바꿀 수 있다는 걸 깨달아요.|2011년 제1회 자음과모음 청소년문학상 수상작이에요. 이후 2권 『너를 위한 시간』, 3권으로 이어진 시리즈예요. 시간의 의미와 청소년의 죽음, 가족 갈등을 함께 다뤄요.
원고지|이근삼(1929~2003)은 평양에서 태어나 1946년 월남했고 동국대에서 영문학을 공부했어요. 1956년 미국 유학에서 연극 이론을 공부했고 귀국 뒤 단막극 「원고지」로 극작가로 데뷔했어요. 평생 56편의 희곡을 썼고 동국대 연극영화과 설립에도 힘썼어요.|이 작품에는 원고지 무늬 양복을 입고 쇠사슬에 묶인 '교수'가 등장해요. 교수는 미국에서 들어온 지식을 기계적으로 옮겨 적을 뿐 자기 지식은 하나도 만들어 내지 못해요. 장녀가 무대에 나와 상황을 설명해 주는 서사극 방식으로 진행돼요. 이런 인물을 통해 우리나라 지식인을 풍자해요. 작품은 수동적인 중개자에 머무는 지식인은 사회를 긍정적으로 바꿀 수 없다고 말해요.|풍자와 서사극 기법이 두드러지는 초기 대표작이에요. 같은 작가의 대표작으로 「국물 있사옵니다」(1966), 「제18공화국」(1967), 「유랑극단」(1971)이 있어요. 발표 연도는 자료마다 1959년과 1960년으로 달리 적혀 있으니 확인이 필요해요.
