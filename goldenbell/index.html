메밀꽃 필 무렵|이효석은 1907년 강원도 평창에서 태어난 소설가예요. 서정적인 문체로 자연과 인간의 정서를 그린 작품을 많이 남겼어요.|장돌뱅이 허 생원은 봉평장에서 장사를 마치고 조 선달, 동이와 함께 다음 장터로 길을 떠나요. 허 생원은 얼굴이 얽은 탓에 평생 여자와 인연이 없었지만 젊은 시절 메밀꽃 핀 달밤 물레방앗간에서 한 처녀와 하룻밤을 보낸 기억을 간직하고 있어요. 길을 걷던 중 동이가 홀어머니와 제천에서 살고 아버지를 모른다는 이야기를 들어요. 동이가 왼손잡이라는 사실을 알게 되자 허 생원은 마음이 흔들려요. 달빛 아래 메밀밭 길을 걷는 장면에서 이야기가 끝나요.|1936년 발표됐고 한국 단편 중 서정적 아름다움이 뛰어난 작품으로 꼽혀요. 달밤의 메밀밭 묘사가 특히 유명해요.
무진기행|김승옥은 1941년생 소설가로 1960년대 감수성의 문학을 이끌었어요.|서울에서 제약회사 일을 하는 윤희중은 아내의 권유로 고향 무진에 내려가요. 안개가 자욱한 무진에서 그는 옛 친구 조와 후배 박을 만나 속물적인 세상 이야기를 나눠요. 그러다 음악 교사 하인숙을 만나 자신의 과거와 닮은 모습을 발견하고 가까워져요. 두 사람은 하룻밤을 보내지만 그는 서울에서 온 전보를 받고 다시 돌아가기로 해요. 편지를 찢으며 부끄러움을 느끼지만 결국 서울로 돌아가요.|1964년 발표됐어요. 안개는 현실 도피와 허무를 상징해요.
난장이가 쏘아올린 작은 공|조세희는 1942년생 소설가로 이 연작으로 산업화 시대의 소외를 고발했어요.|이 작품은 12편의 연작 소설집이라 대표적인 이야기로 소개해요. 행복동 낙원구에 사는 난장이 가족은 재개발로 집이 철거될 위기에 놓여요. 아버지는 달나라로 가고 싶다는 꿈을 말하지만 철거 뒤 공장 굴뚝에서 떨어져 세상을 떠나요. 아들 영수는 노동자로 일하며 은강그룹의 부당한 처우에 맞서요. 쓰레기장 같은 곳에서 사는 이들과 부유층의 삶이 극명하게 대비돼요.|1978년 책으로 나왔고 한국 현대 문학의 대표작 중 하나예요. 환상과 현실을 오가는 독특한 문체로 유명해요.
광장|최인훈은 1936년 함경북도 출신의 소설가로 분단 문제를 깊이 있게 다뤘어요.|철학과 학생 이명준은 남한에서 월북한 아버지 때문에 경찰에 시달리다 북으로 가요. 그러나 북에서도 자유를 느끼지 못하고 실망해요. 그는 6·25 전쟁에 인민군으로 참전했다가 포로가 돼요. 포로 송환 때 그는 남한도 북한도 선택하지 않고 중립국을 택해요. 배를 타고 가던 중 갈매기를 보며 바다에 몸을 던져요.|1960년 발표됐어요. 이념의 광장과 개인의 밀실 사이의 갈등을 다룬 작품으로 평가돼요.
허생전|박지원은 1737년생 조선 후기의 실학자이자 소설가예요.|가난한 선비 허생은 아내의 불평에 글 읽기를 그만두고 한양 부자 변씨에게 만 냥을 빌려요. 그는 과일과 말총을 사재기해 큰돈을 벌어 시장의 허점을 보여 줘요. 도둑 떼를 데리고 무인도에 들어가 이상 사회를 세워요. 그는 돈을 바다에 버리고 글을 아는 사람들을 데리고 떠나요. 돌아와 이완 대장에게 북벌론의 허점을 비판해요.|18세기 후반에 쓰였고 『열하일기』 중 「옥갑야화」에 실려 있어요. 양반의 무능과 허례를 풍자해요.
구운몽|김만중은 1637년생 조선 후기의 문인이에요. 유배지에서 이 작품을 썼다고 전해져요.|성진은 불교 수행에 힘쓰는 승려인데 팔선녀를 만나 희롱한 죄로 지옥에 가 인간 세상에 다시 태어나요. 양소유로 태어난 그는 과거에 급제하고 여덟 여인과 인연을 맺어요. 전쟁에서 공을 세우고 높은 벼슬과 부귀영화를 누려요. 그러나 어느 날 인생의 허무함을 깨닫고 눈을 떠 보니 모든 일이 꿈이었어요. 성진은 불법의 이치를 깨닫고 팔선녀와 함께 수행에 정진해요.|17세기 후반에 쓰였고 꿈을 통해 인생의 덧없음을 그린 몽자류 소설의 대표작이에요.
소년이 온다|한강은 1970년생 소설가로 2024년 노벨 문학상을 받았어요.|1980년 5월 광주, 중학생 동호는 시민군이 사용하는 도청에서 시신 수습을 도와요. 친구 정대의 죽음을 목격한 뒤 동호는 도청에 남아요. 계엄군이 도청을 진압하며 동호는 목숨을 잃어요. 이후 시간이 흘러도 살아남은 사람들은 고문의 기억과 죄책감으로 고통받아요. 여러 인물의 목소리로 5·18의 상처와 그 이후의 삶을 이야기해요.|2014년 출간됐고 역사적 폭력과 애도를 다뤄요. 폭력 장면의 묘사가 있어 읽을 때 마음의 준비가 필요해요.
동물농장|조지 오웰은 1903년생 영국의 작가예요.|매너 농장의 동물들은 늙은 돼지 메이저의 연설에 감화돼 주인 존스를 쫓아내고 스스로 농장을 운영해요. 그들은 '모든 동물은 평등하다'는 계명을 세워요. 그러나 돼지 나폴레옹이 스노볼을 몰아내고 권력을 잡으면서 상황이 바뀌어요. 개들을 동원한 공포 정치가 이어지고 계명은 조금씩 바뀌어요. 결국 '모든 동물은 평등하지만 어떤 동물은 더 평등하다'는 말만 남아요.|1945년 출간됐고 소련의 스탈린 체제를 풍자한 우화로 알려져 있어요.
1984|조지 오웰은 1903년생 영국의 작가예요.|전체주의 국가 오세아니아에서 윈스턴 스미스는 진리부에서 역사 기록을 고치는 일을 해요. 어디에나 '빅 브라더'의 감시 화면이 있어요. 윈스턴은 일기를 쓰며 체제에 의문을 품고 동료 줄리아와 사랑에 빠져요. 그러나 두 사람은 사상경찰에게 붙잡히고 101호실에서 고문을 받아요. 결국 윈스턴은 저항을 잃고 빅 브라더를 사랑하게 돼요.|1949년 출간됐어요. 빅 브라더, 이중사고, 신어 등의 개념이 널리 쓰여요.
데미안|헤르만 헤세는 1877년생 독일 출신의 작가로 1946년 노벨 문학상을 받았어요.|싱클레어는 밝은 세계와 어두운 세계 사이에서 갈등하는 소년이에요. 불량 소년 크로머에게 협박당하다가 전학생 데미안의 도움으로 벗어나요. 데미안은 카인과 아벨을 새롭게 해석해 싱클레어에게 기존의 가치관을 의심하게 해요. 청년이 된 싱클레어는 방황하다가 데미안과 그 어머니 에바 부인을 다시 만나요. 전쟁 중 부상당한 싱클레어는 데미안의 모습에서 자기 자신을 발견해요.|1919년 에밀 싱클레어라는 필명으로 발표됐어요. 새는 알에서 나오려고 투쟁한다는 구절이 유명해요.
수레바퀴 아래서|헤르만 헤세는 1877년생 독일 출신의 작가예요.|시골 소년 한스 기벤라트는 뛰어난 재능으로 신학교 시험에 합격해요. 주변의 기대와 억압적 교육 속에서 그는 공부에 짓눌려요. 신학교에서 자유로운 친구 하일너를 만나 마음이 흔들리고 성적이 떨어져요. 결국 정신적으로 지쳐 학교를 떠나 고향으로 돌아와요. 기계공으로 일하려 하지만 적응하지 못하고 비극적 최후를 맞아요.|1906년 발표됐고 저자 자신의 신학교 경험이 바탕이에요. 작품에 자살을 암시하는 결말이 있어 읽을 때 주의가 필요해요.
호밀밭의 파수꾼|J. D. 샐린저는 1919년생 미국의 작가예요.|열여섯 살 홀든 콜필드는 펜시 고등학교에서 퇴학당해요. 그는 기숙사를 떠나 뉴욕을 떠돌며 어른들의 위선에 환멸을 느껴요. 옛 선생님을 찾아가고 여동생 피비를 만나요. 홀든은 낭떠러지 근처 호밀밭에서 뛰노는 아이들이 떨어지지 않게 지켜 주는 파수꾼이 되고 싶다고 말해요. 회전목마를 타는 피비를 보며 그는 조금씩 마음을 가라앉혀요.|1951년 출간됐어요. 사춘기의 불안과 순수를 그린 성장소설이에요.
앵무새 죽이기|하퍼 리는 1926년생 미국 앨라배마주 출신의 작가예요.|1930년대 미국 남부 마을에서 어린 스카웃은 변호사 아버지 애티커스, 오빠 젬과 함께 살아요. 애티커스는 백인 여성을 폭행했다는 누명을 쓴 흑인 청년 톰 로빈슨을 변호해요. 재판에서 그는 톰의 무죄를 분명히 보여 주지만 배심원들은 유죄 평결을 내려요. 톰은 결국 목숨을 잃어요. 한편 이웃의 은둔자 부 래들리는 위험에 빠진 아이들을 구해 줘요.|1960년 출간돼 퓰리처상을 받았어요. 인종 차별과 정의를 다루며 폭력적인 장면이 일부 있어요.
위대한 개츠비|F. 스콧 피츠제럴드는 1896년생 미국의 작가예요.|1920년대 뉴욕 롱아일랜드에서 화자 닉 캐러웨이는 이웃의 부자 개츠비를 알게 돼요. 개츠비는 호화로운 파티를 열지만 사실 옛 연인 데이지를 되찾으려는 목적이었어요. 데이지는 이미 톰 뷰캐넌과 결혼한 상태였어요. 개츠비와 데이지는 재회하지만 사고와 오해가 겹쳐 비극이 일어나요. 개츠비는 결국 외롭게 죽고 장례식에는 거의 아무도 오지 않아요.|1925년 출간됐고 '아메리칸 드림'의 허상을 그려 냈다고 평가돼요.
변신|프란츠 카프카는 1883년생 프라하 출신의 작가예요.|외판원 그레고르 잠자는 어느 아침 거대한 벌레로 변해 있는 자신을 발견해요. 가족은 처음에는 놀라고 돌보지만 점점 그를 짐스럽게 여겨요. 그가 돈을 벌 수 없게 되자 가족은 각자 일을 시작해요. 아버지는 던진 사과로 그레고르에게 상처를 입혀요. 결국 그레고르는 쓸쓸히 죽고 가족은 홀가분한 마음으로 새 삶을 계획해요.|1915년 발표됐어요. 소외와 가족 관계를 다룬 부조리 문학의 대표작이에요.
이방인|알베르 카뮈는 1913년생 프랑스의 작가로 1957년 노벨 문학상을 받았어요.|알제리에 사는 뫼르소는 어머니의 장례식에서 눈물을 흘리지 않고 다음 날 연인과 해수욕을 가요. 이웃 레몽의 일에 휘말려 뜨거운 햇볕 아래 해변에서 아랍인을 총으로 쏴 죽여요. 재판에서 검사는 그가 어머니의 죽음에 무관심했다는 점을 부각해 비정한 사람으로 몰아요. 뫼르소는 사형을 선고받아요. 감옥에서 그는 죽음을 앞두고 삶의 부조리를 받아들이며 세상의 무관심에 마음을 열어요.|1942년 출간됐어요. 부조리 문학의 대표작이에요.
프랑켄슈타인|메리 셸리는 1797년생 영국의 작가예요.|젊은 과학자 빅터 프랑켄슈타인은 시체를 이어 붙여 생명을 불어넣는 데 성공해요. 그러나 그는 괴물의 흉측한 모습에 놀라 그를 버려요. 괴물은 세상에서 외면당하며 외로움과 분노를 느끼고 빅터의 가족에게 복수해요. 괴물은 자신의 짝을 만들어 달라고 요구하지만 빅터는 이를 거부해요. 두 사람은 북극까지 서로를 쫓다가 비극적 결말을 맞아요.|1818년 출간됐어요. 과학 기술의 윤리와 책임을 묻는 SF의 선구작이에요.
오만과 편견|제인 오스틴은 1775년생 영국의 작가예요.|베넷 가의 둘째 딸 엘리자베스는 영리하고 당당한 아가씨예요. 이웃에 부유한 빙리와 친구 다아시가 이사 와요. 엘리자베스는 다아시의 오만한 태도에 반감을 갖고 위컴의 말을 믿어 오해해요. 다아시의 청혼을 거절하지만 편지를 통해 진실을 알고 자신의 편견을 돌아봐요. 오해가 풀리고 두 사람은 사랑으로 맺어져요.|1813년 출간됐고 당시 결혼과 신분 제도를 위트 있게 그려요.
레미제라블|빅토르 위고는 1802년생 프랑스의 작가예요.|빵 한 조각을 훔친 죄로 19년 옥살이를 한 장발장은 미리엘 주교의 자비를 만나 새 삶을 결심해요. 그는 시장이 되어 사람들을 돕지만 형사 자베르가 그의 정체를 쫓아요. 장발장은 불쌍한 여인 팡틴의 딸 코제트를 맡아 키워요. 코제트는 청년 마리우스와 사랑에 빠지고 장발장은 1832년 파리 6월 봉기에서 마리우스를 구해요. 자베르는 장발장을 놓아주고 갈등 끝에 스스로 생을 마감해요.|1862년 출간됐어요. 사회적 불평등과 구원, 자비를 다룬 대작이에요.
사람은 무엇으로 사는가|레프 톨스토이는 1828년생 러시아의 작가예요.|가난한 구두장이 시몬은 길가에서 벌거벗고 떨고 있는 청년 미하일을 집으로 데려가요. 시몬의 아내 마트료나는 처음에는 화를 내지만 곧 그를 받아들여요. 미하일은 구두 만드는 솜씨가 뛰어나 곧 마을에서 유명해져요. 부유한 신사가 찾아와 구두를 주문하고 또 쌍둥이 아이를 데려온 여인이 나타나는 사건을 겪으며 미하일의 정체가 드러나요. 그는 하느님에게 벌을 받은 천사였고 사람에게 사랑이 있다는 것을 깨달아요.|1881년 발표된 민화풍 단편이에요.
태평천하|채만식은 1902년생 소설가로 풍자 문학의 대가예요.|일제강점기 윤 직원 영감은 고리대금업으로 큰 부를 쌓은 지주예요. 그는 일제 덕분에 태평천하를 누린다며 만족해해요. 집안에서는 손자와 며느리들이 방탕하고 갈등이 끊이지 않아요. 윤 직원은 손자가 경찰서장이 되기를 바라지만 손자 종학이 사회주의 운동에 가담했다는 소식을 듣고 크게 절망해요. 그는 '이런 태평천하에 불한당 같은 놈'이라며 탄식해요.|1938년 발표됐어요. 판소리 사설 같은 문체로 친일 지주를 풍자해요.
날개|이상은 1910년생 시인이자 소설가로 모더니즘 문학을 대표해요.|주인공 '나'는 아내의 방 건너 어두운 방에서 하루 종일 지내는 무기력한 인물이에요. 아내는 낮에 손님을 받고 '나'에게 돈을 주며 관심이 없어요. 어느 날 외출해 거리를 걷다 돌아와 아내의 매춘 현장을 보고 충격을 받아요. 아내가 준 수면제를 먹고 오래 잠든 뒤 아내가 자신을 죽이려 했나 의심하기도 해요. 마지막에 그는 미쓰코시 백화점 옥상에서 '날개야 다시 돋아라. 날자, 날자, 날자꾸나'를 외쳐요.|1936년 발표된 의식의 흐름 기법의 대표작이에요.
서울, 1964년 겨울|김승옥은 1941년생 소설가예요.|서울 선술집에서 대학원생 '나'와 구청 직원 안, 그리고 처음 보는 가난한 아저씨가 만나 대화를 나눠요. 두 청년은 소소한 일상의 사소한 관찰을 주고받으며 무의미한 이야기를 이어가요. 아저씨는 아내의 시신을 병원에 팔고 받은 돈을 쓰고 싶다며 함께 있어 달라고 부탁해요. 아저씨는 밤새 돈을 쓰다가 여관에서 자살해요. 두 청년은 책임을 느끼고 도망치듯 헤어져요.|1965년 발표됐어요. 소외된 현대인의 모습을 그렸고 죽음 장면이 있어 읽을 때 주의가 필요해요.
오발탄|이범선은 1920년생 소설가예요.|해방촌에서 가난하게 사는 송철호는 계리사 사무실의 서기로 일해요. 어머니는 '가자'는 말만 되풀이하며 정신이 온전치 않고 동생 영호는 제대 후 양공주가 된 여동생과 함께 나쁜 길로 빠져요. 아내는 병으로 세상을 떠나고 철호는 치통을 참다가 이를 빼요. 돈이 없어 택시를 탄 철호는 갈 곳을 몰라 방황해요. 그는 자신이 목적지를 잃은 오발탄 같다고 느껴요.|1959년 발표됐고 전후 한국 사회의 궁핍과 절망을 그려요.
삼포 가는 길|황석영은 1943년생 소설가예요.|겨울 눈길에서 막노동꾼 영달과 교도소에서 출소한 정 씨가 우연히 길동무가 돼요. 둘은 길에서 술집 작부 백화를 만나 함께 걸어요. 정 씨는 고향 삼포로 가는 길이라며 마음이 들떠 있어요. 영달은 백화를 기차역까지 바래다주고 헤어져요. 삼포가 공사로 모습이 바뀌었다는 말을 듣고 정 씨는 허탈해해요.|1973년 발표됐고 산업화 시대 뿌리 뽑힌 사람들의 이야기를 담아요.
비 오는 날|손창섭은 1922년생 소설가예요.|장마철 비 오는 날 동욱과 동옥 남매는 무너져 가는 집에서 살아요. 동욱은 우울한 날이면 이 집에 머물며 괴로워하는 무기력한 인물이에요. 동옥은 장애가 있고 돈을 벌기 위해 노력하지만 오빠를 원망해요. 어느 날 동욱은 아무 일도 못 하는 처지를 한탄하며 비 속에 멍하니 앉아 있어요. 비가 그치지 않아 고통스러운 분위기가 이어져요.|1953년 발표됐고 전쟁 직후 인간의 불안과 무력감을 보여 줘요.
토지|박경리는 1926년생 소설가예요. 25년에 걸쳐 이 대하소설을 완성했어요.|이 작품은 5부 20권에 이르는 대하소설이라 큰 줄기로 소개해요. 경남 하동 평사리의 최 참판댁이 몰락하는 과정에서 서희가 어린 나이에 집안을 이끌어요. 서희는 간도로 건너가 재산을 모으고 고향으로 돌아와 가문을 되찾아요. 조준구와 얽힌 갈등, 길상과의 사랑 같은 개인사가 이어져요. 이야기는 동학 농민 운동부터 1945년 광복까지 한국 근현대사와 함께 펼쳐져요.|1969년 연재를 시작해 1994년 완결했어요.
금오신화|김시습은 1435년생 조선 초기의 학자이자 문인이에요.|이 작품은 다섯 편의 한문 단편 소설을 모은 책이에요. 「만복사저포기」는 양생이 귀신이 된 여인과 사랑을 나누는 이야기예요. 「이생규장전」은 홍건적 난으로 죽은 아내가 귀신으로 돌아와 이생과 다시 사랑하는 이야기예요. 「취유부벽정기」는 홍생이 선녀와 만나는 이야기이고 「남염부주지」와 「용궁부연록」도 신비로운 세계를 다뤄요. 이야기 속 비극적 결말에는 현실에 대한 비판이 담겨 있어요.|15세기에 쓰였고 한국 최초의 한문 소설로 알려져 있어요.
한중록|혜경궁 홍씨는 1735년생 조선 영조 때 사도세자의 비이자 정조의 어머니예요.|이 책은 궁중 수필이라 줄거리 대신 구성으로 소개해요. 혜경궁 홍씨는 어린 나이에 궁에 들어와 세자빈으로 살아온 삶을 회고해요. 남편 사도세자가 뒤주에 갇혀 죽은 임오화변의 비극을 자세히 서술해요. 친정 집안의 입장을 변호하려는 의도도 담겨 있어요. 손자 순조를 위해 쓴 글이라 전해져요.|1795년부터 1805년 무렵까지 여러 차례에 걸쳐 쓰였어요. 궁중 문학의 대표작이에요.
열하일기|박지원은 1737년생 조선 후기의 실학자예요.|이 책은 여행기라 줄거리 대신 구성으로 소개해요. 1780년 박지원은 청나라 건륭제의 칠순 잔치에 가는 사절단을 따라 압록강을 건너 열하까지 가요. 그는 청나라의 문물과 풍속, 수레, 벽돌 등 실용적인 기술에 관심을 가져요. 중간중간 「호질」, 「허생전」 같은 이야기가 실려 있어요. 양반의 허세를 풍자하고 이용후생을 강조해요.|청의 문물을 배우자는 북학 사상을 담고 있어요.
논어|공자는 기원전 551년경 노나라에서 태어난 사상가로 유교의 시조예요.|이 책은 어록이라 줄거리 대신 구성으로 소개해요. 제자들이 공자와 그 제자들의 말과 행동을 모아 엮었어요. 인, 예, 효, 학문, 군자 같은 개념이 반복해서 나와요. '배우고 때때로 익히면 즐겁지 아니한가'로 시작해요. 20편으로 이루어져 있어요.|유교 경전인 사서의 하나예요.
맹자|맹자는 기원전 372년경 태어난 전국시대의 유가 사상가예요.|이 책은 어록이라 줄거리 대신 구성으로 소개해요. 맹자와 제후, 제자들과의 대화를 기록해요. 사람은 본래 선하다는 성선설과 인의 정치를 주장해요. 백성을 귀하게 여기고 임금은 가볍게 여긴다는 민본 사상이 유명해요. 우물에 빠지려는 아이를 보면 누구나 측은한 마음이 든다는 비유로 사단을 설명해요.|사서의 하나로 7편으로 이루어져 있어요.
도덕경|노자는 춘추시대 말기의 사상가로 도가의 시조로 알려져 있어요. 생애는 분명하지 않아요.|이 책은 짧은 시구 형식이라 줄거리 대신 구성으로 소개해요. 도는 말로 설명할 수 없는 만물의 근원이라고 말해요. 인위적으로 하지 않고 자연스럽게 따르는 무위자연을 강조해요. 물처럼 낮은 곳에 머무르며 다투지 않는 것이 가장 좋다고 해요. 모두 81장으로 이루어져 있고 분량이 짧아요.|도가 사상의 가장 중요한 경전이에요.
손자병법|손무는 춘추시대 말기 제나라 출신으로 병법가예요.|이 책은 병법서라 줄거리 대신 구성으로 소개해요. 모두 13편으로 전쟁의 계획, 전략, 지형, 첩보 등을 다뤄요. '싸우지 않고 이기는 것이 최선'이라고 강조해요. '지피지기면 백전불태'라는 구절이 가장 널리 알려져 있어요. 속임수와 기만, 신속함도 승리의 요소로 이야기해요.|기원전 5세기경 쓰인 것으로 전해져요.
수호지|시내암은 14세기 중국 원말 명초의 작가로 알려져 있어요.|송나라 말기 부패한 관리들에게 쫓긴 영웅호걸들이 양산박에 모여들어요. 두목 송강을 중심으로 108명의 호걸이 의기투합해 부정한 관리를 벌하고 약자를 도와요. 임충, 노지심, 무송 같은 인물의 개성 있는 일화가 이어져요. 이들은 조정의 부름을 받고 귀순해 외적과 반란군을 토벌해요. 그러나 간신들의 모함으로 대부분 비극적인 최후를 맞아요.|중국 4대 기서의 하나예요. 작가에 대해서는 다른 의견도 있어요.
아Q정전|루쉰은 1881년생 중국의 작가로 근대 중국 문학의 아버지로 불려요.|아Q는 마을에서 날품팔이로 사는 가난한 사람이에요. 그는 놀림과 구타를 당해도 마음속으로 이겼다고 믿는 '정신 승리법'으로 현실을 외면해요. 혁명이 일어났다는 소식에 신나서 혁명당에 참여하려 하지만 거절당해요. 그러던 중 조씨 집 도난 사건에 휘말려 억울하게 붙잡혀요. 아Q는 영문도 모른 채 처형되고 구경하던 사람들은 무관심해요.|1921년 발표됐어요. 당시 중국인의 비굴함과 무지를 비판해요.
햄릿|윌리엄 셰익스피어는 1564년생 영국의 극작가예요.|덴마크 왕자 햄릿은 아버지가 돌아가신 뒤 숙부 클로디어스가 왕이 되고 어머니와 결혼한 것에 괴로워해요. 아버지의 유령이 나타나 숙부가 자신을 독살했다고 말해요. 햄릿은 복수를 망설이며 미친 척해요. 연인 오필리아는 아버지가 죽은 충격으로 미쳐 죽고 햄릿은 연극을 통해 숙부의 죄를 확인해요. 마지막 결투에서 독이 퍼지며 햄릿과 클로디어스, 왕비가 모두 죽어요.|1600년 무렵 쓰인 4대 비극의 하나로 'To be, or not to be'가 유명해요.
로미오와 줄리엣|윌리엄 셰익스피어의 희곡이에요. 셰익스피어는 1564년생 영국의 극작가예요.|이탈리아 베로나의 두 명문가 몬터규와 캐풀렛은 오랜 원수예요. 몬터규 가의 로미오는 가면무도회에서 캐풀렛 가의 줄리엣을 만나 사랑에 빠져요. 두 사람은 몰래 결혼하지만 로미오가 줄리엣의 사촌을 죽여 추방돼요. 줄리엣은 죽은 것처럼 보이는 약을 먹지만 로미오는 이 소식을 잘못 듣고 독약을 먹고 죽어요. 깨어난 줄리엣도 단검으로 자결하고 두 가문은 화해해요.|1595년 무렵 쓰였어요. 젊은 연인의 죽음이 나오므로 읽을 때 주의가 필요해요.
맥베스|윌리엄 셰익스피어의 희곡이에요.|스코틀랜드의 장군 맥베스는 전투에서 돌아오는 길에 마녀들을 만나 왕이 될 것이라는 예언을 들어요. 아내의 부추김에 그는 덩컨 왕을 살해하고 왕위에 올라요. 이후 불안감에 시달린 그는 친구 뱅코까지 죽이려 해요. 맥베스 부인은 죄책감에 잠을 못 이루고 몽유병을 앓다 죽어요. 결국 맥더프가 이끄는 군대가 쳐들어와 맥베스는 목숨을 잃어요.|1606년 무렵 쓰인 4대 비극의 하나예요.
리어왕|윌리엄 셰익스피어의 희곡이에요.|늙은 브리튼 왕 리어는 왕국을 세 딸에게 나눠 주기로 하고 누가 자신을 가장 사랑하는지 물어요. 첫째와 둘째는 아첨하지만 막내 코딜리아는 솔직하게 답해 쫓겨나요. 왕국을 얻은 두 딸은 리어를 홀대하고 내쫓아요. 폭풍우 속에서 광인이 된 리어는 진실을 깨닫지만 프랑스로 간 코딜리아와 재회한 뒤 전쟁에서 패해요. 코딜리아가 처형당하자 리어는 슬픔 속에 숨을 거둬요.|1606년 무렵 쓰인 4대 비극의 하나예요.
파우스트|요한 볼프강 폰 괴테는 1749년생 독일의 문호예요.|학문에 지친 노학자 파우스트는 악마 메피스토펠레스와 계약을 맺어요. 파우스트가 만족해서 '멈춰라, 너는 정말 아름답다'고 말하는 순간 그의 영혼을 갖겠다는 내용이에요. 파우스트는 젊음을 되찾고 소녀 그레트헨을 사랑하지만 그녀는 비극적인 최후를 맞아요. 이후 그는 황제를 돕고 큰 사업에 몰두해요. 마지막에는 인류를 위한 간척 사업을 꿈꾸며 만족을 느끼고 쓰러지지만 천사들이 영혼을 구원해요.|1부는 1808년, 2부는 1832년에 출간됐어요.
젊은 베르테르의 슬픔|요한 볼프강 폰 괴테는 1749년생 독일의 문호예요.|청년 베르테르는 시골 마을에서 로테를 만나 사랑에 빠져요. 로테에게는 이미 약혼자 알베르트가 있어요. 그는 고통을 이기지 못하고 떠나지만 다시 돌아와 괴로워해요. 로테와 알베르트가 결혼한 뒤 베르테르는 절망에 빠져요. 결국 그는 알베르트에게 빌린 권총으로 스스로 생을 마감해요.|1774년 출간된 서간체 소설이에요. 자살을 다루고 있어 읽을 때 마음이 힘들다면 신뢰할 수 있는 사람과 이야기하세요.
돈키호테|미겔 데 세르반테스는 1547년생 스페인의 작가예요.|시골 귀족 알론소 키하노는 기사 소설에 빠져 자신을 돈키호테라 부르며 모험을 떠나요. 이웃 산초 판사를 종자로 삼고 풍차를 거인으로 착각해 달려들어요. 그는 이상적인 여인 둘시네아를 위해 싸우지만 번번이 망신을 당해요. 여러 사건을 겪은 뒤 고향으로 돌아온 그는 병이 들어 정신을 되찾아요. 기사의 꿈을 버리고 알론소 키하노로 죽음을 맞이해요.|1605년과 1615년 두 부로 나왔어요. 근대 소설의 시초로 꼽혀요.
폭풍의 언덕|에밀리 브론테는 1818년생 영국의 작가예요.|요크셔 황야의 외딴집 워더링 하이츠에 주인이 거둔 고아 히스클리프가 자라요. 그는 주인의 딸 캐서린과 깊은 사랑에 빠지지만 신분 차이로 이루어지지 못해요. 캐서린이 부유한 에드거 린턴과 결혼하자 히스클리프는 집을 떠나요. 부자가 되어 돌아온 그는 두 집안에 복수해요. 세월이 흘러 다음 세대에서 갈등이 풀려요.|1847년 출간됐어요. 격정적인 사랑과 복수를 다룬 작품이에요.
제인 에어|샬럿 브론테는 1816년생 영국의 작가예요.|고아 제인 에어는 숙모 집에서 학대받다가 기숙학교로 가요. 졸업 후 손필드 저택의 가정교사가 되어 주인 로체스터와 사랑에 빠져요. 두 사람의 결혼식 날 로체스터에게 이미 아내가 있다는 사실이 밝혀져요. 제인은 저택을 떠나 방랑하다 세인트 존 가족에게 도움받아요. 그녀는 손필드로 돌아가 눈이 멀고 몸이 상한 로체스터와 재회하고 결혼해요.|1847년 출간됐고 여성의 독립과 자존을 그린 작품이에요.
안나 카레니나|레프 톨스토이는 1828년생 러시아의 작가예요.|귀족 부인 안나는 모스크바에서 오빠 부부를 돕다가 청년 장교 브론스키를 만나요. 두 사람은 사랑에 빠지고 안나는 남편 카레닌을 떠나 사교계의 비난을 받아요. 브론스키와 함께 살지만 그의 사랑이 식는다고 의심하며 불안해해요. 한편 레빈과 키티는 시련 끝에 결혼해 소박한 삶의 의미를 찾아가요. 절망에 빠진 안나는 기차에 몸을 던져요.|1877년 완성됐어요. 안나의 최후 장면이 비극적이라 읽을 때 주의가 필요해요.
부활|레프 톨스토이는 1828년생 러시아의 작가예요.|귀족 청년 네흘류도프는 배심원으로 참석한 재판에서 창녀 카튜샤 마슬로바를 보고 놀라요. 그녀는 과거 자신이 유혹하고 버린 하녀였어요. 그는 그녀가 억울하게 유죄 판결을 받은 것에 책임을 느끼고 구제하려 해요. 시베리아 유형길에 따라가며 그는 사회의 불의와 자신의 위선을 깨달아요. 카튜샤는 그의 청혼을 거절하지만 두 사람은 정신적으로 새롭게 태어나요.|1899년 발표됐고 톨스토이의 사회 비판 의식이 잘 드러나요.
모비 딕|허먼 멜빌은 1819년생 미국의 작가예요.|청년 이스마엘은 포경선 피쿼드호에 오르게 돼요. 선장 에이해브는 과거 자신의 다리를 앗아간 흰 고래 모비 딕에게 복수하려는 집념에 사로잡혀 있어요. 선원들은 고래를 쫓아 전 세계 바다를 항해해요. 마침내 모비 딕을 만나 사흘간의 사투가 벌어져요. 배는 침몰하고 이스마엘만 살아남아요.|1851년 출간됐고 고래잡이 지식과 철학이 함께 담겨 있어요.
주홍 글씨|너새니얼 호손은 1804년생 미국의 작가예요.|17세기 청교도 사회 보스턴에서 헤스터 프린은 남편 없이 아이를 낳아 가슴에 간통을 뜻하는 주홍색 A자를 달고 살아요. 그녀는 아이 아버지의 이름을 끝내 밝히지 않아요. 아이의 아버지는 존경받는 목사 딤스데일이었고 그는 죄책감에 시달려요. 헤스터의 남편 칠링워스는 정체를 숨기고 복수를 꾀해요. 딤스데일은 결국 공개적으로 죄를 고백하고 숨을 거둬요.|1850년 출간됐어요. 죄와 위선, 용서를 다뤄요.
화씨 451|레이 브래드버리는 1920년생 미국의 SF 작가예요.|책을 불태우는 일을 하는 소방관 가이 몬태그는 아내와 무의미한 삶을 살아요. 이웃 소녀 클라리스를 만나 삶에 대해 생각하게 돼요. 그는 몰래 책을 읽기 시작하고 상관 비티와 갈등해요. 결국 도망자가 되어 책의 내용을 외워 전하는 사람들과 합류해요. 전쟁으로 도시가 파괴되자 그들은 새 사회를 세우려 해요.|1953년 출간됐고 화씨 451도는 종이가 불붙는 온도로 알려져 있어요.
분노의 포도|존 스타인벡은 1902년생 미국의 작가로 1962년 노벨 문학상을 받았어요.|1930년대 오클라호마 소작농 조드 일가는 가뭄과 은행 때문에 땅을 잃어요. 그들은 낡은 트럭을 타고 캘리포니아로 향하는 서부 이주 행렬에 합류해요. 길에서 할아버지와 할머니가 돌아가시고 가족은 점점 흩어져요. 캘리포니아에서도 값싼 노동력으로 착취당하고 굶주림에 시달려요. 마지막 장면에서 로저샨은 굶어 죽어 가는 남자에게 젖을 물려요.|1939년 출간돼 퓰리처상을 받았어요.
삼대|염상섭은 1897년생 소설가예요.|서울의 부유한 조씨 집안에서 할아버지 조 의관, 아버지 조상훈, 손자 조덕기의 삼대가 갈등해요. 할아버지는 봉건적 가치관으로 집안을 지키려 하고 아버지는 기독교 신자지만 방탕해요. 덕기는 두 사람 사이에서 균형을 잡으려 해요. 한편 홍경애, 김병화와 얽힌 사건이 이어지며 집안의 재산 문제로 갈등이 커져요. 할아버지가 죽은 뒤 덕기는 상속과 사회 문제를 고민해요.|1931년 연재된 한국 근대 소설의 대표작이에요.
만세전|염상섭은 1897년생 소설가예요.|일본 유학생 이인화는 아내가 위독하다는 전보를 받고 3·1 운동 직전에 조선으로 돌아와요. 시모노세키에서 부산, 김천, 서울로 이어지는 길에서 그는 일본 경찰의 감시와 조선인의 비참한 모습을 목격해요. 아내는 그가 도착한 뒤 얼마 되지 않아 세상을 떠나요. 장례를 치른 뒤 그는 다시 일본으로 떠나요. 식민지 현실에 대한 환멸이 짙게 드러나요.|1922년 발표됐고 원제는 『묘지』였어요.
레디메이드 인생|채만식은 1902년생 소설가예요.|일제강점기 고등교육을 받은 P는 일자리를 구하지 못해 가난하게 살아요. 그는 신문사에서 일할 기회를 얻지 못하고 거리를 떠돌아요. 어린 아들 창선을 인쇄소 견습공으로 보내기로 결심해요. 지식인 자신의 처지를 '기성품 인생', 곧 레디메이드 인생이라고 자조해요. 아들에게는 같은 길을 걷게 하지 않겠다는 의지를 보여 줘요.|1934년 발표됐어요. 식민지 지식인의 실업 문제를 풍자해요.
화수분|전영택은 1894년생 소설가이자 목사예요.|가난한 화수분 부부는 아이들을 먹이기 어려워 큰딸 귀동을 남의 집에 보내요. 화수분은 형의 병 소식에 고향으로 가고 아내는 추위 속에서 아이를 안고 남편을 찾아 나서요. 눈보라가 치는 겨울 산길에서 두 사람은 아이를 사이에 두고 얼어붙은 채 발견돼요. 아이는 부모의 품 안에서 살아 있었어요. 이야기는 어린 생명의 힘을 암시하며 끝나요.|1925년 발표됐어요. 가난으로 인한 비극을 그려요.
순이 삼촌|현기영은 1941년 제주 출신의 소설가로 제주 4·3을 문학으로 알린 작가예요.|서울에 사는 '나'는 오랜만에 고향 제주에 내려가 제사에 참석해요. 제사 자리에서 어른들은 1949년 겨울 북촌리에서 있었던 학살 이야기를 꺼내요. 순이 삼촌은 그 사건에서 살아남았지만 가족을 잃고 평생 그 기억에 시달리다 결국 자살에 이르러요. '나'는 순이 삼촌의 삶을 되짚으며 4·3의 진실과 마주해요. 작품은 오랫동안 숨겨진 역사의 아픔을 증언해요.|1978년 발표됐고 한때 금서가 됐어요. 학살과 자살 장면이 있어 읽을 때 마음의 준비가 필요해요.
아홉 켤레의 구두로 남은 사내|윤흥길은 1942년생 소설가예요.|교사인 '나'는 셋방에 이사 온 권 씨를 만나요. 권 씨는 대학을 나온 지식인이지만 철거민으로 쫓겨난 사연이 있고 아홉 켤레의 구두를 정성스럽게 닦으며 자존심을 지키려 해요. 광주 대단지 사건에 휘말려 감옥에 갔다 온 권 씨는 생활고에 시달려요. 아내가 아이를 낳을 때 병원비가 없어 어쩔 줄 몰라 해요. 결국 그는 강도를 저지르려다 실패하고 자취를 감춰요.|1977년 발표됐고 산업화 속 소시민의 자존심을 그려요.
흰 종이 수염|하근찬은 1931년생 소설가예요.|국민학교 교사인 동길은 전쟁 중 팔을 잃은 아버지를 부끄러워하기도 하고 안쓰러워하기도 해요. 학예회 날 연극에서 아버지 역을 하게 된 동길은 아버지가 대신 나서 주기를 원해요. 아버지는 아들을 위해 연극에 등장해 흰 종이로 만든 수염을 달고 연기해요. 관객들은 팔이 없는 아버지를 보고 박수를 쳐요. 동길은 아버지에게 고마움과 미안함을 느껴요.|1959년 발표됐어요. 전쟁이 남긴 상처와 가족애를 다뤄요.
관동별곡|정철은 1536년생 조선 시대 문인으로 호는 송강이에요.|이 작품은 가사라 줄거리 대신 구성으로 소개해요. 강원도 관찰사로 임명된 정철이 금강산과 관동 팔경을 유람하며 읊은 기행 가사예요. 임금의 명을 받고 길을 떠나 금강산 비로봉과 총석정, 삼일포 등을 지나 경포대에 이르러요. 풍경의 아름다움 속에서 신선이 된 듯한 흥을 노래하다가 꿈에 신선을 만나 술을 나누는 장면으로 끝나요. 이후 백성을 위해 나라의 은혜를 펴겠다는 다짐이 이어져요.|1580년 쓰였어요. 한글 가사 문학의 대표작이에요.
용비어천가|정인지 등이 세종의 명을 받아 지은 악장이에요.|이 작품은 악장이라 줄거리 대신 구성으로 소개해요. 모두 125장으로 이루어져 조선 건국의 정당성을 노래해요. 육조, 곧 목조에서 태조까지의 업적과 천명을 받았다는 점을 강조해요. 해동 육룡이 나르샤로 시작하는 1장이 유명해요. 마지막 부분에서는 후대의 왕에게 경계를 당부해요.|1445년 완성되어 1447년 간행됐어요. 훈민정음으로 지은 최초의 작품이에요.
운영전|작자 미상의 한문 소설이에요.|안평대군의 궁궐에 사는 궁녀 운영은 시를 지으러 온 선비 김 진사와 서로 사랑에 빠져요. 두 사람은 궁녀들의 도움으로 몰래 만나지만 비밀이 밝혀질 위기에 놓여요. 안평대군이 이를 알고 궁녀들을 벌하려 하자 운영은 스스로 목숨을 끊어요. 김 진사는 슬픔에 잠겨 있다가 세상을 떠나요. 이 이야기는 꿈속에서 유영이라는 선비가 두 영혼을 만나 전해 들은 것으로 되어 있어요.|17세기 초에 쓰인 것으로 알려져 있어요. 사랑과 자유를 억압한 궁중의 현실을 비판해요.
이춘풍전|작자 미상의 조선 후기 소설이에요.|이춘풍은 가산을 탕진하고 방탕한 생활을 하다 아내의 만류에도 장사를 하겠다며 평양으로 가요. 그러나 기생 추월에게 속아 가진 돈을 모두 잃고 노비 신세가 돼요. 이 소식을 들은 아내 김씨는 남장을 하고 평양 감사를 찾아가 비장이 돼요. 그녀는 추월을 혼내 재산을 되찾고 남편을 구해요. 이춘풍은 집으로 돌아와 아내에게 고개를 숙여요.|조선 후기 사회의 변화와 가부장제를 풍자해요.
규중칠우쟁론기|작자 미상의 조선 시대 가전체 수필이에요.|규방 부인의 일곱 벗인 자, 가위, 바늘, 실, 골무, 인두, 다리미가 서로 자기 공을 내세우며 다퉈요. 자는 길이를 재는 공이 크다고 하고 가위는 옷감을 자르는 일이 먼저라고 해요. 바늘, 실, 인두 등이 저마다 공을 주장하자 부인이 나타나 모두의 수고를 인정하지 않는 사람이라고 꾸짖어요. 다만 골무는 공을 내세우지 않고 조용히 있어서 부인에게 칭찬받아요. 결국 칠우는 각자의 위치에서 쓸모가 있음을 깨달아요.|18~19세기에 쓰인 것으로 추정돼요. 사물을 의인화해 인간 사회를 풍자해요.
조침문|유씨 부인은 조선 순조 때의 여성으로 알려져 있어요.|이 작품은 고전 수필이라 줄거리 대신 구성으로 소개해요. 오랫동안 쓰던 바늘이 부러지자 그 애통함을 제문 형식으로 쓴 글이에요. 바늘을 의인화해 '너'를 잃은 슬픔을 이야기해요. 함께한 세월, 바늘의 공로와 쓰임새를 회상하며 감사해요. 마지막에는 바늘의 죽음을 애도하며 영혼에게 제사를 올리는 형식으로 끝나요.|19세기 초에 쓰인 것으로 추정돼요. 제문의 형식을 빌려 유머와 애정을 담았어요.
국선생전|이규보는 1168년생 고려의 문인이에요.|술을 의인화한 국성, 곧 '국 선생'의 일생을 전기 형식으로 서술해요. 국성은 훌륭한 집안에서 태어나 어려서부터 인품이 맑아 나라에 쓰이게 돼요. 임금의 총애를 받아 높은 벼슬에 오르지만 지나치게 거만해지고 나라를 어지럽게 해요. 결국 국성은 벼슬에서 물러나 고향으로 돌아가요. 작가는 이를 통해 술의 유익과 폐해를 이야기하며 처신의 교훈을 전해요.|가전체 문학의 대표작으로 『동국이상국집』에 실려 있어요.
위대한 유산|찰스 디킨스는 1812년생 영국의 소설가예요.|고아 핍은 누나와 대장장이 조의 집에서 자라요. 어느 날 습지에서 도망친 죄수를 도와준 일이 있었어요. 이후 정체 모를 후원자가 나타나 핍은 런던에서 신사 교육을 받게 돼요. 핍은 도도한 에스텔라를 사랑하고 사실 자신의 후원자가 그 죄수였음을 알고 충격을 받아요. 갖가지 시련을 겪으며 핍은 진정한 가치를 깨닫고 조에게 감사해요.|1861년 출간됐고 신분 상승의 허영과 우정, 성장을 다뤄요.
두 도시 이야기|찰스 디킨스는 1812년생 영국의 소설가예요.|프랑스 혁명 시기 런던과 파리를 배경으로 이야기가 펼쳐져요. 18년간 바스티유에 갇혔던 마네트 박사는 딸 루시와 재회하고 영국으로 가요. 루시는 프랑스 귀족 출신의 찰스 다네이와 결혼해요. 다네이는 혁명 중 파리에서 붙잡혀 사형을 선고받아요. 다네이와 닮은 변호사 시드니 카턴이 그를 대신해 단두대에 올라요.|1859년 출간됐고 '최고의 시절이자 최악의 시절'로 시작하는 첫 문장이 유명해요.
테스|토머스 하디는 1840년생 영국의 소설가예요.|가난한 농가의 딸 테스는 부유한 친척 집에 일하러 갔다가 알렉에게 유린당해요. 아이를 낳았으나 아이는 곧 죽어요. 훗날 목사의 아들 엔젤 클레어를 만나 사랑에 빠져 결혼하지만 과거를 고백하자 엔젤은 그녀를 떠나요. 가난에 시달리던 테스는 알렉의 도움을 받다가 돌아온 엔젤과 재회해요. 절망한 테스는 알렉을 죽이고 도망치다 체포돼 처형당해요.|1891년 출간됐어요. 성적 폭력과 사회적 위선을 다뤄 읽을 때 마음의 준비가 필요해요.
노트르담의 꼽추|빅토르 위고는 1802년생 프랑스의 작가예요.|15세기 파리 노트르담 대성당의 종지기 콰지모도는 흉한 외모의 꼽추예요. 부주교 프롤로는 집시 무희 에스메랄다를 탐내다가 그녀를 위험에 빠뜨려요. 콰지모도는 처형당할 위기에 놓인 에스메랄다를 구해 성당에 숨겨 줘요. 시인 그랭구아르와 근위대장 페뷔스가 얽혀 사건이 이어지고 에스메랄다는 결국 사형당해요. 콰지모도는 그녀의 시신 옆에서 최후를 맞아요.|1831년 출간됐어요. 고딕 건축 보존 운동에도 영향을 줬어요.
삼총사|알렉상드르 뒤마는 1802년생 프랑스의 작가예요.|시골 청년 다르타냥은 아버지의 소개장을 들고 파리로 가서 왕실 근위대 삼총사를 만나요. 아토스, 포르토스, 아라미스와 함께 그는 왕비의 밀회를 둘러싼 음모를 막기 위해 영국으로 가요. 리슐리외 추기경과 밀레디가 꾸미는 계략에 맞서 목숨을 걸고 싸워요. 밀레디는 결국 처형당해요. '하나는 모두를 위해, 모두는 하나를 위해'라는 우정이 유명해요.|1844년 신문에 연재됐어요.
몬테크리스토 백작|알렉상드르 뒤마는 1802년생 프랑스의 작가예요.|젊은 선원 에드몽 당테스는 약혼을 앞두고 시기하는 이들의 모함으로 이프 성에 갇혀요. 옥중에서 만난 파리아 신부에게 학문과 보물에 대한 비밀을 전해 들어요. 14년 만에 탈출한 그는 보물을 찾아 몬테크리스토 백작이 되어 파리에 나타나요. 그는 자신을 배신한 세 사람에게 각각 어울리는 방식으로 복수해요. 그러나 복수의 대가를 깨달으며 용서와 희망을 이야기해요.|1844~1846년 연재됐어요.
이반 데니소비치의 하루|알렉산드르 솔제니친은 1918년생 러시아의 작가로 1970년 노벨 문학상을 받았어요.|1950년대 초 소련의 강제수용소에서 죄수 이반 데니소비치 슈호프의 하루가 그려져요. 새벽 기상, 혹한 속 노동, 얼마 되지 않는 식사, 점검이 반복돼요. 그는 벽돌 쌓는 일을 맡아 열심히 일하며 하루를 버텨요. 하루가 끝날 무렵 그는 오늘은 운이 좋은 날이었다고 생각해요. 그의 형기는 아직 3천 일 넘게 남아 있어요.|1962년 발표됐고 소련의 수용소 현실을 알린 작품이에요.
마담 보바리|귀스타브 플로베르는 1821년생 프랑스의 작가예요.|농부의 딸 엠마는 낭만적인 소설을 읽으며 꿈을 키우다 시골 의사 샤를 보바리와 결혼해요. 그러나 평범한 결혼 생활에 실망하고 로돌프, 레옹과 불륜을 저질러요. 사치와 빚에 시달리던 그녀는 고리대금업자 뢰르에게 몰려요. 돈을 구하지 못한 엠마는 독약을 삼키고 고통 속에서 죽어요. 샤를은 아내의 비밀을 알게 되고 슬픔 속에 세상을 떠나요.|1857년 출간됐고 사실주의 문학의 대표작이에요. 자살 장면이 있어 읽을 때 주의가 필요해요.
소송|프란츠 카프카는 1883년생 프라하 출신의 작가예요.|은행원 요제프 K는 서른 번째 생일 아침 영문도 모른 채 체포돼요. 그는 자신의 죄가 무엇인지 알지 못하고 재판 절차는 이해할 수 없게 돌아가요. 변호사와 화가, 여러 사람을 만나 도움을 구하지만 소용이 없어요. 성당에서 신부는 '법 앞에서' 이야기를 들려줘요. 결국 K는 서른한 번째 생일 전날 밤 두 남자에게 끌려가 처형당해요.|카프카 사후인 1925년 출간됐어요. 관료 제도의 부조리를 상징해요.
무기여 잘 있거라|어니스트 헤밍웨이는 1899년생 미국의 작가로 1954년 노벨 문학상을 받았어요.|제1차 세계대전 중 이탈리아군에서 구급차를 모는 미국인 프레더릭 헨리는 영국인 간호사 캐서린 바클리를 만나 사랑에 빠져요. 전선에서 부상을 입은 그는 병원에서 캐서린의 간호를 받아요. 이탈리아군이 퇴각하는 와중에 그는 탈영해 캐서린과 스위스로 도망쳐요. 캐서린은 출산 중 아이와 함께 목숨을 잃어요. 헨리는 빗속을 걸어 호텔로 돌아가요.|1929년 출간됐어요.
오이디푸스 왕|소포클레스는 기원전 496년경 태어난 고대 그리스의 비극 작가예요.|테베에 역병이 퍼지자 오이디푸스 왕은 선왕 라이오스를 죽인 자를 찾아 벌하겠다고 선언해요. 예언자 테이레시아스는 범인이 바로 오이디푸스라고 말하지만 왕은 믿지 못해요. 조사 과정에서 그는 자신이 어릴 때 버려진 라이오스의 아들임을 알게 돼요. 그는 아버지를 죽이고 어머니와 결혼했다는 신탁이 이루어졌음을 깨달아요. 이오카스테는 목을 매고 오이디푸스는 스스로 눈을 찔러 떠나요.|기원전 429년경 상연된 것으로 알려져 있어요.
안티고네|소포클레스는 고대 그리스의 비극 작가예요.|오이디푸스의 딸 안티고네의 오빠 폴리네이케스는 테베를 공격하다 죽어요. 새 왕 크레온은 그를 반역자로 규정해 매장을 금지해요. 안티고네는 가족의 도리와 신의 법을 따라 오빠를 묻고 붙잡혀요. 크레온은 그녀를 동굴에 가둬요. 예언자의 경고를 듣고 뒤늦게 마음을 돌리지만 안티고네는 목숨을 끊고, 그녀의 약혼자인 크레온의 아들 하이몬과 왕비도 죽어요.|기원전 441년경 상연됐어요. 국가의 법과 양심의 갈등을 다룬 작품이에요.
시라노|에드몽 로스탕은 1868년생 프랑스의 극작가예요.|검술과 시에 뛰어난 시라노는 큰 코 때문에 열등감을 갖고 있어요. 그는 사촌 록산을 사랑하지만 고백하지 못해요. 록산이 미남 병사 크리스티앙을 사랑하자 시라노는 그를 대신해 편지와 사랑의 말을 써 줘요. 전쟁터에서 크리스티앙이 죽은 뒤에도 시라노는 오랜 세월 침묵해요. 죽음을 앞두고 록산에게 진실이 밝혀져요.|1897년 초연된 희곡이에요. 정식 제목은 『시라노 드 베르주라크』예요.
고도를 기다리며|사뮈엘 베케트는 1906년생 아일랜드 출신의 극작가로 1969년 노벨 문학상을 받았어요.|시골길 한 그루 나무 아래서 블라디미르와 에스트라공이 고도라는 인물을 기다려요. 두 사람은 쓸데없는 대화와 행동으로 시간을 보내요. 포조와 럭키가 나타나지만 고도는 오지 않고 소년이 와서 오늘은 못 온다고 전해요. 이튿날에도 같은 상황이 반복돼요. 두 사람은 떠나자고 말하지만 움직이지 않아요.|1953년 초연된 부조리극의 대표작이에요.
세일즈맨의 죽음|아서 밀러는 1915년생 미국의 극작가예요.|평생 세일즈맨으로 일해 온 윌리 로먼은 나이가 들어 일을 잃고 현실과 환상 사이를 오가요. 그는 아들 비프에게 큰 기대를 걸었지만 비프는 아버지의 허상에 환멸을 느껴요. 동생 해피와 아내 린다는 가족을 지키려 애써요. 윌리는 가족에게 보험금을 남기려 자동차 사고로 목숨을 끊어요. 장례식에는 몇 사람만 참석해요.|1949년 초연돼 퓰리처상을 받았어요. 아메리칸 드림의 허상을 비판하며 자살 장면이 있어요.
욕망이라는 이름의 전차|테네시 윌리엄스는 1911년생 미국의 극작가예요.|몰락한 남부 귀족 여성 블랑슈 뒤부아는 동생 스텔라가 사는 뉴올리언스의 좁은 집으로 찾아와요. 스텔라의 남편 스탠리는 거칠고 직설적이라 블랑슈와 부딪혀요. 블랑슈는 과거를 숨기고 미첼과 새 출발하려 하지만 스탠리가 과거를 폭로해요. 블랑슈는 스탠리에게 폭행당하고 정신이 무너져요. 그녀는 병원에 끌려가며 '낯선 사람의 친절에 늘 의지해 왔다'고 말해요.|1947년 초연돼 퓰리처상을 받았어요. 폭력 장면이 나와요.
소설가 구보씨의 일일|박태원은 1909년생 소설가예요.|소설가 구보는 어느 날 오후 어머니의 잔소리를 뒤로하고 서울 거리로 나서요. 그는 종로, 광화문, 경성역, 다방 등을 돌며 길에서 만난 사람들을 관찰해요. 옛 연인을 떠올리고 친구를 만나며 현대인의 외로움과 허무를 느껴요. 신문사 취직과 결혼을 고민하지만 쉽게 결정하지 못해요. 새벽에 집으로 돌아오며 앞으로는 생활을 가지고 좋은 소설을 쓰겠다고 다짐해요.|1934년 발표됐어요. 도시 산책자의 시선을 보여 주는 모더니즘 소설이에요.
역마|김동리는 1913년생 소설가예요.|화개장터 주막집 옥화의 아들 성기는 역마살을 타고났다는 점괘 때문에 절에 보내져 자라요. 어느 날 체장수 영감이 딸 계연을 데려와 옥화네 주막에서 지내게 해요. 성기와 계연은 사랑에 빠지지만 옥화는 계연이 자신의 이복 동생임을 알게 돼요. 계연이 떠난 뒤 성기는 앓아눕다가 회복해요. 그는 엿판을 메고 길을 떠나 운명을 받아들여요.|1948년 발표됐고 토속적 분위기가 강해요.
무녀도|김동리는 1913년생 소설가예요.|경주 부근 마을에서 무당 모화는 벙어리 딸 낭이와 함께 살아요. 아들 욱이가 절에서 돌아오지만 기독교 신자가 되어 있어요. 모화는 아들이 귀신 들렸다고 생각하고 굿을 하며 맞서고 욱이는 어머니의 굿을 막으려 해요. 모화는 아들을 칼로 찌르고 불행한 일이 이어져요. 마지막에 모화는 물에 빠진 사람을 구하는 굿을 하다 스스로 물속으로 사라져요.|1936년 발표됐고 샤머니즘과 기독교의 충돌을 다뤄요.
병신과 머저리|이청준은 1939년생 소설가예요.|화가인 동생과 의사인 형이 등장해요. 형은 전쟁에서 겪은 일을 소설로 쓰고 있고 동생은 그 소설을 읽으며 형의 상처를 알게 돼요. 형은 수술이 실패해 소녀를 잃은 뒤 병원 문을 닫아요. 형의 소설 속 인물은 동료를 죽인 죄책감에 시달려요. 동생은 형의 아픔을 이해하면서 자신의 그림이 나아가지 못하는 이유를 돌아보게 돼요.|1966년 발표됐어요. 전쟁의 상처와 지식인의 고뇌를 다뤄요.
서편제|이청준은 1939년생 소설가예요.|이 작품은 연작 「남도 사람」의 한 부분을 담고 있어요. 소리꾼 아버지는 양녀로 들인 딸의 소리를 완성하려고 눈을 멀게 해요. 오라비는 그 일에 충격을 받고 집을 떠나요. 세월이 흘러 오라비는 누이를 찾아 헤매다 소릿길에서 그녀를 만나요. 남매는 말없이 소리와 북으로 서로를 확인하고 헤어져요. 한과 예술의 관계를 이야기해요.|1976년 발표됐어요. 1993년 임권택 감독의 영화로도 유명해요. 눈을 멀게 하는 장면이 있어요.
당신들의 천국|이청준은 1939년생 소설가예요.|소록도 병원의 새 원장 조백헌 대령은 나환자들이 사는 섬에 이상향을 세우겠다며 간척 사업을 추진해요. 주민들은 처음에는 열의를 보이지만 점차 불신이 커져요. 원장은 강제로 사업을 밀어붙이다 떠나고 몇 년 뒤 민간인 신분으로 돌아와요. 이상헌 보건과장과의 대화를 통해 지도자의 독단과 동상이 무엇인지 되돌아봐요. 진정한 천국은 위에서 주어지는 것이 아니라 함께 만드는 것이라는 메시지를 전해요.|1976년 발표됐어요.
그 여자네 집|박완서는 1931년생 소설가예요.|화자는 어린 시절 살던 동네의 '그 여자네 집'을 회상해요. 만득이는 이웃 처녀 곱단이를 짝사랑하고 곱단이도 그를 좋아해요. 일제강점기 말에 만득이는 징용되고 곱단이는 정신대로 끌려갈 것을 피하려 다른 사람과 결혼해요. 세월이 흐르고 분단과 전쟁으로 두 사람은 끝내 재회하지 못해요. 화자는 이 사랑의 아픔에 민족의 비극을 겹쳐 봐요.|2002년 발표된 단편이에요. 일제강점기 징용과 정신대 문제 속에서 이루어지지 못한 사랑을 다뤄요.
객지|황석영은 1943년생 소설가예요.|공사판 노동자들이 간척 공사장에서 일해요. 감독은 노동자들을 속이고 임금을 떼어먹어요. 동혁은 노동자들의 불만을 모아 파업을 이끌어요. 처음에는 흩어져 있던 사람들이 점차 단결해요. 회사와의 협상이 어려워지자 노동자들은 더 강한 행동에 나서요.|1971년 발표된 초기 노동 소설이에요.
사평역|임철우는 1954년생 소설가예요.|겨울밤 사평역 대합실에서 기차를 기다리는 사람들의 모습이 그려져요. 대학에서 쫓겨난 청년, 농사꾼, 외로운 노인, 장사꾼, 여인 등 저마다 사연을 안고 있어요. 이들은 톱밥 난로 곁에서 지난 일을 돌아봐요. 연착된 기차는 쉽게 오지 않고 사람들은 말없이 기다려요. 마침내 기차가 도착하자 사람들은 각자의 길로 떠나요.|1983년 발표됐고 곽재구의 시 「사평역에서」와 같은 제목을 가진 작품이에요.
금시조|이문열은 1948년생 소설가예요.|서예의 대가 석담 선생에게 배우는 제자 고죽은 훌륭한 재능을 지녔지만 스승과 갈등해요. 스승은 먼저 사람이 되라고 하고 고죽은 예술의 경지를 추구해요. 고죽은 스승을 떠나 떠돌다 스승의 죽음 소식을 듣고 돌아와요. 말년에 그는 평생 이루지 못한 금시조의 경지를 꿈꿔요. 마지막에 자신의 작품을 불태워요.|1981년 발표됐고 예술과 인생의 관계를 묻는 작품이에요.
청산별곡|작자 미상의 고려 가요예요.|이 작품은 시가라 줄거리 대신 구성으로 소개해요. 모두 8연으로 이루어지며 각 연은 '얄리얄리 얄라셩 얄라리 얄라'와 같은 후렴구를 가져요. 청산에 살겠다는 마음, 새와 자신의 처지를 비교하는 노래, 바다로 가겠다는 소망이 나와요. 마지막에는 술을 마시며 시름을 달래는 모습이 보여요. 삶의 고달픔과 도피 심리를 노래한다고 해석돼요.|고려 시대 노래로 『악장가사』에 실려 전해져요.
정과정|정서는 고려 의종 때의 문인이에요.|이 작품은 향가계 고려 가요라 줄거리 대신 구성으로 소개해요. 정서가 귀양을 가서 임금을 그리워하며 지은 노래로 충신연주지사의 원형으로 평가돼요. 자신의 억울함을 호소하며 임금이 불러 주기를 바라는 마음을 담았어요. 자신을 산 접동새에 비유해요. 10구체 향가의 형식이 남아 있어요.|12세기경 지어진 것으로 알려져 있어요. 다른 이름은 「삼진작」이에요.
처용가|처용은 신라 헌강왕 때의 인물로 전해져요.|이 작품은 향가라 줄거리 대신 구성으로 소개해요. 처용이 밤늦게 집에 돌아오자 역신이 아내와 자고 있는 모습을 보고 처용이 춤추며 노래를 불러요. 두 다리는 내 것인데 둘은 누구의 것인가 하는 구절이 나와요. 처용이 화를 내지 않고 물러서자 역신은 감동해 앞으로 처용의 모습만 보아도 그 집에 들어가지 않겠다고 맹세해요. 이후 처용의 얼굴을 문에 붙여 역신을 막는 풍습이 생겼어요.|『삼국유사』에 실려 있고 8구체 향가예요.
제망매가|월명사는 신라 경덕왕 때의 승려이자 향가 작가예요.|이 작품은 향가라 줄거리 대신 구성으로 소개해요. 일찍 세상을 떠난 누이의 제사 때 지은 노래예요. 삶과 죽음의 길이 가까이에 있다는 두려움을 말하고, 같은 나뭇가지에서 난 잎이 떨어지는 것에 누이의 죽음을 비유해요. 아쉬움 속에서도 미타찰, 곧 극락에서 다시 만나기를 도 닦으며 기다리겠다고 노래해요. 종교적 믿음으로 슬픔을 극복하려는 모습이 보여요.|10구체 향가로 『삼국유사』에 실려 있어요.
사미인곡|정철은 1536년생 조선 시대 문인으로 호는 송강이에요.|이 작품은 가사라 줄거리 대신 구성으로 소개해요. 임금을 임으로 여기고 임과 떨어져 사는 여인의 입장에서 그리움을 노래해요. 봄, 여름, 가을, 겨울 사계절의 변화 속에서 임을 생각하는 마음이 이어져요. 옷과 음식을 지어 보내고 싶어 하지만 임이 멀리 계셔서 어쩌지 못해요. 마지막에는 차라리 죽어서 범나비가 되어 임의 옷에 앉겠다고 말해요.|16세기 후반 쓰였어요. 속미인곡과 함께 충신연주지사의 대표작이에요.
상춘곡|정극인은 1401년생 조선 초기의 문인이에요.|이 작품은 가사라 줄거리 대신 구성으로 소개해요. 벼슬에서 물러나 태인 땅에 은거하며 봄의 경치를 즐기는 모습을 노래해요. 복숭아꽃과 살구꽃이 핀 풍경과 시냇가의 정취를 보며 흥에 취해요. 안빈낙도하는 삶을 이야기하고 아침저녁으로 산책하며 시를 읊어요. 마지막에 자연을 벗 삼아 살겠다는 다짐으로 끝나요.|조선 초기 지은 최초의 가사로 알려져 있어요.
어부사시사|윤선도는 1587년생 조선 시대 문신이자 시인으로 호는 고산이에요.|이 작품은 연시조라 줄거리 대신 구성으로 소개해요. 어부의 생활을 봄, 여름, 가을, 겨울 사계절 각 10수씩 모두 40수로 노래해요. 고기 잡는 풍경과 자연 속에서 느끼는 한가함이 담겨 있어요. 후렴구로 '배 띄워라', '닻 들어라' 같은 어부의 동작을 반복해요. 세속을 떠나 자연에 안겨 사는 즐거움을 이야기해요.|1651년 지은 것으로 알려져 있어요.
오우가|윤선도는 1587년생 조선 시대의 문신이자 시인이에요.|이 작품은 연시조라 줄거리 대신 구성으로 소개해요. 모두 6수로 다섯 벗인 물, 돌, 소나무, 대나무, 달을 노래해요. 물은 맑고 그치지 않는 점을, 바위는 변하지 않는 점을 칭찬해요. 소나무는 눈서리에도 푸르고 대나무는 곧고 속이 비어 있다고 말해요. 달은 말없이 비추는 벗으로 노래해요.|1642년 해남 금쇄동에서 지은 것으로 알려져 있어요.
장끼전|작자 미상의 조선 후기 우화 소설이에요.|장끼는 아내 까투리와 새끼들을 데리고 눈 덮인 들판에서 먹이를 찾다가 콩 한 알을 발견해요. 까투리는 불길한 꿈을 꾸었다며 먹지 말라고 말려요. 그러나 장끼는 고집을 부리며 콩을 먹다가 덫에 걸려 죽어요. 까투리는 슬퍼하며 장례를 치르고 남편의 장례에 여러 새들이 문상을 와요. 까투리는 개가를 두고 고민하다가 결국 다른 장끼와 재혼해요.|가부장제와 여성의 개가 문제를 풍자해요.
예덕선생전|박지원은 1737년생 조선 후기의 실학자예요.|선귤자의 제자 자목은 스승이 똥 푸는 일꾼 엄 행수를 벗으로 삼는 것을 이해하지 못해요. 스승은 엄 행수가 더러운 일을 하지만 정직하고 성실하게 분수를 지킨다고 설명해요. 겉보기로 사람을 판단해서는 안 된다고 가르쳐요. 참된 벗은 신분이 아니라 덕으로 사귄다는 점을 이야기해요. 그래서 엄 행수를 '예덕 선생'이라 부르게 돼요.|『연암집』에 실려 있어요. 양반의 허위의식을 비판해요.
누구를 위하여 종은 울리나|어니스트 헤밍웨이는 1899년생 미국의 작가예요.|스페인 내전 중 미국인 로버트 조던은 공화파 편에서 다리를 폭파하라는 명령을 받고 산악 지대의 게릴라 부대에 합류해요. 거기서 그는 마리아라는 소녀를 만나 사랑에 빠져요. 게릴라 부대 안에서는 다리 폭파를 둘러싼 갈등이 일어나요. 조던은 다리를 폭파하지만 다리를 다쳐 마리아와 동료들을 떠나보내고 홀로 남아 적을 기다려요.|1940년 출간됐어요. 존 던의 시에서 제목을 따왔어요.
에덴의 동쪽|존 스타인벡은 1902년생 미국의 작가예요.|캘리포니아 살리나스 계곡의 농부 애덤 트래스크에게는 쌍둥이 아들 칼렙과 아론이 있어요. 아버지는 착한 아론을 사랑하고 칼렙은 사랑받지 못해 괴로워해요. 칼렙은 아버지의 사업이 실패하자 돈을 벌어 사랑을 얻으려 하지만 거절당해요. 화가 난 칼렙은 아론에게 어머니의 비밀을 알려 줘요. 아론은 충격을 받고 군대에 가고 이후 전사하며 아버지는 병상에서 칼렙을 용서해요.|1952년 출간됐어요. 카인과 아벨 이야기를 모티프로 해요.
어둠의 심연|조지프 콘래드는 1857년생 폴란드 출신의 영국 작가예요.|선원 말로는 콩고강을 거슬러 올라가 상아를 수집하는 쿠르츠를 만나러 가요. 도중에 그는 식민 지배의 잔혹함과 원주민의 고통을 목격해요. 쿠르츠는 원시 부족에게 신처럼 숭배받으며 광기에 빠져 있었어요. 쿠르츠는 병으로 죽으면서 '무서움, 무서움'이라고 말해요. 말로는 쿠르츠의 약혼녀에게 거짓말을 해요.|1899년 발표됐어요. 제국주의 비판과 함께 아프리카에 대한 묘사로 비판받기도 해요.
드라큘라|브램 스토커는 1847년생 아일랜드 출신의 작가예요.|영국인 변호사 조너선 하커는 트란실바니아의 드라큘라 백작을 찾아가 성에 갇혀요. 드라큘라는 영국으로 건너가 사람들의 피를 빨아요. 조너선의 약혼녀 미나의 친구 루시가 희생당하고 반 헬싱 교수가 이끄는 일행이 드라큘라를 쫓아요. 미나도 드라큘라에게 공격받아요. 일행은 드라큘라를 추적해 트란실바니아에서 최후를 맞이하게 해요.|1897년 출간된 고딕 소설이에요.
타임머신|H. G. 웰스는 1866년생 영국의 작가예요.|시간 여행자는 타임머신을 만들어 80만 년 후의 미래로 가요. 미래 사회에는 부드러운 엘로이족과 지하에 사는 몰록족이 있어요. 몰록은 엘로이를 잡아먹으며 살아가요. 타임머신을 찾기 위해 몰록과 싸우던 그는 더 먼 미래로 가서 지구의 종말을 목격해요. 현재로 돌아온 그는 자신의 이야기를 친구들에게 들려주고 다시 떠나요.|1895년 출간됐어요. 계급 불평등을 풍자한 SF 고전이에요.
아버지와 아들|이반 투르게네프는 1818년생 러시아의 작가예요.|대학을 졸업한 청년 바자로프는 모든 권위를 부정하는 허무주의자예요. 친구 아르카디와 함께 아르카디의 고향 집을 찾아가 아버지 세대와 충돌해요. 바자로프는 오딘초바 부인을 사랑하게 되지만 거절당해요. 그는 의학 실습 중 감염되어 병으로 쓰러지고 부모는 슬퍼해요. 바자로프의 무덤에는 부모만이 찾아와 기도해요.|1862년 발표됐어요. 세대 간 갈등과 허무주의를 다뤄요.
고리오 영감|오노레 드 발자크는 1799년생 프랑스의 작가예요.|파리의 허름한 하숙집에서 늙은 고리오 영감은 두 딸을 위해 재산을 모두 내줘요. 딸들은 사교계에서 지위를 얻으려 아버지에게 돈을 요구하다가 점점 외면해요. 시골에서 올라온 청년 외젠 드 라스티냐크는 하숙집 사람들과 사교계를 오가며 출세를 꿈꿔요. 병든 고리오는 딸들을 보지 못한 채 쓸쓸히 죽어요. 라스티냐크는 파리를 향해 도전을 선언해요.|1835년 출간됐고 『인간 희극』의 대표작이에요.
닥터 지바고|보리스 파스테르나크는 1890년생 러시아의 시인이자 소설가예요.|의사이자 시인인 유리 지바고는 러시아 혁명과 내전의 격동기를 살아가요. 그는 간호사 라라를 만나 사랑에 빠지지만 각자 가정이 있어요. 혁명의 혼란 속에서 가족은 흩어지고 지바고는 유랑하며 시를 써요. 모스크바로 돌아온 그는 쇠약해져 길에서 숨을 거둬요. 책 끝에는 그가 남긴 시들이 실려 있어요.|1957년 이탈리아에서 처음 출간됐고 저자는 1958년 노벨 문학상 수상자로 결정됐으나 소련 당국의 압박으로 거절했어요.
갈매기|안톤 체호프는 1860년생 러시아의 극작가이자 의사예요.|청년 작가 트레플레프는 새로운 형식의 연극을 시도하며 연인 니나를 주인공으로 세워요. 그러나 어머니인 배우 아르카지나와 유명 작가 트리고린이 연극을 비웃어 그는 상처받아요. 니나는 트리고린에게 빠져 배우가 되겠다고 모스크바로 떠나지만 불행을 겪어요. 2년 후 돌아온 니나는 자신을 '갈매기'라고 부르며 연기를 향한 열정을 말해요. 트레플레프는 절망해 스스로 목숨을 끊어요.|1896년 초연된 희곡이에요. 자살 장면이 있어요.
벚꽃 동산|안톤 체호프는 1860년생 러시아의 극작가이자 의사예요.|오랜 외국 생활 끝에 귀족 부인 라네프스카야가 빚에 쪼들린 채 고향의 영지로 돌아와요. 영지 안의 벚꽃 동산은 곧 경매로 팔릴 처지에 놓여요. 상인 로파힌은 벚꽃 동산을 별장지로 개발해 빚을 갚으라고 권하지만 라네프스카야와 오빠 가예프는 현실적인 방법을 받아들이지 못해요. 결국 경매에서 벚꽃 동산을 산 사람은 옛 농노의 아들인 로파힌이에요. 새 주인이 된 로파힌이 벚나무를 베기 시작하는 도끼 소리가 울리며 막이 내려요.|1904년 초연된 체호프의 마지막 희곡이에요. 귀족 사회의 몰락과 새 시대를 그려요.
진달래꽃|김소월은 1902년 평안북도 출신의 시인이에요. 민요조 서정시로 한국인의 정서를 노래했어요.|이 책은 시집이라 줄거리 대신 구성으로 소개해요. 「진달래꽃」, 「초혼」, 「먼 후일」, 「엄마야 누나야」 같은 시가 실려 있어요. 이별의 슬픔과 그리움이 중심 주제예요. 7·5조 율격과 반복되는 리듬이 특징이에요. 「진달래꽃」에서는 가시는 길에 꽃을 뿌리겠다며 슬픔을 억누르는 화자가 등장해요.|1925년 시집으로 발간됐어요. 한국 근대 서정시의 대표작으로 꼽혀요.
님의 침묵|한용운은 1879년생 승려이자 시인이며 독립운동가예요.|이 책은 시집이라 줄거리 대신 구성으로 소개해요. 「님의 침묵」을 비롯해 88편의 시를 실었어요. '님'은 연인이면서 조국, 부처, 진리를 뜻한다고 해석돼요. 이별 속에서도 만남을 기약하는 역설적인 표현이 많아요. 「알 수 없어요」, 「복종」 같은 시도 유명해요.|1926년 발간됐어요. 불교적 사유와 민족의식이 담겨 있어요.
하늘과 바람과 별과 시|윤동주는 1917년 만주 출신의 시인이에요. 일본 유학 중 독립운동 혐의로 체포돼 후쿠오카 형무소에서 1945년 세상을 떠났어요.|이 책은 시집이라 줄거리 대신 구성으로 소개해요. 「서시」, 「자화상」, 「별 헤는 밤」, 「쉽게 씌어진 시」 같은 작품이 실려 있어요. 부끄러움과 자기 성찰, 조국을 잃은 청년의 고뇌가 주제예요. '죽는 날까지 하늘을 우러러 한 점 부끄럼이 없기를'이라는 구절이 대표적이에요. 별과 하늘 같은 이미지가 자주 나와요.|1948년 유고 시집으로 출간됐어요.
사슴|백석은 1912년 평안북도 정주 출신의 시인이에요.|이 책은 시집이라 줄거리 대신 구성으로 소개해요. 평안도 방언과 토속적인 음식, 풍습, 가족의 모습을 담은 시가 실려 있어요. 「여우난골족」, 「모닥불」, 「고방」 같은 작품이 있어요. 향토의 정서를 구체적인 사물과 이야기로 보여 줘요. 소박한 삶의 풍경을 따뜻하게 그려요.|1936년 한정판으로 100부만 찍은 시집이에요.
청록집|박목월, 조지훈, 박두진은 일제강점기 말 문장 지를 통해 등단한 시인들이에요. 이들을 청록파라 불러요.|이 책은 세 시인의 공동 시집이라 줄거리 대신 구성으로 소개해요. 박목월은 「나그네」 등 자연과 향토를, 조지훈은 「승무」 등 전통 미를, 박두진은 「향현」 등 자연 속의 희망을 노래해요. 시집의 시들은 자연을 주제로 해요. 일제강점기 말기의 암울한 현실에서 벗어난 서정을 담았어요.|1946년 을유문화사에서 간행됐어요.
사하촌|김정한은 1908년생 소설가예요. 현실 비판 의식이 강한 작품을 썼어요.|가뭄이 든 성동리 마을 농민들은 절의 땅을 부치는 소작농이에요. 절 보광사는 소작료를 가혹하게 받아 가고 물도 빼앗아 가요. 농민들은 못 견디다 못해 절에 항의하고 소작료를 낮춰 달라고 요구해요. 일부 농민은 절의 편을 들고 마을 사람들은 갈라져요. 결국 항의하는 농민들이 잡혀가고 마을은 더욱 가난해져요.|1936년 발표됐어요. 일제강점기 농촌 현실을 고발한 작품이에요.
모래톱 이야기|김정한은 1908년생 소설가예요.|낙동강 하구의 조마이섬에 사는 주민들은 홍수와 가난에 시달려요. 이 섬의 땅은 일제강점기부터 여러 권력자에게 넘어갔고 주민들은 소유권을 인정받지 못해요. 교사인 '나'는 제자 건우의 집안 이야기를 들으며 섬의 사연을 알게 돼요. 건우의 할아버지는 섬을 지키려다 큰 일을 겪어요. 마을 사람들은 홍수 때 자신들의 땅을 지키기 위해 행동해요.|1966년 발표됐고 소외된 농민의 삶을 다뤄요.
카인의 후예|황순원은 1915년생 소설가예요.|해방 직후 북한 땅에서 토지 개혁이 시작되자 지주 박훈은 땅을 잃고 위기에 놓여요. 그를 돌보는 소작인의 딸 오작녀는 박훈을 마음속으로 사랑해요. 마름이었던 도섭 영감은 새 권력 편에 서서 박훈을 고발해요. 박훈은 오작녀의 도움과 이웃의 사연을 겪으며 마음이 흔들려요. 그는 오작녀와 함께 남쪽으로 떠나기로 해요.|1954년 발표됐어요. 이념 갈등 속에서 인간애를 묻는 작품이에요.
탈출기|최서해는 1901년생 소설가예요. 간도에서 노동과 가난을 직접 겪었어요.|화자는 친구 김 군에게 편지로 자신이 가족을 버리고 집을 떠난 이유를 설명해요. 간도로 이주한 그는 성실히 일하지만 가난이 심해져 가족은 굶주려요. 아내는 귤껍질을 주워 먹고 어머니는 병이 들어요. 그는 이 문제가 자신의 게으름이 아니라 사회 구조 때문이라는 것을 깨달아요. 결국 그는 가족을 두고 투쟁 단체에 가입해요.|1925년 발표됐어요. 신경향파 문학의 대표작이에요.
빈처|현진건은 1900년생 소설가예요.|가난한 작가인 남편은 아내가 집안의 옷가지를 하나씩 전당포에 맡기는 것을 보고 마음 아파해요. 아내는 어려운 가운데도 남편을 원망하지 않고 그의 꿈을 응원해요. 어느 날 처형 집을 방문한 아내는 부유한 형부와 비교되어 서러워해요. 남편은 아내가 겪는 고생을 알면서도 자신의 글만 바라보았다고 반성해요. 아내가 '그래도 당신을 이해하는 사람은 나뿐'이라는 마음을 전하고 부부는 서로를 다독여요.|1921년 발표됐어요. 지식인 부부의 가난과 사랑을 그려요.
유예|오상원은 1930년생 소설가예요.|6·25 전쟁 중 한 소대가 후퇴하다 홀로 남은 '나'는 적에게 붙잡혀요. 눈 덮인 벌판에서 그는 총살당할 순간을 기다려요. 죽음 직전, 그는 지난 일들과 죽은 동료들을 회상해요. 포로로 잡힌 뒤 신문을 받고 몸을 굽히지 않기로 결심해요. 마지막에 총소리가 나며 의식이 사라져요.|1955년 발표됐어요. 전쟁 중 한 인간의 내면을 그린 작품이에요.
타인의 방|최인호는 1945년생 소설가예요.|출장에서 돌아온 남자는 아내가 집에 없자 낯선 분위기를 느껴요. 아내의 메모를 보고 혼자 있는 집에서 시간을 보내요. 그러자 집 안의 물건들이 살아 움직이는 듯한 환각을 겪어요. 아내가 돌아오지만 남편이 보이지 않고 그는 집의 물건이 되어 버려요. 현대 도시인의 단절과 소외를 보여 줘요.|1971년 발표됐어요.
외딴방|신경숙은 1963년생 소설가예요.|주인공 '나'는 1970년대 후반 열여섯의 나이로 구로공단에서 일하며 야간학교에 다녀요. 그녀는 좁은 외딴방에서 사촌, 친구 희재 언니와 함께 살아가요. 작업장에서의 노동과 학교에서의 공부, 가난 속의 우정이 이어져요. 희재 언니는 어느 날 비극적인 죽음을 맞아요. 작가가 된 현재의 '나'는 그 시절을 떠올리며 글로 써 내려가요.|1995년 출간됐어요. 자전적 요소가 짙고 죽음 장면이 있어 읽을 때 마음의 준비가 필요해요.
사람의 아들|이문열은 1948년생 소설가예요.|경찰관 남 경사는 신학도 민요섭의 의문의 죽음을 수사해요. 그는 요섭이 남긴 원고를 읽게 되는데 그 속에는 아하스 페르스라는 인물의 이야기가 있어요. 아하스 페르스는 신을 찾아 방황하며 기성 종교에 의문을 품어요. 요섭은 신과 구원, 악의 문제를 고민하던 사람이었어요. 남 경사는 끝내 진실을 다 알지 못한 채 사건을 마무리해요.|1979년 발표됐어요. 종교와 신의 존재를 묻는 소설이에요.
공방전|임춘은 고려 시대 문인으로 무신정변 후 불우한 삶을 살았어요.|엽전을 의인화해 '공방'이라는 인물의 일대기를 서술해요. 공방은 한나라 때 세상에 쓰이며 성장하고 사람들이 그를 좋아해 재물을 쌓아요. 공방은 점점 욕심이 늘어 백성의 이익을 해쳐요. 결국 간사한 무리가 득세하고 공방은 벼슬에서 물러나요. 돈이 사회에 미치는 영향을 경계하는 글이에요.|고려 시대 가전체 작품으로 『서하집』에 실려 있어요.
조신의 꿈|일연이 『삼국유사』에 기록한 설화예요.|승려 조신은 세달사의 농장을 관리하다가 태수 김흔공의 딸에게 반해 사랑을 이루게 해 달라고 빌어요. 어느 날 꿈속에서 그녀가 찾아와 부부가 돼요. 두 사람은 40여 년간 가난과 병고, 자식의 죽음을 겪고 헤어지기로 해요. 꿈에서 깨어 보니 머리가 하얗게 세어 있었어요. 세속적 욕망이 덧없다는 깨달음을 얻고 조신은 수행에 힘써요.|훗날 이광수의 소설 「꿈」, 김만중의 『구운몽』 같은 몽유 구조의 이야기로 이어졌다고 평가돼요.
적과 흑|스탕달은 1783년생 프랑스의 소설가예요.|가난한 목수의 아들 쥘리앵 소렐은 신학교에서 공부해 출세를 꿈꿔요. 그는 레날 시장 집의 가정교사로 들어가 시장 부인과 사랑에 빠져요. 이 일로 쫓겨난 그는 귀족 라 몰 후작의 비서가 되고 후작의 딸 마틸드와 연인이 돼요. 결혼을 앞두고 레날 부인의 편지가 그의 과거를 폭로해요. 분노한 쥘리앵은 레날 부인에게 총을 쏘고 재판 끝에 사형당해요.|1830년 출간됐어요. 왕정복고 시대의 사회를 비판해요.
여자의 일생|기 드 모파상은 1850년생 프랑스의 작가예요.|수녀원 학교를 나온 순진한 처녀 잔느는 줄리앵과 결혼해 행복한 삶을 꿈꿔요. 그러나 남편은 인색하고 하녀와 바람을 피워요. 아들 폴을 낙으로 삼지만 아들은 방탕하게 자라 재산을 탕진해요. 부모와 남편을 차례로 잃고 가난해진 잔느는 아들이 낳은 손녀를 데려와 키우게 돼요. 로잘리가 '인생이란 생각만큼 좋지도 나쁘지도 않다'고 말해요.|1883년 출간됐어요.
캔터베리 이야기|제프리 초서는 1340년경 태어난 영국의 시인이에요.|봄날 캔터베리 대성당으로 순례를 떠나는 서른 명 가까운 사람들이 여관에서 만나요. 여관 주인은 순례 길에 한 사람이 이야기 하나씩을 하는 내기를 제안해요. 기사, 수녀원장, 면죄부 장수, 바스의 여인 등 다양한 계층의 사람들이 저마다의 이야기를 들려줘요. 이야기는 익살스럽고 풍자적인 것부터 진지한 것까지 폭넓어요. 작품은 미완성으로 남았어요.|14세기 후반에 쓰였고 중세 영어로 쓰인 대표작이에요.
등대로|버지니아 울프는 1882년생 영국의 작가예요.|이 작품은 사건보다 인물의 의식을 따라가는 소설이에요. 1부에서 램지 가족은 스코틀랜드 섬의 별장에서 지내며 어린 제임스는 등대에 가고 싶어 해요. 램지 부인은 날씨가 나쁘다는 남편의 말에 아들의 소망을 외면할 수 없어요. 2부에서는 시간이 흘러 가족이 겪은 죽음과 전쟁이 짧게 스쳐 가요. 3부에서 남은 가족이 마침내 등대로 가고 화가 릴리는 오랜 그림을 완성해요.|1927년 출간됐고 의식의 흐름 기법의 대표작이에요.
순수의 시대|이디스 워튼은 1862년생 미국의 작가예요.|1870년대 뉴욕 상류 사회에서 변호사 뉴랜드 아처는 순진한 메이 웰런드와 약혼해요. 그때 유럽에서 이혼 소송 중인 메이의 사촌 엘렌 올렌스카가 돌아와요. 아처는 자유롭고 솔직한 엘렌에게 끌리지만 사회의 시선과 규범 때문에 갈등해요. 결국 그는 메이와 결혼하고 엘렌은 유럽으로 돌아가요. 세월이 흘러 아처는 엘렌의 집 앞까지 갔다가 들어가지 못해요.|1920년 출간됐고 1921년 퓰리처상을 받았어요. 여성 작가 최초 수상으로 알려져 있어요.
라쇼몽|아쿠타가와 류노스케는 1892년생 일본의 작가예요.|헤이안 시대 교토에 재난이 이어지자 주인에게 해고당한 하인은 비를 피해 라쇼몽 아래로 가요. 그곳에는 버려진 시체들이 쌓여 있어요. 하인은 한 노파가 시체의 머리카락을 뽑는 모습을 봐요. 노파는 살기 위해서라고 변명하고 하인은 그 말을 듣고 노파의 옷을 빼앗아 도망쳐요. 선과 악, 생존의 문제를 묻는 이야기예요.|1915년 발표됐어요. 같은 작가의 「덤불 속」과 함께 구로사와 아키라의 영화 「라쇼몽」의 바탕이 됐어요.
구토|장폴 사르트르는 1905년생 프랑스의 철학자이자 작가예요.|역사가 앙투안 로캉탱은 항구 도시 부빌에서 연구를 하며 혼자 지내요. 어느 날부터 그는 사물과 자신의 존재가 낯설고 역겹게 느껴지는 '구토'를 느껴요. 공원의 마로니에 뿌리를 바라보다가 존재는 이유 없이 그냥 있다는 것을 깨달아요. 옛 연인 아니와의 재회도 그를 구하지 못해요. 마지막에 그는 재즈 음악에서 희미한 위안을 얻고 글쓰기로 자신의 존재를 정당화하려 해요.|1938년 출간된 실존주의 소설이에요.
개를 데리고 다니는 부인|안톤 체호프는 1860년생 러시아의 작가예요.|유부남인 모스크바의 은행원 구로프는 휴양지 얄타에서 흰 스피츠를 데리고 다니는 부인 안나를 만나요. 두 사람은 가벼운 만남으로 시작해 사랑에 빠져요. 각자 가정으로 돌아간 뒤 구로프는 그녀를 잊지 못하고 안나가 사는 도시를 찾아가요. 둘은 몰래 만나며 사랑을 이어 가요. 앞으로 어떻게 해야 할지 알 수 없는 채로 이야기가 끝나요.|1899년 발표됐어요.
템페스트|윌리엄 셰익스피어는 1564년생 영국의 극작가예요.|밀라노의 공작이었다가 동생 안토니오에게 쫓겨난 프로스페로는 딸 미란다와 함께 외딴 섬에서 마법을 익혀요. 그는 요정 에어리얼을 부려 폭풍을 일으켜 원수들이 탄 배를 섬에 난파시켜요. 나폴리 왕자 퍼디낸드와 미란다는 사랑에 빠져요. 프로스페로는 복수 대신 용서를 택하고 마법을 버리기로 해요. 에어리얼은 자유를 얻고 모두는 고향으로 돌아가요.|1611년 무렵 쓰인 셰익스피어 후기 작품이에요.
유리 동물원|테네시 윌리엄스는 1911년생 미국의 극작가예요.|세인트루이스에서 아만다 윙필드는 딸 로라와 아들 톰과 함께 가난하게 살아요. 로라는 다리가 불편하고 수줍음이 많아 유리 동물 인형을 모으며 지내요. 아만다는 로라에게 신랑감을 찾아 주려고 톰에게 직장 동료를 데려오게 해요. 방문한 짐은 로라와 즐거운 시간을 보내지만 약혼자가 있다고 털어놓아요. 상처받은 로라와 가족을 떠나는 톰의 회상으로 극이 끝나요.|1944년 초연되었고 회상극 형식이에요.
시련|아서 밀러는 1915년생 미국의 극작가예요.|1692년 매사추세츠 세일럼에서 소녀들이 마녀 짓을 했다는 소문이 퍼져요. 소녀 애비게일은 존 프록터를 사랑했다가 거절당하자 그의 아내 엘리자베스를 마녀로 몰아요. 마을에서는 고발과 재판이 이어지고 많은 사람이 억울하게 죄를 뒤집어써요. 프록터는 거짓 자백을 거부하고 교수형을 택해요. 극은 집단적 광기와 양심의 가치를 묻는 이야기로 끝나요.|1953년 초연됐고 매카시즘의 시대를 비유한 작품으로 평가돼요.
육사 시집|이육사는 1904년생 시인이자 독립운동가예요. 1944년 중국 베이징 감옥에서 세상을 떠났어요.|이 책은 시집이라 줄거리 대신 구성으로 소개해요. 「청포도」, 「절정」, 「광야」, 「꽃」 등이 실려 있어요. 절제된 어조 속에 독립에 대한 의지와 민족의 희망을 담았어요. 「광야」에서는 '천고의 뒤에 백마 타고 오는 초인'이 등장해요. 강인한 기개가 돋보여요.|1946년 동생 이원조 등이 유고 시집으로 펴냈어요.
정지용 시집|정지용은 1902년생 시인이에요. 감각적이고 선명한 이미지로 현대시를 열었어요.|이 책은 시집이라 줄거리 대신 구성으로 소개해요. 「향수」, 「유리창」, 「고향」, 「바다」 등이 실려 있어요. 고향에 대한 그리움, 자연의 모습, 종교적 정서를 세련된 언어로 그려요. 어휘의 선택과 이미지가 새로웠어요. 한국 모더니즘 시의 출발점으로 평가돼요.|1935년 시문학사에서 출간됐어요.
속미인곡|정철은 1536년생 조선 시대 문인으로 호는 송강이에요.|이 작품은 가사라 줄거리 대신 구성으로 소개해요. 두 여인이 대화하는 형식으로 임금을 그리워하는 마음을 노래해요. 한 여인은 임과 헤어진 사연을 호소하고 다른 여인은 위로하며 묻는 방식이에요. 계절이 바뀌는 동안 임 생각에 잠 못 드는 모습이 이어져요. 마지막에 이르러 낙월이 되어 임을 비추고 싶다고 말해요.|16세기 후반 쓰였어요. 「사미인곡」과 함께 충신연주지사의 대표작이에요.
규원가|허난설헌은 1563년생 조선 시대 여성 시인이에요.|이 작품은 가사라 줄거리 대신 구성으로 소개해요. 규방에 갇혀 사는 여인이 떠돌이 남편을 기다리며 원망과 서러움을 노래해요. 젊은 날의 기쁨을 회상하며 시간이 지나 늙어 가는 외로움을 표현해요. 봄과 가을이 바뀌어도 남편은 돌아오지 않아요. 여성의 처지에 대한 한탄이 담겨 있어요.|조선 시대 여성 가사의 대표작이에요. 작가를 허난설헌으로 보는 데에는 이견도 있어요.
누항사|박인로는 1561년생 조선 시대 무인이자 문인이에요.|이 작품은 가사라 줄거리 대신 구성으로 소개해요. 임진왜란 뒤 가난하게 지내는 선비가 농사에 쓸 소를 빌리러 이웃을 찾아가지만 거절당하는 이야기가 담겨 있어요. 양반의 체면과 현실의 가난 사이에서 갈등하는 모습을 보여 줘요. 그래도 결국 자연 속에서 안분지족하며 살겠다고 다짐해요. 사실적인 현실 묘사가 두드러져요.|17세기 초에 쓰였어요.
도산십이곡|이황은 1501년생 조선의 성리학자로 호는 퇴계예요.|이 작품은 연시조라 줄거리 대신 구성으로 소개해요. 모두 12수로 앞의 6수는 '언지'로 자연 속에서 사는 뜻을, 뒤의 6수는 '언학'으로 학문과 수양에 대한 뜻을 노래해요. 자연과 하나 된 삶과 학문에 힘쓰는 자세가 중심이에요. '청산은 어찌하여 만고에 푸르르며'로 시작하는 노래가 유명해요. 쉬운 한글로 지어 후학이 읽도록 했어요.|1565년 지은 것으로 알려져 있어요.
가시리|작자 미상의 고려 가요예요.|이 작품은 고려 가요라 줄거리 대신 구성으로 소개해요. 모두 4연으로 임을 보내야 하는 슬픔을 노래해요. '가시리 가시리잇고 나는'으로 시작해 떠나는 임을 원망하다가 곧 붙잡지 못하고 보내는 체념을 표현해요. 마지막에는 가시는 듯 돌아오시라고 간절히 바라요. 이별의 정한을 담은 노래예요.|『악장가사』에 실려 전해져요. 후렴구 '위 증즐가 대평성대'가 있어요.
서경별곡|작자 미상의 고려 가요예요.|이 작품은 고려 가요라 줄거리 대신 구성으로 소개해요. 서경, 곧 평양을 배경으로 이별하는 여인의 마음을 노래해요. 서경을 버리고서라도 임을 따라가겠다는 결심과 대동강 뱃사공을 원망하는 내용이 나와요. 강을 건너면 임이 다른 여자를 만날 것이라는 질투도 담겼어요. 사랑에 적극적인 여인의 목소리가 특징이에요.|『악장가사』에 실려 전해져요. 모두 3장이에요.
공무도하가|백수광부의 아내가 지은 노래로 전해져요. 고조선 때의 노래예요.|이 작품은 고대 가요라 줄거리 대신 구성으로 소개해요. 머리가 흰 미친 사내가 강을 건너려다 빠져 죽자 그의 아내가 노래를 부르고 따라 죽었다고 전해져요. 사연을 들은 뱃사공 곽리자고가 아내 여옥에게 이야기하자 여옥이 공후로 노래를 연주했어요. 노래는 '임이여 물을 건너지 마오'로 시작해요. 임의 죽음을 슬퍼하는 마음이 담겨 있어요.|한역된 4구의 노래가 전해져 한국 최초의 서정시로 꼽혀요.
헌화가|신라 성덕왕 때 한 노인이 지은 향가로 전해져요.|이 작품은 향가라 줄거리 대신 구성으로 소개해요. 순정공이 강릉 태수로 부임하는 길에 수로부인이 절벽 위의 철쭉꽃을 갖고 싶어 해요. 소를 끌던 노인이 위험을 무릅쓰고 꽃을 꺾어 바치며 노래를 불러요. '자줏빛 바위 끝에 잡고 있는 암소를 놓게 하시고'로 시작해요. 아름다움을 향한 마음과 노인의 순수한 정성을 노래해요.|『삼국유사』에 실려 있는 4구체 향가예요.
잉여인간|손창섭은 1922년생 소설가예요.|치과 의사 서만기는 전쟁 뒤 어려운 형편에도 성실하게 살아요. 그의 병원에는 채익준과 천봉우 같은 친구들이 자주 드나들어요. 이들은 직업도 없이 현실 불만과 푸념만 하며 지내요. 만기는 친구들을 돌보고 처제와도 얽히며 책임에 시달려요. 결국 만기는 누명을 쓰고 병원을 닫게 되어 현실의 벽 앞에서 무너져요.|1958년 발표됐고 전후 사회에서 쓸모없는 존재로 취급받은 인간 군상을 그려요.
혈의 누|이인직은 1862년생 소설가예요.|청일전쟁이 일어난 평양에서 어린 옥련은 어머니와 헤어지고 일본군 군의관 이노우에의 도움을 받아 일본으로 가요. 이노우에가 전사하자 옥련은 양어머니의 학대를 받다가 집을 나와요. 우여곡절 끝에 미국으로 유학을 가서 공부해요. 그곳에서 만난 구완서와 함께 문명 개화를 꿈꾸며 약혼해요. 한편 아버지 김관일은 딸을 찾으려 미국으로 건너가 마침내 재회해요.|1906년 신문에 연재됐고 우리나라 최초의 신소설로 평가돼요.
금수회의록|안국선은 1854년생 개화기의 작가예요.|꿈속에서 '나'는 금수 회의 장소에 들어가 동물들이 인간 사회를 비판하는 연설을 들어요. 까마귀는 효도를 이야기하고 여우는 남의 권세를 빌려 위세를 부리는 인간을 비판해요. 개구리, 벌, 게, 파리, 호랑이 등이 차례로 연설하며 인간의 위선과 탐욕을 고발해요. 마지막에는 인간이 반성해야 한다고 결론지어요. '나'는 깨어나 사람들에게 회개를 촉구해요.|1908년 발표된 신소설로 풍자 우화 형식이에요.
배따라기|김동인은 1900년생 소설가예요.|'나'는 대동강가에서 배따라기 노래를 부르는 사나이를 만나요. 사나이는 자신이 겪은 일을 이야기해요. 그는 아내를 의심해 아내와 동생에게 폭력을 휘둘렀고 그 때문에 아내가 목숨을 잃어요. 동생은 집을 떠나고 그는 동생을 찾아 떠돌아다녀요. 오랜 세월 뒤 동생을 만나지만 다시 헤어져 방황해요.|1921년 발표됐어요. 한국 단편 소설의 초기 대표작이에요. 폭력과 죽음 장면이 있어요.
광화사|김동인은 1900년생 소설가예요.|이 작품은 액자 구조를 가진 소설이에요. 못생긴 화공 솔거는 이상적인 미인도를 그리려고 평생을 고민해요. 그는 눈이 먼 처녀를 만나 그녀에게서 눈동자의 표정을 이끌어내려 해요. 하지만 처녀가 모든 사연을 알게 되자 솔거는 감정이 폭발해 그녀를 죽여요. 그때 그림 위에 먹물이 튀어 눈동자가 찍히고 그 그림에는 원망의 눈빛이 남아요.|1935년 발표됐고 예술을 위해 파멸하는 인간을 다뤄요. 폭력 장면이 있어요.
붉은 산|김동인은 1900년생 소설가예요.|만주를 여행하던 의사 '나'는 어느 만주 마을에서 삵이라 불리는 건달 정익호를 만나요. 그는 마을 사람들이 싫어하는 난폭한 사람이에요. 어느 날 마을의 송 첨지가 중국인 지주에게 맞아 죽자 삵은 홀로 지주를 찾아가요. 삵은 크게 다쳐 돌아와 죽어 가며 붉은 산과 흰옷이 보고 싶다고 말해요. 마을 사람들은 애국가를 부르며 그를 보내요.|1932년 발표됐어요.
물레방아|나도향은 1902년생 소설가예요.|이방원은 지주 신치규의 막실에서 일하는 소작인이에요. 신치규는 이방원의 아내를 탐해 그녀를 유혹하고 방원은 쫓겨나요. 아내는 신치규의 첩이 되어 이방원의 분노를 사요. 방원은 아내를 찾아가 함께 떠나자고 하지만 거절당해요. 분노에 사로잡힌 방원은 비극적인 일을 저질러요.|1925년 발표됐고 가난한 사람의 욕망과 비극을 그렸어요. 폭력과 죽음이 나와요.
벙어리 삼룡이|나도향은 1902년생 소설가예요.|오 생원 집의 하인 삼룡이는 벙어리지만 일을 잘하고 충직해요. 주인집 아들은 삼룡이를 괴롭히며 못살게 굴어요. 주인집 아들은 어린 아내를 때리고 삼룡이는 아씨를 가엾게 여겨 몰래 돌봐요. 오해를 받아 쫓겨난 삼룡이는 주인집에 불을 질러요. 그는 불 속에서 아씨를 구해 안고 웃으며 죽어 가요.|1925년 발표됐어요.
표본실의 청개구리|염상섭은 1897년생 소설가예요.|중학교 때 해부실에서 청개구리를 해부하는 장면을 본 '나'는 그 일의 잔인함을 잊지 못하고 괴로워해요. 현재의 '나'는 평양에서 우울한 시간을 보내며 친구 김창억을 만나 그의 기이한 생활을 목격해요. 김창억은 사랑하는 사람의 배신으로 정신 이상에 빠진 인물이에요. '나'는 그를 보면서 청개구리의 모습이 겹쳐 보여요. 시대에 대한 환멸과 불안이 드러나요.|1921년 발표됐고 한국 자연주의 소설의 시작으로 평가돼요.
천변풍경|박태원은 1909년생 소설가예요.|1930년대 서울 청계천 주변의 빨래터와 이발소, 약국, 카페에서 일하는 평범한 사람들의 일상이 펼쳐져요. 이발소 소년 창수, 빨래터의 여인들, 한약방 주인 등이 차례로 등장해요. 각 인물은 저마다의 사연과 꿈을 지니고 살아가요. 이야기는 하나의 중심 사건보다 여러 인물의 장면이 이어지는 형식이에요. 변해 가는 도시의 모습도 함께 보여요.|1936~1937년 연재됐어요.
목로주점|에밀 졸라는 1840년생 프랑스의 소설가로 자연주의 문학을 이끌었어요.|파리의 세탁부 제르베즈는 애인 랑티에에게 버림받고 두 아이와 남겨져요. 그녀는 양철공 쿠포와 결혼해 열심히 일하며 세탁소를 열 꿈을 키워요. 그러나 쿠포가 사고로 다친 뒤 술에 빠지고 제르베즈도 점점 나태해져요. 옛 연인 랑티에가 돌아와 집에 들어앉으며 가정은 더 무너져요. 빚에 몰린 제르베즈는 결국 비참하게 죽음을 맞아요.|1877년 출간됐어요. 알코올 중독과 빈곤이 사람을 어떻게 무너뜨리는지 사실적으로 보여 줘요.
제르미날|에밀 졸라는 1840년생 프랑스의 소설가예요.|실직한 기계공 에티엔 랑티에는 북프랑스 탄광 마을에 와서 광부로 일하게 돼요. 광부들의 비참한 생활과 낮은 임금을 보고 그는 노동자들의 조직을 이끌기 시작해요. 회사가 임금을 깎자 광부들은 파업에 들어가요. 파업이 길어지며 굶주림과 군대의 진압으로 희생자가 나와요. 갱도 붕괴 사고가 일어나고 에티엔은 새로운 싸움을 다짐하며 마을을 떠나요.|1885년 출간됐고 제목은 프랑스 혁명력의 싹이 트는 달이라는 뜻이에요.
오블로모프|이반 곤차로프는 1812년생 러시아의 작가예요.|지주 귀족 오블로모프는 하루 종일 침대나 소파에 누워 지내며 아무 일도 하지 않아요. 하인 자하르와 함께 집안은 어수선하고 영지의 일도 처리하지 못해요. 친구 슈톨츠가 그를 일으켜 세우려 하고 오블로모프는 올가를 사랑하며 잠시 활기를 띠어요. 그러나 결국 결단하지 못하고 사랑도 놓쳐요. 그는 소박한 여인과 평온하지만 무기력한 삶을 이어 가다 생을 마쳐요.|1859년 발표됐어요. '오블로모프주의'라는 말이 게으름과 무기력을 뜻하는 말로 쓰여요.
허영의 시장|윌리엄 새커리는 1811년생 영국의 작가예요.|가난한 화가의 딸 베키 샤프는 영리하고 야심이 커서 상류 사회로 올라가려고 해요. 그녀의 친구 아멜리아는 순진하고 착한 소녀예요. 베키는 군인 롤든과 결혼한 뒤에도 권력자들을 이용하며 사교계를 누벼요. 한편 아멜리아의 남편은 워털루 전투에서 전사하고 그녀는 가난에 시달려요. 이야기는 두 여인의 대조를 통해 허영과 위선으로 가득한 세상을 보여 줘요.|1848년 출간됐어요.
아이반호|월터 스콧은 1771년생 스코틀랜드의 작가예요.|12세기 영국, 사자왕 리처드가 십자군 원정에서 돌아오지 않은 사이 동생 존 왕자가 왕위를 노려요. 색슨 기사 아이반호는 아버지에게 쫓겨났지만 마상 시합에서 이름을 떨쳐요. 그는 유대인 상인의 딸 레베카의 간호를 받고 로위너와의 사랑을 이어 가요. 로빈 후드 등이 등장해 적과 맞서고 변장한 리처드가 돌아와 정의를 되찾아요. 색슨과 노르만의 갈등도 해소돼요.|1819년 출간된 역사 소설이에요.
필경사 바틀비|허먼 멜빌은 1819년생 미국의 작가예요.|뉴욕 월가의 변호사 사무실에 필경사 바틀비가 들어와 처음에는 성실하게 일해요. 어느 날부터 바틀비는 무슨 일을 시켜도 '하지 않는 편을 택하겠습니다'라고만 답해요. 변호사는 그를 이해하려 애쓰지만 결국 바틀비는 사무실에서 지내며 아무 일도 하지 않게 돼요. 변호사가 사무실을 옮기자 바틀비는 감옥에 가게 돼요. 그곳에서 바틀비는 식사를 거부하다 숨을 거둬요.|1853년 발표됐어요. 소외와 저항의 의미를 두고 다양한 해석이 있어요.
검찰관|니콜라이 고골은 1809년생 러시아의 작가예요.|지방 소도시에 중앙에서 검찰관이 비밀리에 온다는 소식이 퍼져 관리들은 두려움에 떨어요. 한편 여관에 묵던 가난한 청년 흘레스타코프가 검찰관으로 오인돼요. 시장 등 관리들은 그에게 뇌물을 바치고 접대해요. 흘레스타코프는 이 오해를 이용해 돈을 챙기고 시장의 딸에게도 청혼해요. 그가 떠난 후 진짜 검찰관이 도착했다는 소식이 들리며 모두가 얼어붙어요.|1836년 초연된 풍자 희극이에요.
세 자매|안톤 체호프는 1860년생 러시아의 극작가예요.|올가, 마샤, 이리나 세 자매는 아버지가 죽은 뒤 지방 도시에서 지내며 모스크바로 돌아가는 꿈을 품어요. 군인들이 집에 드나들며 마샤는 유부남 베르시닌과 사랑에 빠져요. 이리나는 일에서 의미를 찾으려 하지만 지쳐 가요. 오빠 안드레이는 나타샤와 결혼해 집안의 주도권을 잃어요. 군대가 떠나고 세 자매는 살아가야 한다고 서로를 다독여요.|1901년 초연됐어요.
민중의 적|헨리크 입센은 1828년생 노르웨이의 극작가예요.|온천 마을의 의사 스토크만은 온천 물이 오염되었다는 사실을 발견해요. 그는 이를 알리려 하지만 시장인 형과 주민들은 마을의 수입 때문에 사실을 숨기려 해요. 처음에는 지지하던 사람들도 이익에 위협을 받자 등을 돌려요. 스토크만은 민중의 적으로 몰려 집이 공격받고 일자리를 잃어요. 그는 끝까지 진실을 알리기로 결심하고 '가장 강한 사람은 홀로 서는 사람'이라고 말해요.|1882년 발표됐어요.
빌헬름 텔|프리드리히 실러는 1759년생 독일의 극작가예요.|14세기 스위스는 오스트리아 총독 게슬러의 압제를 받아요. 게슬러는 모자를 장대에 걸고 절하라고 강요해요. 활의 명수 빌헬름 텔은 이를 거절하고 벌로 아들 머리 위의 사과를 쏘게 돼요. 그는 화살로 사과를 맞히지만 총독을 쏘려 했다는 것을 밝혀 투옥되고 탈출해 게슬러를 쏴 죽여요. 이 일을 계기로 스위스 농민들이 봉기해 자유를 얻어요.|1804년 초연됐어요.
삼국지|나관중은 14세기 중국 원말 명초의 작가로 알려져 있어요.|후한 말 황건적의 난이 일어나자 유비, 관우, 장비는 복숭아밭에서 의형제를 맺어요. 유비는 제갈량을 군사로 맞이해 촉한을 세우고 조조의 위, 손권의 오와 맞서요. 적벽대전에서는 손권과 연합해 조조를 물리쳐요. 관우와 장비, 유비가 차례로 죽고 제갈량은 북벌을 이어 가다 오장원에서 세상을 떠나요. 결국 세 나라는 사마씨의 진으로 통일돼요.|『삼국지연의』라고도 하며 중국 4대 기서의 하나예요.
서유기|오승은은 16세기 명나라의 작가로 알려져 있어요.|돌에서 태어난 원숭이 손오공은 하늘나라에서 소동을 피우다 오행산 아래에 갇혀요. 오백 년 뒤 삼장법사가 그를 풀어 주고 서역으로 불경을 구하러 가는 길에 제자가 돼요. 저팔계와 사오정이 합류해 요괴들의 방해를 물리치며 길을 가요. 81가지 고난을 겪은 끝에 일행은 천축에 닿아 불경을 얻어요. 불법을 이루고 모두 부처의 지위를 얻어요.|중국 4대 기서의 하나예요. 당나라 승려 현장의 실제 여행이 바탕이에요.
젊은 베르터의 슬픔|요한 볼프강 폰 괴테는 1749년생 독일의 문호예요.|청년 베르터는 시골 마을 발하임에서 로테를 만나 사랑에 빠져요. 로테에게는 약혼자 알베르트가 있어요. 그는 고통에 시달려 마을을 떠나 일하지만 적응하지 못하고 돌아와요. 로테와 알베르트가 결혼한 뒤 베르터는 절망해요. 마지막에 그는 알베르트에게 빌린 권총으로 스스로 생을 마감해요.|1774년 출간된 서간체 소설이에요. 자살을 다루고 있어 읽을 때 마음이 힘들다면 신뢰할 수 있는 사람과 이야기하세요.
컬러 퍼플|앨리스 워커는 1944년생 미국의 작가예요.|조지아주의 흑인 소녀 셀리는 어려서부터 학대를 당하고 아이를 빼앗기며 하느님에게 편지를 써요. 그녀는 원치 않는 결혼으로 남편 미스터에게 억압당하며 살아요. 남편의 연인 슈그 에이버리를 만나 사랑과 자존감을 배워요. 오랫동안 헤어졌던 동생 네티의 편지를 되찾고 셀리는 독립해서 가게를 열어요. 가족은 서로 용서하고 다시 만나게 돼요.|1982년 출간돼 퓰리처상을 받았어요. 폭력과 학대 묘사가 있어 읽을 때 주의가 필요해요.
뻐꾸기 둥지 위로 날아간 새|켄 키지는 1935년생 미국의 작가예요.|건달 맥머피는 형을 피하려고 정신병원에 들어와 간호사 래치드의 엄격한 규율에 놀라요. 그는 환자들에게 자유와 웃음을 되찾아 주려 하고 야구 중계를 보게 해 달라며 맞서요. 병원은 맥머피를 길들이려 전기 충격과 수술을 시도해요. 말 못 하는 인디언 환자 브롬덴은 맥머피의 도움으로 용기를 얻어요. 맥머피가 처참한 모습이 된 뒤 브롬덴은 그를 보내 주고 병원을 탈출해요.|1962년 출간됐어요. 정신 병원 치료 방식에 대한 비판이 담겼어요.
우리가 볼 수 없는 모든 빛|앤서니 도어는 1973년생 미국의 작가예요.|프랑스의 눈먼 소녀 마리로르와 독일의 고아 소년 베르너는 제2차 세계대전 중 서로 다른 곳에서 자라요. 마리로르는 아버지가 만든 도시 모형을 손으로 더듬어 길을 익히고 베르너는 라디오 수리 재능으로 군에 징집돼요. 마리로르는 라디오 방송을 이어 가고 베르너는 그 목소리를 듣고 마음이 움직여요. 두 사람은 생말로가 폭격받는 날 만나요. 전쟁은 두 사람에게 큰 흔적을 남겨요.|2014년 출간돼 2015년 퓰리처상 소설 부문을 받았어요.
그들이 짊어진 것들|팀 오브라이언은 1946년생 미국의 작가로 베트남전 참전 경험이 있어요.|이 작품은 연작 단편집이라 대표작을 소개해요. 베트남전 중 알파 중대의 병사들은 무기와 장비는 물론 사랑하는 사람의 편지, 두려움, 죄책감까지 짊어지고 행군해요. 지휘관 지미 크로스 중위는 고향의 마사를 생각하다 부하의 죽음을 막지 못했다는 죄책감에 시달려요. 전쟁에서 겪은 일을 이야기로 만드는 일의 의미를 되새겨요. 실제와 허구가 섞인 이야기 속에 전쟁의 진실을 담으려 해요.|1990년 출간됐어요. 전쟁 폭력이 묘사돼요.
말테의 수기|라이너 마리아 릴케는 1875년생 오스트리아 출신 시인이에요.|이 작품은 소설이지만 일기 같은 형식이라 줄거리 대신 구성으로 소개해요. 덴마크 출신의 젊은 시인 말테 라우리츠 브리게가 파리에서 가난하게 살며 느낀 생각을 적어요. 도시의 거리, 병원, 죽어 가는 사람들을 보며 죽음과 삶의 의미를 묻고 유년 시절의 기억도 떠올려요. 연인의 사랑, 신, 예술에 대한 사색이 이어져요. 마지막에는 성경 속 탕자의 이야기를 새롭게 해석해요.|1910년 출간됐어요.
밤에 일어난 개의 기묘한 사건|마크 해던은 1962년생 영국의 작가예요.|열다섯 살 크리스토퍼는 수학과 소수를 좋아하는 자폐 스펙트럼 소년이에요. 어느 밤 이웃집 개 웰링턴이 죽은 것을 발견하고 범인을 찾기 위해 탐정이 돼 글을 써요. 조사를 이어 가며 그는 가족의 숨겨진 비밀을 알게 돼요. 혼란에 빠진 크리스토퍼는 혼자 기차를 타고 런던으로 가는 모험을 해요. 시험을 잘 치르고 가족과 새로운 관계를 만들어 가요.|2003년 출간됐어요.
월플라워의 특권|스티븐 크보스키는 1970년생 미국의 작가예요.|고등학교 신입생 찰리는 소심하고 외톨이로 지내요. 선배 패트릭과 샘을 만나 처음으로 친구가 생기고 파티와 음악, 사랑을 경험해요. 찰리는 편지 형식으로 이름을 밝히지 않은 누군가에게 자신의 일상을 이야기해요. 그러나 과거의 아픈 기억이 떠올라 힘든 시기를 겪고 치료를 받아요. 시간이 흐르며 그는 '내가 여기 있다'는 것을 느끼기 시작해요.|1999년 출간된 청소년 성장 소설이에요. 우울, 상처 등 어두운 주제가 나와요.
페르세폴리스|마르잔 사트라피는 1969년생 이란 출신의 만화가예요.|이 작품은 자전적 그래픽 노블이에요. 어린 마르잔은 1979년 이란 혁명과 이란·이라크 전쟁을 겪으며 자라요. 자유로운 성격의 그녀는 억압적인 분위기와 충돌하고 부모는 그녀를 오스트리아 빈으로 유학 보내요. 외국에서 외로움과 방황을 겪고 이란으로 돌아오지만 적응하기 어려워요. 결국 그녀는 이란을 떠나 프랑스에서 살게 돼요.|2000년대 초 프랑스어로 출간됐고 애니메이션 영화로도 만들어졌어요.
아킬레스의 노래|매들린 밀러는 1978년생 미국의 작가예요.|왕자 파트로클로스는 사고로 아이를 죽인 뒤 추방돼 프티아의 왕 펠레우스 궁에서 지내요. 그곳에서 그는 반신반인 아킬레우스와 우정을 쌓고 사랑에 빠져요. 두 사람은 케이론에게 배우며 자라고 트로이 전쟁이 일어나자 함께 떠나요. 아가멤논과의 갈등으로 아킬레우스가 전장에서 물러나고 파트로클로스의 죽음이 비극을 불러요. 『일리아스』를 파트로클로스의 시선으로 다시 쓴 이야기예요.|2011년 출간됐고 2012년 오렌지상을 받았어요.
범죄자로 태어나다|트레버 노아는 1984년생 남아프리카공화국 출신의 코미디언이에요.|이 책은 자서전이라 줄거리 대신 구성으로 소개해요. 아파르트헤이트 시대에 흑인 어머니와 백인 아버지 사이에서 태어난 저자는 존재 자체가 법을 어긴 '범죄'였어요. 어머니는 아들을 지키려 애쓰고 종교와 교육을 중시해요. 가난과 언어, 인종 문제로 겪은 일들을 유머러스하게 풀어내요. 어머니와의 관계가 책의 중심이에요.|2016년 출간됐어요.
헨리에타 랙스의 불멸의 삶|레베카 스클루트는 1972년생 미국의 과학 저널리스트예요.|이 책은 논픽션이라 줄거리 대신 구성으로 소개해요. 1951년 흑인 여성 헨리에타 랙스는 자궁경부암으로 치료받다가 세포를 채취당해요. 그 세포는 실험실에서 죽지 않고 계속 자라 'HeLa 세포'로 불리며 전 세계 연구에 쓰였어요. 의학 발전에 크게 기여했지만 가족은 오랫동안 이 사실을 몰랐어요. 책은 연구 윤리, 인종 문제, 동의 없는 연구를 질문해요.|2010년 출간됐어요.
지하철도|콜슨 화이트헤드는 1969년생 미국의 작가예요.|조지아의 노예 코라는 어머니가 도망친 뒤 농장에서 학대를 받다가 시저의 권유로 탈출해요. 소설 속 지하철도는 실제 땅속을 달리는 기차예요. 코라는 주마다 다른 방식으로 억압하는 사회를 지나며 노예 사냥꾼 리지웨이에게 쫓겨요. 그녀는 사우스캐롤라이나, 노스캐롤라이나, 인디애나 등을 거쳐 자유를 향해 가요. 길 위에서 만난 사람들과 사건은 노예제의 현실을 드러내요.|2016년 출간돼 퓰리처상을 받았어요. 폭력 장면이 있어요.
니켈 보이즈|콜슨 화이트헤드는 1969년생 미국의 작가예요.|1960년대 미국 남부의 성실한 흑인 소년 엘우드 커티스는 대학 진학을 앞두고 억울하게 소년원 니켈 아카데미에 보내져요. 그곳에서 그는 학대와 차별, 폭력을 겪어요. 엘우드는 마틴 루서 킹의 가르침을 믿으려 하지만 친구 터너는 현실적인 생존 방식을 이야기해요. 두 사람은 비밀을 파헤치려 하다가 위험에 처해요. 오랜 세월 뒤 한 사람의 정체와 진실이 밝혀져요.|2019년 출간돼 퓰리처상을 받았어요. 실제 소년원 사건에서 영감을 받았어요.
골드핀치|도나 타트는 1963년생 미국의 작가예요.|열세 살 시어도어 데커는 어머니와 함께 뉴욕 메트로폴리탄 미술관에 갔다가 폭탄 테러를 당해요. 어머니는 세상을 떠나고 그는 사고 현장에서 네덜란드 화가 파브리티우스의 그림 「황금방울새」를 들고 나와요. 이후 친구 집, 라스베이거스, 다시 뉴욕을 오가며 성장하는 동안 그림은 그의 비밀이자 위안이 돼요. 성인이 된 그는 위험한 거래에 휘말려요. 결국 예술의 의미를 깨닫고 삶을 받아들여요.|2013년 출간돼 2014년 퓰리처상을 받았어요.
건포도 태양 아래|로레인 핸스베리는 1930년생 미국의 극작가예요.|시카고 흑인 빈민가에 사는 영거 가족은 가장이 죽고 남긴 보험금 1만 달러를 두고 의견이 갈라져요. 아들 월터는 술집 사업에 투자하려 하고 어머니 리나는 새집을 사려 해요. 딸 베니사는 의사가 되려는 꿈을 가져요. 월터가 동업자에게 돈을 날리면서 가족이 위기에 빠져요. 가족은 백인 동네의 새집으로 이사하기로 하며 존엄을 지켜요.|1959년 초연됐어요. 흑인 여성 작가 최초로 브로드웨이에 올려진 작품이에요.
조이 럭 클럽|에이미 탄은 1952년생 미국의 작가예요.|샌프란시스코의 중국 이민 어머니 네 사람은 마작 모임 '조이 럭 클럽'을 이끌며 지내요. 한 어머니가 세상을 떠난 뒤 그의 딸이 어머니의 자리를 대신해 모임에 나가요. 어머니들은 중국에서 겪은 고통과 상실의 과거를 딸들에게 들려줘요. 딸들은 어머니와 갈등하지만 그 이야기를 통해 이해하게 돼요. 딸은 중국에 있는 이복 자매를 찾아가 어머니의 소원을 이뤄 줘요.|1989년 출간됐어요. 이민자 가정의 세대 갈등을 다뤄요.
중국의 붉은 별|에드거 스노는 1905년생 미국의 기자예요.|이 책은 르포라 줄거리 대신 구성으로 소개해요. 1936년 스노는 서방 기자로는 처음 공산당 근거지인 옌안에 들어가 마오쩌둥과 장정을 이야기해요. 마오쩌둥의 생애와 홍군의 대장정, 주더와 저우언라이 등의 활동을 기록해요. 이를 통해 외부 세계에 중국 공산당의 실상을 알렸어요. 평가는 엇갈리지만 중요한 현지 기록으로 읽혀요.|1937년 출간됐어요.
동급생|프레드 울만은 1901년생 독일 출신 영국 작가예요.|1930년대 독일 슈투트가르트의 김나지움에 유대인 의사의 아들 한스 슈바르츠가 입학해요. 그는 귀족 가문의 아들 콘라딘 폰 호헨펠스와 깊은 우정을 쌓아요. 나치가 권력을 잡으며 한스는 차별을 받고 우정도 시험대에 올라요. 한스는 미국으로 떠나고 세월이 흘러 콘라딘의 이야기를 듣게 돼요. 짧은 분량 속에 우정과 역사의 비극이 담겨요.|1971년 출간됐어요.
관촌수필|이문구는 1941년생 소설가예요.|이 작품은 8편으로 이루어진 연작 소설이라 구성으로 소개해요. 충남 보령의 관촌 마을에서 보낸 어린 시절을 회상하며 전쟁과 근대화 속에서 사라진 사람들과 마을의 모습을 그려요. 할아버지, 아버지, 옹점이, 대복이 같은 인물들이 등장해요. 토속적인 사투리와 해학이 돋보여요. 사라져 가는 공동체에 대한 그리움이 담겨 있어요.|1977년 책으로 출간됐어요.
광염 소나타|김동인은 1900년생 소설가예요.|음악 평론가 K는 한 작곡가의 괴이한 이야기를 들려줘요. 천재 작곡가 백성수는 불을 지르거나 시체를 보는 극단적인 충격을 받을 때마다 놀라운 곡을 써요. 사람들은 그의 음악에 열광하지만 그는 곡을 쓰기 위해 방화와 범죄를 저질러요. 결국 그는 정신 병원에 갇혀요. 예술과 도덕의 관계를 묻는 이야기예요.|1930년 발표됐어요.
혼불|최명희는 1947년생 소설가예요. 17년에 걸쳐 이 작품을 썼어요.|이 작품은 10권의 대하소설이라 큰 줄기로 소개해요. 일제강점기 전북 남원의 매안 마을에서 종가 이씨 집안의 종부 청암 부인이 가문을 이끌어요. 손자 강모와 강실, 효원 등 여러 인물의 사랑과 갈등이 얽혀요. 혼례와 상례 같은 전통 풍속과 방언이 생생하게 그려져요. 집안이 몰락하는 과정을 통해 시대의 아픔을 보여 줘요.|1980년대 후반부터 1990년대 후반에 걸쳐 완성됐어요.
임꺽정|홍명희는 1888년생 소설가이자 독립운동가예요.|조선 명종 때 백정의 아들 임꺽정은 힘이 세고 의협심이 강해요. 부패한 관리와 양반의 횡포에 반발해 청석골에서 도적 떼를 이끌어요. 이봉학, 박유복, 서림 등 여러 동료가 모이고 조정은 그들을 토벌하려 해요. 임꺽정은 관군과 맞서다가 점차 몰려요. 소설에는 당대 풍속과 우리말이 풍부하게 담겨 있어요.|1928년부터 1940년까지 신문에 연재된 대하소설이에요. 미완성으로 남았어요.
장길산|황석영은 1943년생 소설가예요.|조선 숙종 때 광대 출신의 장길산은 신분 차별과 가난에 맞서 의적 활동을 해요. 백성의 삶이 어려운 시대에 그는 많은 사람의 지지를 얻어요. 그와 함께하는 인물들이 모여 새로운 세상을 꿈꿔요. 조정은 그를 잡으려 하지만 끝내 잡지 못해요. 작가는 민중의 힘으로 세상을 바꾸려는 이야기를 그려요.|1974년부터 1984년까지 신문에 연재된 대하소설이에요.
객주|김주영은 1939년생 소설가예요.|조선 후기 보부상들의 삶을 그린 대하소설이에요. 보부상은 장터를 돌아다니며 물건을 팔고 사는 상인이에요. 천봉삼과 그를 둘러싼 인물들이 장돌뱅이 조직 속에서 성장하고 갈등해요. 시장과 객주 같은 상업 활동이 사실적으로 묘사돼요. 풍속과 방언, 속담이 풍부해요.|1979년부터 1984년까지 신문에 연재됐어요. 2000년대에 다시 이어졌어요.
달밤|이태준은 1904년생 소설가예요.|서울 성북동으로 이사 온 '나'는 못난이 황수건을 만나요. 황수건은 어수룩하지만 순박한 사람으로 신문 보조 배달원을 하다가 해고돼요. 그는 보조 일이 잘렸다고 해도 포기하지 않아요. 어느 날 '나'가 달밤에 그를 만났을 때 그는 노래를 부르며 걷고 있었어요. 가난하지만 순수한 인물을 따뜻하게 그려요.|1933년 발표됐어요.
복덕방|이태준은 1904년생 소설가예요.|서울의 복덕방에 안 초시, 서 참의, 박희완 영감이 모여 소일해요. 안 초시는 딸 안경화의 도움을 받으며 재기를 꿈꾸다가 사기에 걸려 돈을 잃어요. 그는 딸에게 면목이 없어 괴로워하다가 스스로 생을 마감해요. 딸은 장례를 화려하게 치르지만 남은 두 노인은 허탈해해요. 변화하는 시대에 밀려난 노인들의 모습을 보여 줘요.|1937년 발표됐어요. 자살 장면이 있어요.
탈향|이호철은 1932년생 소설가예요.|6·25 전쟁 때 월남한 네 명의 청년이 부산에서 부두 노동자로 지내요. 그들은 화물차에서 잠을 자며 서로에게 의지하지만 현실은 가혹해요. 한 친구가 사고로 죽고 또 다른 친구는 떠나요. 남은 '나'는 고향으로 돌아갈 날을 그리워하지만 이루지 못해요. 피난민의 상실감과 뿌리 뽑힌 삶을 그려요.|1955년 발표됐어요.
학마을 사람들|이범선은 1920년생 소설가예요.|학이 날아와 둥지를 트는 마을에서 사람들은 학을 신성하게 여겨 소중히 지켜요. 이 마을의 노인은 학과 함께 살아온 삶을 자랑스러워해요. 전쟁이 일어나며 학이 사라지자 사람들은 불안해해요. 전쟁 후 마을을 지키던 노인은 세상을 떠나고 젊은이들은 새로운 학을 기다려요. 전통과 희망을 지키려는 마음을 그려요.|1957년 발표됐어요.
국화 옆에서|서정주는 1915년생 시인이에요.|이 시는 한 편의 시라 줄거리 대신 구성으로 소개해요. 한 송이 국화꽃을 피우기 위해 봄부터 소쩍새가 울고 여름에는 천둥이 우는 과정을 노래해요. 꽃이 피기까지 겪는 시련과 고통의 의미를 이야기해요. 마지막에는 누님처럼 서 있는 꽃을 보며 성숙의 아름다움을 말해요. 반복되는 문장 구조와 상징이 인상적이에요.|1947년 발표됐고 1950년대 시집에 실렸어요.
풀|김수영은 1921년생 시인이에요.|이 시는 한 편의 시라 줄거리 대신 구성으로 소개해요. 풀이 바람보다 먼저 눕고 먼저 일어나 웃는다는 구절로 유명해요. 바람은 억압을, 풀은 민중의 생명력을 상징한다고 해석돼요. 눕고 일어나는 동작이 반복되며 리듬감을 줘요. 겉으로 약해 보이지만 끝내 이기는 힘을 노래해요.|1968년 발표된 작품으로 시인의 마지막 시로 알려져 있어요.
껍데기는 가라|신동엽은 1930년생 시인이에요.|이 시는 한 편의 시라 줄거리 대신 구성으로 소개해요. '껍데기는 가라'를 반복하며 거짓과 허위를 거부해요. 4·19 혁명의 정신과 동학 농민 운동의 정신을 '알맹이'로 내세워요. 한라에서 백두까지 이어지는 민족의 통일을 바라는 마음이 담겨 있어요. 강한 어조와 반복이 특징이에요.|1967년 발표됐어요.
농무|신경림은 1936년생 시인이에요.|이 시는 한 편의 시라 줄거리 대신 구성으로 소개해요. 농민들이 일을 마치고 막걸리를 마시며 탈춤 같은 농무를 추는 모습을 그려요. 가난하고 쓸쓸한 농촌의 현실과 울분이 드러나요. 풍류보다 서러움이 깃든 춤이에요. 같은 이름의 시집 『농무』는 1973년 출간돼 민중시의 대표작이 됐어요.|시 「농무」는 1971년 발표됐어요.
꽃|김춘수는 1922년생 시인이에요.|이 시는 한 편의 시라 줄거리 대신 구성으로 소개해요. '내가 그의 이름을 불러 주기 전에는 그는 다만 하나의 몸짓에 지나지 않았다'로 시작해요. 이름을 불러 주는 행위가 서로에게 의미 있는 존재가 되게 한다고 말해요. 마지막에는 우리 모두 서로에게 잊히지 않는 하나의 눈짓이 되고 싶다고 해요. 존재와 인식, 관계를 노래해요.|1952년 발표됐고 1959년 시집 『꽃의 소묘』에 실렸어요.
오감도|이상은 1910년생 시인이자 소설가예요.|이 시는 15편의 연작 시라 줄거리 대신 구성으로 소개해요. 「시 제1호」는 13인의 아해가 막다른 골목을 질주한다며 불안과 공포를 표현해요. 띄어쓰기를 무시하고 숫자와 기호를 쓰는 등 실험적인 표현이 많아요. 독자들의 항의로 연재가 중단됐어요. 현대인의 불안한 의식을 보여 주는 작품으로 평가돼요.|1934년 조선중앙일보에 연재됐어요.
목마와 숙녀|박인환은 1926년생 시인이에요.|이 시는 한 편의 시라 줄거리 대신 구성으로 소개해요. 버지니아 울프를 떠올리며 지나간 시대의 낭만과 허무를 노래해요. 목마가 숙녀를 싣고 떠났다는 표현이 쓸쓸한 분위기를 만들어요. 전쟁 뒤 상실감과 불안이 깃들어 있어요. 마지막은 세월이 가면 가슴에 남은 이야기로 이어져요.|1955년 발표됐어요.
빼앗긴 들에도 봄은 오는가|이상화는 1901년생 시인이에요.|이 시는 한 편의 시라 줄거리 대신 구성으로 소개해요. 지금은 남의 땅인 들에도 봄이 오는가 묻는 말로 시작해요. 하늘과 들이 푸르지만 화자는 빼앗긴 나라의 현실에 슬퍼해요. 그러나 봄이 와도 우리가 빼앗긴 것을 잊지 않겠다고 다짐해요. 일제강점기 저항 정신이 담긴 대표작이에요.|1926년 발표됐어요.
모란이 피기까지는|김영랑은 1903년생 시인이에요.|이 시는 한 편의 시라 줄거리 대신 구성으로 소개해요. 모란이 피기를 기다리는 마음과 꽃이 지는 순간의 슬픔을 노래해요. '찬란한 슬픔의 봄'이라는 표현이 대표적이에요. 기다림과 상실, 다시 기다림이 반복되는 구조예요. 일제강점기 조국 광복에 대한 소망으로 읽기도 해요.|1934년 발표됐어요.
깃발|유치환은 1908년생 시인이에요.|이 시는 한 편의 시라 줄거리 대신 구성으로 소개해요. '이것은 소리 없는 아우성'이라는 역설적 표현으로 시작해요. 푸른 해원을 향해 흔드는 깃발을 이상향을 향한 동경과 이루지 못하는 슬픔에 비유해요. 맨 끝에서는 순정이라는 이미지로 다가가요. 이상과 현실 사이의 갈등을 노래해요.|1936년 발표됐어요.
흐르는 북|최일남은 1932년생 소설가예요. 소시민의 삶과 전통 문화에 대한 이야기를 많이 썼어요.|평생 북을 치며 떠돌던 민 노인은 늙어서 아들 민대찬의 집에 얹혀 살아요. 아들은 고학으로 자리를 잡은 사람이라 아버지가 북 치는 일을 집안의 체면을 깎는 일로 여겨 말려요. 손자 성규는 할아버지의 삶을 이해하고 학교 탈춤 공연에 나서 달라고 청해요. 민 노인은 아들 내외 몰래 젊은이들과 연습하고 공연에서 솜씨를 보여 줘요. 이 일로 집안에 갈등이 생기고 성규가 시위에 가담했다가 체포되는 일이 벌어져요. 민 노인은 가족 곁에서 더 크게 북을 치며 이야기가 끝나요.|1986년 『문학사상』에 발표됐어요. 전통 예술과 세대 갈등, 소시민의 체면 의식을 다뤄요.
아우를 위하여|황석영은 1943년생 소설가예요.|이 작품은 형 김수남이 군대에 간 아우에게 보내는 편지 형식이에요. 수남은 초등학교 때 서울로 전학 가서 반에서 힘의 논리가 지배하는 모습을 보게 돼요. 반에는 장판석 같은 아이들이 권력을 쥐고 있고 반장은 허수아비에 가까워요. 이영래가 나타나 장판석을 몰락시키고 반 전체를 장악해요. 교생 선생님의 영향으로 반에 변화가 생기고 수남은 정의감에 따라 이영래 무리에 맞서게 돼요. 편지 끝에서 수남은 여러 사람의 무관심이 정의를 짓밟게 해서는 안 된다고 아우에게 말해요.|1972년 작품이에요. 권력의 속성과 집단의 침묵을 우화처럼 보여 줘요.
옥상의 민들레꽃|박완서는 1931년생 소설가예요. 이 작품은 어린이를 위한 이야기로 쓴 단편이에요.|어린 화자의 시선으로 고급 아파트 '궁전아파트' 주민들의 세태를 그려요. 이 아파트에서 할머니들이 자살하는 사건이 잇따르자 주민들은 대책 회의를 열어요. 그런데 어른들은 생명보다 아파트 값이 떨어질까를 더 걱정해요. 화자는 어린 시절 가족이 자신을 사랑하지 않는다고 느껴 옥상에 올라갔다가 시멘트 옥상에 핀 민들레를 보고 마음을 돌린 적이 있어요. 그는 이 경험을 떠올리며 자살을 막을 방법으로 민들레꽃을 생각해요. 이야기는 생명의 소중함을 전하며 끝나요.|1979년 동화집 『달걀은 달걀로 갚으렴』에 실려 출간됐어요. 자살 사건이 나오므로 마음이 힘들 때는 혼자 읽기보다 믿을 수 있는 사람과 이야기하세요.
