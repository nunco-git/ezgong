열린 사회와 그 적들|칼 포퍼는 1902년생 오스트리아 출신 영국 철학자예요.|이 책은 정치철학서라 줄거리 대신 구성으로 소개해요. 포퍼는 플라톤, 헤겔, 마르크스가 닫힌 사회와 전체주의를 정당화했다고 비판해요. 열린 사회는 비판과 합리적 토론을 허용하고 정부를 피를 흘리지 않고 바꿀 수 있는 사회라고 해요. 역사의 필연적 법칙을 믿는 역사주의를 비판해요. 점진적 개혁을 지지해요.|1945년 출간됐어요.
오리엔탈리즘|에드워드 사이드는 1935년생 팔레스타인 출신 미국 학자예요.|이 책은 비평서라 줄거리 대신 구성으로 소개해요. 사이드는 서양이 동양을 타자화하고 열등한 존재로 묘사해 온 담론을 분석해요. 문학, 학문, 여행기가 식민 지배를 정당화하는 데 쓰였다고 해요. 이 담론은 서양의 우월을 확인하는 수단이라고 말해요. 동양에 대한 지식이 곧 권력이라고 말해요.|1978년 출간돼 탈식민주의 연구의 출발점이 됐어요.
문명의 충돌|새뮤얼 헌팅턴은 1927년생 미국 정치학자예요.|이 책은 국제정치서라 줄거리 대신 구성으로 소개해요. 헌팅턴은 냉전 이후 갈등의 중심이 이념이 아니라 문명 사이의 차이가 된다고 예측해요. 서구, 이슬람, 중화, 정교 등 여러 문명권으로 세계를 나눠요. 문명 간 갈등과 협력의 가능성을 분석해요. 서구가 자신의 문명을 지키면서 다른 문명을 인정해야 한다고 해요.|1996년 출간됐고 큰 논쟁을 일으켰어요.
역사|헤로도토스는 기원전 5세기 그리스의 역사가로 역사의 아버지로 불려요.|이 책은 역사서라 줄거리 대신 구성으로 소개해요. 그리스와 페르시아의 전쟁을 중심으로 이집트, 스키타이 등 여러 민족의 풍습과 이야기를 모아요. 마라톤 전투, 테르모필레, 살라미스 해전 등이 나와요. 신화와 전설, 직접 들은 이야기가 섞여 있어요. 전쟁의 원인과 결과를 서술한 최초의 서양 역사서예요.|9권으로 나뉘어 전해져요.
사기|사마천은 기원전 145년경 태어난 전한의 역사가예요.|이 책은 역사서라 줄거리 대신 구성으로 소개해요. 본기, 표, 서, 세가, 열전으로 구성돼 황제부터 일반인까지 다양한 인물을 다뤄요. 전설의 황제 시대부터 한 무제 때까지 약 2천 년의 역사를 담아요. 저자는 궁형이라는 치욕을 견디고 이 책을 완성했어요. 인물의 삶을 중심으로 역사를 서술하는 기전체의 모범이에요.|기원전 91년경 완성된 것으로 알려져 있어요.
삼국사기|김부식은 1075년생 고려의 문신이자 학자예요.|이 책은 역사서라 줄거리 대신 구성으로 소개해요. 신라, 고구려, 백제 삼국의 역사를 본기, 연표, 지, 열전으로 서술해요. 유교적 합리주의 관점에서 쓰여 신화적인 내용은 줄였어요. 김유신, 온달, 설씨녀 같은 인물의 이야기도 열전에 실려 있어요. 현존하는 우리나라 가장 오래된 역사서예요.|1145년경 인종의 명으로 편찬됐어요.
삼국유사|일연은 1206년생 고려 후기의 승려예요.|이 책은 역사·설화서라 줄거리 대신 구성으로 소개해요. 『삼국사기』에 빠진 고조선, 부여 등의 역사와 설화, 향가를 담았어요. 단군 신화, 가락국기, 처용가, 서동요 등이 실려 있어요. 불교와 민간 신앙 이야기가 풍부해요. 고대 문화를 알 수 있는 귀한 자료예요.|13세기 후반에 편찬됐어요.
목민심서|정약용은 1762년생 조선 후기의 실학자예요.|이 책은 지방관의 지침서라 줄거리 대신 구성으로 소개해요. 수령이 지켜야 할 마음가짐과 행정 원칙을 12부 72조로 정리해요. 부임, 율기, 봉공, 애민, 이전, 호전 등을 다뤄요. 백성을 보호하고 청렴하게 다스리라고 강조해요. 정약용이 강진 유배 시절 보고 들은 현실이 바탕이에요.|1818년 완성됐어요.
생각에 관한 생각|대니얼 카너먼은 1934년생 이스라엘 출신 미국 심리학자로 2002년 노벨 경제학상을 받았어요.|이 책은 심리학서라 줄거리 대신 구성으로 소개해요. 카너먼은 사고를 빠르고 직관적인 시스템 1과 느리고 신중한 시스템 2로 나누어 설명해요. 우리 판단이 휴리스틱과 편향에 영향을 받는다고 보여 줘요. 앵커링, 손실 회피, 프레이밍 효과 등을 사례로 소개해요. 합리적 인간 가정이 현실과 다르다고 말해요.|2011년 출간돼 베스트셀러가 됐어요.
넛지|리처드 탈러는 1945년생 미국 행동경제학자로 2017년 노벨 경제학상을 받았어요. 캐스 선스타인은 법학자예요.|이 책은 행동경제학서라 줄거리 대신 구성으로 소개해요. 넛지는 사람의 선택을 강요하지 않고 부드럽게 유도하는 방식을 뜻해요. 기본값 설정, 선택 설계 등으로 사람들이 더 나은 결정을 하도록 도울 수 있다고 해요. 은퇴 저축, 장기 기증, 건강 등의 사례를 들어요. 자유주의적 개입주의를 주장해요.|2008년 출간됐어요.
서양미술사|에른스트 곰브리치는 1909년생 오스트리아 출신 영국의 미술사학자예요.|이 책은 미술사 입문서라 줄거리 대신 구성으로 소개해요. 동굴 벽화에서 현대 미술까지 시대순으로 서양 미술의 흐름을 설명해요. 이집트, 그리스, 중세, 르네상스, 바로크, 인상주의 등을 다뤄요. '미술이란 것은 없고 미술가가 있을 뿐'이라는 말로 시작해요. 쉬운 문체로 일반 독자에게도 사랑받아요.|1950년 출간돼 세계적 스테디셀러가 됐어요.
일리아스|호메로스는 기원전 8세기경 그리스의 시인으로 전해져요.|트로이 전쟁 10년째, 그리스 군의 영웅 아킬레우스는 총사령관 아가멤논과 전리품을 두고 다투고 전투에서 물러나요. 그러자 트로이의 헥토르가 그리스군을 몰아붙여요. 아킬레우스의 친구 파트로클로스가 아킬레우스의 갑옷을 입고 나갔다가 헥토르에게 죽어요. 분노한 아킬레우스는 전투에 복귀해 헥토르를 죽여요. 트로이의 왕 프리아모스가 아들의 시신을 돌려받으며 이야기가 끝나요.|서양 문학의 가장 오래된 서사시 중 하나예요.
신곡|단테 알리기에리는 1265년생 이탈리아 피렌체 출신의 시인이에요.|서른다섯 살의 단테는 어두운 숲에서 길을 잃고 로마 시인 베르길리우스의 안내로 지옥을 지나요. 지옥에서는 죄에 따라 벌을 받는 영혼들을 만나요. 연옥을 거쳐 이르는 곳은 정화의 산이에요. 천국에서는 사랑하는 베아트리체의 안내로 천상의 여러 하늘을 올라 신을 마주해요. 서사시는 구원의 여정을 담아요.|14세기 초에 쓰였고 지옥, 연옥, 천국 3부로 이루어져요.
카라마조프가의 형제들|도스토옙스키의 마지막 장편으로 1880년에 출간됐어요.|방탕한 지주 표도르 카라마조프에게는 장남 드미트리, 차남 이반, 삼남 알료샤, 사생아 스메르쟈코프가 있어요. 드미트리는 아버지와 한 여인을 놓고 다퉈요. 어느 날 표도르가 살해되고 드미트리가 범인으로 지목돼 재판받아요. 이반과 알료샤, 스메르쟈코프의 관계가 얽혀 있어요. 신의 존재, 자유, 죄의 문제가 깊이 다뤄져요.|도스토옙스키가 1881년 세상을 떠나 이 작품이 마지막이 됐어요.
율리시스|제임스 조이스는 1882년생 아일랜드 작가예요.|1904년 6월 16일 하루 동안 더블린에서 광고 외판원 레오폴드 블룸과 청년 스티븐 디덜러스의 하루를 그려요. 블룸은 아내 몰리의 외도를 의식하며 도시를 돌아다녀요. 스티븐은 정신적 아버지를 찾고 있어요. 밤에 두 사람은 우연히 만나 함께 블룸의 집으로 가요. 이야기는 호메로스의 『오디세이아』 구조를 따라요.|1922년 출간됐고 의식의 흐름 기법의 최고봉으로 꼽혀요.
잃어버린 시간을 찾아서|마르셀 프루스트는 1871년생 프랑스 작가예요.|이 작품은 7권으로 이루어진 장편이라 대표적인 장면으로 소개해요. 화자는 마들렌 과자를 홍차에 적셔 먹다가 어린 시절의 콩브레 기억을 떠올려요. 이어 스완의 사랑, 알베르틴과의 관계, 파리 상류 사회의 모습이 펼쳐져요. 세월이 흐르며 화자는 시간의 흔적을 느끼고 예술을 통해 잃어버린 시간을 되찾기로 해요. 기억과 시간이 주제예요.|1913~1927년에 걸쳐 출간됐어요.
고백록|아우구스티누스는 354년생 북아프리카 출신의 기독교 신학자예요.|이 책은 자서전적 신앙 고백이라 줄거리 대신 구성으로 소개해요. 저자는 방탕한 청년기와 마니교 신앙, 수사학 교수 생활을 회상해요. 어머니 모니카의 기도와 밀라노의 암브로시우스를 만나 회심하는 과정이 나와요. 후반부에서는 시간과 기억, 창조에 대해 철학적으로 사색해요. 신 앞에서 자신의 삶을 고백하는 형식이에요.|400년경 쓰였어요.
팡세|블레즈 파스칼은 1623년생 프랑스의 수학자이자 철학자예요.|이 책은 단상 모음이라 줄거리 대신 구성으로 소개해요. 파스칼은 인간을 생각하는 갈대에 비유해요. 인간은 우주에서 약하지만 생각하기 때문에 위대하다고 말해요. 신의 존재를 이성으로 증명하기 어렵지만 믿는 편이 이익이라는 내기를 소개해요. 인간의 비참함과 위대함을 함께 보여 줘요.|저자 사후인 1670년 출간됐어요.
에티카|바뤼흐 스피노자는 1632년생 네덜란드 철학자예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 기하학적 순서로 정의와 공리, 증명을 쌓아 철학 체계를 세워요. 신은 곧 자연이며 만물은 신의 속성이라는 범신론을 펼쳐요. 인간의 감정을 분석해 이성이 감정을 다스릴 수 있다고 말해요. 최고의 행복은 신에 대한 지적인 사랑이라고 결론지어요.|1677년 저자 사후에 출간됐어요.
존재와 시간|마르틴 하이데거는 1889년생 독일 철학자로 20세기 존재론과 현상학에 큰 영향을 줬어요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 하이데거는 '존재란 무엇인가'라는 오래된 물음을 다시 던져요. 이를 묻는 존재자인 인간을 '현존재'라 부르고 그 삶의 구조를 분석해요. 세계 안에 던져진 존재, 일상의 평균적 삶, 불안, 죽음을 향한 존재 같은 개념이 나와요. 시간성이 현존재의 존재 의미라고 말해요. 책은 계획된 구상 중 일부만 완성된 미완의 저작이에요.|1927년 출간됐고 사르트르 등 실존철학에 영향을 줬어요. 저자가 나치에 협력한 이력은 평가에서 늘 논쟁이 돼요.
제2의 성|시몬 드 보부아르는 1908년생 프랑스 철학자이자 작가예요.|이 책은 여성론이라 줄거리 대신 구성으로 소개해요. 1권에서는 생물학, 정신분석, 역사, 신화가 여성을 어떻게 규정해 왔는지 살펴봐요. 2권에서는 어린 시절부터 결혼, 모성, 노년까지 여성이 겪는 실제 삶을 분석해요. '사람은 여성으로 태어나는 것이 아니라 여성이 되는 것'이라는 유명한 문장이 여기서 나와요. 여성은 남성에 대한 타자로 규정돼 왔다고 말해요. 여성이 자유로운 주체가 되어야 한다고 주장해요.|1949년 출간돼 현대 페미니즘의 고전이 됐어요.
예루살렘의 아이히만|한나 아렌트는 1906년생 독일 출신의 미국 정치철학자로 유대인이에요.|이 책은 재판 참관기라 줄거리 대신 구성으로 소개해요. 아렌트는 나치 전범 아돌프 아이히만의 1961년 예루살렘 재판을 취재해요. 그는 악마가 아니라 명령에 순응하고 생각하지 않은 평범한 관료였다고 묘사해요. 여기서 '악의 평범성'이라는 개념이 나와요. 유대인 지도부의 협력 문제도 언급해 큰 논란을 일으켰어요. 책은 악이 어떻게 평범한 사람을 통해 일어나는지 묻게 해요.|1963년 출간됐고 지금도 논쟁이 이어져요.
논리철학논고|루트비히 비트겐슈타인은 1889년생 오스트리아 출신의 철학자예요.|이 책은 번호가 붙은 짧은 명제들로 이루어져 줄거리 대신 구성으로 소개해요. 언어는 세계의 그림이며 명제는 사실을 그린다고 말해요. 말할 수 있는 것은 명백히 말할 수 있고 말할 수 없는 것에 대해서는 침묵해야 한다고 해요. 철학의 문제 대부분은 언어를 오해해서 생긴 것이라고 봐요. 저자는 이 책으로 철학의 문제를 모두 해결했다고 여겼어요.|1921년 독일어로, 1922년 영어판이 나왔어요. 후기에 저자는 자기 견해를 크게 고쳤어요.
장자|장자는 전국시대 중국의 사상가로 도가 철학을 대표해요. 본명은 장주예요.|이 책은 우화와 사색을 엮은 글이라 줄거리 대신 구성으로 소개해요. 내편, 외편, 잡편으로 나뉘며 내편이 장자 본인의 사상에 가깝다고 알려져 있어요. 나비가 된 꿈을 꾼 뒤 자신이 나비 꿈을 꾼 것인지 나비가 자신의 꿈을 꾼 것인지 모르겠다는 호접지몽이 유명해요. 쓸모없음이 오히려 쓸모가 된다는 이야기, 소를 잡는 포정의 이야기도 나와요. 사물을 상대적으로 보고 자유롭게 노닐라고 말해요.|노자와 함께 도가 사상의 중심이에요.
한비자|한비는 전국시대 말기 한나라 공자 출신의 사상가로 법가를 집대성했어요.|이 책은 정치철학서라 줄거리 대신 구성으로 소개해요. 법, 술, 세를 군주가 갖춰야 할 통치 수단이라고 말해요. 상과 벌을 분명히 하면 나라가 다스려진다고 주장해요. 수주대토, 모순 같은 우화로 어리석음을 일깨워요. 인간은 이익에 따라 움직이므로 도덕보다 제도로 다스려야 한다고 해요. 한비는 진시황이 그의 글을 읽고 감탄했으나 결국 감옥에서 죽은 것으로 전해져요.|진나라의 통일에 영향을 준 사상으로 평가돼요.
자기만의 방|버지니아 울프는 1882년생 영국 작가예요.|이 책은 에세이라 줄거리 대신 구성으로 소개해요. 울프는 여성이 소설을 쓰려면 돈과 자기만의 방이 필요하다고 주장해요. 대영박물관과 대학의 풍경을 거닐며 왜 여성 작가가 드물었는지 따져요. 셰익스피어에게 재능 있는 누이가 있었다면 어떻게 되었을까 하는 상상을 들려줘요. 여성이 경제적으로 독립해야 한다고 강조해요.|1929년 출간됐고 두 차례의 케임브리지 대학 여자 칼리지 강연이 바탕이에요.
고용·이자 및 화폐의 일반이론|존 메이너드 케인스는 1883년생 영국 경제학자예요.|이 책은 경제학서라 줄거리 대신 구성으로 소개해요. 케인스는 고전파와 달리 시장이 스스로 완전고용을 달성하지 못할 수 있다고 말해요. 유효수요가 부족하면 불황과 실업이 계속된다고 설명해요. 정부가 재정 지출과 금리 정책으로 수요를 늘려야 한다고 주장해요. 소비 성향, 투자 승수, 유동성 선호 같은 개념이 나와요.|1936년 출간돼 거시경제학의 출발점이 됐어요.
노예의 길|프리드리히 하이에크는 1899년생 오스트리아 출신의 경제학자로 1974년 노벨 경제학상을 받았어요.|이 책은 정치경제서라 줄거리 대신 구성으로 소개해요. 하이에크는 정부가 경제를 계획하고 통제하려 하면 개인의 자유가 줄어든다고 경고해요. 중앙 계획은 필요한 지식을 모두 알 수 없다고 비판해요. 전체주의로 이어지는 길이 선의에서 시작될 수 있다고 말해요. 법의 지배와 시장 경쟁이 자유를 지킨다고 강조해요.|1944년 출간돼 신자유주의 사상에 영향을 줬어요.
미국의 민주주의|알렉시 드 토크빌은 1805년생 프랑스의 정치사상가예요.|이 책은 여행 기록이자 정치 분석서라 줄거리 대신 구성으로 소개해요. 토크빌은 1830년대 미국을 9개월간 여행하며 민주주의 사회를 관찰해요. 평등의 확산이 시대의 흐름이며 미국이 그 모습을 가장 잘 보여 준다고 봐요. 지방 자치, 결사의 자유, 언론이 민주주의를 지탱한다고 설명해요. 한편 다수의 폭정과 개인주의의 위험을 경고해요.|1권은 1835년, 2권은 1840년 출간됐어요.
법의 정신|몽테스키외는 1689년생 프랑스의 계몽사상가예요.|이 책은 정치·법학서라 줄거리 대신 구성으로 소개해요. 정부 형태를 공화정, 군주정, 전제정으로 나누고 각각의 원리를 분석해요. 법은 기후, 풍습, 종교 등 여러 조건과 관련된다고 설명해요. 입법, 행정, 사법의 권력이 서로 견제해야 자유가 지켜진다는 삼권분립을 제시해요. 이 생각은 이후 여러 나라의 헌법에 영향을 줬어요.|1748년 출간됐어요.
구별짓기|피에르 부르디외는 1930년생 프랑스 사회학자예요.|이 책은 사회학 연구서라 줄거리 대신 구성으로 소개해요. 부르디외는 취향이 개인의 자연스러운 선택이 아니라 사회적 계급과 연결된다고 분석해요. 경제자본뿐 아니라 문화자본, 사회자본이 지위를 만든다고 설명해요. 아비투스라는 개념으로 몸에 밴 성향을 이야기해요. 음악, 음식, 그림 같은 취향으로 사람들이 서로를 구별하고 지배 구조를 재생산한다고 말해요.|1979년 프랑스에서 출간됐어요.
시뮬라시옹|장 보드리야르는 1929년생 프랑스 사회학자이자 철학자예요.|이 책은 이론서라 줄거리 대신 구성으로 소개해요. 보드리야르는 현대 사회에서는 실재가 사라지고 이미지가 실재를 대신한다고 말해요. 원본 없는 복제물을 시뮬라크르라고 불러요. 디즈니랜드, 미디어, 걸프전 같은 예가 나와요. 이미지와 기호의 소비가 현실보다 더 현실처럼 느껴지는 하이퍼리얼리티를 설명해요.|1981년 출간됐어요. 영화 매트릭스에도 영향을 줬다고 알려져 있어요.
공정하다는 착각|마이클 샌델의 책이에요. 샌델은 1953년생 미국 정치철학자예요.|이 책은 사회비평서라 줄거리 대신 구성으로 소개해요. 능력주의가 노력한 사람이 성공한다는 약속으로 공정한 사회를 만든다고 하지만 오히려 불평등을 정당화한다고 비판해요. 성공한 사람은 오만해지고 실패한 사람은 굴욕을 느낀다고 해요. 대학 입시, 학벌, 일의 존엄성 문제를 다뤄요. 공동선과 노동의 인정이 필요하다고 주장해요.|2020년 출간됐어요.
로마 제국 쇠망사|에드워드 기번은 1737년생 영국의 역사가예요.|이 책은 역사서라 줄거리 대신 구성으로 소개해요. 2세기 로마의 전성기부터 1453년 콘스탄티노폴리스 함락까지 약 1,300년을 다뤄요. 기번은 쇠망의 원인으로 내부의 부패, 시민 덕성의 쇠퇴, 군대의 용병화, 기독교의 확산을 들어요. 이 중 기독교에 대한 평가가 큰 논란이 됐어요. 유려한 문체로도 유명해요.|1776~1788년 6권으로 출간됐어요.
펠로폰네소스 전쟁사|투키디데스는 기원전 5세기 아테네의 역사가이자 장군이에요.|이 책은 역사서라 줄거리 대신 구성으로 소개해요. 아테네와 스파르타가 맞붙은 기원전 431~404년 전쟁을 서술해요. 저자는 직접 겪은 사건을 바탕으로 연설문과 전투 기록을 정리해요. 신의 개입 없이 인간의 이해관계와 권력에서 원인을 찾아요. 페리클레스의 추도 연설, 멜로스 대화가 유명해요. 책은 전쟁 도중에 끊겨 미완으로 남았어요.|국제정치학에서 현실주의의 원형으로 읽혀요.
갈리아 전기|율리우스 카이사르는 기원전 100년경 태어난 로마의 장군이자 정치가예요.|이 책은 전쟁 기록이라 줄거리 대신 구성으로 소개해요. 카이사르가 기원전 58~50년 갈리아 지방을 정복한 과정을 7권으로 서술해요. 헬베티족, 게르만족, 브리타니아 원정 등이 나와요. 베르킨게토릭스가 이끈 갈리아 연합군과의 알레시아 전투가 하이라이트예요. 자신을 3인칭으로 칭하며 간결하고 명료한 문체로 써요. 정치적 선전의 성격도 있어요.|기원전 50년경 쓰였어요.
역사의 연구|아널드 토인비는 1889년생 영국의 역사학자예요.|이 책은 역사서라 줄거리 대신 구성으로 소개해요. 토인비는 역사의 단위를 국가가 아니라 문명으로 보고 20여 개 문명을 비교해요. 문명은 도전에 성공적으로 응전하며 성장하고 응전에 실패하면 쇠퇴한다는 '도전과 응전' 이론을 세워요. 창조적 소수가 문명을 이끌다가 지배적 소수로 변하면 쇠퇴가 온다고 말해요. 방대한 분량으로 유명해요.|1934~1961년 12권으로 출간됐어요.
프린키피아|아이작 뉴턴은 1643년생 영국의 물리학자이자 수학자예요.|이 책은 과학서라 줄거리 대신 구성으로 소개해요. 뉴턴은 운동의 세 가지 법칙을 정리해요. 이어 만유인력의 법칙을 제시하고 행성의 운동과 조수 현상을 설명해요. 수학적 증명을 중심으로 서술돼 있어요. 하늘과 땅의 운동을 하나의 법칙으로 설명했다는 점이 혁명적이었어요.|1687년 라틴어로 출간됐어요.
두 우주 체계에 관한 대화|갈릴레오 갈릴레이는 1564년생 이탈리아의 천문학자이자 물리학자예요.|이 책은 대화체 과학서라 줄거리 대신 구성으로 소개해요. 살비아티, 사그레도, 심플리치오 세 사람이 나흘간 토론하는 형식이에요. 살비아티는 코페르니쿠스의 지동설을, 심플리치오는 아리스토텔레스와 프톨레마이오스의 천동설을 대변해요. 조수 이론, 낙하 운동 등을 논의해요. 이 책 때문에 갈릴레오는 종교재판에 회부돼요.|1632년 출간됐어요.
파인만 씨, 농담도 잘하시네!|리처드 파인만은 1918년생 미국의 물리학자로 1965년 노벨 물리학상을 받았어요.|이 책은 자서전적 일화 모음이라 줄거리 대신 구성으로 소개해요. 파인만이 어린 시절 라디오를 고치던 이야기에서 시작해요. 맨해튼 프로젝트에서 금고를 따던 일화, 브라질에서의 교육 경험이 나와요. 봉고 연주와 그림 그리기 등 다양한 호기심도 소개해요. 과학자의 유머와 장난기가 가득해요.|1985년 출간됐어요. 랠프 레이턴이 파인만과의 대화를 정리했어요.
통섭|에드워드 윌슨은 1929년생 미국의 생물학자로 사회생물학을 개척했어요.|이 책은 학문론이라 줄거리 대신 구성으로 소개해요. 윌슨은 자연과학과 인문학, 사회과학이 하나의 지식으로 통합될 수 있다고 주장해요. 이를 '통섭'이라고 불러요. 계몽주의 이후의 지식 통합의 역사를 살펴보고 윤리, 예술, 종교도 과학의 관점에서 설명하려 해요. 학문 간 장벽을 넘어야 한다고 말해요.|1998년 출간됐어요. 환원주의라는 비판도 있어요.
전쟁과 평화|레프 톨스토이는 1828년생 러시아의 작가예요.|나폴레옹 전쟁기 러시아 귀족 가문들의 삶을 그려요. 순수하지만 방황하는 피에르, 이상을 좇는 안드레이 공작, 활달한 나타샤가 중심 인물이에요. 안드레이와 나타샤의 사랑은 시련을 겪어요. 1812년 나폴레옹의 침공과 보로디노 전투, 모스크바 화재가 이야기의 중요한 배경이에요. 전쟁을 겪으며 인물들은 삶의 의미를 새롭게 깨닫게 돼요.|1869년에 완성됐어요. 역사 철학을 다룬 대목이 길게 이어져요.
마의 산|토마스 만은 1875년생 독일 작가로 1929년 노벨 문학상을 받았어요.|청년 한스 카스토르프는 사촌 문병차 스위스 다보스의 결핵 요양원에 3주 일정으로 와요. 그는 곧 자신도 병에 걸렸다는 진단을 받고 머물러요. 요양원에서 합리주의자 세템브리니와 급진적인 나프타를 만나 사상적 토론을 해요. 쇼샤 부인에 대한 사랑을 겪고 시간 감각을 잃은 채 7년을 보내요. 제1차 세계대전이 터지자 산을 내려가 전장에 서요.|1924년 출간된 교양소설의 대표작이에요.
캉디드|볼테르는 1694년생 프랑스의 계몽사상가이자 작가예요.|순진한 청년 캉디드는 스승 팡글로스에게서 '이 세상은 가능한 한 최선의 세계'라고 배워요. 그는 사랑하는 퀴네공드와 함께 지내다 성에서 쫓겨나요. 전쟁, 지진, 종교재판 같은 재앙을 겪으며 세계 곳곳을 떠돌아요. 낙천주의에 대한 믿음이 흔들려도 그는 퀴네공드와 재회해요. 마지막에는 '우리의 정원을 가꿔야 한다'는 결론에 이르러요.|1759년 출간된 풍자 소설이에요.
데카메론|조반니 보카치오는 1313년생 이탈리아 작가예요.|흑사병을 피해 피렌체 교외의 별장에 모인 젊은 남녀 열 명이 열흘 동안 하루에 한 편씩 이야기를 해요. 모두 100편의 이야기가 이어져요. 사랑, 재치, 운명, 성직자의 위선 등을 다뤄요. 어떤 이야기는 해학적이고 어떤 이야기는 비극적이에요. 중세에서 르네상스로 넘어가는 시대 분위기를 보여 줘요.|14세기 중반 완성됐어요.
오디세이아|호메로스의 서사시예요. 호메로스는 기원전 8세기경 그리스의 시인으로 전해져요.|트로이 전쟁이 끝난 뒤 이타카의 왕 오디세우스는 고향으로 돌아가는 데 10년이 걸려요. 그는 외눈박이 키클롭스, 마녀 키르케, 세이렌의 노래 같은 위험을 겪어요. 그동안 아내 페넬로페는 구혼자들에게 시달리며 남편을 기다려요. 아들 텔레마코스도 아버지를 찾아 나서요. 오디세우스는 거지로 변장해 돌아와 구혼자들을 물리치고 가족과 재회해요.|서양 문학의 가장 오래된 서사시 중 하나예요.
향연|플라톤의 대화편이에요. 플라톤은 소크라테스의 제자예요.|이 책은 대화편이라 줄거리 대신 구성으로 소개해요. 비극 시인 아가톤의 승리를 축하하는 잔치에서 사람들이 사랑의 신 에로스를 찬양하는 연설을 해요. 아리스토파네스는 인간이 원래 둘이 붙은 존재였다는 이야기를 해요. 소크라테스는 무녀 디오티마에게 배운 사랑의 단계를 전해요. 아름다운 몸에서 시작해 아름다움 그 자체로 오르는 사랑을 설명해요. 마지막에는 술에 취한 알키비아데스가 나타나 소크라테스를 이야기해요.|기원전 380년경 쓰였어요.
파이돈|플라톤의 대화편이에요.|이 책은 대화편이라 줄거리 대신 구성으로 소개해요. 소크라테스가 독배를 마시기 전 마지막 날 제자들과 영혼의 불멸에 관해 대화해요. 철학자는 죽음을 두려워하지 않고 영혼이 몸에서 풀려나는 것을 기뻐해야 한다고 말해요. 영혼 불멸을 위한 논증으로 반대 개념의 순환, 상기설, 이데아론 등이 나와요. 마지막에는 소크라테스가 담담하게 독약을 마셔요. 제자들은 슬퍼하며 스승을 지켜봐요.|기원전 4세기에 쓰였어요.
명상록|마르쿠스 아우렐리우스는 121년생 로마 황제로 스토아 철학자예요.|이 책은 황제가 자신에게 쓴 글이라 줄거리 대신 구성으로 소개해요. 전쟁터에서 쓴 개인적 일기로 12권으로 나뉘어요. 죽음과 시간의 덧없음, 의무에 충실한 삶, 이성에 따르는 삶을 되풀이해 다짐해요. 외부 사건은 통제할 수 없지만 그에 대한 판단은 스스로 정할 수 있다고 말해요. 우주와 공동체의 일원으로서 선하게 살라고 해요.|180년 사망 전에 쓰였어요.
정치학|아리스토텔레스는 기원전 384년생 고대 그리스 철학자예요.|이 책은 정치철학서라 줄거리 대신 구성으로 소개해요. 인간은 본성적으로 정치적 동물이라고 말해요. 국가는 가정과 마을을 거쳐 공동선을 위해 이루어진다고 설명해요. 정치 체제를 군주정, 귀족정, 혼합정과 그 타락한 형태로 나눠 분석해요. 중산층이 많은 혼합정이 가장 안정적이라고 봐요.|기원전 4세기에 쓰였어요.
공리주의|존 스튜어트 밀은 1806년생 영국의 철학자예요.|이 책은 윤리학서라 줄거리 대신 구성으로 소개해요. 밀은 행복을 늘리는 행위가 옳고 불행을 늘리는 행위가 그르다는 공리의 원리를 설명해요. 스승 벤담과 달리 쾌락에 질적인 차이가 있다고 봐요. '만족한 바보보다 불만족한 소크라테스가 낫다'는 말로 유명해요. 정의와 공리의 관계도 논해요.|1861년 출간됐어요.
비극의 탄생|프리드리히 니체는 1844년생 독일의 철학자예요.|이 책은 예술론이라 줄거리 대신 구성으로 소개해요. 니체는 그리스 비극이 아폴론적 요소와 디오니소스적 요소의 결합에서 나왔다고 설명해요. 아폴론은 질서와 형상을, 디오니소스는 도취와 충동을 상징해요. 소크라테스의 합리주의가 비극을 쇠퇴시켰다고 비판해요. 바그너의 음악에서 비극의 부활을 기대했어요.|1872년 출간됐어요.
계몽의 변증법|테오도어 아도르노와 막스 호르크하이머는 독일 프랑크푸르트학파의 철학자예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 두 저자는 이성으로 자연을 지배하려던 계몽이 오히려 새로운 야만으로 돌아간다고 비판해요. 오디세우스의 이야기를 통해 이성의 도구화를 분석해요. 문화산업이 대중을 기만하고 순응하게 한다고 말해요. 반유대주의 분석도 포함돼요.|1944년 집필, 1947년 출간됐어요.
유토피아|토머스 모어는 1478년생 영국의 인문주의자이자 정치가예요.|이 책은 사회 풍자서라 줄거리 대신 구성으로 소개해요. 라파엘 히슬로다이라는 선원이 유토피아 섬에서 본 사회를 이야기해요. 그곳에서는 사유재산이 없고 모든 사람이 노동하며 하루 6시간만 일해요. 화폐는 가치가 없고 종교의 자유가 허용돼요. 반면 당시 영국의 인클로저와 빈곤을 비판해요.|1516년 출간됐고 '유토피아'라는 말이 여기서 나왔어요.
유한계급론|소스타인 베블런은 1857년생 미국의 경제학자이자 사회학자예요.|이 책은 사회비평서라 줄거리 대신 구성으로 소개해요. 베블런은 노동하지 않고 재산을 과시하는 유한계급을 분석해요. 필요 이상의 소비로 지위를 드러내는 과시적 소비 개념을 제시해요. 사치는 사회적 위신을 얻는 수단이라고 말해요. 가격이 오를수록 수요가 느는 베블런 효과의 바탕이 됐어요.|1899년 출간됐어요.
거대한 전환|칼 폴라니는 1886년생 헝가리 출신의 경제학자이자 사회학자예요.|이 책은 경제사 연구서라 줄거리 대신 구성으로 소개해요. 폴라니는 자기조정 시장이 사회를 파괴한다고 주장해요. 노동, 토지, 화폐를 상품으로 취급하는 것이 사회에 큰 충격을 준다고 말해요. 이에 대한 사회의 자기보호 운동이 일어나고 이는 20세기의 위기로 이어졌다고 설명해요. 시장은 사회에 뿌리내려야 한다고 봐요.|1944년 출간됐어요.
국가는 왜 실패하는가|대런 애스모글루와 제임스 로빈슨은 경제학자예요. 애스모글루는 2024년 노벨 경제학상을 받았어요.|이 책은 정치경제서라 줄거리 대신 구성으로 소개해요. 국가의 번영과 빈곤은 지리나 문화가 아니라 제도에서 갈린다고 주장해요. 포용적 제도는 많은 사람의 참여와 재산권을 보장해 성장을 이끌어요. 착취적 제도는 소수 엘리트가 이익을 독점해 정체를 낳아요. 한국과 북한, 미국의 노갈레스 도시 등의 사례를 비교해요.|2012년 출간됐어요.
상상의 공동체|베네딕트 앤더슨은 1936년생 아일랜드계 미국 정치학자예요.|이 책은 민족주의 연구서라 줄거리 대신 구성으로 소개해요. 앤더슨은 민족을 직접 만난 적 없는 사람들이 같은 공동체라고 상상하는 것이라고 설명해요. 인쇄 자본주의, 곧 신문과 소설의 보급이 이러한 상상을 가능하게 했다고 말해요. 식민지의 지도, 인구조사, 박물관도 영향을 줬다고 분석해요. 민족주의의 기원을 사회적 구성물로 봐요.|1983년 출간됐어요.
위험사회|울리히 벡은 1944년생 독일의 사회학자예요.|이 책은 사회학서라 줄거리 대신 구성으로 소개해요. 벡은 현대 사회가 산업화의 부산물인 위험을 스스로 만들어 낸다고 말해요. 원자력, 화학 오염, 기후변화 같은 위험은 계급과 국경을 넘어 모두에게 닥친다고 해요. 부의 분배 대신 위험의 분배가 사회의 중심 문제가 된다고 설명해요. 근대화가 스스로를 성찰해야 한다고 주장해요.|1986년 출간됐고 체르노빌 사고 직후라 더 주목받았어요.
피로사회|한병철은 1959년생 한국 출신의 독일 철학자예요.|이 책은 철학 에세이라 줄거리 대신 구성으로 소개해요. 한병철은 오늘날을 '성과사회'라고 부르며 규율사회와 구별해요. 명령 대신 '할 수 있다'는 긍정성이 사람을 스스로 착취하게 한다고 말해요. 그 결과 우울증, 번아웃 같은 병리가 나타난다고 분석해요. 깊은 사색과 휴식의 중요성을 이야기해요.|2010년 독일에서 출간됐고 한국에서도 큰 반향을 얻었어요.
슬픈 열대|클로드 레비스트로스는 1908년생 프랑스의 인류학자예요.|이 책은 여행기이자 인류학 에세이라 줄거리 대신 구성으로 소개해요. 저자는 1930년대 브라질 아마존 지역의 원주민 부족을 조사한 경험을 풀어내요. 카두베오, 보로로, 남비콰라족 등을 만난 이야기가 나와요. 서구 문명의 우월성에 대한 의문과 문명 접촉의 비극을 성찰해요. 자서전적인 요소가 강해요.|1955년 출간됐어요.
국화와 칼|루스 베네딕트는 1887년생 미국의 문화인류학자예요.|이 책은 일본 문화 연구서라 줄거리 대신 구성으로 소개해요. 저자는 제2차 세계대전 중 미국 정부의 의뢰로 일본인의 행동 양식을 분석해요. 일본인은 국화로 상징되는 미적 감각과 칼로 상징되는 무사 정신을 함께 지닌다고 말해요. 은혜, 의리, 수치를 중심으로 하는 문화를 설명해요. 서구의 죄의식 문화와 대비돼요.|1946년 출간됐어요. 저자가 일본에 가지 않고 쓴 점이 한계로 지적돼요.
상식|토머스 페인은 1737년생 영국 출신의 사상가로 미국 독립 혁명에 참여했어요.|이 책은 정치 팸플릿이라 줄거리 대신 구성으로 소개해요. 페인은 쉬운 말로 식민지 사람들에게 영국에서 독립해야 한다고 호소해요. 군주제와 세습 제도를 비판하고 공화정을 지지해요. 대륙이 섬에 의해 통치되는 것은 부자연스럽다고 말해요. 이 글은 많은 사람에게 읽혀 독립 여론을 모으는 데 크게 기여했어요.|1776년 1월 익명으로 출간됐어요.
프랑스 혁명에 관한 성찰|에드먼드 버크는 1729년생 아일랜드 출신의 영국 정치가이자 사상가예요.|이 책은 정치 평론이라 줄거리 대신 구성으로 소개해요. 버크는 프랑스 혁명이 전통과 관습을 무시하고 추상적 이념에 따라 사회를 바꾸려 한다고 비판해요. 사회는 과거와 현재와 미래 세대가 맺은 계약이라고 말해요. 점진적 개혁을 지지하고 급격한 변혁의 위험을 경고해요. 이후 보수주의의 고전이 됐어요.|1790년 출간됐어요.
플루타르코스 영웅전|플루타르코스는 46년경 태어난 그리스의 저술가로 로마 제국 시대에 활동했어요.|이 책은 전기 모음집이라 줄거리 대신 구성으로 소개해요. 그리스 인물과 로마 인물을 한 쌍씩 짝지어 비교하는 방식으로 서술해요. 테세우스와 로물루스, 알렉산드로스와 카이사르, 데모스테네스와 키케로 등이 나와요. 인물의 성격과 덕성을 일화로 보여 줘요. 셰익스피어 등 많은 작가에게 영감을 줬어요.|흔히 『대비열전』 또는 『영웅전』이라 불려요.
동방견문록|마르코 폴로는 1254년경 태어난 베네치아 상인이에요.|이 책은 여행기라 줄거리 대신 구성으로 소개해요. 마르코 폴로가 아버지, 삼촌과 함께 중앙아시아를 지나 몽골 제국의 쿠빌라이 칸 궁정에 이르기까지의 여정을 서술해요. 중국 각지와 인도, 일본에 대한 이야기가 나와요. 제노바 감옥에서 루스티켈로에게 구술해 기록됐어요. 사실과 과장이 섞여 있다는 논란도 있어요.|13세기 말에 쓰였고 서양인의 동방에 대한 호기심을 키웠어요.
하멜 표류기|헨드릭 하멜은 1630년생 네덜란드 출신의 선원이에요.|이 책은 표류 기록이라 줄거리 대신 구성으로 소개해요. 하멜은 동인도회사 소속 선박 스페르베르호를 타고 가다가 1653년 제주도 해안에서 난파돼요. 조선에 억류되어 약 13년간 지내며 서울, 전라도 등에서 생활해요. 1666년 일본 나가사키로 탈출해요. 이후 조선의 지리, 풍속, 제도를 보고서로 정리해요.|1668년 네덜란드에서 출간됐어요.
택리지|이중환은 1690년생 조선 후기의 실학자예요.|이 책은 인문지리서라 줄거리 대신 구성으로 소개해요. 사민총론, 팔도총론, 복거총론, 총론으로 이루어져요. 살기 좋은 땅의 조건으로 지리, 생리, 인심, 산수를 꼽아요. 팔도의 지세와 풍속, 인심을 비교해 설명해요. 당쟁으로 관직에서 물러난 뒤 각지를 돌아다니며 쓴 것으로 알려져 있어요.|1751년경 완성된 것으로 전해져요.
북학의|박제가는 1750년생 조선 후기의 실학자로 북학파의 대표예요.|이 책은 개혁론이라 줄거리 대신 구성으로 소개해요. 박제가는 청나라를 다녀온 경험을 바탕으로 수레, 벽돌, 기와 등의 사용을 늘리자고 주장해요. 상업과 무역을 활성화하고 선진 기술을 배우자고 말해요. 양반도 농사와 장사에 종사해야 한다고 해요. 성리학적 질서에서 벗어난 개혁 의식이 보여요.|1778년 쓰였어요.
천구의 회전에 관하여|니콜라우스 코페르니쿠스는 1473년생 폴란드 출신의 천문학자이자 성직자예요.|이 책은 천문학서라 줄거리 대신 구성으로 소개해요. 코페르니쿠스는 우주의 중심이 지구가 아니라 태양이라는 지동설을 체계적으로 설명해요. 지구가 하루에 한 번 자전하고 일 년에 한 번 태양 주위를 돈다고 말해요. 행성의 겉보기 역행 운동이 이 모형으로 더 단순하게 설명된다고 해요. 6권으로 이루어지며 수학적 계산이 많아요.|1543년 저자가 세상을 떠나던 해에 출간됐어요. '코페르니쿠스적 전환'이라는 말의 어원이 됐어요.
원론|유클리드는 기원전 300년경 알렉산드리아에서 활동한 그리스의 수학자예요. 생애는 자세히 알려지지 않았어요.|이 책은 수학서라 줄거리 대신 구성으로 소개해요. 점, 선, 면 같은 정의와 공리, 공준에서 출발해 정리를 하나씩 증명해 나가요. 13권에 평면기하, 비례, 수론, 입체기하 등이 담겨 있어요. 논리적으로 증명하는 방식은 이후 수학과 과학의 모범이 됐어요. 평행선 공준은 훗날 비유클리드 기하학을 낳는 계기가 됐어요.|2천 년 넘게 기하학 교과서로 쓰였어요.
생명이란 무엇인가|에르빈 슈뢰딩거는 1887년생 오스트리아의 물리학자로 1933년 노벨 물리학상을 받았어요.|이 책은 강연을 엮은 과학서라 줄거리 대신 구성으로 소개해요. 슈뢰딩거는 물리학의 눈으로 생명 현상을 설명하려 해요. 유전 정보가 비주기적 결정 같은 분자에 저장되어 있을 것이라고 예측해요. 생명은 주변에서 '음의 엔트로피'를 얻어 질서를 유지한다고 말해요. 이 생각은 이후 분자생물학자들에게 영감을 줬어요.|1944년 출간됐어요.
실낙원|존 밀턴은 1608년생 영국의 시인이에요. 말년에 시력을 잃은 채 이 작품을 구술했어요.|하나님에게 반역하다 쫓겨난 천사 사탄은 지옥에서 일어나 복수를 결심해요. 그는 새로 만들어진 인간을 유혹하려고 에덴동산에 숨어들어요. 뱀의 모습으로 이브를 속여 선악과를 먹게 하고 아담도 함께 먹어요. 두 사람은 죄를 짓고 낙원에서 쫓겨나요. 하지만 하나님은 훗날 구원이 올 것이라는 희망을 남겨요.|1667년 처음 나왔고 1674년 12권으로 개정됐어요. 사탄의 묘사가 매력적이라는 평도 유명해요.
아이네이스|베르길리우스는 기원전 70년생 로마의 시인이에요.|트로이가 함락된 뒤 영웅 아이네이아스는 아버지와 아들을 데리고 도시를 탈출해요. 그는 신들의 명령에 따라 새로운 땅을 찾아 지중해를 떠돌아요. 카르타고에서 여왕 디도와 사랑에 빠지지만 사명 때문에 떠나고 디도는 스스로 목숨을 끊어요. 그는 저승을 다녀온 뒤 이탈리아에 도착해 라티움 사람들과 싸워 승리해요. 이 후손이 훗날 로마를 세운다는 이야기로 끝나요.|기원전 19년경 사망하면서 미완성으로 남았어요. 로마 건국 서사시로 평가돼요.
겐지 이야기|무라사키 시키부는 헤이안 시대 일본의 궁정 여성 작가예요.|빛나는 왕자 히카루 겐지는 천황의 아들이지만 신분 때문에 신하가 돼요. 그는 어머니를 닮은 후지쓰보를 연모하고 여러 여인과 사랑을 나누어요. 정치적으로 위기를 맞아 유배되었다가 돌아와 영화를 누려요. 말년에는 아내 무라사키노우에의 죽음 등으로 허무함을 느껴요. 그가 죽은 뒤에는 후손의 이야기가 이어져요.|11세기 초에 쓰였고 세계 최초의 장편 소설 중 하나로 꼽혀요.
홍루몽|조설근은 1715년경 태어난 청나라 작가예요. 집안의 몰락을 겪은 경험이 작품에 반영됐다고 해요.|명문 가문 가씨 집안의 아들 가보옥은 사촌 누이 임대옥을 사랑해요. 하지만 집안은 보옥을 설보차와 혼인시키려 해요. 대옥은 병과 슬픔 속에 세상을 떠나요. 가문은 부패와 사치로 몰락하고 보옥은 세속을 떠나요. 수많은 인물과 사건으로 한 가문의 영화와 쇠락을 그려요.|18세기에 쓰였고 중국 4대 고전 소설의 하나예요. 뒷부분은 다른 사람이 이었다고 알려져 있어요.
에밀|장자크 루소는 1712년생 제네바 출신 사상가예요.|이 책은 교육 소설이자 교육론이라 줄거리 대신 구성으로 소개해요. 가상의 아이 에밀을 태어날 때부터 성인이 될 때까지 가정교사가 기르는 형식이에요. 아이는 어른의 축소판이 아니라 자연의 발달 단계를 따라야 한다고 말해요. 책이 아니라 경험으로 배우게 해야 한다는 주장을 펼쳐요. 마지막 권에서는 여성 소피의 교육을 다루는데 시대적 한계로 비판받아요.|1762년 출간됐고 금서로 지정되기도 했어요.
인간 불평등 기원론|장자크 루소의 글이에요.|이 책은 논문이라 줄거리 대신 구성으로 소개해요. 루소는 자연 상태의 인간은 자유롭고 서로 평등했다고 가정해요. 사유재산이 생기고 사회가 발전하면서 불평등이 커졌다고 설명해요. 이를 합법화한 것이 부자의 이익을 지키는 정치 사회라고 비판해요. 문명이 인간을 더 행복하게 했는지 묻게 해요.|1755년 출간됐어요. 디종 아카데미 현상 공모에 낸 글에서 이어졌어요.
수상록|미셸 드 몽테뉴는 1533년생 프랑스의 사상가예요.|이 책은 에세이집이라 줄거리 대신 구성으로 소개해요. 몽테뉴는 자신의 생각과 경험을 솔직하게 써 내려가요. 죽음, 우정, 교육, 식인종, 경험 등 다양한 주제를 다뤄요. '나는 무엇을 아는가'라는 회의적 태도를 보여요. 인간을 이해하려면 먼저 자기 자신을 알아야 한다고 말해요.|1580년에 처음 출간됐고 이후 계속 늘렸어요. 에세이 형식을 만든 책으로 평가돼요.
우신예찬|에라스뮈스는 1466년경 태어난 네덜란드의 인문주의자예요.|이 책은 풍자 문학이라 줄거리 대신 구성으로 소개해요. 어리석음의 여신 모리아가 직접 나서서 자신을 찬양하는 연설을 해요. 어리석음 덕분에 사람들이 행복하게 산다고 말하며 사회를 풍자해요. 학자, 군주, 성직자의 위선과 교회의 부패를 비꼬아요. 겉으로는 농담 같지만 진지한 비판을 담았어요.|1511년 출간됐고 종교개혁에 영향을 줬다고 평가돼요.
영구평화론|이마누엘 칸트는 1724년생 독일의 철학자예요.|이 책은 정치철학서라 줄거리 대신 구성으로 소개해요. 칸트는 조약처럼 형식을 갖춰 영원한 평화를 위한 조건을 제시해요. 상비군은 점차 폐지돼야 하고 국가는 공화제여야 한다고 말해요. 자유로운 국가들의 연합이 평화를 지킨다고 주장해요. 세계 시민으로서 손님을 대접할 권리도 이야기해요.|1795년 출간됐어요. 오늘날 국제연맹과 국제연합의 사상적 바탕으로 평가돼요.
죽음에 이르는 병|쇠렌 키르케고르는 1813년생 덴마크의 철학자로 실존철학의 선구자예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 키르케고르는 '죽음에 이르는 병'이 절망이라고 말해요. 절망은 자기 자신이 되기를 원하지 않거나 원하는 데서 비롯된다고 분석해요. 인간은 신 앞에서 자기를 찾아야 절망에서 벗어날 수 있다고 해요. 절망의 여러 형태를 단계별로 분석해요.|1849년 출간됐어요.
철학적 탐구|루트비히 비트겐슈타인은 1889년생 오스트리아 출신 철학자예요.|이 책은 번호가 붙은 단편이라 줄거리 대신 구성으로 소개해요. 비트겐슈타인은 앞선 저서와 달리 낱말의 의미가 쓰임에 있다고 봐요. 다양한 놀이처럼 언어도 규칙에 따라 쓰이는 '언어놀이'라고 설명해요. 가족 유사성, 사적 언어 문제 등이 나와요. 철학의 문제는 언어를 오해해서 생긴다는 점을 다시 강조해요.|저자 사후인 1953년 출간됐어요.
인간의 조건|한나 아렌트는 1906년생 독일 출신의 미국 정치철학자예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 아렌트는 인간의 활동을 노동, 작업, 행위로 나누어 설명해요. 노동은 생존을, 작업은 세계를 만드는 일, 행위는 타인과 함께 말하고 행동하는 정치적 활동이에요. 근대에는 노동이 중심이 되고 공적 영역이 약해졌다고 비판해요. 인간의 다원성과 새로운 시작의 능력을 강조해요.|1958년 출간됐어요.
자유로부터의 도피|에리히 프롬은 1900년생 독일 출신의 정신분석학자이자 사회심리학자예요.|이 책은 사회심리학서라 줄거리 대신 구성으로 소개해요. 근대에 인간은 전통의 속박에서 벗어났지만 고독과 불안을 느끼게 됐다고 말해요. 그 결과 자유를 버리고 권위에 복종하거나 순응하려는 심리가 생긴다고 해요. 나치즘의 대두를 이런 심리로 설명해요. 사랑과 창조적 일을 통해 적극적 자유를 얻어야 한다고 주장해요.|1941년 출간됐어요.
순자|순자는 전국시대 말기 조나라 출신의 유가 사상가예요.|이 책은 사상서라 줄거리 대신 구성으로 소개해요. 순자는 맹자와 달리 인간의 본성이 악하다는 성악설을 주장해요. 사람은 욕망을 따르면 다투게 되므로 예와 교육으로 바로잡아야 한다고 말해요. 하늘은 자연의 법칙일 뿐 인간의 일에 간섭하지 않는다고 봐요. 제자 한비와 이사가 법가로 이어져요.|권학편이 '청출어람'으로 유명해요.
묵자|묵적은 전국시대 초기 노나라 출신의 사상가로 묵가의 창시자예요.|이 책은 사상서라 줄거리 대신 구성으로 소개해요. 묵자는 차별 없이 모두를 사랑하라는 겸애를 주장해요. 이로움을 서로 나누는 것이 곧 사랑이라고 말해요. 전쟁을 반대하는 비공과 사치를 줄이는 절용을 이야기해요. 그의 집단은 방어 전쟁을 돕는 조직적 활동도 했다고 전해져요.|맹자는 겸애를 비판했어요.
성학십도|이황은 1501년생 조선의 성리학자로 호는 퇴계예요.|이 책은 학문서라 줄거리 대신 구성으로 소개해요. 10개의 그림과 설명으로 성리학의 핵심을 정리해요. 태극도, 서명도, 소학도, 대학도 등을 통해 하늘의 이치와 인간의 마음 닦는 법을 다뤄요. 경, 곧 마음을 한결같이 하는 태도를 가장 중시해요. 이황이 68세 때 어린 선조에게 올린 글이에요.|1568년에 올렸어요.
격몽요결|이이는 1536년생 조선의 성리학자로 호는 율곡이에요.|이 책은 초학자를 위한 입문서라 줄거리 대신 구성으로 소개해요. 학문을 시작하는 사람에게 뜻을 세우는 것부터 가르쳐요. 몸가짐, 독서, 부모 섬기기, 사람 대하기 등 일상에서 지킬 일을 정리해요. 10장으로 이루어져 있어요. 어린 학생을 가르치기 위해 쉽게 쓰였어요.|1577년 지었어요.
눈먼 시계공|리처드 도킨스는 1941년생 영국의 진화생물학자예요.|이 책은 과학서라 줄거리 대신 구성으로 소개해요. 도킨스는 복잡한 생명이 설계자 없이 자연선택으로 생겨났다고 설명해요. 시계를 만든 시계공에 빗대 '눈먼 시계공'이라 불러요. 눈, 박쥐의 반향정위 같은 예를 들며 점진적 진화를 보여 줘요. 창조론과 설계론을 비판해요.|1986년 출간됐어요.
창백한 푸른 점|칼 세이건은 1934년생 미국의 천문학자예요.|이 책은 과학 에세이라 줄거리 대신 구성으로 소개해요. 보이저 1호가 찍은 지구 사진에서 지구는 작은 푸른 점으로 보였어요. 세이건은 이 사진을 통해 인류의 처지와 겸손을 이야기해요. 우주 탐사의 의미와 인류의 미래, 외계 생명 가능성을 다뤄요. 지구를 지키는 일의 중요성을 강조해요.|1994년 출간됐어요.
부분과 전체|베르너 하이젠베르크는 1901년생 독일의 물리학자로 1932년 노벨 물리학상을 받았어요.|이 책은 회고록이라 줄거리 대신 구성으로 소개해요. 하이젠베르크가 보어, 아인슈타인, 파울리 등과 나눈 대화를 회상하는 형식이에요. 양자역학과 불확정성 원리가 생겨나는 과정을 보여 줘요. 과학, 철학, 종교, 정치에 대한 토론도 담겨요. 제2차 세계대전 중 과학자의 책임 문제도 다뤄요.|1969년 출간됐어요.
카오스|제임스 글릭은 1954년생 미국의 과학 저널리스트예요.|이 책은 과학 교양서라 줄거리 대신 구성으로 소개해요. 기상학자 로렌츠의 나비 효과 발견에서 이야기가 시작돼요. 작은 차이가 큰 변화를 만드는 비선형 계의 성질을 설명해요. 만델브로의 프랙탈, 파이겐바움 상수 등을 소개해요. 카오스 이론이 여러 학문에 퍼지는 과정을 그려요.|1987년 출간됐어요.
자살론|에밀 뒤르켐은 1858년생 프랑스의 사회학자예요.|이 책은 사회학 연구서라 줄거리 대신 구성으로 소개해요. 뒤르켐은 자살을 개인의 문제가 아니라 사회적 요인으로 설명해요. 통계 자료를 분석해 이기적, 이타적, 아노미적, 숙명적 자살로 나누어요. 사회 통합과 규제의 정도에 따라 자살률이 달라진다고 말해요. 사회학 방법론의 모범으로 평가돼요. 자살을 다루는 책이므로 마음이 힘들 때는 혼자 읽기보다 신뢰할 수 있는 사람과 이야기하세요.|1897년 출간됐어요.
군중심리|귀스타브 르 봉은 1841년생 프랑스의 사회심리학자예요.|이 책은 사회심리학서라 줄거리 대신 구성으로 소개해요. 르 봉은 개인이 군중 속에 들어가면 이성이 줄고 감정에 휩쓸린다고 말해요. 군중은 암시와 전염에 쉽게 영향을 받고 지도자에 이끌린다고 설명해요. 이는 혁명과 대중 운동을 이해하는 틀이 됐어요. 군중에 대한 경멸적 시각이라는 비판도 있어요.|1895년 출간됐어요.
전체주의의 기원|한나 아렌트는 1906년생 독일 출신의 정치철학자예요.|이 책은 정치철학서라 줄거리 대신 구성으로 소개해요. 1부는 반유대주의, 2부는 제국주의, 3부는 전체주의를 분석해요. 아렌트는 나치즘과 스탈린주의가 어떻게 등장했는지 살펴봐요. 고립된 대중과 이데올로기, 테러가 전체주의의 특징이라고 말해요. 인간의 존엄을 지키려면 공적 영역과 다원성이 필요하다고 해요.|1951년 출간됐어요.
페다고지|파울루 프레이리는 1921년생 브라질의 교육학자예요.|이 책은 교육학서라 줄거리 대신 구성으로 소개해요. 프레이리는 교사가 지식을 일방적으로 넣어 주는 '은행 저금식 교육'을 비판해요. 학생과 교사가 대화하며 현실을 비판적으로 인식하는 문제제기식 교육을 제안해요. 억압받는 사람들이 스스로 해방해야 한다고 말해요. 문해 교육 경험이 바탕이에요.|1968년 포르투갈어로 쓰였고 1970년 영어판이 나왔어요.
소비의 사회|장 보드리야르는 1929년생 프랑스의 사회학자예요.|이 책은 사회이론서라 줄거리 대신 구성으로 소개해요. 현대 사회에서 사람들은 물건의 쓰임보다 기호와 이미지를 소비한다고 말해요. 소비는 사회적 지위와 차이를 드러내는 수단이 된다고 설명해요. 풍요 속에서도 욕구는 끝없이 만들어진다고 비판해요. 광고와 미디어의 역할도 분석해요.|1970년 출간됐어요.
나쁜 사마리아인들|장하준은 1963년생 한국 출신의 영국 케임브리지대 경제학자예요.|이 책은 경제학서라 줄거리 대신 구성으로 소개해요. 선진국이 자유 시장과 자유 무역을 개발도상국에 권하지만 정작 자신들은 보호무역과 정부 지원으로 발전했다고 주장해요. 이를 '사다리 걷어차기'에 비유해요. 신자유주의 정책이 가난한 나라에 도움이 되지 않았다고 비판해요. 성경의 착한 사마리아인을 비튼 제목이에요.|2007년 출간됐어요.
호모 루덴스|요한 하위징아는 1872년생 네덜란드의 역사학자예요.|이 책은 문화사 연구서라 줄거리 대신 구성으로 소개해요. 하위징아는 인간의 본질이 노는 존재, 곧 호모 루덴스에 있다고 말해요. 놀이는 문화보다 오래되었고 문화는 놀이 속에서 생겨났다고 해요. 법, 전쟁, 시, 철학, 예술에 놀이 요소가 있다고 분석해요. 놀이의 자발성과 규칙, 자유로움을 강조해요.|1938년 출간됐어요.
조선상고사|신채호는 1880년생 한국의 독립운동가이자 역사학자예요.|이 책은 역사서라 줄거리 대신 구성으로 소개해요. 한국 고대사를 주체적 시각에서 서술해요. 역사는 '아와 비아의 투쟁'이라고 정의해요. 고조선부터 삼국 시대까지를 다루며 낭가 사상, 묘청의 난 등을 평가해요. 일제 식민 사관에 맞서 민족의 정체성을 세우려 했어요.|신문 연재 등을 거쳐 1931년 발표됐어요. 일부 주장은 학계에서 비판을 받아요.
발해고|유득공은 1748년생 조선 후기의 실학자예요.|이 책은 역사서라 줄거리 대신 구성으로 소개해요. 발해의 역사를 최초로 체계적으로 정리해요. 발해를 고구려의 계승 국가로 보고 신라와 발해가 함께 있던 시대를 남북국 시대라 불러요. 임금, 신하, 지리, 국어 등을 나누어 설명해요. 우리 역사의 영역을 넓게 인식한 점이 의미 있어요.|1784년 지었어요.
시학|아리스토텔레스는 기원전 384년생 그리스의 철학자예요.|이 책은 문학 이론서라 줄거리 대신 구성으로 소개해요. 시, 특히 비극과 서사시를 모방의 예술로 설명해요. 비극은 연민과 공포를 일으켜 감정을 정화하는 카타르시스에 이른다고 말해요. 플롯, 인물, 사상, 말씨, 노래, 장면을 비극의 요소로 꼽아요. 좋은 플롯의 조건으로 반전과 발견을 설명해요.|현존하는 서양 최초의 문학 이론서예요.
다른 방식으로 보기|존 버거는 1926년생 영국의 미술비평가이자 소설가예요.|이 책은 미술 비평서라 줄거리 대신 구성으로 소개해요. 버거는 그림을 보는 방식이 우리가 아는 지식과 믿음에 영향을 받는다고 말해요. 복제 기술이 작품의 의미를 바꾸었다고 설명해요. 서양 누드화가 남성 관람자의 시선을 전제한다고 비판해요. 광고 이미지도 비슷한 방식으로 분석해요.|1972년 BBC 시리즈를 바탕으로 출간됐어요.
악의 꽃|샤를 보들레르는 1821년생 프랑스의 시인이에요.|이 책은 시집이라 줄거리 대신 구성으로 소개해요. 우울과 이상, 파리의 풍경, 술, 악, 죽음 같은 주제의 시를 묶어요. 도시의 어두운 면과 인간의 타락 속에서 아름다움을 찾으려 해요. 상징주의 시의 선구로 평가돼요. 일부 시는 풍기문란 혐의로 재판을 받았어요.|1857년 출간됐어요.
황무지|T. S. 엘리엇은 1888년생 미국 출신 영국 시인으로 1948년 노벨 문학상을 받았어요.|이 책은 장시라 줄거리 대신 구성으로 소개해요. 5부로 이루어지며 제1부 '죽은 자의 매장'에서 '4월은 가장 잔인한 달'이라는 구절이 나와요. 신화, 성배 전설, 여러 언어의 인용이 어지럽게 얽혀요. 전쟁 뒤 유럽의 정신적 황폐함을 그려요. 마지막은 산스크리트어 기도문으로 끝나요.|1922년 발표됐어요. 현대시의 이정표로 평가돼요.
도덕형이상학 정초|이마누엘 칸트는 1724년생 독일 철학자예요.|이 책은 윤리학서라 줄거리 대신 구성으로 소개해요. 칸트는 도덕의 기준이 결과가 아니라 의무에서 나온 선한 의지에 있다고 말해요. 정언명령, 곧 보편적 법칙이 될 수 있는 원칙에 따라 행동하라고 해요. 사람을 수단이 아니라 목적으로 대하라는 명령도 제시해요. 도덕은 자율적 이성의 법칙이라고 설명해요.|1785년 출간됐어요.
정신현상학|게오르크 헤겔은 1770년생 독일의 철학자예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 의식이 감각적 확신에서 출발해 자기의식, 이성, 정신을 거쳐 절대지에 이르는 과정을 서술해요. 주인과 노예의 변증법이 유명한 대목이에요. 정과 반, 합의 운동으로 정신이 자기를 이해해 나간다고 해요. 난해하지만 이후 철학에 큰 영향을 줬어요.|1807년 출간됐어요.
도덕의 계보|프리드리히 니체는 1844년생 독일 철학자예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 니체는 선과 악, 좋음과 나쁨 같은 도덕의 기원을 역사적으로 파헤쳐요. 약자의 원한에서 나온 노예의 도덕이 강자의 도덕을 뒤집었다고 설명해요. 죄의식과 양심이 어떻게 생겼는지 분석해요. 금욕적 이상의 의미도 따져요.|1887년 출간됐어요.
인간 지성론|존 로크는 1632년생 영국의 철학자예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 로크는 인간이 태어날 때 마음은 아무것도 쓰이지 않은 백지와 같다고 말해요. 모든 관념은 감각과 반성이라는 경험에서 온다고 설명해요. 본유 관념을 부정해요. 지식의 범위와 한계를 따져 경험론의 기초를 놓았어요.|1689년에 나왔고 1690년 날짜로 출판됐어요.
인간 본성론|데이비드 흄은 1711년생 스코틀랜드의 철학자예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 흄은 인간 지식이 모두 경험에서 나온다고 보고 인과 관계도 습관에 의한 기대일 뿐이라고 말해요. 자아도 지각의 다발에 불과하다고 설명해요. 이성은 감정의 노예라는 말이 유명해요. 도덕은 이성이 아니라 감정에 근거한다고 주장해요.|1739~1740년 출간됐어요. 처음에는 별 주목을 받지 못했어요.
신학대전|토마스 아퀴나스는 1225년경 태어난 이탈리아의 신학자이자 철학자예요.|이 책은 신학서라 줄거리 대신 구성으로 소개해요. 신학의 여러 문제를 질문, 반론, 답변, 재반론의 형식으로 하나씩 논의해요. 신의 존재를 증명하는 다섯 가지 길이 유명해요. 아리스토텔레스 철학을 기독교 신학과 결합해요. 미완성으로 남았어요.|13세기에 쓰였어요.
철학의 위안|보에티우스는 480년경 태어난 로마의 철학자이자 정치가예요.|이 책은 철학적 대화록이라 줄거리 대신 구성으로 소개해요. 억울하게 투옥되어 사형을 기다리던 보에티우스에게 철학의 여신이 찾아와요. 여신은 운명의 변덕을 설명하고 진정한 행복은 외적인 것이 아니라 선에 있다고 말해요. 신의 섭리와 인간의 자유 의지가 양립할 수 있는지 논해요. 산문과 운문이 섞여 있어요.|524년경 쓰였어요.
아나키, 국가, 유토피아|로버트 노직은 1938년생 미국의 철학자예요.|이 책은 정치철학서라 줄거리 대신 구성으로 소개해요. 노직은 개인의 권리가 국가보다 우선한다고 주장해요. 최소 국가, 곧 보호와 계약의 집행에 한정된 국가만 정당하다고 말해요. 세금을 통한 재분배는 강제 노동과 같다고 비판해요. 롤스의 정의론에 대한 반박으로 읽혀요.|1974년 출간됐어요.
대학|공자의 제자 증자가 지었다고 전해져요. 본래 『예기』의 한 편이었어요.|이 책은 유교 경전이라 줄거리 대신 구성으로 소개해요. 주희는 『예기』에서 이 글을 떼어 사서의 하나로 삼았어요. 핵심은 삼강령과 팔조목이에요. 삼강령은 명명덕, 친민, 지어지선이에요. 팔조목은 격물, 치지, 성의, 정심, 수신, 제가, 치국, 평천하로 자기 수양에서 천하를 평화롭게 하는 데까지 이르는 순서예요.|송나라 주희가 편집했어요.
중용|공자의 손자 자사가 지었다고 전해져요. 본래 『예기』의 한 편이었어요.|이 책은 유교 경전이라 줄거리 대신 구성으로 소개해요. 중용은 어느 한쪽으로 치우치지 않고 한결같은 도를 뜻해요. 하늘이 명한 것이 성, 성을 따르는 것이 도라고 말해요. 군자는 혼자 있을 때도 삼가는 신독을 지켜야 한다고 해요. 성실함이 하늘의 도이고 성실해지려 노력하는 것이 사람의 도라고 말해요.|주희가 사서의 하나로 정했어요.
주역|주역은 고대 중국의 점서이자 철학서예요. 복희, 문왕, 공자 등이 관련된다고 전해져요.|이 책은 점술과 철학이 결합된 경전이라 줄거리 대신 구성으로 소개해요. 음과 양을 나타내는 효 여섯 개로 이루어진 64괘가 기본이에요. 각 괘와 효에는 풀이하는 말이 붙어 있어요. 변화가 우주의 이치라는 사상이 담겨 있어요. 해설서인 십익은 공자가 지었다고 전해지지만 확실하지 않아요.|삼경의 하나로 동양 철학의 바탕이 됐어요.
전습록|왕수인, 곧 왕양명은 1472년생 명나라의 사상가예요.|이 책은 어록이라 줄거리 대신 구성으로 소개해요. 제자들이 왕양명의 가르침과 문답을 엮은 책이에요. 마음이 곧 이치라는 심즉리와 앎과 행동이 하나라는 지행합일을 강조해요. 주희의 성리학이 사물의 이치를 먼저 탐구하라 한 것과 달라요. 양지, 곧 사람 마음속의 선한 앎을 이루라고 가르쳐요.|양명학의 기본 경전이에요.
정관정요|오긍은 당나라의 역사가예요. 태종과 신하들의 대화를 정리했어요.|이 책은 정치 대화록이라 줄거리 대신 구성으로 소개해요. 당 태종 이세민과 위징 등 신하들의 대화를 주제별로 모았어요. 임금의 도리, 신하의 간언, 인재 등용, 백성 사랑을 이야기해요. 태종은 신하의 직언을 받아들이는 모습을 보여요. 이후 동아시아 제왕의 통치 교과서로 읽혔어요.|8세기 초에 편찬됐어요.
의산문답|홍대용은 1731년생 조선 후기의 실학자예요.|이 책은 문답체 과학서라 줄거리 대신 구성으로 소개해요. 허자라는 인물과 실옹이라는 인물이 의무려산에서 문답을 나눠요. 지구가 자전한다는 주장과 우주가 무한하다는 생각을 펼쳐요. 중국 중심의 세계관을 비판하고 모든 사람과 사물이 평등하다고 말해요. 전통 성리학을 넘어선 사고가 드러나요.|18세기 후반에 쓰였어요.
과학적 발견의 논리|칼 포퍼는 1902년생 오스트리아 출신 영국 철학자예요.|이 책은 과학철학서라 줄거리 대신 구성으로 소개해요. 포퍼는 과학과 비과학을 구분하는 기준을 반증 가능성에서 찾아요. 이론은 사실로 입증하기보다 반증될 수 있어야 과학이라고 말해요. 귀납법에 의존하는 방식을 비판하고 추측과 반박으로 지식이 성장한다고 설명해요. 빈 학파의 검증 중심 사고와 대비돼요.|1934년 독일어로, 1959년 영어로 출간됐어요.
두 문화|C. P. 스노는 1905년생 영국의 물리학자이자 소설가예요.|이 책은 강연을 엮은 책이라 줄거리 대신 구성으로 소개해요. 스노는 서양의 지식인 사회가 인문학과 과학이라는 서로 단절된 두 문화로 나뉘었다고 말해요. 서로를 이해하지 못하는 현실을 비판해요. 이 단절이 세계의 빈곤 문제 해결을 어렵게 한다고 주장해요. 산업혁명과 과학의 역할도 논해요.|1959년 케임브리지대 강연이 바탕이에요.
빈 서판|스티븐 핑커는 1954년생 캐나다 출신 미국의 심리학자예요.|이 책은 과학서라 줄거리 대신 구성으로 소개해요. 인간의 마음이 백지와 같다는 관점, 고귀한 야만인, 기계 속의 유령이라는 세 가지 통념을 비판해요. 유전자와 뇌 같은 생물학적 본성이 행동에 영향을 준다고 말해요. 그렇다고 환경의 역할을 부정하는 것은 아니라고 설명해요. 젠더, 폭력, 교육, 예술에도 같은 시각을 적용해요.|2002년 출간됐고 논란이 컸어요.
우리 본성의 선한 천사|스티븐 핑커는 1954년생 캐나다 출신 미국의 심리학자예요.|이 책은 과학·역사서라 줄거리 대신 구성으로 소개해요. 핑커는 역사를 통틀어 폭력이 줄어들었다고 주장해요. 국가의 등장, 상업, 인권 의식, 이성의 확산 같은 요인을 들어요. 인간 본성에는 폭력적인 악마와 이를 억제하는 선한 천사가 함께 있다고 말해요. 통계와 사례를 방대하게 인용해요.|2011년 출간됐고 폭력 감소 주장에 반론도 있어요.
역사의 종언|프랜시스 후쿠야마는 1952년생 미국의 정치학자예요.|이 책은 정치철학서라 줄거리 대신 구성으로 소개해요. 후쿠야마는 냉전이 끝난 뒤 자유민주주의가 인류의 이념적 진화의 종착점이 되었다고 주장해요. 헤겔과 코제브의 '인정 투쟁' 개념으로 역사의 방향을 설명해요. 자유민주주의가 승리했다고 해서 사건이 사라진다는 뜻은 아니라고 말해요. 마지막 인간의 안락과 권태에 대한 우려도 이야기해요.|1989년 논문에서 시작돼 1992년 책으로 나왔어요. 이후 현실 정치 변화에 따라 많은 논쟁이 이어졌어요.
공론장의 구조변동|위르겐 하버마스는 1929년생 독일의 철학자이자 사회학자예요.|이 책은 사회이론서라 줄거리 대신 구성으로 소개해요. 하버마스는 18세기 커피하우스, 살롱, 신문을 통해 시민이 자유롭게 토론하는 공론장이 생겼다고 설명해요. 이곳에서 합리적 토론이 정치권력을 비판하는 힘이 되었다고 해요. 그러나 대중매체와 국가 개입, 상업화로 공론장이 변질됐다고 비판해요. 이후 의사소통 이론으로 발전시켜요.|1962년 출간됐어요.
고독한 군중|데이비드 리스먼은 1909년생 미국의 사회학자예요.|이 책은 사회학서라 줄거리 대신 구성으로 소개해요. 리스먼은 사회가 변하면서 사람들의 성격 유형도 달라진다고 해요. 전통지향형, 내부지향형, 타인지향형의 세 유형을 구분해요. 현대 대중 사회에서는 타인의 기대와 평판에 민감한 타인지향형이 늘었다고 해요. 풍요 속에서도 사람들이 고독과 불안을 느낀다고 분석해요.|1950년 출간됐어요.
사회학적 상상력|C. 라이트 밀스는 1916년생 미국의 사회학자예요.|이 책은 사회학 방법론서라 줄거리 대신 구성으로 소개해요. 밀스는 개인의 사적 곤란을 사회 구조의 공적 문제와 연결해서 볼 것을 요구해요. 예를 들어 실업은 개인의 문제가 아니라 사회 구조의 문제일 수 있다고 해요. 역사, 전기, 사회 구조를 함께 보는 시각이 사회학적 상상력이에요. 추상적 이론에만 몰두하는 경향과 단순 통계 위주의 연구를 비판해요.|1959년 출간됐어요.
미디어의 이해|마셜 매클루언은 1911년생 캐나다의 미디어 이론가예요.|이 책은 미디어론이라 줄거리 대신 구성으로 소개해요. 매클루언은 '미디어는 메시지다'라고 말해요. 내용보다 매체 자체가 인간의 감각과 사회를 바꾼다는 뜻이에요. 미디어를 인간 감각의 확장으로 보고 뜨거운 미디어와 차가운 미디어로 나눠요. 전기 미디어가 세계를 하나의 '지구촌'으로 만든다고 예견해요.|1964년 출간됐어요.
자본주의와 자유|밀턴 프리드먼은 1912년생 미국의 경제학자로 1976년 노벨 경제학상을 받았어요.|이 책은 경제정치서라 줄거리 대신 구성으로 소개해요. 프리드먼은 경제적 자유가 정치적 자유의 필수 조건이라고 말해요. 정부의 역할은 규칙을 정하고 집행하는 데 한정돼야 한다고 주장해요. 교육 바우처, 음의 소득세, 통화 정책 등 구체적인 제안을 내놓아요. 자유 시장과 작은 정부를 옹호해요.|1962년 출간됐어요.
한국통사|박은식은 1859년생 한국의 역사학자이자 독립운동가예요.|이 책은 역사서라 줄거리 대신 구성으로 소개해요. 고대부터 19세기 말까지 한국 근대사를 중심으로 서술해요. 흥선대원군의 집권과 개항, 갑신정변, 동학, 청일전쟁 등을 다뤄요. 일본의 침략과 조선의 쇠퇴를 안타깝게 서술해요. 민족의 혼, 곧 국혼이 살아 있으면 나라를 되찾을 수 있다고 강조해요.|1915년 중국 상하이에서 한문으로 출간됐어요.
매천야록|황현은 1855년생 조선 말기의 선비이자 시인이에요.|이 책은 시대 기록이라 줄거리 대신 구성으로 소개해요. 고종 즉위 무렵부터 1910년까지 조정과 사회의 일을 기록한 야사예요. 지배층의 부패와 외세의 침략, 동학 농민 운동, 의병 활동 등을 생생하게 적어요. 저자의 비판적 시선이 돋보여요. 황현은 1910년 나라가 일제에 병합되자 절명시를 남기고 세상을 떠났어요.|당대 사회를 보여 주는 중요한 사료로 평가돼요.
지중해|페르낭 브로델은 1902년생 프랑스의 역사학자예요.|이 책은 역사서라 줄거리 대신 구성으로 소개해요. 16세기 후반 필리프 2세 시대의 지중해 세계를 다뤄요. 1부는 거의 변하지 않는 지리 환경, 2부는 서서히 변하는 경제와 사회, 3부는 빠르게 지나가는 정치와 전쟁이에요. 이를 장기·중기·단기 지속으로 나눠 역사를 입체적으로 봐요. 아날학파를 대표하는 저작이에요.|1949년 출간됐어요.
기술복제시대의 예술작품|발터 벤야민은 1892년생 독일의 비평가이자 철학자예요.|이 책은 예술론이라 줄거리 대신 구성으로 소개해요. 사진과 영화처럼 복제 기술이 발달하면서 예술 작품의 '아우라'가 사라진다고 말해요. 아우라는 원본이 지닌 유일무이한 분위기를 말해요. 예술은 제의적 가치에서 전시 가치로 옮겨 가고 대중이 예술에 참여할 가능성이 열렸다고 해요. 한편 파시즘의 정치 미학화도 경계해요.|1935년 집필됐어요. 벤야민은 1940년 나치를 피해 가다 생을 마감했어요.
지하로부터의 수기|표도르 도스토옙스키는 1821년생 러시아의 작가예요.|1부에서 40대의 전직 하급 관리인 화자는 지하 생활을 하며 자신과 사회를 비꼬는 긴 독백을 해요. 그는 이성과 합리를 믿는 사상에 반발하고 자유 의지의 모순을 이야기해요. 2부에서 그는 젊은 시절 동창들과의 모임에서 겪은 굴욕을 회상해요. 이후 그는 매춘부 리자를 만나 그녀를 괴롭히다 돌이킬 수 없는 상처를 줘요. 결국 그는 스스로를 더욱 고립시켜요.|1864년 발표됐고 도스토옙스키 후기 대작들의 서막으로 평가돼요.
픽션들|호르헤 루이스 보르헤스는 1899년생 아르헨티나의 작가예요.|이 책은 단편집이라 대표작으로 소개해요. 「바벨의 도서관」은 모든 가능한 책을 담은 끝없는 도서관을 그려요. 「틀뢴, 우크바르, 오르비스 테르티우스」는 가상의 세계가 현실을 침식하는 이야기예요. 「끝없이 갈라지는 오솔길의 정원」은 시간이 여러 갈래로 나뉘는 소설이에요. 「피에르 메나르, 『돈키호테』의 저자」는 같은 글도 시대에 따라 다르게 읽힌다는 이야기예요. 미로, 거울, 무한이 반복되는 주제예요.|1944년 출간됐어요.
대중의 반역|호세 오르테가 이 가세트는 1883년생 스페인의 철학자예요.|이 책은 사회비평서라 줄거리 대신 구성으로 소개해요. 오르테가는 20세기에 대중이 사회의 중심으로 올라섰다고 말해요. 대중은 자신을 평범하다고 느끼지 않고 자신의 취향과 의견을 모두에게 강요한다고 비판해요. 전문가들도 자기 분야 밖에서는 대중과 다름없다고 봐요. 유럽의 위기를 극복하려면 책임감을 가진 소수가 필요하다고 주장해요.|1930년 출간됐어요. 엘리트주의라는 비판도 받아요.
선악의 저편|프리드리히 니체는 1844년생 독일의 철학자예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 니체는 기존 철학자들이 진리를 믿는 편견에 빠져 있다고 비판해요. 선악의 구분은 고정된 것이 아니라 관점에 따른 것이라고 말해요. 주인의 도덕과 노예의 도덕을 구분하고 힘에의 의지를 이야기해요. 아포리즘 형식으로 이루어진 9부 구성이에요.|1886년 출간됐어요.
실천이성비판|이마누엘 칸트는 1724년생 독일의 철학자예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 칸트는 『순수이성비판』에 이어 도덕의 원리를 다뤄요. 이성이 스스로 도덕법칙을 세우며 인간은 그 법칙에 따라야 한다고 말해요. 도덕법칙은 정언명령의 형식을 가져요. 도덕적 행위를 가능하게 하려면 자유, 영혼 불멸, 신의 존재를 요청해야 한다고 설명해요.|1788년 출간됐어요. '내 위의 별이 빛나는 하늘과 내 안의 도덕법칙'이라는 구절이 유명해요.
도덕감정론|애덤 스미스는 1723년생 스코틀랜드의 도덕철학자예요.|이 책은 윤리학서라 줄거리 대신 구성으로 소개해요. 스미스는 인간이 타인에게 공감하는 능력에서 도덕이 나온다고 설명해요. 마음속의 '공정한 관찰자'가 우리 행동을 판단하게 한다고 말해요. 칭찬받기를 바라는 마음과 칭찬받을 만하고자 하는 마음을 구별해요. 『국부론』과 함께 스미스 사상의 두 축으로 평가돼요.|1759년 출간됐어요.
인구론|토머스 맬서스는 1766년생 영국의 경제학자이자 성직자예요.|이 책은 인구와 경제 연구서라 줄거리 대신 구성으로 소개해요. 맬서스는 인구가 기하급수적으로 늘고 식량은 산술급수적으로 늘어난다고 주장해요. 그 결과 빈곤, 기아, 전쟁 같은 억제 요인이 필연적으로 작동한다고 말해요. 구빈법이 빈곤을 오히려 키운다고 비판해요. 이후 다윈의 진화론에도 영향을 줬어요.|1798년 익명으로 처음 나왔어요. 예측은 기술 발전으로 크게 빗나갔다는 평가가 많아요.
자본주의 사회주의 민주주의|조지프 슘페터는 1883년생 오스트리아 출신의 경제학자예요.|이 책은 경제학서라 줄거리 대신 구성으로 소개해요. 슘페터는 자본주의의 본질을 '창조적 파괴'로 설명해요. 기업가의 혁신이 낡은 것을 파괴하며 발전을 이끈다고 말해요. 그러나 성공한 자본주의가 오히려 스스로 기반을 허물어 사회주의로 가게 될 수 있다고 예측해요. 민주주의도 지도자를 선택하는 경쟁 방식으로 정의해요.|1942년 출간됐어요.
인간의 유래|찰스 다윈은 1809년생 영국의 박물학자예요.|이 책은 과학서라 줄거리 대신 구성으로 소개해요. 다윈은 『종의 기원』에서 미뤄 둔 인간의 진화 문제를 본격적으로 다뤄요. 인간이 다른 동물과 공통 조상에서 나왔다는 증거를 비교해부학과 행동에서 찾아요. 도덕과 지능도 점진적으로 진화했다고 설명해요. 성 선택, 곧 배우자 선택이 인간의 외모와 인종적 차이 등에 영향을 줬다고 주장해요.|1871년 출간됐어요.
변신 이야기|오비디우스는 기원전 43년생 로마의 시인이에요.|이 책은 신화 모음집이라 줄거리 대신 구성으로 소개해요. 천지 창조에서 카이사르의 시대까지 15권에 걸쳐 250여 개의 신화를 이어 붙여요. 다프네가 월계수로, 아라크네가 거미로, 나르키소스가 수선화로 변하는 이야기가 나와요. 신들의 사랑과 질투, 인간의 오만이 변신의 이유가 돼요. 이후 서양 문학과 미술에 큰 영감을 줬어요.|기원후 8년경 완성된 것으로 알려져 있어요.
형이상학|아리스토텔레스는 기원전 384년생 고대 그리스 철학자예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 존재하는 것을 존재로서 연구하는 학문을 다뤄요. 실체와 질료와 형상, 가능태와 현실태를 설명해요. 사물이 존재하는 네 가지 원인을 이야기해요. 우주를 움직이는 최초의 존재로 '부동의 원동자'를 제시해요.|아리스토텔레스 사후에 편집됐고 '자연학 다음의 책'이라는 뜻에서 이런 이름이 붙었다고 해요.
수사학|아리스토텔레스는 기원전 384년생 고대 그리스 철학자예요.|이 책은 설득의 기술을 다룬 이론서라 줄거리 대신 구성으로 소개해요. 수사학을 어떤 상황에서도 설득의 방법을 찾는 능력이라고 정의해요. 설득의 세 가지 수단으로 말하는 사람의 성품(에토스), 듣는 사람의 감정(파토스), 논증(로고스)을 들어요. 연설을 정치, 법정, 의식 연설로 나눠요. 문체와 구성에 대해서도 설명해요.|기원전 4세기에 쓰였어요.
직업으로서의 정치|막스 베버는 1864년생 독일의 사회학자예요.|이 책은 강연을 엮은 책이라 줄거리 대신 구성으로 소개해요. 베버는 국가를 일정 영토 안에서 정당한 물리적 폭력을 독점하는 공동체라고 정의해요. 정치가에게 필요한 자질로 열정, 책임감, 균형 감각을 들어요. 신념 윤리와 책임 윤리를 구분하며 정치가는 행동의 결과에 책임을 져야 한다고 말해요. 정치를 '단단한 널빤지를 서서히 뚫는 일'에 비유해요.|1919년 뮌헨 대학에서 한 강연이 바탕이에요.
사회분업론|에밀 뒤르켐은 1858년생 프랑스의 사회학자예요.|이 책은 사회학서라 줄거리 대신 구성으로 소개해요. 뒤르켐은 사회가 분업을 통해 어떻게 통합되는지 분석해요. 전통 사회는 비슷한 사람들이 결속하는 기계적 연대로, 현대 사회는 서로 다른 역할이 의존하는 유기적 연대로 유지된다고 해요. 법의 형태도 억압적 법에서 배상적 법으로 변한다고 설명해요. 분업이 잘못되면 아노미가 생긴다고 말해요.|1893년 출간됐어요.
괴델, 에셔, 바흐|더글러스 호프스태터는 1945년생 미국의 인지과학자예요.|이 책은 과학·철학 교양서라 줄거리 대신 구성으로 소개해요. 수학자 괴델의 불완전성 정리, 화가 에셔의 그림, 작곡가 바흐의 음악에서 '자기 지시'와 '순환 구조'라는 공통점을 찾아요. 대화편과 설명이 번갈아 나오는 독특한 구성이에요. 의식과 인공지능이 어떻게 생겨나는지를 묻는 데로 이어져요. 퍼즐과 말놀이가 풍부해요.|1979년 출간돼 퓰리처상을 받았어요.
시민 불복종|헨리 데이비드 소로는 1817년생 미국의 작가이자 사상가예요.|이 책은 에세이라 줄거리 대신 구성으로 소개해요. 소로는 멕시코 전쟁과 노예제에 항의하는 뜻으로 세금 납부를 거부해 하룻밤 투옥된 경험이 있어요. 그는 정부가 부당하면 양심에 따라 따르지 않을 수 있다고 말해요. 다수결이 항상 옳은 것은 아니라고 해요. 개인의 양심이 국가보다 우선해야 한다고 주장해요.|1849년 처음 발표됐어요. 간디와 마틴 루서 킹에게 영향을 줬다고 알려져 있어요.
증여론|마르셀 모스는 1872년생 프랑스의 사회학자이자 인류학자예요.|이 책은 인류학 연구서라 줄거리 대신 구성으로 소개해요. 모스는 선물이 단순한 무상의 행위가 아니라 주고, 받고, 답례하는 의무가 있다고 말해요. 북미 원주민의 포틀래치, 폴리네시아의 선물 교환, 트로브리안드 섬의 쿨라 교역을 사례로 들어요. 선물 교환이 사람들 사이의 사회적 관계를 만든다고 설명해요. 시장 경제 이전의 교환 방식을 이해하는 데 도움이 돼요.|1925년 발표됐어요.
일반언어학 강의|페르디낭 드 소쉬르는 1857년생 스위스의 언어학자예요.|이 책은 강의록이라 줄거리 대신 구성으로 소개해요. 소쉬르는 언어를 사회적 체계인 랑그와 개인의 실제 발화인 파롤로 나누어요. 말소리인 기표와 뜻인 기의가 결합한 것이 기호이며 그 관계는 자의적이라고 말해요. 언어를 시간의 흐름이 아닌 구조로 보는 공시적 연구를 강조해요. 구조주의의 출발점이 됐어요.|1916년 제자들이 강의 노트를 모아 출간했어요.
문명 속의 불만|지그문트 프로이트는 1856년생 오스트리아의 정신분석학자예요.|이 책은 정신분석서라 줄거리 대신 구성으로 소개해요. 프로이트는 문명이 인간의 본능을 억압해야 유지되므로 불행이 생긴다고 말해요. 성욕과 공격성 같은 본능을 억누르는 데서 죄책감이 생겨난다고 설명해요. 문명이 발달할수록 개인의 죄의식은 커진다고 봐요. 에로스와 죽음 충동의 대립도 언급해요.|1930년 출간됐어요.
말과 사물|미셸 푸코는 1926년생 프랑스의 철학자예요.|이 책은 인문과학의 고고학을 다룬 책이라 줄거리 대신 구성으로 소개해요. 푸코는 시대마다 지식을 가능하게 하는 틀인 에피스테메가 있다고 말해요. 르네상스, 고전주의 시대, 근대의 세 에피스테메를 비교해요. 근대에 '인간'이라는 개념이 인문과학의 대상이 되었으나 곧 사라질 것이라고 해요. 벨라스케스의 그림 「시녀들」 분석으로 시작해요.|1966년 출간됐어요.
성의 역사|미셸 푸코는 1926년생 프랑스의 철학자예요.|이 책은 역사 철학서라 줄거리 대신 구성으로 소개해요. 1권 『지식의 의지』에서 푸코는 서구 사회가 성을 억압해 왔다는 통념을 비판해요. 권력은 억압하기보다 성에 대해 말하게 하고 지식으로 만들어 통제한다고 말해요. 이후 2~4권에서는 고대 그리스·로마와 초기 기독교의 성 윤리를 다뤄요. 자기 배려와 주체의 형성이 주제로 이어져요.|1976년 1권이 나왔고 푸코는 4권 출간 전 1984년에 세상을 떠났어요.
존재와 무|장폴 사르트르는 1905년생 프랑스의 철학자이자 작가예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 사르트르는 의식이 사물처럼 고정된 존재가 아니라 '무'라고 말해요. 인간은 자유롭고 그 자유에서 오는 불안을 회피하려고 자기기만에 빠진다고 설명해요. 타인의 시선을 받을 때 '대타 존재'로서 갈등한다고 분석해요. 인간은 자신의 선택으로 자신을 만들어 간다고 주장해요.|1943년 출간됐어요.
우연과 필연|자크 모노는 1910년생 프랑스의 생화학자로 1965년 노벨 생리의학상을 받았어요.|이 책은 과학철학 에세이라 줄거리 대신 구성으로 소개해요. 모노는 생명이 우연한 돌연변이와 필연적인 자연선택의 결과라고 말해요. 생명체를 분자 수준에서 설명하며 DNA와 단백질의 역할을 다뤄요. 우주에는 인간을 위한 목적이 없다는 입장을 밝혀요. 이 견해에 따라 윤리도 새롭게 세워야 한다고 말해요.|1970년 출간됐어요.
도덕적 인간과 비도덕적 사회|라인홀드 니버는 1892년생 미국의 신학자예요.|이 책은 사회윤리서라 줄거리 대신 구성으로 소개해요. 니버는 개인은 도덕적일 수 있어도 집단은 이기적이고 권력을 추구한다고 말해요. 국가, 계급 같은 집단 사이의 갈등은 이성과 도덕만으로 해결할 수 없다고 봐요. 사회 정의를 이루려면 힘의 균형과 강제도 필요하다고 해요. 낙관적 자유주의와 이상주의를 비판해요.|1932년 출간됐어요.
선택할 자유|밀턴 프리드먼과 로즈 프리드먼은 부부 경제학자예요.|이 책은 경제정치서라 줄거리 대신 구성으로 소개해요. 시장은 사람들이 자유롭게 교환하게 해서 이익을 가져다준다고 말해요. 정부의 규제와 복지 정책이 오히려 비효율과 부작용을 낳는다고 비판해요. 교육, 화폐, 복지, 소비자 보호 문제를 다뤄요. 미국 PBS 방송의 TV 시리즈를 바탕으로 한 책이에요.|1980년 출간됐어요.
신기관|프랜시스 베이컨은 1561년생 영국의 철학자이자 정치가예요.|이 책은 철학서라 줄거리 대신 구성으로 소개해요. 베이컨은 아리스토텔레스의 연역 논리를 대신할 새로운 방법으로 경험과 관찰에서 출발하는 귀납법을 제시해요. 지식은 곧 힘이라고 말해요. 올바른 인식을 가로막는 편견인 4대 우상, 곧 종족, 동굴, 시장, 극장의 우상을 설명해요. 근대 과학 방법론의 길을 열었어요.|1620년 출간됐어요.
황금 가지|제임스 프레이저는 1854년생 스코틀랜드의 인류학자예요.|이 책은 비교 신화·종교 연구서라 줄거리 대신 구성으로 소개해요. 이탈리아 네미 숲에서 '숲의 왕'이 되려면 이전 왕을 죽여야 했던 관습의 의미를 묻는 데서 시작해요. 이를 설명하려고 세계 각지의 주술, 왕권, 곡물 정령, 희생 제의를 방대하게 모아요. 인간 사고가 주술에서 종교로, 다시 과학으로 발전한다고 봐요. 문학에도 큰 영향을 줬으나 이론은 오늘날 많이 비판받아요.|1890년 초판이 나왔고 여러 번 확장돼 12권으로 늘었어요.
토템과 터부|지그문트 프로이트는 1856년생 오스트리아의 정신분석학자예요.|이 책은 정신분석 연구서라 줄거리 대신 구성으로 소개해요. 프로이트는 원시 사회의 토템과 터부를 정신분석으로 해석해요. 근친상간 금지와 아버지 살해라는 오이디푸스 콤플렉스가 종교와 도덕의 기원이라고 가설을 세워요. 원시 부족의 아들들이 아버지를 죽이고 죄책감으로 토템 숭배를 만들었다고 상상해요. 이 가설은 학계에서 비판을 많이 받았어요.|1913년 출간됐어요.
정신분석 입문|지그문트 프로이트는 1856년생 오스트리아의 정신분석학자예요.|이 책은 강의록이라 줄거리 대신 구성으로 소개해요. 비엔나 대학에서 일반 청중을 대상으로 한 강의를 모았어요. 1부는 실수 행위, 2부는 꿈, 3부는 신경증 이론을 다뤄요. 무의식, 억압, 전이 같은 핵심 개념을 쉽게 설명해요. 정신분석을 처음 접하는 사람에게 좋은 입문서예요.|1916~1917년 출간됐어요.
종교적 경험의 다양성|윌리엄 제임스는 1842년생 미국의 심리학자이자 철학자예요.|이 책은 강연을 엮은 책이라 줄거리 대신 구성으로 소개해요. 제임스는 교리가 아니라 개인의 종교 체험을 심리학적으로 연구해요. 회심, 성스러움, 신비 체험, 건강한 마음과 병든 영혼 등을 사례로 살펴봐요. 종교적 믿음의 가치는 그 결과로 판단해야 한다고 말해요. 실용주의 철학의 관점이 반영돼 있어요.|1902년 출간됐어요. 에든버러 대학 기퍼드 강연이 바탕이에요.
스펙터클의 사회|기 드보르는 1931년생 프랑스의 사상가이자 영화감독이에요.|이 책은 사회 비판서라 줄거리 대신 구성으로 소개해요. 드보르는 현대 사회에서 삶의 모든 것이 이미지, 곧 스펙터클로 대체되었다고 말해요. 사람들은 직접 경험하는 대신 이미지를 소비하며 수동적인 관객이 된다고 해요. 상품이 사회 전체를 지배한다는 점에서 마르크스 사상을 이어받아요. 총 221개의 짧은 명제로 이루어져 있어요.|1967년 출간됐어요. 1968년 5월 혁명에 영향을 줬어요.
경제학·철학 수고|카를 마르크스는 1818년생 독일의 철학자이자 경제학자예요.|이 책은 미완성 초고라 줄거리 대신 구성으로 소개해요. 마르크스는 자본주의에서 노동자가 노동 생산물, 노동 활동, 인간의 유적 본질, 타인으로부터 소외된다고 분석해요. 사유재산이 소외된 노동의 결과라고 말해요. 공산주의를 소외의 극복으로 설명해요. 청년 마르크스의 인간주의적 사상이 드러나요.|1844년 쓰였고 1932년에야 출간됐어요.
독일 이데올로기|카를 마르크스와 프리드리히 엥겔스가 함께 쓴 글이에요.|이 책은 철학 비판서라 줄거리 대신 구성으로 소개해요. 청년 헤겔학파의 관념론을 비판하며 역사는 물질적 생산 조건에서 설명돼야 한다고 말해요. 의식이 삶을 결정하는 것이 아니라 삶이 의식을 결정한다고 해요. 생산 방식과 분업, 소유 형태의 변화를 통해 역사를 설명하는 유물론적 역사관의 바탕을 제시해요. 지배 계급의 사상이 곧 지배적 사상이라고 말해요.|1845~46년 쓰였고 1932년에야 온전히 출간됐어요.
중세의 가을|요한 하위징아는 1872년생 네덜란드의 역사학자예요.|이 책은 문화사 연구서라 줄거리 대신 구성으로 소개해요. 14~15세기 프랑스와 네덜란드의 부르고뉴 지방 문화를 다뤄요. 중세 말기는 르네상스의 준비기가 아니라 중세 문화가 과도하게 무르익고 시들어 가는 가을이었다고 봐요. 기사도와 사랑, 죽음의 공포, 종교적 열정이 강렬했다고 설명해요. 사람들의 감정과 상상력에 주목해요.|1919년 출간됐어요.
문화의 해석|클리퍼드 기어츠는 1926년생 미국의 문화인류학자예요.|이 책은 인류학 논문집이라 줄거리 대신 구성으로 소개해요. 기어츠는 문화를 사람들이 의미를 부여하는 상징의 체계로 보아요. 문화를 연구하는 일은 법칙을 찾는 실험 과학이 아니라 의미를 읽어 내는 해석이라고 말해요. 이를 위해 '두꺼운 기술'이라는 방법을 제시해요. 발리의 닭싸움 분석이 유명한 사례예요.|1973년 출간됐어요.
야생의 사고|클로드 레비스트로스는 1908년생 프랑스의 인류학자예요.|이 책은 인류학서라 줄거리 대신 구성으로 소개해요. 레비스트로스는 이른바 '미개인'의 사고가 열등하지 않고 문명인과 다른 방식으로 체계적이라고 말해요. 토테미즘과 분류 체계를 분석해 자연을 이해하는 구체의 논리를 설명해요. 신화적 사고를 일종의 '브리콜라주', 곧 손에 있는 재료로 만들어 내는 방식에 비유해요. 구조주의 인류학을 대표하는 책이에요.|1962년 출간됐어요.
몰입|미하이 칙센트미하이는 1934년생 헝가리 출신 미국의 심리학자예요.|이 책은 심리학서라 줄거리 대신 구성으로 소개해요. 칙센트미하이는 사람이 어떤 일에 깊이 빠져 시간 가는 줄 모르는 상태를 '몰입'이라고 불러요. 몰입은 도전의 수준과 능력이 균형을 이룰 때 일어난다고 설명해요. 명확한 목표와 즉각적인 피드백이 있을 때 몰입하기 쉽다고 말해요. 일, 놀이, 관계에서 몰입을 경험하는 것이 행복한 삶으로 이어진다고 해요.|1990년 출간됐어요.
설득의 심리학|로버트 치알디니는 1945년생 미국의 심리학자예요.|이 책은 사회심리학서라 줄거리 대신 구성으로 소개해요. 치알디니는 사람들이 설득당하는 6가지 원칙을 설명해요. 상호성, 일관성, 사회적 증거, 호감, 권위, 희소성이에요. 판매원, 모금 활동 등의 사례를 통해 이런 원리가 일상에서 어떻게 쓰이는지 보여 줘요. 이를 알면 속임수에 대응하는 데도 도움이 된다고 말해요.|1984년 출간됐어요.
마인드셋|캐럴 드웩은 1946년생 미국의 심리학자예요.|이 책은 심리학서라 줄거리 대신 구성으로 소개해요. 드웩은 능력이 타고나서 변하지 않는다고 믿는 고정 마인드셋과 노력으로 성장한다고 믿는 성장 마인드셋을 구분해요. 고정 마인드셋을 가진 사람은 실패를 피하려 하고 성장 마인드셋을 가진 사람은 도전을 받아들인다고 설명해요. 교육, 스포츠, 직장, 인간관계에서의 사례를 다뤄요. 칭찬할 때는 노력과 과정에 초점을 맞추라고 말해요.|2006년 출간됐어요. 후속 연구에서 효과의 크기에 대한 논쟁이 있어요.
