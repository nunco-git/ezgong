<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="독서 골든벨 - 책을 읽고 퀴즈로 도전하는 독서 퀴즈 앱">
<link rel="icon" href="/smartgong_logo_icon.png">
<title>독서 골든벨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 무대 위 칠판 — 왼쪽 상단 단계 탭, 그 아래 장르 칩과 도서 서가; 문제 화면은 한 장의 큰 화이트보드 카드 */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16213A; --muted:#5B6680; --line:#D5DBE5;
  --brass:#B9821A; --brass-soft:#F6E7C4; --o:#1F5FBF; --x:#C33B32; --ok:#1E7D4F; --ok-soft:#DDF1E6; --bad-soft:#F8DEDB;
  --board:#1E3A34; --board-ink:#F3F1E7;
  --f-display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1422; --surface:#172034; --ink:#E7EBF4; --muted:#97A2BC; --line:#2A3550;
  --brass:#E2AE45; --brass-soft:#3A2F17; --o:#6FA3F2; --x:#F07B70; --ok:#58C58E; --ok-soft:#163528; --bad-soft:#3F1E1C;
  --board:#16302B; --board-ink:#F3F1E7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1422; --surface:#172034; --ink:#E7EBF4; --muted:#97A2BC; --line:#2A3550;
  --brass:#E2AE45; --brass-soft:#3A2F17; --o:#6FA3F2; --x:#F07B70; --ok:#58C58E; --ok-soft:#163528; --bad-soft:#3F1E1C;
  --board:#16302B; --board-ink:#F3F1E7; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.bell{width:44px;height:44px;flex:none}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,40px);letter-spacing:.01em;line-height:1}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.stats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (max-width:560px){.levels{grid-template-columns:repeat(3,1fr)}}
.lv{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.lv .n{font-family:var(--f-display);font-size:19px}
.lv .c{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.lv[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lv[aria-pressed="true"] .c{color:var(--bg);opacity:.75}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass);color:var(--ink);font-weight:700}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--brass);color:#1A1406}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.opts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .12s,border-color .12s}
.book:hover{border-color:var(--brass);transform:translateY(-2px)}
.book .t{font-weight:700;font-size:16px;line-height:1.3}
.book .a{font-size:12.5px;color:var(--muted)}
.book .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.best{color:var(--brass);font-weight:700}
.best.full::before{content:"🔔 "}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.rl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.rl h2{font-size:16px;margin:0 0 8px}.rl h2 small{font-weight:400;color:var(--muted);font-size:12px}
.rl ul,.rl ol{margin:0;padding-left:22px;display:grid;gap:4px}.rl li{font-size:14px;line-height:1.5}
.rl .src{display:block;font-size:12px;color:var(--muted)}.rl .a{font-size:12px;color:var(--muted)}
.rlb{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.note0{font-size:12px;color:var(--muted);margin:0 0 8px}
@media print{.qhead,.bar,header{display:none}.rl{border:0;padding:0}}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
/* quiz */
.stage{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted);min-width:0}
.crumb b{color:var(--ink)}
.lives{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.board{background:var(--board);color:var(--board-ink);border-radius:16px;padding:22px clamp(16px,4vw,32px) 26px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.qno{font-family:var(--f-display);font-size:clamp(22px,5vw,30px);color:var(--brass);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qno .kind{font-family:var(--f-body);font-size:12px;letter-spacing:.08em;border:1px solid currentColor;border-radius:6px;padding:1px 8px;color:var(--board-ink);opacity:.8}
.qtext{font-size:clamp(19px,3.6vw,25px);font-weight:700;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.timer{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--brass);width:100%;transform-origin:left}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.ch{background:var(--surface);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:13px 14px;text-align:left;display:flex;gap:10px;align-items:flex-start;font-weight:500;min-width:0}
.ch .k{font-family:var(--f-display);color:var(--brass);flex:none;width:1.4em}
.ch span:last-child{min-width:0;overflow-wrap:anywhere}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oxb{border:0;border-radius:16px;padding:18px 0;font-family:var(--f-display);font-size:clamp(46px,12vw,72px);line-height:1;background:var(--surface)}
.oxb.o{color:var(--o)} .oxb.x{color:var(--x)}
.sa{display:flex;gap:8px;flex-wrap:wrap}
.sa input{flex:1 1 220px;min-width:0;border:0;border-radius:12px;padding:14px;font:inherit;font-size:18px;font-weight:700;background:var(--board-ink);color:#1E3A34}
.ch.right,.oxb.right{border-color:var(--ok);background:var(--ok-soft);outline:3px solid var(--ok)}
.ch.wrong,.oxb.wrong{border-color:var(--x);background:var(--bad-soft)}
.ch:disabled,.oxb:disabled{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.feedback.good{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--x)}
.ex{margin:10px 0 0;background:var(--board-ink);color:#1E3A34;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.ex b{color:#8A5A0B;margin-right:6px}
.rex{font-size:13.5px;color:var(--muted);margin-top:3px;word-break:keep-all}
.feedback .ans{color:var(--ink);font-weight:500}
.feedback .self{display:flex;gap:6px}
.feedback .self button{border:1px solid currentColor;background:transparent;border-radius:8px;padding:4px 10px;font-size:12.5px}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.g{background:var(--ok)} .dots i.b{background:var(--x)} .dots i.c{background:var(--brass)}
/* result */
.result{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.score{font-family:var(--f-display);font-size:clamp(40px,10vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:.45em;color:var(--muted)}
.verdict{font-size:18px;font-weight:700}
.golden{color:var(--brass)}
.review{width:100%;display:flex;flex-direction:column;gap:8px}
.rv{border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.rv .q{font-weight:700}
.rv .r{color:var(--muted)} .rv .r b{color:var(--ok)}
.ring{animation:ring 1.2s ease-in-out 2;transform-origin:50% 10%}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(16deg)}40%{transform:rotate(-14deg)}60%{transform:rotate(9deg)}80%{transform:rotate(-5deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.intro h2{font-size:22px;line-height:1.3}
.intro .by{color:var(--muted);font-size:14px}
.intro section h3{font-size:14px;color:var(--brass);margin-bottom:4px;letter-spacing:.02em}
.intro section p{font-size:15.5px;line-height:1.75;word-break:keep-all}
.intro .go{display:flex;gap:8px;flex-wrap:wrap}
.book .ib{font-size:11px;color:var(--brass)}

.authbox{font-size:12px;margin-top:2px;text-align:right}.me{color:var(--muted)}
.lnk{background:transparent;border:0;color:var(--o);text-decoration:underline;padding:2px 4px;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.frm{display:grid;gap:12px}.frm label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.frm input,.frm select,.frm textarea{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;width:100%}
.frm .two,.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:560px){.two{grid-template-columns:1fr}}
.frm details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;gap:10px}.frm summary{cursor:pointer;font-size:13px}
.cmbox{border:1px dashed var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;justify-items:start;background:var(--surface)}
.rq .col{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.rq{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin-top:8px}
.rq .kind,.cmrow{font-size:12px}.kind.okk{background:var(--ok-soft);color:var(--ok)}.note0{font-size:12px;color:var(--muted)}.sh{font-size:15px;margin-top:18px}
.cmrow{color:var(--muted);margin:6px 0 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
.mbox{background:var(--bg);color:var(--ink);border-radius:14px;padding:18px;max-width:520px;width:100%;display:grid;gap:12px;max-height:92vh;overflow:auto}
.qorig{background:var(--surface);border-radius:8px;padding:8px 10px;margin:0;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;max-width:90vw}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <svg class="bell" id="logoBell" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5a3 3 0 0 1 3 3v1.6c6.3 1.4 10.5 7 10.5 13.6V31l3.5 5H7l3.5-5v-7.8C10.5 16.6 14.7 11 21 9.6V8a3 3 0 0 1 3-3z" fill="var(--brass)"/><circle cx="24" cy="41" r="4" fill="var(--brass)"/><path d="M15 23c0-4 2.4-7.2 6-8.4" stroke="var(--surface)" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".7"/></svg>
      <div><h1>독서 골든벨</h1><div class="sub">책을 고르면 골든벨 문제가 시작됩니다</div></div>
    </div>
    <div class="stats"><div id="stats"></div><div id="auth" class="authbox"></div></div>
  </header>
  <main id="view"></main>
</div>

<script type="text/plain" id="d-k">
# 구름빵|백희나|우리 그림책
O|구름빵에 나오는 가족은 고양이 가족이에요.	맞아요. 구름빵에는 고양이 엄마, 아빠, 그리고 두 아이가 나와요.
M|아이들이 작은 구름을 발견한 곳은 어디일까요?|나뭇가지|지붕 위|바닷가|자동차 안	아이들은 집 앞 나뭇가지에 걸려 있는 작은 구름을 발견했어요.
M|구름을 발견한 날의 날씨는?|비 오는 날|눈 오는 날|해가 쨍쨍한 날|바람 부는 날	비가 내리던 아침, 아이들은 비옷을 입고 밖에 나갔다가 구름을 찾았어요.
S|엄마는 구름으로 무엇을 만들었나요?|빵|구름빵	엄마는 구름을 반죽해 오븐에 구워 구름빵을 만들었어요.
O|구름빵을 먹으면 몸이 하늘로 둥실 떠올라요.	구름빵을 먹은 아이들은 몸이 둥실 떠올라 하늘을 날았어요.
X|아빠는 아침밥을 든든히 먹고 회사에 갔어요.	아빠는 늦잠을 자서 아침밥도 못 먹고 허둥지둥 회사에 갔어요.
M|아빠가 회사에 늦을 뻔한 까닭은?|길이 꽉 막혀서|비행기를 놓쳐서|신발을 잃어버려서|길을 잃어서	비 오는 날이라 길이 꽉 막혀 아빠는 회사에 늦을 뻔했어요.
M|아이들은 아빠에게 무엇을 가져다 드렸나요?|구름빵|우산|도시락|우유	아이들은 구름빵을 들고 날아가 배고픈 아빠에게 전해 드렸어요.
O|아빠는 구름빵을 먹고 하늘을 날아 회사에 늦지 않았어요.	구름빵을 먹은 아빠는 하늘을 날아 회사에 늦지 않게 도착했어요.
S|구름빵을 쓰고 만든 작가는?|백희나	백희나 작가는 인형을 만들고 사진을 찍어 이 그림책을 꾸몄어요.
# 강아지똥|권정생|우리 그림책
S|강아지똥은 어떤 강아지의 똥이었나요?|흰둥이|흰둥이 강아지	강아지똥은 골목길 담 밑에 흰둥이가 누고 간 똥이에요.
M|강아지똥을 보고 "더러워" 하며 날아간 새는?|참새|까치|비둘기|제비	참새가 날아와 "똥! 똥! 에그 더러워" 하며 날아갔어요.
O|흙덩이는 강아지똥에게 심한 말을 한 것을 미안해했어요.	흙덩이는 자기도 나쁜 짓을 해서 벌을 받는 거라며 강아지똥에게 사과했어요.
X|흙덩이는 끝까지 골목길에 혼자 남았어요.	흙덩이는 주인 할아버지가 소달구지에 실어 밭으로 데려갔어요.
M|봄비가 내린 뒤 강아지똥 옆에 돋아난 싹은?|민들레|해바라기|장미|튤립	봄비가 내린 뒤 강아지똥 곁에 민들레 싹이 돋아났어요.
M|민들레가 꽃을 피우려면 꼭 필요하다고 한 것은?|거름|모래|얼음|사탕	민들레는 꽃을 피우려면 강아지똥이 거름이 되어 주어야 한다고 했어요.
O|강아지똥은 빗물에 녹아 땅속으로 스며들었어요.	강아지똥은 빗물에 잘게 부서져 땅속으로 스며들었어요.
M|강아지똥은 결국 무엇이 되었나요?|민들레꽃의 한 부분|돌멩이|구름|새의 먹이	강아지똥은 민들레 뿌리로 들어가 노란 꽃을 피우는 데 쓰였어요.
X|강아지똥은 처음부터 자기가 아주 쓸모 있다고 생각했어요.	강아지똥은 처음에 자기가 더럽고 쓸모없다며 슬퍼했어요.
S|강아지똥을 쓴 작가는?|권정생	권정생 작가는 작고 보잘것없는 것들의 소중함을 이야기한 동화 작가예요.
# 알사탕|백희나|우리 그림책

82년생 김지영|조남주는 방송 작가로 일하다 소설가로 데뷔했고, 2016년 이 작품으로 큰 주목을 받았어요. 현실의 여성 삶을 사실적인 문체로 그려 내는 작가예요.|1982년 봄에 태어난 김지영은 평범한 가정의 둘째 딸로 자라요. 어린 시절 남동생과 차별받는 일을 겪고, 학창 시절에는 학교 안팎에서 불편한 일들을 마주해요. 대학을 나와 취업에 성공하지만 직장에서도 성별에 따른 불평등을 느껴요. 결혼과 출산 후에는 육아 때문에 경력이 끊기고 자신의 이름을 잃어 가요. 어느 날부터 지영은 어머니와 다른 사람의 목소리로 말하는 증상을 보여 남편 대현이 정신과 상담을 권해요. 소설은 의사의 기록 형식으로 지영의 삶을 정리하며 끝나요.|2016년 출간 뒤 큰 반향과 함께 찬반 논쟁이 일었고, 100만 부 넘게 팔린 베스트셀러가 됐어요. 2019년 영화로도 만들어졌고 여러 나라에 번역됐어요. 한국 사회의 젠더 문제를 대중적으로 이야기하게 만든 작품으로 평가돼요.
채식주의자|한강은 1970년 광주에서 태어난 소설가로, 시로 먼저 등단했고 2024년 한국 작가 최초로 노벨 문학상을 받았어요. 인간의 폭력과 상처를 시적인 문장으로 파고드는 작가예요.|평범한 주부 영혜는 어느 날 섬뜩한 꿈을 꾼 뒤 고기를 먹지 않겠다고 선언해요. 남편은 이해하지 못하고, 가족 모임에서 아버지가 억지로 고기를 먹이려 하자 영혜는 손목을 그어 병원에 실려 가요. 2부에서는 영혜의 형부인 비디오 아티스트가 영혜의 몸에 매혹돼 위험한 작업을 벌여요. 3부에서는 언니 인혜가 정신병원에 있는 영혜를 돌보며 그 삶을 마주해요. 영혜는 사람이 아닌 나무가 되고 싶어 하며 음식을 거부해요. 세 개의 시선으로 한 여성의 변화를 그려요.|이 작품으로 한강은 2016년 맨부커 인터내셔널상을 받았어요. 번역은 데버러 스미스가 했고, 번역의 정확성을 둘러싼 논의도 있었어요. 폭력과 욕망, 인간 본성에 대한 물음으로 해외에서도 주목받았어요.
엄마를 부탁해|신경숙은 1963년 전북 정읍에서 태어난 소설가로, 섬세한 감성의 문장으로 사랑받았어요. 『외딴방』 『리진』 등을 썼어요.|서울역 지하철에서 엄마 박소녀가 가족과 길이 엇갈려 사라지면서 이야기가 시작돼요. 큰딸, 큰아들, 아버지, 그리고 엄마 자신의 시선으로 이야기가 이어져요. 가족들은 전단지를 붙이고 찾아다니며 그동안 몰랐던 엄마의 삶을 하나씩 알아 가요. 글을 읽지 못하는 엄마가 자식들을 위해 평생 희생했다는 사실과, 엄마만의 비밀이 드러나요. 가족들은 엄마에게 해 주지 못한 일을 후회해요. 끝내 엄마를 찾았는지 여운을 남기는 결말이에요.|2011년 미국에서 번역 출간돼 큰 관심을 받았고, 맨아시아 문학상을 받았어요. 한국 소설로는 드물게 해외에서도 많이 읽혔어요. 다만 작가의 표절 논란이 일어 평가가 엇갈리기도 했어요.
칼의 노래|김훈은 1948년 서울에서 태어난 소설가로, 신문기자로 오래 일했어요. 짧고 단단한 문체와 역사적 인물을 보는 독특한 시선으로 알려졌어요.|정유재란이 일어난 시기를 배경으로 이순신 장군이 모함을 받아 감옥에 갇혔다 풀려나 백의종군하는 장면에서 시작해요. 그는 조정의 의심과 전쟁의 공포를 견디며 수군을 다시 일으켜요. 12척의 배로 명량해전을 치르고 연이은 승리를 거두지만 막내아들의 전사 소식을 듣고 깊은 슬픔에 빠져요. 마지막 노량해전에서 이순신은 전사해요. 소설은 영웅의 업적이 아닌 죽음을 앞둔 한 인간의 고독과 내면을 보여 줘요.|2001년 출간돼 오랫동안 베스트셀러였고 동인문학상을 받았어요. 이순신 소설의 새 기준으로 평가돼요. 첫 문장의 조사를 '꽃이'로 할지 '꽃은'으로 할지 작가가 고민한 일화로 유명해요.
하얼빈|김훈은 『칼의 노래』 『남한산성』으로 역사 소설의 새 경지를 연 작가예요. 군더더기 없는 문장이 특징이에요.|1908년 안중근은 의병 활동을 이어 가다 일본군에 맞서 싸운 뒤 석방한 포로 문제로 번민해요. 이후 연해주에서 동지들과 의병 부대를 이끌며 무장 투쟁의 한계를 절감해요. 1909년 이토 히로부미가 하얼빈을 방문한다는 소식을 듣고 우덕순, 조도선, 유동하 등과 함께 거사를 준비해요. 천주교 신앙을 가진 안중근은 살인에 대한 갈등과 신앙적 번민을 안고 있어요. 10월 26일 하얼빈역에서 이토를 저격하고 체포돼요. 소설은 거사를 둘러싼 인간적인 고뇌에 초점을 맞춰요.|2022년 출간됐고, 안중근 의거 113주년을 맞아 주목받았어요. 영웅의 신화보다 한 사람의 결단을 다룬 점이 특징이에요. 역사 속 인물을 현대 독자에게 새롭게 보여 줬다는 평가를 받아요.
아버지의 해방일지|정지아는 1965년 전남 구례에서 태어난 소설가예요. 빨치산 아버지를 둔 가족사를 바탕으로 한 경험이 이 작품에 담겼어요.|주인공 고아리는 아버지 고상욱의 갑작스러운 죽음으로 전남 구례의 고향 집으로 내려와 장례를 치러요. 아버지는 젊어서 빨치산으로 활동했고 감옥에 다녀온 뒤 평생 마을 사람들에게 베풀며 산 사람이에요. 장례식장에는 마을 사람들과 옛 동지, 친척들이 줄줄이 찾아와 아버지와 얽힌 일화를 들려줘요. 딸은 이념의 상처 때문에 아버지를 원망했지만 조문객들의 이야기를 통해 아버지의 따뜻한 마음을 알게 돼요. 사흘간의 장례를 통해 가족이 서로를 이해하게 돼요.|2022년 출간돼 큰 인기를 얻었고 이호철통일로문학상을 받았어요. 이념 갈등을 인간적인 시선으로 풀어냈다는 평가를 받아요. 해학이 섞인 문체로 독자층이 넓어졌어요.
불편한 편의점|김호연은 영화 시나리오와 소설을 쓰는 작가로, 『망원동 브라더스』 등을 썼어요. 일상의 따뜻함을 유머로 풀어내요.|서울 청파동 골목의 작은 편의점은 점주 염 여사가 운영하는 곳이에요. 어느 날 서울역에서 지내던 노숙인 독고 씨가 염 여사의 지갑을 찾아 준 인연으로 야간 직원이 돼요. 독고는 손님에게 정중하게 인사하고 성실하게 일하며 편의점의 분위기를 바꿔 가요. 취준생, 외로운 노인, 가출한 청소년 등 편의점을 찾는 사람들이 독고와 이야기하며 조금씩 마음을 열어요. 독고가 기억을 잃었다는 비밀도 하나씩 풀려요. 따뜻한 연작 형식으로 이어져요.|2021년 출간 뒤 입소문으로 큰 인기를 얻어 2020년대 대표 베스트셀러가 됐어요. 연극과 드라마로도 만들어졌고 후속작이 나왔어요. 이웃과의 정에 대한 이야기가 공감을 얻었어요.
달러구트 꿈 백화점|이미예는 소설가로, 이 작품이 첫 장편이에요. 독자 투고 플랫폼인 텀블벅 후원으로 먼저 출간돼 화제가 됐어요.|잠이 들면 갈 수 있는 꿈 세계에는 꿈을 파는 달러구트 꿈 백화점이 있어요. 갓 입사한 신입 직원 페니는 이곳에서 일하며 손님들이 원하는 꿈을 고르고 파는 일을 배워요. 달콤한 꿈을 사려는 사람, 악몽이 필요한 사람 등 사연이 다양해요. 꿈을 만드는 제작자와 판매 직원들의 이야기도 이어져요. 달러구트 사장은 꿈의 의미와 사람의 마음에 대해 이야기해 줘요. 소설은 일상 속 작은 위로를 판타지로 풀어요.|2020년 출간돼 큰 인기를 끌었고 시리즈로 이어졌어요. 잠과 꿈을 소재로 한 따뜻한 판타지 소설이에요. 여러 나라에 번역돼 해외에서도 읽혀요.
파친코|이민진은 1968년 서울에서 태어나 일곱 살에 미국으로 이민 간 재미 교포 작가예요. 변호사로 일하다 소설가가 됐어요.|1910년대 부산 영도의 어촌에서 태어난 선자는 아버지를 여의고 하숙집을 운영하는 어머니와 함께 살아요. 선자는 생선 중개상 고한수의 아이를 가졌지만 한수가 유부남임을 알게 되고, 목사 이삭의 청혼을 받아 일본 오사카로 건너가요. 이삭이 투옥되고 가족을 책임지게 된 선자는 김치를 팔며 아이들을 키워요. 이후 아들 노아와 모자수, 손자 솔로몬까지 4대가 차별과 가난 속에서 살아가요. 선자는 가족을 지켜 내는 삶을 이어 가요.|2017년 영어로 출간됐고 전미도서상 최종 후보에 올랐어요. 2022년 애플TV+ 드라마로 만들어졌어요. 재일 한국인의 역사를 세계에 알린 작품이에요.
미드나잇 라이브러리|매트 헤이그는 1975년생 영국 작가예요. 우울증을 겪은 경험을 바탕으로 한 에세이 『살아야 하는 이유』로도 알려졌어요.|주인공 노라 시드는 서른다섯 살로, 직업도 가족도 잃고 삶의 의미가 없다고 느껴 스스로 생을 끝내려 해요. 하지만 눈을 뜨자 시간이 멈춘 신비한 도서관에 와 있어요. 사서 엘름 부인은 이곳에 선택하지 않은 삶이 담긴 책이 무수히 있다고 알려 줘요. 노라는 책을 펼쳐 빙하 연구자, 가수, 올림픽 수영 선수 등 다른 삶을 살아 봐요. 그러나 어떤 삶도 완벽하지 않다는 것을 알게 돼요. 노라는 지금 자신의 삶을 다시 바라보게 돼요.|2020년 출간돼 전 세계에서 큰 인기를 얻었어요. 후회와 가능성, 삶의 의미를 묻는 작품으로 평가돼요. 한국에서도 베스트셀러가 됐어요.
연금술사|파울로 코엘료는 1947년생 브라질 작가로, 순례길 경험을 『순례자』에 담았어요. 『연금술사』로 세계적 명성을 얻었어요.|양치기 소년 산티아고는 이집트 피라미드 근처에 보물이 있다는 꿈을 두 번 반복해서 꿔요. 집시 노파와 살렘의 왕 멜기세덱을 만난 뒤 보물을 찾으러 떠나요. 탕헤르에서 돈을 잃고 수정 가게에서 일하며 돈을 모아요. 사막에서는 영국인 화학자를 만나고 연금술사를 따라가요. 길 위에서 파티마라는 여인도 만나 사랑을 경험해요. 마침내 피라미드에 도착하고, 보물이 어디 있는지 깨달아요.|1988년 출간됐고 처음에는 잘 팔리지 않았지만 이후 70여 개 언어로 번역돼 세계적 베스트셀러가 됐어요. '자아의 신화'라는 메시지가 널리 사랑받았어요.
나미야 잡화점의 기적|히가시노 게이고는 1958년 오사카 출신의 추리 소설가예요. 『용의자 X의 헌신』으로 나오키상을 받았어요.|좀도둑 세 청년 아쓰야, 쇼타, 고헤이는 도둑질 후 폐가가 된 나미야 잡화점에 숨어들어요. 그런데 가게 셔터 우편함으로 고민을 적은 편지가 들어와요. 사실 이 가게는 32년 전 나미야 할아버지가 편지로 고민 상담을 해 주던 곳이에요. 세 청년은 편지에 답장을 쓰다가 과거와 연결돼 있음을 알게 돼요. 여러 인물의 사연이 얽히며 마침내 모든 이야기가 하나로 이어져요. 연결된 사람들의 삶이 따뜻하게 마무리돼요.|2012년 출간돼 일본과 한국에서 큰 인기를 얻었고, 영화로도 만들어졌어요. 추리가 아닌 따뜻한 이야기라는 점에서 작가의 다른 작품과 구별돼요.
노르웨이의 숲|무라카미 하루키는 1949년 교토에서 태어난 일본 작가로, 재즈 바를 운영하다 소설을 쓰기 시작했어요. 『해변의 카프카』 『1Q84』로도 유명해요.|1968년 무렵 도쿄에서 대학을 다니는 와타나베는 친구 기즈키의 자살 이후 큰 상실을 겪어요. 기즈키의 연인이었던 나오코와 재회해 가까워지지만 나오코는 마음의 병이 깊어 요양원에 들어가요. 와타나베는 활기찬 미도리를 만나 새로운 감정에 눈떠요. 나오코를 향한 마음과 미도리를 향한 마음 사이에서 갈등해요. 요양원을 찾은 와타나베는 나오코의 마음을 이해하려 애써요. 이후 비극을 겪은 와타나베는 방황 끝에 삶으로 돌아오려 해요.|1987년 출간돼 일본에서 큰 인기를 얻었고, 작가의 이름이 알려지는 계기가 됐어요. 제목은 비틀즈의 노래에서 따왔어요. 한국에서는 '상실의 시대'라는 제목으로도 나왔어요.
인간 실격|다자이 오사무는 1909년생 일본 작가로, 몰락한 삶과 자기 파괴적인 면모로 유명해요. 여러 차례 자살을 시도하다 1948년에 생을 마쳤어요.|이 소설은 서문과 후기, 그리고 세 편의 수기로 이루어져 있어요. 주인공 오바 요조는 어릴 적부터 사람을 두려워해 익살꾼 연기를 하며 살아가요. 도쿄에서 학교를 다니며 술과 여자, 좌익 운동에 빠져요. 여러 여인과 얽히며 동반 자살을 시도하지만 혼자 살아남아요. 결혼 후에도 아내가 겪은 사건으로 큰 충격을 받고 점점 무너져 가요. 결국 정신병원에 갇히고 스스로 인간 자격을 잃었다고 말해요.|1948년 발표됐고 일본 근현대 문학의 대표작으로 꼽혀요. 작가의 삶이 겹쳐 읽히는 점도 알려져 있어요. 우울과 소외를 다룬 작품이라 읽을 때 주의가 필요해요.
페스트|알베르 카뮈는 1913년 알제리에서 태어난 프랑스 작가로, 1957년 노벨 문학상을 받았어요. 부조리 철학으로 유명해요.|194X년 알제리 오랑시에서 쥐가 떼죽음을 당하고 사람들이 열병으로 죽어 가요. 의사 리외는 페스트임을 확신하고 시 당국에 대처를 촉구해요. 도시는 봉쇄되고 사람들은 가족과 헤어져 고통받아요. 리외와 타루, 랑베르, 파늘루 신부 등이 각자의 방식으로 페스트와 싸우며 연대해요. 시간이 흘러 페스트가 물러가고 사람들은 기쁨에 휩싸이지만 리외는 페스트가 언제든 돌아올 수 있음을 기억해요.|1947년 출간됐고 전염병과 인간의 연대를 다룬 고전이에요. 코로나19 시기에 다시 많이 읽혔어요. 페스트는 전쟁과 전체주의를 상징한다고 해석돼요.
이반 일리치의 죽음|레프 톨스토이는 1828년생 러시아 작가로, 『전쟁과 평화』 『안나 카레니나』를 썼어요. 후기에는 종교와 도덕에 몰두했어요.|소설은 판사 이반 일리치의 장례식 장면에서 시작해요. 동료들은 슬픔보다 그의 빈자리를 채울 자리에 더 관심을 가져요. 이야기는 이반의 삶으로 돌아가 평범하고 규칙적인 출세 과정을 보여 줘요. 새 집을 꾸미다 사다리에서 떨어져 옆구리를 다친 뒤 병이 깊어져요. 의사들은 정확한 병명을 알려 주지 않고 가족은 그의 고통을 외면해요. 죽음을 앞두고 이반은 자신의 삶이 잘못되었음을 깨닫고, 하인 게라심의 진심 어린 보살핌에 위로를 받아요.|1886년 발표됐고 죽음을 다룬 문학의 고전으로 꼽혀요. 형식적이고 허위에 찬 삶을 비판하는 작품이에요.
오베라는 남자|프레드릭 배크만은 1981년생 스웨덴 작가예요. 블로그 칼럼니스트로 시작해 소설가가 됐어요.|59세의 오베는 아내 소냐를 잃고 직장에서도 해고돼 삶의 의미를 잃었어요. 그는 스스로 목숨을 끊으려 하지만 번번이 이웃의 방해로 실패해요. 새로 이사 온 이웃 파르바네는 오베에게 도움을 청하며 자연스럽게 관계를 맺어요. 오베는 투덜대면서도 이웃을 도와 주며 조금씩 마음을 열어요. 그의 과거와 아내와의 사랑 이야기가 번갈아 펼쳐져요. 이웃과 함께하는 삶의 따뜻함을 보여 줘요.|2012년 출간돼 스웨덴과 세계에서 큰 인기를 얻었어요. 영화화돼 아카데미상 후보에 올랐고, 톰 행크스 주연의 미국판도 만들어졌어요.
미움받을 용기|기시미 이치로는 일본의 철학자이고 고가 후미타케는 작가예요. 두 사람이 아들러 심리학을 대화체로 풀어 썼어요.|세상과 자신이 못마땅한 청년이 어느 철학자를 찾아가 인간은 누구나 변할 수 있다는 주장에 반박하며 대화를 시작해요. 철학자는 아들러 심리학에 따라 트라우마는 존재하지 않고 목적에 따라 감정이 만들어진다고 말해요. 청년은 반발하지만 대화를 거듭하며 과제의 분리, 인정 욕구의 위험, 공동체 감각 등을 배워요. 다섯 번의 밤에 걸쳐 대화가 이어지며 청년의 생각이 조금씩 바뀌어요. 마지막에는 지금 이 순간을 진지하게 사는 것이 중요하다는 결론에 이르러요.|2013년 일본에서 출간돼 세계적으로 큰 인기를 얻었고, 한국에서도 오랫동안 베스트셀러였어요. 아들러 심리학의 대중화에 기여했지만, 단순화라는 비판도 있어요.
아주 작은 습관의 힘|제임스 클리어는 미국의 작가이자 강연가로, 습관과 의사결정에 대한 글로 알려졌어요.|이 책은 소설이 아닌 자기계발서라 줄거리 대신 구성으로 소개해요. 저자는 작은 습관이 시간이 지나며 큰 변화를 만든다는 복리 효과를 설명해요. 습관은 신호, 열망, 반응, 보상의 네 단계로 이루어진다고 하고 각 단계를 바꾸는 법칙을 제시해요. 좋은 습관을 만드는 네 가지 법칙은 분명하게, 매력적으로, 쉽게, 만족스럽게 하는 것이에요. 나쁜 습관을 끊을 때는 반대로 하면 된다고 설명해요. 정체성을 바꾸는 방식으로 습관을 유지하라고 조언해요.|2018년 출간돼 세계적 베스트셀러가 됐어요. 1% 개선의 복리 효과가 핵심 메시지예요. 실천 방법이 구체적이라 자기계발서로 널리 읽혀요.
데일 카네기 인간관계론|데일 카네기는 1888년생 미국의 강연가이자 작가예요. 화술과 인간관계 강좌를 열어 성공을 거뒀어요.|이 책은 자기계발서라 줄거리 대신 구성으로 소개해요. 1부는 사람을 다루는 기본 원칙으로 비난하지 않고 진심으로 인정하라고 말해요. 2부는 호감을 얻는 여섯 가지 방법으로 관심을 보이고 미소 짓고 이름을 기억하라고 알려요. 3부는 상대를 설득하는 방법으로 논쟁을 피하고 존중하라고 해요. 4부는 리더가 되는 방법으로 잘못을 간접적으로 지적하라고 조언해요. 책 전체에 실제 사례와 인물의 일화가 풍부해요.|1936년 출간돼 오랫동안 읽혀 온 자기계발서의 고전이에요. 수천만 부가 팔린 것으로 알려져요. 진심으로 상대에게 관심을 가지라는 메시지로 유명해요.
남한산성|김훈의 역사 소설로, 병자호란 시기를 다뤄요. 문장이 간결하고 사실적이에요.|1636년 12월 병자호란이 일어나 청나라 군대가 압록강을 건너오자 인조는 남한산성으로 피신해요. 성안에서는 예조판서 김상헌이 맞서 싸워야 한다고 주장하고, 이조판서 최명길은 화친을 해서라도 백성을 살려야 한다고 맞서요. 눈과 추위 속에서 식량은 떨어지고 군사들은 지쳐 가요. 대장장이 서날쇠가 임금의 명을 받아 성 밖으로 나가 소식을 전하기도 해요. 결국 인조는 삼전도에서 청 태종 앞에 무릎을 꿇어요. 소설은 47일간의 농성을 담아요.|2007년 출간돼 베스트셀러가 되었고 2017년 영화로 만들어졌어요. 명분과 현실의 갈등을 다룬 작품으로 평가돼요.
태백산맥|조정래는 1943년생 소설가로, 『아리랑』 『한강』과 함께 대하소설 3부작을 썼어요.|1948년 여순 사건 직후 전남 벌교에서 시작해요. 좌익 활동가 염상진과 우익 군인 김범우의 형제 같은 관계와 대립이 중심이에요. 무당 소화, 지주 정하섭, 농민들까지 다양한 인물이 이념의 갈등 속에서 상처를 입어요. 빨치산은 산에 들어가 투쟁하고 토벌대는 이를 추격해요. 전쟁이 일어나면서 벌교 사람들의 삶은 더욱 무너져 가요. 이념보다 사람의 삶이 먼저라는 메시지를 전해요.|1986~1989년 연재됐고 약 800만 부가 팔린 것으로 알려져요. 분단 현실을 다뤘다는 평가와 함께 이념 논쟁도 일었어요. 영화와 드라마로도 만들어졌어요.
작별하지 않는다|한강이 2021년 발표한 장편소설로, 제주 4·3 사건을 다뤘어요.|소설가 경하는 5·18을 다룬 책을 쓴 뒤 악몽에 시달리며 지내요. 어느 날 제주에 있는 친구 인선에게서 급한 연락을 받고, 눈보라를 뚫고 제주로 가요. 인선의 집에서 경하는 인선의 어머니가 겪은 4·3의 이야기를 알게 돼요. 학살 당시 가족을 잃은 어머니의 기억이 경하에게 전해져요. 촛불을 지키며 죽은 이들을 애도하는 이야기예요. 소설은 기억과 애도를 이어 가는 일을 보여 줘요.|한강은 이 작품으로 2023년 프랑스 메디치 외국문학상을 받았어요. 노벨 문학상 수상 이유에 역사의 상처와 인간 삶의 연약함을 드러낸 시적 산문이 언급됐어요.
7년의 밤|정유정은 1966년생 소설가로, 치밀한 구성과 속도감 있는 서사로 알려졌어요.|세령마을 저수지의 수문을 연 사건으로 많은 사람이 희생돼요. 소설은 이 사건 이후 7년이 지난 시점의 아들 서원의 이야기로 시작해요. 아버지 현수는 세령호 관리인으로 일하다 마을 유지 영제의 딸 세령을 죽게 하고 도망쳐요. 영제는 딸의 죽음에 복수를 시작하고, 현수의 가족을 파멸로 몰아요. 서원은 아버지의 죄와 영제의 복수 사이에서 성장해요. 현재와 과거를 오가며 진실이 드러나요.|2011년 출간돼 큰 인기를 얻었고 2018년 영화화됐어요. 한국 스릴러 소설의 대표작으로 꼽혀요.
살인자의 기억법|김영하는 1968년생 소설가로, 『검은 꽃』 『살인자의 기억법』으로 알려졌고 방송에서도 활동해요.|주인공 김병수는 한때 연쇄살인범이었지만 지금은 알츠하이머에 걸린 노인이에요. 그는 기억이 사라져 가는 가운데 일기를 쓰며 자신의 과거를 정리해요. 딸 은희가 만나는 남자 박주태가 자신과 같은 연쇄살인범이라고 확신해요. 병수는 딸을 지키려고 박주태를 죽이려 계획하지만 기억이 흐려져요. 일기의 내용이 사실인지 의심스러운 순간이 이어지며 반전이 드러나요. 화자의 신뢰성이 흔들리는 결말이에요.|2013년 출간됐고 2017년 영화화됐어요. 짧은 분량과 반전으로 인기를 얻었고 해외에도 번역됐어요.
지구 끝의 온실|김초엽은 1993년생 SF 작가로, 『우리가 빛의 속도로 갈 수 없다면』으로 알려졌어요.|더스트라는 먼지 재난이 지구를 덮친 뒤 인류는 돔 도시에 모여 살아요. 식물 생물학자 아영은 더스트가 사라진 지금 한 온실의 비밀을 알게 돼요. 온실에는 모스바나라는 식물이 자라고 있어요. 아영은 지수, 레이첼, 나오미 등 과거 사람들의 이야기를 따라가며 온실이 어떻게 만들어졌는지 알아 가요. 세대를 넘어 서로를 돌본 사람들의 연대가 드러나요. 소설은 재난 이후 공존의 가능성을 보여 줘요.|2021년 출간됐고 한국 SF 대표작으로 꼽혀요. 환경 문제와 공존, 돌봄이라는 주제를 다뤄요.
연을 쫓는 아이|할레드 호세이니는 1965년생 아프가니스탄 출신의 미국 작가예요. 의사로 일하다 소설을 썼어요.|1970년대 카불의 부유한 집안 아들 아미르는 하인의 아들 하산과 함께 자라요. 연날리기 대회에서 하산은 아미르를 위해 연을 쫓아가지만 불량배 아세프에게 폭행당해요. 아미르는 이를 보고도 숨어서 외면하고, 죄책감에 하산을 집에서 내쫓아요. 소련 침공으로 아미르와 아버지는 미국으로 피난 가요. 세월이 지나 탈레반 치하의 아프가니스탄으로 돌아간 아미르는 하산의 아들 소랍을 구해 속죄하려 해요.|2003년 출간돼 큰 인기를 얻었고 영화로도 만들어졌어요. 아프가니스탄의 역사와 난민 문제를 알린 작품이에요.
향수|파트리크 쥐스킨트는 1949년생 독일 작가로, 대중 앞에 잘 나서지 않는 것으로 유명해요.|18세기 파리 생선 시장에서 그르누이는 냄새가 없는 몸으로 태어나요. 그는 천재적인 후각을 지녀 도시의 모든 냄새를 구별해요. 조향사 발디니에게 향수 제조를 배우고 그라스로 가서 완벽한 향을 만들려 해요. 아름다운 소녀들의 체취를 추출하려고 연쇄 살인을 저질러요. 마침내 완벽한 향수를 완성하지만 그것이 불러온 결말은 비극적이에요.|1985년 출간돼 세계적으로 큰 인기를 얻었어요. 2006년 영화로 만들어졌어요. 집착과 예술, 인간 본성을 다룬 작품이에요.
장미의 이름|움베르토 에코는 1932년생 이탈리아의 기호학자이자 소설가였어요. 중세 연구로도 유명해요.|1327년 이탈리아의 한 베네딕트 수도원에 윌리엄 수도사와 제자 아드소가 도착해요. 수도원에서는 이미 수도사 한 명이 의문사했고 이후 연쇄 살인이 이어져요. 윌리엄은 금서가 보관된 장서관에서 단서를 찾아요. 웃음을 둘러싼 아리스토텔레스의 책이 사건의 열쇠임이 밝혀져요. 장서관 안에서 벌어진 비밀이 드러나고, 수도원은 불길에 휩싸여요. 추리와 중세의 신학 논쟁이 뒤섞인 이야기예요.|1980년 출간돼 작가를 세계적 작가로 만들었어요. 1986년 숀 코너리 주연의 영화로 만들어졌어요. 중세 철학과 추리를 결합한 작품이에요.
1Q84|무라카미 하루키의 장편으로, 1984년을 배경으로 한 평행 세계 이야기예요.|1984년 도쿄에서 아오마메는 택시 안에서 들은 야나체크의 곡을 계기로 비상계단을 내려가 1Q84의 세계로 들어가요. 한편 소설가 지망생 덴고는 후카에리가 쓴 소설 『공기 번데기』를 고쳐 쓰는 일을 맡아요. 아오마메와 덴고는 어린 시절 서로의 손을 잡았던 인연으로 이어져 있어요. 하늘에는 두 개의 달이 떠 있고 종교 단체와 리틀 피플이 등장해요. 두 사람은 서로를 찾아 헤매며 마침내 만나려 해요.|2009~2010년 출간돼 일본에서 크게 인기를 얻었어요. 조지 오웰의 『1984』를 연상시키는 제목이에요.
용의자 X의 헌신|히가시노 게이고의 대표작으로, 가가미 교수 시리즈의 하나예요. 2006년 나오키상을 받았어요.|이혼한 야스코와 딸 미사토는 전남편이 찾아와 다투다 살해하고 말아요. 이웃의 수학 교사 이시가미가 이를 알고 사건을 은폐해 주겠다고 나서요. 이시가미는 치밀한 알리바이를 설계해 경찰의 수사를 따돌려요. 하지만 형사 구사나기의 친구인 물리학자 유가와가 사건에 관여하며 트릭을 의심해요. 유가와는 이시가미가 야스코를 위해 모든 희생을 감수했다는 것을 알게 돼요. 사랑과 헌신이 어긋난 결말이에요.|2005년 출간돼 일본 추리 소설 최고 작품으로 꼽혀요. 한국과 중국에서도 영화로 만들어졌어요.
그리고 아무도 없었다|애거사 크리스티는 1890년생 영국 추리 소설가로, 80여 편의 추리 소설을 썼어요.|서로 모르는 열 사람이 인디언 섬의 저택에 초대돼요. 저녁 식사 중 녹음된 목소리가 이들의 과거 죄를 폭로해요. 그날 밤부터 한 명씩 동요 가사대로 죽어 가요. 섬에는 외부와 연락할 방법이 없고 사람들은 서로를 의심해요. 마지막에는 모두가 죽은 채 발견되고 경찰은 혼란에 빠져요. 이후 범인의 편지로 모든 진상이 밝혀져요.|1939년 출간됐고 1억 부 넘게 팔린 것으로 알려진 추리 소설의 대표작이에요. 여러 번 영화와 드라마로 만들어졌어요.
오리엔트 특급 살인|애거사 크리스티의 작품으로, 탐정 에르퀼 푸아로가 등장하는 대표작이에요.|탐정 푸아로는 이스탄불에서 오리엔트 특급 열차에 올라요. 어느 밤 열차가 눈에 갇히고 부유한 미국인 래칫이 열두 군데 칼에 찔려 죽은 채 발견돼요. 푸아로는 승객 열두 명을 차례로 조사하며 알리바이를 확인해요. 승객들의 국적과 직업은 모두 달라 보이지만 이상한 접점이 있어요. 래칫이 과거 유괴 사건의 범인이었다는 사실이 드러나요. 푸아로는 놀라운 진상을 밝혀 내고 마지막 선택을 해요.|1934년 출간됐고 여러 번 영화화됐어요. 반전이 뛰어난 결말로 유명해요.
그리스인 조르바|니코스 카잔차키스는 1883년 크레타섬에서 태어난 그리스 작가예요.|지식인인 화자는 책에만 파묻혀 살다 크레타섬의 폐광을 사 갈탄 사업을 하려 해요. 피레우스 항구에서 알게 된 예순이 넘은 조르바를 일꾼으로 데려가요. 조르바는 산투르를 연주하고 춤추며 삶을 온몸으로 사는 인물이에요. 두 사람은 광산 사업과 여인들과의 만남을 겪으며 가까워져요. 사업은 실패하고 조르바는 떠나지만 화자는 그에게서 자유로운 삶의 의미를 배워요.|1946년 발표됐고 1964년 영화로 만들어졌어요. 자유와 삶에 대한 열정을 보여 주는 작품이에요. 작가는 노벨 문학상 후보에 여러 번 올랐어요.
달과 6펜스|서머싯 몸은 1874년생 영국 작가로, 의사로 일하다 소설가가 됐어요.|런던의 증권 중개인 찰스 스트릭랜드는 평범한 가정을 꾸리고 살지만 어느 날 아무 말 없이 가족을 버리고 파리로 가요. 그는 화가가 되기 위해 극심한 가난을 견뎌요. 화자는 파리에서 스트릭랜드를 만나고 그의 비정함에 놀라요. 스트릭랜드는 병든 몸으로 타히티까지 가서 원주민 여인 아타와 살며 걸작을 그려요. 죽음을 앞두고 벽화를 남기지만 불태우라는 유언을 남겨요.|1919년 출간됐고 예술과 현실의 대립을 다룬 대표작으로 꼽혀요. 제목의 달은 예술을, 6펜스는 현실을 상징한다고 해석돼요.
설국|가와바타 야스나리는 1899년생 일본 작가로, 1968년 일본인 최초로 노벨 문학상을 받았어요.|도쿄의 무용 평론가 시마무라는 눈 덮인 온천 마을을 찾아가 게이샤 고마코를 만나요. 그는 마을에 갈 때마다 고마코와 만남을 이어 가지만 마음을 온전히 내주지 않아요. 열차에서 우연히 본 소녀 요코에게도 이끌려요. 고마코는 병든 사람을 위해 몸을 파는 일까지 하며 헌신적으로 살아요. 마지막 장면에서 누에고치 창고에 불이 나고 요코가 떨어지는 장면이 나와요. 허무와 아름다움이 섞인 분위기로 끝나요.|1935년부터 연재됐고 1948년에 완결됐어요. 첫 문장 '터널을 빠져나오자 눈의 고장이었다'가 유명해요.
나는 고양이로소이다|나쓰메 소세키는 1867년생 일본 작가로, 일본 근대 문학을 대표해요.|이름 없는 고양이는 영어 교사 구샤미의 집에서 살게 돼요. 고양이는 주인과 그의 친구 메이테이, 간게쓰, 도후 등이 모여 나누는 대화를 관찰해요. 이들은 유머와 풍자가 섞인 이야기를 나누고 사업가 가네다와 갈등을 겪어요. 고양이는 인간의 허영과 어리석음을 비웃고 때로는 쥐를 잡으려다 실패하기도 해요. 마지막에 고양이는 술을 먹고 독에 빠져 죽음을 맞아요.|1905~1906년 연재됐고 소세키의 데뷔작이에요. 메이지 시대 지식인 사회를 풍자한 소설로 평가돼요.
자기 앞의 생|에밀 아자르는 프랑스 작가 로맹 가리의 필명이에요. 로맹 가리는 이 필명으로 공쿠르상을 한 번 더 받았어요.|열 살 아랍 소년 모모는 파리 빈민가에서 유대인 로자 아줌마에게 맡겨져 자라요. 로자 아줌마는 창녀들의 아이를 키워 주는 일로 생계를 이어 가요. 모모는 아줌마가 늙고 병들어 가는 모습을 지켜보며 삶의 두려움을 배워요. 로자는 병원에 가는 것을 싫어하고 모모에게 마지막까지 곁에 있어 달라고 말해요. 아줌마는 지하실에서 세상을 떠나요. 모모는 사랑을 간직하고 살아갈 힘을 얻어요.|1975년 공쿠르상을 받았어요. 로맹 가리는 한 작가에게 한 번만 주는 상을 두 번 받아 화제가 됐어요. 사후에야 필명의 정체가 알려졌어요.
나의 문화유산답사기|유홍준은 1949년생 미술사학자로, 문화재청장을 지냈어요.|이 책은 소설이 아닌 답사기라 줄거리 대신 구성으로 소개해요. 1권은 남도 답사 1번지인 강진과 해남의 풍경과 문화유산을 소개해요. 다산초당, 백련사, 대흥사 등을 방문하며 정약용과 유배 문화를 풀어 써요. 저자는 문화유산을 보는 기본 시각과 느끼는 법을 설명해요. 이후 권마다 지역을 옮기며 경주, 부여, 제주 등을 다뤄요. 저자는 '아는 만큼 보인다'는 말을 강조해요.|1993년 1권 출간 이후 시리즈로 이어졌고, 문화유산 답사 붐을 일으켰어요.
무소유|법정 스님은 1932년생 승려이자 수필가예요. 길상사를 세우고 맑고 향기롭게 운동을 이끌었어요.|이 책은 수필집이라 줄거리 대신 구성으로 소개해요. 표제작 「무소유」는 난초 두 분을 선물 받아 정성껏 키우던 저자가 집착을 깨닫는 이야기예요. 어느 날 난초를 친구에게 주고 나서야 마음이 가벼워졌다고 말해요. 다른 글들은 자연, 인연, 죽음, 가난한 마음 등을 다뤄요. 짧은 글마다 군더더기 없는 문장으로 삶의 지혜를 전해요.|1976년 처음 출간됐고, 2010년 스님이 입적하며 책 판매를 중단해 달라는 유언이 알려져 화제가 됐어요.
부자 아빠 가난한 아빠|로버트 기요사키는 1947년생 미국 사업가이자 작가예요.|이 책은 자기계발서라 줄거리 대신 구성으로 소개해요. 저자는 친아버지(가난한 아빠)와 친구 아버지(부자 아빠) 두 사람에게 돈에 대해 다른 가르침을 받았다고 해요. 부자 아빠는 자산을 늘리고 부채를 줄이라고 가르쳤어요. 월급에 의존하지 말고 돈이 일하게 하라고 말해요. 금융 지식과 투자, 사업의 중요성을 강조해요. 책은 이를 바탕으로 경제적 자유를 얻는 길을 소개해요.|1997년 출간돼 세계적 베스트셀러가 됐어요. 일부 조언의 정확성을 두고 비판도 있어요.
누가 내 치즈를 옮겼을까?|스펜서 존슨은 1938년생 미국의 의사이자 작가예요.|꼬마 인간 헴과 허, 생쥐 스니프와 스커리가 미로에서 치즈를 찾아다녀요. 그들은 C 창고에서 치즈를 발견해 행복하게 먹으며 살아요. 어느 날 치즈가 사라지자 생쥐들은 곧바로 새 치즈를 찾아 떠나요. 헴은 현실을 부정하며 제자리에 머물러요. 허는 두려움 끝에 미로로 나가 새 치즈를 찾고 변화에 적응해요. 변화는 언제든 일어난다는 교훈을 전해요.|1998년 출간돼 변화에 대응하는 법을 다룬 자기계발서로 널리 읽혔어요.
팩트풀니스|한스 로슬링은 스웨덴의 의사이자 통계학자이며, 아들 올라 로슬링과 아내 안나 로슬링 뢴룬드가 함께 썼어요.|이 책은 교양서라 줄거리 대신 구성으로 소개해요. 저자는 세계의 실제 상태에 대한 퀴즈를 통해 사람들이 얼마나 세계를 부정적으로 오해하는지 보여 줘요. 간극 본능, 부정 본능, 직선 본능, 공포 본능, 크기 본능 등 열 가지 본능이 왜곡의 원인이라고 설명해요. 각 장에서 통계와 일화로 오해를 바로잡아요. 세상은 나빠 보이지만 실제로는 많은 지표가 개선되었다고 말해요.|2018년 출간됐고 빌 게이츠 등이 추천해 화제가 됐어요. 한스 로슬링은 책이 나오기 전인 2017년에 세상을 떠났어요.
그릿|앤절라 더크워스는 미국 심리학자로, 펜실베이니아대 교수예요.|이 책은 심리학 도서라 줄거리 대신 구성으로 소개해요. 저자는 성공한 사람들을 연구하며 재능보다 열정과 끈기가 중요하다고 주장해요. 그릿은 장기적인 목표를 향한 열정과 꾸준한 노력을 뜻해요. 그릿을 키우려면 관심 있는 일을 찾고, 연습하고, 목적의식을 갖고, 희망을 가져야 한다고 설명해요. 부모와 교사의 역할도 다뤄요. 책은 실제 사례와 연구 결과를 바탕으로 해요.|2016년 출간됐고 그릿 개념은 교육계에서 큰 관심을 받았어요. 일부 연구 결과에 대한 반론도 있어요.
지적 대화를 위한 넓고 얕은 지식|채사장은 1980년생 작가이자 팟캐스트 진행자로, 인문·사회 분야의 대중 강연으로 알려졌어요.|이 책은 교양서라 줄거리 대신 구성으로 소개해요. 1권은 역사, 경제, 정치, 사회, 윤리의 다섯 영역을 다뤄요. 역사에서는 고대부터 현대까지의 흐름을 설명하고 경제에서는 자본주의의 구조를 알려 줘요. 정치와 사회에서는 이념과 제도를 소개해요. 윤리에서는 철학적 개념을 정리해요. 교양 입문을 위한 쉬운 설명이 특징이에요.|2014년 출간돼 큰 인기를 얻은 교양서로, 시리즈로 이어졌어요.
숨결이 바람 될 때|폴 칼라니티는 1977년생 미국의 신경외과 의사이자 작가예요. 스탠퍼드에서 레지던트 과정을 마치던 무렵 폐암 진단을 받고 2015년 서른일곱에 세상을 떠났어요.|저자는 인도계 의사 가정 출신으로 문학과 생물학을 공부하다 의사의 길을 택해요. 레지던트 마지막 해에 폐암 4기 진단을 받고 환자가 되어 병원 침대에 눕게 돼요. 의사에서 환자로 바뀐 시선으로 삶과 죽음의 의미를 다시 생각해요. 항암 치료 중에도 수술실로 돌아가려 애쓰고 아내 루시와 딸 케이디를 맞이해요. 책은 저자의 글과 아내 루시가 쓴 에필로그로 끝나요.|2016년 출간돼 세계적 베스트셀러가 됐고 퓰리처상 최종 후보에도 올랐어요. 의료 현장과 죽음을 마주한 한 사람의 성찰로 널리 읽혔어요.
배움의 발견|타라 웨스트오버는 1986년생 미국 작가로 아이다호의 모르몬교 가정에서 자랐어요. 17세까지 정규 학교에 다니지 못했고 이후 케임브리지에서 박사 학위를 받았어요.|아이다호 산골에서 자란 타라는 사회와 거리를 두는 아버지 밑에서 학교에 가지 못하고 폐품 처리 일을 도우며 자라요. 오빠의 폭력과 가족의 방임을 겪지만 가족을 떠나기 어려워해요. 17세에 대학 입학시험을 준비하며 처음 교실에 들어가요. 브리검영대를 거쳐 케임브리지와 하버드에서 공부하며 교육이 자신을 바꾸는 과정을 겪어요. 마침내 가족과의 갈등 속에서 자기 길을 선택해요.|2018년 출간돼 뉴욕타임스 베스트셀러가 됐고 빌 게이츠 등이 추천해 화제가 됐어요. 일부 가족이 내용에 이의를 제기하기도 했어요.
아웃라이어|말콤 글래드웰은 1963년생 영국 태생 캐나다 저널리스트로 『티핑 포인트』 『블링크』도 썼어요.|이 책은 소설이 아니라 사회과학 논픽션이라 줄거리 대신 구성으로 소개해요. 성공한 사람들은 재능만이 아니라 태어난 시기와 환경의 이점을 누렸다고 주장해요. 캐나다 하키 선수들의 생일 분포, 빌 게이츠와 비틀즈의 사례를 들어 1만 시간의 법칙을 소개해요. 아시아인의 수학 실력은 벼농사 문화와 관련 있다는 주장도 해요. 성공은 개인의 노력과 사회 환경이 함께 만든다고 결론지어요.|2008년 출간돼 베스트셀러가 됐어요. 1만 시간의 법칙이 유명해졌지만, 단순화라는 비판과 일부 문화 해석에 대한 반론도 있어요.
보건교사 안은영|정세랑은 1984년생 소설가로 SF와 판타지를 일상에 녹여 내는 작가예요. 『피프티 피플』 『시선으로부터』도 썼어요.|사립 고등학교 보건교사 안은영은 사람들에게 보이지 않는 젤리를 볼 수 있어요. 젤리는 학교와 사람들 사이에서 생겨난 이상한 기운이에요. 안은영은 장난감 같은 칼과 비비탄총으로 젤리를 물리쳐요. 한문 교사 홍인표는 한자 힘으로 은영을 돕고 두 사람은 학교를 지켜 나가요. 연작 형식으로 학생들의 사정과 사건이 이어져요.|2015년 출간됐고 2020년 넷플릭스 드라마로 만들어졌어요. 젊은 독자층에서 큰 인기를 얻었어요.
호모 데우스|유발 하라리는 1976년생 이스라엘 역사학자로 히브리대 교수예요. 『사피엔스』로 세계적 명성을 얻었어요.|이 책은 소설이 아닌 미래 전망서라 줄거리 대신 구성으로 소개해요. 인류가 기아, 역병, 전쟁을 상당 부분 극복했다고 보고 다음 목표를 불멸, 행복, 신적 능력이라고 말해요. 인간 중심주의가 흔들리며 데이터교라는 새 종교가 등장할 수 있다고 설명해요. 인공지능과 생명공학이 인간의 역할을 바꿀 것이라고 경고해요. 인간의 의식과 지능을 구분하며 미래를 묻고 있어요.|2015년 히브리어로 출간됐고 2016년 영어로 나와 화제였어요. 지나친 단정이라는 비판도 있지만 기술과 인간에 대한 논의를 촉발했어요.
우리가 빛의 속도로 갈 수 없다면|김초엽은 1993년생 작가로 포스텍에서 생화학을 공부했어요. 2017년 데뷔해 한국 SF의 대표 작가가 됐어요.|이 책은 7편의 단편을 묶은 소설집이에요. 표제작 「우리가 빛의 속도로 갈 수 없다면」은 우주 정거장에서 수십 년간 이동해야 하는 여행을 떠난 안나의 이야기예요. 「관내분실」은 죽은 사람의 마음을 도서관에 저장하는 미래를 그려요. 「스펙트럼」은 외계 생명체와의 소통을 다뤄요. 「감정의 물성」은 감정을 물건으로 만들어 판매하는 사회를 상상해요. 각 작품은 기술이 만든 소외와 연결을 이야기해요.|2019년 출간돼 큰 인기를 얻었고 한국 SF의 대중화를 이끌었어요.
피프티 피플|정세랑의 연작 장편으로 50명의 인물이 등장해요.|한 대학병원을 중심으로 환자, 의사, 간호사, 보호자, 청소부 등 서로 다른 50명의 이야기가 펼쳐져요. 한 인물이 한 장씩 주인공이 되고 다른 장에서는 조연으로 등장해요. 각 장은 병원 안팎의 사건으로 이어져 있어요. 평범한 사람들의 삶이 서로 얽혀 있음을 보여 줘요. 마지막에는 흩어진 이야기가 하나의 큰 풍경을 이뤄요.|2016년 출간됐고 한국 연작 소설의 특징을 보여 줘요. 따뜻한 시선으로 주목받았어요.
시선으로부터|정세랑이 2020년에 발표한 장편소설로, 심시선이라는 인물과 가족의 이야기를 다뤄요.|예술가 심시선 여사가 세상을 떠난 뒤 가족들은 하와이에 모여 10주기 제사를 지내려 해요. 가족들은 각자의 기억으로 시선을 떠올려요. 시선의 삶은 격동의 한국 근현대사와 겹쳐 있어요. 성격이 제각각인 자식과 손주들이 모여 하와이에서 의식을 치르며 서로를 알아 가요. 이야기는 시선의 젊은 시절과 현재를 오가며 가족의 역사를 보여 줘요.|2020년 출간돼 호평을 받았고 페미니즘적 시선이 담긴 가족 소설로 읽혀요.
나목|박완서는 1931년생 소설가로 6·25 전쟁 경험을 바탕으로 한 작품을 많이 썼어요. 1970년 마흔의 나이에 이 작품으로 등단했어요.|전쟁 중 서울에서 미군 PX 초상화부에서 일하는 이경은 화가 옥희도를 만나요. 옥희도는 가난과 절망 속에서 고목 그림을 그리는 인물이에요. 이경은 가족을 잃은 상처를 안고 옥희도에게 마음이 끌려요. 세월이 지나 이경은 결혼하고 옥희도의 유작전을 보게 돼요. 그림 속 나목이 사실은 희망을 담고 있었음을 깨달아요.|1970년 여성동아 공모에 당선된 등단작이에요. 작가의 6·25 체험이 담긴 작품으로 평가돼요.
두근두근 내 인생|김애란은 1980년생 소설가로 2002년 등단했어요. 일상의 섬세한 감정을 담은 작품으로 유명해요.|열일곱 살에 아이를 낳은 부모 아래 태어난 아름이는 빠르게 늙는 병을 앓고 있어요. 열일곱 살인 아름이의 신체 나이는 여든이 넘어요. 아름이는 아픈 몸으로도 부모를 위로하며 살아가요. 아버지의 소설 같은 이야기를 쓰고 이웃과 교감하며 의미를 찾아요. 부모가 걱정되어 아름이는 가족을 위해 마지막 일을 준비해요. 소설은 아픈 아이와 가족의 사랑을 따뜻하게 그려요.|2011년 출간돼 큰 인기를 얻었고 2014년 영화로 만들어졌어요.
모순|양귀자는 1955년생 소설가로 『원미동 사람들』로 알려졌어요.|스물다섯 살 안진진은 쌍둥이 같은 어머니와 이모의 대조적인 삶을 보며 자라요. 어머니는 가난하지만 성실한 남편과 살고 이모는 부유하지만 외로운 삶을 살아요. 진진은 두 남자 사이에서 고민해요. 나영규는 안정적이지만 지루하고, 김장우는 가난하지만 마음이 따뜻한 사람이에요. 진진은 삶의 모순을 받아들이며 선택해요. 마지막 문장은 삶을 어떻게 살아야 하는지 묻는 듯해요.|1998년 출간돼 오랫동안 사랑받은 베스트셀러가 됐어요.
우리들의 행복한 시간|공지영은 1963년생 소설가로 사회 문제를 다룬 작품을 많이 썼어요.|자살 시도 경험이 있는 대학 교수 유정은 어머니 수녀 고모를 따라 교도소에서 사형수 정윤수를 만나요. 처음에는 거부감이 있었지만 만남을 거듭하며 마음이 열려요. 윤수는 어린 시절 학대와 가난 속에서 살인을 저질렀어요. 두 사람은 대화를 통해 서로를 이해해 가요. 사형 집행이 가까워지고 유정은 윤수와 함께한 시간을 소중히 여겨요.|2005년 출간됐고 2006년 영화화됐어요. 사형 제도에 대한 논쟁을 불러왔어요.
종의 기원|정유정은 치밀한 취재와 구성으로 유명한 소설가예요.|어느 날 아침 유진은 온몸에 피를 묻힌 채 잠에서 깨어나요. 이 장면에서 시작한 소설은 유진이 어떤 사람인지를 1인칭 시점으로 풀어 가요. 어린 시절부터 유진은 감정을 느끼지 못하는 자신의 어두운 면을 감춰 왔어요. 어머니와의 관계와 가족의 비밀이 하나씩 밝혀져요. 유진은 점점 자신을 통제하기 어려워지고 사건은 걷잡을 수 없이 커져요. 소설은 한 인물의 내면을 따라 끝까지 긴장을 이어 가요.|2016년 출간돼 큰 인기를 얻은 심리 스릴러예요. 제목은 다윈의 책에서 따왔어요.
허삼관 매혈기|위화는 1960년생 중국 작가로 『인생』 『형제』를 썼어요. 문화대혁명 시대를 경험했어요.|비단 공장에서 일하는 허삼관은 피를 팔아 번 돈으로 결혼해 가정을 꾸려요. 아이 일락이 자신의 친아들이 아님을 알고 갈등하지만 끝내 사랑으로 품어요. 대기근 때는 가족을 위해 거듭 피를 팔아요. 아들 일락이 아플 때는 상하이까지 가며 피를 팔고 위기를 견뎌요. 노년에 허삼관은 돼지간볶음과 황주를 먹으려 하지만 피를 팔 수 없게 돼요.|1995년 출간됐고 한국에서도 널리 읽혔어요. 가족애를 다룬 걸작이에요.
인생|위화의 대표작으로 중국 현대사를 한 사람의 삶으로 그려요.|부잣집 아들 푸구이는 도박으로 재산을 모두 잃고 가난해져요. 아내 자전은 병든 몸으로 돌아와 가족을 지켜요. 푸구이는 국민당군에 끌려가 전쟁터를 겪고 돌아와요. 이후 대약진 운동과 문화대혁명을 겪으며 아들과 딸, 사위, 손자를 차례로 잃어요. 마지막에는 늙은 소 한 마리와 함께 살아가요. 고난 속에서도 삶을 이어 가는 힘을 보여 줘요.|1993년 출간됐고 1994년 장이머우 감독의 영화로도 만들어졌어요.
양철북|귄터 그라스는 1927년 단치히 출생의 독일 작가로 1999년 노벨 문학상을 받았어요.|오스카르는 세 살 때 어른들의 세계가 싫어 성장을 멈추기로 하고 양철북을 두드리며 살아가요. 날카로운 소리로 유리를 깨는 능력도 지녀요. 나치 시대의 단치히에서 어머니의 불륜과 죽음, 전쟁을 겪어요. 오스카르는 서커스단에서 일하고 전쟁 뒤 서독에서 살며 점점 어른이 돼요. 소설은 정신병원에 갇힌 오스카르의 회상으로 전개돼요.|1959년 출간돼 독일 전후 문학의 걸작이 됐어요. 1979년 영화로도 만들어졌어요.
책도둑|마커스 주삭은 1975년생 호주 작가로 청소년 소설로 유명해요.|제2차 세계대전 중 독일의 열 살 소녀 리젤은 동생을 잃고 양부모에게 맡겨져요. 리젤은 묘지에서 책을 훔치며 글을 배우기 시작해요. 양아버지 한스가 읽기를 가르쳐 주고, 지하실에 숨겨 둔 유대인 청년 막스와 친구가 돼요. 폭격이 이어지는 가운데 리젤은 이웃들에게 책을 읽어 줘요. 이야기는 죽음이 화자로 등장해 리젤의 운명을 이야기해요.|2005년 출간됐고 2013년 영화로 만들어졌어요.
클라라와 태양|가즈오 이시구로는 1954년 나가사키에서 태어나 영국에서 자란 작가예요. 2017년 노벨 문학상을 받았어요.|인공 친구 클라라는 가게 진열장에서 햇빛을 받으며 고객을 기다려요. 아픈 소녀 조시가 클라라를 선택해 집으로 데려가요. 클라라는 조시를 돌보며 태양이 생명을 살린다고 믿고 태양에게 기도해요. 가족과 이웃을 관찰하며 인간의 감정을 이해하려 애써요. 조시의 병이 깊어지자 클라라는 조시를 위해 큰 결단을 해요. 마지막에 클라라는 쓸쓸히 지난 기억을 돌아봐요.|2021년 노벨 문학상 수상 후 첫 소설이라 주목받았어요.
남아 있는 나날|가즈오 이시구로의 대표작으로 1989년 부커상을 받았어요.|1956년 영국의 집사 스티븐스는 새 주인의 권유로 휴가를 받아 서부 지방으로 여행을 떠나요. 여행하며 달링턴 홀에서 일하던 시절을 회상해요. 달링턴 경은 나치에 동조하는 정치 활동을 했고 스티븐스는 주인에게 충성하며 감정을 억눌렀어요. 가정부 켄턴 양과의 사랑도 놓쳐요. 여행 끝에 그는 자신이 평생 지킨 위엄이 무엇이었는지 돌아봐요.|1993년 앤서니 홉킨스 주연의 영화로 만들어졌어요.
나를 보내지 마|가즈오 이시구로가 2005년에 발표한 소설이에요.|기숙학교 헤일셤에서 자란 캐시, 루스, 토미는 특별한 아이들이에요. 이들은 장기 기증을 위해 만들어진 복제 인간이었어요. 학교를 떠난 뒤 이들은 코티지에서 살아가며 사랑과 질투를 겪어요. 세월이 흘러 캐시는 간병인으로 일하며 친구들의 기증을 도와요. 토미와 캐시는 기증 유예 소문을 믿고 희망을 걸어 보지만 현실은 냉혹해요.|2010년 영화로 만들어졌어요. 인간의 존엄을 묻는 작품이에요.
파이 이야기|얀 마텔은 1963년 스페인 출생의 캐나다 작가예요.|인도 동물원집 아들 파이는 가족과 함께 캐나다로 이민 가던 중 배가 침몰해요. 파이는 구명보트에 벵골 호랑이 리처드 파커와 함께 남아요. 227일 동안 태평양을 표류하며 호랑이와 공존하는 법을 익혀요. 멕시코 해안에 도착한 파이는 조사관에게 자신의 이야기를 들려줘요. 조사관이 믿지 못하자 또 다른 이야기를 하며 어느 쪽이 진실인지 묻는 듯해요.|2002년 부커상을 받았고 2012년 영화로 만들어졌어요.
스토너|존 윌리엄스는 1922년생 미국 작가이자 교수예요.|미주리 농가에서 태어난 윌리엄 스토너는 농대에 갔다가 영문학에 매료돼 학자의 길을 걸어요. 결혼 생활은 불행하고 학과장 로맥스와 갈등을 겪어요. 동료 교수와의 반목 속에서도 학생을 가르치는 일에 헌신해요. 캐서린과의 사랑을 경험하지만 그마저 주위의 압력으로 끝나요. 병든 스토너는 조용히 생을 마치며 평범한 삶의 의미를 되새겨요.|1965년 출간됐고 2000년대 재발견돼 세계적 인기를 얻었어요.
해변의 카프카|무라카미 하루키의 2002년 장편으로, 두 갈래 이야기가 번갈아 전개돼요.|열다섯 살 소년 다무라 카프카는 아버지의 저주를 피해 집을 떠나 다카마쓰의 도서관에서 지내요. 한편 고양이와 대화할 수 있는 노인 나카타 씨는 한 사건 후 길을 떠나요. 두 사람의 여정은 보이지 않는 곳에서 이어져요. 카프카는 도서관의 사에키 씨와 오시마를 만나며 자신의 과거를 마주해요. 나카타 씨의 임무가 끝나면서 두 이야기가 맞닿아요.|여러 언어로 번역돼 세계적으로 널리 읽혔어요.
개미|베르나르 베르베르는 1961년생 프랑스 작가로 과학 지식을 결합한 소설로 유명해요.|파리 근교 숲에서 개미 제국을 둘러싼 이야기와 인간 세계의 이야기가 번갈아 펼쳐져요. 한 인간 가족이 지하실에서 사라지는 사건이 일어나요. 개미들은 연방 건설과 외부 세계 탐험을 시도해요. 개미 103683호는 인간 세계와 접촉하려고 하고 개미 사회의 변화를 이끌어요. 인간과 개미의 이야기가 맞닿으며 서로를 이해하는 가능성을 보여 줘요.|1991년 출간됐고 한국에서도 큰 인기를 얻었어요.
다빈치 코드|댄 브라운은 1964년생 미국 작가로 로버트 랭던 시리즈를 썼어요.|루브르 박물관 관장 자크 소니에르가 살해되고 하버드 기호학 교수 로버트 랭던이 용의자로 몰려요. 소니에르의 손녀 소피 느뵈가 랭던과 함께 암호를 풀며 성배의 비밀을 추적해요. 단서는 다빈치의 작품과 상징에 숨어 있어요. 두 사람은 시온 수도회와 오푸스 데이 사이의 음모에 휘말려요. 마지막에 성배와 관련된 놀라운 진실이 드러나요.|2003년 출간돼 큰 베스트셀러가 됐고 종교 단체의 반발과 논란도 일었어요.
작은 것들의 신|아룬다티 로이는 1961년생 인도 작가로 사회운동가로도 활동해요.|인도 케랄라의 쌍둥이 남매 에스타와 라헬은 이혼한 어머니 암무와 함께 외가에서 자라요. 암무는 하층 카스트인 벨루타와 사랑에 빠지고 금기를 어겨요. 이 일로 가족에게 큰 비극이 일어나 쌍둥이 남매는 헤어져요. 세월이 흘러 두 사람은 폐허가 된 집에서 재회해요. 소설은 과거와 현재를 오가며 비극의 진상을 드러내요.|1997년 부커상을 받았어요.
싯다르타|헤르만 헤세는 1877년 독일 태생의 작가로 1946년 노벨 문학상을 받았어요.|바라문의 아들 싯다르타는 친구 고빈다와 함께 사문의 수행을 하며 깨달음을 찾아요. 석가모니를 만나 가르침을 듣지만 스스로의 길을 가겠다고 결심해요. 도시에서 기생 카말라를 만나 사랑과 부를 경험해요. 세월이 흘러 허무함을 느끼고 강가로 가서 뱃사공 바주데바 곁에 머물러요. 강에서 배움을 얻어 깨달음에 이르고, 친구 고빈다와 다시 만나요.|1922년 출간됐어요.
레베카|대프니 듀 모리에는 1907년생 영국 작가로 『새』 『자메이카 여인숙』도 썼어요.|평범한 젊은 여성 주인공은 몬테카를로에서 부유한 귀족 맥심 드 윈터를 만나 결혼해요. 맨덜리 저택으로 간 그녀는 죽은 전 부인 레베카의 그림자에 시달려요. 가정부 댄버스 부인은 레베카를 숭배하며 새 부인을 괴롭혀요. 어느 날 레베카의 배가 발견되며 사건이 새로운 국면을 맞아요. 맥심은 레베카에 대한 진실을 고백하고 저택에는 불길이 번져요.|1938년 출간됐고 1940년 히치콕 감독의 영화로 만들어졌어요.
월든|헨리 데이비드 소로는 1817년생 미국 사상가이자 작가예요.|1845년 소로는 매사추세츠 콩코드의 월든 호숫가에 작은 오두막을 짓고 2년 2개월 동안 살아요. 그는 최소한의 것으로 살아가며 자연을 관찰하고 사색해요. 책은 계절의 변화에 따라 호수와 숲, 동물, 이웃과의 만남을 기록해요. 소로는 문명과 소비에 대한 비판과 단순한 삶의 가치를 이야기해요. 겨울이 지나고 봄이 되자 월든을 떠나 일상으로 돌아가요.|1854년 출간됐어요. 간디와 마틴 루서 킹에게도 영향을 줬어요.
사랑의 기술|에리히 프롬은 1900년 독일에서 태어난 정신분석학자이자 사회심리학자로 나치를 피해 미국에서 활동했어요.|이 책은 소설이 아닌 사상서라 줄거리 대신 구성으로 소개해요. 프롬은 사랑이 감정이 아니라 배우고 연습해야 하는 기술이라고 주장해요. 사랑의 요소로 배려, 책임, 존경, 이해를 들어요. 부모와 자식, 형제, 이성, 자기 자신, 신에 대한 사랑을 구분해요. 현대 사회에서 사랑이 상품처럼 변질되는 점을 비판해요. 마지막에 사랑을 실천하는 방법을 제시해요.|1956년 출간돼 오랫동안 읽힌 고전이에요.
소유냐 존재냐|에리히 프롬의 후기 대표작으로 1976년에 출간됐어요.|이 책은 사상서라 줄거리 대신 구성으로 소개해요. 프롬은 인간의 삶의 방식을 소유 양식과 존재 양식으로 나눠요. 소유 양식은 물건과 지식을 가지는 데 집착하는 방식이고, 존재 양식은 있는 그대로 경험하고 나누는 방식이에요. 소유 중심의 사회가 불안과 소외를 낳는다고 비판해요. 새로운 사회를 위해 존재 양식으로 전환해야 한다고 주장해요.|물질 중심 사회에 대한 성찰로 지금도 읽혀요.
죽음이란 무엇인가|셸리 케이건은 1939년생 미국 철학자로 예일대에서 오랫동안 가르쳤어요.|이 책은 철학 강의서라 줄거리 대신 구성으로 소개해요. 케이건은 영혼이 존재하는지에 대한 이원론과 물리주의의 입장을 비교해요. 그는 육체와 독립된 영혼이 있다는 주장을 반박해요. 죽음이 왜 나쁜지, 영원히 사는 것이 바람직한지, 자살은 합리적일 수 있는지 등을 논의해요. 마지막에 죽음을 직시하며 삶을 가치 있게 사는 법을 이야기해요.|예일대 강의를 엮은 책으로 2012년 출간돼 화제가 됐어요.
성공하는 사람들의 7가지 습관|스티븐 코비는 1932년생 미국 작가이자 경영 컨설턴트로 2012년 세상을 떠났어요.|이 책은 자기계발서라 줄거리 대신 구성으로 소개해요. 1~3습관은 개인의 승리로 주도적이 되고 끝을 생각하며 시작하고 소중한 것을 먼저 하라고 해요. 4~6습관은 공적 승리로 상호 이익을 추구하고 먼저 이해하고 이해시키며 시너지를 내라고 해요. 7습관은 끊임없이 쇄신하라는 것이에요. 원칙 중심의 삶을 강조하고 사례와 연습을 곁들여요.|1989년 출간돼 4천만 부 넘게 팔린 것으로 알려진 고전이에요.
나는 왜 이 일을 하는가|사이먼 사이넥은 영국 출신 미국의 작가이자 컨설턴트로 TED 강연 「위대한 리더들은 어떻게 행동을 이끌어 내는가」로 유명해요.|이 책은 경영서라 줄거리 대신 구성으로 소개해요. 사이넥은 성공한 조직이 무엇을 하는가보다 왜 하는가에서 출발한다고 말해요. 골든 서클 이론을 제시해 Why, How, What의 순서로 소통하라고 설명해요. 애플, 마틴 루서 킹, 라이트 형제 등 사례를 소개해요. 신념에 공감하는 사람들이 따른다고 주장해요.|2009년 출간돼 널리 읽혔어요.
돈의 심리학|모건 하우절은 미국의 금융 칼럼니스트이자 투자 전문가예요.|이 책은 경제서라 줄거리 대신 구성으로 소개해요. 하우절은 돈을 잘 다루는 것은 지식보다 행동에 달렸다고 말해요. 열아홉 편의 짧은 이야기로 운, 위험, 만족, 복리, 저축, 인내 같은 주제를 이야기해요. 부자가 되는 일과 부를 지키는 일은 다르다고 설명해요. 사람마다 돈에 대한 경험이 달라 비합리적 선택을 한다고 해요. 결론에서는 자신의 삶에 맞는 재정 계획을 세우라고 조언해요.|2020년 출간돼 세계적 베스트셀러가 됐어요.
고래|천명관은 1964년생 소설가로 영화 일에도 종사했어요.|산골 마을의 소녀 금복은 거대한 벽돌 공장의 주인이 되는 입지전적 삶을 살아요. 그녀는 우여곡절 끝에 평대 지역에서 극장과 벽돌 사업을 일으키고, 곁에는 이상한 인물들이 모여들어요. 거인 춘희, 칼자국 같은 인물이 등장하고 신화적인 사건이 이어져요. 금복은 큰 성공을 거두지만 비극적으로 생을 마감해요. 소설은 입담 좋은 구전 이야기처럼 전개돼요.|2004년 출간됐고 2023년 영국 인터내셔널 부커상 최종 후보에 올랐어요.
저주토끼|정보라는 1976년생 작가이자 번역가로 러시아 문학을 공부했어요.|이 책은 14편의 단편을 묶은 소설집이에요. 표제작 「저주토끼」는 저주를 받은 토끼 인형이 가족에게 오며 일어나는 일을 그려요. 「안쪽 계단」은 기이한 아파트 이야기이고 「머리」는 죽음과 사랑을 다뤄요. 기괴한 설정 속에서 현실의 폭력과 소외를 보여 줘요. 공포와 환상이 뒤섞인 이야기들이에요.|2022년 영어판이 인터내셔널 부커상 최종 후보에 올랐어요.
감옥으로부터의 사색|신영복은 1941년 경남 밀양에서 태어난 학자이자 서예가예요. 1968년 통일혁명당 사건으로 20년 20일을 복역했어요.|이 책은 서간집이라 줄거리 대신 구성으로 소개해요. 저자는 감옥에서 가족에게 보낸 편지를 통해 삶과 사람에 대한 사색을 전해요. 좁은 감방에서의 생활, 동료 수감자들과의 일화가 담겨 있어요. 겨울과 여름의 감옥 생활, 사람에 대한 믿음을 이야기해요. 짧은 편지글마다 인간에 대한 따뜻한 시선이 느껴져요.|1988년 출간돼 오랜 사랑을 받았어요.
골든아워|이국종은 외상외과 의사로 아주대병원에서 중증외상센터를 이끌었어요.|이 책은 의료 기록이라 줄거리 대신 구성으로 소개해요. 저자는 중증외상센터를 만들고 운영하며 겪은 현실을 기록해요. 부족한 인력과 예산, 병원 안팎의 갈등과 압박 속에서 환자를 살리려 애써요. 석해균 선장 치료 등 실제 사례가 소개돼요. 의사들의 번아웃과 시스템의 한계를 솔직히 드러내요. 응급 의료 체계의 개선을 호소하며 끝나요.|2018년 출간돼 화제가 됐어요.
마음|나쓰메 소세키의 1914년 작품으로 상, 중, 하 세 부분으로 이루어져 있어요.|화자인 대학생 '나'는 가마쿠라 해변에서 '선생님'을 만나 점점 가까워져요. 선생님은 세상과 거리를 두고 아내와 조용히 살아요. 나는 선생님의 과거에 관심을 갖지만 선생님은 말하지 않아요. 고향의 아버지가 병이 들어 돌아갔을 때 선생님의 긴 유서가 도착해요. 유서에는 친구 K와 하숙집 아가씨를 둘러싼 선생님의 과거가 담겨 있어요.|일본 근대 문학의 대표작으로 꼽혀요.
도련님|나쓰메 소세키는 1867년생 일본 근대 문학의 대표 작가예요. 영국 유학과 교사 경험이 작품에 녹아 있어요.|도쿄 출신의 직선적인 청년 도련님은 수학 교사가 되어 시코쿠의 한 시골 중학교로 가요. 학생들은 그를 놀리고 교사들 사이에도 알력이 있어요. 교감 빨강셔츠와 그의 일당은 교묘하게 교사들을 이간질해요. 도련님은 동료 산미 야마아라시와 뜻을 모아 불의에 맞서요. 결국 두 사람은 사건을 일으키고 학교를 떠나 도쿄로 돌아가요. 사회의 위선에 맞서는 단순하고 정직한 인물이 중심이에요.|1906년 발표돼 일본에서 오랫동안 사랑받은 소설이에요. 소세키의 초기 대표작으로 여러 번 영화와 드라마로 만들어졌어요.
금각사|미시마 유키오는 1925년생 일본 작가로 1970년 극단적인 사건으로 생을 마쳤어요. 탐미적인 작품으로 알려져요.|말을 더듬는 소년 미조구치는 승려인 아버지의 유언으로 금각사에 들어가요. 그는 금각의 아름다움에 압도되면서도 열등감과 증오를 키워 가요. 전쟁이 끝난 뒤 친구 가시와기의 영향을 받고 금각사 주지에게도 불만을 느껴요. 아름다움이 자신을 짓누른다고 여긴 미조구치는 금각을 불태우기로 결심해요. 결국 불을 지르고 살아남아요.|1950년 실제 금각사 방화 사건을 바탕으로 1956년 발표됐어요.
키친|요시모토 바나나는 1964년생 일본 작가로 이 작품으로 데뷔해 큰 인기를 얻었어요.|부모를 모두 잃고 할머니마저 세상을 떠나 혼자가 된 미카게는 부엌에서 가장 편안함을 느껴요. 할머니와 알고 지내던 청년 유이치가 자기 집에서 같이 살자고 해요. 유이치의 어머니 에리코는 사실 트랜스젠더 여성이에요. 세 사람은 함께 살며 서로를 위로해요. 그러나 에리코가 비극적으로 세상을 떠나 다시 상실을 겪어요. 미카게는 부엌에서 새로운 삶의 힘을 얻어요.|1988년 발표돼 일본에서 큰 인기를 끌었고 여러 나라에 번역됐어요.
냉정과 열정 사이|에쿠니 가오리와 쓰지 히토나리가 남녀 시점을 나누어 쓴 소설이에요. 두 작가는 서로의 원고를 모르고 번갈아 연재했어요.|피렌체에서 그림 복원을 공부하는 준세이는 대학 시절 연인 아오이를 잊지 못해요. 두 사람은 아오이의 서른 번째 생일에 피렌체의 두오모에서 만나기로 약속했어요. 준세이는 스승 밑에서 그림을 복원하며 과거의 상처를 안고 살아요. 한편 밀라노에서 지내는 아오이는 다른 사람과 살지만 과거의 약속을 기억해요. 두 사람은 우여곡절 끝에 약속의 장소로 향해요.|2000년 출간돼 영화로도 만들어졌어요. 남녀 두 작가의 시점이 교차하는 구성이 특징이에요.
화차|미야베 미유키는 1960년생 일본 추리 소설가예요. 사회 문제를 다룬 사회파 추리로 유명해요.|형사 혼마는 다친 몸으로 휴직하던 중 먼 친척에게서 사라진 약혼녀를 찾아 달라는 부탁을 받아요. 약혼자 세키네 쇼코는 신용카드 문제로 사라졌고 혼마는 그녀의 과거를 추적해요. 조사하다 보니 쇼코가 본래의 쇼코가 아니라 다른 사람의 신분을 쓰고 있었음이 드러나요. 개인 파산과 빚에 시달린 여성의 삶이 하나씩 밝혀져요. 진실은 안타까운 결말로 이어져요.|1992년 출간돼 야마모토 슈고로상을 받았어요. 한국에서도 영화로 만들어졌어요.
고백|미나토 가나에는 1973년생 일본 소설가로 이 작품으로 데뷔해 주목받았어요.|중학교 교사 모리구치 유코는 종업식 날 학생들 앞에서 딸의 죽음에 대해 고백해요. 딸이 사고가 아니라 반 학생 두 명에게 살해되었다고 말해요. 교사는 법이 아닌 방식으로 복수를 시작해요. 이야기는 교사, 학생, 부모 등 여러 인물의 독백으로 이어져요. 사건에 얽힌 각자의 동기와 상처가 드러나며 결말로 향해요.|2008년 발표돼 2009년 일본 서점대상을 받았고 2010년 영화로 만들어졌어요.
파리대왕|윌리엄 골딩은 1911년생 영국 작가로 1983년 노벨 문학상을 받았어요.|핵전쟁 중 영국 소년들이 탄 비행기가 무인도에 추락해요. 소년들은 랠프를 대장으로 뽑고 소라를 불어 모임을 열어요. 구조를 위해 봉화를 피워야 하지만 사냥에 몰두하는 잭 일행과 갈등이 커져요. 점차 질서는 무너지고 짐승에 대한 공포가 퍼져 소년들은 폭력적으로 변해요. 피기와 사이먼이 희생되고 랠프도 쫓기던 중 해군 장교가 나타나 구조돼요.|1954년 출간돼 인간 본성에 대한 고전으로 꼽혀요. 영화와 연극으로도 여러 번 만들어졌어요.
캐치-22|조지프 헬러는 1923년생 미국 작가로 2차 세계대전 때 폭격수로 참전했어요.|2차 대전 중 이탈리아 해안의 비행 중대에서 폭격수 요사리안은 출격 횟수가 계속 늘어나는 것에 절망해요. 그는 미치면 비행을 면제받을 수 있다고 하지만 면제를 요청하면 제정신이라고 여겨져요. 이 모순된 규정이 캐치-22예요. 요사리안은 군대의 관료주의와 광기 속에서 동료들의 죽음을 겪어요. 마침내 그는 군을 벗어나 탈출을 시도해요.|1961년 출간됐고 'catch-22'라는 말이 모순된 상황을 가리키는 표현으로 쓰이게 됐어요.
제5도살장|커트 보니것은 1922년생 미국 작가로 2차 세계대전 때 포로로 드레스덴 폭격을 직접 겪었어요.|빌리 필그림은 2차 대전 중 독일군에 붙잡혀 드레스덴의 지하 도살장에서 폭격을 겪어요. 그는 시간을 자유롭게 오가는 능력을 얻어 삶의 여러 순간을 뒤섞어 경험해요. 전쟁 이후 검안사로 성공하지만 정신적 상처가 남아요. 외계 행성 트랄파마도어인에게 납치되어 동물원에 갇혀 지내기도 해요. 죽음 앞에서 항상 '그런 거지'라고 말해요.|1969년 출간됐고 반전 소설의 고전으로 평가돼요.
시녀 이야기|마거릿 애트우드는 1939년생 캐나다 작가로 『증언들』로 부커상을 받았어요.|미국이 종교적 독재 국가 길리어드로 바뀐 미래에서 여성은 권리를 빼앗겨요. 주인공 오브프레드는 출산을 위한 시녀로 지휘관의 집에 배정돼요. 그녀는 과거에 남편과 딸이 있었고 직업도 있었지만 지금은 이름마저 잃었어요. 지휘관 부부와 운전사 닉 사이에서 은밀한 관계가 생기며 저항이 싹터요. 오브프레드는 마침내 탈출을 시도하지만 결말은 열려 있어요.|1985년 출간됐고 2017년 드라마로 만들어져 다시 주목받았어요.
더 로드|코맥 매카시는 1933년생 미국 작가로 건조하고 잔혹한 문체로 알려졌어요.|재앙으로 모든 것이 불타 버린 세상에서 아버지와 어린 아들이 남쪽 바다를 향해 걸어가요. 먹을 것이 거의 없고 식인 집단이 도처에 있어요. 아버지는 아들을 지키려 총 한 자루와 몇 가지 짐을 챙겨 걸어요. 길에서 도둑을 만나고 위험을 넘기며 두 사람은 서로를 의지해요. 아버지는 병들어 쓰러지고 아들은 새로운 가족을 만나요.|2006년 출간돼 2007년 퓰리처상을 받았어요. 2009년 영화로 만들어졌어요.
노인을 위한 나라는 없다|코맥 매카시의 2005년 작품으로 서부 범죄 소설의 형식을 띠고 있어요.|1980년 텍사스에서 사냥하던 모스는 마약 거래가 틀어진 현장에서 거액의 돈 가방을 발견해 가져와요. 살인 청부업자 안톤 시거가 돈을 쫓아 모스를 추적해요. 늙은 보안관 벨은 사건을 뒤쫓으며 변해 가는 세상에 환멸을 느껴요. 모스와 시거의 쫓고 쫓기는 과정에서 폭력이 이어져요. 벨은 결국 은퇴를 결심해요.|2007년 코엔 형제가 영화로 만들어 아카데미 작품상을 받았어요.
듄|프랭크 허버트는 1920년생 미국 SF 작가로 『듄』 시리즈를 썼어요.|먼 미래 우주 제국에서 아트레이데스 가문은 사막 행성 아라키스를 다스리라는 명을 받아요. 이 행성은 우주여행에 필수인 스파이스의 유일한 산지예요. 하코넨 가문의 음모로 아트레이데스 공작은 죽고, 아들 폴은 어머니와 사막으로 도망쳐요. 원주민 프레멘과 함께 살며 폴은 지도자로 성장해요. 폴은 사막의 거대한 모래벌레를 타고 복수를 준비해요.|1965년 출간돼 SF 최고의 걸작 중 하나로 꼽혀요. 2021년 영화로 다시 만들어졌어요.
파운데이션|아이작 아시모프는 1920년생 SF 작가이자 과학 저술가예요. 로봇 3원칙으로도 유명해요.|은하 제국이 쇠퇴하고 있다는 사실을 수학자 해리 셀던이 심리역사학으로 예측해요. 제국은 곧 멸망하고 3만 년의 암흑기가 올 것이라고 해요. 셀던은 암흑기를 천 년으로 줄이기 위해 변방 행성 터미너스에 재단을 세워요. 재단은 제국이 무너진 뒤 주변 세력의 위협을 지혜와 종교, 무역으로 이겨 나가요. 여러 위기가 이어지며 계획이 이루어지는 모습이 연작으로 그려져요.|1951년 출간됐고 휴고상 최고 시리즈상을 받았어요. 2021년 애플TV+ 드라마가 만들어졌어요.
삼체|류츠신은 1963년생 중국 SF 작가로 이 작품으로 세계적 명성을 얻었어요.|문화대혁명 시기에 아버지를 잃은 천체물리학자 예원제는 외계 문명과 접촉할 기회를 얻어요. 오랜 세월 뒤 나노 소재 연구자 왕먀오는 이상한 일들에 휘말리고 가상 게임 삼체를 접하게 돼요. 게임 속 행성은 세 개의 태양 때문에 혼란스러운 환경이에요. 삼체 문명은 지구를 침공하려 하고 인류는 위기에 맞서 면벽자 계획을 세워요. 이야기는 인류와 외계 문명의 대결로 이어져요.|2015년 중국 작가 최초로 휴고상을 받았어요. 넷플릭스 드라마로도 만들어졌어요.
마션|앤디 위어는 1972년생 미국 작가로 이 작품이 첫 장편이에요.|화성 탐사 중 모래 폭풍이 닥쳐 대원들은 마크 와트니를 죽은 줄 알고 떠나요. 와트니는 혼자 살아남아 식량이 모자란 화성에서 버텨야 해요. 식물학 지식으로 감자를 키우고 장비를 고쳐 생존을 이어 가요. 지구의 NASA는 와트니가 살아 있음을 알게 되어 구조 계획을 세워요. 대원들은 위험을 무릅쓰고 그를 구하러 돌아가요.|처음 인터넷에 연재되다 2011년 출간됐고 2015년 맷 데이먼 주연의 영화로 만들어졌어요.
프로젝트 헤일메리|앤디 위어의 2021년 장편으로 『마션』 이후 두 번째 큰 성공작이에요.|라일런드 그레이스는 우주선에서 깨어나는데 기억이 거의 없어요. 곁에는 숨진 동료들이 있고 자신이 지구를 구하는 임무를 맡았음을 천천히 기억해 내요. 태양의 에너지를 먹어 치우는 아스트로파지가 지구를 위협하고 있어요. 그는 먼 별에서 외계 생명체 로키를 만나 힘을 합쳐 해법을 찾아요. 두 존재는 언어를 익히며 우정을 쌓아요. 결국 그레이스는 중대한 결단을 내려요.|2022년 한국에서도 큰 인기를 얻었고 영화화가 진행됐어요.
엔더의 게임|오슨 스콧 카드는 1951년생 미국 SF 작가예요.|외계 종족 벅서의 침공을 막기 위해 지구는 천재 아이들을 전투 학교에 모아 훈련시켜요. 어린 엔더는 뛰어난 전략으로 두각을 나타내고 지휘관이 돼요. 그는 시뮬레이션 훈련으로 동료들을 이끌며 점점 고립돼요. 마지막 시험인 줄 알았던 전투가 사실은 실제 전쟁이었음이 밝혀져요. 엔더는 큰 죄책감을 안고 새로운 길을 찾아요.|1985년 출간돼 휴고상과 네뷸러상을 받았어요.
나의 눈부신 친구|엘레나 페란테는 필명을 쓰는 이탈리아 작가로 실제 신원을 공개하지 않아요.|1950년대 나폴리 빈민가에서 자란 두 소녀 엘레나와 릴라는 서로 다른 성격으로 우정을 쌓아요. 릴라는 뛰어난 재능을 지녔지만 가난 때문에 학업을 포기하고, 엘레나는 학교를 계속 다니며 성장해요. 두 사람은 질투와 경쟁, 사랑 속에서 서로에게 영향을 줘요. 릴라는 결혼과 가정 문제로 시련을 겪어요. 어른이 된 엘레나는 릴라의 실종 소식을 듣고 지난 세월을 되돌아봐요.|2011년 출간된 나폴리 4부작의 첫 권으로 세계적 인기를 얻었어요.
인 콜드 블러드|트루먼 커포티는 1924년생 미국 작가로 『티파니에서 아침을』로도 알려졌어요.|1959년 캔자스 홀컴의 농장에서 클러터 일가 네 명이 총에 맞아 살해돼요. 마을은 충격에 빠지고 수사관들은 단서를 찾기 어려워요. 전과자 딕 히콕과 페리 스미스가 용의자로 떠올라 체포돼요. 커포티는 직접 현장을 취재하고 범인들과 면담해 사건을 재구성해요. 책은 두 범인이 처형되기까지의 과정을 담아요.|1966년 출간돼 논픽션 소설이라는 장르를 열었다고 평가돼요.
이것이 인간인가|프리모 레비는 1919년생 이탈리아의 화학자이자 작가로 아우슈비츠 생존자예요.|저자는 1943년 유대인으로 체포돼 1944년 아우슈비츠 수용소로 이송돼요. 그곳에서 이름 대신 번호로 불리며 극심한 굶주림과 노동을 견뎌요. 화학 지식 덕분에 실험실에서 일하게 되어 살아남아요. 동료 수감자들과의 일화와 인간성이 무너져 가는 과정을 담담하게 기록해요. 1945년 소련군에 의해 해방되기까지 이야기가 이어져요.|1947년 출간됐고 홀로코스트 증언 문학의 고전으로 평가돼요.
나는 말랄라|말랄라 유사프자이는 1997년생 파키스탄 출신으로 2014년 역대 최연소 노벨 평화상을 받았어요.|파키스탄 스와트 계곡에서 자란 말랄라는 학교를 운영하는 아버지의 영향으로 교육을 소중히 여겨요. 탈레반이 지역을 장악하며 여학생의 등교를 금지하자 그녀는 익명으로 블로그에 글을 써요. 2012년 통학 버스에서 탈레반의 총격을 받아 중상을 입어요. 영국에서 치료받고 회복한 뒤 여성 교육 운동을 이어 가요. 책은 그녀의 성장과 신념을 보여 줘요.|2013년 출간돼 큰 반향을 일으켰어요.
스티브 잡스|월터 아이작슨은 1952년생 미국 저널리스트이자 전기 작가로 아인슈타인과 레오나르도 다빈치의 전기도 썼어요.|스티브 잡스는 입양아로 자라 대학을 중퇴하고 1976년 애플을 공동 설립해요. 매킨토시를 성공시키지만 경영진과 갈등해 애플에서 쫓겨나요. 이후 넥스트와 픽사를 이끌며 재기하고 1997년 애플로 돌아와요. 아이맥, 아이팟, 아이폰, 아이패드로 시장을 바꿔요. 췌장암 투병 끝에 2011년 세상을 떠나요. 책은 완벽주의와 독선적인 면모를 숨김없이 담아요.|2011년 잡스 사후에 출간돼 세계적 베스트셀러가 됐어요.
비커밍|미셸 오바마는 1964년생 미국 변호사이자 작가로 버락 오바마 대통령의 부인이자 전 영부인이에요.|미셸은 시카고 사우스사이드의 노동자 가정에서 태어나 프린스턴과 하버드 로스쿨을 졸업해요. 변호사로 일하다 버락 오바마를 만나 결혼하고 두 딸을 키워요. 남편의 정치 활동 속에서 가정과 일 사이의 갈등을 겪어요. 백악관 생활에서는 건강한 식생활과 교육 활동에 힘써요. 책은 자신이 누구로 되어 가는지에 대한 고백이에요.|2018년 출간돼 세계적으로 큰 인기를 얻은 회고록이에요.
도둑맞은 집중력|요한 하리는 1979년생 영국 작가로 중독과 우울을 다룬 책을 써 왔어요.|이 책은 논픽션이라 줄거리 대신 구성으로 소개해요. 저자는 스마트폰과 SNS 때문에 자신의 집중력이 떨어졌음을 느끼고 전문가들을 찾아 인터뷰해요. 수면 부족, 영양, 스트레스, 광고 수익 구조 등 집중력을 해치는 열두 가지 요인을 짚어요. 기술 기업이 주의를 상품으로 삼는 구조를 비판해요. 개인의 노력만이 아니라 사회적 변화가 필요하다고 말해요.|2022년 출간돼 큰 인기를 얻었어요.
밝은 밤|최은영은 1984년생 소설가로 섬세한 관계의 묘사로 사랑받아요.|남편과 헤어진 지연은 어린 아들과 함께 외할머니가 있는 희천으로 가요. 그곳에서 지연은 증조할머니, 할머니, 어머니로 이어지는 여성들의 삶을 알게 돼요. 증조모 삼천은 일제 강점기에 살았고 할머니 영옥은 가난 속에서 딸을 키웠어요. 지연은 이들의 이야기를 들으며 자신의 상처를 이해해요. 4대에 걸친 모녀의 삶이 이어져요.|2021년 출간돼 큰 호응을 얻었어요.
천 개의 파랑|천선란은 1993년생 SF 작가예요.|가까운 미래의 경주마를 다루는 로봇 기수 콜리와 경주마 투데이를 중심으로 이야기가 시작돼요. 투데이는 사고로 다리를 다쳐 더 이상 달릴 수 없게 돼요. 한편 로봇을 연구하는 연재와 휠체어를 타는 은혜 등 여러 인물이 콜리와 투데이를 둘러싸고 얽혀요. 인물들은 각자의 상처를 안고 삶의 의미를 찾아가요. 인간과 기계, 동물의 관계를 통해 존엄과 돌봄을 다뤄요.|2020년 출간됐고 한국 SF의 대표작으로 사랑받았어요.
구의 증명|최진영은 1981년생 소설가예요.|구와 담은 오랜 연인이에요. 소설은 죽은 구의 시점과 살아 있는 담의 시점으로 이어져요. 구는 죽은 뒤에도 담의 곁에 머물러요. 담은 구의 시신을 곁에 두며 함께 지내요. 두 사람의 사랑과 상실, 가난이 겹쳐 그려져요. 결말에서 담은 구의 죽음을 받아들이려 애써요.|2015년 출간돼 호평받은 중편 소설이에요.
한국이 싫어서|장강명은 1975년생 소설가로 기자 출신이에요.|스물여덟 살 계나는 서울에서 직장을 다니며 월세와 통근, 인간관계에 지쳐요. 그녀는 호주로 떠나기로 결심하고 영어를 배우며 이민 준비를 해요. 호주에서 계나는 일과 새 인간관계를 시작해요. 한국에 있는 친구와 가족의 소식을 들으며 갈등하기도 해요. 소설은 계나의 1인칭 시점으로 서술돼요.|2015년 출간돼 청년 세대의 현실을 반영한 소설로 평가돼요. 2024년 영화로 만들어졌어요.
김약국의 딸들|박경리는 1926년생 소설가로 『토지』를 쓴 대하소설의 거장이에요.|경남 통영의 약국집 김성수에게는 딸 다섯이 있어요. 큰딸 용숙은 이기적이고 둘째 용빈은 교사로 성실해요. 셋째 용란은 불행한 사랑으로 몰락하고 넷째 용혜는 정신병을 앓아요. 막내 용옥은 비극적인 죽음을 맞아요. 집안은 연이은 불행과 아버지의 죽음으로 몰락해요.|1962년 출간된 박경리의 대표작 중 하나예요.
은교|박범신은 1946년생 소설가로 『촘촘한 그물』 등 많은 작품을 썼어요.|칠순의 시인 이적요는 열일곱 살 소녀 은교를 만나 삶의 활기를 다시 느껴요. 제자인 서지우는 이적요의 조수로 일하며 은교와 얽히게 돼요. 노시인은 소녀에게 이끌리는 감정과 늙음에 대한 두려움 사이에서 갈등해요. 세 사람의 관계는 질투와 욕망으로 어긋나요. 이적요의 비밀 노트가 공개되면서 진실이 드러나요.|2010년 출간돼 화제를 모았고 2012년 영화로 만들어졌어요.
내 심장을 쏴라|정유정의 2009년 장편으로 세계문학상을 받았어요.|스물다섯 살 이수명은 정신병원 수리온 요양원에 갇혀 지내요. 그곳에서 자유로운 영혼 류승민을 만나 친구가 돼요. 승민은 탈출을 계획하고 수명은 마음이 흔들려요. 병원 안의 의사와 환자, 보호자들의 갈등이 이어지며 두 사람은 탈출을 시도해요. 결말에서 수명은 중대한 선택을 해요.|2009년 세계문학상 수상작으로 한국 문학의 인기 작품 중 하나예요.
흰|한강이 2016년 발표한 소설이에요. 짧은 글들로 이루어진 독특한 형식이에요.|화자는 낯선 도시에 머물며 흰 것들의 목록을 작성해요. 강보, 소금, 눈, 쌀, 달, 입김 등 흰 사물과 기억이 연결돼요. 화자의 어머니가 낳자마자 세상을 떠난 언니의 이야기가 흐르고 있어요. 화자는 언니를 애도하며 흰색에 담긴 삶과 죽음을 생각해요. 짧은 단상들이 모여 하나의 애도가 돼요.|2018년 맨부커 인터내셔널상 최종 후보에 올랐어요.
딸에 대하여|김혜진은 1982년생 소설가예요.|요양보호사로 일하는 어머니의 시선으로 이야기가 전개돼요. 어머니는 요양 시설에서 치매 노인 젠을 돌봐요. 어느 날 딸이 동성 연인과 함께 집에 들어와 살게 돼요. 어머니는 딸의 삶을 이해하지 못해 갈등해요. 젠이 홀로 외롭게 지내는 모습을 보며 딸의 처지를 생각하게 돼요. 어머니는 딸을 받아들일 수 있을지 고민해요.|2017년 출간돼 호평을 받았어요.
참을 수 없는 존재의 가벼움|밀란 쿤데라는 1929년 체코 태생으로 프랑스에서 활동한 작가예요.|1968년 프라하의 봄 시기에 외과 의사 토마시는 자유로운 연애를 즐기는 사람이에요. 그는 시골 출신 테레자를 만나 사랑에 빠지지만 다른 여성들과의 관계도 이어 가요. 화가 사비나는 토마시의 정부이자 자유로운 영혼으로 등장해요. 소련의 침공으로 이들은 스위스로 피신했다가 다시 체코로 돌아와요. 마지막에 토마시와 테레자는 시골에서 소박하게 살아요.|1984년 출간됐고 1988년 영화로 만들어졌어요.
연인|마르그리트 뒤라스는 1914년 인도차이나에서 태어난 프랑스 작가예요.|열다섯 살의 프랑스 소녀는 인도차이나에서 메콩강을 건너다 부유한 중국인 청년을 만나요. 두 사람은 비밀스러운 사랑을 시작하지만 가난한 가족과 신분 차이가 가로막아요. 소녀의 어머니는 생활고에 시달리고 오빠들은 폭력적이에요. 소녀는 결국 프랑스로 돌아가는 배에 올라요. 세월이 흐른 뒤 청년의 전화 한 통이 기억을 되살려요.|1984년 출간돼 공쿠르상을 받았어요.
가재가 노래하는 곳|델리아 오언스는 1949년생 미국 동물학자이자 작가예요. 이 책으로 첫 소설가로 데뷔했어요.|1950년대 노스캐롤라이나 습지에서 카야는 가족에게 버림받고 홀로 살아가요. 마을 사람들은 그녀를 습지의 소녀라며 멀리해요. 카야는 테이트에게 글을 배우고 사랑을 느끼지만 그는 떠나요. 이후 마을 청년 체이스를 만나는데 그가 죽은 채 발견되고 카야는 용의자가 돼요. 재판을 통해 카야의 삶과 습지의 비밀이 드러나요.|2018년 출간돼 큰 베스트셀러가 됐고 2022년 영화로 만들어졌어요.
이처럼 사소한 것들|클레어 키건은 1968년생 아일랜드 작가로 짧고 정교한 소설로 알려졌어요.|1985년 크리스마스를 앞둔 아일랜드의 작은 마을에서 석탄 상인 빌 펄롱은 가족을 위해 열심히 일해요. 어느 날 배달 간 수녀원에서 갇혀 있는 소녀를 보게 돼요. 마을 사람들은 수녀원의 비밀을 알면서도 모른 척해요. 펄롱은 침묵과 두려움 사이에서 고민해요. 결국 용기를 내어 소녀를 집으로 데려가요.|2021년 출간돼 부커상 최종 후보에 올랐어요.
리스본행 야간열차|파스칼 메르시어는 스위스 철학자 페터 비에리의 필명이에요.|스위스 베른의 고전어 교사 그레고리우스는 다리 위에서 자살하려는 여자를 구해요. 그녀가 남긴 책을 읽고 포르투갈어로 쓰인 글에 매료돼요. 그는 일상을 버리고 리스본행 야간열차에 올라요. 리스본에서 저자 아마데우의 삶과 독재 시기의 저항을 추적해요. 여정을 통해 자신의 삶을 되돌아봐요.|2004년 출간돼 세계적 인기를 얻었고 2013년 영화로 만들어졌어요.
책 읽어주는 남자|베른하르트 슐링크는 1944년생 독일의 법학자이자 작가예요.|열다섯 소년 미하엘은 서른여섯 살의 한나를 만나 사랑에 빠져요. 한나는 미하엘에게 책을 읽어 달라고 청해요. 어느 날 한나는 말없이 사라지고 몇 년 뒤 미하엘은 법정에서 그녀를 다시 만나요. 한나는 나치 전범으로 재판받고 있어요. 미하엘은 한나의 비밀을 알게 되지만 침묵해요. 이후 그는 감옥의 한나에게 책을 읽어 녹음해 보내요.|1995년 출간됐고 2008년 영화로 만들어져 케이트 윈슬렛이 아카데미 여우주연상을 받았어요.
미 비포 유|조조 모이스는 1969년생 영국 작가예요.|조용한 마을에서 카페 일을 잃은 루이자 클라크는 간병인 일자리를 얻어요. 돌볼 사람은 사고로 전신이 마비된 부유한 청년 윌 트레이너예요. 처음엔 냉소적이던 윌은 루이자의 밝은 성격에 조금씩 마음을 열어요. 루이자는 윌에게 삶의 즐거움을 알려 주려고 애써요. 하지만 윌은 존엄사를 결심한 상태였어요. 루이자는 사랑과 선택 사이에서 괴로워해요.|2012년 출간돼 전 세계에서 큰 인기를 얻었고 2016년 영화로 만들어졌어요.
좀머 씨 이야기|파트리크 쥐스킨트의 1991년 작품으로 삽화는 장자크 상페가 그렸어요.|소년 화자는 마을에서 배낭을 메고 지팡이를 짚은 채 하루 종일 걸어 다니는 좀머 씨를 지켜봐요. 사람들은 좀머 씨를 이상하게 여기지만 그는 비가 와도 눈이 와도 걷기를 멈추지 않아요. 소년은 자라며 좀머 씨의 모습을 여러 번 마주쳐요. 어느 날 소년은 비 오는 날 좀머 씨의 외침을 듣고 큰 충격을 받아요. 좀머 씨의 마지막은 호수에서의 모습으로 암시돼요.|여러 나라에서 번역돼 사랑받았어요.
인간의 대지|앙투안 드 생텍쥐페리는 1900년생 프랑스 비행사이자 작가로 『어린 왕자』를 썼어요.|이 책은 체험을 엮은 산문집이라 줄거리 대신 구성으로 소개해요. 저자는 우편 비행사로서 겪은 경험을 이야기해요. 동료 기요메가 안데스 산맥에 추락해 살아 돌아온 일화가 나와요. 저자 자신도 사하라 사막에 불시착해 죽을 고비를 넘겨요. 비행을 통해 얻은 인간애와 책임감을 말해요. 책은 연대의 가치를 강조해요.|1939년 출간돼 미국에서는 『바람과 모래와 별』이라는 제목으로 나왔어요.
모스크바의 신사|에이모 토울스는 1964년생 미국 작가예요.|1922년 러시아 혁명 후 백작 알렉산드르 로스토프는 귀족이라는 이유로 재판을 받고 호텔 메트로폴에 연금돼요. 그는 호텔 최상층의 작은 방에서 지내게 돼요. 호텔에서 일하면서 새로운 친구와 사랑을 만나고 소녀 니나를 돌봐요. 세월이 흘러 그는 딸을 위해 호텔을 탈출할 계획을 세워요. 로스토프는 격동의 시대를 호텔 안에서 살아내요.|2016년 출간돼 큰 인기를 얻었어요.
나를 찾아줘|길리언 플린은 1971년생 미국 작가로 기자 출신이에요.|결혼 5주년 기념일에 닉의 아내 에이미가 사라져요. 집에는 격투의 흔적이 있고 경찰은 닉을 의심해요. 에이미의 일기장에는 닉에 대한 불안이 적혀 있어요. 닉의 거짓말과 수상한 행동이 드러나며 여론은 그를 범인으로 몰아요. 이후 이야기는 반전을 거듭하며 부부의 진짜 모습이 드러나요.|2012년 출간돼 큰 인기를 얻었고 2014년 데이비드 핀처 감독이 영화로 만들었어요.
백야행|히가시노 게이고의 1999년 작품으로 작가의 대표작 중 하나로 꼽혀요.|1973년 오사카의 폐건물에서 전당포 주인이 살해된 채 발견돼요. 사건은 미궁에 빠지고 주인의 아들 료지와 용의자의 딸 유키호가 성장해 가요. 두 사람은 겉으로 아무 관계가 없는 것처럼 살지만 주변에서는 이상한 사건이 계속 일어나요. 형사 사사가키는 오랜 세월 사건을 쫓으며 두 사람의 그림자를 발견해요. 마침내 19년에 걸친 사건의 진실이 드러나요.|1999년 출간돼 일본과 한국에서 큰 인기를 얻었고 한국 영화와 드라마로도 만들어졌어요.
밀레니엄: 용 문신을 한 여자|스티그 라르손은 1954년생 스웨덴 언론인이자 작가로 2004년 세상을 떠났어요. 밀레니엄 3부작은 사후에 출간됐어요.|기자 미카엘 블롬크비스트는 재벌 비리 기사로 명예훼손 소송에서 패소해 곤경에 처해요. 그는 40년 전 사라진 소녀의 행방을 찾아 달라는 의뢰를 받아요. 조사를 돕는 천재 해커 리스베트 살란데르는 용 문신을 한 반항적인 여성이에요. 두 사람은 가문의 어두운 비밀과 연쇄 살인의 진실에 다가가요. 결국 사건의 진상이 드러나고 서로를 이해하게 돼요.|2005년 출간돼 세계적 베스트셀러가 됐어요.
양들의 침묵|토머스 해리스는 1940년생 미국 작가로 한니발 렉터 시리즈를 썼어요.|FBI 훈련생 클라리스 스탈링은 연쇄 살인범 버팔로 빌을 추적하는 수사에 투입돼요. 그녀는 수감 중인 정신과 의사이자 식인 살인마 한니발 렉터를 찾아가 도움을 구해요. 렉터는 정보를 주는 대가로 클라리스의 과거를 캐내요. 연쇄 살인범의 윤곽이 드러나고 클라리스는 홀로 범인과 맞서요. 렉터는 탈옥해 자취를 감춰요.|1988년 출간됐고 1991년 영화화돼 아카데미 주요 부문을 석권했어요.
죽고 싶지만 떡볶이는 먹고 싶어|백세희는 기분부전장애를 겪은 경험을 이 책에 솔직하게 담은 작가예요.|이 책은 에세이라 줄거리 대신 구성으로 소개해요. 저자는 정신과 상담을 받으며 의사와 나눈 대화를 기록해요. 불안, 낮은 자존감, 인간관계의 어려움을 이야기하면서도 떡볶이가 먹고 싶은 마음 같은 일상이 이어져요. 의사는 저자의 이야기에 귀 기울이며 조언해요. 저자는 완벽하지 않은 자신을 받아들이는 법을 배워요.|2018년 출간돼 큰 공감을 얻었어요. 책을 읽는 분에게는 필요하면 전문가의 도움을 받는 것이 좋아요.
여행의 이유|김영하는 소설가이자 산문가로 『말하다』 『보다』 『읽다』도 썼어요.|이 책은 산문집이라 줄거리 대신 구성으로 소개해요. 저자는 여행의 의미와 이유를 여러 도시의 경험으로 풀어 써요. 여행 중에 겪은 사소한 사건, 낯선 풍경, 사람들과의 만남이 이어져요. 여행이 삶의 일상과 어떻게 연결되는지 사색해요. 코로나 시기를 거치며 여행의 의미를 다시 묻는 글이 담겨 있어요.|2019년 출간됐어요.
물고기는 존재하지 않는다|룰루 밀러는 미국의 과학 저널리스트예요.|이 책은 논픽션이라 줄거리 대신 구성으로 소개해요. 저자는 사랑하는 사람을 잃은 뒤 삶의 의미를 찾으려 해요. 20세기 초 분류학자 데이비드 스타 조던의 삶을 추적해요. 조던은 물고기를 분류하며 질서를 세우려 했지만 한편으로 우생학을 옹호했어요. 분류가 불완전하다는 사실을 통해 저자는 혼돈 속에서 삶을 받아들여요.|2020년 출간돼 화제가 됐어요.
원씽|게리 켈러는 부동산 회사 켈러 윌리엄스 공동 창업자이고 제이 파파산은 작가예요.|이 책은 자기계발서라 줄거리 대신 구성으로 소개해요. 저자들은 성공한 사람들이 하나에 집중한다고 설명해요. 멀티태스킹의 위험, 의지력의 한계, 시간 블록 등을 이야기해요. 핵심 질문은 '내가 할 수 있는 단 한 가지는 무엇인가'예요. 이를 통해 우선순위를 정하고 삶의 균형을 잡는 방법을 소개해요.|2013년 출간됐어요.
부의 추월차선|엠제이 드마코는 미국 사업가이자 작가예요.|이 책은 재테크서라 줄거리 대신 구성으로 소개해요. 저자는 부자가 되는 길을 인도, 서행차선, 추월차선으로 나누어 설명해요. 월급에 의존하는 서행차선은 오래 걸리고 위험하다고 말해요. 추월차선은 사업이나 시스템을 만들어 빠르게 부를 만드는 길이라고 해요. 부의 기준은 돈보다 시간의 자유라고 강조해요.|2011년 출간됐어요. 일부 주장에는 비판도 있어요.
마시멜로 이야기|호아킴 데 포사다는 스페인 출신 작가이고 엘런 싱어는 미국 작가예요.|부자 사업가 조나단은 운전기사 찰리의 고민을 듣고 마시멜로 실험 이야기를 들려줘요. 아이들에게 마시멜로를 주고 15분 참으면 하나를 더 주겠다고 한 실험이에요. 조나단은 참을성이 성공과 이어진다고 말해요. 찰리는 성공 법칙을 배우며 목표를 세우고 노력해요. 시간이 지나 찰리는 변화한 삶을 살게 돼요.|2005년 한국에서 큰 인기를 얻은 우화형 자기계발서예요.
신경 끄기의 기술|마크 맨슨은 1984년생 미국 블로거이자 작가예요.|이 책은 자기계발서라 줄거리 대신 구성으로 소개해요. 저자는 모든 것에 신경 쓰지 말고 정말 중요한 일에만 쓰라고 말해요. 긍정에 집착하는 것이 오히려 불행을 낳는다고 해요. 책임을 받아들이고 실패를 인정하며 가치관을 선택하라고 조언해요. 죽음을 생각하며 삶의 우선순위를 세우는 이야기도 나와요.|2016년 출간돼 베스트셀러가 됐어요.
흑산|김훈의 2011년 장편으로 조선 후기 천주교 박해를 다뤘어요.|정약전은 신유박해로 흑산도에 유배돼요. 섬에서 그는 어류를 관찰해 『자산어보』를 쓰려 해요. 한편 조카사위 황사영은 중국에 박해 상황을 알리는 백서를 쓰고 숨어 지내요. 천주교 신자들은 박해 속에서 고통을 겪어요. 정약전은 섬 사람들과 어울리며 학문과 신앙, 형제 정약용에 대한 생각을 이어가요.|2011년 출간됐고 조선 후기 천주교 박해의 현실을 그렸어요.
빛의 제국|김영하의 2006년 장편으로 하루 동안의 이야기예요.|남파 간첩 김기영은 20년 넘게 서울에서 평범한 가장으로 살아가요. 어느 날 북에서 귀환하라는 명령이 내려와요. 기영은 갑자기 흔들리는 삶 앞에서 가족과 자신을 돌아봐요. 아내와 딸, 직장 동료를 바라보며 갈등하고 도피를 고민해요. 하루가 지나면서 그의 선택이 드러나요.|2006년 출간돼 간첩이라는 소재를 새롭게 해석했다고 평가돼요.
검은 꽃|김영하의 2003년 역사 소설이에요.|1905년 제물포항에서 1000여 명의 조선인이 멕시코 에네켄 농장으로 이민을 떠나요. 이들은 노비, 군인, 몰락한 양반 등 다양한 사람들이에요. 낯선 땅에서 가혹한 노동과 차별을 견디며 살아가요. 이후 멕시코 혁명과 쿠바행 등 격동 속에서 흩어지고 변해 가요. 이민자들은 마침내 새 나라에서 새 삶을 만들어 가요.|2003년 출간돼 동인문학상을 받았어요.
상도|최인호는 1945년생 소설가로 『별들의 고향』 『상도』 등을 썼어요.|조선 후기 의주의 가난한 소년 임상옥은 역관이 되려다 상인의 길을 걸어요. 그는 홍득주 등 스승과 인연을 맺으며 상업의 도를 배워요. 청나라와의 인삼 무역에서 위기를 맞지만 지혜를 발휘해 큰돈을 벌어요. 재물을 쌓으면서도 나눔의 가치를 깨달아요. 말년에는 재산을 사회에 환원하고 청렴한 삶을 살아요.|2000년 출간돼 베스트셀러가 됐고 드라마로 만들어졌어요.
손님|황석영은 1943년생 소설가로 『객지』 『장길산』 『바리데기』 등을 썼어요.|뉴저지에 사는 목사 류요한은 형의 장례를 위해 오랜만에 황해도 고향을 찾아가요. 그곳에서 6·25 때 일어난 학살의 기억이 되살아나요. 요한의 형 요섭이 가담한 학살이었다는 사실이 밝혀져요. 이야기는 죽은 자들의 영혼이 말하는 진오귀굿 형식으로 전개돼요. 이념과 종교의 갈등이 빚은 비극을 되돌아봐요.|2001년 출간됐어요.
오래된 정원|황석영의 2000년 장편으로 80년대 민주화 운동을 다뤘어요.|오현우는 광주 항쟁 이후 수배되어 시골로 피신하고 교사 한윤희와 사랑에 빠져요. 현우는 도피 생활을 이어 가다 체포돼 18년간 복역해요. 윤희는 현우의 아이를 낳고 홀로 살다 병으로 세상을 떠나요. 출소한 현우는 윤희가 남긴 일기장을 읽고 지난날을 되돌아봐요. 과거와 현재가 교차하며 사랑과 이념의 의미를 묻는 이야기예요.|2000년 출간돼 호평을 받았어요.
희랍어 시간|한강이 2011년 발표한 장편소설이에요.|말을 잃어버린 여자는 희랍어 강의를 들으며 말의 힘을 되찾으려 해요. 희랍어 강사인 남자는 점점 시력을 잃어 가요. 두 사람은 강의실에서 만나며 서로의 고통을 알아봐요. 여자는 아이를 잃은 상처가, 남자는 어린 시절의 기억이 있어요. 어둠 속에서 두 사람의 손이 마주 닿는 장면이 이어져요.|2011년 출간돼 한강의 대표작 중 하나로 읽혀요.
색채가 없는 다자키 쓰쿠루와 그가 순례를 떠난 해|무라카미 하루키의 2013년 장편이에요.|도쿄에서 철도 설계 일을 하는 쓰쿠루는 고교 시절 친했던 네 명의 친구와 갑자기 절교당한 상처를 안고 살아요. 서른여섯 살이 된 그는 연인 사라의 권유로 과거의 친구들을 찾아 나서요. 일본의 나고야와 핀란드까지 여정을 이어가며 친구들의 사정을 알게 돼요. 절교의 이유와 자신의 모습을 마주해요. 쓰쿠루는 상처를 받아들이고 앞으로 나아가려 해요.|2013년 출간돼 발매 직후 큰 화제가 됐어요.
공중그네|오쿠다 히데오는 1959년생 일본 작가로 이 작품으로 나오키상을 받았어요.|엉뚱한 정신과 의사 이라부 이치로의 병원을 찾은 환자들이 겪는 이야기를 모은 연작 단편집이에요. 공중그네 곡예사는 갑자기 그네를 잡지 못하게 되고, 야쿠자는 뾰족한 물건을 보면 공포를 느껴요. 이라부는 이상한 처방으로 환자들을 이끌어요. 환자들은 의외의 방법으로 마음의 병을 치유해요. 따뜻한 유머가 이어져요.|2004년 나오키상을 받았어요.
빙점|미우라 아야코는 1922년생 일본 작가로 기독교 신앙을 바탕으로 한 작품을 썼어요.|의사 쓰지구치의 어린 딸 루리코가 살해되고, 아내 나쓰에는 부정한 관계를 의심해 복수심을 품어요. 부부는 범인의 딸인 줄 모르고 입양한 요코를 키워요. 나쓰에는 요코의 출신을 알게 되자 점차 학대하기 시작해요. 요코는 이유를 모르고 괴로워하다가 자신의 출신을 알게 돼요. 이야기는 원죄와 용서의 문제를 다뤄요.|1964년 신문 연재로 시작해 일본에서 큰 인기를 얻었어요.
비둘기|파트리크 쥐스킨트의 1987년 중편이에요.|은행 경비원 조나단 노엘은 30년 가까이 같은 방에서 일하며 조용한 삶을 살고 있어요. 어느 날 아침 복도에 비둘기 한 마리가 앉아 있는 것을 보고 큰 충격을 받아요. 그는 비둘기가 두려워 집에 들어가지 못하고 호텔과 거리를 헤매요. 평범한 일상이 무너진 하루 동안 그는 극단적인 결심까지 해요. 결국 그는 일상으로 돌아갈 용기를 얻어요.|1987년 출간됐어요.
베로니카, 죽기로 결심하다|파울로 코엘료의 1998년 소설이에요.|슬로베니아의 스물네 살 베로니카는 겉으로는 모자랄 것 없는 삶이지만 허무를 느껴 수면제를 먹고 자살을 시도해요. 눈을 떠 보니 정신병원 빌레트에 입원해 있고 며칠밖에 살지 못한다는 말을 들어요. 병원에서 그녀는 피아노를 연주하고 다른 환자 에뒤아르와 사랑에 빠져요. 남은 시간 동안 그녀는 삶의 의미를 처음으로 생각하게 돼요. 결국 삶의 소중함을 깨닫고 살아가기로 해요.|1998년 출간됐어요. 자살을 다룬 이야기라 읽을 때 주의가 필요해요.
천사와 악마|댄 브라운의 2000년 소설로 로버트 랭던 시리즈의 첫 작품이에요.|스위스 입자 물리 연구소 세른에서 반물질이 도난당하고 과학자가 살해돼요. 하버드 교수 로버트 랭던이 소환되어 일루미나티의 짓임을 알아봐요. 교황 선출을 위한 콘클라베가 열리는 동안 유력한 추기경 네 명이 납치돼요. 랭던은 과학자 비토리아 베트라와 함께 로마의 성당들을 돌며 단서를 추적해요. 반물질 폭발이 임박한 가운데 숨겨진 음모가 드러나요.|2009년 영화로 만들어졌어요.
왕좌의 게임|조지 R. R. 마틴은 1948년생 미국 작가로 『얼음과 불의 노래』 시리즈를 썼어요.|웨스테로스 대륙에는 일곱 왕국이 철왕좌 아래 있고, 북부의 영주 에다드 스타크는 왕 로버트 바라테온의 부름을 받고 왕도로 가요. 선왕의 죽음에 의혹을 품고 조사하던 에다드는 왕비 세르세이의 가문 라니스터의 음모를 알게 돼요. 한편 바다 건너에서는 몰락한 왕가의 후손 대너리스가 새로운 힘을 얻어요. 북쪽 장벽 너머에서는 오래된 위협이 깨어나요. 왕국은 전쟁의 길로 접어들어요.|1996년 출간됐고 2011년 HBO 드라마로 만들어져 세계적 인기를 얻었어요.
붉은 수수밭|모옌은 1955년생 중국 작가로 2012년 노벨 문학상을 받았어요.|1930년대 산둥 지방의 가오미현에서 열여덟 살 소녀 주얼이 나이 많은 문둥병 환자와 강제로 결혼해요. 주얼은 가마를 타고 가던 중 수수밭에서 가마꾼 위잔아오와 이끌려 가까워져요. 일본군이 침공하자 마을 사람들은 수수밭에서 저항에 나서요. 전투 중 많은 이들이 죽고 주얼도 희생돼요. 소설은 손자 화자가 선조들의 삶을 회상하는 형식이에요.|1986년 출간돼 모옌을 알린 작품이고 장이머우 감독의 영화로 만들어졌어요.
낙타샹즈|라오서는 1899년생 중국 작가로 베이징 사람들의 삶을 그렸어요.|시골에서 올라온 청년 샹즈는 베이징에서 인력거꾼이 돼 자기 인력거를 갖는 것이 꿈이에요. 열심히 일해 인력거를 샀지만 군인들에게 빼앗겨요. 그는 낙타 세 마리를 끌고 도망쳐 '낙타'라는 별명을 얻어요. 이후 호랑이 같은 여자 후뉴와 결혼하고 불행을 겪으며 점점 타락해요. 결국 희망을 잃은 샹즈의 모습이 그려져요.|1936년 발표됐어요.
창문 넘어 도망친 100세 노인|요나스 요나손은 1961년생 스웨덴 작가예요.|100세 생일잔치를 앞둔 알란 칼손은 양로원 창문을 넘어 도망쳐요. 그는 버스터미널에서 우연히 마약 조직의 가방을 얻어 쫓기게 돼요. 도피 중에 만난 사람들과 함께 모험을 이어가요. 알란의 과거도 소개되는데 폭탄 제조에 능해 20세기 주요 인물들과 얽혔어요. 현재와 과거가 교차하며 유쾌한 모험이 펼쳐져요.|2009년 출간돼 큰 인기를 얻었고 영화로 만들어졌어요.
왜 나는 너를 사랑하는가|알랭 드 보통은 1969년생 스위스 태생 영국 작가예요. 일상을 철학으로 풀어내는 글로 유명해요.|화자는 기차에서 만난 여성 클로이와 사랑에 빠져 연애를 시작해요. 두 사람의 만남과 연애는 처음의 설렘에서 일상의 갈등으로 이어져요. 화자는 사랑의 과정을 철학적 관점에서 분석하며 이야기를 풀어가요. 낭만적 환상과 현실의 간극에서 괴로워해요. 결국 연애는 끝에 이르고 화자는 사랑의 의미를 생각해요.|1993년 출간된 알랭 드 보통의 데뷔작이에요.
티핑 포인트|말콤 글래드웰은 캐나다 저널리스트이자 작가예요.|이 책은 사회과학서라 줄거리 대신 구성으로 소개해요. 저자는 작은 변화가 어느 순간 급격히 퍼지는 현상을 설명해요. 소수의 법칙, 고착성의 법칙, 상황의 힘이라는 세 가지 원리를 소개해요. 뉴욕의 범죄율 감소와 신발 유행 사례를 예로 들어요. 사람들을 연결하는 커넥터, 정보를 모으는 메이븐, 설득하는 세일즈맨이 중요하다고 말해요.|2000년 출간돼 마케팅과 사회 현상 설명에 널리 인용됐어요.
라틴어 수업|한동일은 한국인 최초로 바티칸 대법원 로타 로마나 변호사가 된 인물이에요.|이 책은 교양서라 줄거리 대신 구성으로 소개해요. 저자는 서강대에서 한 라틴어 강의를 바탕으로 라틴어의 기초와 문화를 소개해요. 라틴어 문장과 격언을 통해 삶의 지혜를 이야기해요. 로마법, 신학, 교회 용어 속 라틴어의 의미도 설명해요. 공부의 즐거움과 삶의 태도를 함께 이야기해요.|2017년 출간돼 큰 인기를 얻었어요.
유혹하는 글쓰기|스티븐 킹은 1947년생 미국 소설가로 『샤이닝』 『미저리』 등을 썼어요.|이 책은 글쓰기 안내서라 줄거리 대신 구성으로 소개해요. 1부는 저자의 어린 시절과 작가가 된 과정을 담은 회고예요. 2부는 글쓰기의 도구함으로 어휘, 문법, 문장 쓰기를 설명해요. 3부는 구체적인 글쓰기 조언으로 부사를 줄이고 매일 쓰며 많이 읽으라고 해요. 마지막에는 교통사고를 겪은 뒤 다시 글을 쓰게 된 경험을 이야기해요.|2000년 출간됐어요.
90년생이 온다|임홍택은 1980년대 후반생 작가이자 회사원이에요.|이 책은 사회 분석서라 줄거리 대신 구성으로 소개해요. 저자는 90년대생 젊은 세대를 간단하고 재미있고 정직한 세대라고 설명해요. 직장, 소비, 인간관계에서 달라진 모습을 사례로 보여 줘요. 기성세대가 이해하기 어려운 태도를 이해하려 애써요. 세대 갈등을 줄이는 방법을 제안해요.|2018년 출간돼 베스트셀러가 됐어요.
여덟 단어|박웅현은 광고인으로 '진심이 짓는다' 등 유명한 광고를 만들었어요.|이 책은 인문 에세이라 줄거리 대신 구성으로 소개해요. 저자는 자존, 본질, 고전, 견, 현재, 권위, 소통, 인생이라는 여덟 단어로 삶의 태도를 이야기해요. 문학, 영화, 광고 등의 사례를 곁들여요. 일상에서 보는 힘을 키우라고 조언해요. 고전을 읽는 즐거움과 현재를 살아가는 지혜를 전해요.|2013년 출간돼 스테디셀러가 됐어요.
악의|히가시노 게이고의 1996년 가가 형사 시리즈 작품이에요.|인기 소설가 히다카 구니히코가 자택 서재에서 살해된 채 발견돼요. 발견한 사람은 절친한 친구이자 아동 문학 작가 노노구치 오사무예요. 가가 형사는 노노구치의 수기를 읽으며 수사를 이어가요. 범인은 일찍 드러나지만 동기는 끝까지 밝혀지지 않아요. 가가는 사건의 겉모습 뒤에 숨은 진짜 이유를 추적해요. 동기가 드러나며 반전이 이어져요.|1996년 출간됐어요.
애크로이드 살인 사건|애거사 크리스티의 1926년 작품으로 푸아로 시리즈 중 하나예요.|영국 시골 마을 킹스 애벗에서 부유한 로저 애크로이드가 서재에서 살해돼요. 마을 의사 셰퍼드가 화자로서 사건을 기록해요. 은퇴하고 마을에 와 있던 푸아로가 수사에 나서요. 마을 사람들의 비밀이 하나씩 드러나고 용의자는 여러 명으로 늘어나요. 푸아로는 마침내 놀라운 진실을 밝혀요.|1926년 출간돼 추리 소설사에 남는 반전으로 유명해요.
환상의 여인|윌리엄 아이리시는 코넬 울리치의 필명 중 하나예요.|헨더슨은 아내와 다툰 뒤 술집에서 낯선 여인을 만나 함께 저녁을 보내요. 집에 돌아온 그는 아내가 살해된 것을 발견하고 용의자가 돼요. 알리바이를 증명할 여인의 행방을 찾지만 목격자들은 모두 그녀를 본 적이 없다고 해요. 사형 집행일은 다가오고 친구 존이 진실을 찾기 위해 나서요. 마지막 순간에 진범이 드러나요.|1942년 출간된 서스펜스 소설의 고전이에요.
Y의 비극|엘러리 퀸은 두 사촌 프레더릭 대니와 맨프레드 리가 함께 쓴 필명이에요.|뉴욕의 해터 가문은 별난 성격의 가족들이 모여 사는 집안이에요. 가장 요크 해터가 실종된 뒤 시신으로 발견되고 곧이어 독이 든 약으로 사고가 일어나요. 퇴역한 배우이자 탐정 드루리 레인이 사건 해결에 나서요. 가족 구성원마다 비밀이 있어 수사는 쉽지 않아요. 드루리 레인은 놀라운 추리로 진상을 밝혀 내요.|1932년 출간된 걸작 추리로 꼽혀요.
덕혜옹주|권비영은 1960년대생 소설가예요.|덕혜옹주는 고종이 환갑에 얻은 막내딸로 사랑받으며 자라요. 열세 살에 일본으로 끌려가 일본 학교에 다니며 고독하게 지내요. 어머니의 죽음과 정략결혼 등 시련을 겪으며 정신 질환이 깊어져요. 결국 정신병원에 입원했다가 해방 후에도 오랫동안 귀국하지 못해요. 1962년 마침내 귀국하지만 병든 몸으로 쓸쓸히 지내요.|2009년 출간돼 큰 인기를 얻었고 2016년 영화로 만들어졌어요.
죽은 시인의 사회|N. H. 클라인바움은 1948년생 미국 작가로 영화 시나리오를 소설로 옮겼어요.|1959년 명문 사립 웰튼 아카데미에 영문학 교사 존 키팅이 부임해요. 그는 학생들에게 현재를 즐기라는 카르페 디엠을 강조해요. 학생들은 키팅의 영향을 받아 비밀 동아리 죽은 시인의 사회를 되살려요. 한 학생 닐은 연극을 하고 싶어하지만 아버지의 반대로 비극을 맞아요. 학교는 키팅을 책임지게 하고 학생들은 마지막 순간 책상 위에 올라서요.|1989년 영화가 큰 인기를 얻었어요.
리타 헤이워스와 쇼생크 탈출|스티븐 킹의 1982년 중편으로 소설집 『사계』에 실렸어요.|은행가 앤디 듀프레인은 아내와 정부를 죽인 혐의로 종신형을 받고 쇼생크 교도소에 수감돼요. 그는 교도소에서 레드를 비롯한 수감자들과 친해지고 교도소장의 세금 문제를 도와 입지를 만들어요. 앤디는 오랜 세월 몰래 바위를 파며 탈출 계획을 세워요. 교도소장의 부정을 이용해 마침내 탈옥에 성공해요. 레드는 가석방된 뒤 앤디를 찾아 떠나요.|1994년 영화로 만들어졌어요.
세이노의 가르침|세이노는 필명을 쓰는 저자로 온라인에서 글을 공개해 왔어요.|이 책은 자기계발서라 줄거리 대신 구성으로 소개해요. 저자는 부자가 되려면 먼저 돈이 일하는 구조를 이해하라고 말해요. 월급에 의존하지 말고 시간과 노력을 쌓아 자신의 가치를 높이라고 해요. 일과 투자, 인간관계에서 지켜야 할 태도를 직설적으로 이야기해요. 부를 위해 필요한 습관을 제시해요.|2023년 출간돼 큰 베스트셀러가 됐어요.
역행자|자청은 1987년생 사업가 작가예요.|이 책은 자기계발서라 줄거리 대신 구성으로 소개해요. 저자는 본능에 따르는 삶을 순리자라 하고 이를 거스르는 삶을 역행자라 불러요. 자의식 해체, 정체성 만들기, 유전자 오작동 극복 등 7단계 방법을 제시해요. 독서와 글쓰기를 통해 성장하고 경제적 자유를 얻을 수 있다고 말해요. 저자의 경험을 바탕으로 한 사례가 나와요.|2022년 출간돼 베스트셀러가 됐어요.
도파민네이션|애나 렘키는 스탠퍼드 대학 정신과 교수이자 중독 치료 전문의예요.|이 책은 의학 교양서라 줄거리 대신 구성으로 소개해요. 저자는 현대 사회가 쾌락 과잉 시대이며 도파민이 중독을 만든다고 설명해요. 환자 사례를 통해 알코올, 스마트폰, 도박 등 여러 중독을 이야기해요. 쾌락과 고통의 균형을 맞추는 법을 제시해요. 도파민 단식과 정직한 소통이 회복에 도움이 된다고 해요.|2021년 출간돼 화제가 됐어요.
회복탄력성|김주환은 연세대 커뮤니케이션 대학원 교수예요.|이 책은 심리학서라 줄거리 대신 구성으로 소개해요. 저자는 시련을 딛고 일어나는 힘인 회복탄력성을 설명해요. 자기조절능력, 대인관계능력, 긍정성의 세 가지가 핵심이라고 해요. 감사하기, 운동하기, 독서하기 등 훈련 방법을 제시해요. 실제 연구와 사례를 곁들여 설명해요.|2011년 출간돼 스테디셀러가 됐어요.
21세기를 위한 21가지 제언|유발 하라리의 2018년 책이에요.|이 책은 시사 교양서라 줄거리 대신 구성으로 소개해요. 21개의 장에서 기술, 정치, 정체성, 탈진실, 교육, 명상 같은 주제를 다뤄요. 인공지능과 생명공학이 일자리와 민주주의에 미치는 영향을 이야기해요. 테러, 민족주의, 종교 등 세계적 문제도 짚어요. 마지막 장에서는 명상을 통한 자기 이해를 권해요.|2018년 출간됐어요.
넥서스|유발 하라리의 2024년 책이에요.|이 책은 역사 교양서라 줄거리 대신 구성으로 소개해요. 인류 역사를 정보 네트워크의 발전 과정으로 설명해요. 신화, 문서, 인쇄술, 신문, 인터넷의 등장이 권력의 구조를 어떻게 바꾸었는지 보여 줘요. 인공지능이 자체 판단을 내리는 정보 행위자로 등장했음을 경고해요. 민주주의와 독재에서 정보가 어떻게 쓰이는지 비교해요.|2024년 출간돼 화제가 됐어요.
세계사 편력|자와할랄 네루는 1889년생 인도의 정치가로 독립 후 초대 총리를 지냈어요.|이 책은 서간집 형식의 역사서라 줄거리 대신 구성으로 소개해요. 네루는 영국 식민 통치에 맞서다 투옥된 동안 딸 인디라에게 편지를 써요. 선사 시대부터 고대 문명, 동서양의 역사, 근대의 변화까지 세계사를 쉽게 풀어 써요. 편지 속에는 아버지의 따뜻한 마음과 인류에 대한 시선이 담겨 있어요. 서양 중심이 아닌 인도의 시각이 눈에 띄어요.|1930~1933년 옥중에서 쓴 편지를 엮어 1934년에 출간됐어요.
언어의 온도|이기주는 1980년대생 작가로 일상의 단상을 모은 에세이를 써 왔어요.|이 책은 에세이집이라 줄거리 대신 구성으로 소개해요. 저자는 길에서 마주친 말과 글, 사람들의 한마디를 소재로 삼아 언어에 담긴 온도를 이야기해요. 따뜻한 말이 건네는 위로와 차가운 말의 상처를 사례로 보여 줘요. 이름, 사랑, 이별, 가족 등을 주제로 한 짧은 글이 이어져요. 책은 말 한마디의 무게를 되돌아보게 해요.|2016년 출간돼 큰 인기를 얻었어요.
어서 오세요, 휴남동 서점입니다|황보름은 1980년대 후반생 작가로 이 소설로 이름을 알렸어요.|회사 일에 지친 영주는 사표를 내고 동네에 서점을 열어요. 서점에는 고민을 안고 찾아오는 손님과 바리스타 민철, 베스트셀러 작가 지미 등이 모여요. 영주는 책을 권하는 일을 하며 사람들의 사연에 귀 기울여요. 서점은 사람들이 쉬어 가는 공간이 돼요. 영주는 이곳에서 자신의 삶도 다시 정리해요.|2022년 출간돼 큰 인기를 얻었어요.
이어령의 마지막 수업|이어령은 1934년생 문학평론가이자 초대 문화부 장관을 지낸 학자예요. 2022년 세상을 떠났어요.|이 책은 대담집이라 줄거리 대신 구성으로 소개해요. 암 투병 중인 이어령이 김지수 기자와 마주 앉아 삶과 죽음에 대해 이야기해요. 저자는 마지막까지 지식과 유머를 잃지 않고 후회와 사랑, 딸 민아에 대한 마음을 들려줘요. 죽음을 앞둔 자의 시선으로 삶의 의미를 이야기해요. 깊이 있는 통찰이 담겨 있어요.|2021년 출간돼 큰 감동을 줬어요.
생각의 탄생|로버트 루트번스타인과 미셸 루트번스타인은 부부로 학자예요.|이 책은 교양서라 줄거리 대신 구성으로 소개해요. 저자들은 레오나르도 다빈치, 아인슈타인, 피카소 등 창조적인 인물들이 사용한 13가지 사고 도구를 분석해요. 관찰, 형상화, 추상, 패턴 인식, 유추, 몸으로 생각하기 등이 포함돼요. 각 도구를 설명하며 일상에서 연습하는 방법을 제안해요. 창의적 사고는 학문 영역을 넘나든다고 주장해요.|1999년 출간됐어요.
트렌드 코리아|김난도는 서울대 소비자학과 교수예요.|이 책은 연간 트렌드 전망서라 줄거리 대신 구성으로 소개해요. 서울대 소비트렌드분석센터가 매년 다음 해 소비 트렌드를 열 개 키워드로 정리해요. 키워드는 사회 변화와 소비자 행동 분석을 바탕으로 해요. 기업과 개인이 변화를 이해하고 대응하도록 사례와 데이터를 제시해요. 매년 새 판이 출간돼요.|2008년부터 매년 출간됐어요.
행복의 기원|서은국은 연세대 심리학과 교수로 진화심리학을 연구해 왔어요.|이 책은 심리학서라 줄거리 대신 구성으로 소개해요. 저자는 행복이 목표가 아니라 생존과 번식을 돕는 장치라고 설명해요. 행복은 사람들과의 만남과 즐거운 경험에서 온다고 해요. 큰 행복보다 작은 즐거움의 빈도가 중요하다고 강조해요. 성격과 유전의 영향도 이야기해요.|2014년 출간돼 오랫동안 읽혔어요.
내 이름은 빨강|오르한 파묵은 1952년생 튀르키예 작가로 2006년 노벨 문학상을 받았어요.|16세기 말 오스만 제국의 술탄이 비밀리에 화집 제작을 명하고 세밀화가들이 모여요. 화가 한 사람이 살해되고 사건을 해결하기 위해 검은이 이스탄불로 돌아와요. 서양 화풍을 받아들일지, 전통을 지킬지를 두고 화가들의 갈등이 깊어져요. 이야기는 죽은 사람, 개, 색, 화가 등 여러 화자가 번갈아 들려줘요. 마침내 살인자의 정체가 드러나요.|1998년 출간됐어요.
빌러비드|토니 모리슨은 1931년생 미국 작가로 1993년 노벨 문학상을 받았어요.|남북전쟁 직후 오하이오에서 탈출 노예 세서는 딸 덴버와 함께 살아요. 세서의 집은 죽은 아기의 유령이 떠돌아요. 세서는 과거에 노예로 잡혀갈 위기에서 자식을 죽였던 기억에 시달려요. 어느 날 빌러비드라는 젊은 여자가 집에 나타나요. 빌러비드는 죽은 아기의 환생처럼 보이고 집안을 지배하기 시작해요.|1987년 출간돼 퓰리처상을 받았어요.
눈먼 자들의 도시|주제 사라마구는 1922년생 포르투갈 작가로 1998년 노벨 문학상을 받았어요.|어느 도시에서 갑자기 한 남자가 눈이 멀어요. 이 증상은 전염병처럼 퍼지고 정부는 눈먼 사람들을 폐쇄된 정신병원에 가둬요. 수용소 안에서 사람들은 서로를 착취하고 폭력을 휘둘러요. 오직 한 여인만 눈이 멀지 않은 채 남편을 돌보며 이들을 이끌어요. 수용소에서 탈출한 사람들은 황폐해진 도시를 헤매요. 마침내 시력이 돌아오기 시작해요.|1995년 출간돼 2008년 영화로 만들어졌어요.
추락|J. M. 쿳시는 1940년생 남아프리카공화국 출신 작가로 2003년 노벨 문학상을 받았어요.|케이프타운의 대학 교수 데이비드 루리는 제자와의 관계가 문제 되어 해고돼요. 그는 딸 루시가 사는 시골 농장으로 가요. 어느 날 낯선 남자들이 농장에 침입해 딸을 해치고 데이비드에게도 폭력을 휘둘러요. 루시는 사건 이후 놀라운 결정을 내리고 데이비드는 이를 이해하지 못해요. 그는 몰락한 자신의 삶을 돌아봐요.|1999년 출간돼 부커상을 받았어요.
숨그네|헤르타 뮐러는 1953년생 루마니아 출신 독일 작가로 2009년 노벨 문학상을 받았어요.|열일곱 살 레오는 1945년 1월 소련군에 의해 루마니아에서 독일계라는 이유로 수용소에 끌려가요. 그곳에서 혹독한 추위와 굶주림, 강제 노동에 시달려요. 석탄과 시멘트, 시시각각 닥치는 굶주림의 천사가 이야기에 등장해요. 시인 오스카 파스티오르의 경험이 바탕이에요. 레오는 5년의 수용소 생활 끝에 돌아와요.|2009년 출간됐어요.
태고의 시간들|올가 토카르추크는 1962년생 폴란드 작가로 2018년 노벨 문학상(2019년 발표)을 받았어요.|가상의 마을 태고에서 시간이 흐르며 여러 사람의 삶이 이어져요. 책은 84개의 짧은 장으로 이루어져 있고 각 장은 마을 사람, 동물, 사물, 천사 등의 시선으로 서술돼요. 20세기 폴란드의 격동 속에서 마을 사람들은 전쟁과 변화를 겪어요. 마을은 신화와 현실이 섞인 곳으로 그려져요. 생과 사의 순환이 담긴 이야기예요.|1996년 출간됐어요.
어두운 상점들의 거리|파트리크 모디아노는 1945년생 프랑스 작가로 2014년 노벨 문학상을 받았어요.|기억을 잃은 탐정 기 롤랑은 자신이 누구인지 알기 위해 과거의 흔적을 찾아다녀요. 그는 오래된 사진과 주소록을 따라 파리와 외국을 돌아다녀요. 만난 사람들은 그를 다른 이름으로 기억하고 있어요. 단서가 이어지다 끊기며 롤랑은 진짜 자신의 모습에 다가가요. 기억과 정체성의 문제를 다루는 이야기예요.|1978년 출간돼 공쿠르상을 받았어요.
단순한 열정|아니 에르노는 1940년생 프랑스 작가로 2022년 노벨 문학상을 받았어요.|화자는 프랑스에 체류 중인 외국인 남성과 사랑에 빠져요. 그를 기다리는 시간이 삶의 전부가 되어 일상이 흔들려요. 전화와 만남을 기다리며 느낀 감정과 신체의 변화를 솔직하게 서술해요. 사랑이 끝난 뒤에도 그 열정이 남긴 흔적을 들여다봐요. 짧고 건조한 문체로 감정을 기록해요.|1991년 출간됐어요.
유리알 유희|헤르만 헤세의 마지막 장편으로 1943년에 발표됐어요.|미래의 가상 국가 카스탈리엔에는 지식인 엘리트 공동체가 있어요. 이들은 음악과 수학, 철학을 아우르는 정신적 놀이 '유리알 유희'를 발전시켜 왔어요. 주인공 요제프 크네히트는 유희의 명인이 되지만 현실과 동떨어진 세계에 회의를 느껴요. 그는 명인의 자리를 떠나 세상으로 나가려 해요. 제자 티토와 함께 호숫가에서 최후를 맞아요.|헤세는 1946년 노벨 문학상을 받았어요.
부덴브로크가의 사람들|토마스 만은 1875년생 독일 작가로 1929년 노벨 문학상을 받았어요.|북독일 뤼벡의 부유한 상인 가문 부덴브로크가의 4대에 걸친 흥망을 그린 소설이에요. 1대와 2대는 상업으로 번영을 이루지만 3대 토마스는 가문을 지키려 애쓰며 지쳐 가요. 4대 하노는 섬세한 감수성을 지닌 소년으로 가업에 흥미가 없어요. 가문은 점점 쇠퇴하고 하노가 어린 나이에 병으로 죽으면서 몰락이 완성돼요. 시민 계급의 쇠퇴가 상세하게 그려져요.|1901년 출간됐어요.
소리와 분노|윌리엄 포크너는 1897년생 미국 작가로 1949년 노벨 문학상을 받았어요.|미국 남부 미시시피의 몰락한 콤슨 가문 이야기를 네 부분으로 나누어 들려줘요. 1부는 지적 장애인 벤지의 시점으로 시간이 뒤섞여 있어요. 2부는 하버드 학생 퀜틴이 누이 캐디에 대한 집착과 가문의 몰락으로 괴로워해요. 3부는 냉소적인 제이슨의 시선이고 4부는 흑인 하녀 딜시의 시선이에요. 네 개의 시선이 모여 가문의 몰락이 드러나요.|1929년 출간돼 의식의 흐름 기법의 대표작이에요.
콜레라 시대의 사랑|가브리엘 가르시아 마르케스는 1927년생 콜롬비아 작가로 1982년 노벨 문학상을 받았어요.|젊은 플로렌티노 아리사는 페르미나 다사를 첫눈에 반해 편지를 주고받으며 사랑을 키워요. 페르미나는 아버지의 반대와 여행 끝에 마음이 식어 그를 거절하고 의사 우르비노와 결혼해요. 플로렌티노는 51년 9개월 4일 동안 여러 여인과 관계를 맺으면서도 그녀를 기다려요. 우르비노가 죽은 뒤 플로렌티노는 다시 사랑을 고백해요. 두 사람은 노년에 마침내 이어져요.|1985년 출간됐어요.
예고된 죽음의 연대기|가브리엘 가르시아 마르케스의 1981년 중편이에요.|콜롬비아의 한 마을에서 산티아고 나사르가 살해되는 사건이 일어나요. 쌍둥이 형제는 누이 앙헬라 비카리오가 결혼 첫날밤에 파혼당한 책임이 산티아고에게 있다며 그를 죽이겠다고 떠들고 다녀요. 마을 사람들 대부분이 그 사실을 알지만 아무도 제대로 막지 못해요. 화자는 이십여 년 뒤 사건을 조사하며 증언을 모아요. 결국 비극은 예고된 대로 일어나요.|1981년 출간됐어요.
고요한 돈강|미하일 숄로호프는 1905년생 러시아 작가로 1965년 노벨 문학상을 받았어요.|돈강 유역의 카자크 청년 그리고리 멜레호프는 평화롭게 살다가 1차 세계대전과 러시아 혁명, 내전을 맞아요. 그는 사랑하는 여인 악시냐와 아내 나탈리아 사이에서 갈등해요. 백군과 적군 사이를 오가며 어느 쪽에도 마음 붙이지 못해요. 가족과 마을은 전쟁으로 무너져요. 그리고리는 폐허가 된 고향으로 돌아와요.|1928~1940년에 걸쳐 완성된 대하소설이에요.
개인적인 체험|오에 겐자부로는 1935년생 일본 작가로 1994년 노벨 문학상을 받았어요.|스물일곱 살 버드는 아이의 탄생을 기다리는 교사예요. 아이는 머리에 심한 장애를 안고 태어나요. 버드는 장애아를 키울 자신이 없어 도피하려 하고 옛 연인 히미코와 방황해요. 치료를 포기하고 아이를 죽게 하려는 생각까지 하며 괴로워해요. 결국 그는 아이를 받아들이기로 결심해요.|1964년 출간됐고 작가의 아들 히카리의 탄생이 바탕이에요.
황금 노트북|도리스 레싱은 1919년생 영국 작가로 2007년 노벨 문학상을 받았어요.|작가 애나 울프는 자신의 삶을 검은색, 붉은색, 노란색, 파란색 네 권의 노트에 나누어 기록해요. 각각 아프리카 경험, 공산당 활동, 소설 쓰기, 개인적인 일기를 담아요. 삶이 점점 혼란스러워지자 그녀는 이를 하나로 합친 황금 노트북을 쓰기 시작해요. 연애와 정치, 정신적 위기가 교차하며 이야기가 진행돼요. 마침내 새로운 글쓰기로 나아가요.|1962년 출간돼 페미니즘 문학의 고전으로 평가돼요.
카타리나 블룸의 잃어버린 명예|하인리히 뵐은 1917년생 독일 작가로 1972년 노벨 문학상을 받았어요.|평범한 가정부 카타리나 블룸은 파티에서 만난 남자와 하룻밤을 보내요. 그 남자가 수배 중인 범죄자라는 이유로 카타리나는 경찰의 수사를 받아요. 타블로이드 신문은 그녀를 악의적으로 보도해 명예를 짓밟아요. 사생활이 파헤쳐지고 어머니도 충격으로 죽어요. 카타리나는 분노 끝에 기자 퇴텐을 만나 충격적인 일을 저질러요.|1974년 출간됐어요.
쿠오 바디스|헨리크 시엔키에비치는 1846년생 폴란드 작가로 1905년 노벨 문학상을 받았어요.|네로 황제 시대 로마에서 젊은 군인 비니키우스는 기독교도 소녀 리기아를 사랑하게 돼요. 리기아를 얻으려는 그의 노력과 기독교도들의 신앙이 부딪혀요. 네로가 로마에 불을 지르고 그 책임을 기독교도에게 돌려 박해가 시작돼요. 베드로가 로마를 떠나려다 환영 속 그리스도를 만나 '쿠오 바디스'라고 묻는 장면이 나와요. 비니키우스는 신앙을 받아들이게 돼요.|1896년 출간돼 영화로도 여러 번 만들어졌어요.
기탄잘리|라빈드라나트 타고르는 1861년생 인도 시인으로 1913년 아시아 최초로 노벨 문학상을 받았어요.|이 책은 시집이라 줄거리 대신 구성으로 소개해요. 저자는 신에 대한 사랑과 헌신을 노래하는 103편의 시를 담았어요. 일상의 사소한 것들 속에서 신의 존재를 느끼는 마음을 표현해요. 죽음과 삶, 자연과 인간의 관계를 다뤄요. 영어 번역본이 노벨상 수상의 계기가 됐어요.|1910년 벵골어로 처음 출간됐어요.
닐스의 모험|셀마 라겔뢰프는 1858년생 스웨덴 작가로 1909년 여성 최초로 노벨 문학상을 받았어요.|말썽꾸러기 소년 닐스는 요정을 놀렸다가 요정의 마법으로 손가락만 하게 작아져요. 그는 집에서 키우던 거위 모르텐을 타고 야생 거위 떼와 함께 스웨덴 전역을 여행해요. 닐스는 여행 중에 여우 스미레에게 쫓기기도 하고 동물들과 우정을 쌓아요. 여행을 하며 자연과 나라의 풍경을 배우고 마음씨도 착해져요. 마침내 닐스는 원래 모습으로 돌아와요.|1906~1907년 출간된 스웨덴 지리 교과서용 동화예요.
악령|표도르 도스토옙스키는 1821년생 러시아 작가예요.|지방 도시에 급진적 혁명 사상을 가진 표트르 베르호벤스키가 나타나 비밀 조직을 만들어요. 그는 지식인 스타브로긴을 우상으로 삼고 조직원들을 이용해 살인을 저질러요. 스테판 선생을 비롯한 구세대 지식인들은 변화하는 사상 앞에서 무력해져요. 조직원 샤토프가 배신자로 몰려 살해되고 도시는 혼란에 빠져요. 스타브로긴은 허무 속에서 스스로 생을 마감해요.|1872년 출간됐고 실제 네차예프 사건이 소재예요.
대위의 딸|알렉산드르 푸시킨은 1799년생 러시아 국민 시인이자 작가예요.|젊은 장교 표트르 그리뇨프는 벽지 요새로 파견돼 대위의 딸 마샤를 사랑하게 돼요. 그러나 경쟁자 시바브린이 마샤를 괴롭혀요. 푸가초프의 반란이 일어나 요새가 함락되고 그리뇨프는 푸가초프의 도움으로 살아남아요. 반란이 진압된 뒤 그는 반역 혐의를 받고 마샤가 직접 여제를 찾아가 구해요. 두 사람은 혼인하게 돼요.|1836년 출간된 푸시킨의 마지막 장편 소설이에요.
예브게니 오네긴|알렉산드르 푸시킨의 운문 소설로 1833년 완성됐어요.|권태에 빠진 귀족 청년 오네긴은 시골에 내려와 시인 렌스키와 친구가 돼요. 순수한 처녀 타티아나는 오네긴을 사랑해 편지를 쓰지만 오네긴은 냉정하게 거절해요. 오네긴은 렌스키와 사소한 일로 결투를 벌여 그를 죽이고 방랑을 떠나요. 몇 해 뒤 상류 사회 부인이 된 타티아나를 만난 오네긴은 뒤늦게 사랑에 빠져요. 그러나 타티아나는 이제 그를 거절해요.|러시아 문학의 출발점으로 평가돼요.
죽은 혼|니콜라이 고골은 1809년생 러시아 작가예요.|사기꾼 치치코프는 지방 도시를 돌며 지주들에게 이미 죽었지만 아직 장부에 남아 있는 농노들의 명부를 사들여요. 그는 이 죽은 농노들을 담보로 대출을 받을 계획이에요. 마닐로프, 코로보치카, 노즈드료프 등 개성 강한 지주들이 등장해 사회를 풍자해요. 결국 치치코프의 계획은 의심을 사 도시를 떠나요. 소설은 러시아 사회의 부패를 비춰요.|1842년 1부가 출간됐어요.
댈러웨이 부인|버지니아 울프는 1882년생 영국 작가로 모더니즘 문학의 선구자예요.|1923년 6월 어느 날, 상류층 부인 클라리사 댈러웨이는 저녁 파티를 위해 꽃을 사러 나가요. 이 하루 동안 그녀는 옛 연인 피터의 방문과 젊은 시절의 기억을 떠올려요. 한편 1차 대전 참전 후유증에 시달리는 셉티머스의 이야기가 병행돼요. 셉티머스는 병원에 가기를 거부하다가 창밖으로 몸을 던져요. 클라리사는 파티에서 그의 죽음 소식을 듣고 삶의 의미를 되새겨요.|1925년 출간돼 의식의 흐름 기법의 대표작이에요.
채털리 부인의 연인|D. H. 로런스는 1885년생 영국 작가예요.|귀족 클리퍼드 채털리는 전쟁에서 하반신이 마비돼 돌아와요. 아내 콘스탄스는 쓸쓸한 저택 생활에서 삶의 활력을 잃어가요. 그녀는 사냥터지기 올리버 멜러스를 만나 마음이 끌려요. 두 사람은 계급과 관습을 넘어 사랑에 빠져요. 콘스탄스는 남편을 떠나 새 삶을 선택하려 해요.|1928년 출간됐고 영국에서는 외설 시비로 오랫동안 금서였어요. 1960년 완전판이 나와 재판에서 무죄를 받았어요.
아들과 연인|D. H. 로런스의 1913년 자전적 장편이에요.|영국 탄광촌에서 광부 모렐 부부는 사이가 나빠 어머니는 아들들에게 애정을 쏟아요. 큰아들 윌리엄이 일찍 세상을 떠나자 어머니는 둘째 아들 폴에게 더욱 집착해요. 폴은 순진한 미리엄과 자유분방한 클라라를 사랑하지만 어머니에 대한 애착 때문에 관계가 이어지지 않아요. 어머니가 병으로 죽자 폴은 깊은 상실감에 빠져요. 그러나 그는 삶을 계속하겠다고 결심해요.|1913년 출간된 로런스의 대표작이에요.
더블린 사람들|제임스 조이스는 1882년생 아일랜드 작가예요.|이 책은 15편의 단편으로 이루어져 있어요. 어린 시절, 청년기, 성인기, 공공 생활의 단계로 나뉘어 더블린 시민들의 삶을 그려요. 「애러비」 「이블린」 「죽은 사람들」 등이 유명해요. 각 이야기는 마비된 도시 속 사람들의 좌절을 보여 줘요. 마지막 「죽은 사람들」은 눈 내리는 밤의 깨달음으로 끝나요.|1914년 출간됐어요.
이성과 감성|제인 오스틴은 1775년생 영국 작가예요.|아버지를 잃고 가난해진 대시우드 집안의 엘리너와 메리앤 자매는 시골 오두막으로 이사해요. 이성적인 엘리너는 에드워드를 사랑하지만 사정이 있어 마음을 드러내지 못해요. 감정이 풍부한 메리앤은 매력적인 윌러비에게 빠졌다가 버림받아요. 메리앤은 크게 앓고 나서 현실을 깨달아요. 마침내 두 자매 모두 알맞은 짝을 찾아요.|1811년 출간된 오스틴의 첫 소설이에요.
황야의 이리|헤르만 헤세의 1927년 소설이에요.|중년의 지식인 하리 할러는 인간 안에 있는 이성과 이리의 본능 사이에서 갈등하며 고독하게 살아가요. 그는 도시의 하숙집에서 죽음을 생각하다가 '마술 극장'이라는 전단지를 받아요. 그는 헤르미네를 만나 춤과 재즈, 사랑을 경험하며 변화해 가요. 마술 극장에서 그는 자신 안의 여러 모습을 마주해요. 하리는 삶을 유머로 받아들이는 법을 배워요.|1927년 출간돼 1960년대 청년들에게 큰 인기를 얻었어요.

정의란 무엇인가|마이클 샌델은 1953년생 미국 정치철학자로 하버드대에서 오랫동안 가르쳤어요. 공동체주의 입장에서 정의와 시장의 도덕적 한계를 다뤄 왔어요.|이 책은 철학 강의서라 줄거리 대신 구성으로 소개해요. 저자는 공리주의, 자유지상주의, 칸트의 도덕철학, 롤스의 정의론, 아리스토텔레스의 공동체 윤리를 차례로 소개해요. 전차 문제와 같은 딜레마, 구제금융, 병역 같은 현실 사례를 통해 정의의 기준을 따져요. 각 입장의 장단점을 학생들과 토론하는 형식으로 보여 줘요. 마지막에는 공동선을 고민하는 정치가 필요하다고 말해요.|2009년 영어로 출간돼 세계적 베스트셀러가 됐고 한국에서 특히 큰 인기를 얻었어요.

총 균 쇠|재레드 다이아몬드는 1937년생 미국 생리학자이자 지리학자예요.|이 책은 인류사 연구서라 줄거리 대신 구성으로 소개해요. 대륙마다 문명의 발전 속도가 달랐던 이유를 인종의 우열이 아닌 환경에서 찾아요. 유라시아에는 재배할 수 있는 작물과 길들일 수 있는 동물이 많았고 동서로 길게 뻗은 대륙 축이 전파에 유리했다고 설명해요. 가축에서 옮은 병균이 유럽인의 정복에 결정적이었다고 해요. 총과 균과 쇠가 정복의 직접적인 원인이라고 정리해요.|1997년 출간돼 퓰리처상을 받았어요. 환경 결정론이라는 비판도 있어요.

국부론|애덤 스미스는 1723년생 스코틀랜드의 도덕철학자이자 경제학자예요.|이 책은 경제학 고전이라 줄거리 대신 구성으로 소개해요. 분업이 생산성을 높이는 이유를 핀 공장 사례로 설명해요. 사람들이 자기 이익을 추구해도 시장에서 '보이지 않는 손'이 자원을 효율적으로 배분한다고 말해요. 중상주의와 정부의 지나친 간섭을 비판하고 자유로운 교역을 옹호해요. 국가의 역할은 국방, 사법, 공공사업으로 제한된다고 해요.|1776년 출간돼 근대 경제학의 출발점으로 평가돼요.

공산당 선언|카를 마르크스와 프리드리히 엥겔스는 독일의 사상가로 공산주의 사상을 이끌었어요.|이 책은 정치 팸플릿이라 줄거리 대신 구성으로 소개해요. 지금까지 모든 사회의 역사는 계급투쟁의 역사라고 말해요. 자본가와 노동자의 대립이 자본주의 안에서 심화된다고 분석해요. 프롤레타리아가 혁명으로 사유재산 제도를 폐지해야 한다고 주장해요. 마지막에는 '만국의 노동자여, 단결하라'로 끝나요.|1848년 런던에서 출간됐어요.
소크라테스의 변명|플라톤은 기원전 427년경 아테네에서 태어난 철학자로 소크라테스의 제자예요.|이 책은 대화편이라 줄거리 대신 구성으로 소개해요. 소크라테스는 아테네 시민에게 신을 믿지 않고 젊은이를 타락시켰다는 죄로 재판을 받아요. 그는 델포이 신탁에서 가장 지혜로운 사람이라는 말을 들었다고 하며 자신의 무지를 아는 것이 지혜라고 말해요. 유죄 판결 뒤에도 사형을 피하려 하지 않고 철학하는 삶을 이어 가겠다고 해요. 죽음을 두려워하는 것은 모르는 것을 아는 척하는 것이라고 말해요.|기원전 399년의 재판을 바탕으로 쓰였어요.

방법서설|르네 데카르트는 1596년생 프랑스 철학자로 근대 철학의 아버지로 불려요.|이 책은 철학적 자서전 형식이라 줄거리 대신 구성으로 소개해요. 데카르트는 의심할 수 있는 모든 것을 의심하는 방법적 회의로 시작해요. 모든 것을 의심해도 의심하는 내가 있다는 사실은 의심할 수 없다고 해서 '나는 생각한다, 고로 존재한다'에 이르러요. 올바른 사고를 위한 네 가지 규칙을 제시해요. 신의 존재와 영혼, 물질 세계에 대한 생각도 서술해요.|1637년 프랑스어로 출간됐어요.
