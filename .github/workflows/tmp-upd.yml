name: tmp-upd
on:
  push:
    branches: [test-upd]
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r smart-explorer/requirements-build.txt -r smart-clipboard/requirements-build.txt pillow
      - env: { PYTHONIOENCODING: utf-8 }
        run: |
          python tmpt/u.py se
          python tmpt/u.py clip
