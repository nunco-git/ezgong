# 스마트탐색기 자동 배포
#   smart-explorer/smart_explorer.py 의 APP_VERSION 을 올려서 main 에 올리면
#   (또는 태그 smartexplorer-v1.2.3 을 올리면, 또는 Actions 탭에서 직접 실행하면)
#   깃허브 서버(윈도우)에서 빌드 → SHA-256 기록 → 빌드 출처 증명 → 릴리스(태그 smartexplorer-v버전) 게시
#   같은 버전 릴리스가 이미 있으면 아무것도 하지 않음
name: smart-explorer-release

on:
  push:
    branches: [main]
    paths:
      - "smart-explorer/**"
      - ".github/workflows/smart-explorer-release.yml"
    tags: ["smartexplorer-v*"]
  workflow_dispatch:

permissions:
  contents: write        # 릴리스·태그 만들기
  id-token: write        # 빌드 출처 증명(attestation) 서명
  attestations: write

concurrency:
  group: smart-explorer-release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh
    working-directory: smart-explorer

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 버전 확인 (이미 나간 버전이면 건너뜀)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            python tools/make_version_file.py --check "${{ github.ref_name }}"
          } else {
            python tools/make_version_file.py | Out-Null
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ver = (python tools/make_version_file.py).Trim()
          $tag = "smartexplorer-v$ver"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "ver=$ver" >> $env:GITHUB_OUTPUT
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "릴리스 $tag 가 이미 있어서 건너뜁니다. 새로 내려면 APP_VERSION 을 올려 주세요."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: 패키지 설치
        if: steps.ver.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-lock.txt) { pip install -r requirements-lock.txt }
          else { pip install -r requirements-build.txt }

      - name: exe 만들기
        if: steps.ver.outputs.skip != 'true'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name SmartExplorer `
            --icon smart_explorer.ico --version-file version_info.txt `
            --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all winrt `
            --collect-submodules comtypes --hidden-import pystray._win32 `
            --exclude-module numpy --exclude-module pandas --exclude-module matplotlib --exclude-module scipy `
            --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide6 --exclude-module IPython `
            --exclude-module pytest --exclude-module pydoc_data `
            smart_explorer.py

      # (선택) 코드 서명 인증서가 생기면 여기에 서명 단계를 넣으세요. 서명은 해시 계산 전에 해야 합니다.

      - name: SHA-256 계산
        id: hash
        if: steps.ver.outputs.skip != 'true'
        run: |
          $h = (Get-FileHash dist/SmartExplorer.exe -Algorithm SHA256).Hash.ToLower()
          "$h  SmartExplorer.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          "sha=$h" >> $env:GITHUB_OUTPUT

      - name: 빌드 출처 증명
        if: steps.ver.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: smart-explorer/dist/SmartExplorer.exe

      - name: 릴리스 만들기 (초안)
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          name: 스마트탐색기 v${{ steps.ver.outputs.ver }}
          files: |
            smart-explorer/dist/SmartExplorer.exe
            smart-explorer/dist/SHA256SUMS.txt
          body: |
            ## 스마트탐색기 v${{ steps.ver.outputs.ver }}

            화면을 여러 칸으로 나눠 쓰는 탐색기 + 파일명·본문 내용 검색 (스마트공 시리즈, https://smartgong.kr)

            (바뀐 점은 여기에 적어 주세요 — 프로그램의 새 버전 알림 창에 그대로 보입니다)

            ---
            **파일 확인 (SHA-256)**
            `${{ steps.hash.outputs.sha }}`

            - PowerShell: `Get-FileHash SmartExplorer.exe` 결과가 위 값과 같아야 합니다.
            - 깃허브 CLI: `gh attestation verify SmartExplorer.exe --repo ${{ github.repository }}`

      # 파일을 모두 올린 뒤에 게시 → '변경 불가 릴리스'를 켜 둬도 문제없음
      - name: 릴리스 게시
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.ver.outputs.tag }}" --draft=false --repo "${{ github.repository }}"

      # 홈페이지 고정 주소(smartgong.kr/download/smart-explorer)가 새 버전을 가리키게 vercel.json 고치기
      - name: 홈페이지 내려받기 주소 갱신
        if: steps.ver.outputs.skip != 'true'
        working-directory: .
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import json, os
          tag = os.environ["TAG"]
          base = "https://github.com/nunco-git/ezgong/releases"
          with open("vercel.json", encoding="utf-8") as f:
              d = json.load(f)
          red = [r for r in d.get("redirects", []) if not r.get("source", "").startswith("/download/smart-explorer")]
          red += [
              {"source": "/download/smart-explorer", "destination": f"{base}/download/{tag}/SmartExplorer.exe", "permanent": False},
              {"source": "/download/smart-explorer/info", "destination": f"{base}/tag/{tag}", "permanent": False},
          ]
          d["redirects"] = red
          with open("vercel.json", "w", encoding="utf-8") as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git add vercel.json
          if git diff --cached --quiet; then echo "이미 최신 주소"; exit 0; fi
          git commit -m "스마트탐색기 내려받기 주소를 $TAG 로 갱신"
          git push origin main

