# 스마트탐색기 배포: 태그 smartexplorer-v1.2.3 을 올리면
# 깃허브 서버(윈도우)에서 빌드 → SHA-256 기록 → 빌드 출처 증명 → 릴리스 게시
# (프로그램 파일은 저장소의 smart-explorer/ 폴더에 있음)
name: smart-explorer-release

on:
  push:
    tags: ["smartexplorer-v*"]

permissions:
  contents: write        # 릴리스 만들기
  id-token: write        # 빌드 출처 증명(attestation) 서명
  attestations: write

defaults:
  run:
    shell: pwsh
    working-directory: smart-explorer

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-lock.txt) { pip install -r requirements-lock.txt }
          else { pip install -r requirements-build.txt }

      - name: 태그와 코드 버전 확인 + 버전 정보 파일
        run: python tools/make_version_file.py --check "${{ github.ref_name }}"

      - name: exe 만들기
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name SmartExplorer `
            --icon smart_explorer.ico --version-file version_info.txt `
            --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all winrt `
            --collect-submodules comtypes --hidden-import pystray._win32 `
            --exclude-module numpy --exclude-module pandas --exclude-module matplotlib --exclude-module scipy `
            --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide6 --exclude-module IPython `
            --exclude-module pytest --exclude-module pydoc_data `
            smart_explorer.py

      # (선택) 코드 서명 인증서가 생기면 여기에 서명 단계를 넣으세요. 서명은 해시 계산 전에 해야 합니다.

      - name: SHA-256 계산
        id: hash
        run: |
          $h = (Get-FileHash dist/SmartExplorer.exe -Algorithm SHA256).Hash.ToLower()
          "$h  SmartExplorer.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          "sha=$h" >> $env:GITHUB_OUTPUT

      - name: 빌드 출처 증명
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: smart-explorer/dist/SmartExplorer.exe

      - name: 릴리스 만들기 (초안)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: 스마트탐색기 ${{ github.ref_name }}
          files: |
            smart-explorer/dist/SmartExplorer.exe
            smart-explorer/dist/SHA256SUMS.txt
          body: |
            ## 스마트탐색기 ${{ github.ref_name }}

            (여기에 바뀐 점을 적어 주세요 — 프로그램의 새 버전 알림 창에 그대로 보입니다)

            ---
            **파일 확인 (SHA-256)**
            `${{ steps.hash.outputs.sha }}`

            - PowerShell: `Get-FileHash SmartExplorer.exe` 결과가 위 값과 같아야 합니다.
            - 깃허브 CLI: `gh attestation verify SmartExplorer.exe --repo ${{ github.repository }}`

      # 파일을 모두 올린 뒤에 게시 → '변경 불가 릴리스'를 켜 둬도 문제없음
      - name: 릴리스 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
