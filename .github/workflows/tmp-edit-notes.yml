name: tmp-edit-notes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=smartclipboard-v1.1.0
          gh release view $T --repo ${{ github.repository }} --json body -q .body > body.md
          python3 - <<'PY'
          s = open("body.md", encoding="utf-8").read()
          new = ("### 1.1.0 에서 바뀐 점\n"
                 "- **✎ 메모 바로 추가 (Ctrl+N):** 복사하지 않고 바로 적어 두는 메모. ★ 고정 목록 맨 위에 들어가 기록 개수 제한으로 지워지지 않고, Enter로 바로 붙여넣을 수 있습니다.\n"
                 "- **🔒 가리기 (Ctrl+H):** 비밀번호처럼 남에게 보이면 안 되는 항목은 목록·미리보기에 ●●●●●●로 표시됩니다. 제목을 붙이면 제목만 보이고, 찾기도 제목으로만 됩니다. 붙여넣기는 그대로 됩니다.\n"
                 "- 미리보기의 **👁 잠깐 보기**로 내용을 확인할 수 있고, 다른 항목을 고르면 다시 가려집니다.\n"
                 "- 메모 고치기: 오른쪽 클릭 → 메모 고치기 (Ctrl+E)\n"
                 "- 모든 내용은 Windows DPAPI로 암호화되어 이 PC·이 Windows 계정에서만 풀립니다.")
          old = "(바뀐 점은 여기에 적어 주세요)"
          s = s.replace(old, new) if old in s else new + "\n\n" + s
          open("body.md", "w", encoding="utf-8").write(s)
          PY
          gh release edit $T --repo ${{ github.repository }} --notes-file body.md
