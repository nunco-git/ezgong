name: tmp-edit-notes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess, os
          repo = os.environ["GITHUB_REPOSITORY"]
          old = "(바뀐 점은 여기에 적어 주세요 — 프로그램의 새 버전 알림 창에 그대로 보입니다)"
          notes = {
            "smartexplorer-v1.0.12": ("### 1.0.12 에서 바뀐 점\n"
                 "- **새 버전 알림이 더 빨리** — 켤 때마다, 그리고 트레이에서 창을 불러올 때 새 버전을 확인합니다 (예전에는 12시간에 한 번). 켜 둔 동안에도 3시간마다 확인합니다.\n\n"
                 "### 1.0.11\n- 암호 걸린 PDF·엑셀·워드·PPT 암호 입력 후 미리보기"),
            "smartclipboard-v1.1.5": ("### 1.1.5 에서 바뀐 점\n"
                 "- **새 버전 알림이 더 빨리** — 켤 때마다 새 버전을 확인하고, 켜 둔 동안에도 3시간마다 확인합니다 (예전에는 12시간에 한 번)."),
          }
          for tag, new in notes.items():
              body = subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "body", "-q", ".body"], text=True)
              body = body.replace(old, new) if old in body else new + "\n\n" + body
              open("b.md", "w", encoding="utf-8").write(body)
              subprocess.check_call(["gh", "release", "edit", tag, "--repo", repo, "--notes-file", "b.md"])
          PY
