name: tmp-edit-notes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess, os
          repo = os.environ["GITHUB_REPOSITORY"]; tag = "smartexplorer-v1.0.7"
          old = "(바뀐 점은 여기에 적어 주세요 — 프로그램의 새 버전 알림 창에 그대로 보입니다)"
          new = ("### 1.0.7 에서 바뀐 점\n"
                 "- **기본 단축키 Ctrl+Shift+E** — 어디서든 누르면 스마트탐색기가 바로 나옵니다 (예전 기본값 Ctrl+Alt+E를 쓰던 경우 자동으로 바뀜, 직접 바꾼 단축키는 그대로). 사용 안내 맨 위에 표시\n"
                 "- **늘 전체 화면으로 열기** — 처음 켤 때, 트레이·단축키로 불러올 때 모두 전체 화면 (창이 틀어진 위치에 뜨던 문제 해결)\n"
                 "- **환경설정 맨 위 「📌 바로가기」** — 바탕화면 바로가기 만들기, 작업표시줄 고정 안내. 만들고 나면 버튼이 사라집니다.\n"
                 "- 바로가기를 만들 때 PowerShell을 쓰지 않게 바꿔 기관 PC에서도 잘 만들어집니다.\n\n"
                 "### 1.0.6 · 1.0.5\n- 칸이 1개일 때 미리보기를 오른쪽에, 윈도우 탐색기와 끌어다 놓기·Windows 오른쪽 클릭 메뉴")
          body = subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "body", "-q", ".body"], text=True)
          body = body.replace(old, new) if old in body else new + "\n\n" + body
          open("b.md", "w", encoding="utf-8").write(body)
          subprocess.check_call(["gh", "release", "edit", tag, "--repo", repo, "--notes-file", "b.md"])
          PY
