name: tmp-edit-notes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess, os
          repo = os.environ["GITHUB_REPOSITORY"]; tag = "smartexplorer-v1.0.9"
          old = "(바뀐 점은 여기에 적어 주세요 — 프로그램의 새 버전 알림 창에 그대로 보입니다)"
          new = ("### 1.0.9 에서 바뀐 점\n"
                 "- **검색 버튼을 두 개로** — [🔍 파일명 검색]은 파일·폴더 이름만 아주 빠르게, [📄 본문 추가 검색]은 문서 안 내용까지 찾습니다. Enter는 마지막에 누른 버튼으로 검색합니다.\n"
                 "- **스캔 PDF·그림 글자까지 미리 색인** — 쉬는 동안 본문을 먼저 모두 읽어 두고, 이어서 스캔 PDF·그림의 글자를 인식해 둡니다. 검색할 때 기다리지 않습니다.\n\n"
                 "### 1.0.8\n- 색인된 폴더 검색 속도 개선 (공유폴더 약 7~8배)")
          body = subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "body", "-q", ".body"], text=True)
          body = body.replace(old, new) if old in body else new + "\n\n" + body
          open("b.md", "w", encoding="utf-8").write(body)
          subprocess.check_call(["gh", "release", "edit", tag, "--repo", repo, "--notes-file", "b.md"])
          PY
