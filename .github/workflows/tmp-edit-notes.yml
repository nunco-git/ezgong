name: tmp-edit-notes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess, os
          repo = os.environ["GITHUB_REPOSITORY"]
          notes = {
            "smartexplorer-v1.0.3": ("(바뀐 점은 여기에 적어 주세요 — 프로그램의 새 버전 알림 창에 그대로 보입니다)",
              "### 1.0.3 에서 바뀐 점\n- 사용 안내 맨 위에 오류·개선 제안 메일 주소 안내 (**smartgongmaster@gmail.com**, 누르면 주소 복사)\n\n"
              "### 1.0.2 에서 바뀐 점\n- 알람 설정 창에서 「지금 시험해 보기」 알람 창이 확인·X로 닫히지 않던 문제 수정 (Esc·Enter로도 닫힘)\n\n"
              "### 1.0.1 에서 바뀐 점\n- 스마트 일정 알라미가 켜져 있으면 실행되지 않던 문제 수정"),
            "smartclipboard-v1.1.3": ("(바뀐 점은 여기에 적어 주세요)",
              "### 1.1.3 에서 바뀐 점\n- 설정 창 맨 위에 오류·개선 제안 메일 주소 안내 (**smartgongmaster@gmail.com**, 누르면 주소 복사)\n\n"
              "### 1.1.2 에서 바뀐 점\n- 메모 추가 ＋ 아이콘 · 가리기 PW 아이콘을 목록 '내용' 옆으로, 좁은 창에서도 고정·항상 위·창 유지·설정 버튼이 보이게\n\n"
              "### 1.1.1 에서 바뀐 점\n- 가린 항목 비밀번호 (설정 → 비밀번호)\n\n"
              "### 1.1.0 에서 바뀐 점\n- 메모 바로 추가(Ctrl+N), 가리기(Ctrl+H)"),
          }
          for tag, (old, new) in notes.items():
              body = subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "body", "-q", ".body"], text=True)
              body = body.replace(old, new) if old in body else new + "\n\n" + body
              open("b.md", "w", encoding="utf-8").write(body)
              subprocess.check_call(["gh", "release", "edit", tag, "--repo", repo, "--notes-file", "b.md"])
          PY
