name: tmp-edit-notes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess, os
          repo = os.environ["GITHUB_REPOSITORY"]; tag = "smartexplorer-v1.0.11"
          old = "(바뀐 점은 여기에 적어 주세요 — 프로그램의 새 버전 알림 창에 그대로 보입니다)"
          new = ("### 1.0.11 에서 바뀐 점\n"
                 "- **암호 걸린 파일 미리보기** — 암호가 걸린 PDF·엑셀·워드·파워포인트 파일은 미리보기 칸에 암호 입력칸이 나옵니다. 암호를 넣으면 바로 미리 볼 수 있습니다.\n"
                 "- 입력한 암호는 프로그램을 끌 때까지만 기억하고 저장하지 않습니다. 미리보기용으로 푼 임시 파일은 다른 파일을 고르면 바로 지웁니다.\n"
                 "- 한글(HWP·HWPX) 암호 문서는 암호 방식이 공개되어 있지 않아 미리보기를 할 수 없습니다 (더블클릭하면 한글 프로그램에서 열림).\n\n"
                 "### 1.0.10\n- 한국어 OCR 설치 안내 창, 이름 바꾸기 한글 입력 자연스럽게")
          body = subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "body", "-q", ".body"], text=True)
          body = body.replace(old, new) if old in body else new + "\n\n" + body
          open("b.md", "w", encoding="utf-8").write(body)
          subprocess.check_call(["gh", "release", "edit", tag, "--repo", repo, "--notes-file", "b.md"])
          PY
