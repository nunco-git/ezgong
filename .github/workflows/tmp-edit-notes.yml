name: tmp-edit-notes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=smartexplorer-v1.0.0
          gh release view $T --repo ${{ github.repository }} --json body -q .body > body.md
          if grep -q "광고가 표시될 수" body.md; then echo already; exit 0; fi
          python3 - <<'PY'
          s = open("body.md", encoding="utf-8").read()
          note = ("> **무료 프로그램입니다.** 창 오른쪽이나 왼쪽 하단에 광고가 표시될 수 있습니다.\n"
                  "> 설치 없이 실행하는 프로그램이라, 지우려면 **`SmartExplorer.exe` 파일을 삭제**하면 됩니다. "
                  "(설정은 `%LOCALAPPDATA%\\SmartExplorer` 폴더에 있으며 함께 지워도 됩니다)\n\n")
          key = "### ⚠ 처음 실행할 때"
          s = s.replace(key, note + key, 1) if key in s else note + s
          open("body.md", "w", encoding="utf-8").write(s)
          PY
          gh release edit $T --repo ${{ github.repository }} --notes-file body.md
          gh release view $T --repo ${{ github.repository }} --json body -q .body | grep "광고가 표시될 수"
