name: tmp-edit-notes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess, os
          repo = os.environ["GITHUB_REPOSITORY"]; tag = "smartexplorer-v1.0.14"
          old = "(바뀐 점은 여기에 적어 주세요 — 프로그램의 새 버전 알림 창에 그대로 보입니다)"
          new = ("### 1.0.14 에서 바뀐 점\n"
                 "- **배경 그림 빠른 선택** — 환경설정 '빠른 선택'에서 하늘·노을·숲·바다·밤하늘·종이 6가지 기본 배경 그림을 눌러 바로 고를 수 있습니다. [없음]을 누르면 배경 그림을 뺍니다.\n\n"
                 "### 1.0.13\n- 폴더를 열면 늘 최신 파일부터, 회사·기관 인터넷에서도 새 버전 확인")
          body = subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "body", "-q", ".body"], text=True)
          body = body.replace(old, new) if old in body else new + "\n\n" + body
          open("b.md", "w", encoding="utf-8").write(body)
          subprocess.check_call(["gh", "release", "edit", tag, "--repo", repo, "--notes-file", "b.md"])
          PY
