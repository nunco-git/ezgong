name: tmp-edit-notes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess, os
          repo = os.environ["GITHUB_REPOSITORY"]
          notes = {
            "smartexplorer-v1.0.4": ("(바뀐 점은 여기에 적어 주세요 — 프로그램의 새 버전 알림 창에 그대로 보입니다)",
              "### 1.0.4 에서 바뀐 점\n- **폴더 숨기기:** 칸 위쪽 [폴더…] 옆 **📁 숨기기** 버튼 — 누르면 목록에서 폴더를 숨기고 파일만, 다시 누르면 폴더 보이기 (칸마다 따로 기억)\n"
              "- **업데이트 필요 버튼:** 새 버전이 나오면 위쪽 색인 표시 옆에 주황색 **[업데이트 필요]** 버튼이 나타납니다. 누르면 바뀐 점을 보고 바로 내려받기\n\n"
              "### 1.0.3 에서 바뀐 점\n- 사용 안내 맨 위에 오류·개선 제안 메일 주소 안내 (smartgongmaster@gmail.com)\n\n"
              "### 1.0.2 에서 바뀐 점\n- 알람 시험 창이 확인·X로 닫히지 않던 문제 수정\n\n"
              "### 1.0.1 에서 바뀐 점\n- 스마트 일정 알라미가 켜져 있으면 실행되지 않던 문제 수정"),
            "smartclipboard-v1.1.4": ("(바뀐 점은 여기에 적어 주세요)",
              "### 1.1.4 에서 바뀐 점\n- **업데이트 필요 표시:** 새 버전이 나오면 창 아래 왼쪽에 주황색 **[업데이트 필요]** 가 나타납니다. 누르면 바로 내려받기\n"
              "- 새 버전 확인은 하루 두 번 깃허브에 최신 버전 번호만 물어봅니다. 설정 → 기록 → '새 버전 확인'을 끄면 인터넷을 전혀 쓰지 않습니다.\n\n"
              "### 1.1.3 에서 바뀐 점\n- 설정 창 맨 위에 오류·개선 제안 메일 주소 안내\n\n"
              "### 1.1.2 에서 바뀐 점\n- 메모 추가 ＋ · 가리기 PW 아이콘을 목록 '내용' 옆으로\n\n"
              "### 1.1.1 · 1.1.0\n- 가린 항목 비밀번호, 메모 바로 추가(Ctrl+N), 가리기(Ctrl+H)"),
          }
          for tag, (old, new) in notes.items():
              body = subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "body", "-q", ".body"], text=True)
              body = body.replace(old, new) if old in body else new + "\n\n" + body
              open("b.md", "w", encoding="utf-8").write(body)
              subprocess.check_call(["gh", "release", "edit", tag, "--repo", repo, "--notes-file", "b.md"])
          PY
