name: tmp-edit-notes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess, os
          repo = os.environ["GITHUB_REPOSITORY"]
          old = "(바뀐 점은 여기에 적어 주세요 — 프로그램의 새 버전 알림 창에 그대로 보입니다)"
          notes = {
            "smartexplorer-v1.0.13": ("### 1.0.13 에서 바뀐 점\n"
                 "- **폴더를 열면 늘 최신 파일부터** — 다른 폴더로 가면 수정한 날짜 최신순으로 보이고, 목록은 맨 위부터 보입니다 (폴더는 위쪽). 제목을 눌러 바꾼 정렬은 그 폴더에 있는 동안 유지됩니다.\n"
                 "- **회사·기관 인터넷에서도 새 버전 확인** — 'urlopen error'로 확인이 안 되던 경우, 윈도우 인터넷 설정(엣지와 같은 방식: 프록시·보안 인증서)으로 다시 시도합니다. 그래도 안 되면 원인을 알기 쉽게 보여 줍니다.\n\n"
                 "### 1.0.12\n- 켤 때마다 새 버전 확인"),
            "smartclipboard-v1.1.6": ("### 1.1.6 에서 바뀐 점\n"
                 "- **회사·기관 인터넷에서도 새 버전 확인** — 프록시나 보안 프로그램 때문에 연결이 안 되면 윈도우 인터넷 설정(엣지와 같은 방식)으로 다시 시도합니다."),
          }
          for tag, new in notes.items():
              body = subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "body", "-q", ".body"], text=True)
              body = body.replace(old, new) if old in body else new + "\n\n" + body
              open("b.md", "w", encoding="utf-8").write(body)
              subprocess.check_call(["gh", "release", "edit", tag, "--repo", repo, "--notes-file", "b.md"])
          PY
