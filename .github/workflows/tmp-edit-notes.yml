name: tmp-edit-notes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess, os
          repo = os.environ["GITHUB_REPOSITORY"]; tag = "smartexplorer-v1.0.8"
          old = "(바뀐 점은 여기에 적어 주세요 — 프로그램의 새 버전 알림 창에 그대로 보입니다)"
          new = ("### 1.0.8 에서 바뀐 점\n"
                 "- **검색 속도 개선** — 색인이 끝난 폴더에서 검색이 훨씬 빨라졌습니다. 특히 공유폴더(네트워크 드라이브)에서는 약 7~8배 빨라집니다 (6천 개 파일 기준 6.5초 → 0.8초).\n"
                 "- 백그라운드 색인 작업도 같은 방식으로 가벼워졌습니다.\n\n"
                 "### 1.0.7\n- 기본 단축키 Ctrl+Shift+E, 늘 전체 화면, 환경설정 「📌 바로가기」")
          body = subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "body", "-q", ".body"], text=True)
          body = body.replace(old, new) if old in body else new + "\n\n" + body
          open("b.md", "w", encoding="utf-8").write(body)
          subprocess.check_call(["gh", "release", "edit", tag, "--repo", repo, "--notes-file", "b.md"])
          PY
