name: tmp-dnd
on:
  push:
    branches: [test-dnd]
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pywin32
      - env: { PYTHONIOENCODING: utf-8 }
        run: python tmpt/probe.py
