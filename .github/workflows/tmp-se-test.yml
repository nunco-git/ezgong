name: tmp-se-test
on:
  push:
    branches: [test-se]
jobs:
  t:
    runs-on: windows-latest
    defaults: { run: { shell: pwsh, working-directory: smart-explorer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-build.txt
      - run: |
          @'
          import socket, subprocess, sys, time
          def run():
              return subprocess.Popen([sys.executable, "smart_explorer.py"])
          def alive_after(p, sec):
              time.sleep(sec); return p.poll() is None
          ok = True
          # 1) 스마트 일정 알라미가 47653을 쓰고 있을 때
          alarm = socket.socket(); alarm.bind(("127.0.0.1", 47653)); alarm.listen(5)
          a = run(); r = alive_after(a, 12); print("1) 알라미 켜진 상태에서 실행:", "OK" if r else "FAIL"); ok &= r
          # 2) 이미 켜져 있을 때 두 번째 실행은 바로 끝나야 함
          b = run(); t0 = time.time(); b.wait(timeout=20); dt = time.time() - t0
          r = dt < 15 and a.poll() is None; print(f"2) 두 번째 실행은 {dt:.1f}초 만에 끝남, 첫 번째는 그대로:", "OK" if r else "FAIL"); ok &= r
          a.kill(); a.wait(); time.sleep(1)
          # 3) 다른 프로그램이 48631을 쓰는데 대답하지 않을 때도 실행돼야 함
          other = socket.socket(); other.bind(("127.0.0.1", 48631)); other.listen(5)
          c = run(); r = alive_after(c, 15); print("3) 다른 프로그램이 같은 번호를 쓸 때도 실행:", "OK" if r else "FAIL"); ok &= r
          c.kill()
          sys.exit(0 if ok else 1)
          '@ | Set-Content t.py -Encoding utf8
          $env:PYTHONIOENCODING="utf-8"; python t.py
