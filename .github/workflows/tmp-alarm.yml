name: tmp-alarm
on:
  push:
    branches: [test-alarm]
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r smart-explorer/requirements-build.txt
      - env: { PYTHONIOENCODING: utf-8 }
        run: |
          python tmpt/t.py old_se
          python tmpt/t.py smart_explorer
