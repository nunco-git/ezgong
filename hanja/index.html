function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function startQ(){const S=QS;QZ={q:sh(S.pool).slice(0,10),i:0,ok:0,mode:S.mode,ans:null};drawQ()}
function distract(c,n){const o=M[c];const near=new Set;[...phG,...radG,...lkG].forEach(g=>{if(g.mem.includes(c))g.mem.forEach(x=>x!==c&&near.add(x))});
 let a=sh([...near]);const rest=sh(D.map(x=>x.h).filter(x=>x!==c&&!near.has(x)&&M[x].l<=Math.min(10,o.l+1)));
 const out=[];const seen=new Set([QZ.mode==='h2s'?o.r[0][1]:hu(o)]);
 for(const x of a.concat(rest)){const k=QZ.mode==='h2s'?M[x].r[0][1]:hu(M[x]);if(QZ.mode==='m2h'){if(!out.includes(x))out.push(x)}else if(!seen.has(k)){seen.add(k);out.push(x)}if(out.length>=n)break}
 return out}
function drawQ(){const z=QZ;if(z.i>=z.q.length){const pct=z.ok/z.q.length;$('#view').innerHTML=`<div class="card q"><div class="qt">${pct>=.8?'🎉':'💪'}</div><div class="qs">${z.ok} / ${z.q.length} 정답</div><p class="note">${W.size?`헷갈려요 목록에 ${W.size}자가 있어요.`:'틀린 글자가 없어요!'}</p><div class="row" style="justify-content:center"><button class="btn" id="ag">같은 범위 다시</button><button class="btn s" id="bk2">처음으로</button></div></div>`;
  $('#ag').onclick=startQ;$('#bk2').onclick=()=>{QZ=null;vQuiz()};return}
 const c=z.q[z.i],o=M[c],m=z.mode;let opts,corr;
 if(m==='m2h'){opts=sh([c,...distract(c,3)]);corr=c}else{const f=x=>m==='h2s'?M[x].r[0][1]:hu(M[x]);corr=f(c);opts=sh([corr,...distract(c,3).map(f)])}
 $('#view').innerHTML=`<div class="stat"><span>${z.i+1} / ${z.q.length}</span><span>정답 ${z.ok}</span></div><div class="prog"><i style="width:${z.i/z.q.length*100}%"></i></div>
 <div class="card q">${m==='m2h'?`<div class="qs">${esc(o.r.map(r=>r[0]+' '+r[1]).join(' / '))}</div><p class="note">알맞은 한자를 고르세요</p>`:`<div class="qt hj" lang="ko">${c}</div><p class="note">${m==='h2s'?'이 한자의 음은?':'이 한자의 훈음은?'}</p>`}
 <div class="opts ${m==='m2h'?'h':''}" id="op">${opts.map(x=>`<button data-v="${esc(x)}" lang="ko">${esc(x)}</button>`).join('')}</div><div id="fb"></div></div>`;
 $('#op').onclick=e=>{const b=e.target.closest('button');if(!b||z.ans!==null)return;const v=b.dataset.v,good=m==='m2h'?v===c:(m==='h2s'?o.r.some(r=>r[1]===v):o.r.some(r=>r[0]+' '+r[1]===v));z.ans=v;
  document.querySelectorAll('#op button').forEach(x=>{const xv=x.dataset.v;const g=m==='m2h'?xv===c:(m==='h2s'?o.r.some(r=>r[1]===xv):o.r.some(r=>r[0]+' '+r[1]===xv));if(g)x.classList.add('good');else if(x===b)x.classList.add('bad')});
  if(good){z.ok++;if(W.has(c)&&false)W.delete(c)}else W.add(c);sv();
  $('#fb').innerHTML=`<div style="margin-top:10px">${good?'정답!':'아쉬워요 → <b class="hj" lang="ko">'+c+'</b> '+esc(hu(o))}</div><div class="row" style="justify-content:center;margin-top:8px"><button class="btn s" id="dt">자세히</button><button class="btn" id="nq">다음</button></div>`;
  $('#dt').onclick=()=>openCard(c,[c]);$('#nq').onclick=()=>{z.i++;z.ans=null;drawQ()}}}

function vWhy(){const ex=(a)=>a.filter(c=>M[c]).map(c=>`<button class="hj" data-h="${c}" lang="ko">${c}</button>`).join('');
 $('#view').innerHTML=`<p class="note">한자는 만든 방법이 여섯 가지예요(육서). 이 중 <b>형성</b>이 약 3분의 2라서, 원리만 알면 처음 보는 글자도 읽을 수 있어요.</p><div class="six">
 <div class="card"><h3>① 형성 — 뜻 + 소리 (가장 많아요)</h3>한 조각은 <b>뜻</b>, 다른 조각은 <b>소리</b>를 알려줘요.<div class="fm" style="margin:8px 0"><span class="hj">氵<small>물</small></span><i>뜻 +</i><span class="hj">可<small>가</small></span><i>소리 =</i><span class="hj" style="color:var(--seal)">河<small>물 하</small></span></div>물(氵) 이름인데 소리는 可(가)를 닮아 ‘하’. <b>소리 조각</b>을 알면 읽기 쉬워요 → 〔가족 묶음〕탭<div class="ex">${ex(['江','河','校','時','請'])}</div></div>
 <div class="card"><h3>② 회의 — 뜻 + 뜻</h3>두 글자의 뜻을 합쳐 새 뜻을 만들어요.<div class="fm" style="margin:8px 0"><span class="hj">人<small>사람</small></span><i>+</i><span class="hj">木<small>나무</small></span><i>=</i><span class="hj" style="color:var(--seal)">休<small>쉴 휴</small></span></div>사람이 나무에 기대어 쉬어요.<div class="ex">${ex(['休','明','林','好','信'])}</div></div>
 <div class="card"><h3>③ 상형 — 모양 본뜨기</h3>눈에 보이는 물건의 모양을 그대로 그렸어요.<div class="ex">${ex(['日','月','山','木','人','水','火','門'])}</div></div>
 <div class="card"><h3>④ 지사 — 점·선으로 가리키기</h3>눈에 안 보이는 생각(위·아래·숫자)을 점과 선으로 나타내요. 기준선 위에 점이면 上, 아래에 점이면 下, 나무 뿌리에 점이면 本.<div class="ex">${ex(['一','二','三','上','下','本','末'])}</div></div>
 <div class="card"><h3>⑤ 전주 — 뜻을 넓혀 쓰기</h3>글자의 뜻이 번져서 다른 뜻·다른 음으로도 써요. 例) 樂: 풍류 악 → 즐길 락 → 좋아할 요 / 惡: 악할 악 → 미워할 오<div class="ex">${ex(['樂','惡','長','行'])}</div></div>
 <div class="card"><h3>⑥ 가차 — 소리만 빌려 쓰기</h3>뜻과 상관없이 소리나 모양만 빌려요. 例) 來(본래 보리 → ‘오다’), 萬(본래 전갈 → ‘일만’), 六·七·九도 숫자를 빌린 글자예요.<div class="ex">${ex(['來','萬','六','七','九'])}</div></div>
 <div class="card"><h3>읽는 요령</h3>① 부수(뜻 조각) 찾기 → ② 나머지 조각(소리 조각)으로 음 짐작 → ③ 〔가족 묶음〕으로 한꺼번에 외우기. 그리고 중국어 간체자는 글자 오른쪽 위에 파란색으로 함께 나와요.</div></div>`;
