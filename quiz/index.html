<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}
.sg-back{display:block;max-width:620px;margin:0 auto 10px;font-size:13px;color:var(--muted);text-decoration:none}.sg-back:hover{color:var(--accent)}</style>
<title>상식 학력 진단 - 스마트공</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 한 장짜리 '학력 진단 통지표' — 좁은 종이 한 장, 결과는 붉은 판정 도장으로 */
:root{
  --paper:#eef1ec; --sheet:#fbfcfa; --ink:#1d2621; --muted:#5d6a62; --line:#cdd6cd;
  --accent:#2f6b4f; --accent-ink:#ffffff; --stamp:#c23a2b; --good:#2f7d4f; --bad:#b8402f;
  --good-bg:#e3f1e7; --bad-bg:#f7e4e0;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121815; --sheet:#1a221e; --ink:#e3eae5; --muted:#9aa89f; --line:#2f3b35;
  --accent:#6fbf96; --accent-ink:#0f1a14; --stamp:#e8705f; --good:#7fd0a0; --bad:#f08a7a;
  --good-bg:#1f3428; --bad-bg:#3a2320; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121815; --sheet:#1a221e; --ink:#e3eae5; --muted:#9aa89f; --line:#2f3b35;
  --accent:#6fbf96; --accent-ink:#0f1a14; --stamp:#e8705f; --good:#7fd0a0; --bad:#f08a7a;
  --good-bg:#1f3428; --bad-bg:#3a2320; color-scheme:dark}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.sheet{max-width:620px;margin:0 auto;background:var(--sheet);border:1px solid var(--line);border-radius:6px;
  padding:22px 20px 26px;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px;background-position:0 -1px;
  background-blend-mode:normal}
.sheet>*{position:relative}
.form-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:18px;background:var(--sheet)}
.form-head b{font-family:var(--f-display);font-size:17px;letter-spacing:.08em}
.form-head span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.blk{background:var(--sheet)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,7vw,36px);line-height:1.3;margin:6px 0 10px;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
p.lead{color:var(--muted);margin:0 0 20px;max-width:60ch}
.btn{font:inherit;font-weight:700;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:4px;padding:12px 16px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);width:100%;font-size:16px;padding:15px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:17px;margin:28px 0 10px;display:flex;gap:8px;align-items:baseline}
.sec-title small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.lv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lv-btn{text-align:left;display:flex;flex-direction:column;gap:2px}
.lv-btn em{font-style:normal;font-weight:400;font-size:12px;color:var(--muted)}
.rule{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 0 4px 10px;margin-top:18px}
.last{margin-top:14px;font-size:13px;color:var(--muted)}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--sheet)}
.chip.lv{border-color:var(--accent);color:var(--accent)}
.bar{display:flex;gap:3px;margin-bottom:20px}
.bar i{flex:1;height:5px;background:var(--line);border-radius:2px}
.bar i.done{background:var(--accent)}
.bar i.now{background:var(--stamp)}
.qtext{font-family:var(--f-display);font-size:clamp(19px,5vw,23px);font-weight:700;line-height:1.5;margin:0 0 18px;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .n{font-family:var(--f-display);font-weight:700;min-width:1.2em}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.exp{margin-top:16px;padding:12px 14px;border-radius:4px;border:1px dashed var(--line);font-size:14px}
.exp b{color:var(--good)} .exp b.x{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.nav .btn.primary{width:auto;flex:1}
/* result */
.res-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.stamp{width:132px;height:132px;flex:none;border:4px double var(--stamp);border-radius:50%;color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:rotate(-9deg);font-family:var(--f-display);font-weight:700;text-align:center;line-height:1.2;animation:press .45s cubic-bezier(.2,1.4,.4,1) both}
.stamp small{font-size:11px;letter-spacing:.2em}
.stamp strong{font-size:22px;margin:2px 0}
@keyframes press{from{transform:rotate(-9deg) scale(1.6);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
.res-text{flex:1;min-width:200px}
.res-text h2{font-family:var(--f-display);font-size:22px;margin:0 0 4px;text-wrap:balance}
.idx{font-family:var(--f-mono);font-size:30px;color:var(--accent)}
.idx small{font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--sheet)}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
th{font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.04em}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.pill.pass{background:var(--good-bg);color:var(--good)} .pill.fail{background:var(--bad-bg);color:var(--bad)}
.meter{height:8px;background:var(--line);border-radius:2px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--accent)}
.wrong{display:grid;gap:10px}
.wrong div{border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:14px;background:var(--sheet)}
.wrong .wq{font-weight:700;margin-bottom:4px}
.wrong .wa{color:var(--good)} .wrong .wm{color:var(--bad)}
.wrong .we{color:var(--muted);font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.actions .btn.primary{width:auto}
</style>

<style>
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.seg button:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field>span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.panel{border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--sheet)}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:14px}
.stats b{color:var(--ink);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.linkbtn{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.diag-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px}
.diag-choice .btn{display:flex;flex-direction:column;gap:2px;text-align:left}
.diag-choice .btn em{font-style:normal;font-weight:400;font-size:12px;opacity:.85}
.diag-choice .btn.primary{width:auto;font-size:15px;padding:12px 16px}
</style>

</head>

<script id="bank" type="application/json">[[1,"국어","‘길다’와 뜻이 반대인 낱말은?",["짧다","높다","좁다","가볍다"],"길이가 긴 것과 반대는 짧은 것입니다."],[1,"국어","‘넓다’와 뜻이 반대인 낱말은?",["좁다","얕다","작다","짧다"],"면적이 넓은 것과 반대는 좁은 것입니다."],[1,"국어","‘무겁다’와 뜻이 반대인 낱말은?",["가볍다","얇다","약하다","작다"],"무게가 많이 나가는 것과 반대는 가벼운 것입니다."],[1,"국어","‘이기다’와 뜻이 반대인 낱말은?",["지다","비기다","싸우다","놀다"],"경기에서 이기다의 반대는 지다입니다."],[1,"국어","‘밥’의 높임말은?",["진지","식사","끼니","반찬"],"웃어른의 밥은 ‘진지’라고 합니다."],[1,"국어","‘나이’의 높임말은?",["연세","생신","성함","댁"],"웃어른의 나이는 ‘연세’라고 합니다."],[1,"국어","‘이름’의 높임말은?",["성함","연세","말씀","존함"],"대부분 ‘성함’을 씁니다. 존함은 더 높인 말이지만 보기 중 기본 높임말은 성함입니다."],[1,"국어","‘집’의 높임말은?",["댁","방","가정","궁"],"웃어른의 집은 ‘댁’이라고 합니다."],[1,"국어","‘자다’의 높임말은?",["주무시다","드시다","계시다","여쭈다"],"웃어른이 자는 것은 ‘주무시다’라고 합니다."],[1,"국어","‘아프다’의 높임말은?",["편찮으시다","주무시다","돌아가시다","여쭙다"],"웃어른이 아플 때는 ‘편찮으시다’를 씁니다."],[1,"국어","‘생일’의 높임말은?",["생신","연세","진지","기일"],"웃어른의 생일은 ‘생신’이라고 합니다."],[1,"국어","‘있다’(사람이 머물다)의 높임말은?",["계시다","있으시다","드시다","주무시다"],"‘할머니께서 방에 계신다’처럼 씁니다."],[1,"국어","높임 표현이 바르게 쓰인 문장은?",["할아버지께서 진지를 드신다.","할아버지가 밥을 먹는다.","할아버지께서 밥을 먹는다.","할아버지가 진지를 먹는다."],"주체를 높이는 ‘께서’, 높임말 ‘진지’, ‘드신다’를 함께 씁니다."],[1,"국어","맞춤법이 바른 것은?",["며칠","몇일","몇 일","며칟"],"‘며칠’이 표준어입니다."],[1,"국어","맞춤법이 바른 것은?",["금세","금새","금쎄","끔세"],"‘금시에’가 줄어든 말이라 ‘금세’입니다."],[1,"국어","맞춤법이 바른 것은?",["설거지","설겆이","설걷이","설거쥐"],"‘설거지’가 표준어입니다."],[1,"국어","맞춤법이 바른 것은?",["깨끗이","깨끗히","깨끋이","깨끄시"],"‘깨끗하다’처럼 ㅅ 받침 뒤에서는 ‘-이’를 씁니다."],[1,"국어","맞춤법이 바른 것은?",["굳이","구지","궂이","굿이"],"‘굳이’로 쓰고 [구지]로 읽습니다."],[1,"국어","맞춤법이 바른 것은?",["내일 갈게.","내일 갈께.","내일 갈깨.","내일 갈걔."],"‘-ㄹ게’는 소리가 [께]여도 ‘게’로 적습니다."],[1,"국어","맞춤법이 바른 것은?",["오랜만이야.","오랫만이야.","오랜마니야.","오랫마니야."],"‘오래간만’의 준말이라 ‘오랜만’입니다."],[1,"국어","맞춤법이 바른 것은?",["역할","역활","역하","역할을"],"‘역할(役割)’이 맞는 표기입니다."],[1,"국어","맞춤법이 바른 것은?",["베개","배개","베게","배게"],"머리에 베는 물건은 ‘베개’입니다."],[1,"국어","맞춤법이 바른 것은?",["김치찌개","김치찌게","김치지개","김치찌계"],"‘찌개’가 바른 표기입니다."],[1,"국어","맞춤법이 바른 것은?",["어떡해","어떻해","어떠캐","어떡케"],"‘어떻게 해’가 줄어든 말이라 ‘어떡해’입니다."],[1,"국어","맞춤법이 바른 것은?",["왠지 기분이 좋다.","웬지 기분이 좋다.","왠지 기분이 좃다.","웬찌 기분이 좋다."],"‘왜인지’가 줄어든 말이라 ‘왠지’입니다."],[1,"국어","맞춤법이 바른 것은?",["웬일이니?","왠일이니?","웬닐이니?","왠닐이니?"],"‘어찌 된 일’이라는 뜻은 ‘웬일’입니다."],[1,"국어","맞춤법이 바른 것은?",["숙제를 안 했다.","숙제를 않 했다.","숙제를 않했다.","숙제를 앉 했다."],"‘안’은 ‘아니’의 준말로 동사 앞에 씁니다."],[1,"국어","맞춤법이 바른 것은?",["감기가 다 나았다.","감기가 다 낳았다.","감기가 다 낫았다.","감기가 다 났았다."],"병이 좋아지는 것은 ‘낫다’이고 과거형은 ‘나았다’입니다."],[1,"국어","‘사흘’은 며칠을 뜻하는가?",["3일","4일","2일","10일"],"하루, 이틀, 사흘(3일), 나흘(4일)입니다."],[1,"국어","‘나흘’은 며칠을 뜻하는가?",["4일","3일","5일","6일"],"사흘 다음이 나흘(4일)입니다."],[1,"국어","‘열흘’은 며칠을 뜻하는가?",["10일","7일","8일","15일"],"열흘은 10일입니다."],[1,"국어","‘모레’는 언제인가?",["내일의 다음 날","어제의 전날","오늘","일주일 뒤"],"어제의 전날은 ‘그저께’입니다."],[1,"국어","‘그저께’는 언제인가?",["어제의 전날","내일의 다음 날","지난주","오늘 아침"],"그저께는 이틀 전입니다."],[1,"국어","소리를 흉내 내는 말은?",["멍멍","살금살금","반짝반짝","엉금엉금"],"소리를 흉내 내는 말은 의성어, 모양을 흉내 내는 말은 의태어입니다."],[1,"국어","모양이나 움직임을 흉내 내는 말은?",["아장아장","꼬끼오","딩동","쨍그랑"],"‘아장아장’은 걸음 모양을 흉내 냅니다."],[1,"국어","시에서 한 줄 한 줄을 무엇이라 하는가?",["행","연","절","장"],"여러 행을 묶은 덩어리는 ‘연’입니다."],[1,"국어","시에서 여러 행을 묶은 덩어리를 무엇이라 하는가?",["연","행","문단","편"],"시의 한 덩어리를 연이라고 합니다."],[1,"국어","주장과 그에 대한 근거를 들어 쓴 글은?",["논설문","일기","동시","기행문"],"논설문은 읽는 사람을 설득하려는 글입니다."],[1,"국어","여행하며 보고 듣고 느낀 것을 쓴 글은?",["기행문","설명문","논설문","광고문"],"여정·견문·감상이 기행문의 요소입니다."],[1,"국어","‘가는 말이 고와야 오는 말이 곱다’의 뜻으로 알맞은 것은?",["내가 남에게 잘해야 남도 나에게 잘한다.","말을 빨리 해야 한다.","먼 곳에 가면 말이 바뀐다.","말은 적게 할수록 좋다."],"말과 행동을 곱게 하라는 속담입니다."],[1,"국어","일이 잘못된 뒤에 손을 써도 소용없다는 속담은?",["소 잃고 외양간 고친다","티끌 모아 태산","등잔 밑이 어둡다","우물 안 개구리"],"소를 잃은 뒤 외양간을 고쳐도 늦었다는 뜻입니다."],[1,"국어","아주 작은 것도 모이면 큰 것이 된다는 속담은?",["티끌 모아 태산","누워서 떡 먹기","싼 게 비지떡","그림의 떡"],"작은 티끌도 모으면 큰 산이 됩니다."],[1,"국어","가까이 있는 것을 오히려 잘 모른다는 속담은?",["등잔 밑이 어둡다","발 없는 말이 천 리 간다","세 살 버릇 여든까지 간다","고생 끝에 낙이 온다"],"등잔 바로 밑은 그림자 때문에 어둡습니다."],[1,"국어","넓은 세상을 모르고 좁은 생각에 빠진 사람을 이르는 말은?",["우물 안 개구리","하룻강아지","그림의 떡","빛 좋은 개살구"],"우물 속 개구리는 하늘이 우물 입구만 한 줄 압니다."],[1,"국어","어릴 때 버릇은 늙어서도 고치기 어렵다는 속담은?",["세 살 버릇 여든까지 간다","원숭이도 나무에서 떨어진다","백지장도 맞들면 낫다","가재는 게 편"],"어릴 때 습관이 중요하다는 뜻입니다."],[1,"국어","쉬운 일도 함께 하면 더 쉽다는 속담은?",["백지장도 맞들면 낫다","고래 싸움에 새우 등 터진다","금강산도 식후경","쇠귀에 경 읽기"],"협동의 중요성을 말하는 속담입니다."],[1,"국어","아무리 잘하는 사람도 실수할 때가 있다는 속담은?",["원숭이도 나무에서 떨어질 때가 있다","낫 놓고 기역 자도 모른다","하늘의 별 따기","누워서 침 뱉기"],"나무 타기를 잘하는 원숭이도 떨어질 수 있다는 뜻입니다."],[1,"국어","아주 무식함을 이르는 속담은?",["낫 놓고 기역 자도 모른다","꿩 먹고 알 먹고","열 길 물속은 알아도 한 길 사람 속은 모른다","돌다리도 두들겨 보고 건너라"],"낫 모양이 ㄱ과 닮았는데도 모른다는 뜻입니다."],[1,"국어","아는 것이 많을수록 겸손하다는 속담은?",["벼는 익을수록 고개를 숙인다","빈 수레가 요란하다","싼 게 비지떡","개천에서 용 난다"],"잘 익은 벼는 이삭이 무거워 고개를 숙입니다."],[1,"국어","아무리 말해도 알아듣지 못함을 이르는 속담은?",["쇠귀에 경 읽기","누워서 떡 먹기","가는 날이 장날","도토리 키 재기"],"소 귀에 불경을 읽어 줘도 알아듣지 못합니다."],[1,"국어","‘일석이조’의 뜻은?",["한 가지 일로 두 가지 이득을 봄","하루에 두 번 밥을 먹음","돌을 두 번 던짐","두 사람이 힘을 합침"],"돌 하나로 새 두 마리를 잡는다는 뜻입니다."],[1,"국어","묻는 말에 엉뚱한 대답을 하는 것을 뜻하는 사자성어는?",["동문서답","작심삼일","일석이조","우왕좌왕"],"동쪽을 묻는데 서쪽을 답한다는 뜻입니다."],[1,"국어","결심이 사흘을 가지 못함을 뜻하는 사자성어는?",["작심삼일","십중팔구","동고동락","대기만성"],"마음먹은 것이 3일을 못 간다는 뜻입니다."],[1,"국어","열 가운데 여덟이나 아홉, 거의 대부분을 뜻하는 말은?",["십중팔구","일편단심","백발백중","구사일생"],"열 중 여덟아홉이라는 뜻입니다."],[1,"국어","이리저리 왔다 갔다 하며 갈피를 못 잡는 모습을 뜻하는 말은?",["우왕좌왕","동문서답","자업자득","유비무환"],"오른쪽, 왼쪽으로 왔다 갔다 한다는 뜻입니다."],[1,"국어","미리 준비하면 걱정이 없다는 뜻의 사자성어는?",["유비무환","어부지리","과유불급","역지사지"],"준비가 있으면 근심이 없다는 뜻입니다."],[1,"국어","상대의 처지에서 생각해 보는 것을 뜻하는 사자성어는?",["역지사지","동상이몽","막상막하","이구동성"],"처지를 바꾸어 생각한다는 뜻입니다."],[1,"국어","여러 사람이 같은 말을 함을 뜻하는 사자성어는?",["이구동성","각양각색","천차만별","오리무중"],"입은 달라도 소리는 같다는 뜻입니다."],[1,"국어","신발을 세는 단위는?",["켤레","자루","벌","채"],"신발·양말·장갑 두 짝을 한 켤레라고 합니다."],[1,"국어","연필을 세는 단위는?",["자루","켤레","그루","채"],"연필·붓·칼처럼 긴 물건은 자루로 셉니다."],[1,"국어","집을 세는 단위는?",["채","대","벌","송이"],"집은 한 채, 두 채로 셉니다."],[1,"국어","옷을 세는 단위는?",["벌","켤레","그루","장"],"옷 한 벌, 두 벌로 셉니다."],[1,"국어","나무를 세는 단위는?",["그루","포기","송이","자루"],"나무는 한 그루, 두 그루로 셉니다."],[1,"국어","한글의 기본 자음은 모두 몇 개인가?",["14개","10개","19개","24개"],"기본 자음 14개, 기본 모음 10개입니다."],[1,"국어","한글의 기본 모음은 모두 몇 개인가?",["10개","14개","21개","8개"],"ㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ 10개입니다."],[1,"국어","문장 끝에 물음을 나타낼 때 쓰는 문장 부호는?",["물음표","마침표","쉼표","느낌표"],"‘?’를 물음표라고 합니다."],[1,"국어","사실이 아니라 의견에 해당하는 문장은?",["여름이 겨울보다 더 좋은 계절이다.","우리나라에는 사계절이 있다.","물은 100℃에서 끓는다.","서울은 우리나라의 수도이다."],"좋고 싫음은 사람마다 다른 생각이므로 의견입니다. "기고만장","오리무중","금시초문","청천벽력"],"‘기운이 만 길이나 높다’는 뜻입니다."],[2,"국어","어디에 있는지 찾을 수 없거나 갈피를 잡기 어려움을 뜻하는 말은?",["오리무중","기고만장","대동소이","일사천리"],"5리나 이어진 안개 속이라는 뜻입니다."],[2,"국어","맑게 갠 하늘에 날벼락, 뜻밖의 큰 사건을 뜻하는 말은?",["청천벽력","설상가상","금상첨화","전화위복"],"푸른 하늘의 벼락이라는 뜻입니다."],[2,"국어","어려운 일이 겹쳐 생김을 뜻하는 사자성어는?",["설상가상","금상첨화","전화위복","고진감래"],"눈 위에 서리가 덮인다는 뜻입니다."],[2,"국어","좋은 일에 좋은 일이 더해짐을 뜻하는 사자성어는?",["금상첨화","설상가상","자업자득","사필귀정"],"비단 위에 꽃을 더한다는 뜻입니다."],[2,"국어","나쁜 일이 오히려 좋은 일이 됨을 뜻하는 사자성어는?",["전화위복","새옹지마만","고진감래","권선징악"],"재앙이 바뀌어 복이 된다는 뜻입니다."],[2,"국어","고생 끝에 즐거움이 온다는 뜻의 사자성어는?",["고진감래","흥진비래","자업자득","각골난망"],"쓴 것이 다하면 단 것이 온다는 뜻입니다."],[2,"국어","자기가 저지른 일의 결과를 자기가 받음을 뜻하는 말은?",["자업자득","인과응보만","결초보은","사필귀정"],"자기가 한 일을 자기가 얻는다는 뜻입니다."],[2,"국어","죽어서도 은혜를 잊지 않고 갚음을 뜻하는 말은?",["결초보은","각골통한","토사구팽","배은망덕"],"풀을 묶어 은혜를 갚는다는 뜻입니다."],[2,"국어","무슨 일이든 반드시 바른 길로 돌아감을 뜻하는 말은?",["사필귀정","권선징악","새옹지마","과유불급"],"일은 반드시 바르게 돌아간다는 뜻입니다."],[2,"국어","정도를 지나침은 미치지 못함과 같다는 뜻의 말은?",["과유불급","과대망상","과전이하","과반수"],"공자의 말에서 나왔습니다."],[2,"국어","서로 비슷해 낫고 못함을 가리기 어려움을 뜻하는 말은?",["막상막하","천양지차","일취월장","대동소이"],"위아래를 가리기 어렵다는 뜻입니다."],[2,"국어","날로 달로 발전함을 뜻하는 사자성어는?",["일취월장","일장춘몽","일편단심","일거양득"],"나날이 나아진다는 뜻입니다."],[2,"국어","큰 그릇은 늦게 이루어진다, 큰 인물은 늦게 성공한다는 뜻의 말은?",["대기만성","대동단결","대의명분","대경실색"],"노자에서 나온 말입니다."],[2,"국어","어떤 일의 결과에 대해 미리 짐작하지 않고 사실을 바탕으로 쓴 글의 특징은?",["객관성","주관성","함축성","운율성"],"설명문은 객관성이 중요합니다."],[2,"국어","설명 방법 중 ‘고래는 포유류이다’처럼 뜻을 밝히는 방법은?",["정의","예시","비교","분류"],"‘A는 B이다’ 형식이 정의입니다."],[2,"국어","설명 방법 중 공통점을 들어 설명하는 방법은?",["비교","대조","분석","인과"],"차이점을 드는 것은 대조입니다."],[2,"국어","설명 방법 중 대상을 구성 요소로 나누어 설명하는 방법은?",["분석","분류","예시","서사"],"‘꽃은 꽃잎, 암술, 수술로 되어 있다’가 분석입니다."],[2,"국어","논설문의 세 부분 구성으로 바른 것은?",["서론-본론-결론","발단-전개-결말","처음-가운데-절정","도입-갈등-해결"],"본론에서 주장과 근거를 제시합니다."],[2,"영어","‘She ___ to school every day.’ 빈칸에 알맞은 것은?",["goes","go","going","gone"],"3인칭 단수 현재형에는 -s/-es를 붙입니다."],[2,"영어","‘I ___ watching TV now.’ 빈칸에 알맞은 것은?",["am","is","are","do"],"현재진행형: be동사 + -ing"],[2,"영어","‘He ___ soccer yesterday.’ 빈칸에 알맞은 것은?",["played","plays","pla 첩 갈등을 다룬 가정 소설입니다."],[3,"국어","병자호란을 배경으로 여성 영웅이 활약하는 소설은?",["박씨전","임경업전","유충렬전","홍길동전"],"박씨 부인이 청나라 장수를 물리칩니다."],[3,"국어","우리나라 최초의 신소설로 꼽히는 이인직의 작품은?",["혈의 누","무정","자유종","금수회의록"],"1906년 발표되었습니다."],[3,"국어","우리나라 최초의 근대 장편 소설로 꼽히는 이광수의 작품은?",["무정","혈의 누","흙","삼대"],"1917년 매일신보에 연재되었습니다."],[3,"국어","최남선이 발표한 우리나라 최초의 신체시는?",["해에게서 소년에게","불놀이","님의 침묵","진달래꽃"],"1908년 『소년』 창간호에 실렸습니다."],[3,"국어","「삼대」를 쓴 작가는?",["염상섭","채만식","이광수","김동인"],"조 씨 집안 삼대의 이야기입니다."],[3,"국어","「태평천하」, 「레디메이드 인생」을 쓴 풍자 작가는?",["채만식","염상섭","김유정","이태준"],"반어와 풍자가 뛰어납니다."],[3,"국어","「날개」, 「오감도」를 쓴 작가는?",["이상","김기림","정지용","박태원"],"‘박제가 되어 버린 천재를 아시오?’로 시작합니다."],[3,"국어","「소설가 구보 씨의 일일」을 쓴 작가는?",["박태원","이상","최인훈","이태준"],"모더니즘 소설입니다."],[3,"국어","「광장」을 쓴 작가는?",["최인훈","황석영","조세희","이청준"],"남북 분단 속 이명준의 선택을 그렸습니다."],[3,"국어","「난장이가 쏘아올린 작은 공」을 쓴 작가는?",["조세희","황석영","윤흥길","박완서"],"1970년대 도시 빈민의 삶을 그렸습니다."],[3,"국어","「장마」, 「아홉 켤레의 구두로 남은 사내」를 쓴 작가는?",["윤흥길","황석영","이문열","오정희"],"「장마」는 6·25 전쟁 속 두 할머니의 갈등을 그렸습니다."],[3,"국어","「토지」를 쓴 작가는?",["박경리","박완서","조정래","최명희"],"최 참판 댁의 이야기를 그린 대하소설입니다."],[3,"국어","「태백산맥」, 「아리랑」을 쓴 작가는?",["조정래","박경리","황석영","이병주"],"여순 사건부터 6·25를 다룬 대하소설입니다."],[3,"국어","「혼불」을 쓴 작가는?",["최명희","박경리","박완서","신경숙"],"남원 매안 이씨 문중을 그렸습니다."],[3,"국어","「그 많던 싱아는 누가 다 먹었을까」를 쓴 작가는?",["박완서","공지영","신경숙","오정희"],"자전적 소설입니다."],[3,"국어","「유리창」, 「향수」를 쓴 시인은?",["정지용","김영랑","김광균","백석"],"감각적 이미지가 뛰어난 시인입니다."],[3,"국어","「모란이 피기까지는」을 쓴 시인은?",["김영랑","정지용","김소월","서정주"],"시문학파 시인입니다."],[3,"국어","「남신의주 유동 박시봉방」, 「여승」을 쓴 시인은?",["백석","이용악","윤동주","김수영"],"평안도 방언을 살린 시를 썼습니다."],[3,"국어","「풀」, 「어느 날 고궁을 나오면서」를 쓴 시인은?",["김수영","신동엽","고은","김춘수"],"‘풀이 눕는다’로 시작합니다."],[3,"국어","「꽃」(내가 그의 이름을 불러 주었을 때)을 쓴 시인은?",["김춘수","김수영","서정주","박목월"],"존재와 인식을 다룬 시입니다."],[3,"국어","「껍데기는 가라」를 쓴 시인은?",["신동엽","김수영","신경림","고은"],"4월 혁명의 순수한 정신을 강조했습니다."],[3,"국어","「농무」를 쓴 시인은?",["신경림","신동엽","김지하","정호승"],"농촌의 피폐한 현실을 그렸습니다."],[3,"국어","「국화 옆에서」를 쓴 시인은?",["서정주","박목월","조지훈","박두진"],"‘한 송이의 국화꽃을 피우기 위해’로 시작합니다."],[3,"국어","박목월, 조지훈, 박두진을 함께 이르는 말은?",["청록파","시문학파","생명파","모더니즘파"],"공동 시집 『청록집』을 냈습니다."],[3,"국어","「승무」를 쓴 시인은?",["조지훈","박목월","박두진","김광섭"],"‘얇은 사 하이얀 고깔은’으로 시작합니다."],[3,"국어","「나그네」(구름에 달 가듯이 가는 나그네)를 쓴 시인은?",["박목월","조지훈","박두진","김소월"],"청록파 시인입니다."],[3,"국어","시에서 시인이 내세운 말하는 이를 무엇이라 하는가?",["시적 화자","서술자","작가","청자"],"시인과 화자는 다를 수 있습니다."],[3,"국어","감정을 직접 드러내지 않고 사물에 빗대어 표현하는 것을 무엇이라 하는가?",["객관적 상관물","역설","반어","설의"],"김소월 「진달래꽃」의 꽃처럼 감정을 대신 나타냅니다."],[3,"국어","‘이건 사랑이 아니다. 그러나 사랑이다.’처럼 모순된 표현으로 진리를 드러내는 방법은?",["역설법","반어법","대구법","설의법"],"표면적으로 모순됩니다."],[3,"국어","시에서 소리의 반복으로 생기는 말의 가락을 무엇이라 하는가?",["운율","심상","어조","주제"],"외형률과 내재율이 있습니다."],[3,"국어","일정한 글자 수나 음보 없이 시의 내면에 흐르는 운율은?",["내재율","외형률","음수율","음보율"],"자유시의 운율입니다."],[3,"국어","고전 소설의 일반적인 특징이 아닌 것은?",["비극적 결말이 대부분이다","권선징악의 주제","우연성과 비현실성","일대기적 구성"],"대부분 행복한 결말입니다."],[3,"국어","희곡에서 막과 막 사이에 있는 공연의 작은 단위는?",["장","막","지문","해설"],"막은 큰 단위, 장은 작은 단위입니다."],[3,"국어","영화나 드라마 촬영을 위한 대본은?",["시나리오","희곡","수필","소설"],"S#(장면 번호) 같은 용어를 씁니다."],[3,"국어","문학 작품을 작가의 생애나 시대와 연결해 해석하는 관점은?",["표현론·반영론(외재적 관점)","내재적 관점","효용론만","절대론"],"작품 밖 요소로 해석합니다."],[3,"국어","작품 자체의 구조와 언어에만 집중해 해석하는 관점은?",["내재적 관점(절대론)","반영론","효용론","표현론"],"형식주의 비평이 대표적입니다."],[3,"국어","‘비 오는 날이면 생각나는 친구’에서 ‘비 오는’은 어떤 성분인가?",["관형어","부사어","목적어","서술어"],"체언 ‘날’을 꾸밉니다."],[3,"국어","‘그는 마치 천사처럼 웃었다’에서 ‘마치’와 호응하는 말은?",["처럼","만","조차","까지"],"‘마치 ~처럼(같이)’은 호응 관계입니다."],[3,"국어","문장 호응이 바른 것은?",["결코 포기하지 않겠다.","결코 포기하겠다.","별로 좋았다.","여간 쉽다."],"‘결코, 별로, 여간’은 부정 표현과 호응합니다."],[3,"국어","‘이 자리를 빌려 감사드립니다’의 ‘빌려’는 표준어로 바른가?",["바르다","‘빌어’가 맞다","‘비러’가 맞다","‘빌러’가 맞다"],"‘빌리다’를 씁니다. ‘빌다’는 기원하다입니다."],[3,"영어","‘If I ___ a bird, I would fly to you.’ 빈칸에 알맞은 것은?",["were","am","will be","have been"],"가정법 과거에서 be동사는 were를 씁니다."],[3,"영어","‘If I had studied harder, I ___ the exam.’ 빈칸에 알맞은 것은?",["would have passed","will pass","would pass","passed"],"가정법 과거완료: would have + 과거분사"],[3,"영어","‘I wish I ___ taller.’ 빈칸에 알맞은 것은?",["were","am","will be","have been"],"I wish + 가정법 과거는 현재 사실과 반대되는 소망입니다."],[3,"영어","‘___ tired, she went to bed early.’(분사구문) 빈칸에 알맞은 것은?",["Being","Be","Been","To be being"],"  받았습니다."],[4,"예체능","세계 최초로 상업 영화를 상영한 형제(1895)는?",["뤼미에르 형제","라이트 형제","워너 형제","에디슨 형제"],"파리에서 시네마토그래프로 상영했습니다."],[4,"예체능","BTS가 한국 가수 최초로 1위를 한 미국 빌보드 싱글 차트는?",["핫 100","빌보드 200","글로벌 200","월드 디지털 송"],"2020년 「Dynamite」로 1위에 올랐습니다."],[4,"예체능","「강남스타일」로 유튜브 최초 10억 조회수를 기록한 가수는?",["싸이","BTS","빅뱅","보아"],"2012년의 일입니다."]]</script>
<script>
const LV=['','초등','중학','고등','대학 교양'];
const VERDICT=['초등 과정 복습 필요','초등학교 졸업 수준','중학교 졸업 수준','고등학교 졸업 수준','대학 교양 수준'];
const SUBJ=['국어','영어','수학','과학','사회','역사','인문','예체능','정보·기술'];
// [단계, 과목, 문제, 보기(첫 번째가 정답), 해설]
const BANK=JSON.parse(document.getElementById('bank').textContent).map((r,id)=>({id,lv:r[0],subj:r[1],q:r[2],opts:r[3],exp:r[4]}));
const NUM=['①','②','③','④'];
const $=s=>document.querySelector(s);
const app=$('#app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// 풀었던 문제와 오답은 이 브라우저에만 저장됩니다
let seen=new Set(store.get('sangsik-seen',[]));
let wrongSet=new Set(store.get('sangsik-wrong',[]));
const saveProgress=()=>{store.set('sangsik-seen',[...seen]);store.set('sangsik-wrong',[...wrongSet])};

let S=null;
let prefs=Object.assign({diagN:5,lv:1,subj:'전체',n:10,confirmReset:false},store.get('sangsik-prefs',{}));
const savePrefs=()=>store.set('sangsik-prefs',{diagN:prefs.diagN,lv:prefs.lv,subj:prefs.subj,n:prefs.n});

// 안 푼 문제를 먼저 뽑고, 모자라면 푼 문제에서 채웁니다
function draw(pool,n){
  const fresh=shuffle(pool.filter(q=>!seen.has(q.id))),old=shuffle(pool.filter(q=>seen.has(q.id)));
  return fresh.concat(old).slice(0,n);
}
const makeItem=q=>({...q,shown:shuffle(q.opts),answer:q.opts[0],picked:null});

function startDiag(){
  const list=[];for(let l=1;l<=4;l++) list.push(...draw(BANK.filter(q=>q.lv===l),prefs.diagN));
  S={mode:'diag',per:prefs.diagN,list:list.map(makeItem),i:0};renderQuiz();
}
function practicePool(){return BANK.filter(q=>q.lv===prefs.lv&&(prefs.subj==='전체'||q.subj===prefs.subj))}
function startPractice(){
  const pool=practicePool();if(!pool.length)return;
  S={mode:'practice',lv:prefs.lv,subj:prefs.subj,list:draw(pool,prefs.n).map(makeItem),i:0};renderQuiz();
}
function startWrong(){
  const pool=BANK.filter(q=>wrongSet.has(q.id));if(!pool.length)return;
  S={mode:'wrong',list:shuffle(pool).slice(0,20).map(makeItem),i:0};renderQuiz();
}

function seg(name,items,cur){
  return `<div class="seg" role="group">${items.map(([v,label])=>`<button type="button" data-${name}="${esc(v)}" aria-pressed="${String(v)===String(cur)}">${esc(label)}</button>`).join('')}</div>`;
}

function renderHome(){
  const last=store.get('sangsik-last',null);
  const pool=practicePool();
  const subjInLv=SUBJ.filter(s=>BANK.some(q=>q.lv===prefs.lv&&q.subj===s));
  if(prefs.subj!=='전체'&&!subjInLv.includes(prefs.subj))prefs.subj='전체';
  const unseenInPool=pool.filter(q=>!seen.has(q.id)).length;
  app.innerHTML=`
  <div class="form-head"><b>학력 진단 통지표</b><span>상식 영역 · 문제은행 ${BANK.length.toLocaleString()}문항</span></div>
  <div class="blk">
    <div class="eyebrow">초등 · 중학 · 고등 · 대학 교양 4단계</div>
    <h1>내 상식은 몇 학년 수준일까?</h1>
    <p class="lead">과정마다 약 500문항씩 들어 있는 문제은행에서 무작위로 출제합니다. 쉬운 초등 문제부터 대학 교양까지 차례로 올라가며 수준을 판정합니다.</p>
    <div class="diag-choice">
      <button class="btn primary" data-diag="5">빠른 진단<em>단계별 5문항 · 20문항</em></button>
      <button class="btn primary" data-diag="10">정밀 진단<em>단계별 10문항 · 40문항</em></button>
    </div>
    ${last?`<p class="last">지난 결과: <b>${esc(last.verdict)}</b> · 상식 지수 ${last.idx}점 (${esc(last.date)})</p>`:''}
    <p class="rule">각 단계에서 60% 이상 맞히면 통과입니다. 아래 단계부터 연속으로 통과한 가장 높은 단계가 내 수준이 됩니다.</p>
  </div>

  <div class="sec-title blk">과정별 연습 <small>과정과 과목을 골라 풀기</small></div>
  <div class="panel">
    <div class="field"><span>과정</span>${seg('lv',[1,2,3,4].map(l=>[l,`${LV[l]} ${BANK.filter(q=>q.lv===l).length}`]),prefs.lv)}</div>
    <div class="field"><span>과목</span>${seg('subj',[['전체','전체'],...subjInLv.map(s=>[s,`${s} ${BANK.filter(q=>q.lv===prefs.lv&&q.subj===s).length}`])],prefs.subj)}</div>
    <div class="field"><span>문항 수</span>${seg('n',[[10,'10문항'],[20,'20문항'],[30,'30문항']],prefs.n)}</div>
    <button class="btn primary" id="practice">${LV[prefs.lv]} ${prefs.subj==='전체'?'':esc(prefs.subj)+' '}${Math.min(prefs.n,pool.length)}문항 풀기</button>
    <p class="last" style="margin-bottom:0">이 범위에서 아직 안 푼 문제 ${unseenInPool} / ${pool.length}문항. 안 푼 문제부터 출제합니다.</p>
  </div>

  <div class="sec-title blk">오답 노트 <small>틀린 문제 다시 풀기</small></div>
  <div class="panel">
    <button class="btn" id="wrong" ${wrongSet.size?'':'disabled'} style="width:100%">${wrongSet.size?`틀린 문제 ${wrongSet.size}개 중 최대 20문항 다시 풀기`:'아직 틀린 문제가 없습니다'}</button>
    <p class="last" style="margin-bottom:0">다시 풀어 맞히면 오답 노트에서 빠집니다.</p>
  </div>

  <div class="stats blk">
    <span>푼 문제 <b>${seen.size.toLocaleString()}</b> / ${BANK.length.toLocaleString()}</span>
    <span>오답 노트 <b>${wrongSet.size}</b></span>
    ${seen.size||wrongSet.size?(prefs.confirmReset
      ?`<span class="confirm">기록을 모두 지울까요? <button class="btn" id="resetYes" style="padding:4px 10px">지우기</button><button class="linkbtn" id="resetNo">취소</button></span>`
      :`<button class="linkbtn" id="reset">기록 초기화</button>`):''}
  </div>`;
  app.querySelectorAll('[data-diag]').forEach(b=>b.onclick=()=>{prefs.diagN=+b.dataset.diag;savePrefs();startDiag()});
  app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{prefs.lv=+b.dataset.lv;prefs.subj='전체';savePrefs();renderHome()});
  app.querySelectorAll('[data-subj]').forEach(b=>b.onclick=()=>{prefs.subj=b.dataset.subj;savePrefs();renderHome()});
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{prefs.n=+b.dataset.n;savePrefs();renderHome()});
  $('#practice').onclick=startPractice;
  $('#wrong').onclick=startWrong;
  const r=$('#reset');if(r)r.onclick=()=>{prefs.confirmReset=true;renderHome()};
  const ry=$('#resetYes');if(ry)ry.onclick=()=>{seen.clear();wrongSet.clear();saveProgress();prefs.confirmReset=false;renderHome()};
  const rn=$('#resetNo');if(rn)rn.onclick=()=>{prefs.confirmReset=false;renderHome()};
}

function quizTitle(){
  if(S.mode==='diag')return S.per===10?'정밀 진단':'빠른 진단';
  if(S.mode==='wrong')return '오답 다시 풀기';
  return `${LV[S.lv]}${S.subj==='전체'?'':' '+S.subj} 연습`;
}

function renderQuiz(){
  const it=S.list[S.i],n=S.list.length,done=it.picked!==null;
  app.innerHTML=`
  <div class="form-head"><b>${esc(quizTitle())}</b><span class="count">문항 ${S.i+1} / ${n}</span></div>
  <div class="bar">${S.list.map((x,k)=>`<i class="${k===S.i?'now':x.picked!==null?'done':''}"></i>`).join('')}</div>
  <div class="qtop blk"><div class="chips"><span class="chip lv">${LV[it.lv]}</span><span class="chip">${esc(it.subj)}</span></div></div>
  <p class="qtext blk">${esc(it.q)}</p>
  <div class="opts">${it.shown.map((o,k)=>{
    let c='';if(done){if(o===it.answer)c='ok';else if(o===it.picked)c='no'}
    return `<button class="opt ${c}" data-k="${k}" ${done?'disabled':''}><span class="n">${NUM[k]}</span><span>${esc(o)}</span></button>`}).join('')}</div>
  ${done?`<div class="exp blk">${it.picked===it.answer?'<b>정답입니다.</b>':`<b class="x">오답입니다.</b> 정답은 ${NUM[it.shown.indexOf(it.answer)]} ${esc(it.answer)}`}<br>${esc(it.exp)}</div>`:''}
  <div class="nav"><button class="btn" id="quit">그만두기</button>
  <button class="btn primary" id="next" ${done?'':'disabled'}>${S.i===n-1?'결과 보기':'다음 문항'}</button></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $('#next').onclick=next;$('#quit').onclick=()=>{S=null;renderHome()};
  if(done)$('#next').focus();
}
function pick(k){
  const it=S.list[S.i];if(it.picked!==null)return;
  it.picked=it.shown[k];
  seen.add(it.id);
  if(it.picked===it.answer)wrongSet.delete(it.id);else wrongSet.add(it.id);
  saveProgress();renderQuiz();
}
function next(){if(S.list[S.i].picked===null)return;if(S.i<S.list.length-1){S.i++;renderQuiz();window.scrollTo(0,0)}else renderResult()}
document.addEventListener('keydown',e=>{
  if(!S||!app.querySelector('.opt'))return;
  if(['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'&&S.list[S.i].picked!==null){e.preventDefault();next()}
});

function renderResult(){
  const L=S.list,ok=x=>x.picked===x.answer;
  const correct=L.filter(ok).length;
  let stamp,title,idxHtml,levelTable='';
  if(S.mode==='diag'){
    const per=[1,2,3,4].map(l=>{const xs=L.filter(x=>x.lv===l);return {l,c:xs.filter(ok).length,t:xs.length}});
    const pass=p=>p.c>=Math.ceil(p.t*0.6);
    let lvl=0;for(const p of per){if(pass(p))lvl=p.l;else break}
    const w=L.reduce((s,x)=>s+x.lv,0),g=L.reduce((s,x)=>s+(ok(x)?x.lv:0),0);
    const idx=Math.round(g/w*100);
    stamp=`<small>판 정</small><strong>${lvl?LV[lvl]:'복습'}</strong><small>${lvl?'수 준':'필 요'}</small>`;
    title=VERDICT[lvl];
    idxHtml=`<div class="idx">${idx}<small> / 100 상식 지수</small></div><p class="lead" style="margin:4px 0 0">${L.length}문항 중 ${correct}문항 정답. 어려운 단계일수록 배점이 큽니다.</p>`;
    levelTable=`<div class="sec-title blk">단계별 성적</div>
    <div style="overflow-x:auto"><table><thead><tr><th>단계</th><th>정답</th><th>성취</th><th>판정</th></tr></thead><tbody>
    ${per.map(p=>`<tr><td>${LV[p.l]}</td><td class="num">${p.c} / ${p.t}</td><td><div class="meter"><i style="width:${p.c/p.t*100}%"></i></div></td><td><span class="pill ${pass(p)?'pass':'fail'}">${pass(p)?'통과':'미통과'}</span></td></tr>`).join('')}
    </tbody></table></div>`;
    store.set('sangsik-last',{verdict:title,idx,date:new Date().toLocaleDateString('ko-KR')});
  }else{
    const sc=Math.round(correct/L.length*100);
    const name=S.mode==='wrong'?'오답':LV[S.lv];
    stamp=`<small>${esc(name)}</small><strong>${sc}점</strong><small>${correct} / ${L.length}</small>`;
    title=S.mode==='wrong'?`틀렸던 문제 ${correct}개를 이번엔 맞혔어요`:sc>=80?`${LV[S.lv]} 과정을 잘 알고 있어요`:sc>=60?`${LV[S.lv]} 과정 통과`:`${LV[S.lv]} 과정 복습이 필요해요`;
    idxHtml=`<p class="lead" style="margin:4px 0 0">${L.length}문항 중 ${correct}문항을 맞혔습니다.</p>`;
  }
  const subs=[...new Set(L.map(x=>x.subj))].map(s=>{const xs=L.filter(x=>x.subj===s);return {s,c:xs.filter(ok).length,t:xs.length}}).sort((a,b)=>b.c/b.t-a.c/a.t);
  const wrong=L.filter(x=>!ok(x));
  app.innerHTML=`
  <div class="form-head"><b>${S.mode==='diag'?'학력 진단 통지표':'연습 결과'}</b><span>${new Date().toLocaleDateString('ko-KR')}</span></div>
  <div class="res-head blk"><div class="stamp">${stamp}</div><div class="res-text"><h2>${esc(title)}</h2>${idxHtml}</div></div>
  ${levelTable}
  <div class="sec-title blk">과목별 성적</div>
  <div style="overflow-x:auto"><table><thead><tr><th>과목</th><th>정답</th><th style="width:45%">성취</th></tr></thead><tbody>
  ${subs.map(p=>`<tr><td>${esc(p.s)}</td><td class="num">${p.c} / ${p.t}</td><td><div class="meter"><i style="width:${p.c/p.t*100}%"></i></div></td></tr>`).join('')}
  </tbody></table></div>
  <div class="sec-title blk">이번 오답 <small>${wrong.length}문항 · 오답 노트에 저장됨</small></div>
  ${wrong.length?`<div class="wrong">${wrong.map(x=>`<div><div class="wq">[${LV[x.lv]}·${esc(x.subj)}] ${esc(x.q)}</div>
    <div class="wm">내 답: ${esc(x.picked)}</div><div class="wa">정답: ${esc(x.answer)}</div><div class="we">${esc(x.exp)}</div></div>`).join('')}</div>`:'<p class="blk">틀린 문항이 없습니다.</p>'}
  <div class="actions"><button class="btn" id="home">처음으로</button><button class="btn primary" id="again">새 문제로 다시</button></div>`;
  const mode=S.mode;
  $('#home').onclick=renderHome;
  $('#again').onclick=()=>mode==='diag'?startDiag():mode==='wrong'?(wrongSet.size?startWrong():renderHome()):startPractice();
  S=null;window.scrollTo(0,0);
}
renderHome();
</script>

</body>
</html>
