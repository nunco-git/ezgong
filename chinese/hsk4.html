      <h1>HSK 4급 꼬리잡기</h1>
      <p class="sub">HSK 4급 신출 600단어를 같은 글자, 반대말, 주제, 예문으로 이어 배워요<br>한자를 누르면 발음, 카드를 누르면 설명 창, 창에서 병음을 누르면 그 단어로 이동해요 · <button type="button" data-help style="background:none;border:0;padding:0;color:var(--sign);text-decoration:underline;font:inherit;cursor:pointer">음성이 안 나오나요?</button></p>

<script>
// W(단어, 병음(음절마다 띄어쓰기), 품사, 뜻, [예문, 병음, 번역], 팁)
const D=[]; let LV=1, TH='';
function lv(n){LV=n}
function th(n){TH=n}
function W(w,py,pos,mean,ex,tip){D.push({w,py,pos,mean,ex:{z:ex[0],py:ex[1],k:ex[2]},tip:tip||'',lv:LV,th:TH})}
// P(단어A, 단어B, 관계 이름) : 반대말·짝
const PR=[];
function P(a,b,label){PR.push({a,b,label:label||'반대말'})}

lv(4);
th("상태·성질 형용사");
W("低","dī","형용사","낮다",["这个桌子太低了。","Zhè ge zhuōzi tài dī le.","이 책상은 너무 낮아요."]);
W("相同","xiāng tóng","형용사","서로 같다",["我们的爱好相同。","Wǒmen de àihào xiāngtóng.","우리는 취미가 같아요."]);
W("厚","hòu","형용사","두껍다",["这本书很厚。","Zhè běnshū hěn hòu.","이 책은 아주 두꺼워요."]);
W("深","shēn","형용사","깊다",["这条河很深。","Zhè tiáo hé hěn shēn.","이 강은 아주 깊어요."]);
W("轻","qīng","형용사","가볍다",["我的行李很轻。","Wǒ de xíngli hěn qīng.","제 짐은 아주 가벼워요."]);
W("脏","zāng","형용사","더럽다",["你的鞋太脏了。","Nǐ de xié tài zāng le.","당신 신발이 너무 더러워요."]);
W("乱","luàn","형용사","어지럽다",["你的房间太乱了。","Nǐ de fángjiān tài luàn le.","당신 방이 너무 어질러져 있어요."]);
W("暖和","nuǎn huo","형용사","따뜻하다",["今天比昨天暖和。","Jīntiān bǐ zuótiān nuǎnhuo.","오늘은 어제보다 따뜻해요."]);
W("凉快","liáng kuai","형용사","시원하다",["秋天很凉快。","Qiūtiān hěn liángkuai.","가을은 시원해요."]);
W("香","xiāng","형용사","향기롭다, 맛있다",["这个菜很香。","Zhè ge cài hěn xiāng.","이 요리는 냄새가 좋아요."]);
W("辣","là","형용사","맵다",["这个菜太辣了。","Zhè ge cài tài là le.","이 요리는 너무 매워요."]);
W("酸","suān","형용사","시다",["这个苹果有点儿酸。","Zhè ge píngguǒ yǒudiǎnr suān.","이 사과는 조금 셔요."]);
W("咸","xián","형용사","짜다",["这个汤太咸了。","Zhè ge tāngtàixián le.","이 국은 너무 짜요."]);
W("苦","kǔ","형용사","쓰다, 고생스럽다",["这个药很苦。","Zhè ge yào hěn kǔ.","이 약은 아주 써요."]);
W("辛苦","xīn kǔ","형용사","수고하다, 고생스럽다",["大家辛苦了！","Dàjiā xīnkǔ le!","모두 수고하셨어요!"]);
W("美丽","měi lì","형용사","아름답다",["这里的风景很美丽。","Zhèlǐ de fēngjǐng hěn měilì.","이곳의 경치는 아주 아름다워요."]);
W("帅","shuài","형용사","멋지다, 잘생기다",["他长得很帅。","Tā zhǎng de hěn shuài.","그는 잘생겼어요."]);
W("穷","qióng","형용사","가난하다",["他家以前很穷。","Tā jiā yǐqián hěn qióng.","그의 집은 예전에 가난했어요."]);
W("富","fù","형용사","부유하다",["这是一个富国。","Zhè shì yí ge fùguó.","이곳은 부유한 나라예요."]);
W("丰富","fēng fù","형용사","풍부하다",["这里的菜很丰富。","Zhèlǐ de cài hěn fēngfù.","이곳은 요리가 풍성해요."]);
W("复杂","fù zá","형용사","복잡하다",["这个问题很复杂。","Zhè ge wèntí hěn fùzá.","이 문제는 아주 복잡해요."]);
W("困","kùn","형용사","졸리다",["我很困，想睡觉。","Wǒ hěn kùn, xiǎng shuìjiào.","저는 졸려서 자고 싶어요."]);
W("困难","kùn nan","형용사","어렵다, 곤란",["他遇到了很多困难。","Tā yùdào le hěn duō kùnnan.","그는 많은 어려움을 만났어요."]);
W("轻松","qīng sōng","형용사","홀가분하다, 가볍다",["考完试，我觉得很轻松。","Kǎowánshì, wǒ juéde hěn qīngsōng.","시험이 끝나서 홀가분해요."]);
W("正常","zhèng cháng","형용사","정상적이다",["他的身体很正常。","Tā de shēntǐ hěn zhèngcháng.","그의 몸은 정상이에요."]);
W("熟悉","shú xī","동사","잘 알다, 익숙하다",["我对这儿很熟悉。","Wǒ duì zhèr hěn shúxī.","저는 이곳이 아주 익숙해요."]);
W("危险","wēi xiǎn","형용사","위험하다",["这儿太危险了。","Zhèr tài wēixiǎn le.","여기는 너무 위험해요."]);
W("安全","ān quán","형용사","안전하다",["坐飞机很安全。","Zuò fēijī hěn ānquán.","비행기를 타는 건 안전해요."]);
W("严重","yán zhòng","형용사","심각하다",["这个问题很严重。","Zhè ge wèntí hěn yánzhòng.","이 문제는 아주 심각해요."]);
W("准确","zhǔn què","형용사","정확하다",["他的汉语发音很准确。","Tā de Hànyǔ fāyīn hěn zhǔnquè.","그의 중국어 발음은 아주 정확해요."]);
W("正确","zhèng què","형용사","올바르다, 정확하다",["你的答案是正确的。","Nǐ de dáàn shì zhèngquè de.","당신의 답은 정확해요."]);
W("合适","hé shì","형용사","알맞다",["这件衣服很合适。","Zhè jiàn yīfu hěn héshì.","이 옷은 잘 맞아요."]);

function go(w){S.cur=w;if(S.trail[S.trail.length-1]!==w){S.trail.push(w);if(S.trail.length>40)S.trail.shift()}save()}
function pickNext(){
  const n=allN(S.cur);
  let c=n.filter(x=>!S.trail.includes(x)&&!S.learned.has(x));
  if(!c.length)c=n.filter(x=>!S.trail.includes(x));
  if(!c.length)c=D.map(d=>d.w).filter(x=>!S.learned.has(x)&&x!==S.cur);
  if(!c.length)c=D.map(d=>d.w).filter(x=>x!==S.cur);
  return c[Math.floor(Math.random()*c.length)]}
const TTS={el:new Audio(),loaded:false,seq:0,netDead:false};
function voicesNow(){try{const v=speechSynthesis.getVoices();if(v.length)TTS.loaded=true;return v}catch(e){return[]}}
try{if('speechSynthesis' in window){voicesNow();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',voicesNow)}}catch(e){}
function voicesReady(ms){return new Promise(res=>{let done=false,iv=0;const fin=()=>{if(done)return;done=true;clearInterval(iv);res(voicesNow())};
  try{speechSynthesis.addEventListener('voiceschanged',fin,{once:true})}catch(e){}
  iv=setInterval(()=>{if(voicesNow().length)fin()},100);setTimeout(fin,ms||1500)})}
const langKey=l=>String(l||'').replace('_','-').toLowerCase();
function pickVoice(vs){vs=vs||voicesNow();const nm=/chinese|中文|普通话|國語|mandarin|xiaoxiao|yunxi|yunyang|xiaoyi|ting-ting|tingting|meijia|sin-ji|huihui|kangkang|yaoyao/i;
  const cand=vs.filter(v=>v&&(/^zh/.test(langKey(v.lang))||nm.test(v.name||''))&&!/hk|yue|cantonese|粤|廣東|tw|taiwan|台/i.test((v.lang||'')+(v.name||''))||(v&&/^zh-(cn|hans)/.test(langKey(v.lang))));
  if(!cand.length)return null;
  const score=v=>(langKey(v.lang)==='zh-cn'?4:0)+(/^zh/.test(langKey(v.lang))?3:0)+(/natural|premium|enhanced|neural|online/i.test(v.name||'')?2:0)+(v.localService?1:0);
  return cand.slice().sort((a,b)=>score(b)-score(a))[0]}
function sayToast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14202c;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:50;max-width:90vw;text-align:center';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>{t.hidden=true},3500)}
const AUDIO_BASE=/(^|\.)smartgong\.kr$/.test(location.hostname)?'/chinese/a/':'https://www.smartgong.kr/chinese/a/';
function audioKey(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
function tryPlay(src,ms,ok,fail){const el=TTS.el;let good=false,dead=false;const bad=()=>{if(dead||good)return;dead=true;fail()};
  el.onplaying=()=>{if(!good){good=true;ok&&ok()}};el.onerror=bad;
  try{el.src=src;const p=el.play();if(p&&p.catch)p.catch(bad)}catch(e){bad();return}
  setTimeout(()=>{if(!good){try{el.pause()}catch(e){}bad()}},ms)}
function sayEmbedded(t){const k=audioKey(t);
  const src=(typeof AUDIO!=='undefined'&&AUDIO[k])?'data:audio/mpeg;base64,'+AUDIO[k]:AUDIO_BASE+k+'.mp3';
  tryPlay(src,3000,null,()=>{sayToast('중국어 음성을 재생할 수 없어요. 기기 설정에서 중국어 음성을 추가해 주세요. (안드로이드: 설정 > 텍스트 음성 변환 > 중국어 음성 데이터 설치)',8000)})}
function sayOnline(t,id){if(TTS.netDead){sayEmbedded(t);return}
  const q=encodeURIComponent(t);
  const urls=['https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q='+q,'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=zh-CN&q='+q,'https://dict.youdao.com/dictvoice?le=zh&audio='+q];
  let i=0;const next=()=>{if(id!==TTS.seq)return;if(i>=urls.length){TTS.netDead=true;sayEmbedded(t);return}tryPlay(urls[i++],2200,null,next)};next()}
function say(t){const id=++TTS.seq;try{TTS.el.pause()}catch(e){}
  if(!('speechSynthesis' in window)){sayOnline(t,id);return}
  const go=vs=>{if(id!==TTS.seq)return;
    const v=pickVoice(vs);
    if(!v&&vs.length){sayOnline(t,id);return}
    let started=false,moved=false;
    const fb=()=>{if(started||moved||id!==TTS.seq)return;moved=true;try{speechSynthesis.cancel()}catch(e){}sayOnline(t,id)};
    try{const u=new SpeechSynthesisUtterance(t);u.lang=v?v.lang:'zh-CN';if(v)u.voice=v;u.rate=.85;u.pitch=1;u.volume=1;
      u.onstart=()=>{started=true};u.onerror=e=>{if(e&&(e.error==='interrupted'||e.error==='canceled'))return;fb()};
      const run=()=>{if(id!==TTS.seq)return;try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){fb()}setTimeout(fb,3500)};
      if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(run,90)}else run()}catch(e){fb()}};
  const vs=voicesNow();
  if(vs.length||TTS.loaded)go(vs);else voicesReady(1500).then(go)}

function matches(d){
  if(S.lvf&&d.lv!==S.lvf)return false;
  if(S.onlyNew&&S.learned.has(d.w))return false;
  const q=S.q.trim().toLowerCase();if(!q)return true;

function list(){
  return `<div class="row"><input type="search" id="q" placeholder="단어, 병음(예: xuesheng), 한글 뜻으로 찾기" value="${S.q.replace(/"/g,'&quot;')}" aria-label="단어 찾기"></div>
  <div class="row"><button class="fb" data-lvf="0" aria-pressed="${S.lvf===0}">전체</button>${LEVELS.map(l=>`<button class="fb" data-lvf="${l}" aria-pressed="${S.lvf===l}">${l}급</button>`).join('')}<button class="fb" data-act="onlynew" aria-pressed="${S.onlyNew}">아직 안 익힌 것만</button></div>
  <div class="grid" id="grid">${gridH()}</div>`}

function newQ(){
  let pool=D.filter(d=>!S.lvq||d.lv===S.lvq);
  const t=pool[Math.floor(Math.random()*pool.length)];
  const key=S.mode==='mean'?'mean':S.mode==='word'?'w':'py';
  const val=d=>d[key];
  const wrong=[];
  for(const w of shuffle(allN(t.w))){const v=val(MAP.get(w));if(v!==val(t)&&!wrong.includes(v))wrong.push(v);if(wrong.length>=3)break}
  for(const x of shuffle(D.filter(e=>e.lv===t.lv))){if(wrong.length>=3)break;if(val(x)!==val(t)&&!wrong.includes(val(x)))wrong.push(val(x))}
  return {t,key,opts:shuffle([val(t),...wrong]),pick:null}}
function quiz(){
  if(!S.quiz)S.quiz=newQ();
  const Q=S.quiz,done=Q.pick!==null,ok=done&&Q.opts[Q.pick]===Q.t[Q.key];
  const showMean=S.mode==='word';
  return `<div class="row"><button class="fb" data-mode="mean" aria-pressed="${S.mode==='mean'}">뜻 맞히기</button><button class="fb" data-mode="word" aria-pressed="${S.mode==='word'}">단어 맞히기</button><button class="fb" data-mode="py" aria-pressed="${S.mode==='py'}">병음·성조 맞히기</button></div>
  <div class="row"><button class="fb" data-lvq="0" aria-pressed="${S.lvq===0}">전체 급수</button>${LEVELS.map(l=>`<button class="fb" data-lvq="${l}" aria-pressed="${S.lvq===l}">${l}급만</button>`).join('')}<span class="score">맞힌 문제 ${S.score.ok} / ${S.score.n}</span></div>
  <div class="qbig" lang="${showMean?'ko':'zh-CN'}"${showMean?' style="font-size:2rem"':''}>${showMean?Q.t.mean:Q.t.w}</div>
  <p style="margin:0 0 10px;font-weight:700">${S.mode==='mean'?'이 단어의 뜻은?':S.mode==='word'?'이 뜻에 맞는 단어는?':'이 단어의 병음(성조 포함)은?'}</p>
  <div class="opts">${Q.opts.map((o,i)=>`<button class="opt${done?(o===Q.t[Q.key]?' right':i===Q.pick?' wrong':''):''}" data-opt="${i}"${done?' disabled':''}>${o}</button>`).join('')}</div>
  ${done?`<p class="fb2">${ok?'정답이에요!':'아쉬워요. 정답은 “'+Q.t[Q.key]+'”'}</p><div class="acts"><button class="btn pri" data-act="qnext">다음 문제</button><button class="btn" data-go="${Q.t.w}">이 단어 이어 배우기</button></div>`:''}
  <p class="hint">오답 보기는 반대말·같은 글자·같은 주제의 단어에서 골라서, 헷갈리는 단어를 구분하는 연습이 돼요.</p>`}

const TABS=[['study','이어 배우기'],['themes','주제별'],['list','전체 단어'],['kr','한국어와 비교'],['quiz','퀴즈']];
function render(){
  $('#tabs').innerHTML=TABS.map(([k,t])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${t}</button>`).join('');
  const n=S.learned.size;
  $('#prog').innerHTML=LEVELS.map(l=>{const a=D.filter(d=>d.lv===l);return `${l}급 ${a.filter(d=>S.learned.has(d.w)).length}/${a.length}`}).join(' · ')+`<div class="bar"><i style="width:${Math.round(n/D.length*100)}%"></i></div>`;
  $('#app').innerHTML=S.tab==='study'?study():S.tab==='themes'?themes():S.tab==='list'?list():S.tab==='kr'?korea():quiz();
  const q=$('#q');if(q)q.addEventListener('input',()=>{S.q=q.value;$('#grid').innerHTML=gridH()});
  const t=$('.trail');if(t)t.scrollLeft=t.scrollWidth}
function top(){try{$('#tabs').scrollIntoView({block:'start'})}catch(e){}}

function peek(w){const d=MAP.get(w);if(!d)return;
  let k=document.getElementById('peek');if(k)k.remove();
  k=document.createElement('dialog');k.id='peek';
  k.style.cssText='border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(420px,92vw);padding:18px;font:inherit;line-height:1.5';
  const ko=(typeof kinfo==='function'&&kinfo(d.w))||null;
  k.innerHTML=`<div style="display:flex;gap:14px;align-items:center"><button data-say="${d.w}" aria-label="${d.w} 듣기" style="flex:none;background:var(--sign);color:#fff;border:0;border-radius:12px;padding:10px 14px;font:900 2rem/1.1 var(--f-han);max-width:60%;overflow-wrap:anywhere">${d.w}</button><div style="min-width:0"><button data-go="${d.w}" aria-label="${d.w} 단어로 이동" style="background:none;border:0;border-bottom:2px dotted var(--sign);padding:0;font:600 1.15rem var(--f-py);color:inherit;cursor:pointer;text-align:left">${pyH(d.py)}</button><div style="font-size:.78rem;color:var(--muted);margin-top:2px">병음을 누르면 이 단어로 이동</div></div></div>
  <p style="margin:12px 0 2px;font-size:1.1rem;font-weight:700">${d.mean}</p><p style="margin:0;color:var(--muted);font-size:.85rem">HSK ${d.lv}급 · ${d.pos}${d.th?' · '+d.th:''}</p>
  ${ko?`<p style="margin:8px 0 0;font-size:.88rem;background:var(--soft);border-radius:8px;padding:6px 10px">한국어 “${ko[1]}” ${ko[0]==='s'?'· 뜻도 같아요':'· 뜻이 달라요'}</p>`:''}
  <p lang="zh-CN" style="margin:12px 0 0;font:500 1.15rem/1.6 var(--f-han)">${d.ex.z} <button data-say="${d.ex.z}" aria-label="예문 듣기" style="vertical-align:middle;margin-left:6px;min-height:26px;padding:1px 9px;border:0;border-radius:8px;background:var(--sign);color:#fff;font:600 .72rem var(--f-ui,inherit);cursor:pointer">▶ 문장 듣기</button></p><p style="margin:0;font-size:.85rem;color:var(--muted)">${d.ex.py}</p><p style="margin:0;font-size:.9rem">${d.ex.k}</p>
  <form method="dialog" style="text-align:right;margin-top:10px"><button style="padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700">닫기</button></form>`;
  k.addEventListener('click',ev=>{if(ev.target===k)k.close()});
  document.body.appendChild(k);try{k.showModal()}catch(e){k.setAttribute('open','')}}
function closePeek(){const k=document.getElementById('peek');if(k&&k.open)k.close()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const x=b.dataset;
  if(x.tab){S.tab=x.tab;render();return}
  if(x.say){say(x.say);return}
  if(x.go&&e.target.closest('.cc,.tc')){say(x.go);return}
  if(x.go&&b.matches('.chip,.tile')){peek(x.go);return}
  if(x.go){closePeek();go(x.go);S.tab='study';render();top();return}
  if(x.tr!==undefined){const i=+x.tr;S.cur=S.trail[i];S.trail=S.trail.slice(0,i+1);save();render();return}
  if(x.lvf!==undefined){S.lvf=+x.lvf;render();return}
  if(x.lvk!==undefined){S.lvk=+x.lvk;render();return}
  if(x.lvq!==undefined){S.lvq=+x.lvq;S.quiz=null;render();return}
  if(x.mode){S.mode=x.mode;S.quiz=null;render();return}
  if(x.opt!==undefined){const Q=S.quiz;if(Q.pick!==null)return;Q.pick=+x.opt;S.score.n++;if(Q.opts[Q.pick]===Q.t[Q.key])S.score.ok++;render();return}
  const a=x.act;if(!a)return;
  if(a==='learn'){S.learned.has(S.cur)?S.learned.delete(S.cur):S.learned.add(S.cur);save();render()}
  else if(a==='next'){go(pickNext());render();top()}
  else if(a==='clear'){S.trail=[S.cur];render()}
  else if(a==='onlynew'){S.onlyNew=!S.onlyNew;render()}
  else if(a==='qnext'){S.quiz=newQ();render()}
});
render();
})();

</script></body></html>
