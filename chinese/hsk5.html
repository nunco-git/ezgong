      <h1>HSK 5급 꼬리잡기</h1>
      <p class="sub">HSK 5급 신출 1298단어를 같은 글자, 반대말, 주제, 예문으로 이어 배워요<br>한자를 누르면 발음, 카드를 누르면 설명 창, 창에서 병음을 누르면 그 단어로 이동해요 · <button type="button" data-help style="background:none;border:0;padding:0;color:var(--sign);text-decoration:underline;font:inherit;cursor:pointer">음성이 안 나오나요?</button></p>

<script>
// W(단어, 병음(음절마다 띄어쓰기), 품사, 뜻, [예문, 병음, 번역], 팁)
const D=[]; let LV=1, TH='';
function lv(n){LV=n}
function th(n){TH=n}
function W(w,py,pos,mean,ex,tip){D.push({w,py,pos,mean,ex:{z:ex[0],py:ex[1],k:ex[2]},tip:tip||'',lv:LV,th:TH})}
// P(단어A, 단어B, 관계 이름) : 반대말·짝
const PR=[];
function P(a,b,label){PR.push({a,b,label:label||'반대말'})}

lv(5);
th("사람·직업·관계");
W("班主任","bān zhǔ rèn","명사","담임 교사",["我们的班主任很年轻。","wǒ men de bān zhǔ rèn hěn nián qīng。","우리 담임 선생님은 아주 젊어요."]);
W("彼此","bǐ cǐ","대명사","서로",["我们彼此都很了解。","wǒ men bǐ cǐ dōu hěn liǎo jiě。","우리는 서로를 잘 알아요."]);
W("吵架","chǎo jià","동사","다투다",["他们又吵架了。","tā men yòu chǎo jià le。","그들은 또 다퉜어요."]);
W("称呼","chēng hu","동사","부르다, 호칭",["你怎么称呼他？","nǐ zěn me chēng hū tā？","그를 어떻게 불러요?"]);
W("打交道","dǎ jiāo dào","동사","교제하다, 상대하다",["我常常跟外国人打交道。","wǒ cháng cháng gēn wài guó rén dǎ jiāo dào。","저는 외국인과 자주 접해요."]);
W("打招呼","dǎ zhāo hu","동사","인사하다",["他跟我打招呼了。","tā gēn wǒ dǎ zhāo hu le。","그가 저에게 인사했어요."]);
W("胆小鬼","dǎn xiǎo guǐ","명사","겁쟁이",["你别做胆小鬼。","nǐ bié zuò dǎn xiǎo guǐ。","겁쟁이가 되지 마세요."]);
W("导演","dǎo yǎn","명사","감독",["这部电影的导演很有名。","zhè bù diàn yǐng de dǎo yǎn hěn yǒu míng。","이 영화의 감독은 아주 유명해요."]);
W("对方","duì fāng","명사","상대방",["你要听听对方的意见。","nǐ yào tīng tīng duì fāng de yì jiàn。","상대방의 의견을 들어 봐야 해요."]);
W("对手","duì shǒu","명사","상대, 적수",["他是我最强的对手。","tā shì wǒ zuì qiáng de duì shǒu。","그는 제 가장 강한 상대예요."]);
W("对象","duì xiàng","명사","대상, 연애 상대",["他在找结婚对象。","tā zài zhǎo jié hūn duì xiàng。","그는 결혼 상대를 찾고 있어요."]);
W("房东","fáng dōng","명사","집주인",["房东来收房租了。","fáng dōng lái shōu fáng zū le。","집주인이 월세를 받으러 왔어요."]);
W("妇女","fù nǚ","명사","부녀자",["这里的妇女都很勤劳。","zhè lǐ de fù nǚ dōu hěn qín láo。","이곳 여성들은 모두 부지런해요."]);
W("告别","gào bié","동사","작별하다",["他向大家告别了。","tā xiàng dà jiā gào bié le。","그는 모두에게 작별 인사를 했어요."]);
W("个人","gè rén","명사","개인",["这是我个人的看法。","zhè shì wǒ gè rén de kàn fǎ。","이것은 제 개인적인 의견이에요."]);
W("各自","gè zì","대명사","각자",["大家各自回家了。","dà jiā gè zì huí jiā le。","모두 각자 집에 갔어요."]);
W("工程师","gōng chéng shī","명사","엔지니어",["他是一名工程师。","tā shì yī míng gōng chéng shī。","그는 엔지니어예요."]);
W("工人","gōng rén","명사","노동자",["工人们正在工厂里干活。","gōng rén men zhèng zài gōng chǎng lǐ gàn huó。","노동자들이 공장에서 일하고 있어요."]);
W("公主","gōng zhǔ","명사","공주",["这个故事里有一位公主。","zhè ge gù shì lǐ yǒu yī wèi gōng zhǔ。","이 이야기에는 공주가 한 명 나와요."]);
W("沟通","gōu tōng","동사","소통하다",["我们要多沟通。","wǒ men yào duō gōu tōng。","우리는 소통을 많이 해야 해요."]);
W("姑姑","gū gu","명사","고모",["姑姑住在北京。","gū gū zhù zài běi jīng。","고모는 베이징에 살아요."]);
W("姑娘","gū niang","명사","아가씨",["那个姑娘很漂亮。","nà ge gū niáng hěn piào liàng。","저 아가씨는 아주 예뻐요."]);
W("光临","guāng lín","동사","왕림하다",["欢迎光临！","huān yíng guāng lín！","어서 오세요!"]);
W("华裔","Huá yì","명사","화교 후손",["他是美国华裔。","tā shì měi guó huá yì。","그는 미국 화교예요."]);
W("皇帝","huáng dì","명사","황제",["古代中国有很多皇帝。","gǔ dài zhōng guó yǒu hěn duō huáng dì。","고대 중국에는 황제가 많았어요."]);
W("皇后","huáng hòu","명사","황후",["皇后住在宫殿里。","huáng hòu zhù zài gōng diàn lǐ。","황후는 궁전에 살아요."]);
W("婚礼","hūn lǐ","명사","결혼식",["我参加了朋友的婚礼。","wǒ cān jiā le péng yǒu de hūn lǐ。","저는 친구의 결혼식에 참석했어요."]);
W("婚姻","hūn yīn","명사","혼인",["他们的婚姻很幸福。","tā men de hūn yīn hěn xìng fú。","그들의 결혼 생활은 행복해요."]);
W("伙伴","huǒ bàn","명사","동료, 파트너",["他是我的好伙伴。","tā shì wǒ de hǎo huǒ bàn。","그는 저의 좋은 동료예요."]);

function pyH(py){return py.split(' ').map(s=>`<span class="t${tone(s)}">${s}</span>`).join(' ')}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function seg(t){const out=[];let i=0;while(i<t.length){let hit=null;for(let l=Math.min(6,t.length-i);l>=1;l--){const s=t.substr(i,l);if(MAP.has(s)){hit=s;break}}
  if(hit){out.push({t:hit,w:true});i+=hit.length}else{out.push({t:t[i],w:false});i++}}return out}
const sentWords=d=>[...new Set(seg(d.ex.z).filter(x=>x.w).map(x=>x.t))];

function nbrs(w){
  const d=MAP.get(w),seen=new Set([w]),o={pair:[],char:[],sent:[],theme:[]};
  const take=(k,list,max)=>{for(const x of list){if(o[k].length>=max)break;if(seen.has(x.c))continue;seen.add(x.c);o[k].push(x)}};
  take('pair',PR.filter(p=>p.a===w||p.b===w).map(p=>({c:p.a===w?p.b:p.a,why:p.label})),12);
  const ch=[...d.w].filter(c=>!STOP.has(c));
  const cl=[];for(const e of D){if(e.w===w)continue;const sh=ch.filter(c=>e.w.includes(c));if(sh.length)cl.push({c:e.w,why:'같은 글자 '+sh.join(''),n:sh.length,l:Math.abs(e.lv-d.lv)})}
  cl.sort((a,b)=>b.n-a.n||a.l-b.l||IDX.get(a.c)-IDX.get(b.c));take('char',cl,10);
  const fw=sentWords(d).filter(x=>x!==w).map(c=>({c,why:'이 단어의 예문에 나와요'}));
  const rev=D.filter(e=>e.w!==w&&e.ex.z.includes(w)&&sentWords(e).includes(w)).sort((a,b)=>a.lv-b.lv).slice(0,4).map(e=>({c:e.w,why:'이 단어가 나오는 예문'}));
  take('sent',[...fw,...rev],10);
  const i=IDX.get(w),f=fam(d.th);
  const tl=D.filter(e=>e.w!==w&&fam(e.th)===f).sort((a,b)=>Math.abs(IDX.get(a.w)-i)-Math.abs(IDX.get(b.w)-i)).map(e=>({c:e.w,why:f}));
  take('theme',tl,10);
  return o}
function allN(w){const o=nbrs(w);return [...o.pair,...o.char,...o.sent,...o.theme].map(x=>x.c)}
const REL=[

 ['char','같은 글자가 들어간 단어','글자 하나만 알아도 단어가 줄줄이 이어져요','var(--t1)'],

function pickNext(){

  let c=n.filter(x=>!S.trail.includes(x)&&!S.learned.has(x));

  if(!c.length)c=D.map(d=>d.w).filter(x=>!S.learned.has(x)&&x!==S.cur);
  if(!c.length)c=D.map(d=>d.w).filter(x=>x!==S.cur);
  return c[Math.floor(Math.random()*c.length)]}

const AUDIO_BASE=/(^|\.)smartgong\.kr$/.test(location.hostname)?'/chinese/a/':'https://www.smartgong.kr/chinese/a/';
function audioKey(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
const NET={dead:false},EL=new Audio();
function tryPlay(src,ms,onFail){let ok=false,dead=false;const bad=()=>{if(dead||ok)return;dead=true;onFail()};

  try{EL.src=src;const p=EL.play();if(p&&p.catch)p.catch(bad)}catch(e){bad();return}

  const L=D.filter(d=>kinfo(d.w)&&(!S.lvk||d.lv===S.lvk));
  const sm=L.filter(d=>kinfo(d.w)[0]==='s'),df=L.filter(d=>kinfo(d.w)[0]==='d');
  const kt=d=>{const k=kinfo(d.w);return `<button class="tile${S.learned.has(d.w)?' done':''}" data-go="${d.w}"><span class="lv">${d.lv}급</span><span class="tc">${d.w}</span><span class="tp">${pyH(d.py)}</span><span class="tm">${d.mean}</span><span class="tm" style="color:var(--t3)">한국어 ${k[1]}</span></button>`};
  const dc=d=>{const k=kinfo(d.w);return `<button class="chip" data-go="${d.w}"><span class="cc">${d.w}</span><span class="ct"><span class="cp">${pyH(d.py)}</span><span class="cm">${d.mean}</span><span class="cw">한국어 “${k[1]}”: ${k[2]}</span></span></button>`};
  return `<p class="gn" style="margin-top:16px">중국어 한자어는 한국어 한자음으로 읽어서 뜻이 통하는 말(동형동의어)이 많아요. 반대로 한자는 같은데 뜻이 달라 헷갈리기 쉬운 말(동형이의어)은 따로 모아 두었어요.</p>
  <div class="row"><button class="fb" data-lvk="0" aria-pressed="${S.lvk===0}">전체</button>${LEVELS.map(l=>`<button class="fb" data-lvk="${l}" aria-pressed="${S.lvk===l}">${l}급</button>`).join('')}</div>
  <section class="grp"><div class="gt">뜻이 달라요 · 동형이의어<span class="tag">${df.length}개</span></div><div class="chips" style="margin-top:8px">${df.map(dc).join('')||'<p class="hint">이 급수에는 없어요.</p>'}</div></section>
  <section class="grp"><div class="gt">뜻이 같아요 · 동형동의어<span class="tag">${sm.length}개</span></div><div class="grid" style="margin-top:8px">${sm.map(kt).join('')||'<p class="hint">이 급수에는 없어요.</p>'}</div></section>`}

function themes(){
  const fams=[...new Set(D.map(d=>fam(d.th)))];
  return `<p class="gn" style="margin-top:16px">같은 상황에서 함께 쓰는 단어끼리 모았어요. 단어를 누르면 이어 배우기로 넘어가요.</p>`+fams.map(f=>{const l=D.filter(d=>fam(d.th)===f);
    return `<section class="grp"><div class="gt">${f}<span class="tag">${l.length}개</span></div><div class="grid" style="margin-top:8px">${l.map(d=>tile(d.w)).join('')}</div></section>`}).join('')}

function matches(d){
  if(S.lvf&&d.lv!==S.lvf)return false;
  if(S.onlyNew&&S.learned.has(d.w))return false;
  const q=S.q.trim().toLowerCase();if(!q)return true;
  return d.w.includes(q)||base(d.py).includes(base(q))||d.mean.toLowerCase().includes(q)||d.pos.includes(q)||d.th.includes(q)}
function gridH(){const l=D.filter(matches);return (l.length?`<p class="hint" style="grid-column:1/-1;margin:0">${l.length}개</p>`+l.map(d=>tile(d.w)).join(''):'<p class="hint">조건에 맞는 단어가 없어요.</p>')}
function list(){
  return `<div class="row"><input type="search" id="q" placeholder="단어, 병음(예: xuesheng), 한글 뜻으로 찾기" value="${S.q.replace(/"/g,'&quot;')}" aria-label="단어 찾기"></div>
  <div class="row"><button class="fb" data-lvf="0" aria-pressed="${S.lvf===0}">전체</button>${LEVELS.map(l=>`<button class="fb" data-lvf="${l}" aria-pressed="${S.lvf===l}">${l}급</button>`).join('')}<button class="fb" data-act="onlynew" aria-pressed="${S.onlyNew}">아직 안 익힌 것만</button></div>
  <div class="grid" id="grid">${gridH()}</div>`}

function newQ(){
  let pool=D.filter(d=>!S.lvq||d.lv===S.lvq);
  const t=pool[Math.floor(Math.random()*pool.length)];
  const key=S.mode==='mean'?'mean':S.mode==='word'?'w':'py';
  const val=d=>d[key];
  const wrong=[];
  for(const w of shuffle(allN(t.w))){const v=val(MAP.get(w));if(v!==val(t)&&!wrong.includes(v))wrong.push(v);if(wrong.length>=3)break}
  for(const x of shuffle(D.filter(e=>e.lv===t.lv))){if(wrong.length>=3)break;if(val(x)!==val(t)&&!wrong.includes(val(x)))wrong.push(val(x))}
  return {t,key,opts:shuffle([val(t),...wrong]),pick:null}}
function quiz(){
  if(!S.quiz)S.quiz=newQ();
  const Q=S.quiz,done=Q.pick!==null,ok=done&&Q.opts[Q.pick]===Q.t[Q.key];
  const showMean=S.mode==='word';
  return `<div class="row"><button class="fb" data-mode="mean" aria-pressed="${S.mode==='mean'}">뜻 맞히기</button><button class="fb" data-mode="word" aria-pressed="${S.mode==='word'}">단어 맞히기</button><button class="fb" data-mode="py" aria-pressed="${S.mode==='py'}">병음·성조 맞히기</button></div>
  <div class="row"><button class="fb" data-lvq="0" aria-pressed="${S.lvq===0}">전체 급수</button>${LEVELS.map(l=>`<button class="fb" data-lvq="${l}" aria-pressed="${S.lvq===l}">${l}급만</button>`).join('')}<span class="score">맞힌 문제 ${S.score.ok} / ${S.score.n}</span></div>
  <div class="qbig" lang="${showMean?'ko':'zh-CN'}"${showMean?' style="font-size:2rem"':''}>${showMean?Q.t.mean:Q.t.w}</div>
  <p style="margin:0 0 10px;font-weight:700">${S.mode==='mean'?'이 단어의 뜻은?':S.mode==='word'?'이 뜻에 맞는 단어는?':'이 단어의 병음(성조 포함)은?'}</p>
  <div class="opts">${Q.opts.map((o,i)=>`<button class="opt${done?(o===Q.t[Q.key]?' right':i===Q.pick?' wrong':''):''}" data-opt="${i}"${done?' disabled':''}>${o}</button>`).join('')}</div>
  ${done?`<p class="fb2">${ok?'정답이에요!':'아쉬워요. 정답은 “'+Q.t[Q.key]+'”'}</p><div class="acts"><button class="btn pri" data-act="qnext">다음 문제</button><button class="btn" data-go="${Q.t.w}">이 단어 이어 배우기</button></div>`:''}
  <p class="hint">오답 보기는 반대말·같은 글자·같은 주제의 단어에서 골라서, 헷갈리는 단어를 구분하는 연습이 돼요.</p>`}

const TABS=[['study','이어 배우기'],['themes','주제별'],['list','전체 단어'],['kr','한국어와 비교'],['quiz','퀴즈']];
function render(){
  $('#tabs').innerHTML=TABS.map(([k,t])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${t}</button>`).join('');
  const n=S.learned.size;
  $('#prog').innerHTML=LEVELS.map(l=>{const a=D.filter(d=>d.lv===l);return `${l}급 ${a.filter(d=>S.learned.has(d.w)).length}/${a.length}`}).join(' · ')+`<div class="bar"><i style="width:${Math.round(n/D.length*100)}%"></i></div>`;
  $('#app').innerHTML=S.tab==='study'?study():S.tab==='themes'?themes():S.tab==='list'?list():S.tab==='kr'?korea():quiz();
  const q=$('#q');if(q)q.addEventListener('input',()=>{S.q=q.value;$('#grid').innerHTML=gridH()});
  const t=$('.trail');if(t)t.scrollLeft=t.scrollWidth}
function top(){try{$('#tabs').scrollIntoView({block:'start'})}catch(e){}}

function peek(w){const d=MAP.get(w);if(!d)return;
  let k=document.getElementById('peek');if(k)k.remove();
  k=document.createElement('dialog');k.id='peek';
  k.style.cssText='border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(420px,92vw);padding:18px;font:inherit;line-height:1.5';
  const ko=(typeof kinfo==='function'&&kinfo(d.w))||null;
  k.innerHTML=`<div style="display:flex;gap:14px;align-items:center"><button data-say="${d.w}" aria-label="${d.w} 듣기" style="flex:none;background:var(--sign);color:#fff;border:0;border-radius:12px;padding:10px 14px;font:900 2rem/1.1 var(--f-han);max-width:60%;overflow-wrap:anywhere">${d.w}</button><div style="min-width:0"><button data-go="${d.w}" aria-label="${d.w} 단어로 이동" style="background:none;border:0;border-bottom:2px dotted var(--sign);padding:0;font:600 1.15rem var(--f-py);color:inherit;cursor:pointer;text-align:left">${pyH(d.py)}</button><div style="font-size:.78rem;color:var(--muted);margin-top:2px">병음을 누르면 이 단어로 이동</div></div></div>
  <p style="margin:12px 0 2px;font-size:1.1rem;font-weight:700">${d.mean}</p><p style="margin:0;color:var(--muted);font-size:.85rem">HSK ${d.lv}급 · ${d.pos}${d.th?' · '+d.th:''}</p>
  ${ko?`<p style="margin:8px 0 0;font-size:.88rem;background:var(--soft);border-radius:8px;padding:6px 10px">한국어 “${ko[1]}” ${ko[0]==='s'?'· 뜻도 같아요':'· 뜻이 달라요'}</p>`:''}
  <p lang="zh-CN" style="margin:12px 0 0;font:500 1.15rem/1.6 var(--f-han)">${d.ex.z}</p><p style="margin:0;font-size:.85rem;color:var(--muted)">${d.ex.py}</p><p style="margin:0;font-size:.9rem">${d.ex.k}</p>
  <form method="dialog" style="text-align:right;margin-top:10px"><button style="padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700">닫기</button></form>`;
  k.addEventListener('click',ev=>{if(ev.target===k)k.close()});
  document.body.appendChild(k);try{k.showModal()}catch(e){k.setAttribute('open','')}}
function closePeek(){const k=document.getElementById('peek');if(k&&k.open)k.close()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const x=b.dataset;
  if(x.tab){S.tab=x.tab;render();return}
  if(x.say){say(x.say);return}
  if(x.go&&e.target.closest('.cc,.tc')){say(x.go);return}
  if(x.go&&b.matches('.chip,.tile')){peek(x.go);return}
  if(x.go){closePeek();go(x.go);S.tab='study';render();top();return}
  if(x.tr!==undefined){const i=+x.tr;S.cur=S.trail[i];S.trail=S.trail.slice(0,i+1);save();render();return}
  if(x.lvf!==undefined){S.lvf=+x.lvf;render();return}
  if(x.lvk!==undefined){S.lvk=+x.lvk;render();return}
  if(x.lvq!==undefined){S.lvq=+x.lvq;S.quiz=null;render();return}
  if(x.mode){S.mode=x.mode;S.quiz=null;render();return}
  if(x.opt!==undefined){const Q=S.quiz;if(Q.pick!==null)return;Q.pick=+x.opt;S.score.n++;if(Q.opts[Q.pick]===Q.t[Q.key])S.score.ok++;render();return}
  const a=x.act;if(!a)return;
  if(a==='learn'){S.learned.has(S.cur)?S.learned.delete(S.cur):S.learned.add(S.cur);save();render()}
  else if(a==='next'){go(pickNext());render();top()}
  else if(a==='clear'){S.trail=[S.cur];render()}
  else if(a==='onlynew'){S.onlyNew=!S.onlyNew;render()}
  else if(a==='qnext'){S.quiz=newQ();render()}
});
render();
})();

</script></body></html>
