# 체크인·탑승
我要办理登机手续。|Wǒ yào bànlǐ dēngjī shǒuxù.|탑승 수속을 하고 싶어요.
我想要靠窗的座位。|Wǒ xiǎng yào kào chuāng de zuòwèi.|창가 좌석으로 주세요.
我想要靠过道的座位。|Wǒ xiǎng yào kào guòdào de zuòwèi.|통로 쪽 좌석으로 주세요.
我要托运这个行李。|Wǒ yào tuōyùn zhège xíngli.|이 짐을 부치고 싶어요.
> 请把行李放在秤上。|Qǐng bǎ xíngli fàng zài chèng shang.|짐을 저울 위에 올려 주세요.
这个包可以带上飞机吗？|Zhège bāo kěyǐ dài shàng fēijī ma?|이 가방은 기내에 들고 탈 수 있나요?
登机口在哪里？|Dēngjīkǒu zài nǎlǐ?|탑승구가 어디예요?
这趟航班准点吗？|Zhè tàng hángbān zhǔndiǎn ma?|이 항공편은 정시에 출발하나요?
航班延误了吗？|Hángbān yánwù le ma?|항공편이 지연됐나요?

请出示您的护照。|Qǐng chūshì nín de hùzhào.|여권을 보여 주세요. (심사관)
你来中国的目的是什么？|Nǐ lái Zhōngguó de mùdì shì shénme?|중국에 오신 목적이 무엇입니까?

你打算待多久？|Nǐ dǎsuàn dāi duōjiǔ?|얼마나 머물 예정입니까?

你住在哪里？|Nǐ zhù zài nǎlǐ?|어디에 묵으십니까?

我没有需要申报的东西。|Wǒ méiyǒu xūyào shēnbào de dōngxi.|신고할 물건이 없어요.

  tryPlay(src,3000,null,()=>{sayToast('중국어 음성을 재생할 수 없어요. 기기 설정에서 중국어 음성을 추가해 주세요. (안드로이드: 설정 > 텍스트 음성 변환 > 중국어 음성 데이터 설치)',8000)})}
function sayOnline(t,id){if(TTS.netDead){sayEmbedded(t);return}
  const q=encodeURIComponent(t);
  const urls=['https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q='+q,'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=zh-CN&q='+q,'https://dict.youdao.com/dictvoice?le=zh&audio='+q];
  let i=0;const next=()=>{if(id!==TTS.seq)return;if(i>=urls.length){TTS.netDead=true;sayEmbedded(t);return}tryPlay(urls[i++],2200,null,next)};next()}
function say(t){const id=++TTS.seq;try{TTS.el.pause()}catch(e){}
  if(!('speechSynthesis' in window)){sayOnline(t,id);return}
  const go=vs=>{if(id!==TTS.seq)return;
    const v=pickVoice(vs);
    if(!v&&vs.length){sayOnline(t,id);return}
    let started=false,moved=false;
    const fb=()=>{if(started||moved||id!==TTS.seq)return;moved=true;try{speechSynthesis.cancel()}catch(e){}sayOnline(t,id)};
    try{const u=new SpeechSynthesisUtterance(t);u.lang=v?v.lang:'zh-CN';if(v)u.voice=v;u.rate=.85;u.pitch=1;u.volume=1;
      u.onstart=()=>{started=true};u.onerror=e=>{if(e&&(e.error==='interrupted'||e.error==='canceled'))return;fb()};
      const run=()=>{if(id!==TTS.seq)return;try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){fb()}setTimeout(fb,3500)};
      if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(run,90)}else run()}catch(e){fb()}};
  const vs=voicesNow();
  if(vs.length||TTS.loaded)go(vs);else voicesReady(1500).then(go)}

  <button data-say="你好，欢迎学习汉语。" style="${btn};border:0;cursor:pointer;margin-top:8px">▶ 소리 테스트 (你好)</button>
  <p style="margin:8px 0 0;font-size:.82rem;color:var(--muted)">기기 설정을 앱이 대신 열거나 설치해 줄 수는 없어요. 바로가기 버튼을 눌러도 아무 반응이 없으면 폰이 막은 것이니 위 메뉴를 직접 따라가 주세요.</p>`;
  else if(ios)h+='<p><b>아이폰·아이패드</b></p><ol style="margin:8px 0;padding-left:20px"><li>설정 → 손쉬운 사용 → 말하는 콘텐츠 → 음성</li><li>중국어 → Ting-Ting(또는 Li-mu) 선택</li><li>다운로드 아이콘을 눌러 설치</li></ol>';
  else if(win)h+=`<p><b>윈도우</b></p><a style="${btn}" href="ms-settings:speech">음성 설정 열기</a><ol style="margin:8px 0;padding-left:20px"><li>설정 → 시간 및 언어 → 언어 및 지역 → 언어 추가 → 中文(简体)</li><li>설치 옵션에서 "텍스트 음성 변환"(음성) 체크</li><li>설치 후 브라우저를 다시 시작</li></ol><p style="font-size:.85rem;color:var(--muted)">크롬은 시스템 음성이 없어도 온라인 음성으로 재생을 시도해요. 엣지는 "Microsoft Huihui" 등 중국어 음성을 쓸 수 있어요.</p>`;

  else h+='<p>기기 설정의 언어·음성(텍스트 음성 변환) 항목에서 중국어(简体) 음성을 설치해 주세요.</p>';

document.addEventListener('click',e=>{if(e.target.closest('[data-help]'))showHelp()});

(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SPK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6 6 0 0 1 0 9"/></svg>';
const TM={'āēīōūǖ':1,'áéíóúǘ':2,'ǎěǐǒǔǚ':3,'àèìòùǜ':4};
function tone(s){for(const c of s){for(const k in TM){if(k.includes(c))return TM[k]}}return 5}
const V='aeiouüvāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ';
const SYL=new RegExp('(?:zh|ch|sh|[bpmfdtnlgkhjqxzcsrwy])?['+V+']+(?:ng|n(?!['+V+'])|r(?!['+V+']))?|.','gi');
function pyH(p){return p.replace(/\S+/g,w=>(w.match(SYL)||[w]).map(s=>/[a-zA-Z]/.test(s)?`<span class="t${tone(s)}">${s}</span>`:s).join(''))}
/* 데이터 파싱 */
const CATS=[],P=[];let cat=null,grp='';
for(const raw of DATA.split('\n')){const l=raw.trim();if(!l)continue;
  if(l.startsWith('## ')){const[id,name,ic]=l.slice(3).split('|');cat={id,name,ic,n:0};CATS.push(cat);continue}
  if(l[0]==='#'){grp=l.slice(1).trim();continue}
  const re=l[0]==='>';const[z,p,k]=(re?l.slice(1).trim():l).split('|');
  P.push({z,p,k,c:cat.id,g:grp,re});cat.n++}
const store={get(){try{return JSON.parse(localStorage.getItem('talk-v1')||'{}')}catch(e){return{}}},set(v){try{localStorage.setItem('talk-v1',JSON.stringify(v))}catch(e){}}};
const S={tab:'study',cat:CATS[0].id,q:'',py:true,hide:false,fav:new Set(store.get().fav||[]),qm:'listen',qc:'all',right:0,wrong:0,streak:0,cur:null,done:false};
function save(){store.set({fav:[...S.fav]})}
$('#cnt').textContent='· 표현 '+P.length+'개';
function tabs(){const T=[['study','표현'],['quiz','퀴즈'],['fav','★ 저장 '+S.fav.size]];
  $('#tabs').innerHTML=T.map(([k,n])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${n}</button>`).join('')}
function card(x){const f=S.fav.has(x.z);
  return `${x.re?'':''}<div class="ph${x.re?' re':''}">
  <button class="sp" data-say="${esc(x.z)}" aria-label="듣기">${SPK}</button>
  <button class="zh" data-say="${esc(x.z)}" lang="zh-CN">${esc(x.z)}</button>
  <div class="pp${S.py?'':' hid'}">${pyH(x.p)}</div>
  <div class="ko${S.hide?' hid':''}" ${S.hide?'data-reveal':''}>${esc(x.k)}</div>
  <button class="fv" data-fav="${esc(x.z)}" aria-pressed="${f}" aria-label="저장">${f?'★':'☆'}</button></div>`}
function list(items,showGrp){let h='',g='';for(const x of items){if(showGrp&&x.g!==g){g=x.g;h+=`<div class="grp">${esc(g)}</div>`}
  if(x.re&&showGrp)h+='';h+=card(x)}return h}
function study(){
  const q=S.q.trim().toLowerCase();
  let items=P.filter(x=>q?(x.z.includes(q)||x.k.toLowerCase().includes(q)||x.p.toLowerCase().includes(q)||x.p.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().includes(q)):x.c===S.cat);

  $('#app').innerHTML=`<div class="cats">${cats}</div>
  <div class="tools"><input type="search" id="q" placeholder="표현 찾기 (한국어·중국어·병음)" value="${esc(S.q)}">
  <button class="tg" data-tg="py" aria-pressed="${S.py}">병음 보기</button><button class="tg" data-tg="hide" aria-pressed="${S.hide}">한국어 가리기</button></div>
  <div class="tipbox">병음 색: <span class="t1">1성(ˉ)</span> <span class="t2">2성(ˊ)</span> <span class="t3">3성(ˇ)</span> <span class="t4">4성(ˋ)</span> <span class="t5">경성</span> · 들여 쓴 점선 카드는 상대방이 할 법한 말·대답이에요.</div>
  <div id="lst">${items.length?list(items,!q):'<div class="empty">찾는 표현이 없어요.</div>'}</div>`;
  const inp=$('#q');inp.addEventListener('input',()=>{S.q=inp.value;const pos=inp.selectionStart;renderList()})}
function renderList(){const q=S.q.trim().toLowerCase();
  const items=P.filter(x=>q?(x.z.includes(q)||x.k.toLowerCase().includes(q)||x.p.toLowerCase().includes(q)||x.p.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().includes(q)):x.c===S.cat);
  $('#lst').innerHTML=items.length?list(items,!q):'<div class="empty">찾는 표현이 없어요.</div>';
  document.querySelectorAll('.cat').forEach(b=>b.setAttribute('aria-pressed',String(!q&&b.dataset.cat===S.cat)))}
function favView(){const items=P.filter(x=>S.fav.has(x.z));
  $('#app').innerHTML=`<div class="tools"><button class="tg" data-tg="py" aria-pressed="${S.py}">병음 보기</button><button class="tg" data-tg="hide" aria-pressed="${S.hide}">한국어 가리기</button></div><div id="lst">${items.length?list(items,false):'<div class="empty">☆를 눌러 표현을 저장해 두면 여기에 모여요.<br>여행 직전에 저장한 표현만 복습하세요.</div>'}</div>`}
/* 퀴즈 */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function pool(){return P.filter(x=>S.qc==='all'||x.c===S.qc)}
function newQ(){const pl=pool();const a=pl[Math.floor(Math.random()*pl.length)];
  const wrong=shuffle(pl.filter(x=>x.z!==a.z)).slice(0,3);S.cur={a,opts:shuffle([a,...wrong])};S.done=false}
function quiz(){
  if(!S.cur||(S.qc!=='all'&&S.cur.a.c!==S.qc))newQ();
  const {a,opts}=S.cur,L=S.qm==='listen';
  const seg=(id,arr,key)=>`<div class="seg2" id="${id}">${arr.map(([k,n])=>`<button type="button" data-${key}="${k}" aria-pressed="${S[key==='m'?'qm':'qc']===k}">${n}</button>`).join('')}</div>`;
  $('#app').innerHTML=`<div class="qwrap">
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${seg('qm',[['listen','듣고 뜻 고르기'],['read','뜻 보고 중국어 고르기']],'m')}</div>
  <div class="cats" style="justify-content:center;flex-wrap:wrap;overflow:visible"><button class="cat" data-qc="all" aria-pressed="${S.qc==='all'}">전체</button>${CATS.map(c=>`<button class="cat" data-qc="${c.id}" aria-pressed="${S.qc===c.id}">${c.ic} ${c.name}</button>`).join('')}</div>
  <div class="qscore"><span><b>${S.right}</b>맞음</span><span><b>${S.wrong}</b>틀림</span><span><b>${S.streak}</b>연속</span></div>
  <div class="qcard">
   ${L?`<button class="qs" data-say="${esc(a.z)}" aria-label="다시 듣기">${SPK}</button><div class="qk">무슨 뜻일까요?</div>`:`<div class="qk">${esc(a.k)}</div><div class="muted" style="color:var(--muted);font-size:.9rem">알맞은 중국어를 고르세요</div>`}
   <div class="qopts">${opts.map((o,i)=>`<button class="qopt${L?'':' zhopt'}" data-opt="${i}">${L?esc(o.k):esc(o.z)}</button>`).join('')}</div>
   <div class="qfb" id="qfb"></div>
  </div></div>`;
  if(L&&!S.done)setTimeout(()=>say(a.z),150)}
function answer(i){if(S.done)return;S.done=true;const {a,opts}=S.cur,ok=opts[i].z===a.z;
  if(ok){S.right++;S.streak++}else{S.wrong++;S.streak=0}
  document.querySelectorAll('.qopt').forEach((b,j)=>{if(opts[j].z===a.z)b.classList.add('ok');else if(j===i)b.classList.add('no');b.disabled=true});
  $('#qfb').innerHTML=`${ok?'맞아요!':'아쉬워요.'}<br><b lang="zh-CN">${esc(a.z)}</b><span class="pp">${pyH(a.p)}</span>${esc(a.k)}<br><button class="nxt" data-next style="margin-top:10px">다음 문제</button>`;
  document.querySelectorAll('.qscore b')[0].textContent=S.right;document.querySelectorAll('.qscore b')[1].textContent=S.wrong;document.querySelectorAll('.qscore b')[2].textContent=S.streak;
  if(!ok||S.qm==='read')say(a.z)}
function render(){tabs();if(S.tab==='study')study();else if(S.tab==='quiz')quiz();else favView()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.say){say(b.dataset.say);return}
  if(b.dataset.tab){S.tab=b.dataset.tab;render();window.scrollTo(0,0);return}
  if(b.dataset.cat){S.cat=b.dataset.cat;S.q='';render();return}
  if(b.dataset.tg){S[b.dataset.tg]=!S[b.dataset.tg];render();return}
  if(b.dataset.fav){const z=b.dataset.fav;S.fav.has(z)?S.fav.delete(z):S.fav.add(z);save();tabs();if(S.tab==='fav')favView();else{b.setAttribute('aria-pressed',String(S.fav.has(z)));b.textContent=S.fav.has(z)?'★':'☆'}return}
  if(b.dataset.m){S.qm=b.dataset.m;S.cur=null;S.right=S.wrong=S.streak=0;quiz();return}
  if(b.dataset.qc){S.qc=b.dataset.qc;S.cur=null;quiz();return}
  if(b.dataset.opt!==undefined){answer(+b.dataset.opt);return}
  if('next' in b.dataset){newQ();quiz();return}
});
document.addEventListener('click',e=>{const k=e.target.closest('[data-reveal]');if(k){k.classList.remove('hid');k.removeAttribute('data-reveal')}});
render();
})();
</script></body></html>
