      <h1>간체자 꼬리잡기</h1>
      <p class="sub">간판·거리·신문에 자주 나오는 글자를 모양, 소리, 단어로 이어 배워요<br>한자를 누르면 발음, 카드를 누르면 설명 창, 창에서 병음을 누르면 그 글자로 이동해요 · <button type="button" data-help style="background:none;border:0;padding:0;color:var(--sign);text-decoration:underline;font:inherit;cursor:pointer">음성이 안 나오나요?</button></p>
    </div>
    <div class="prog" id="prog"></div>

  <main id="app"></main>

<script>
// ---- 데이터 도우미 ----
// C(글자, 병음, 한자음, 뜻, 번체, [[단어, 병음(음절별 띄어쓰기), 뜻]...], [예문, 병음, 번역], 팁)
const D=[]; let CAT='';
function cat(n){CAT=n}
function C(ch,py,kr,mean,trad,words,ex,tip){
  D.push({ch,py,kr,mean,trad,words:words.map(w=>({w:w[0],py:w[1],m:w[2]})),ex:{z:ex[0],py:ex[1],k:ex[2]},tip:tip||'',cat:CAT});
}
// g(종류, 제목, 글자들, 설명) 종류: shape(모양/부품) | pair(짝·반대말)
const G=[];
function g(type,title,chars,note){G.push({type,title,chars:[...chars],note})}

cat('기본 표지');
C("门","mén","문","문","門",[["大门","dà mén","대문, 정문"],["门口","mén kǒu","문 앞, 입구"]],["门口有一家咖啡店。","Ménkǒu yǒu yì jiā kāfēidiàn.","입구에 커피숍이 하나 있다."],"네모난 문틀 모양이에요. 问·间·闻 같은 글자의 문틀(门) 부분이기도 해요.");
C("开","kāi","개","열다, 켜다","開",[["开门","kāi mén","문을 열다"],["开业","kāi yè","개업하다"]],["商店九点开门。","Shāngdiàn jiǔ diǎn kāi mén.","가게는 9시에 문을 연다."],"간판의 '开' = 영업 중. 반대말은 关(닫다)이에요.");
C("关","guān","관","닫다, 끄다","關",[["关门","guān mén","문을 닫다"],["关闭","guān bì","폐쇄하다"]],["晚上十点关门。","Wǎnshang shí diǎn guān mén.","저녁 10시에 문을 닫는다."],"开와 모양도 닮았고 뜻은 반대예요. 关于(~에 관하여)는 신문에 아주 자주 나와요.");
C("出","chū","출","나가다, 나오다","",[["出口","chū kǒu","출구"],["出发","chū fā","출발하다"]],["请从这个出口出去。","Qǐng cóng zhège chūkǒu chūqù.","이 출구로 나가 주세요."],"출구 표지의 '出口'. 반대는 入口(입구).");
C("入","rù","입","들어가다","",[["入口","rù kǒu","입구"],["收入","shōu rù","수입"]],["入口在大楼的左边。","Rùkǒu zài dàlóu de zuǒbian.","입구는 건물 왼쪽에 있다."],"人과 닮았지만 뜻은 '안으로 들어가다'예요.");
C("口","kǒu","구","입, 출입구","",[["门口","mén kǒu","문 앞, 입구"],["人口","rén kǒu","인구"]],["这个城市的人口很多。","Zhège chéngshì de rénkǒu hěn duō.","이 도시는 인구가 많다."],"입 모양이에요. 출입구(出口·入口)도 '口'라고 불러요.");
C("人","rén","인","사람","",[["人口","rén kǒu","인구"],["工人","gōng rén","노동자"]],["这里有很多人。","Zhèlǐ yǒu hěn duō rén.","여기에는 사람이 많다."],"사람이 서 있는 옆모습이에요.");
C("八","bā","팔","여덟","",[["八月","bā yuè","8월"],["十八","shí bā","18"]],["我家在八楼。","Wǒ jiā zài bā lóu.","우리 집은 8층이다."],"人·入과 헷갈리기 쉬워요. 八는 숫자 8이에요.");
C("大","dà","대","크다","",[["大门","dà mén","대문, 정문"],["大学","dà xué","대학"]],["这家超市很大。","Zhè jiā chāoshì hěn dà.","이 슈퍼마켓은 아주 크다."],"사람(人)이 팔다리를 크게 벌린 모양이에요.");
C("太","tài","태","너무, 매우","",[["太大","tài dà","너무 크다"],["太阳","tài yáng","태양"]],["这个太贵了。","Zhège tài guì le.","이건 너무 비싸다."],"大 아래에 점 하나. '太…了'는 '너무 ~하다'예요.");
C("天","tiān","천","하늘, 날","",[["今天","jīn tiān","오늘"],["天气","tiān qì","날씨"]],["今天天气很好。","Jīntiān tiānqì hěn hǎo.","오늘 날씨가 좋다."],"大 위에 하늘(一)이 있는 모양이에요.");
C("今","jīn","금","지금, 오늘","",[["今天","jīn tiān","오늘"],["今年","jīn nián","올해"]],["今年的夏天很热。","Jīnnián de xiàtiān hěn rè.","올해 여름은 덥다."],"金·紧과 소리가 같아요(jin).");
C("金","jīn","금","금, 돈","",[["现金","xiàn jīn","현금"],["黄金","huáng jīn","황금"]],["这里可以用现金。","Zhèlǐ kěyǐ yòng xiànjīn.","여기서는 현금을 쓸 수 있다."],"全과 모양이 닮았고 今과 소리가 같아요.");
C("全","quán","전","전부, 온전하다","",[["安全","ān quán","안전"],["全国","quán guó","전국"]],["请注意安全。","Qǐng zhùyì ānquán.","안전에 유의해 주세요."],"金과 닮았지만 아래에 점이 없어요.");
C("小","xiǎo","소","작다","",[["小心","xiǎo xīn","조심하다"],["小学","xiǎo xué","초등학교"]],["小心地滑。","Xiǎoxīn dì huá.","바닥이 미끄러우니 조심하세요."],"少와 모양이 닮았어요. 小 + 삐침 = 少");
C("少","shǎo","소","적다 (shào: 젊다)","",[["多少","duō shao","얼마, 몇"],["少年","shào nián","소년"]],["这里的人不少。","Zhèlǐ de rén bù shǎo.","여기는 사람이 적지 않다."],"다음자: '적다'는 shǎo, '젊다'는 shào(少年).");
C("多","duō","다","많다","",[["多少","duō shao","얼마, 몇"],["很多","hěn duō","아주 많다"]],["这个多少钱？","Zhège duōshao qián?","이건 얼마예요?"],"多少钱? 은 가장 많이 쓰는 가격 질문이에요.");

  if(and)h+=`<p style="margin:0 0 8px"><b>안드로이드 설정 방법</b> <span style="color:var(--muted);font-size:.82rem">(기종마다 메뉴 이름이 조금 달라요. 설정 맨 위 검색창에 "텍스트 음성 변환"을 입력하면 가장 빨라요)</span></p>
  <ol style="margin:0;padding-left:0;list-style:none;counter-reset:s">
  <li style="${stp}"><b>① 설정 앱 열기 → 텍스트 음성 변환 찾기</b><br>갤럭시: 설정 → 일반 → 언어 → <b>텍스트 음성 변환</b><br>그 밖의 폰: 설정 → 시스템 → 언어 및 입력 → <b>텍스트 음성 변환 출력</b><br><a style="${btn}" href="intent:#Intent;action=com.android.settings.TTS_SETTINGS;end">텍스트 음성 변환 설정 바로가기</a></li>
  <li style="${stp}"><b>② 선호하는 엔진을 "Google 음성 서비스"로 바꾸기</b><br>"삼성 텍스트 음성 변환"으로 되어 있으면 눌러서 <b>Google 음성 서비스</b>(Speech Services by Google)를 고르세요.<br>목록에 없으면 Play 스토어에서 설치해야 해요.<br><a style="${btn}" href="https://play.google.com/store/apps/details?id=com.google.android.tts" target="_blank" rel="noopener">Play 스토어에서 Google 음성 서비스 열기</a></li>
  <li style="${stp}"><b>③ 엔진 오른쪽 톱니바퀴(⚙) 누르기</b><br>Google 음성 서비스 이름 옆에 있는 ⚙ 아이콘이에요.<br><a style="${btn}" href="intent:#Intent;component=com.google.android.tts/com.google.android.apps.speech.tts.googletts.settings.AppSettingsActivity;end">Google 음성 서비스 설정 바로가기</a></li>
  <li style="${stp}"><b>④ "음성 데이터 설치" 누르기</b><br>화면에 "음성 데이터 설치"가 없으면 <b>"언어"</b> 또는 <b>"오프라인 음성 데이터"</b> 항목을 눌러 보세요.</li>
  <li style="${stp}"><b>⑤ "중국어(중국)" 또는 "Chinese (Mandarin)" 고르기</b><br>목록에서 <b>中文(普通话)</b>, <b>중국어(중국, 简体)</b> 중 하나를 눌러 오른쪽 <b>↓ 다운로드</b> 아이콘을 누르세요. 다운로드가 끝나면 체크 표시로 바뀌어요.</li>
  <li style="${stp}"><b>⑥ 다 끝나면</b><br>크롬(또는 쓰던 브라우저)을 최근 앱 목록에서 완전히 종료한 뒤 다시 열고, 아래 <b>소리 테스트</b>를 눌러 보세요.</li></ol>
  <button data-say="你好，欢迎学习汉语。" style="${btn};border:0;cursor:pointer;margin-top:8px">▶ 소리 테스트 (你好)</button>
  <p style="margin:8px 0 0;font-size:.82rem;color:var(--muted)">기기 설정을 앱이 대신 열거나 설치해 줄 수는 없어요. 바로가기 버튼을 눌러도 아무 반응이 없으면 폰이 막은 것이니 위 메뉴를 직접 따라가 주세요.</p>`;
  else if(ios)h+='<p><b>아이폰·아이패드</b></p><ol style="margin:8px 0;padding-left:20px"><li>설정 → 손쉬운 사용 → 말하는 콘텐츠 → 음성</li><li>중국어 → Ting-Ting(또는 Li-mu) 선택</li><li>다운로드 아이콘을 눌러 설치</li></ol>';
  else if(win)h+=`<p><b>윈도우</b></p><a style="${btn}" href="ms-settings:speech">음성 설정 열기</a><ol style="margin:8px 0;padding-left:20px"><li>설정 → 시간 및 언어 → 언어 및 지역 → 언어 추가 → 中文(简体)</li><li>설치 옵션에서 "텍스트 음성 변환"(음성) 체크</li><li>설치 후 브라우저를 다시 시작</li></ol><p style="font-size:.85rem;color:var(--muted)">크롬은 시스템 음성이 없어도 온라인 음성으로 재생을 시도해요. 엣지는 "Microsoft Huihui" 등 중국어 음성을 쓸 수 있어요.</p>`;
  else if(mac)h+='<p><b>맥</b></p><ol style="margin:8px 0;padding-left:20px"><li>시스템 설정 → 손쉬운 사용 → 말하기 콘텐츠</li><li>시스템 음성 → 관리… → 중국어(Tingting 등) 다운로드</li></ol>';
  else h+='<p>기기 설정의 언어·음성(텍스트 음성 변환) 항목에서 중국어(简体) 음성을 설치해 주세요.</p>';
  h+='<form method="dialog" style="text-align:right;margin-top:8px"><button style="padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700">닫기</button></form>';
  d.innerHTML=h;document.body.appendChild(d);try{d.showModal()}catch(e){d.setAttribute('open','')}}
document.addEventListener('click',e=>{if(e.target.closest('[data-help]'))showHelp()});

function chip(x){const d=MAP.get(x.c);
  return `<button class="chip${S.learned.has(x.c)?' done':''}" data-go="${x.c}"><span class="cc">${x.c}</span><span class="ct"><span class="cp">${pyH(d.py)}</span><span class="cm">${d.mean}</span><span class="cw">${x.why}</span></span></button>`}
function tile(c){const d=MAP.get(c),L=S.learned.has(c);
  return `<button class="tile${L?' done':''}" data-go="${c}">${L?'<span class="ck">익힘</span>':''}<span class="tc">${c}</span><span class="tp">${pyH(d.py)}</span><span class="tm">${d.mean}</span></button>`}

function trailH(){return `<div class="trail" aria-label="지금까지 이어 온 글자"><span class="lab">꼬리</span>${S.trail.map((c,i)=>`${i?'<span class="ar" aria-hidden="true">›</span>':''}<button class="tr" data-tr="${i}"${c===S.cur?' aria-current="true"':''}>${c}</button>`).join('')}${S.trail.length>1?'<button class="clr" data-act="clear">꼬리 지우기</button>':''}</div>`}

function study(){
  const d=MAP.get(S.cur),n=nbrs(S.cur),L=S.learned.has(S.cur);
  const clk=t=>[...t].map(c=>c===S.cur?`<mark>${c}</mark>`:MAP.has(c)?`<button data-say="${c}" aria-label="${c} 듣기">${c}</button>`:c).join('');
  const wl=t=>{const o=[...t].filter(c=>c!==S.cur&&MAP.has(c)).map(c=>`<button data-go="${c}" aria-label="${c} 글자로 이동">${pyH(MAP.get(c).py)}</button>`).join('');return o?`<div class="wl">글자로 이동 ›${o}</div>`:''};
  const words=d.words.map(w=>`<div class="wd"><div class="wz" lang="zh-CN">${clk(w.w)}<button class="say" data-say="${w.w}">듣기</button></div><div class="wp">${pyH(w.py)}</div><div class="wm">${w.m}</div>${wl(w.w)}</div>`).join('');
  const rels=REL.map(([k,t,s,col])=>n[k].length?`<section class="rel" style="--rc:${col}"><h3>${t} <span class="tag">${n[k].length}</span></h3><p>${s}</p><div class="chips">${n[k].map(chip).join('')}</div></section>`:'').join('');
  return `${trailH()}
  <article class="study">
    <div><div class="plate"><div class="plate-in"><div class="big" lang="zh-CN">${d.ch}</div></div><div class="plate-foot">${d.trad&&d.trad!==d.ch?'번체 '+d.trad:'번체도 같은 글자'} · ${d.cat}</div></div></div>
    <div>
      <div class="py">${pyH(d.py)}</div>
      <div class="meta"><div><b>한국 한자음</b>${d.kr}</div><div class="mean"><b>뜻</b>${d.mean}</div></div>
      ${d.tip?`<p class="tip">${d.tip}</p>`:''}
      <div class="acts"><button class="btn say" data-say="${d.ch}">글자 듣기</button><button class="btn${L?' on':''}" data-act="learn" aria-pressed="${L}">${L?'익힘 완료':'익혔어요'}</button><button class="btn pri" data-act="next">이어서 한 글자 더</button></div>
    </div>
  </article>
  <div class="box"><h2>이 글자가 쓰인 단어 (밑줄 글자를 누르면 그 글자로 이어져요)</h2>${words}</div>
  <div class="box"><h2>예문</h2><div class="sent" lang="zh-CN">${clk(d.ex.z)}<button class="say" data-say="${d.ex.z}">듣기</button></div><div class="sp">${d.ex.py}</div><div class="sk">${d.ex.k}</div></div>
  ${rels}`}

function groups(){
  const sec=(type,title,desc)=>{const l=GR.filter(x=>x.type===type);
    return `<h2 style="margin:22px 0 2px;font-size:1.15rem">${title}</h2><p class="gn">${desc}</p>`+l.map(x=>`<section class="grp"><div class="gt">${x.title}<span class="tag">${x.chars.length}자</span></div><p class="gn">${x.note}</p><div class="grid">${x.chars.map(tile).join('')}</div></section>`).join('')};
  return sec('shape','모양이 닮은 글자 묶음','헷갈리기 쉬운 글자를 한자리에 모았어요. 글자를 누르면 이어 배우기로 넘어가요.')+sec('pair','짝꿍 · 함께 나오는 글자 묶음','반대말이나 간판·신문에서 자주 붙어 다니는 말이에요.')}

function matches(d){
  if(S.cat!=='전체'&&d.cat!==S.cat)return false;
  if(S.onlyNew&&S.learned.has(d.ch))return false;
  const q=S.q.trim().toLowerCase();if(!q)return true;
  return d.ch.includes(q)||base(d.py).includes(q)||d.kr.includes(q)||d.mean.toLowerCase().includes(q)||(d.trad&&d.trad.includes(q))||d.words.some(w=>w.w.includes(q)||w.m.includes(q))}
function gridH(){const l=D.filter(matches);return l.length?l.map(d=>tile(d.ch)).join(''):'<p class="hint">조건에 맞는 글자가 없어요.</p>'}
function list(){
  const cats=['전체',...new Set(D.map(d=>d.cat))];
  return `<div class="row"><input type="search" id="q" placeholder="글자, 병음(예: men), 한글 뜻으로 찾기" value="${S.q.replace(/"/g,'&quot;')}" aria-label="글자 찾기"></div>
  <div class="row">${cats.map(c=>`<button class="fb" data-cat="${c}" aria-pressed="${S.cat===c}">${c}</button>`).join('')}<button class="fb" data-act="onlynew" aria-pressed="${S.onlyNew}">아직 안 익힌 것만</button></div>
  <div class="grid" id="grid">${gridH()}</div>`}

function newQ(){
  const pool=S.pool==='learned'&&S.learned.size>=4?D.filter(d=>S.learned.has(d.ch)):D;
  const t=pool[Math.floor(Math.random()*pool.length)],key=S.mode==='mean'?'mean':'py';
  const wrong=[];
  for(const c of shuffle(allN(t.ch))){const v=MAP.get(c)[key];if(v!==t[key]&&!wrong.includes(v))wrong.push(v);if(wrong.length>=3)break}
  for(const x of shuffle(D)){if(wrong.length>=3)break;if(x[key]!==t[key]&&!wrong.includes(x[key]))wrong.push(x[key])}
  return {t,key,opts:shuffle([t[key],...wrong]),pick:null}}
function quiz(){
  if(!S.quiz)S.quiz=newQ();
  const Q=S.quiz,done=Q.pick!==null,ok=done&&Q.opts[Q.pick]===Q.t[Q.key];
  const canL=S.learned.size>=4;
  return `<div class="row"><button class="fb" data-mode="mean" aria-pressed="${S.mode==='mean'}">뜻 맞히기</button><button class="fb" data-mode="py" aria-pressed="${S.mode==='py'}">병음·성조 맞히기</button>
  <button class="fb" data-pool="all" aria-pressed="${S.pool==='all'}">전체 글자</button><button class="fb" data-pool="learned" aria-pressed="${S.pool==='learned'}"${canL?'':' disabled'}>${canL?'익힌 글자만':'익힌 글자 4개부터'}</button>
  <span class="score">맞힌 문제 ${S.score.ok} / ${S.score.n}</span></div>
  <div class="qbig" lang="zh-CN">${Q.t.ch}</div>
  <p style="margin:0 0 10px;font-weight:700">${S.mode==='mean'?'이 글자의 뜻은?':'이 글자의 병음(성조 포함)은?'}</p>
  <div class="opts">${Q.opts.map((o,i)=>`<button class="opt${done?(o===Q.t[Q.key]?' right':i===Q.pick?' wrong':''):''}" data-opt="${i}"${done?' disabled':''}>${o}</button>`).join('')}</div>
  ${done?`<p class="fb2">${ok?'정답이에요!':'아쉬워요. 정답은 “'+Q.t[Q.key]+'”'}</p><div class="acts"><button class="btn pri" data-act="qnext">다음 문제</button><button class="btn" data-go="${Q.t.ch}">이 글자 이어 배우기</button></div>`:''}
  <p class="hint">오답 보기는 이 글자와 모양·소리가 비슷한 글자에서 골라서, 헷갈리는 글자를 구분하는 연습이 돼요.</p>`}

const TABS=[['study','이어 배우기'],['groups','묶음 모아보기'],['list','전체 글자'],['quiz','퀴즈']];
function render(){
  $('#tabs').innerHTML=TABS.map(([k,t])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${t}</button>`).join('');
  const n=S.learned.size;
  $('#prog').innerHTML=`${n} / ${D.length}자 익힘<div class="bar"><i style="width:${Math.round(n/D.length*100)}%"></i></div>`;
  $('#app').innerHTML=S.tab==='study'?study():S.tab==='groups'?groups():S.tab==='list'?list():quiz();
  const q=$('#q');if(q)q.addEventListener('input',()=>{S.q=q.value;$('#grid').innerHTML=gridH()});
  const t=$('.trail');if(t)t.scrollLeft=t.scrollWidth}
function top(){try{$('#tabs').scrollIntoView({block:'start'})}catch(e){}}

function peek(w){const d=MAP.get(w);if(!d)return;
  let k=document.getElementById('peek');if(k)k.remove();
  k=document.createElement('dialog');k.id='peek';
  k.style.cssText='border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(420px,92vw);padding:18px;font:inherit;line-height:1.5';
  k.innerHTML=`<div style="display:flex;gap:14px;align-items:center"><button data-say="${d.ch}" aria-label="${d.ch} 듣기" style="flex:none;background:var(--sign);color:#fff;border:0;border-radius:12px;padding:10px 14px;font:900 2.4rem/1.1 var(--f-han)">${d.ch}</button><div style="min-width:0"><button data-go="${d.ch}" aria-label="${d.ch} 글자로 이동" style="background:none;border:0;border-bottom:2px dotted var(--sign);padding:0;font:600 1.15rem var(--f-py);color:inherit;cursor:pointer;text-align:left">${pyH(d.py)}</button><div style="font-size:.78rem;color:var(--muted);margin-top:2px">병음을 누르면 이 글자로 이동</div></div></div>
  <p style="margin:12px 0 2px;font-size:1.1rem;font-weight:700">${d.mean}</p><p style="margin:0;color:var(--muted);font-size:.85rem">${d.cat||''}</p>
  <p style="margin:8px 0 0;font-size:.88rem;background:var(--soft);border-radius:8px;padding:6px 10px">한국 한자음 <b>${d.kr}</b></p>
  <p lang="zh-CN" style="margin:12px 0 0;font:500 1.15rem/1.6 var(--f-han)">${d.ex.z}</p><p style="margin:0;font-size:.85rem;color:var(--muted)">${d.ex.py}</p><p style="margin:0;font-size:.9rem">${d.ex.k}</p>
  <form method="dialog" style="text-align:right;margin-top:10px"><button style="padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700">닫기</button></form>`;
  k.addEventListener('click',ev=>{if(ev.target===k)k.close()});
  document.body.appendChild(k);try{k.showModal()}catch(e){k.setAttribute('open','')}}
function closePeek(){const k=document.getElementById('peek');if(k&&k.open)k.close()}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const D2=b.dataset;
  if(D2.tab){S.tab=D2.tab;render();return}
  if(D2.say){say(D2.say);return}
  if(D2.go&&e.target.closest('.cc,.tc')){say(D2.go);return}
  if(D2.go&&b.matches('.chip,.tile')){peek(D2.go);return}
  if(D2.go){closePeek();go(D2.go);S.tab='study';render();top();return}
  if(D2.tr!==undefined){const i=+D2.tr;S.cur=S.trail[i];S.trail=S.trail.slice(0,i+1);save();render();return}
  if(D2.cat){S.cat=D2.cat;render();return}
  if(D2.mode){S.mode=D2.mode;S.quiz=null;render();return}
  if(D2.pool){S.pool=D2.pool;S.quiz=null;render();return}
  if(D2.opt!==undefined){const Q=S.quiz;if(Q.pick!==null)return;Q.pick=+D2.opt;S.score.n++;if(Q.opts[Q.pick]===Q.t[Q.key])S.score.ok++;render();return}
  const a=D2.act;if(!a)return;
  if(a==='learn'){S.learned.has(S.cur)?S.learned.delete(S.cur):S.learned.add(S.cur);save();render()}
  else if(a==='next'){go(pickNext());render();top()}
  else if(a==='clear'){S.trail=[S.cur];render()}
  else if(a==='onlynew'){S.onlyNew=!S.onlyNew;render()}
  else if(a==='qnext'){S.quiz=newQ();render()}
});
render();
})();

</script></body></html>
